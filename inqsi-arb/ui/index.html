<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Inqsi ARB</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#fff}
body{margin:0}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.top h1{margin:0 16px 0 0;font-size:24px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px}.field input,.field select{padding:9px;border:1px solid #ccc;border-radius:8px;background:#fff}button{padding:10px 14px;border-radius:8px;border:1px solid #111;background:#111;color:white;font-weight:700;cursor:pointer}.status{margin:14px 0;padding:12px;border:1px solid #ddd;border-radius:10px}.grid{display:grid;gap:10px}.card{border:1px solid #ddd;border-radius:12px;padding:14px}.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.muted{color:#666;font-size:12px}.good{font-weight:800}.warn{font-weight:700}.legs{display:grid;gap:7px;margin-top:10px}.leg{padding:9px;background:#f6f6f6;border-radius:8px}.pill{display:inline-block;padding:4px 8px;border:1px solid #ccc;border-radius:999px;font-size:11px;margin-right:6px}details{margin-top:8px}pre{white-space:pre-wrap;font-size:11px;overflow:auto}.empty{padding:30px;text-align:center;border:1px dashed #bbb;border-radius:12px}
.books{width:100%;margin-top:12px;border:1px solid #eee;border-radius:10px;padding:10px}.bookgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.book{display:flex;gap:6px;align-items:center;font-size:12px;margin:3px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Inqsi ARB</h1>
    <label class="field">Sport<input id="sport" value="baseball_mlb" /></label>
    <label class="field">Markets<input id="markets" value="h2h,spreads,totals" /></label>
    <label class="field">Bankroll<input id="bankroll" type="number" min="1" value="1000" /></label>
    <button id="scan">Scan</button>
  </div>
  <div class="books">
    <div class="muted" id="bookHint">All sportsbooks</div>
    <div id="bookList" class="bookgrid"><div class="muted">Loading sportsbooks…</div></div>
  </div>
  <div class="status" id="status">Ready. Pick the sportsbooks you want to see, or leave them empty for every book on the board.</div>
  <div class="grid" id="results"></div>
</div>
<script>
const qs=new URLSearchParams(location.search);const api=(qs.get('api')||'').replace(/\/$/,'');
const KIND={us_licensed:'US sportsbooks',offshore:'Offshore',dfs:'DFS',exchange:'Exchanges',international:'International'};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[m]));
function selectedBooks(){return [...document.querySelectorAll('input[name=book]:checked')].map(i=>i.value)}
function persistBooks(){const selected=selectedBooks();localStorage.setItem('inqsi-arb-books',JSON.stringify(selected));$('bookHint').textContent=selected.length?selected.length+' sportsbooks selected':'All sportsbooks'}
async function loadBooks(){if(!api){$('bookList').innerHTML='<div class="muted">Missing ?api= embed parameter.</div>';return}try{const r=await fetch(`${api}/v1/arb/books`);const j=await r.json();const saved=new Set(JSON.parse(localStorage.getItem('inqsi-arb-books')||'[]'));const groups={};(j.books||[]).forEach(b=>{(groups[b.kind||'unknown']=groups[b.kind||'unknown']||[]).push(b)});const order=['us_licensed','offshore','dfs','exchange','international'];$('bookList').innerHTML=order.filter(k=>groups[k]).map(k=>`<div><div class="muted">${esc(KIND[k]||k)}</div>${groups[k].map(b=>`<label class="book"><input type="checkbox" name="book" value="${esc(b.key)}"${saved.has(b.key)?' checked':''}><span>${esc(b.title)}</span></label>`).join('')}</div>`).join('');$('bookList').querySelectorAll('input').forEach(i=>i.addEventListener('change',persistBooks));persistBooks()}catch(e){$('bookList').innerHTML='<div class="muted">Book list unavailable.</div>'}}
function card(x){const verified=(x.validation?.rules_status||'').toLowerCase()==='compatible'&&x.arb;const middle=x.opportunity_type==='middle'||(x.kind||'').includes('middle');return `<div class="card"><div class="row"><div><div class="good">${esc(x.event)}</div><div class="muted">${esc(x.market)} · ${esc(x.commence_time||'')}</div></div><div><span class="pill">${verified?'VERIFIED':(middle?(x.kind==='free_middle'?'FREE MIDDLE':'MIDDLE'):'DETECTED')}</span><b>${Number(x.margin_pct||x.gap||0).toFixed(2)}${middle?' gap':'%'}</b></div></div><div class="legs">${(x.legs||[]).map(l=>`<div class="leg"><b>${esc(l.outcome)}</b> · ${esc(l.book)} · ${esc(l.american??l.decimal)} <span class="muted">source ${esc(l.last_update||'unknown')}</span></div>`).join('')}</div><details><summary>Evidence</summary><pre>${esc(JSON.stringify(x,null,2))}</pre></details></div>`}
async function scan(){if(!api){$('status').textContent='Missing ?api=https://.../Prod embed parameter.';return}$('status').textContent='Scanning…';$('results').innerHTML='';const selected=selectedBooks();const p=new URLSearchParams({sport:$('sport').value,markets:$('markets').value,bankroll:$('bankroll').value});if(selected.length)p.set('books',selected.join(','));try{const r=await fetch(`${api}/v1/arb/scan?${p}`);const j=await r.json();const hits=j.hits||[];const held=(j.detected_unverified||[]).concat((j.rejected||[]).filter(x=>x.math_arb));const middles=j.middles||[];$('status').textContent=`${j.n_arbs||0} verified · ${j.n_held_unverified??held.length} held back · ${j.n_middles??middles.length} middles · ${j.n_exchange_pending||0} exchange pending · ${j.n_markets||0} markets · ${selected.length?selected.length+' sportsbooks':'all sportsbooks'}`;$('results').innerHTML=(hits.length||held.length||middles.length)?hits.map(card).join('')+held.map(card).join('')+middles.map(card).join(''):'<div class="empty">No mathematical arbitrage or middle opportunities across the selected sport and markets.</div>'}catch(e){$('status').textContent='Data unavailable: '+e.message}}
$('scan').addEventListener('click',scan);loadBooks();
</script>
</body>
</html>
