AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Inqsi ARB v3 - isolated provider-discovered arbitrage API
Parameters:
  OddsApiKey:
    Type: String
    NoEcho: true
  ArbRegions:
    Type: String
    Default: us,us2,us_dfs,us_ex,uk,eu,ca,fr,se,fi,au
  ArbOpportunitySmsEndpoint:
    Type: String
    Default: '+15859573962'
    Description: E.164 SMS endpoint for immediate ARB opportunity alerts
  ArbSendSmsTest:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Globals:
  Function:
    Runtime: python3.11
    Timeout: 120
    MemorySize: 512
    Environment:
      Variables:
        ODDS_API_KEY: !Ref OddsApiKey
        ARB_REGIONS: !Ref ArbRegions
        ARB_US_REGIONS: us,us2
        ARB_DEFAULT_JURISDICTION: '*'
        ARB_MAX_EVENT_MARKET_EVENTS: '40'
        ARB_MAX_MARKETS_PER_EVENT: '250'
        ARB_MAX_SPORTS_PER_ALL_SCAN: '100'
        ARB_COLLECT_MARKETS: 'h2h,spreads,totals'
        # Keep stored snapshots eligible for the default book-first scan. An
        # explicit deployment override can still narrow both via ArbRegions.
        ARB_COLLECT_REGIONS: !Ref ArbRegions
        ARB_COLLECT_MAX_SPORTS: '20'
        # Twenty active sports are collected every minute. Five minutes covers a
        # complete 100-sport rotation before provider/scheduling jitter.
        ARB_QUOTE_FRESH_SECONDS: '300'
        ARB_MAX_QUOTE_AGE_SECONDS: '300'
        ARB_AUDIT_TABLE: !Ref ArbAuditTable
        ARB_STATE_TABLE: !Ref ArbStateTable
        ARB_CONNECTIONS_TABLE: !Ref ArbConnectionsTable
        ARB_OPPORTUNITY_TOPIC_ARN: !Ref ArbOpportunityTopic
        ARB_OPPORTUNITY_ALERT_DEDUPE_SECONDS: '21600'
        ARB_WEBSOCKET_MANAGEMENT_ENDPOINT: !Sub 'https://${ArbWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod'
        ARB_WEBSOCKET_PUBLIC_URL: !Sub 'wss://${ArbWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod'
Conditions:
  SendArbSmsTest: !Equals [!Ref ArbSendSmsTest, 'true']
Resources:
  ArbAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  ArbStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  ArbConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ArbOpportunityTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Inqsi ARB Opportunities

  ArbOpportunitySmsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sms
      Endpoint: !Ref ArbOpportunitySmsEndpoint
      TopicArn: !Ref ArbOpportunityTopic

  ArbOpportunitySmsTestFunction:
    Type: AWS::Serverless::Function
    Condition: SendArbSmsTest
    Properties:
      InlineCode: |
        import boto3
        import os
        def handler(event, context):
            response = boto3.client('sns').publish(
                TopicArn=os.environ['TOPIC_ARN'],
                Subject='Inqsi ARB SMS test',
                Message='Inqis ARB notification test - SMS delivery path is working.'
            )
            return {'published': True, 'message_id': response.get('MessageId')}
      Handler: index.handler
      Environment:
        Variables:
          TOPIC_ARN: !Ref ArbOpportunityTopic
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ArbOpportunityTopic.TopicName

  ArbApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Inqsi-User-Id'"
        AllowOrigin: "'*'"

  ArbFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: release_identity.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArbAuditTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArbStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArbConnectionsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ArbOpportunityTopic.TopicName
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ArbWebSocketApi}/Prod/POST/@connections/*'
      Events:
        Health:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/health, Method: GET}
        Catalog:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/catalog, Method: GET}
        Markets:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/markets, Method: GET}
        Rules:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/rules, Method: GET}
        Books:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/books, Method: GET}
        Margins:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/margins, Method: ANY}
        CollectorStatus:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/collector, Method: GET}
        Packs:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/packs, Method: GET}
        PackState:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: '/v1/arb/packs/{state}', Method: GET}
        History:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/history, Method: GET}
        UI:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/ui, Method: GET}
        Scan:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/scan, Method: ANY}
        Constraints:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/constraints, Method: POST}
        Optimize:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/optimize, Method: POST}
        PositionsRoot:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/positions, Method: ANY}
        PositionsProxy:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: '/v1/arb/positions/{proxy+}', Method: ANY}
        LegacyScan:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/scan, Method: POST}

  ArbCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: collector.handler
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArbStateTable
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true
            Description: Rotate featured-market quote snapshots for the ARB desk

  ArbCalculatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: calculator_api.lambda_handler
      Events:
        ExchangeBackLay:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/exchange/back-lay, Method: POST}
        VerifyDiscreteStakes:
          Type: Api
          Properties: {RestApiId: !Ref ArbApi, Path: /v1/arb/stakes/verify, Method: POST}

  ArbWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: inqsi-arb-websocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'
  ArbWebSocketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: websocket.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArbConnectionsTable
  ArbWebSocketPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ArbWebSocketFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ArbWebSocketApi}/*'
  ArbWebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ArbWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ArbWebSocketFunction.Arn}/invocations'
  ArbWebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ArbWebSocketApi
      RouteKey: '$connect'
      AuthorizationType: NONE
      Target: !Join ['/', ['integrations', !Ref ArbWebSocketIntegration]]
  ArbWebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ArbWebSocketApi
      RouteKey: '$disconnect'
      AuthorizationType: NONE
      Target: !Join ['/', ['integrations', !Ref ArbWebSocketIntegration]]
  ArbWebSocketPingRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ArbWebSocketApi
      RouteKey: ping
      AuthorizationType: NONE
      Target: !Join ['/', ['integrations', !Ref ArbWebSocketIntegration]]
  ArbWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ArbWebSocketApi
      StageName: Prod
      AutoDeploy: true

Outputs:
  ArbApiUrl:
    Value: !Sub 'https://${ArbApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod'
  ArbHealthUrl:
    Value: !Sub 'https://${ArbApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/v1/arb/health'
  ArbUiUrl:
    Value: !Sub 'https://${ArbApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/v1/arb/ui'
  ArbWebSocketUrl:
    Value: !Sub 'wss://${ArbWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod'
  ArbCollectorFunctionName:
    Value: !Ref ArbCollectorFunction
  ArbOpportunityTopicArn:
    Value: !Ref ArbOpportunityTopic
  ArbBooksUrl:
    Value: !Sub 'https://${ArbApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/v1/arb/books'
