[project]
name = "soccer-predictor"
version = "0.2.0"
description = "Walk-forward soccer predictor. Isolated from parlay-platform live stacks."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
backtest = ["pyarrow>=14.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
