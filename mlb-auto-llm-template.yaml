AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Isolated autonomous MLB winner-prediction stack using MLB Stats API, The Odds API, Big Balls Sports Data Pro, Bedrock, and the deployed AWS MLB ensemble.

Parameters:
  OddsApiKey:
    Type: String
    NoEcho: true
  BbsApiKey:
    Type: String
    NoEcho: true
  MlbMlApiBaseUrl:
    Type: String
  TargetDailyAccuracy:
    Type: String
    Default: '0.80'
  CardLeadMinutesBeforeSecondGame:
    Type: Number
    Default: 45
  BedrockModels:
    Type: String
    Default: 'amazon.nova-micro-v1:0,amazon.nova-lite-v1:0,amazon.nova-pro-v1:0,amazon.nova-2-lite-v1:0,global.anthropic.claude-sonnet-4-20250514-v1:0,us.anthropic.claude-sonnet-4-20250514-v1:0,us.meta.llama3-3-70b-instruct-v1:0,meta.llama3-3-70b-instruct-v1:0,mistral.mistral-large-3-675b-instruct,mistral.ministral-3-3b-instruct,openai.gpt-5.6-sol,anthropic.claude-opus-4-8,anthropic.claude-opus-4-7,anthropic.claude-opus-4-6-v1,anthropic.claude-sonnet-4-6,us.amazon.nova-2-lite-v1:0,global.amazon.nova-2-lite-v1:0,us.amazon.nova-pro-v1:0,us.amazon.nova-lite-v1:0,us.amazon.nova-micro-v1:0'

Resources:
  MLBAutoLLMTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  MLBAutoLLMBbsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Big Balls Sports Data Pro API key for isolated MLB Auto LLM
      SecretString: !Ref BbsApiKey

  MLBAutoLLMFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: mlb_auto_llm/
      Handler: orchestrator_v3.lambda_handler
      Runtime: python3.11
      Timeout: 900
      MemorySize: 10240
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          MLB_AUTO_TABLE: !Ref MLBAutoLLMTable
          ODDS_API_KEY: !Ref OddsApiKey
          BBS_API_SECRET_ARN: !Ref MLBAutoLLMBbsSecret
          MLB_AUTO_TARGET_DAILY_ACCURACY: !Ref TargetDailyAccuracy
          MLB_AUTO_CARD_LEAD_MINUTES_BEFORE_SECOND_GAME: !Ref CardLeadMinutesBeforeSecondGame
          MLB_AUTO_FIRST_GAME_SAFETY_MINUTES: '10'
          MLB_AUTO_FINAL_COLLECTION_WINDOW_MINUTES: '20'
          MLB_AUTO_BEDROCK_MODELS: !Ref BedrockModels
          MLB_AUTO_ML_API_BASE_URL: !Ref MlbMlApiBaseUrl
          MLB_AUTO_ML_READ_STACK_NAME: parlay-platform-dev
          MLB_AUTO_ML_READ_LOGICAL_ID: MLBV3ReadFunction
          MLB_AUTO_BEDROCK_MANTLE_DISCOVERY: 'true'
          MLB_AUTO_BEDROCK_RUNTIME_DISCOVERY: 'true'
          MLB_AUTO_BEDROCK_RUNTIME_PROVIDERS: 'amazon,openai'
          MLB_AUTO_BEDROCK_ROUTE_CATALOG_LIMIT: '64'
          MLB_AUTO_BEDROCK_REGIONS: 'us-east-1,us-west-2,us-east-2'
          MLB_AUTO_BEDROCK_MAX_MODEL_ATTEMPTS: '80'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MLBAutoLLMTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref MLBAutoLLMBbsSecret
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:CallWithBearerToken
                - bedrock-mantle:CallWithBearerToken
                - bedrock-mantle:CreateInference
                - bedrock:ListFoundationModels
                - bedrock:ListInferenceProfiles
                - bedrock:GetInferenceProfile
              Resource: '*'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:parlay-platform-dev-MLBV3ReadFunction-*'
            - Effect: Allow
              Action:
                - cloudformation:DescribeStackResource
              Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/parlay-platform-dev/*'
            - Effect: Allow
              Action:
                - aws-marketplace:ViewSubscriptions
              Resource: '*'
      Events:
        AutonomousCycle:
          Type: Schedule
          Properties:
            Schedule: cron(2/5 * * * ? *)
            Enabled: true
            Input: '{"mode":"autonomous_cycle"}'
            RetryPolicy:
              MaximumEventAgeInSeconds: 600
              MaximumRetryAttempts: 1
        StatusApi:
          Type: Api
          Properties:
            Path: /v1/mlb-auto-llm/status
            Method: GET
        TodayApi:
          Type: Api
          Properties:
            Path: /v1/mlb-auto-llm/today
            Method: GET
        RunApi:
          Type: Api
          Properties:
            Path: /v1/mlb-auto-llm/run
            Method: POST

  MLBAutoLLMBedrockSmokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: mlb_auto_llm/
      Handler: ml_authority_smoke.lambda_handler
      Runtime: python3.11
      Timeout: 300
      MemorySize: 2048
      Environment:
        Variables:
          MLB_AUTO_BEDROCK_MODELS: !Ref BedrockModels
          MLB_AUTO_ML_API_BASE_URL: !Ref MlbMlApiBaseUrl
          MLB_AUTO_ML_READ_STACK_NAME: parlay-platform-dev
          MLB_AUTO_ML_READ_LOGICAL_ID: MLBV3ReadFunction
          MLB_AUTO_BEDROCK_MANTLE_DISCOVERY: 'true'
          MLB_AUTO_BEDROCK_RUNTIME_DISCOVERY: 'true'
          MLB_AUTO_BEDROCK_RUNTIME_PROVIDERS: 'amazon,openai'
          MLB_AUTO_BEDROCK_ROUTE_CATALOG_LIMIT: '64'
          MLB_AUTO_BEDROCK_REGIONS: 'us-east-1,us-west-2,us-east-2'
          MLB_AUTO_BEDROCK_MAX_MODEL_ATTEMPTS: '80'
          MLB_AUTO_BEDROCK_SMOKE_ROUTE_LIMIT: '16'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:CallWithBearerToken
                - bedrock-mantle:CallWithBearerToken
                - bedrock-mantle:CreateInference
                - bedrock:ListFoundationModels
                - bedrock:ListInferenceProfiles
                - bedrock:GetInferenceProfile
              Resource: '*'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:parlay-platform-dev-MLBV3ReadFunction-*'
            - Effect: Allow
              Action:
                - cloudformation:DescribeStackResource
              Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/parlay-platform-dev/*'
            - Effect: Allow
              Action:
                - aws-marketplace:ViewSubscriptions
              Resource: '*'

Outputs:
  MLBAutoLLMStatusUrl:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/v1/mlb-auto-llm/status'
  MLBAutoLLMTodayUrl:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/v1/mlb-auto-llm/today'
  MLBAutoLLMRunUrl:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/v1/mlb-auto-llm/run'
  MLBAutoLLMTableName:
    Value: !Ref MLBAutoLLMTable
