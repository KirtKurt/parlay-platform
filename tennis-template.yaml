AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Isolated autonomous Inqis tennis online-learning service
Parameters:
  OddsApiKey:
    Type: String
    NoEcho: true
Resources:
  TennisLearningTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: inqis_tennis_learning
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TennisLearningFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: tennis_learning/
      Handler: handler.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TENNIS_LEARNING_TABLE: !Ref TennisLearningTable
          TENNIS_MIN_TRAINING_SAMPLES: '100'
          TENNIS_LEARNING_RATE: '0.03'
          TENNIS_L2: '0.0005'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TennisLearningTable
      Events:
        Health:
          Type: Api
          Properties: {Path: /v1/tennis/learning/health, Method: GET}
        ModelStatus:
          Type: Api
          Properties: {Path: /v1/tennis/learning/model/status, Method: GET}
        Predict:
          Type: Api
          Properties: {Path: /v1/tennis/learning/predict, Method: POST}
        Settle:
          Type: Api
          Properties: {Path: /v1/tennis/learning/settle, Method: POST}
        TrainBatch:
          Type: Api
          Properties: {Path: /v1/tennis/learning/train/batch, Method: POST}

  TennisLivePipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: tennis_learning/
      Handler: live_pipeline.lambda_handler
      Runtime: python3.11
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          TENNIS_LEARNING_TABLE: !Ref TennisLearningTable
          TENNIS_MIN_TRAINING_SAMPLES: '100'
          TENNIS_LEARNING_RATE: '0.03'
          TENNIS_L2: '0.0005'
          ODDS_API_KEY: !Ref OddsApiKey
          TENNIS_ODDS_SPORT_KEY: tennis
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TennisLearningTable
      Events:
        # Stagger direct live work away from the autonomous controller so the
        # same Lambda is not invoked simultaneously by multiple EventBridge rules.
        CollectEvery15Minutes:
          Type: Schedule
          Properties:
            Schedule: 'cron(1,16,31,46 * * * ? *)'
            Input: '{"action":"collect"}'
        SettleEvery30Minutes:
          Type: Schedule
          Properties:
            Schedule: 'cron(6,36 * * * ? *)'
            Input: '{"action":"settle"}'
        CollectApi:
          Type: Api
          Properties: {Path: /v1/tennis/pipeline/collect, Method: POST}
        SettleApi:
          Type: Api
          Properties: {Path: /v1/tennis/pipeline/settle, Method: POST}

  TennisHistoricalBackfillFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: tennis_learning/
      Handler: bootstrap_handler.lambda_handler
      Runtime: python3.11
      Timeout: 900
      MemorySize: 2048
      Environment:
        Variables:
          TENNIS_LEARNING_TABLE: !Ref TennisLearningTable
          TENNIS_MIN_TRAINING_SAMPLES: '100'
          TENNIS_LEARNING_RATE: '0.03'
          TENNIS_L2: '0.0005'
          TENNIS_BACKFILL_BATCH_SIZE: '400'
          TENNIS_BACKFILL_START_YEAR: '2000'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TennisLearningTable
      Events:
        BackfillEveryHour:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: false
        BackfillApi:
          Type: Api
          Properties: {Path: /v1/tennis/learning/backfill, Method: POST}

  TennisAutonomousControllerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: tennis_learning/
      Handler: autonomous_controller.lambda_handler
      Runtime: python3.11
      Timeout: 900
      MemorySize: 2048
      Environment:
        Variables:
          TENNIS_LEARNING_TABLE: !Ref TennisLearningTable
          TENNIS_LIVE_FUNCTION: !Ref TennisLivePipelineFunction
          TENNIS_BACKFILL_FUNCTION: !Ref TennisHistoricalBackfillFunction
          TENNIS_HISTORICAL_ENABLED: 'false'
          TENNIS_HISTORICAL_REQUIRED: 'false'
          TENNIS_MIN_TRAINING_SAMPLES: '100'
          TENNIS_MIN_LIVE_AUDIT: '30'
          TENNIS_MIN_LIVE_ACCURACY: '0.55'
          TENNIS_MAX_LIVE_BRIER: '0.25'
          TENNIS_MAX_CONSECUTIVE_FAILURES: '3'
          TENNIS_INVOKE_MAX_ATTEMPTS: '4'
          TENNIS_INVOKE_BASE_DELAY_SECONDS: '2'
          TENNIS_INVOKE_MAX_DELAY_SECONDS: '20'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TennisLearningTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt TennisLivePipelineFunction.Arn
                - !GetAtt TennisHistoricalBackfillFunction.Arn
      Events:
        AutonomousCycleEvery15Minutes:
          Type: Schedule
          Properties:
            Schedule: 'cron(11,26,41,56 * * * ? *)'
            Input: '{"action":"autonomous_cycle"}'
            RetryPolicy:
              MaximumEventAgeInSeconds: 900
              MaximumRetryAttempts: 1
        AutonomousRunApi:
          Type: Api
          Properties: {Path: /v1/tennis/autonomy/run, Method: POST}
        AutonomousStatusApi:
          Type: Api
          Properties: {Path: /v1/tennis/autonomy/status, Method: GET}

Outputs:
  TennisLearningApi:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/v1/tennis/learning/health'
  TennisCollectApi:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/v1/tennis/pipeline/collect'
  TennisBackfillApi:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/v1/tennis/learning/backfill'
  TennisAutonomyStatusApi:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/v1/tennis/autonomy/status'
  TennisAutonomyRunApi:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/v1/tennis/autonomy/run'
