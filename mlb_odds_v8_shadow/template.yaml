AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Isolated MLB Odds V8 shadow collector with controlled 15-minute schedule

Parameters:
  OddsApiKey:
    Type: String
    NoEcho: true
  DeployGitSha:
    Type: String
    Default: unknown
  V8Enabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  V8ScheduleEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  V8FeaturedRegions:
    Type: String
    Default: us
  V8EventRegions:
    Type: String
    Default: us,us2
  V8MaxEventsPerCycle:
    Type: Number
    Default: 2
  V8MaxCreditsPerCycle:
    Type: Number
    Default: 100

Conditions:
  EnableV8Schedule: !Equals [!Ref V8ScheduleEnabled, 'true']

Resources:
  ShadowArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ShadowCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../hello_world/
      Handler: mlb_odds_v8_shadow_collector.lambda_handler
      Runtime: python3.11
      Architectures: [x86_64]
      Timeout: 300
      MemorySize: 1024
      Tracing: Active
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 300
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          ODDS_API_KEY: !Ref OddsApiKey
          MLB_V8_SHADOW_BUCKET: !Ref ShadowArtifactsBucket
          MLB_V8_ENABLED: !Ref V8Enabled
          MLB_V8_FEATURED_REGIONS: !Ref V8FeaturedRegions
          MLB_V8_EVENT_REGIONS: !Ref V8EventRegions
          MLB_V8_FEATURED_MARKETS: h2h,spreads,totals
          MLB_V8_FIRST_FIVE_ENABLED: 'true'
          MLB_V8_ALTERNATES_ENABLED: 'true'
          MLB_V8_TEAM_PROPS_ENABLED: 'true'
          MLB_V8_PLAYER_PROPS_ENABLED: 'false'
          MLB_V8_MAX_EVENT_MARKETS: '18'
          MLB_V8_MAX_EVENTS_PER_CYCLE: !Ref V8MaxEventsPerCycle
          MLB_V8_MAX_CREDITS_PER_CYCLE: !Ref V8MaxCreditsPerCycle
          MLB_V8_HTTP_TIMEOUT_SECONDS: '20'
          INQSI_DEPLOY_GIT_SHA: !Ref DeployGitSha
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${ShadowArtifactsBucket.Arn}/*'
            - Effect: Allow
              Action:
                - s3:GetBucketLocation
                - s3:ListBucket
              Resource: !GetAtt ShadowArtifactsBucket.Arn
      Events:
        ShadowEveryFifteenMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: Isolated V8 shadow-only market collection under a fixed per-cycle credit cap
            State: !If [EnableV8Schedule, ENABLED, DISABLED]
            Input: '{"mode":"scheduled_shadow"}'
            RetryPolicy:
              MaximumEventAgeInSeconds: 300
              MaximumRetryAttempts: 1

Outputs:
  ShadowCollectorFunctionName:
    Value: !Ref ShadowCollectorFunction
  ShadowCollectorFunctionArn:
    Value: !GetAtt ShadowCollectorFunction.Arn
  ShadowArtifactsBucketName:
    Value: !Ref ShadowArtifactsBucket
  ScheduleStatus:
    Value: !If [EnableV8Schedule, ENABLED_EVERY_15_MINUTES, DISABLED_MANUAL_CANARY_ONLY]
  Authority:
    Value: SHADOW_ONLY
