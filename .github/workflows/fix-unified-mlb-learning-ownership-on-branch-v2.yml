name: Diagnose August 25 official MLB finality read-only

"on":
  push:
    branches:
      - repair/unified-mlb-learning-single-owner-20260826
    paths:
      - '.github/workflows/fix-unified-mlb-learning-ownership-on-branch-v2.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-unified-mlb-aug25-finality-read-only
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact official schedule and identify non-final rows
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          slate = '2026-08-25'
          url = 'https://statsapi.mlb.com/api/v1/schedule?' + urllib.parse.urlencode({
              'sportId': '1',
              'startDate': slate,
              'endDate': slate,
              'hydrate': 'linescore',
          })
          request = urllib.request.Request(
              url,
              headers={
                  'accept': 'application/json',
                  'user-agent': 'inqsi-unified-mlb-finality-diagnostic/1.0',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode('utf-8'))
          games = [
              game
              for date_row in payload.get('dates') or []
              for game in date_row.get('games') or []
          ]
          rows = []
          for game in games:
              status = game.get('status') or {}
              teams = game.get('teams') or {}
              rows.append({
                  'gamePk': game.get('gamePk'),
                  'away': (((teams.get('away') or {}).get('team') or {}).get('name')),
                  'home': (((teams.get('home') or {}).get('team') or {}).get('name')),
                  'abstractGameState': status.get('abstractGameState'),
                  'codedGameState': status.get('codedGameState'),
                  'statusCode': status.get('statusCode'),
                  'detailedState': status.get('detailedState'),
                  'reason': status.get('reason'),
                  'awayScore': (teams.get('away') or {}).get('score'),
                  'homeScore': (teams.get('home') or {}).get('score'),
              })
          proof = {
              'proofType': 'UNIFIED_MLB_AUG25_OFFICIAL_FINALITY_READ_ONLY',
              'slateDateEt': slate,
              'sourceUrl': url,
              'totalGamesField': payload.get('totalGames'),
              'gameCount': len(rows),
              'finalCount': sum(str(row.get('abstractGameState') or '').upper() == 'FINAL' for row in rows),
              'nonFinalGames': [
                  row for row in rows
                  if str(row.get('abstractGameState') or '').upper() != 'FINAL'
              ],
              'allGames': rows,
              'directTableWrite': False,
              'immutablePredictionRewriteAllowed': False,
              'postStartPredictionCreationAllowed': False,
              'productionAuthorityChanged': False,
              'promotionAuthorityChanged': False,
              'otherSportChanged': False,
          }
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY
