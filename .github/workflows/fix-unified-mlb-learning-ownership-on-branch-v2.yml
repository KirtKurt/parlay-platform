name: Inspect August 25 unified MLB labels and locks read-only

"on":
  push:
    branches:
      - repair/unified-mlb-learning-single-owner-20260826
    paths:
      - '.github/workflows/fix-unified-mlb-learning-ownership-on-branch-v2.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-unified-mlb-aug25-materialization-read-only
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Count canonical labels and immutable locks without mutation
        run: |
          set -euo pipefail
          SNAPSHOTS="$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id SnapshotsTable \
            --region us-east-1 \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          OUTCOMES="$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id OutcomesTable \
            --region us-east-1 \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          test -n "$SNAPSHOTS" && test "$SNAPSHOTS" != None
          test -n "$OUTCOMES" && test "$OUTCOMES" != None
          aws dynamodb query \
            --table-name "$SNAPSHOTS" \
            --consistent-read \
            --region us-east-1 \
            --key-condition-expression 'PK = :pk AND begins_with(SK, :sk)' \
            --expression-attribute-values '{":pk":{"S":"GAME_WINNERS#mlb#2026-08-25"},":sk":{"S":"LOCKED#GAME#"}}' \
            --projection-expression 'PK,SK' \
            --output json > /tmp/locks.json
          aws dynamodb query \
            --table-name "$OUTCOMES" \
            --consistent-read \
            --region us-east-1 \
            --key-condition-expression 'PK = :pk AND begins_with(SK, :sk)' \
            --expression-attribute-values '{":pk":{"S":"MLB_CANONICAL_FINAL_LABEL#2026-08-25"},":sk":{"S":"GAME_PK#"}}' \
            --projection-expression 'PK,SK,record_type' \
            --output json > /tmp/labels.json
          python - <<'PY'
          import json
          from pathlib import Path

          locks = json.loads(Path('/tmp/locks.json').read_text())
          labels = json.loads(Path('/tmp/labels.json').read_text())
          lock_keys = sorted(
              (item.get('SK') or {}).get('S')
              for item in locks.get('Items') or []
          )
          label_keys = sorted(
              (item.get('SK') or {}).get('S')
              for item in labels.get('Items') or []
          )
          proof = {
              'proofType': 'UNIFIED_MLB_AUG25_MATERIALIZATION_READ_ONLY',
              'slateDateEt': '2026-08-25',
              'canonicalImmutableLockCount': int(locks.get('Count') or 0),
              'canonicalFinalLabelCount': int(labels.get('Count') or 0),
              'lockKeys': lock_keys,
              'labelKeys': label_keys,
              'readyForWholeSlateFinalization': (
                  int(locks.get('Count') or 0) == 15
                  and int(labels.get('Count') or 0) == 15
              ),
              'directTableWrite': False,
              'immutablePredictionRewriteAllowed': False,
              'postStartPredictionCreationAllowed': False,
              'productionAuthorityChanged': False,
              'promotionAuthorityChanged': False,
              'otherSportChanged': False,
          }
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY
