name: Fix unified MLB learning ownership on branch v2

"on":
  push:
    branches:
      - repair/unified-mlb-learning-single-owner-20260826
    paths:
      - '.github/workflows/fix-unified-mlb-learning-ownership-on-branch-v2.yml'

permissions:
  contents: write

concurrency:
  group: fix-unified-mlb-learning-ownership-on-branch-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/unified-mlb-learning-single-owner-20260826
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic single-owner migration
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_unified_mlb_learning_single_owner_patch.py
          python scripts/apply_unified_mlb_learning_single_owner_patch.py

      - name: Verify unified MLB ownership and existing safeguards
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9'
          python -m py_compile \
            scripts/stabilize_mlb_deploy_source.py \
            scripts/verify_mlb_workflow_authority.py \
            scripts/verify_unified_mlb_learning_ownership.py \
            tests/unit/test_mlb_workflow_authority.py \
            tests/unit/test_unified_mlb_learning_ownership.py
          python scripts/stabilize_mlb_deploy_source.py
          python scripts/verify_mlb_workflow_authority.py
          python scripts/verify_unified_mlb_learning_ownership.py
          python scripts/verify_mlb_schedule_invariants.py
          python -m pytest -q \
            tests/unit/test_mlb_workflow_authority.py \
            tests/unit/test_unified_mlb_learning_ownership.py \
            tests/unit/test_mlb_trainer_invoke_retry.py \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_mlb_ml_aws_training_v1.py
          git diff --check

      - name: Commit only the verified permanent repair
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/fix-unified-mlb-learning-ownership-on-branch.yml \
            .github/workflows/fix-unified-mlb-learning-ownership-on-branch-v2.yml \
            scripts/apply_unified_mlb_learning_single_owner_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix unified MLB learning single-owner orchestration [skip ci]'
          git push origin HEAD:repair/unified-mlb-learning-single-owner-20260826
