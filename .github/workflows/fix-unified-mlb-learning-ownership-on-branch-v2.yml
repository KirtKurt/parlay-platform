name: Verify deployed unified MLB table wiring read-only

"on":
  push:
    branches:
      - repair/unified-mlb-learning-single-owner-20260826
    paths:
      - '.github/workflows/fix-unified-mlb-learning-ownership-on-branch-v2.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-unified-mlb-table-wiring-read-only
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Compare trainer environment with canonical table resources
        run: |
          set -euo pipefail
          TRAINER="$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id MLBMLTrainingFunction \
            --region us-east-1 \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          aws lambda get-function-configuration \
            --function-name "$TRAINER" \
            --region us-east-1 \
            --query 'Environment.Variables.{SNAPSHOTS_TABLE:SNAPSHOTS_TABLE,OUTCOMES_TABLE:OUTCOMES_TABLE,PREDICTIONS_TABLE:PREDICTIONS_TABLE}' \
            --output json > /tmp/trainer-tables.json
          for logical in SnapshotsTable OutcomesTable PredictionsTable; do
            aws cloudformation describe-stack-resource \
              --stack-name parlay-platform-dev \
              --logical-resource-id "$logical" \
              --region us-east-1 \
              --query 'StackResourceDetail.PhysicalResourceId' \
              --output text > "/tmp/${logical}.txt"
          done
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          trainer = json.loads(Path('/tmp/trainer-tables.json').read_text())
          physical = {
              'SNAPSHOTS_TABLE': Path('/tmp/SnapshotsTable.txt').read_text().strip(),
              'OUTCOMES_TABLE': Path('/tmp/OutcomesTable.txt').read_text().strip(),
              'PREDICTIONS_TABLE': Path('/tmp/PredictionsTable.txt').read_text().strip(),
          }

          def query_count(table, pk, sk_prefix):
              command = [
                  'aws', 'dynamodb', 'query',
                  '--table-name', table,
                  '--consistent-read',
                  '--region', 'us-east-1',
                  '--key-condition-expression', 'PK = :pk AND begins_with(SK, :sk)',
                  '--expression-attribute-values', json.dumps({
                      ':pk': {'S': pk},
                      ':sk': {'S': sk_prefix},
                  }),
                  '--select', 'COUNT',
                  '--output', 'json',
              ]
              value = json.loads(subprocess.check_output(command, text=True))
              return int(value.get('Count') or 0)

          dates = ['2026-08-03', '2026-08-24', '2026-08-25']
          lock_counts = {
              date: query_count(
                  trainer['SNAPSHOTS_TABLE'],
                  f'GAME_WINNERS#mlb#{date}',
                  'LOCKED#GAME#',
              )
              for date in dates
          }
          label_counts = {
              date: query_count(
                  trainer['OUTCOMES_TABLE'],
                  f'MLB_CANONICAL_FINAL_LABEL#{date}',
                  'GAME_PK#',
              )
              for date in dates
          }
          proof = {
              'proofType': 'UNIFIED_MLB_DEPLOYED_TABLE_WIRING_READ_ONLY',
              'trainerTables': trainer,
              'cloudFormationTables': physical,
              'tableWiringMatches': trainer == physical,
              'canonicalLockCounts': lock_counts,
              'canonicalFinalLabelCounts': label_counts,
              'knownAdmittedReferenceCountsMatch': (
                  lock_counts['2026-08-03'] == 8
                  and label_counts['2026-08-03'] == 8
                  and lock_counts['2026-08-24'] == 10
                  and label_counts['2026-08-24'] == 10
              ),
              'august25Ready': (
                  lock_counts['2026-08-25'] == 15
                  and label_counts['2026-08-25'] == 15
              ),
              'directTableWrite': False,
              'immutablePredictionRewriteAllowed': False,
              'postStartPredictionCreationAllowed': False,
              'productionAuthorityChanged': False,
              'promotionAuthorityChanged': False,
              'otherSportChanged': False,
          }
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY
