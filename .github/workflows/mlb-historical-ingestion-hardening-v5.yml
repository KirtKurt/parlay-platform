name: MLB Historical Ingestion Hardening V5

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-ingestion-hardening-v5.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mlb-historical-optimizer-hardening-v5
  cancel-in-progress: false

jobs:
  repair-test-deploy-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Apply direct resilient-ingestion patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('hello_world/mlb_historical_optimizer_handler.py')
          text = path.read_text()
          text = text.replace(
              'VERSION = "MLB-HISTORICAL-OPTIMIZER-AWS-v1.6-complete-ledger-fresh-audit-append-only-authority"',
              'VERSION = "MLB-HISTORICAL-OPTIMIZER-AWS-v1.7-resilient-ingestion-state-machine"',
          )

          anchor = '    value.setdefault("evaluatedAuditWindows", [])\n'
          additions = (
              '    value.setdefault("evaluatedAuditWindows", [])\n'
              '    value.setdefault("slotStatusCounts", {"VALID": 0, "STALE": 0, "MALFORMED": 0, "MISSING": 0, "FUTURE_TIMESTAMP": 0, "OTHER_INVALID": 0})\n'
              '    value.setdefault("rejectedSlateCount", 0)\n'
              '    value.setdefault("lastProgressAtUtc", None)\n'
              '    value.setdefault("lastProgressCursor", None)\n'
              '    value.setdefault("stalledInvocationCount", 0)\n'
              '    value.setdefault("assemblyState", "IDLE")\n'
              '    value.setdefault("deployedGitSha", os.environ.get("DEPLOY_GIT_SHA", "unknown"))\n'
          )
          if 'value.setdefault("slotStatusCounts"' not in text:
              if anchor not in text:
                  raise SystemExit('migration anchor missing')
              text = text.replace(anchor, additions, 1)

          start = text.index('def _complete_slate(')
          end = text.index('\n\ndef _backfill(', start)
          replacement = '''def _classify_snapshot_error(exc: Exception) -> str:
    message = str(exc).lower()
    if "too stale" in message:
        return "STALE"
    if "future" in message or "later than the requested" in message:
        return "FUTURE_TIMESTAMP"
    if "missing" in message or "no such key" in message or "not found" in message:
        return "MISSING"
    if "malformed" in message or "invalid" in message or "payload" in message or "timestamp" in message:
        return "MALFORMED"
    return "OTHER_INVALID"


def _record_slot_status(state: Dict[str, Any], day: str, requested: str, status: str, detail: str = "") -> None:
    counts = state.setdefault("slotStatusCounts", {})
    counts[status] = int(counts.get(status) or 0) + 1
    if status == "VALID":
        return
    skipped = state.setdefault("skippedHistoricalSlots", [])
    if any(
        isinstance(row, Mapping)
        and row.get("slateDateEt") == day
        and row.get("requestedAtUtc") == requested
        for row in skipped
    ):
        return
    skipped.append({
        "slateDateEt": day,
        "requestedAtUtc": requested,
        "status": status,
        "reason": detail[:500],
        "recordedAtUtc": _now_iso(),
    })


def _complete_slate(
    state: Dict[str, Any], day: str, finals: Mapping[str, Any], grid: optimizer.SnapshotGrid
) -> None:
    state["assemblyState"] = "ASSEMBLING"
    historical = []
    for requested in grid.timestamps_utc:
        try:
            raw, _ = _get_s3_json(_raw_key(day, requested))
            payload = raw.get("payload") if isinstance(raw, Mapping) and "payload" in raw else raw
            optimizer.normalize_historical_snapshot(payload, requested)
        except Exception as exc:
            status = _classify_snapshot_error(exc)
            _record_slot_status(state, day, requested, status, f"{type(exc).__name__}:{exc}")
            continue
        _record_slot_status(state, day, requested, "VALID")
        historical.append({"requestedAtUtc": requested, "payload": payload})

    if not historical:
        state["assemblyState"] = "REJECTED"
        state["rejectedSlateCount"] = int(state.get("rejectedSlateCount") or 0) + 1
        _advance_after_rejection(state, day, "no_valid_historical_snapshots")
        return

    try:
        dataset = optimizer.build_slate_dataset(day, finals.get("games") or [], historical, grid)
    except Exception as exc:
        state["assemblyState"] = "REJECTED"
        state["rejectedSlateCount"] = int(state.get("rejectedSlateCount") or 0) + 1
        _advance_after_rejection(state, day, "slate_dataset_build_failed", {"error": f"{type(exc).__name__}:{exc}", "validSnapshotCount": len(historical)})
        return

    pointer = _put_immutable_json(_slate_key(day), dataset, record_type="mlb_historical_complete_slate")
    if dataset.get("completeSlate") is not True or float(dataset.get("exactSlateCoverage") or 0.0) < 1.0:
        state["assemblyState"] = "REJECTED"
        state["rejectedSlateCount"] = int(state.get("rejectedSlateCount") or 0) + 1
        _advance_after_rejection(state, day, "incomplete_full_slate_dataset", {
            "officialGameCount": dataset.get("officialGameCount"),
            "eligibleGameCount": dataset.get("eligibleGameCount"),
            "exactSlateCoverage": dataset.get("exactSlateCoverage"),
            "validSnapshotCount": len(historical),
            "artifact": pointer,
        })
        return

    state.setdefault("completedSlates", []).append({
        "slateDateEt": day,
        "officialGameCount": dataset["officialGameCount"],
        "eligibleGameCount": dataset["eligibleGameCount"],
        "fingerprint": dataset["fingerprint"],
        "artifact": pointer,
    })
    state["eligibleGameCount"] = int(state.get("eligibleGameCount") or 0) + int(dataset["eligibleGameCount"])
    state["completeSlateCount"] = int(state.get("completeSlateCount") or 0) + 1
    state["currentDate"] = _increment_day(day)
    state["currentSlotIndex"] = 0
    state["assemblyState"] = "COMPLETED"
    state["lastProgressAtUtc"] = _now_iso()
    state["lastProgressCursor"] = f"{state['currentDate']}#0"
    state["stalledInvocationCount"] = 0
    state["lastError"] = None
    if int(state["eligibleGameCount"]) >= int(state.get("targetSettledGames") or TARGET_GAMES):
        state["phase"] = "OPTIMIZING"
        state["dataCollectionCompletedAtUtc"] = _now_iso()
'''
          text = text[:start] + replacement + text[end:]

          old = '''        if slot_index >= len(grid.timestamps_utc):
            _complete_slate(state, day, finals, grid)
            state["lastCompletedFinalsArtifact"] = finals_pointer
'''
          new = '''        if slot_index >= len(grid.timestamps_utc):
            prior_cursor = f"{state.get('currentDate')}#{state.get('currentSlotIndex')}"
            state["assemblyState"] = "ASSEMBLING"
            try:
                _complete_slate(state, day, finals, grid)
            except Exception as exc:
                state["assemblyState"] = "REJECTED"
                state["rejectedSlateCount"] = int(state.get("rejectedSlateCount") or 0) + 1
                _advance_after_rejection(state, day, "unexpected_complete_slate_failure", {"error": f"{type(exc).__name__}:{exc}"})
            state["lastCompletedFinalsArtifact"] = finals_pointer
            new_cursor = f"{state.get('currentDate')}#{state.get('currentSlotIndex')}"
            if new_cursor == prior_cursor:
                state["stalledInvocationCount"] = int(state.get("stalledInvocationCount") or 0) + 1
            else:
                state["lastProgressAtUtc"] = _now_iso()
                state["lastProgressCursor"] = new_cursor
                state["stalledInvocationCount"] = 0
'''
          if old not in text:
              raise SystemExit('backfill completion anchor missing')
          text = text.replace(old, new, 1)

          status_anchor = '''    return {
        "ok": True,
        "version": VERSION,
        "state": state,
'''
          status_replacement = '''    lease = _get_item(LEASE_SK)
    return {
        "ok": True,
        "version": VERSION,
        "deployedGitSha": os.environ.get("DEPLOY_GIT_SHA", "unknown"),
        "lease": lease,
        "ingestionHealth": {
            "assemblyState": (state or {}).get("assemblyState"),
            "slotStatusCounts": (state or {}).get("slotStatusCounts"),
            "rejectedSlateCount": (state or {}).get("rejectedSlateCount"),
            "lastProgressAtUtc": (state or {}).get("lastProgressAtUtc"),
            "lastProgressCursor": (state or {}).get("lastProgressCursor"),
            "stalledInvocationCount": (state or {}).get("stalledInvocationCount"),
        },
        "state": state,
'''
          if '"ingestionHealth"' not in text:
              if status_anchor not in text:
                  raise SystemExit('status anchor missing')
              text = text.replace(status_anchor, status_replacement, 1)

          path.write_text(text)
          PY
          python -m py_compile hello_world/mlb_historical_optimizer_handler.py
          grep -Fq 'resilient-ingestion-state-machine' hello_world/mlb_historical_optimizer_handler.py
          grep -Fq 'unexpected_complete_slate_failure' hello_world/mlb_historical_optimizer_handler.py
          grep -Fq 'ingestionHealth' hello_world/mlb_historical_optimizer_handler.py

      - name: Add focused regression tests
        run: |
          cat > tests/unit/test_mlb_historical_ingestion_hardening_v5.py <<'PY'
          import mlb_historical_optimizer_handler as handler

          def test_classification():
              assert handler._classify_snapshot_error(Exception('too stale')) == 'STALE'
              assert handler._classify_snapshot_error(Exception('later than the requested timestamp')) == 'FUTURE_TIMESTAMP'
              assert handler._classify_snapshot_error(Exception('NoSuchKey')) == 'MISSING'
              assert handler._classify_snapshot_error(Exception('malformed payload')) == 'MALFORMED'

          def test_migration_fields():
              state = handler._migrate_state({})
              assert state['assemblyState'] == 'IDLE'
              assert state['stalledInvocationCount'] == 0
              assert 'VALID' in state['slotStatusCounts']
          PY

      - name: Validate source and contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'cfn-lint>=1,<2'
          PYTHONPATH=hello_world python -m pytest -q tests/unit/test_mlb_historical_ingestion_hardening_v5.py tests/unit/test_mlb_historical_daily_optimizer_v1.py tests/unit/test_mlb_historical_optimizer_handler.py tests/unit/test_mlb_historical_policy_v1.py
          sam validate --lint --template-file mlb_historical_optimizer/template.yaml

      - name: Commit hardened handler
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hello_world/mlb_historical_optimizer_handler.py tests/unit/test_mlb_historical_ingestion_hardening_v5.py
          git commit -m 'fix: make MLB historical ingestion resilient [deploy-mlb-historical-v1.7]'
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify isolation from live MLB stack
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          HIST_FN=$(aws cloudformation describe-stacks --stack-name parlay-platform-mlb-historical-optimizer --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" --output text)
          test -n "$HIST_FN"
          PROD_STATUS=$(aws cloudformation describe-stacks --stack-name parlay-platform-dev --region "$AWS_REGION_VALUE" --query 'Stacks[0].StackStatus' --output text)
          case "$PROD_STATUS" in CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;; *) echo "production stack unstable: $PROD_STATUS"; exit 1;; esac

      - name: Build and deploy only historical optimizer
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          rm -rf .aws-sam-historical-v5
          sam build --no-cached --build-dir .aws-sam-historical-v5 --template-file mlb_historical_optimizer/template.yaml
          sam deploy --template-file .aws-sam-historical-v5/template.yaml --stack-name parlay-platform-mlb-historical-optimizer --region "$AWS_REGION_VALUE" --capabilities CAPABILITY_IAM --resolve-s3 --force-upload --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "OddsApiKey=${ODDS_API_KEY_VALUE}" 'TargetSnapshotsTable=parlay_platform_snapshots' 'HistoricalStartDate=2025-04-01' 'HistoricalEndDate=2025-08-31' 'HistoricalTargetGames=1600' 'HistoricalMaxCredits=120000' 'HistoricalRequestsPerRun=100' 'HistoricalMaxCandidates=25000' 'HistoricalMaxOptimizationRounds=6' 'HistoricalFreshAuditIncrementGames=250' "DeployGitSha=${DEPLOY_SHA}"

      - name: Invoke and publish proof
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          HIST_FN=$(aws cloudformation describe-stacks --stack-name parlay-platform-mlb-historical-optimizer --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" --output text)
          aws lambda invoke --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload '{"mode":"orchestrate","run":"resilient_ingestion_v5"}' /tmp/orchestrate.json >/tmp/meta.json
          aws lambda invoke --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload '{"mode":"status","run":"resilient_ingestion_v5_status"}' /tmp/status.json >/tmp/status-meta.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.load(open('/tmp/status.json'))
          state=value.get('state') or {}
          proof={
              'deployedGitSha': value.get('deployedGitSha'),
              'version': value.get('version'),
              'phase': state.get('phase'),
              'currentDate': state.get('currentDate'),
              'currentSlotIndex': state.get('currentSlotIndex'),
              'networkRequestCount': state.get('networkRequestCount'),
              'eligibleGameCount': state.get('eligibleGameCount'),
              'completeSlateCount': state.get('completeSlateCount'),
              'optimizationRound': state.get('optimizationRound'),
              'lastError': state.get('lastError'),
              'ingestionHealth': value.get('ingestionHealth'),
              'lease': value.get('lease'),
          }
          assert proof['version'] == 'MLB-HISTORICAL-OPTIMIZER-AWS-v1.7-resilient-ingestion-state-machine', proof
          assert 'too stale for a 15-minute grid' not in str(proof.get('lastError') or ''), proof
          Path('docs/runtime').mkdir(parents=True, exist_ok=True)
          json.dump(proof, open('docs/runtime/mlb-historical-ingestion-v5-proof.json','w'), indent=2, default=str)
          print(json.dumps(proof, indent=2, default=str))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/mlb-historical-ingestion-v5-proof.json
          git commit -m 'chore: publish MLB historical ingestion v5 proof'
          git push origin HEAD:main
