name: Deploy Inqsi Arb
run-name: Deploy Inqsi Arb ${{ inputs.arb_merge_sha || github.sha }}
on:
  pull_request:
    paths:
      - 'inqsi-arb/**'
      - '.github/workflows/inqsi-arb-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'inqsi-arb/**'
      - '.github/workflows/inqsi-arb-deploy.yml'
  workflow_dispatch:
    inputs:
      arb_merge_sha:
        description: Exact autonomous ARB merge commit that must be present in main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: inqsi-arb-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind supervisor dispatch to the requested ARB merge
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ARB_MERGE_SHA: ${{ inputs.arb_merge_sha }}
        run: |
          set -euo pipefail
          [[ "$ARB_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = 'refs/heads/main'
          git merge-base --is-ancestor "$ARB_MERGE_SHA" HEAD
          RELEVANT=$(git diff --name-only "$ARB_MERGE_SHA" HEAD -- inqsi-arb '.github/workflows/inqsi-arb-*' arb_supervisor .github/workflows/arb-supervisor-validate.yml)
          test -z "$RELEVANT"
          echo "supervisor dispatch contains exact ARB merge $ARB_MERGE_SHA with no later ARB/supervisor drift"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install --quiet "pytest>=8,<9" boto3
      - name: Test deterministic engine and v3 integration
        run: python -m pytest -q inqsi-arb/tests
      - uses: aws-actions/setup-sam@v2
      - name: Stamp clean Python release identity
        run: python inqsi-arb/ops/release_proof.py stamp
      - name: Validate and build
        run: |
          sam validate --lint --template-file inqsi-arb/template.yaml
          sam build --no-cached --template-file inqsi-arb/template.yaml

  deploy-verify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - name: Stamp clean Python release identity
        run: python inqsi-arb/ops/release_proof.py stamp
      - name: Build
        run: sam build --no-cached --template-file inqsi-arb/template.yaml
      - name: Deploy isolated arb stack
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          test -n "${ODDS_API_KEY_VALUE:-}"
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name inqsi-arb-prod \
            --region "${{ secrets.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "OddsApiKey=${ODDS_API_KEY_VALUE}"
      - name: Verify live v3 health, rules, history, optimization, persistence, completion, UI and infrastructure
        run: |
          set -euo pipefail
          API_URL=$(aws cloudformation describe-stacks --stack-name inqsi-arb-prod --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='ArbApiUrl'].OutputValue" --output text)
          python inqsi-arb/ops/release_proof.py verify --api-url "$API_URL" --output arb-release-proof.json
          WS_URL=$(aws cloudformation describe-stacks --stack-name inqsi-arb-prod --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='ArbWebSocketUrl'].OutputValue" --output text)
          test -n "$API_URL" && test "$API_URL" != "None"
          test -n "$WS_URL" && test "$WS_URL" != "None"
          for resource in ArbAuditTable ArbStateTable ArbConnectionsTable ArbFunction ArbWebSocketFunction ArbWebSocketApi; do
            STATUS=$(aws cloudformation describe-stack-resource --stack-name inqsi-arb-prod --logical-resource-id "$resource" --region "${{ secrets.AWS_REGION }}" --query 'StackResourceDetail.ResourceStatus' --output text)
            test "$STATUS" = "CREATE_COMPLETE" -o "$STATUS" = "UPDATE_COMPLETE"
          done
          python - "$API_URL" "$WS_URL" <<'PY'
          import json, sys, time, urllib.error, urllib.request
          base=sys.argv[1].rstrip('/'); ws=sys.argv[2]

          def request(path, *, method='GET', payload=None, headers=None, attempts=12, timeout=30):
              url=base+path
              last=None
              body=None if payload is None else json.dumps(payload).encode()
              hdr={'accept':'application/json', **(headers or {})}
              if body is not None:
                  hdr['content-type']='application/json'
              for i in range(1, attempts+1):
                  try:
                      req=urllib.request.Request(url, data=body, headers=hdr, method=method)
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.status, r.headers, r.read()
                  except urllib.error.HTTPError as exc:
                      err=exc.read().decode('utf-8','replace')[:1000]
                      last=f'HTTP {exc.code}: {err}'
                  except Exception as exc:
                      last=f'{type(exc).__name__}: {exc}'
                  print(f'waiting for endpoint propagation {path} attempt={i}/{attempts} last={last}', flush=True)
                  if i < attempts:
                      time.sleep(min(5*i, 15))
              raise RuntimeError(f'{path} unavailable after {attempts} attempts: {last}')

          _,_,hb=request('/v1/arb/health')
          h=json.loads(hb)
          assert h['ok'] is True and h['version']=='INQSI-ARB-v3' and h['places_bets'] is False, h
          assert h['provider_key_present'] is True and h['audit_persistence'] is True, h
          assert h['automatic_market_discovery'] is True and h['websocket_push_configured'] is True, h
          assert h['websocket_public_url_present'] is True, h
          assert h['balance_aware_optimizer'] is True and h['two_leg_completion_assistant'] is True, h
          assert h['opportunity_history'] is True and h['rules_registry_entries'] >= 6, h

          _,_,rb=request('/v1/arb/rules')
          rules=json.loads(rb)
          assert rules['ok'] is True and rules['count'] >= 6, rules
          assert {'draftkings','fanduel'}.issubset({r['book'] for r in rules['rules']}), rules
          assert all(r.get('reviewed') and r.get('source','').startswith('https://') for r in rules['rules']), rules

          _,_,cb=request('/v1/arb/catalog')
          c=json.loads(cb)
          assert c['ok'] is True and c['n_sports'] > 0, c
          assert 'player_props' in c['market_families'] and 'futures' in c['market_families'], c

          _,_,history_b=request('/v1/arb/history?limit=5')
          history=json.loads(history_b)
          assert history['ok'] is True and history['kind']=='SCAN' and isinstance(history['history'], list), history

          _,_,constraint_b=request('/v1/arb/constraints', method='POST', payload={
              'legs':[{'book':'draftkings','stake':80,'limit':100}],
              'profiles':{'draftkings':{'balance':50,'max_stake':90}}
          })
          constraint=json.loads(constraint_b)
          assert constraint['ok'] is True and constraint['feasible'] is False, constraint

          _,_,opt_b=request('/v1/arb/optimize', method='POST', payload={
              'bankroll':100,
              'legs':[{'outcome':'A','book':'draftkings','decimal':2.2},{'outcome':'B','book':'fanduel','decimal':2.2}],
              'profiles':{'draftkings':{'balance':40},'fanduel':{'balance':100}}
          })
          opt=json.loads(opt_b)
          assert opt['ok'] is True and opt['places_bets'] is False, opt
          assert opt['constraint_bound'] is True and opt['guaranteed_profit'] > 0, opt

          verify_headers={'X-Inqsi-User-Id':'deploy-verifier'}
          _,_,pb=request('/v1/arb/positions', method='POST', headers=verify_headers, payload={
              'position_id':'ci-smoke', 'market_id':'ci-smoke-market', 'required_outcomes':['A','B']
          })
          p=json.loads(pb)
          assert p['ok'] is True and p['position']['position_id']=='ci-smoke', p
          _,_,leg_b=request('/v1/arb/positions/ci-smoke/legs', method='POST', headers=verify_headers, payload={
              'outcome':'A','book':'draftkings','stake':40,'decimal':2.2
          })
          leg=json.loads(leg_b)
          assert leg['ok'] is True and leg['position']['state']=='LEG_RECORDED', leg
          _,_,complete_b=request('/v1/arb/positions/ci-smoke/complete', method='POST', headers=verify_headers, payload={
              'candidate_quotes':[{'outcome':'B','book':'fanduel','decimal':2.2,'limit':100}],
              'profiles':{'fanduel':{'balance':100}}
          })
          complete=json.loads(complete_b)
          assert complete['ok'] is True and complete['places_bets'] is False, complete
          assert complete['n_feasible'] == 1 and complete['recommendations'][0]['guaranteed_profit'] > 0, complete
          _,_,pgb=request('/v1/arb/positions/ci-smoke', headers=verify_headers)
          pg=json.loads(pgb)
          assert pg['ok'] is True and pg['position']['market_id']=='ci-smoke-market', pg

          _,headers,htmlb=request('/v1/arb/ui')
          content_type=headers.get('content-type',''); html=htmlb.decode('utf-8','replace')
          assert 'text/html' in content_type and 'Inqsi ARB Console' in html
          assert ws.startswith('wss://') and ws in html, (ws, html[:500])
          print(json.dumps({
              'api_url':base, 'websocket_url':ws, 'health':h,
              'active_sports':c['n_sports'], 'reviewed_rules':rules['count'],
              'history_count':history['count'],
              'constraint_smoke':'pass', 'optimizer_smoke':'pass',
              'position_persistence_smoke':'pass', 'completion_assistant_smoke':'pass',
              'embedded_websocket_ui_smoke':'pass'
          }, indent=2))
          PY
      - name: Preserve release identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inqsi-arb-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: arb-release-proof.json
          if-no-files-found: warn
          retention-days: 30
