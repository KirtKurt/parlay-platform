name: MLB V7 Feature-Aware Activation Once

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v7-feature-aware-activation-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mlb-v7-feature-aware-activation-once
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  EXPECTED_DEPLOY_SHA: a00722dfa11bf0c6954c1a98b9bf594c5c628e7a
  REPORT_PATH: runtime_reports/mlb_v7_feature_aware_activation_latest.json

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Reconcile rematerialization with deployed V7 authority
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION_VALUE" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" \
            --output text)
          test -n "$FUNCTION_NAME" && test "$FUNCTION_NAME" != None
          aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION_VALUE" \
            --output json > /tmp/v7-feature-aware-lambda-config.json
          invoke() {
            local payload="$1" output="$2"
            aws lambda invoke \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION_VALUE" \
              --cli-read-timeout 900 \
              --cli-binary-format raw-in-base64-out \
              --payload "$payload" "$output" >/tmp/v7-feature-aware-invoke-meta.json
          }
          invoke '{"mode":"status","run":"v7_feature_aware_activation_before"}' /tmp/v7-feature-aware-before.json
          for attempt in 1 2 3; do
            invoke "{\"mode\":\"orchestrate\",\"run\":\"v7_feature_aware_activation_${attempt}\"}" "/tmp/v7-feature-aware-orchestrate-${attempt}.json"
            invoke '{"mode":"status","run":"v7_feature_aware_activation_check"}' /tmp/v7-feature-aware-after.json
            if python - <<'PY'
          import json
          value=json.load(open('/tmp/v7-feature-aware-after.json'))
          state=value.get('state') or {}
          complete=int(state.get('completeSlateCount') or 0)
          remat=int(state.get('featureRematerializedSlateCount') or 0)
          total=int(state.get('featureRematerializationTotalSlateCount') or 0)
          raise SystemExit(0 if complete > 0 and remat == complete and total == complete and state.get('featureRematerializationComplete') is True and not state.get('featureRematerializationErrors') and not state.get('lastError') else 1)
          PY
            then
              break
            fi
          done
          FUNCTION_NAME="$FUNCTION_NAME" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          before=json.load(open('/tmp/v7-feature-aware-before.json'))
          after=json.load(open('/tmp/v7-feature-aware-after.json'))
          config=json.load(open('/tmp/v7-feature-aware-lambda-config.json'))
          b=before.get('state') or {}
          a=after.get('state') or {}
          env=(config.get('Environment') or {}).get('Variables') or {}
          complete=int(a.get('completeSlateCount') or 0)
          remat=int(a.get('featureRematerializedSlateCount') or 0)
          total=int(a.get('featureRematerializationTotalSlateCount') or 0)
          checks={
              'statusOk':after.get('ok') is True,
              'deploySha':env.get('INQSI_DEPLOY_GIT_SHA') == os.environ['EXPECTED_DEPLOY_SHA'],
              'handler':config.get('Handler') == 'mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler',
              'completedSlateCountPositive':complete > 0,
              'rematerializedMatchesCompleted':remat == complete,
              'rematerializationTargetMatchesCompleted':total == complete,
              'rematerializationComplete':a.get('featureRematerializationComplete') is True,
              'rematerializationErrorsEmpty':not (a.get('featureRematerializationErrors') or []),
              'lastErrorEmpty':not a.get('lastError'),
          }
          report={
              'proofType':'MLB_V7_FEATURE_AWARE_ACTIVATION_V1',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'authority':'CANONICAL_V7_HISTORICAL_OPTIMIZER',
              'productionAuthorityChanged':False,
              'paidHistoricalCallsMade':0,
              'functionName':os.environ['FUNCTION_NAME'],
              'deployGitSha':env.get('INQSI_DEPLOY_GIT_SHA'),
              'before':{k:b.get(k) for k in ('phase','currentDate','currentSlotIndex','eligibleGameCount','completeSlateCount','featureRematerializedSlateCount','featureRematerializationTotalSlateCount','featureRematerializationComplete','featureRematerializationErrors','lastError')},
              'after':{k:a.get(k) for k in ('phase','currentDate','currentSlotIndex','eligibleGameCount','completeSlateCount','featureRematerializedSlateCount','featureRematerializationTotalSlateCount','featureRematerializationComplete','featureRematerializationErrors','lastError')},
              'checks':checks,
              'blockers':sorted(name for name, passed in checks.items() if not passed),
              'ok':all(checks.values()),
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Dispatch fresh feature-aware evaluations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          value=json.load(open(os.environ['REPORT_PATH']))
          assert value.get('ok') is True, value
          assert value.get('productionAuthorityChanged') is False, value
          assert int(value.get('paidHistoricalCallsMade') or 0) == 0, value
          PY
          for workflow in mlb-historical-supervised-v9-shadow.yml mlb-supervised-shadow-v2-recurring.yml; do
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref=main
          done

      - name: Publish activation proof and remove one-time workflow
        run: |
          set -euo pipefail
          cp "$REPORT_PATH" /tmp/mlb-v7-feature-aware-activation.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B v7-feature-aware-activation-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-v7-feature-aware-activation.json "$REPORT_PATH"
            rm -f .github/workflows/mlb-v7-feature-aware-activation-once.yml
            git add "$REPORT_PATH" .github/workflows/mlb-v7-feature-aware-activation-once.yml
            git commit -m 'Activate V7 feature-aware learning' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce activation proof
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ['REPORT_PATH']).read_text())
          assert value.get('ok') is True, value
          assert value.get('deployGitSha') == os.environ['EXPECTED_DEPLOY_SHA'], value
          assert value.get('productionAuthorityChanged') is False, value
          assert int(value.get('paidHistoricalCallsMade') or 0) == 0, value
          assert not value.get('blockers'), value
          checks=value.get('checks') or {}
          assert checks and all(checks.values()), value
          PY
