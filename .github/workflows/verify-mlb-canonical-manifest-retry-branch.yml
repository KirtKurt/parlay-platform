name: Verify MLB canonical manifest retry repair branch

"on":
  push:
    branches:
      - repair/mlb-canonical-manifest-retry-binding-20260826

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
      - name: Verify canonical manifest retry binding repair
        run: |
          set -euo pipefail
          python -m py_compile \
            hello_world/mlb_canonical_manifest_retry_binding_patch.py \
            hello_world/mlb_manual_pull_protected.py
          python -m pytest -q \
            tests/unit/test_mlb_canonical_manifest_retry_binding_patch.py \
            tests/unit/test_mlb_manual_pull_manifest.py \
            tests/unit/test_mlb_ingest_alarm_repair.py \
            tests/unit/test_mlb_scoring_runtime_capacity.py \
            tests/unit/test_mlb_ml_integrity_authorities.py
          git diff --check
