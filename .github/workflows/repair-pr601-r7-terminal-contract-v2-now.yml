name: Repair PR601 R7 terminal contract v2 now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pr601-r7-terminal-contract-v2-now.yml'

permissions:
  contents: write

concurrency:
  group: repair-pr601-r7-terminal-contract-v2-now
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "760c76327aa6a59c0b7c087b9a4c8509506c8beb"

      - name: Apply bounded MLB-only repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          prod_path = Path('hello_world/mlb_daily_per_game_lock_patch.py')
          test_path = Path('tests/unit/test_mlb_daily_per_game_lock.py')
          prod = prod_path.read_text()
          tests = test_path.read_text()

          helper = '''\n\ndef _candidate_snapshot_aliases(\n    game: Dict[str, Any],\n    scoring: Optional[Iterable[Dict[str, Any]]] = None,\n) -> List[str]:\n    """Return trusted immutable identities that may name this game.\n\n    The official Stats API game PK remains stable when a provider event ID\n    arrives later. Alias lookup is read-only discovery; downstream validation\n    still requires official-PK/team/time/source/fingerprint agreement.\n    """\n    aliases = {_raw_game_identity(game)}\n    official_pk = _official_game_pk(game)\n    if official_pk:\n        aliases.add(f"mlb_statsapi:{official_pk}")\n    for pull in scoring or []:\n        for candidate_game in pull.get("games") or []:\n            if not _same_game(game, candidate_game):\n                continue\n            aliases.add(_raw_game_identity(candidate_game))\n            candidate_pk = _official_game_pk(candidate_game)\n            if candidate_pk:\n                aliases.add(f"mlb_statsapi:{candidate_pk}")\n    return sorted(alias for alias in aliases if alias)\n'''
          marker = '\n\n_PREGAME_CANDIDATE_QUERY_PAGE_SIZE = 500'
          if '_candidate_snapshot_aliases(' not in prod:
              if prod.count(marker) != 1:
                  raise SystemExit('candidate alias insertion marker mismatch')
              prod = prod.replace(marker, helper + marker, 1)

          old_items = '''    aliases = {_raw_game_identity(game)}\n    for pull in scoring or []:\n        for candidate in pull.get("games") or []:\n            if _same_game(game, candidate):\n                aliases.add(_raw_game_identity(candidate))\n    bounded_aliases = sorted(alias for alias in aliases if alias)\n'''
          new_items = '''    bounded_aliases = _candidate_snapshot_aliases(game, scoring)\n'''
          if old_items in prod:
              prod = prod.replace(old_items, new_items, 1)
          elif new_items not in prod:
              raise SystemExit('candidate items alias block not found')

          old_last = '''    candidate_aliases = {_raw_game_identity(game)}\n    for pull in scoring:\n        for candidate_game in pull.get("games") or []:\n            if _same_game(game, candidate_game):\n                candidate_aliases.add(_raw_game_identity(candidate_game))\n'''
          new_last = '''    candidate_aliases = set(_candidate_snapshot_aliases(game, scoring))\n'''
          if old_last in prod:
              prod = prod.replace(old_last, new_last, 1)
          elif new_last not in prod:
              raise SystemExit('last-prelock alias block not found')

          official_helper = '''\n\ndef official_game(game_id: str, start: str, official_pk: str):\n    """Build one production-shaped row through exact-date MLB authority."""\n    provider = game(game_id, start)\n    raw_schedule = {\n        "totalGames": 1,\n        "dates": [{\n            "date": SLATE,\n            "games": [{\n                "gamePk": int(official_pk),\n                "gameDate": start,\n                "gameType": "R",\n                "gameNumber": 1,\n                "doubleHeader": "N",\n                "status": {"abstractGameState": "Preview"},\n                "teams": {\n                    "home": {"team": {"name": provider["home_team"]}},\n                    "away": {"team": {"name": provider["away_team"]}},\n                },\n            }],\n        }],\n    }\n    schedule = official_schedule.validate_exact_date_schedule(raw_schedule, SLATE)\n    rows, proof = official_schedule.reconcile_official_schedule(\n        schedule,\n        [{\n            "id": game_id,\n            "game_id": game_id,\n            "game_key": provider["game_key"],\n            "commence_time": start,\n            "home_team": provider["home_team"],\n            "away_team": provider["away_team"],\n            "bookmakers": [],\n        }],\n        observed_at_utc=start,\n    )\n    assert official_schedule.validate_authority_proof(proof, rows) == []\n    assert len(rows) == 1\n    row = rows[0]\n    row["books"] = copy.deepcopy(provider["books"])\n    return row\n'''
          game_marker = '\n\nG1 = game("g1", "2026-07-13T18:00:00+00:00")'
          if 'def official_game(' not in tests:
              if tests.count(game_marker) != 1:
                  raise SystemExit('official-game insertion marker mismatch')
              tests = tests.replace(game_marker, official_helper + game_marker, 1)

          def function_block(text: str, name: str):
              start = text.find(f'def {name}(')
              if start < 0:
                  raise SystemExit(f'missing test function: {name}')
              end = text.find('\ndef ', start + 1)
              if end < 0:
                  end = len(text)
              return start, end, text[start:end]

          qname = 'test_real_quarantine_writer_is_idempotent_and_recovery_strict'
          qs, qe, qb = function_block(tests, qname)
          old_target = '''    target = game(\n        (\n            "mlb_statsapi:991556"\n            if identity_binding_mode == "exact_identity"\n            else "provider-event-991556"\n        ),\n        "2026-07-13T18:00:00+00:00",\n    )\n    target.update(\n        {\n            "official_game_pk": "991556",\n            "official_commence_time": target["commence_time"],\n            "official_status": {"abstractGameState": "Preview"},\n        }\n    )\n'''
          new_target = '''    target = official_game(\n        (\n            "mlb_statsapi:991556"\n            if identity_binding_mode == "exact_identity"\n            else "provider-event-991556"\n        ),\n        "2026-07-13T18:00:00+00:00",\n        "991556",\n    )\n'''
          if old_target in qb:
              qb = qb.replace(old_target, new_target, 1)
          elif new_target not in qb:
              raise SystemExit('quarantine target fixture mismatch')
          tests = tests[:qs] + qb + tests[qe:]

          legacy = [
              'test_scheduled_terminal_no_prediction_slate_does_not_repeat_full_path',
              'test_missing_or_post_cutoff_candidate_records_terminal_no_prediction_status',
              'test_backdated_prediction_persisted_after_cutoff_is_not_authoritative',
          ]
          for name in legacy:
              fs, fe, fb = function_block(tests, name)
              if 'target = official_game(' not in fb:
                  first_nl = fb.find('\n')
                  fb = (fb[:first_nl + 1]
                        + '    target = official_game("g1", "2026-07-13T18:00:00+00:00", "991555")\n'
                        + fb[first_nl + 1:])
              fb = fb.replace('[G1]', '[target]')
              fb = fb.replace('module, G1,', 'module, target,')
              tests = tests[:fs] + fb + tests[fe:]

          prod_path.write_text(prod)
          test_path.write_text(tests)
          PY
          git diff --check
          git diff -- hello_world/mlb_daily_per_game_lock_patch.py tests/unit/test_mlb_daily_per_game_lock.py

      - name: Install verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'

      - name: Prove five formerly failing cases
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/unit/test_mlb_daily_per_game_lock.py::test_real_quarantine_writer_is_idempotent_and_recovery_strict \
            tests/unit/test_mlb_daily_per_game_lock.py::test_scheduled_terminal_no_prediction_slate_does_not_repeat_full_path \
            tests/unit/test_mlb_daily_per_game_lock.py::test_missing_or_post_cutoff_candidate_records_terminal_no_prediction_status \
            tests/unit/test_mlb_daily_per_game_lock.py::test_backdated_prediction_persisted_after_cutoff_is_not_authoritative

      - name: Run comprehensive MLB per-game-lock verifier
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_mlb_per_game_lock.py

      - name: Commit repaired PR branch only after all proofs pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hello_world/mlb_daily_per_game_lock_patch.py tests/unit/test_mlb_daily_per_game_lock.py
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Repair R7 prelock quarantine identity authority'
          git push origin HEAD:codex/mlb-valid-prelock-quarantine-v4-567

      - name: Remove one-shot repair workflow from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/r7-repair-cleanup-v2 origin/main
          cd /tmp/r7-repair-cleanup-v2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f .github/workflows/repair-pr601-r7-terminal-contract-v2-now.yml; then
            git rm .github/workflows/repair-pr601-r7-terminal-contract-v2-now.yml
            git commit -m 'Remove completed PR601 R7 terminal repair v2 [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 2))
            done
            exit 1
          fi