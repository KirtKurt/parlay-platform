name: Verify retired MLB settlement recovery alias

"on":
  workflow_dispatch:
    inputs:
      request_id:
        description: Audit identifier for this retired alias
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: unified-mlb-learning
  cancel-in-progress: false

jobs:
  verify-canonical-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove settlement recovery is owned by the unified workflow
        run: |
          set -euo pipefail
          test -f .github/workflows/unified-mlb-learning-recovery-once.yml
          grep -q "Reconcile protected prospective settlement backlog" \
            .github/workflows/unified-mlb-learning-recovery-once.yml
          grep -q "TARGET_SLATE_DATE: '2026-08-25'" \
            .github/workflows/unified-mlb-learning-recovery-once.yml
          grep -q "MIN_ACCEPTED_ROWS: '33'" \
            .github/workflows/unified-mlb-learning-recovery-once.yml
          echo 'AWS invocation: none'
          echo 'Canonical recovery owner: unified-mlb-learning-recovery-once.yml'
          echo 'Production authority change: none'
          echo 'Other sport change: none'
