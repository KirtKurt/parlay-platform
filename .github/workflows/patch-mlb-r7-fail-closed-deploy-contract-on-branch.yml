name: Patch MLB R7 fail-closed deploy contract on main

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-mlb-r7-fail-closed-deploy-contract-on-branch.yml'
      - 'scripts/patch_mlb_r7_deploy_contract.py'
      - 'scripts/verify_mlb_authority_response.py'
      - 'tests/unit/test_verify_mlb_authority_response.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-mlb-r7-fail-closed-deploy-contract-on-main
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch retired authority assertions
        run: python scripts/patch_mlb_r7_deploy_contract.py

      - name: Verify helper tests and workflow YAML
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest pyyaml
          python -m py_compile scripts/verify_mlb_authority_response.py
          python -m py_compile scripts/patch_mlb_r7_deploy_contract.py
          pytest -q tests/unit/test_verify_mlb_authority_response.py
          python -c "from pathlib import Path; import yaml; data=yaml.safe_load(Path('.github/workflows/deploy.yml').read_text()); assert isinstance(data, dict) and 'jobs' in data"

      - name: Commit repaired deploy contract
        run: |
          set -euo pipefail
          rm .github/workflows/patch-mlb-r7-fail-closed-deploy-contract-on-branch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy.yml .github/workflows/patch-mlb-r7-fail-closed-deploy-contract-on-branch.yml
          git commit -m 'Repair MLB deploy contract for fail-closed R7 authority'
          git pull --rebase origin main
          git push origin HEAD:main
