name: R7 exact-deploy v2 remediation once

"on":
  push:
    branches:
      - ops/r7-v2-remediation-orchestrator-20260829

permissions:
  actions: write
  contents: read

concurrency:
  group: r7-exact-deploy-v2-remediation-once
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Deploy exact main and dispatch protected v2 recovery
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const mainBefore = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main',
            });
            const pinnedMainSha = mainBefore.data.object.sha;
            core.notice(`Pinned main for exact deploy: ${pinnedMainSha}`);

            const beforeRuns = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              branch: 'main',
              event: 'workflow_dispatch',
              per_page: 30,
            });
            const existingRunIds = new Set(beforeRuns.data.workflow_runs.map((run) => run.id));

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });

            let deployRun = null;
            for (let attempt = 0; attempt < 120; attempt += 1) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'deploy.yml',
                branch: 'main',
                event: 'workflow_dispatch',
                per_page: 30,
              });
              deployRun = runs.data.workflow_runs.find((run) => (
                !existingRunIds.has(run.id)
                && run.head_sha === pinnedMainSha
              ));
              if (deployRun) break;
              await sleep(5000);
            }
            if (!deployRun) {
              core.setFailed('Exact main deploy run was not observed');
              return;
            }
            core.notice(`Observed exact deploy run ${deployRun.id}`);

            for (let attempt = 0; attempt < 900; attempt += 1) {
              const current = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: deployRun.id,
              });
              deployRun = current.data;
              if (deployRun.status === 'completed') break;
              await sleep(5000);
            }
            if (deployRun.status !== 'completed' || deployRun.conclusion !== 'success') {
              core.setFailed(`Exact deploy did not succeed: ${deployRun.status}/${deployRun.conclusion}`);
              return;
            }

            const mainAfter = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main',
            });
            if (mainAfter.data.object.sha !== pinnedMainSha) {
              core.setFailed(
                `Main advanced during deploy: ${pinnedMainSha} -> ${mainAfter.data.object.sha}`
              );
              return;
            }

            const requestId = [
              'r7-prelock-v2-remediation',
              String(context.runId),
              pinnedMainSha.slice(0, 12),
            ].join('-');
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'unified-mlb-learning-recovery-once.yml',
              ref: 'main',
              inputs: {
                request_id: requestId,
                requeue_prelock_candidate_review_after_installed_runtime_proof_v2: 'true',
              },
            });
            core.notice(
              `Dispatched protected R7 v2 remediation from exact deploy ${deployRun.id}`
            );
