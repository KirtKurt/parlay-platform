name: MLB Supervised Shadow V2 Compatibility

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mlb-supervised-shadow-v2-compatibility
  cancel-in-progress: false

jobs:
  delegate-to-v8-autonomous-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify controller contracts exist
        run: |
          set -euo pipefail
          python -m py_compile \
            hello_world/mlb_v8_autonomy_v1.py \
            scripts/run_mlb_v8_autonomous_training.py \
            scripts/run_mlb_v8_autonomous_controller.py
      - name: Dispatch the single V8 control plane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mlb-v8-autonomous-controller.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
