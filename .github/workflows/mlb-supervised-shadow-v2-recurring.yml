name: MLB Supervised Shadow V2 Recurring

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-supervised-shadow-v2-recurring.yml'
      - 'scripts/run_mlb_supervised_shadow_v2.py'
      - 'hello_world/mlb_no_bbd_context_bridge_v1.py'
      - 'hello_world/mlb_supervised_model_v2.py'
      - 'hello_world/mlb_supervised_daily_objective_v2_1.py'
      - 'hello_world/mlb_supervised_feature_boundaries_v2_4.py'
      - 'hello_world/mlb_supervised_feature_groups_v2_4.py'
      - 'hello_world/mlb_supervised_selection_guard_v2_6.py'
      - 'hello_world/mlb_v8_historical_bbs_overlay_v1.py'
      - 'hello_world/mlb_v8_historical_context_overlay_v1.py'
      - 'runtime_reports/mlb_v8_historical_context_backfill_latest.json'
      - 'tests/unit/test_mlb_no_bbd_context_bridge_v1.py'
      - 'tests/unit/test_run_mlb_supervised_shadow_v2_readiness.py'
      - 'tests/unit/test_publish_monotonic_json.py'

permissions:
  contents: write

concurrency:
  group: mlb-supervised-shadow-v2-recurring
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_supervised_shadow_v2_latest.json
  PYTHONPATH: .:hello_world:scripts
  BBS_API_DISABLED: 'true'
  MLB_V8_HISTORICAL_BBS_OVERLAY_ENABLED: 'true'
  MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'false'
  MLB_V8_HISTORICAL_BBS_TABLE: parlay_platform_snapshots
  MLB_V8_HISTORICAL_CONTEXT_OVERLAY_ENABLED: 'true'
  MLB_V8_HISTORICAL_CONTEXT_OVERLAY_REQUIRED: 'true'
  MLB_V8_HISTORICAL_CONTEXT_TABLE: parlay_platform_snapshots

jobs:
  retrain-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate provider-neutral V8 trainer
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'numpy>=1.26,<3' 'pytest>=8,<9'
          python -m py_compile \
            scripts/run_mlb_supervised_shadow_v2.py \
            scripts/publish_monotonic_json.py \
            hello_world/mlb_no_bbd_context_bridge_v1.py \
            hello_world/mlb_supervised_model_v2.py \
            hello_world/mlb_supervised_daily_objective_v2_1.py \
            hello_world/mlb_supervised_feature_boundaries_v2_4.py \
            hello_world/mlb_supervised_feature_groups_v2_4.py \
            hello_world/mlb_supervised_selection_guard_v2_6.py \
            hello_world/mlb_v8_historical_bbs_overlay_v1.py \
            hello_world/mlb_v8_historical_context_overlay_v1.py
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_no_bbd_context_bridge_v1.py \
            tests/unit/test_run_mlb_supervised_shadow_v2_readiness.py \
            tests/unit/test_publish_monotonic_json.py \
            tests/unit/test_mlb_supervised_daily_objective_v2_1.py \
            tests/unit/test_mlb_supervised_feature_boundaries_v2_4.py \
            tests/unit/test_mlb_supervised_feature_groups_v2_4.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_6.py \
            tests/unit/test_mlb_v8_historical_bbs_overlay_v1.py \
            tests/unit/test_mlb_v8_historical_context_overlay_v1.py

      - name: Refit and evaluate provider-neutral shadow challenger
        id: evaluation
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set +e
          mkdir -p runtime_reports
          rm -f "$REPORT_PATH"
          python scripts/run_mlb_supervised_shadow_v2.py \
            --region "$AWS_REGION_VALUE" \
            --stack-name "$STACK_NAME" \
            --table-name parlay_platform_snapshots \
            --output "$REPORT_PATH" \
            2>&1 | tee /tmp/mlb-supervised-shadow-v2.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure fresh durable V8 evidence
        if: always()
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          EVALUATION_EXIT_CODE: ${{ steps.evaluation.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-supervised-shadow-v2.log').read_text(errors='replace')[-12000:] if Path('/tmp/mlb-supervised-shadow-v2.log').exists() else ''
          report={
              'ok':False,
              'proofType':'MLB_SUPERVISED_SHADOW_AWS_EVALUATION',
              'authority':'SHADOW_ONLY','productionAuthorityChanged':False,
              'automaticWagerAllowed':False,
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),'runId':os.environ.get('GITHUB_RUN_ID'),
              'evaluationOutcome':os.environ.get('EVALUATION_OUTCOME'),
              'evaluationExitCode':os.environ.get('EVALUATION_EXIT_CODE'),
              'liveBbdApiAvailable':False,'liveBbdApiRequired':False,
              'errorLogTail':log,'blockers':['v8_recurring_training_execution_failed'],
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null
          cp "$REPORT_PATH" /tmp/mlb-supervised-shadow-v2.json

      - name: Verify fresh model and point-in-time context evidence
        if: steps.evaluation.outcome == 'success'
        run: |
          python - <<'PY'
          import json, os
          value=json.load(open('/tmp/mlb-supervised-shadow-v2.json'))
          model_digest=value.get('modelDigest') or ((value.get('model') or {}).get('modelDigest'))
          assert value.get('ok') is True, value
          assert value.get('sourceSha') == os.environ.get('GITHUB_SHA'), value
          assert str(value.get('runId')) == str(os.environ.get('GITHUB_RUN_ID')), value
          assert model_digest, value
          assert int(value.get('recordCountLoaded') or 0) > 0, value
          assert value.get('authority') == 'SHADOW_ONLY', value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('productionPromotionEligible') is False, value
          selection=value.get('selection') or {}
          assert selection.get('selectionUsedUntouchedAudit') is False, value
          prior=value.get('historicalBbsFundamentals') or {}
          assert prior.get('status') in {'APPLIED','MANIFEST_NOT_AVAILABLE','DISABLED'}, prior
          assert prior.get('productionAuthorityChanged') is False, prior
          context=value.get('historicalTargetGameContext') or {}
          assert context.get('status') == 'APPLIED', context
          assert int(context.get('appliedGameCount') or 0) > 0, context
          assert context.get('productionAuthorityChanged') is False, context
          assert context.get('selectionUsedOutcomes') is False, context
          assert context.get('targetGameOutcomeUsed') is False, context
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-supervised-shadow-v2-recurring-${{ github.run_id }}
          path: |
            /tmp/mlb-supervised-shadow-v2.json
            /tmp/mlb-supervised-shadow-v2.log
          retention-days: 90
          if-no-files-found: error

      - name: Publish latest supervised evidence monotonically
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-supervised-recurring-proof origin/main
            mkdir -p runtime_reports
            python scripts/publish_monotonic_json.py --candidate /tmp/mlb-supervised-shadow-v2.json --existing "$REPORT_PATH" --output "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish recurring MLB supervised shadow evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce successful recurring V8 learning execution
        if: always()
        run: |
          python - <<'PY'
          import json, os
          value=json.load(open('/tmp/mlb-supervised-shadow-v2.json'))
          model_digest=value.get('modelDigest') or ((value.get('model') or {}).get('modelDigest'))
          assert value.get('ok') is True, value
          assert value.get('sourceSha') == os.environ.get('GITHUB_SHA'), value
          assert str(value.get('runId')) == str(os.environ.get('GITHUB_RUN_ID')), value
          assert model_digest, value
          assert int(value.get('recordCountLoaded') or 0) > 0, value
          context=value.get('historicalTargetGameContext') or {}
          assert context.get('status') == 'APPLIED', context
          assert int(context.get('appliedGameCount') or 0) > 0, context
          assert value.get('productionAuthorityChanged') is False, value
          PY
