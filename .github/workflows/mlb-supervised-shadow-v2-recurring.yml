name: MLB Supervised Shadow V2 Recurring

"on":
  workflow_dispatch:
  schedule:
    - cron: '37 2/6 * * *'

permissions:
  contents: write

concurrency:
  group: mlb-supervised-shadow-v2-recurring
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_supervised_shadow_v2_latest.json
  EXPECTED_FEATURE_DATASET: MLB-HISTORICAL-FEATURE-DATASET-v8-supervised-trainable

jobs:
  retrain-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Verify current rematerialized V8-supervised state
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2'
          python - <<'PY'
          import json, os
          import boto3
          region=os.environ['AWS_REGION_VALUE']
          cf=boto3.client('cloudformation',region_name=region)
          lam=boto3.client('lambda',region_name=region)
          outputs={str(x.get('OutputKey')):str(x.get('OutputValue')) for x in (cf.describe_stacks(StackName=os.environ['STACK_NAME']).get('Stacks') or [])[0].get('Outputs') or []}
          function_name=outputs.get('HistoricalOptimizerFunctionName')
          if not function_name: raise RuntimeError('historical optimizer function missing')
          response=lam.invoke(FunctionName=function_name,InvocationType='RequestResponse',Payload=b'{"mode":"status","run":"supervised_v2_recurring_status"}')
          value=json.loads(response['Payload'].read().decode())
          state=value.get('state') or {}
          assert value.get('ok') is True, value
          assert state.get('featureDatasetVersion') == os.environ['EXPECTED_FEATURE_DATASET'], state
          assert state.get('featureRematerializationComplete') is True, state
          assert not state.get('featureRematerializationErrors'), state
          assert not state.get('lastError'), state
          PY
      - name: Refit and evaluate shadow challenger
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: hello_world
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          python scripts/run_mlb_supervised_shadow_v2.py \
            --region "$AWS_REGION_VALUE" \
            --stack-name "$STACK_NAME" \
            --table-name parlay_platform_snapshots \
            --output "$REPORT_PATH"
      - name: Enforce non-authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_supervised_shadow_v2_latest.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('authority') == 'SHADOW_ONLY', value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('productionPromotionEligible') is False, value
          assert (value.get('selection') or {}).get('selectionUsedUntouchedAudit') is False, value
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-supervised-shadow-v2-recurring-${{ github.run_id }}
          path: runtime_reports/mlb_supervised_shadow_v2_latest.json
          retention-days: 90
      - name: Publish latest supervised evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$REPORT_PATH" /tmp/mlb-supervised-shadow-v2.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-supervised-recurring-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-supervised-shadow-v2.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish recurring MLB supervised shadow evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
