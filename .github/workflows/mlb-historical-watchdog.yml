name: MLB Historical Ingestion Watchdog

"on":
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-watchdog.yml'
      - 'scripts/run_mlb_historical_watchdog.py'
      - 'tests/unit/test_run_mlb_historical_watchdog.py'
      - 'hello_world/mlb_historical_optimizer_entrypoint.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'hello_world/mlb_historical_state_integrity_v1.py'
      - 'hello_world/mlb_historical_incremental_range_extension_v1.py'
      - 'mlb_historical_optimizer/template.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: hello_world:scripts
  OPTIMIZER_STACK: parlay-platform-mlb-historical-optimizer
  EXPECTED_HANDLER: mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler
  EXPECTED_MAX_CREDITS: '300000'
  WATCHDOG_REPORT: /tmp/mlb-historical-watchdog-report.json

concurrency:
  group: mlb-historical-ingestion-watchdog
  cancel-in-progress: false

jobs:
  resume-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate watchdog contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile scripts/run_mlb_historical_watchdog.py
          python -m pytest -q tests/unit/test_run_mlb_historical_watchdog.py

      - name: Verify and advance canonical historical runtime
        run: |
          set -euo pipefail
          python scripts/run_mlb_historical_watchdog.py \
            --region "${{ secrets.AWS_REGION }}" \
            --stack-name "$OPTIMIZER_STACK" \
            --expected-handler "$EXPECTED_HANDLER" \
            --expected-max-credits "$EXPECTED_MAX_CREDITS" \
            --template mlb_historical_optimizer/template.yaml \
            --published-status docs/runtime/mlb-historical-live-status.json \
            --output "$WATCHDOG_REPORT"
          python -m json.tool "$WATCHDOG_REPORT" >/dev/null
          python - <<'PY'
          import json, os
          value=json.load(open(os.environ['WATCHDOG_REPORT']))
          assert value.get('ok') is True, value
          assert value.get('configuredCeilingIsNotSettledAuthority') is True, value
          assert value.get('automaticWagerAllowed') is False, value
          assert value.get('productionAuthorityChanged') is False, value
          transition=value.get('transition') or {}
          if transition.get('phase') == 'WAITING_FOR_SETTLED_HORIZON':
              assert transition.get('waitingHealthy') is True, transition
              proof=value.get('repeatedWaitProof') or {}
              if proof.get('horizonAdvancedDuringVerification') is not True:
                  assert proof.get('idempotent') is True, proof
          PY

      - name: Upload exact watchdog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-historical-watchdog-${{ github.run_id }}
          path: /tmp/mlb-historical-watchdog-report.json
          if-no-files-found: warn
          retention-days: 30
