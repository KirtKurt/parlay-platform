name: Read-only R7 cooperative queue probe 33084527256
run-name: Read-only R7 queue probe ${{ github.run_id }}

"on":
  push:
    branches:
      - codex/r7-queue-readonly-probe-33084527256-a1
    paths:
      - .github/workflows/r7-queue-readonly-probe-33084527256.yml

permissions:
  contents: read

concurrency:
  group: r7-queue-readonly-probe-33084527256
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SNAPSHOTS_TABLE: parlay_platform_snapshots
  EXPECTED_PK: MLB_LOCK_EXECUTION#V1
  EXPECTED_SK: COOPERATIVE_TERMINAL_REPLAY#V1
  EXPECTED_RECORD_TYPE: mlb_cooperative_terminal_replay_v1
  EXPECTED_COORDINATION_VERSION: MLB-COOPERATIVE-TERMINAL-REPLAY-v1-eventbridge-owner-handoff

jobs:
  probe:
    if: github.repository == 'KirtKurt/parlay-platform' && github.ref == 'refs/heads/codex/r7-queue-readonly-probe-33084527256-a1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard isolated branch-only execution
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/r7-queue-readonly-probe-33084527256-a1'
          test "$GITHUB_REPOSITORY" = 'KirtKurt/parlay-platform'

      - name: Configure read credential
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Strong-read exact cooperative queue item and print bounded proof
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RAW_PATH="/tmp/r7-cooperative-queue-${GITHUB_RUN_ID}.json"
          aws dynamodb get-item \
            --table-name "$SNAPSHOTS_TABLE" \
            --key '{"PK":{"S":"MLB_LOCK_EXECUTION#V1"},"SK":{"S":"COOPERATIVE_TERMINAL_REPLAY#V1"}}' \
            --consistent-read \
            --return-consumed-capacity NONE \
            --region "$AWS_REGION" \
            --output json > "$RAW_PATH"
          RAW_PATH="$RAW_PATH" python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone

          def decode(value):
              if not isinstance(value, dict) or len(value) != 1:
                  return None
              kind, raw = next(iter(value.items()))
              if kind == 'S':
                  return raw
              if kind == 'N':
                  text = str(raw)
                  try:
                      return int(text)
                  except ValueError:
                      try:
                          return float(text)
                      except ValueError:
                          return text
              if kind == 'BOOL':
                  return bool(raw)
              if kind == 'NULL':
                  return None
              if kind == 'M':
                  return {key: decode(entry) for key, entry in raw.items()}
              if kind == 'L':
                  return [decode(entry) for entry in raw]
              if kind in {'SS', 'NS'}:
                  return list(raw)
              return '[REDACTED_BINARY_OR_UNKNOWN]'

          with open(os.environ['RAW_PATH'], encoding='utf-8') as stream:
              raw = json.load(stream)
          encoded = raw.get('Item') or {}
          item = {key: decode(value) for key, value in encoded.items()}
          def safe_nonnegative_integer(value):
              if isinstance(value, bool):
                  return None
              try:
                  parsed = int(value)
              except (TypeError, ValueError):
                  return None
              return parsed if parsed >= 0 else None

          def sha256_shape(value):
              text = str(value or '')
              return (
                  len(text) == 64
                  and all(character in '0123456789abcdef' for character in text.lower())
              )

          proof = item.get('current_slate_success_proof')
          proof_present = isinstance(proof, dict)
          safe_proof_fields = (
              'version',
              'currentSlateDateEt',
              'requestSlateDateEt',
              'requestEpoch',
              'processedAtEpoch',
              'postStartPredictionCreationAllowed',
              'immutablePredictionRewriteAllowed',
          )
          safe_proof = (
              {key: proof.get(key) for key in safe_proof_fields if key in proof}
              if proof_present
              else None
          )
          timeline_fields = (
              'requested_at_utc',
              'requested_at_epoch',
              'claim_acquired_at_utc',
              'claim_acquired_at_epoch',
              'claim_expires_at_utc',
              'claim_expires_at_epoch',
              'last_failure_at_utc',
              'last_failure_at_epoch',
              'completed_at_utc',
              'completed_at_epoch',
              'acknowledged_at_utc',
              'acknowledged_at_epoch',
          )
          progress = item.get('terminal_replay_progress')
          progress_present = isinstance(progress, dict)
          progress = progress if progress_present else {}
          progress_counter_fields = (
              'manifestGameCount',
              'nextGameIndex',
              'processedGameCount',
              'terminalCount',
              'canonicalCount',
              'noPredictionDataCount',
              'reconciledCount',
              'verificationIndex',
              'verifiedGameCount',
              'attemptCount',
          )
          progress_counters = {
              key: safe_nonnegative_integer(progress.get(key))
              for key in progress_counter_fields
          }
          checkpoint_fingerprint = str(progress.get('checkpointFingerprint') or '')
          manifest_fingerprint = str(progress.get('manifestFingerprint') or '')
          checkpoint_material = {
              str(key): value
              for key, value in progress.items()
              if key not in {
                  'checkpointFingerprint',
                  'attemptCount',
                  'lastAttempt',
                  'updatedAtUtc',
              }
          }
          recomputed_checkpoint_fingerprint = (
              hashlib.sha256(
                  json.dumps(
                      checkpoint_material,
                      sort_keys=True,
                      separators=(',', ':'),
                      default=str,
                  ).encode('utf-8')
              ).hexdigest()
              if progress_present
              else ''
          )
          manifest_authority = progress.get('manifestAuthority')
          manifest_authority_present = isinstance(manifest_authority, dict)
          manifest_authority = (
              manifest_authority if manifest_authority_present else {}
          )
          schedule_authority = manifest_authority.get(
              'scheduleRevisionAuthority'
          )
          schedule_authority_present = isinstance(schedule_authority, dict)
          schedule_authority = (
              schedule_authority if schedule_authority_present else {}
          )
          authority_fingerprint = str(
              manifest_authority.get('fingerprint') or ''
          )
          authority_evidence_fingerprint = str(
              manifest_authority.get('authorityEvidenceFingerprint') or ''
          )
          schedule_fingerprint = str(
              schedule_authority.get('fingerprint') or ''
          )
          processed_games = progress.get('processedGames')
          processed_games_present = isinstance(processed_games, list)
          processed_games = processed_games if processed_games_present else []
          terminal_state_counts = {}
          game_identities = []
          durable_evidence_count = 0
          evidence_manifest_binding_match_count = 0
          evidence_fingerprint_shape_count = 0
          for entry in processed_games:
              if not isinstance(entry, dict):
                  continue
              state = str(entry.get('terminalState') or '')
              if state:
                  terminal_state_counts[state] = (
                      terminal_state_counts.get(state, 0) + 1
                  )
              identity = str(entry.get('gameIdentity') or '')
              if identity:
                  game_identities.append(identity)
              evidence = entry.get('durableEvidence')
              if not isinstance(evidence, dict):
                  continue
              durable_evidence_count += 1
              if (
                  str(
                      evidence.get(
                          'manifestAuthorityEvidenceFingerprint'
                      )
                      or ''
                  )
                  == authority_evidence_fingerprint
                  and sha256_shape(authority_evidence_fingerprint)
              ):
                  evidence_manifest_binding_match_count += 1
              if sha256_shape(evidence.get('evidenceFingerprint')):
                  evidence_fingerprint_shape_count += 1
          last_attempt = progress.get('lastAttempt')
          last_attempt = last_attempt if isinstance(last_attempt, dict) else {}
          safe_last_attempt = {
              key: last_attempt.get(key)
              for key in (
                  'status',
                  'stage',
                  'atUtc',
                  'gameIndex',
                  'phase',
                  'errorCode',
              )
              if last_attempt.get(key) is not None
          }
          safe_progress = {
              'present': progress_present,
              'rawFieldNames': sorted(progress) if progress_present else [],
              'version': progress.get('version'),
              'phase': progress.get('phase'),
              'slateDateEt': progress.get('slateDateEt'),
              'updatedAtUtc': progress.get('updatedAtUtc'),
              'counters': progress_counters,
              'verificationComplete': progress.get('verificationComplete'),
              'safety': {
                  'postStartPredictionCreationAllowed': progress.get(
                      'postStartPredictionCreationAllowed'
                  ),
                  'immutablePredictionRewriteAllowed': progress.get(
                      'immutablePredictionRewriteAllowed'
                  ),
                  'productionAuthorityChanged': progress.get(
                      'productionAuthorityChanged'
                  ),
              },
              'requestBinding': {
                  'queueRequestEpochPresent': (
                      safe_nonnegative_integer(item.get('requested_at_epoch'))
                      is not None
                  ),
                  'progressRequestEpochPresent': (
                      safe_nonnegative_integer(progress.get('requestEpoch'))
                      is not None
                  ),
                  'progressRequestEpochMatchesQueue': (
                      safe_nonnegative_integer(progress.get('requestEpoch'))
                      == safe_nonnegative_integer(
                          item.get('requested_at_epoch')
                      )
                      if progress_present
                      else False
                  ),
                  'queueRequestIdPresent': bool(item.get('request_id')),
                  'progressRequestIdPresent': bool(progress.get('requestId')),
                  'progressRequestIdMatchesQueue': (
                      str(progress.get('requestId') or '')
                      == str(item.get('request_id') or '')
                      and bool(item.get('request_id'))
                      if progress_present
                      else False
                  ),
                  'slateMatchesQueue': (
                      str(progress.get('slateDateEt') or '')
                      == str(item.get('slate_date_et') or '')
                      and bool(item.get('slate_date_et'))
                      if progress_present
                      else False
                  ),
              },
              'fingerprints': {
                  'manifestFingerprint': manifest_fingerprint or None,
                  'manifestFingerprintShapeValid': sha256_shape(
                      manifest_fingerprint
                  ),
                  'checkpointFingerprint': checkpoint_fingerprint or None,
                  'checkpointFingerprintShapeValid': sha256_shape(
                      checkpoint_fingerprint
                  ),
                  'checkpointFingerprintRecomputedMatches': (
                      checkpoint_fingerprint
                      == recomputed_checkpoint_fingerprint
                      and sha256_shape(checkpoint_fingerprint)
                  ),
              },
              'manifestAuthorityBinding': {
                  'present': manifest_authority_present,
                  'rawFieldNames': (
                      sorted(manifest_authority)
                      if manifest_authority_present
                      else []
                  ),
                  'bindingVersion': progress.get(
                      'manifestBindingVersion'
                  ),
                  'version': manifest_authority.get('version'),
                  'recordType': manifest_authority.get('recordType'),
                  'gameCount': safe_nonnegative_integer(
                      manifest_authority.get('gameCount')
                  ),
                  'gameCountMatchesProgress': (
                      safe_nonnegative_integer(
                          manifest_authority.get('gameCount')
                      )
                      == progress_counters.get('manifestGameCount')
                      if manifest_authority_present
                      else False
                  ),
                  'immutable': manifest_authority.get('immutable'),
                  'writeOnce': manifest_authority.get('writeOnce'),
                  'consistentReadVerified': manifest_authority.get(
                      'consistentReadVerified'
                  ),
                  'fingerprint': authority_fingerprint or None,
                  'fingerprintShapeValid': sha256_shape(
                      authority_fingerprint
                  ),
                  'authorityEvidenceFingerprint': (
                      authority_evidence_fingerprint or None
                  ),
                  'authorityEvidenceFingerprintShapeValid': sha256_shape(
                      authority_evidence_fingerprint
                  ),
                  'scheduleRevisionAuthorityPresent': (
                      schedule_authority_present
                  ),
                  'scheduleRevisionVersion': schedule_authority.get(
                      'version'
                  ),
                  'scheduleRevisionGameCount': safe_nonnegative_integer(
                      schedule_authority.get('gameCount')
                  ),
                  'scheduleRevisionFingerprint': (
                      schedule_fingerprint or None
                  ),
                  'scheduleRevisionFingerprintShapeValid': sha256_shape(
                      schedule_fingerprint
                  ),
              },
              'processedGamesSummary': {
                  'present': processed_games_present,
                  'count': len(processed_games),
                  'countMatchesProcessedGameCount': (
                      len(processed_games)
                      == progress_counters.get('processedGameCount')
                      if processed_games_present
                      else False
                  ),
                  'allGameIdentitiesPresent': (
                      len(game_identities) == len(processed_games)
                      if processed_games_present
                      else False
                  ),
                  'uniqueGameIdentityCount': len(set(game_identities)),
                  'terminalStateCounts': terminal_state_counts,
                  'durableEvidenceCount': durable_evidence_count,
                  'evidenceManifestBindingMatchCount': (
                      evidence_manifest_binding_match_count
                  ),
                  'evidenceFingerprintShapeCount': (
                      evidence_fingerprint_shape_count
                  ),
              },
              'lastAttempt': safe_last_attempt or None,
              'identitiesRedacted': True,
              'rawGamePayloadRedacted': True,
              'privateProofRedacted': True,
              'leaseOwnerRedacted': True,
          }
          receipt = item.get('replay_receipt')
          receipt_present = isinstance(receipt, dict)
          receipt = receipt if receipt_present else {}
          receipt_progress = receipt.get('perGameLockProgress')
          receipt_progress = (
              receipt_progress if isinstance(receipt_progress, dict) else {}
          )
          receipt_repair = receipt.get('missedLockTerminalReconciliation')
          receipt_repair = (
              receipt_repair if isinstance(receipt_repair, dict) else {}
          )
          receipt_counter_fields = (
              'manifestGameCount',
              'processedGameCount',
              'verifiedGameCount',
              'verificationIndex',
              'atomicDurableItemCount',
              'canonicalCount',
              'noPredictionDataCount',
              'lockOutcomeCount',
              'missedCount',
              'dueMissingCount',
          )
          safe_receipt = {
              'present': receipt_present,
              'rawFieldNames': sorted(receipt) if receipt_present else [],
              'ok': receipt.get('ok'),
              'sport': receipt.get('sport'),
              'slateDateEt': receipt.get('slateDateEt'),
              'reason': receipt.get('reason'),
              'terminalChunkVersion': receipt.get(
                  'terminalChunkVersion'
              ),
              'checkpointFingerprint': receipt.get(
                  'checkpointFingerprint'
              ),
              'manifestFingerprint': receipt.get('manifestFingerprint'),
              'checkpointMatchesProgress': (
                  str(receipt.get('checkpointFingerprint') or '')
                  == checkpoint_fingerprint
                  and receipt_present
              ),
              'manifestMatchesProgress': (
                  str(receipt.get('manifestFingerprint') or '')
                  == manifest_fingerprint
                  and receipt_present
              ),
              'verificationPhase': receipt.get('verificationPhase'),
              'durableTerminalVerificationComplete': receipt.get(
                  'durableTerminalVerificationComplete'
              ),
              'atomicDurableProofRequired': receipt.get(
                  'atomicDurableProofRequired'
              ),
              'completionMutationLeaseRequired': receipt.get(
                  'completionMutationLeaseRequired'
              ),
              'progressCounters': {
                  key: safe_nonnegative_integer(receipt_progress.get(key))
                  for key in receipt_counter_fields
              },
              'repair': {
                  key: receipt_repair.get(key)
                  for key in (
                      'ok',
                      'version',
                      'slateDateEt',
                      'manifestGameCount',
                      'processedGameCount',
                      'verifiedGameCount',
                      'verificationIndex',
                      'durableTerminalVerificationComplete',
                      'atomicDurableProofRequired',
                      'atomicDurableItemCount',
                      'completionMutationLeaseRequired',
                      'reconciledCount',
                      'remainingMissedCount',
                      'postStartPredictionCreationAllowed',
                      'candidateIntegrityFailuresRelabeled',
                  )
                  if key in receipt_repair
              },
              'safety': {
                  key: receipt.get(key)
                  for key in (
                      'postStartPredictionCreationAllowed',
                      'immutablePredictionRewriteAllowed',
                      'directWorkflowTableWrite',
                      'productionAuthorityChanged',
                      'cooperativeReceiptRedacted',
                  )
                  if key in receipt
              },
              'privateProofRedacted': True,
              'rawGamePayloadRedacted': True,
          }
          identity_field_names = sorted(
              key for key in item
              if any(token in key.lower() for token in (
                  'owner', 'identifier', 'request_id', 'invocation_id',
                  'execution_id',
              ))
          )
          result = {
              'ok': True,
              'proofType': 'R7_COOPERATIVE_QUEUE_EXACT_STRONG_READ',
              'observedAtUtc': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'sourceRunId': os.environ.get('GITHUB_RUN_ID'),
              'sourceBranch': os.environ.get('GITHUB_REF_NAME'),
              'readOnly': True,
              'awsOperation': 'dynamodb:GetItem',
              'consistentRead': True,
              'lambdaInvocationsAttempted': 0,
              'tableWritesAttempted': 0,
              'leaseMutationsAttempted': 0,
              'table': os.environ['SNAPSHOTS_TABLE'],
              'key': {
                  'PK': os.environ['EXPECTED_PK'],
                  'SK': os.environ['EXPECTED_SK'],
              },
              'itemPresent': bool(item),
              'identity': {
                  'pkMatchesExpected': item.get('PK') == os.environ['EXPECTED_PK'] if item else None,
                  'skMatchesExpected': item.get('SK') == os.environ['EXPECTED_SK'] if item else None,
                  'recordType': item.get('record_type'),
                  'recordTypeMatchesExpected': item.get('record_type') == os.environ['EXPECTED_RECORD_TYPE'] if item else None,
              },
              'coordinationVersion': item.get('coordination_version'),
              'coordinationVersionMatchesExpected': item.get('coordination_version') == os.environ['EXPECTED_COORDINATION_VERSION'] if item else None,
              'state': item.get('state'),
              'sport': item.get('sport'),
              'run': item.get('run'),
              'slateDateEt': item.get('slate_date_et'),
              'force': item.get('force'),
              'timeline': {key: item.get(key) for key in timeline_fields if key in item},
              'lastChunk': {
                  key: item.get(key)
                  for key in (
                      'last_chunk_at_utc',
                      'last_chunk_at_epoch',
                      'last_chunk_stage',
                      'last_chunk_status',
                  )
                  if key in item
              },
              'claimOwnerPresent': 'claim_owner' in item and bool(item.get('claim_owner')),
              'claimOwner': '[REDACTED]' if item.get('claim_owner') else None,
              'identifierFieldsRedacted': identity_field_names,
              'terminalReplayProgress': safe_progress,
              'currentSlateSuccessProofPresent': proof_present,
              'currentSlateSuccessProof': safe_proof,
              'unexpectedProofFieldsRedacted': (
                  sorted(set(proof) - set(safe_proof_fields)) if proof_present else []
              ),
              'replayReceiptPresent': receipt_present,
              'replayReceipt': safe_receipt,
              'rawAttributeNames': sorted(item),
          }
          if item:
              identity_ok = all((
                  result['identity']['pkMatchesExpected'],
                  result['identity']['skMatchesExpected'],
                  result['identity']['recordTypeMatchesExpected'],
                  result['coordinationVersionMatchesExpected'],
              ))
              result['ok'] = identity_ok
          print(json.dumps(result, indent=2, sort_keys=True))
          if not result['ok']:
              raise SystemExit('Exact queue item failed its deployed identity contract')
          PY


      - name: Checkout exact deployed R7 source
        uses: actions/checkout@v4
        with:
          ref: a3d399881254a249f241e77a52486bc694f65de3
          persist-credentials: false
          fetch-depth: 1

      - name: Reproduce exact prelock classification under hard read-only guard
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m pip install --quiet 'boto3>=1.34,<2' 'requests>=2,<3'
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import sys
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          from botocore.client import BaseClient

          # Install the guard before repository modules are importable. The
          # diagnostic process can issue only strongly-consistent DynamoDB read
          # operations; every AWS write and every Lambda operation is rejected.
          original_api_call = BaseClient._make_api_call
          operation_counts = Counter()
          allowed_dynamodb = {
              'BatchGetItem',
              'GetItem',
              'Query',
              'TransactGetItems',
          }

          def read_only_api_call(self, operation_name, api_params):
              service = str(self.meta.service_model.service_name or '')
              operation_counts[f'{service}:{operation_name}'] += 1
              if service != 'dynamodb' or operation_name not in allowed_dynamodb:
                  raise RuntimeError(
                      f'READ_ONLY_GUARD_BLOCKED:{service}:{operation_name}'
                  )
              return original_api_call(self, operation_name, api_params)

          BaseClient._make_api_call = read_only_api_call
          sys.path.insert(0, str(Path.cwd() / 'hello_world'))

          import mlb_daily_pick_lock_protected as protected
          import mlb_prospective_row_repair as repair

          module = protected.mlb_daily_pick_lock
          patch = protected.mlb_daily_per_game_lock_patch
          expected_error = 'PRELOCK_CANDIDATE_REQUIRES_REVIEW'

          queue = module.TABLE.get_item(
              Key={
                  'PK': os.environ['EXPECTED_PK'],
                  'SK': os.environ['EXPECTED_SK'],
              },
              ConsistentRead=True,
          ).get('Item')
          if not isinstance(queue, dict):
              raise SystemExit('Exact cooperative queue item is absent')
          progress = queue.get('terminal_replay_progress')
          if not isinstance(progress, dict):
              raise SystemExit('Exact cooperative checkpoint is absent')
          attempt = progress.get('lastAttempt')
          if not isinstance(attempt, dict):
              raise SystemExit('Exact cooperative last attempt is absent')
          if (
              str(queue.get('state') or '') not in {'QUEUED', 'CLAIMED'}
              or str(attempt.get('errorCode') or '') != expected_error
              or str(attempt.get('stage') or '') != 'PROVE_PRELOCK_ABSENCE'
          ):
              raise SystemExit('Live queue is no longer at the target failure')

          slate = str(queue.get('slate_date_et') or '')
          game_index = int(attempt.get('gameIndex'))
          status_cache = getattr(patch, '_STATUS_READ_CACHE')
          alias_limit = getattr(
              patch,
              '_COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT',
          )
          status_token = status_cache.set({'canonicalPulls': {}})
          alias_token = alias_limit.set(
              repair.COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_QUERY_LIMIT
          )
          try:
              pulls = sorted(
                  list(module._pulls_for_date(slate) or []),
                  key=lambda pull: patch._pull_at(module, pull)
                  or datetime.min.replace(tzinfo=timezone.utc),
              )
              manifest = sorted(
                  list(module._latest_games_for_date(slate, pulls) or []),
                  key=lambda game: (
                      (
                          patch._start(module, game)
                          or datetime.min.replace(tzinfo=timezone.utc)
                      ).isoformat(),
                      str(patch.game_identity(game) or ''),
                  ),
              )
              if game_index < 0 or game_index >= len(manifest):
                  raise RuntimeError('LIVE_GAME_INDEX_OUT_OF_MANIFEST_RANGE')
              identities = []
              identity_options = []
              for game in manifest:
                  options = repair._cooperative_terminal_identity_options(
                      patch, game
                  )
                  identities.append(options[0])
                  identity_options.append(options)
              selected_authority = patch._select_provider_manifest_authority(
                  module,
                  pulls,
                  slate,
                  manifest,
              )
              manifest_authority = (
                  repair._cooperative_terminal_manifest_authority_evidence(
                      module,
                      patch,
                      selected_authority,
                      len(manifest),
                  )
              )
              manifest_fingerprint = (
                  repair._cooperative_terminal_manifest_fingerprint(
                      module,
                      patch,
                      manifest,
                      identities=identities,
                      identity_options=identity_options,
                      manifest_authority=manifest_authority,
                  )
              )
              game = manifest[game_index]
              scoring = patch._scoring_pulls(module, pulls, game)
              candidate_items = patch._candidate_items(
                  module,
                  slate,
                  game,
                  scoring,
              )
              candidate, proof, bound, errors = patch._last_prelock_candidate(
                  module,
                  slate,
                  game,
                  scoring,
              )
          finally:
              alias_limit.reset(alias_token)
              status_cache.reset(status_token)

          safe_error = re.compile(r'^[a-z0-9_.:-]{1,240}$')
          safe_errors = []
          for value in errors or []:
              value = str(value)
              if safe_error.fullmatch(value):
                  safe_errors.append(value)
              else:
                  safe_errors.append(
                      'REDACTED_ERROR_SHA256:'
                      + hashlib.sha256(value.encode('utf-8')).hexdigest()
                  )

          def digest(value):
              return hashlib.sha256(
                  str(value or '').encode('utf-8')
              ).hexdigest()

          def iso(value):
              return value.isoformat() if value is not None else None

          candidate_summaries = []
          for item in candidate_items:
              row = item.get('data')
              row = row if isinstance(row, dict) else {}
              candidate_summaries.append({
                  'keyFingerprint': digest(
                      f"{item.get('PK') or ''}\0{item.get('SK') or ''}"
                  ),
                  'recordType': item.get('record_type'),
                  'snapshotVersion': item.get('snapshot_version'),
                  'snapshotRole': item.get('snapshot_role'),
                  'publicAuthorityVersion': item.get(
                      'public_authority_version'
                  ),
                  'userVisible': item.get('user_visible'),
                  'displayPrediction': item.get('display_prediction'),
                  'displayStatus': item.get('display_status'),
                  'displaySurface': item.get('display_surface'),
                  'predictionPersistenceProofType': item.get(
                      'prediction_persistence_proof_type'
                  ),
                  'predictionPayloadFingerprintVersion': item.get(
                      'prediction_payload_fingerprint_version'
                  ),
                  'createdAtUtc': iso(
                      patch._candidate_created_at(item, row)
                  ),
                  'persistedAtUtc': iso(
                      patch._candidate_persisted_at(item)
                  ),
                  'sourceAtUtc': iso(
                      patch._candidate_source_at(item, row)
                  ),
                  'rowLockedPrediction': row.get('lockedPrediction'),
                  'rowOfficialPrediction': row.get('officialPrediction'),
                  'rowDisplayPrediction': row.get('displayPrediction'),
                  'rowDisplayGroup': row.get('displayGroup'),
                  'rowOfficialPredictionStatus': row.get(
                      'officialPredictionStatus'
                  ),
                  'rowHasSelection': bool(
                      row.get('predictedWinner')
                      and row.get('predictedSide') in {'home', 'away'}
                  ),
                  'rowFingerprint': patch._payload_fingerprint(
                      row,
                      (
                          item.get(
                              'prediction_payload_fingerprint_version'
                          )
                          if patch._supported_payload_fingerprint_version(
                              item.get(
                                  'prediction_payload_fingerprint_version'
                              )
                          )
                          else None
                      ),
                  ),
              })
          candidate_summaries.sort(
              key=lambda item: (
                  str(item.get('persistedAtUtc') or ''),
                  str(item.get('keyFingerprint') or ''),
              )
          )

          proof_map = proof if isinstance(proof, dict) else {}
          source_pull_id = str(
              proof_map.get('predictionSourcePullId')
              or (candidate or {}).get('predictionSourcePullId')
              or ''
          )
          source_pull_at_text = str(
              proof_map.get('predictionSourcePullAtUtc')
              or (candidate or {}).get('predictionSourcePullAt')
              or ''
          )
          source_pull_at = patch._parse_iso(source_pull_at_text)
          source_slot = patch.history_contract.pull_slot_start(
              source_pull_at_text
          )
          canonical_full_pulls = (
              patch.history_contract.canonicalize_pull_slots(
                  pulls,
                  sport='mlb',
              )
          )
          slot_representatives = [
              pull
              for pull in canonical_full_pulls
              if (
                  patch.history_contract.pull_slot_start(
                      pull.get('pulled_at')
                  )
                  == source_slot
              )
          ]
          canonical_source_matches = [
              pull
              for pull in slot_representatives
              if (
                  str(pull.get('pull_id') or '') == source_pull_id
                  and patch._pull_at(module, pull) == source_pull_at
              )
          ]
          raw_source_matches = []
          for representative in slot_representatives:
              for raw_pull in (
                  representative.get('_canonicalSlotRawPulls') or []
              ):
                  if not isinstance(raw_pull, dict):
                      continue
                  if (
                      str(raw_pull.get('pull_id') or '')
                      == source_pull_id
                      and patch._pull_at(module, raw_pull)
                      == source_pull_at
                  ):
                      raw_source_matches.append(raw_pull)
          representative = (
              slot_representatives[0]
              if len(slot_representatives) == 1
              else {}
          )
          slot_metadata = (
              representative.get('canonicalPullSlot') or {}
              if isinstance(representative, dict)
              else {}
          )
          source_binding = {
              'predictionSourcePullId': source_pull_id or None,
              'predictionSourcePullAtUtc': (
                  source_pull_at.isoformat()
                  if source_pull_at is not None
                  else None
              ),
              'canonicalSlotStartUtc': (
                  source_slot.isoformat()
                  if source_slot is not None
                  else None
              ),
              'canonicalSlotRepresentativeCount': len(
                  slot_representatives
              ),
              'canonicalSlotRepresentativePullId': (
                  str(representative.get('pull_id') or '')
                  if isinstance(representative, dict)
                  else None
              ),
              'canonicalSlotMetadataPullId': (
                  slot_metadata.get('canonicalPullId')
              ),
              'sourceIsCanonicalSlotRepresentative': (
                  len(canonical_source_matches) == 1
              ),
              'sourceRawVariantMatchCount': len(raw_source_matches),
              'sourceIsOnlyLegacyRawVariant': bool(
                  raw_source_matches
                  and not canonical_source_matches
              ),
              'slotRawPullCount': slot_metadata.get('rawPullCount'),
              'slotDuplicatePullCount': slot_metadata.get(
                  'duplicatePullCount'
              ),
              'slotContaminated': slot_metadata.get(
                  'contaminated'
              ),
          }
          target_identity = {
              'manifestPrimaryIdentity': identities[game_index],
              'manifestIdentityOptions': identity_options[game_index],
              'manifestRawGameId': (
                  game.get('game_id')
                  or game.get('gameId')
                  or game.get('id')
              ),
              'manifestProviderEventId': (
                  game.get('provider_event_id')
                  or game.get('providerEventId')
              ),
              'manifestOfficialGamePk': (
                  game.get('official_game_pk')
                  or game.get('officialGamePk')
              ),
              'candidateGameIdentity': proof_map.get(
                  'candidateGameIdentity'
              ),
              'stageGameIdentity': proof_map.get(
                  'stageGameIdentity'
              ),
              'identityBindingMode': proof_map.get(
                  'identityBindingMode'
              ),
          }

          proof_summary = None
          if isinstance(proof, dict):
              proof_summary = {
                  key: proof.get(key)
                  for key in (
                      'version',
                      'recordType',
                      'snapshotVersion',
                      'snapshotRole',
                      'publicAuthorityVersion',
                      'userVisible',
                      'displayPrediction',
                      'displayStatus',
                      'displaySurface',
                      'signalPolicyVersion',
                      'predictionCreatedAtUtc',
                      'predictionPersistedAtUtc',
                      'persistenceProofType',
                      'predictionPayloadFingerprintVersion',
                      'candidateSnapshotFingerprint',
                      'predictionSourcePullId',
                      'predictionSourcePullAtUtc',
                      'predictionSourceCanonicalSlotStartUtc',
                      'predictionSourcePullStoragePk',
                      'predictionSourcePullStorageSk',
                      'predictionSourcePullFingerprint',
                      'sourceAgeAtCutoffMinutes',
                      'evaluationCutoffAtUtc',
                      'sourceAtOrBeforeCutoff',
                      'createdAtOrBeforeCutoff',
                      'persistedAtOrBeforeCutoff',
                      'candidateRowFingerprint',
                      'candidateSelectionFingerprint',
                      'candidateVectorFingerprint',
                      'identityBindingMode',
                      'rejectedNewerCandidateCount',
                      'modelOrSignalRecomputedAtLock',
                  )
              }
              proof_summary['candidateIdentityFingerprint'] = digest(
                  proof.get('candidateGameIdentity')
              )
              proof_summary['stageIdentityFingerprint'] = digest(
                  proof.get('stageGameIdentity')
              )

          game_start = patch._start(module, game)
          lock_at = patch._lock_at(module, game)
          result = {
              'ok': True,
              'proofType': 'R7_PRELOCK_CANDIDATE_EXACT_READ_ONLY_CLASSIFICATION',
              'observedAtUtc': datetime.now(
                  timezone.utc
              ).isoformat().replace('+00:00', 'Z'),
              'sourceRunId': os.environ.get('GITHUB_RUN_ID'),
              'readOnly': True,
              'hardSdkGuardInstalledBeforeRepositoryImport': True,
              'allowedAwsServices': ['dynamodb'],
              'allowedDynamoDbOperations': sorted(allowed_dynamodb),
              'awsOperationCounts': dict(sorted(operation_counts.items())),
              'lambdaInvocationsAttempted': 0,
              'tableWritesAttempted': 0,
              'leaseMutationsAttempted': 0,
              'queueBinding': {
                  'state': queue.get('state'),
                  'lastAttemptAtUtc': attempt.get('atUtc'),
                  'lastAttemptStage': attempt.get('stage'),
                  'lastAttemptStatus': attempt.get('status'),
                  'lastAttemptErrorCode': attempt.get('errorCode'),
                  'gameIndex': game_index,
                  'progressCheckpointFingerprint': progress.get(
                      'checkpointFingerprint'
                  ),
                  'progressManifestFingerprint': progress.get(
                      'manifestFingerprint'
                  ),
                  'recomputedManifestFingerprint': manifest_fingerprint,
                  'manifestFingerprintMatchesCheckpoint': (
                      manifest_fingerprint
                      == str(progress.get('manifestFingerprint') or '')
                  ),
                  'requestIdMatchedInternally': (
                      str(progress.get('requestId') or '')
                      == str(queue.get('request_id') or '')
                      and bool(queue.get('request_id'))
                  ),
                  'requestEpochMatchedInternally': (
                      int(progress.get('requestEpoch') or 0)
                      == int(queue.get('requested_at_epoch') or 0)
                      and int(queue.get('requested_at_epoch') or 0) > 0
                  ),
                  'requestIdentifiersRedacted': True,
              },
              'target': {
                  'slateDateEt': slate,
                  'manifestGameCount': len(manifest),
                  'gameIndex': game_index,
                  'gameIdentityFingerprint': digest(identities[game_index]),
                  'identityOptionCount': len(identity_options[game_index]),
                  'identityOptionsRedacted': True,
                  'gameStartUtc': iso(game_start),
                  'scheduledLockAtUtc': iso(lock_at),
                  'scoringPullCount': len(scoring),
              },
              'authority': {
                  'version': selected_authority.get('version'),
                  'recordType': selected_authority.get('recordType'),
                  'observedAtUtc': selected_authority.get('observedAtUtc'),
                  'gameCount': selected_authority.get('gameCount'),
                  'fingerprint': selected_authority.get('fingerprint'),
                  'immutable': selected_authority.get('immutable'),
                  'writeOnce': selected_authority.get('writeOnce'),
                  'consistentReadVerified': selected_authority.get(
                      'consistentReadVerified'
                  ),
                  'authorityEvidenceFingerprint': manifest_authority.get(
                      'authorityEvidenceFingerprint'
                  ),
                  'scheduleRevisionAuthorityVersion': (
                      (
                          manifest_authority.get(
                              'scheduleRevisionAuthority'
                          )
                          or {}
                      ).get('version')
                  ),
                  'scheduleRevisionAuthorityFingerprint': (
                      (
                          manifest_authority.get(
                              'scheduleRevisionAuthority'
                          )
                          or {}
                      ).get('fingerprint')
                  ),
                  'authorityKeysRedacted': True,
              },
              'classification': {
                  'candidatePresent': isinstance(candidate, dict),
                  'candidateProofPresent': isinstance(proof, dict),
                  'boundScoringPullCount': len(bound or []),
                  'candidateErrors': safe_errors,
                  'candidateErrorCount': len(safe_errors),
                  'provenAbsence': bool(
                      candidate is None
                      and proof is None
                      and not bound
                      and patch._is_no_prediction_candidate_failure(errors)
                  ),
                  'reproducesLiveFailure': bool(
                      not (
                          candidate is None
                          and proof is None
                          and not bound
                          and patch._is_no_prediction_candidate_failure(errors)
                      )
                  ),
                  'candidateQueryItemCount': len(candidate_items),
                  'candidateQueryItems': candidate_summaries[:8],
                  'candidateQueryTruncated': len(candidate_summaries) > 8,
                  'candidatePayloadRedacted': True,
                  'candidateIdentityRedacted': True,
                  'proofSummary': proof_summary,
                  'sourceBinding': source_binding,
                  'targetIdentity': target_identity,
              },
              'safety': {
                  'postStartPredictionCreationAllowed': False,
                  'immutablePredictionRewriteAllowed': False,
                  'productionAuthorityChanged': False,
                  'rawGamePayloadPrinted': False,
                  'rawCandidatePayloadPrinted': False,
                  'secretExposed': False,
              },
          }
          print(json.dumps(result, indent=2, sort_keys=True, default=str))
          if not result['queueBinding']['manifestFingerprintMatchesCheckpoint']:
              raise SystemExit('Live manifest no longer matches the checkpoint')
          if not result['classification']['reproducesLiveFailure']:
              raise SystemExit('Live prelock classification changed during probe')
          PY
