name: Read-only R7 cooperative queue probe 33084527256
run-name: Read-only R7 queue probe ${{ github.run_id }}

"on":
  push:
    branches:
      - codex/r7-queue-readonly-probe-33084527256-a1
    paths:
      - .github/workflows/r7-queue-readonly-probe-33084527256.yml

permissions:
  contents: read

concurrency:
  group: r7-queue-readonly-probe-33084527256
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SNAPSHOTS_TABLE: parlay_platform_snapshots
  EXPECTED_PK: MLB_LOCK_EXECUTION#V1
  EXPECTED_SK: COOPERATIVE_TERMINAL_REPLAY#V1
  EXPECTED_RECORD_TYPE: mlb_cooperative_terminal_replay_v1
  EXPECTED_COORDINATION_VERSION: MLB-COOPERATIVE-TERMINAL-REPLAY-v1-eventbridge-owner-handoff

jobs:
  probe:
    if: github.repository == 'KirtKurt/parlay-platform' && github.ref == 'refs/heads/codex/r7-queue-readonly-probe-33084527256-a1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard isolated branch-only execution
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/r7-queue-readonly-probe-33084527256-a1'
          test "$GITHUB_REPOSITORY" = 'KirtKurt/parlay-platform'

      - name: Configure read credential
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read-only EventBridge Lambda and global lease liveness
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export AWS_PAGER=""
          STACK_NAME=parlay-platform-dev
          WINDOW_START=2026-08-27T22:15:00Z
          WINDOW_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          FUNCTION_NAME=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBDailyPickLockFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$FUNCTION_NAME"
          test "$FUNCTION_NAME" != None
          aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --output json > /tmp/r7-lock-function.json
          aws lambda get-policy \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --output json > /tmp/r7-lock-policy.json
          RULE_ARN=$(python - <<'PY'
          import json

          with open('/tmp/r7-lock-policy.json', encoding='utf-8') as stream:
              outer = json.load(stream)
          policy = json.loads(outer.get('Policy') or '{}')
          arns = []
          for statement in policy.get('Statement') or []:
              principal = statement.get('Principal')
              service = (
                  principal.get('Service')
                  if isinstance(principal, dict)
                  else None
              )
              condition = statement.get('Condition') or {}
              source_arn = (
                  (condition.get('ArnLike') or {}).get('AWS:SourceArn')
                  or (condition.get('ArnEquals') or {}).get('AWS:SourceArn')
              )
              if (
                  service == 'events.amazonaws.com'
                  and isinstance(source_arn, str)
                  and source_arn
              ):
                  arns.append(source_arn)
          preferred = [
              arn for arn in arns
              if 'MLBDailyPickLockEveryMinute' in arn
          ]
          selected = preferred[0] if len(preferred) == 1 else (
              arns[0] if len(arns) == 1 else ''
          )
          if not selected:
              raise SystemExit(
                  'Exact EventBridge schedule source ARN was not unique'
              )
          print(selected)
          PY
          )
          RULE_NAME=$(printf '%s\n' "$RULE_ARN" | awk -F/ '{print $NF}')
          test -n "$RULE_NAME"
          aws events describe-rule \
            --name "$RULE_NAME" \
            --region "$AWS_REGION" \
            --output json > /tmp/r7-lock-rule.json
          aws events list-targets-by-rule \
            --rule "$RULE_NAME" \
            --region "$AWS_REGION" \
            --output json > /tmp/r7-lock-targets.json
          aws lambda get-function-event-invoke-config \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --output json > /tmp/r7-lock-event-config.json
          if ! aws lambda get-function-concurrency \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --output json > /tmp/r7-lock-concurrency.json 2>/tmp/r7-lock-concurrency.err; then
            printf '{}\n' > /tmp/r7-lock-concurrency.json
          fi
          if [ ! -s /tmp/r7-lock-concurrency.json ]; then
            printf '{}\n' > /tmp/r7-lock-concurrency.json
          fi
          for METRIC in Invocations Errors Throttles ConcurrentExecutions Duration; do
            STAT=Sum
            if [ "$METRIC" = ConcurrentExecutions ] || [ "$METRIC" = Duration ]; then
              STAT=Maximum
            fi
            aws cloudwatch get-metric-statistics \
              --namespace AWS/Lambda \
              --metric-name "$METRIC" \
              --dimensions Name=FunctionName,Value="$FUNCTION_NAME" \
              --start-time "$WINDOW_START" \
              --end-time "$WINDOW_END" \
              --period 60 \
              --statistics "$STAT" \
              --region "$AWS_REGION" \
              --output json > "/tmp/r7-lambda-$METRIC.json"
          done
          for METRIC in Invocations FailedInvocations TriggeredRules MatchedEvents; do
            aws cloudwatch get-metric-statistics \
              --namespace AWS/Events \
              --metric-name "$METRIC" \
              --dimensions Name=RuleName,Value="$RULE_NAME" \
              --start-time "$WINDOW_START" \
              --end-time "$WINDOW_END" \
              --period 60 \
              --statistics Sum \
              --region "$AWS_REGION" \
              --output json > "/tmp/r7-events-$METRIC.json"
          done
          START_MS=$(date -u -d "$WINDOW_START" +%s000)
          aws logs filter-log-events \
            --log-group-name "/aws/lambda/$FUNCTION_NAME" \
            --start-time "$START_MS" \
            --region "$AWS_REGION" \
            --limit 10000 \
            --output json > /tmp/r7-lock-logs.json
          aws dynamodb get-item \
            --table-name "$SNAPSHOTS_TABLE" \
            --key '{"PK":{"S":"MLB_LOCK_EXECUTION#V1"},"SK":{"S":"LEASE"}}' \
            --consistent-read \
            --return-consumed-capacity NONE \
            --region "$AWS_REGION" \
            --output json > /tmp/r7-global-lease.json
          if [ ! -s /tmp/r7-global-lease.json ]; then
            printf '{}\n' > /tmp/r7-global-lease.json
          fi
          FUNCTION_NAME="$FUNCTION_NAME" RULE_NAME="$RULE_NAME" \
          WINDOW_START="$WINDOW_START" WINDOW_END="$WINDOW_END" python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          def read(path):
              with open(path, encoding='utf-8') as stream:
                  return json.load(stream)

          def decode(value):
              if not isinstance(value, dict) or len(value) != 1:
                  return None
              kind, raw = next(iter(value.items()))
              if kind == 'S':
                  return raw
              if kind == 'N':
                  text = str(raw)
                  try:
                      return int(text)
                  except ValueError:
                      try:
                          return float(text)
                      except ValueError:
                          return text
              if kind == 'BOOL':
                  return bool(raw)
              if kind == 'NULL':
                  return None
              if kind == 'M':
                  return {key: decode(entry) for key, entry in raw.items()}
              if kind == 'L':
                  return [decode(entry) for entry in raw]
              return '[REDACTED_BINARY_OR_UNKNOWN]'

          def metric(path, statistic):
              data = read(path)
              points = sorted(
                  data.get('Datapoints') or [],
                  key=lambda point: point.get('Timestamp') or '',
              )
              return {
                  'statistic': statistic,
                  'pointCount': len(points),
                  'totalOrMaximum': (
                      sum(float(point.get(statistic) or 0) for point in points)
                      if statistic == 'Sum'
                      else max(
                          [
                              float(point.get(statistic) or 0)
                              for point in points
                          ],
                          default=0.0,
                      )
                  ),
                  'nonzeroPoints': [
                      {
                          'timestamp': point.get('Timestamp'),
                          'value': point.get(statistic),
                          'unit': point.get('Unit'),
                      }
                      for point in points
                      if float(point.get(statistic) or 0) != 0
                  ],
              }

          function = read('/tmp/r7-lock-function.json')
          rule = read('/tmp/r7-lock-rule.json')
          targets = read('/tmp/r7-lock-targets.json').get('Targets') or []
          event_config = read('/tmp/r7-lock-event-config.json')
          concurrency = read('/tmp/r7-lock-concurrency.json')
          logs = read('/tmp/r7-lock-logs.json').get('events') or []
          starts = []
          ends = []
          reports = []
          request_ids = set()
          marker_names = (
              'Task timed out',
              '[ERROR]',
              'Traceback',
              'Runtime.ExitError',
              'MLB_LOCK_EXECUTION_ALREADY_RUNNING',
              'SKIPPED_OVERLAPPING_LOCK_EXECUTION',
              'PRELOCK_CANDIDATE_REQUIRES_REVIEW',
              'DEFERRED_INSUFFICIENT_REMAINING_TIME',
              'CURRENT_SLATE_SUCCESS_PROOF_REQUIRED',
          )
          marker_counts = {name: 0 for name in marker_names}
          safe_error_evidence = []
          safe_lower_markers = (
              'candidatePersistenceFailures',
              'canonical_locked_storage_errors',
              'incomplete',
              'count_mismatch',
              'winner_prediction_failed',
              'dailyCardComplete',
              'candidate_persistence',
              'canonicalLockedStorage',
          )
          for event in logs:
              message = str(event.get('message') or '')
              timestamp = event.get('timestamp')
              start = re.search(r'\bSTART RequestId:\s*([A-Za-z0-9-]+)', message)
              end = re.search(r'\bEND RequestId:\s*([A-Za-z0-9-]+)', message)
              report = re.search(
                  r'\bREPORT RequestId:\s*([A-Za-z0-9-]+)', message
              )
              if start:
                  request_ids.add(start.group(1))
                  starts.append({
                      'atUtc': datetime.fromtimestamp(
                          timestamp / 1000, tz=timezone.utc
                      ).isoformat().replace('+00:00', 'Z'),
                      'requestIdHash': hashlib.sha256(
                          start.group(1).encode('utf-8')
                      ).hexdigest()[:12],
                  })
              if end:
                  request_ids.add(end.group(1))
                  ends.append(timestamp)
              if report:
                  request_ids.add(report.group(1))
                  duration = re.search(
                      r'Duration:\s*([0-9.]+)\s*ms', message
                  )
                  status = re.search(r'Status:\s*([A-Za-z0-9_-]+)', message)
                  error_type = re.search(
                      r'Error Type:\s*([A-Za-z0-9_.-]+)', message
                  )
                  reports.append({
                      'atUtc': datetime.fromtimestamp(
                          timestamp / 1000, tz=timezone.utc
                      ).isoformat().replace('+00:00', 'Z'),
                      'requestIdHash': hashlib.sha256(
                          report.group(1).encode('utf-8')
                      ).hexdigest()[:12],
                      'durationMs': (
                          float(duration.group(1)) if duration else None
                      ),
                      'status': status.group(1) if status else None,
                      'errorType': (
                          error_type.group(1) if error_type else None
                      ),
                  })
              for marker in marker_names:
                  if marker in message:
                      marker_counts[marker] += 1
              if '[ERROR]' in message or 'Traceback' in message:
                  uppercase_tokens = sorted(set(re.findall(
                      r'\b(?:MLB|PRELOCK|PROVE|VERIFY|CANONICAL|LOCKED|'
                      r'PREDICTION|SCHEDULED|CHUNK)[A-Z0-9_]*'
                      r'(?:_[A-Z0-9]+)+\b',
                      message,
                  )))
                  lower_markers = sorted(
                      marker
                      for marker in safe_lower_markers
                      if marker in message
                  )
                  exception_types = sorted(set(re.findall(
                      r'\b([A-Za-z_][A-Za-z0-9_.]*'
                      r'(?:Error|Exception|Unavailable|Conflict))(?=:)',
                      message,
                  )))
                  request_match = re.search(
                      r'\b[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,36}\b',
                      message,
                  )
                  if uppercase_tokens or lower_markers or exception_types:
                      frames = [
                          {
                              'file': Path(match.group(1)).name,
                              'line': int(match.group(2)),
                              'function': match.group(3).strip()[:120],
                          }
                          for match in re.finditer(
                              r'File "([^"]+)", line ([0-9]+), in ([^\n]+)',
                              message,
                          )
                      ]
                      terminal_exceptions = list(re.finditer(
                          r'\b([A-Za-z_][A-Za-z0-9_.]*'
                          r'(?:Error|Exception|Unavailable|Conflict)):\s*'
                          r'([^\n]*)',
                          message,
                      ))
                      type_error_messages = [
                          match.group(2)[:240]
                          for match in terminal_exceptions
                          if match.group(1).endswith('TypeError')
                      ]
                      scheduled_summary = None
                      prefix = 'MLB_SCHEDULED_LOCK_FAILED:'
                      prefix_index = message.rfind(prefix)
                      if prefix_index >= 0:
                          candidate = message[
                              prefix_index + len(prefix):
                          ].lstrip()
                          regex_fields = {}
                          for field in (
                              'reason',
                              'ok',
                              'locked',
                              'failClosed',
                              'scheduledInvocation',
                              'dailyCardComplete',
                              'lockStatusComplete',
                              'canonicalPredictionComplete',
                              'manifestGameCount',
                              'stagedCount',
                              'canonicalCount',
                              'lockedPredictionCount',
                              'lockOutcomeCount',
                              'noPredictionDataCount',
                              'pendingCount',
                              'stabilizingCount',
                              'dueMissingCount',
                              'missedCount',
                              'state',
                              'status',
                          ):
                              values = []
                              pattern = (
                                  r'"' + re.escape(field)
                                  + r'"\s*:\s*'
                                  + r'(true|false|null|-?[0-9]+(?:\.[0-9]+)?'
                                  + r'|"[A-Za-z0-9_.:-]{1,160}")'
                              )
                              for match in re.finditer(pattern, candidate):
                                  raw_value = match.group(1)
                                  try:
                                      value = json.loads(raw_value)
                                  except Exception:
                                      continue
                                  if value not in values:
                                      values.append(value)
                              if values:
                                  regex_fields[field] = values[:40]
                          try:
                              payload, _ = json.JSONDecoder().raw_decode(
                                  candidate
                              )
                          except Exception:
                              payload = None
                          scheduled_summary = {
                              'regexFields': regex_fields,
                              'rawPayloadRedacted': True,
                          }
                          if isinstance(payload, dict):
                              safe_scalar_fields = (
                                  'ok',
                                  'locked',
                                  'failClosed',
                                  'slateDateEt',
                                  'reason',
                                  'scheduledInvocation',
                                  'dailyCardComplete',
                                  'lockStatusComplete',
                                  'canonicalPredictionComplete',
                                  'manifestGameCount',
                                  'gameCount',
                                  'pullCount',
                              )
                              progress_payload = payload.get(
                                  'perGameLockProgress'
                              )
                              progress_payload = (
                                  progress_payload
                                  if isinstance(progress_payload, dict)
                                  else {}
                              )
                              progress_fields = (
                                  'manifestGameCount',
                                  'stagedCount',
                                  'canonicalCount',
                                  'lockedPredictionCount',
                                  'lockOutcomeCount',
                                  'noPredictionDataCount',
                                  'pendingCount',
                                  'stabilizingCount',
                                  'dueMissingCount',
                                  'missedCount',
                              )
                              failures_payload = payload.get('failures')
                              failures_payload = (
                                  failures_payload
                                  if isinstance(failures_payload, list)
                                  else []
                              )
                              scheduled_summary = {
                                  'regexFields': regex_fields,
                                  'payload': {
                                      key: payload.get(key)
                                      for key in safe_scalar_fields
                                      if key in payload
                                  },
                                  'progressCounters': {
                                      key: progress_payload.get(key)
                                      for key in progress_fields
                                      if key in progress_payload
                                  },
                                  'failureCount': len(failures_payload),
                                  'failureReasons': sorted(set(
                                      str(failure.get('reason') or '')[:160]
                                      for failure in failures_payload
                                      if isinstance(failure, dict)
                                      and failure.get('reason')
                                  )),
                                  'failureErrorCodes': sorted(set(
                                      str(error)[:160]
                                      for failure in failures_payload
                                      if isinstance(failure, dict)
                                      for error in (
                                          failure.get('errors')
                                          if isinstance(
                                              failure.get('errors'), list
                                          )
                                          else []
                                      )
                                      if re.fullmatch(
                                          r'[A-Za-z0-9_.:-]{1,160}',
                                          str(error),
                                      )
                                  ))[:40],
                                  'dailyLockAuthorityErrorCount': len(
                                      payload.get('dailyLockAuthorityErrors')
                                      if isinstance(
                                          payload.get(
                                              'dailyLockAuthorityErrors'
                                          ),
                                          list,
                                      )
                                      else []
                                  ),
                                  'rawPayloadRedacted': True,
                              }
                      safe_error_evidence.append({
                          'atUtc': datetime.fromtimestamp(
                              timestamp / 1000, tz=timezone.utc
                          ).isoformat().replace('+00:00', 'Z'),
                          'requestIdHash': (
                              hashlib.sha256(
                                  request_match.group(0).encode('utf-8')
                              ).hexdigest()[:12]
                              if request_match
                              else None
                          ),
                          'exceptionTypes': exception_types,
                          'typeErrorMessages': type_error_messages,
                          'traceFrames': frames[-12:],
                          'scheduledFailure': scheduled_summary,
                          'uppercaseCodes': uppercase_tokens[:40],
                          'knownLowerMarkers': lower_markers,
                          'rawMessageRedacted': True,
                      })
          starts.sort(key=lambda entry: entry['atUtc'])
          gaps = []
          for previous, current in zip(starts, starts[1:]):
              before = datetime.fromisoformat(
                  previous['atUtc'].replace('Z', '+00:00')
              )
              after = datetime.fromisoformat(
                  current['atUtc'].replace('Z', '+00:00')
              )
              seconds = int((after - before).total_seconds())
              if seconds > 90:
                  gaps.append({
                      'fromUtc': previous['atUtc'],
                      'toUtc': current['atUtc'],
                      'seconds': seconds,
                  })
          raw_lease = read('/tmp/r7-global-lease.json').get('Item') or {}
          lease = {key: decode(value) for key, value in raw_lease.items()}
          now_epoch = int(datetime.now(timezone.utc).timestamp())
          try:
              lease_expiry = int(lease.get('lease_expires_at_epoch'))
          except (TypeError, ValueError):
              lease_expiry = None
          safe_lease = {
              'present': bool(lease),
              'rawFieldNames': sorted(lease),
              'recordType': lease.get('record_type'),
              'version': lease.get('lease_version'),
              'executionMode': lease.get('execution_mode'),
              'slateDateEt': lease.get('slate_date_et'),
              'acquiredAtUtc': lease.get('lease_acquired_at_utc'),
              'expiresAtUtc': lease.get('lease_expires_at_utc'),
              'expiresAtEpoch': lease_expiry,
              'activeAtProbe': (
                  lease_expiry > now_epoch
                  if lease_expiry is not None
                  else None
              ),
              'ownerPresent': bool(lease.get('lease_owner')),
              'ownerRedacted': True,
          }
          lambda_metrics = {}
          for name in (
              'Invocations',
              'Errors',
              'Throttles',
              'ConcurrentExecutions',
              'Duration',
          ):
              statistic = (
                  'Maximum'
                  if name in {'ConcurrentExecutions', 'Duration'}
                  else 'Sum'
              )
              lambda_metrics[name] = metric(
                  f'/tmp/r7-lambda-{name}.json', statistic
              )
          event_metrics = {
              name: metric(f'/tmp/r7-events-{name}.json', 'Sum')
              for name in (
                  'Invocations',
                  'FailedInvocations',
                  'TriggeredRules',
                  'MatchedEvents',
              )
          }
          target_summary = [
              {
                  'id': target.get('Id'),
                  'arnMatchesFunction': (
                      str(target.get('Arn') or '')
                      == str(function.get('FunctionArn') or '')
                  ),
                  'inputPresent': bool(target.get('Input')),
                  'inputSha256': (
                      hashlib.sha256(
                          str(target.get('Input') or '').encode('utf-8')
                      ).hexdigest()
                      if target.get('Input')
                      else None
                  ),
                  'deadLetterConfigured': isinstance(
                      target.get('DeadLetterConfig'), dict
                  ),
                  'retryPolicy': target.get('RetryPolicy'),
              }
              for target in targets
          ]
          result = {
              'ok': True,
              'proofType': 'R7_EVENTBRIDGE_LAMBDA_LEASE_EXACT_READ_ONLY',
              'observedAtUtc': datetime.now(
                  timezone.utc
              ).isoformat().replace('+00:00', 'Z'),
              'window': {
                  'startUtc': os.environ['WINDOW_START'],
                  'endUtc': os.environ['WINDOW_END'],
              },
              'eventBridge': {
                  'ruleName': os.environ['RULE_NAME'],
                  'state': rule.get('State'),
                  'scheduleExpression': rule.get('ScheduleExpression'),
                  'managedBy': rule.get('ManagedBy'),
                  'targetCount': len(targets),
                  'targets': target_summary,
                  'metrics': event_metrics,
              },
              'lambda': {
                  'functionName': os.environ['FUNCTION_NAME'],
                  'state': function.get('State'),
                  'lastUpdateStatus': function.get('LastUpdateStatus'),
                  'lastModified': function.get('LastModified'),
                  'runtime': function.get('Runtime'),
                  'handler': function.get('Handler'),
                  'timeoutSeconds': function.get('Timeout'),
                  'memorySizeMb': function.get('MemorySize'),
                  'reservedConcurrentExecutions': concurrency.get(
                      'ReservedConcurrentExecutions'
                  ),
                  'eventInvokeConfig': {
                      'maximumEventAgeInSeconds': event_config.get(
                          'MaximumEventAgeInSeconds'
                      ),
                      'maximumRetryAttempts': event_config.get(
                          'MaximumRetryAttempts'
                      ),
                  },
                  'metrics': lambda_metrics,
                  'logEvidence': {
                      'rawEventCount': len(logs),
                      'uniqueRequestIdCount': len(request_ids),
                      'startCount': len(starts),
                      'endCount': len(ends),
                      'reportCount': len(reports),
                      'starts': starts,
                      'reports': reports,
                      'gapsOver90Seconds': gaps,
                      'markerCounts': marker_counts,
                      'safeErrorEvidence': safe_error_evidence,
                      'rawMessagesRedacted': True,
                  },
              },
              'globalLease': safe_lease,
              'tableWritesAttempted': 0,
              'lambdaInvocationsAttempted': 0,
              'eventBridgeMutationsAttempted': 0,
              'leaseMutationsAttempted': 0,
              'readOnly': True,
          }
          print(json.dumps(result, indent=2, sort_keys=True, default=str))
          PY

      - name: Strong-read exact cooperative queue item and print bounded proof
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RAW_PATH="/tmp/r7-cooperative-queue-${GITHUB_RUN_ID}.json"
          aws dynamodb get-item \
            --table-name "$SNAPSHOTS_TABLE" \
            --key '{"PK":{"S":"MLB_LOCK_EXECUTION#V1"},"SK":{"S":"COOPERATIVE_TERMINAL_REPLAY#V1"}}' \
            --consistent-read \
            --return-consumed-capacity NONE \
            --region "$AWS_REGION" \
            --output json > "$RAW_PATH"
          RAW_PATH="$RAW_PATH" python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone

          def decode(value):
              if not isinstance(value, dict) or len(value) != 1:
                  return None
              kind, raw = next(iter(value.items()))
              if kind == 'S':
                  return raw
              if kind == 'N':
                  text = str(raw)
                  try:
                      return int(text)
                  except ValueError:
                      try:
                          return float(text)
                      except ValueError:
                          return text
              if kind == 'BOOL':
                  return bool(raw)
              if kind == 'NULL':
                  return None
              if kind == 'M':
                  return {key: decode(entry) for key, entry in raw.items()}
