              patch.history_contract.canonicalize_pull_slots(
                  pulls,
                  sport='mlb',
              )
          )
          slot_representatives = [
              pull
              for pull in canonical_full_pulls
              if (
                  patch.history_contract.pull_slot_start(
                      pull.get('pulled_at')
                  )
                  == source_slot
              )
          ]
          canonical_source_matches = [
              pull
              for pull in slot_representatives
              if (
                  str(pull.get('pull_id') or '') == source_pull_id
                  and patch._pull_at(module, pull) == source_pull_at
              )
          ]
          raw_source_matches = []
          for representative in slot_representatives:
              for raw_pull in (
                  representative.get('_canonicalSlotRawPulls') or []
              ):
                  if not isinstance(raw_pull, dict):
                      continue
                  if (
                      str(raw_pull.get('pull_id') or '')
                      == source_pull_id
                      and patch._pull_at(module, raw_pull)
                      == source_pull_at
                  ):
                      raw_source_matches.append(raw_pull)
          representative = (
              slot_representatives[0]
              if len(slot_representatives) == 1
              else {}
          )
          slot_metadata = (
              representative.get('canonicalPullSlot') or {}
              if isinstance(representative, dict)
              else {}
          )
          source_binding = {
              'predictionSourcePullId': source_pull_id or None,
              'predictionSourcePullAtUtc': (
                  source_pull_at.isoformat()
                  if source_pull_at is not None
                  else None
              ),
              'canonicalSlotStartUtc': (
                  source_slot.isoformat()
                  if source_slot is not None
                  else None
              ),
              'canonicalSlotRepresentativeCount': len(
                  slot_representatives
              ),
              'canonicalSlotRepresentativePullId': (
                  str(representative.get('pull_id') or '')
                  if isinstance(representative, dict)
                  else None
              ),
              'canonicalSlotMetadataPullId': (
                  slot_metadata.get('canonicalPullId')
              ),
              'sourceIsCanonicalSlotRepresentative': (
                  len(canonical_source_matches) == 1
              ),
              'sourceRawVariantMatchCount': len(raw_source_matches),
              'sourceIsOnlyLegacyRawVariant': bool(
                  raw_source_matches
                  and not canonical_source_matches
              ),
              'slotRawPullCount': slot_metadata.get('rawPullCount'),
              'slotDuplicatePullCount': slot_metadata.get(
                  'duplicatePullCount'
              ),
              'slotContaminated': slot_metadata.get(
                  'contaminated'
              ),
          }
          target_identity = {
              'manifestPrimaryIdentity': identities[game_index],
              'manifestIdentityOptions': identity_options[game_index],
              'manifestRawGameId': (
                  game.get('game_id')
                  or game.get('gameId')
                  or game.get('id')
              ),
              'manifestProviderEventId': (
                  game.get('provider_event_id')
                  or game.get('providerEventId')
              ),
              'manifestOfficialGamePk': (
                  game.get('official_game_pk')
                  or game.get('officialGamePk')
              ),
              'candidateGameIdentity': proof_map.get(
                  'candidateGameIdentity'
              ),
              'stageGameIdentity': proof_map.get(
                  'stageGameIdentity'
              ),
              'identityBindingMode': proof_map.get(
                  'identityBindingMode'
              ),
          }

          proof_summary = None
          if isinstance(proof, dict):
              proof_summary = {
                  key: proof.get(key)
                  for key in (
                      'version',
                      'recordType',
                      'snapshotVersion',
                      'snapshotRole',
                      'publicAuthorityVersion',
                      'userVisible',
                      'displayPrediction',
                      'displayStatus',
                      'displaySurface',
                      'signalPolicyVersion',
                      'predictionCreatedAtUtc',
                      'predictionPersistedAtUtc',
                      'persistenceProofType',
                      'predictionPayloadFingerprintVersion',
                      'candidateSnapshotFingerprint',
                      'predictionSourcePullId',
                      'predictionSourcePullAtUtc',
                      'predictionSourceCanonicalSlotStartUtc',
                      'predictionSourcePullStoragePk',
                      'predictionSourcePullStorageSk',
                      'predictionSourcePullFingerprint',
                      'sourceAgeAtCutoffMinutes',
                      'evaluationCutoffAtUtc',
                      'sourceAtOrBeforeCutoff',
                      'createdAtOrBeforeCutoff',
                      'persistedAtOrBeforeCutoff',
                      'candidateRowFingerprint',
                      'candidateSelectionFingerprint',
                      'candidateVectorFingerprint',
                      'identityBindingMode',
                      'rejectedNewerCandidateCount',
                      'modelOrSignalRecomputedAtLock',
                  )
              }
              proof_summary['candidateIdentityFingerprint'] = digest(
                  proof.get('candidateGameIdentity')
              )
              proof_summary['stageIdentityFingerprint'] = digest(
                  proof.get('stageGameIdentity')
              )

          game_start = patch._start(module, game)
          lock_at = patch._lock_at(module, game)
          result = {
              'ok': True,
              'proofType': 'R7_PRELOCK_CANDIDATE_EXACT_READ_ONLY_CLASSIFICATION',
              'observedAtUtc': datetime.now(
                  timezone.utc
              ).isoformat().replace('+00:00', 'Z'),
              'sourceRunId': os.environ.get('GITHUB_RUN_ID'),
              'readOnly': True,
              'hardSdkGuardInstalledBeforeRepositoryImport': True,
              'allowedAwsServices': ['dynamodb'],
              'allowedDynamoDbOperations': sorted(allowed_dynamodb),
              'awsOperationCounts': dict(sorted(operation_counts.items())),
              'lambdaInvocationsAttempted': 0,
              'tableWritesAttempted': 0,
              'leaseMutationsAttempted': 0,
              'queueBinding': {
                  'state': queue.get('state'),
                  'lastAttemptAtUtc': attempt.get('atUtc'),
                  'lastAttemptStage': attempt.get('stage'),
                  'lastAttemptStatus': attempt.get('status'),
                  'lastAttemptErrorCode': attempt.get('errorCode'),
                  'gameIndex': game_index,
                  'progressCheckpointFingerprint': progress.get(
                      'checkpointFingerprint'
                  ),
                  'progressManifestFingerprint': progress.get(
                      'manifestFingerprint'
                  ),
                  'recomputedManifestFingerprint': manifest_fingerprint,
                  'manifestFingerprintMatchesCheckpoint': (
                      manifest_fingerprint
                      == str(progress.get('manifestFingerprint') or '')
                  ),
                  'requestIdMatchedInternally': (
                      str(progress.get('requestId') or '')
                      == str(queue.get('request_id') or '')
                      and bool(queue.get('request_id'))
                  ),
                  'requestEpochMatchedInternally': (
                      int(progress.get('requestEpoch') or 0)
                      == int(queue.get('requested_at_epoch') or 0)
                      and int(queue.get('requested_at_epoch') or 0) > 0
                  ),
                  'requestIdentifiersRedacted': True,
              },
              'target': {
                  'slateDateEt': slate,
                  'manifestGameCount': len(manifest),
                  'gameIndex': game_index,
                  'gameIdentityFingerprint': digest(identities[game_index]),
                  'identityOptionCount': len(identity_options[game_index]),
                  'identityOptionsRedacted': True,
                  'gameStartUtc': iso(game_start),
                  'scheduledLockAtUtc': iso(lock_at),
                  'scoringPullCount': len(scoring),
              },
              'authority': {
                  'version': selected_authority.get('version'),
                  'recordType': selected_authority.get('recordType'),
                  'observedAtUtc': selected_authority.get('observedAtUtc'),
                  'gameCount': selected_authority.get('gameCount'),
                  'fingerprint': selected_authority.get('fingerprint'),
                  'immutable': selected_authority.get('immutable'),
                  'writeOnce': selected_authority.get('writeOnce'),
                  'consistentReadVerified': selected_authority.get(
                      'consistentReadVerified'
                  ),
                  'authorityEvidenceFingerprint': manifest_authority.get(
                      'authorityEvidenceFingerprint'
                  ),
                  'scheduleRevisionAuthorityVersion': (
                      (
                          manifest_authority.get(
                              'scheduleRevisionAuthority'
                          )
                          or {}
                      ).get('version')
                  ),
                  'scheduleRevisionAuthorityFingerprint': (
                      (
                          manifest_authority.get(
                              'scheduleRevisionAuthority'
                          )
                          or {}
                      ).get('fingerprint')
                  ),
                  'authorityKeysRedacted': True,
              },
              'classification': {
                  'candidatePresent': isinstance(candidate, dict),
                  'candidateProofPresent': isinstance(proof, dict),
                  'boundScoringPullCount': len(bound or []),
                  'candidateErrors': safe_errors,
                  'candidateErrorCount': len(safe_errors),
                  'provenAbsence': bool(
                      candidate is None
                      and proof is None
                      and not bound
                      and patch._is_no_prediction_candidate_failure(errors)
                  ),
                  'reproducesLiveFailure': bool(
                      not (
                          candidate is None
                          and proof is None
                          and not bound
                          and patch._is_no_prediction_candidate_failure(errors)
                      )
                  ),
                  'candidateQueryItemCount': len(candidate_items),
                  'candidateQueryItems': candidate_summaries[:8],
                  'candidateQueryTruncated': len(candidate_summaries) > 8,
                  'candidatePayloadRedacted': True,
                  'candidateIdentityRedacted': True,
                  'proofSummary': proof_summary,
                  'sourceBinding': source_binding,
                  'targetIdentity': target_identity,
              },
              'safety': {
                  'postStartPredictionCreationAllowed': False,
                  'immutablePredictionRewriteAllowed': False,
                  'productionAuthorityChanged': False,
                  'rawGamePayloadPrinted': False,
                  'rawCandidatePayloadPrinted': False,
                  'secretExposed': False,
              },
          }
          print(json.dumps(result, indent=2, sort_keys=True, default=str))
          if not result['queueBinding']['manifestFingerprintMatchesCheckpoint']:
              raise SystemExit('Live manifest no longer matches the checkpoint')
          if not result['classification']['reproducesLiveFailure']:
              raise SystemExit('Live prelock classification changed during probe')
          PY
