name: Fix MLB trainer verification fixture

on:
  push:
    branches: [main]
    paths:
      - ".github/mlb-trainer-fixture-trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Align trainer test fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/test_mlb_trainer_deploy_response.py')
          text = path.read_text(encoding='utf-8')
          old = '        "runtimeAuthorityActivationAvailable": False,'
          new = '        "runtimeAuthorityActivationAvailable": True,'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run deployment regression group
        run: |
          python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9" "PyYAML>=6,<7"
          python -m pytest -q tests/unit/test_mlb_trainer_deploy_response.py tests/unit/test_mlb_deploy_identity.py tests/unit/test_mlb_production_acceptance.py
          python -m py_compile scripts/verify_mlb_trainer_deploy_response.py
      - name: Commit verified fixture repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_mlb_trainer_deploy_response.py
          git commit -m "Align MLB trainer authority test fixture"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
