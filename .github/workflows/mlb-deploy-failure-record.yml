name: Record MLB Deploy Failure

on:
  workflow_run:
    workflows: ["Deploy SAM to AWS"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: mlb-deploy-failure-record
  cancel-in-progress: true

jobs:
  record:
    # A cancelled, skipped, neutral, or stale run did not prove deployment
    # failure and must not overwrite the last verified scoring acceptance.
    # Only terminal failure conclusions publish a negative proof.
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'action_required' ||
       github.event.workflow_run.conclusion == 'startup_failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write deployment failure proof
        env:
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          conclusion = os.environ.get('DEPLOY_CONCLUSION')
          terminal_conclusions = {
              'failure',
              'timed_out',
              'action_required',
              'startup_failure',
          }
          if conclusion not in terminal_conclusions:
              raise SystemExit(
                  f'non-terminal deploy conclusion cannot publish failure proof: {conclusion}'
              )
          report = {
              'ok': False,
              'proofType': 'MLB_SCORING_FIX_POST_DEPLOY_ACCEPTANCE',
              'version': 'MLB-SCORING-FIX-POST-DEPLOY-v2-terminal-failures-only',
              'createdAtUtc': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'deployedCommit': os.environ.get('DEPLOY_HEAD_SHA'),
              'deployWorkflowConclusion': conclusion,
              'deployWorkflowRunId': os.environ.get('DEPLOY_RUN_ID'),
              'deployWorkflowRunUrl': os.environ.get('DEPLOY_RUN_URL'),
              'terminalDeployFailure': True,
              'nonTerminalCancellationIsFailure': False,
              'scoringGuardPassed': False,
              'blockers': [f'deploy_workflow_terminal_{conclusion}'],
              'secretExposed': False,
          }
          Path('runtime_reports/mlb_scoring_fix_post_deploy_latest.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Publish deployment failure proof
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_reports/mlb_scoring_fix_post_deploy_latest.json
          git commit -m 'Publish MLB scoring fix deployment failure proof'
          git pull --rebase --autostash origin main
          git push origin HEAD:main