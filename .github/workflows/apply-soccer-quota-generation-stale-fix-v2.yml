name: Apply Soccer Quota Generation-Stale Fix V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-soccer-quota-generation-stale-fix-v2.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Soccer-only repair
        run: python scripts/apply_soccer_quota_generation_stale_fix_v2.py
      - name: Run focused Soccer tests
        run: |
          python -m py_compile soccer_auto/collector.py
          pytest -q tests/soccer_auto/test_quota_backpressure.py tests/soccer_auto/test_collection_gate.py tests/soccer_auto/test_coverage_reconciliation.py
      - name: Commit repair and remove one-shot files
        run: |
          rm -f scripts/apply_soccer_quota_generation_stale_fix_v2.py
          rm -f .github/workflows/apply-soccer-quota-generation-stale-fix-v2.yml
          git config user.name 'Kurt Soccer Repair Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add soccer_auto/collector.py tests/soccer_auto/test_quota_backpressure.py scripts/apply_soccer_quota_generation_stale_fix_v2.py .github/workflows/apply-soccer-quota-generation-stale-fix-v2.yml
          git commit -m 'Fix Soccer quota-deferred discovery generation evidence'
          git push origin HEAD:main
