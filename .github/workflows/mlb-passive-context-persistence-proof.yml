name: MLB Passive Context Persistence Proof
on:
  pull_request:
    branches: [main]
    paths: ['scripts/verify_mlb_team_context.py','tests/unit/test_mlb_team_context_persistence_proof.py','.github/workflows/mlb-passive-context-persistence-proof.yml']
  push:
    branches: [main]
    paths: ['scripts/verify_mlb_team_context.py','tests/unit/test_mlb_team_context_persistence_proof.py','.github/workflows/mlb-passive-context-persistence-proof.yml']
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'pytest>=8,<9' 'boto3>=1.34,<2'
      - run: |
          python -m pytest -q tests/unit/test_mlb_team_context_persistence_proof.py tests/unit/test_mlb_statsapi_team_context.py
          python -m py_compile scripts/verify_mlb_team_context.py
  live-read:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'boto3>=1.34,<2'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: rm -f runtime_reports/mlb_team_context_live_proof_latest.json
      - name: Read official source and strongly consistent persisted rows
        env:
          PROOF_SOURCE_SHA: ${{ github.sha }}
        run: python scripts/verify_mlb_team_context.py --persisted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-passive-context-persistence-${{ github.run_id }}
          path: runtime_reports/mlb_team_context_live_proof_latest.json
          if-no-files-found: error
          retention-days: 30
