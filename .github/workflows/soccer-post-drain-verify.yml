name: Soccer Post Drain Verify
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/soccer-post-drain-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Verify queue after SQS propagation and exercise current cycle
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          stack=parlay-platform-soccer-auto
          physical() { aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id "$1" --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text; }
          sleep 20
          main=$(physical SoccerCollectionQueue); dlq=$(physical SoccerCollectionDeadLetterQueue)
          main_url="$main"; [[ "$main" != http* ]] && main_url=$(aws sqs get-queue-url --queue-name "$main" --region "$REGION" --query QueueUrl --output text)
          dlq_url="$dlq"; [[ "$dlq" != http* ]] && dlq_url=$(aws sqs get-queue-url --queue-name "$dlq" --region "$REGION" --query QueueUrl --output text)
          aws sqs get-queue-attributes --queue-url "$main_url" --region "$REGION" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed --output json >/tmp/main.json
          aws sqs get-queue-attributes --queue-url "$dlq_url" --region "$REGION" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed --output json >/tmp/dlq.json
          dispatch=$(physical SoccerDispatchFunction); freeze=$(physical SoccerFreezeFunction); controller=$(physical SoccerControllerFunction); worker=$(physical SoccerCollectionWorkerFunction)
          aws lambda invoke --function-name "$dispatch" --region "$REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"post_drain_verify_dispatch"}' /tmp/dispatch.json >/tmp/dispatch-meta.json
          sleep 45
          aws lambda invoke --function-name "$freeze" --region "$REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"post_drain_verify_freeze"}' /tmp/freeze.json >/tmp/freeze-meta.json
          aws lambda invoke --function-name "$controller" --region "$REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"post_drain_verify_controller"}' /tmp/controller.json >/tmp/controller-meta.json
          status_url=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='SoccerAutoStatusUrl'].OutputValue" --output text)
          curl --fail --silent --show-error --max-time 60 "$status_url" >/tmp/status.json
          start_ms=$(( ($(date +%s)-600)*1000 ))
          aws logs filter-log-events --log-group-name "/aws/lambda/$worker" --region "$REGION" --start-time "$start_ms" --filter-pattern '?Unauthorized ?HTTP_401 ?DISTRIBUTED_RATE_LIMIT_CONTENTION' --limit 100 --output json >/tmp/targeted.json || echo '{"events":[]}' >/tmp/targeted.json
          aws lambda get-function-configuration --function-name "$worker" --region "$REGION" --query '{Handler:Handler,State:State,LastUpdateStatus:LastUpdateStatus,LastModified:LastModified}' --output json >/tmp/worker.json
          mapping=$(aws lambda list-event-source-mappings --function-name "$worker" --region "$REGION" --query 'EventSourceMappings[0].UUID' --output text)
          aws lambda get-event-source-mapping --uuid "$mapping" --region "$REGION" --query '{State:State,ScalingConfig:ScalingConfig,FunctionResponseTypes:FunctionResponseTypes}' --output json >/tmp/mapping.json
          python - <<'PY'
          import json,pathlib,datetime
          load=lambda p: json.load(open(p))
          main=load('/tmp/main.json'); dlq=load('/tmp/dlq.json'); status=load('/tmp/status.json'); worker=load('/tmp/worker.json'); mapping=load('/tmp/mapping.json'); targeted=load('/tmp/targeted.json')
          da=dlq.get('Attributes') or {}; ma=main.get('Attributes') or {}
          report={'proofType':'SOCCER_POST_DRAIN_VERIFY','observedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'mainQueue':main,'deadLetterQueue':dlq,'worker':worker,'mapping':mapping,'dispatch':load('/tmp/dispatch.json'),'freeze':load('/tmp/freeze.json'),'controller':load('/tmp/controller.json'),'publicStatus':status,'targetedWorkerEvents':targeted.get('events') or []}
          report['dlqClear']=int(da.get('ApproximateNumberOfMessages') or 0)==0 and int(da.get('ApproximateNumberOfMessagesNotVisible') or 0)==0 and int(da.get('ApproximateNumberOfMessagesDelayed') or 0)==0
          report['workerHealthy']=worker.get('Handler')=='soccer_auto.collector.worker_handler' and worker.get('State')=='Active' and worker.get('LastUpdateStatus')=='Successful'
          report['mappingHealthy']=mapping.get('State')=='Enabled' and int((mapping.get('ScalingConfig') or {}).get('MaximumConcurrency') or 0)==3
          report['noTargetedWorkerErrors']=len(report['targetedWorkerEvents'])==0
          pathlib.Path('runtime_reports/soccer_post_drain_verify_latest.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
          print(json.dumps(report,indent=2,default=str))
          assert report['dlqClear'], report
          assert report['workerHealthy'], report
          assert report['mappingHealthy'], report
          PY
      - name: Publish verification
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add runtime_reports/soccer_post_drain_verify_latest.json
          git commit -m 'runtime: publish Soccer post-drain verification [skip ci]' || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase origin main && git push origin HEAD:main && exit 0 || { git rebase --abort 2>/dev/null || true; sleep $((i*2)); }; done
          exit 1
