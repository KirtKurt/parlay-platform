name: Dispatch MLB R7 continuity repair now

"on":
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-mlb-r7-continuity-chatgpt-20260825-01
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing MLB continuity repair on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run repair-mlb-training-continuity-now.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo 'Dispatched Repair MLB training continuity now on main.'
