name: Retire Superseded MLB Runtime Watch V1 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-mlb-three-source-runtime-watch-v1-once.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Remove superseded workflow and one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/mlb-three-source-runtime-watch.yml
          rm -f .github/workflows/retire-mlb-three-source-runtime-watch-v1-once.yml

      - name: Commit cleanup without triggering unrelated workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Retire superseded MLB runtime watchdog [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
