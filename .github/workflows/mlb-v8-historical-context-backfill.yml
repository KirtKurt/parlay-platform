name: MLB V8 Historical Point-In-Time Context Backfill

"on":
  pull_request:
    paths:
      - '.github/workflows/mlb-v8-historical-context-backfill.yml'
      - 'scripts/run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'hello_world/mlb_v8_historical_point_in_time_context_v1.py'
      - 'hello_world/mlb_v8_historical_context_overlay_v1.py'
      - 'tests/unit/test_mlb_v8_historical_context_overlay_v1.py'
      - 'tests/unit/test_mlb_v8_historical_point_in_time_context_v1.py'
      - 'tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'tests/unit/test_mlb_v8_historical_context_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-historical-context-backfill.yml'
      - 'scripts/run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'hello_world/mlb_v8_historical_point_in_time_context_v1.py'
      - 'hello_world/mlb_v8_historical_context_overlay_v1.py'
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Canonical target games attempted in this bounded run
        required: false
        default: '5'

permissions:
  contents: write
  actions: write

concurrency:
  group: mlb-v8-historical-context-backfill
  cancel-in-progress: false

env:
  PYTHONPATH: .:hello_world:scripts
  HISTORICAL_STACK: parlay-platform-mlb-historical-optimizer
  FUNDAMENTALS_STACK: parlay-platform-mlb-v8-fundamentals-shadow
  TABLE_NAME: parlay_platform_snapshots
  CONTEXT_REPORT: runtime_reports/mlb_v8_historical_context_backfill_latest.json

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate official/internal context path
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'numpy>=1.26,<3' 'pytest>=8,<9'
          python -m py_compile \
            hello_world/mlb_v8_historical_point_in_time_context_v1.py \
            hello_world/mlb_v8_historical_context_overlay_v1.py \
            scripts/run_mlb_v8_historical_context_backfill_entrypoint.py
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_v8_historical_context_overlay_v1.py \
            tests/unit/test_mlb_v8_historical_point_in_time_context_v1.py \
            tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py \
            tests/unit/test_mlb_v8_historical_context_workflow.py
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/mlb-v8-historical-context-backfill.yml').read_text()
          entrypoint = Path('scripts/run_mlb_v8_historical_context_backfill_entrypoint.py').read_text()
          retired = (
              'BBS' + '_API_KEY',
              'BBS' + '_API_SECRET_ARN',
              'api.' + 'bigballsdata.com',
          )
          for token in retired:
              assert token not in entrypoint, token
          assert "default: '5'" in workflow
          assert "inputs.limit || '5'" in workflow
          assert "cron: '12,27,42,57 * * * *'" in workflow
          assert 'bbsApiUsed' in entrypoint
          assert '"official_mlb"' in entrypoint
          assert 'client_factory' in entrypoint
          assert 'cancel-in-progress: false' in workflow
          PY

  backfill:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Install runtime dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'numpy>=1.26,<3'
      - name: Populate official point-in-time context
        id: backfill
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          REQUESTED_LIMIT: ${{ inputs.limit || '5' }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          timeout --signal=TERM --kill-after=45s 40m \
            python scripts/run_mlb_v8_historical_context_backfill_entrypoint.py \
              --region "$AWS_REGION_VALUE" \
              --table-name "$TABLE_NAME" \
              --historical-stack "$HISTORICAL_STACK" \
              --fundamentals-stack "$FUNDAMENTALS_STACK" \
              --limit "$REQUESTED_LIMIT" \
              --output "$CONTEXT_REPORT" \
              2>&1 | tee /tmp/mlb-v8-historical-context-backfill.log
      - name: Verify no-BBD evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path(os.environ['CONTEXT_REPORT']).read_text())
          assert value.get('authority') == 'V8_HISTORICAL_OFFICIAL_CONTEXT_SHADOW_ONLY', value
          assert value.get('provider') == 'official_mlb_plus_internal_canonical_context', value
          assert value.get('bbsApiUsed') is False, value
          assert value.get('bbsCredentialRead') is False, value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('selectionUsedOutcomes') is False, value
          assert value.get('targetGameOutcomeUsed') is False, value
          assert value.get('sameDayResultsExcluded') is True, value
          assert value.get('automaticWagerAllowed') is False, value
          assert value.get('ok') is True, value
          assert 0 <= int(value.get('selectedGameCount') or 0) <= 5, value
          PY
          cp "$CONTEXT_REPORT" /tmp/mlb-v8-historical-context-backfill.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v8-historical-official-context-${{ github.run_id }}
          path: |
            runtime_reports/mlb_v8_historical_context_backfill_latest.json
            /tmp/mlb-v8-historical-context-backfill.json
            /tmp/mlb-v8-historical-context-backfill.log
          retention-days: 90
          if-no-files-found: warn
      - name: Publish context evidence monotonically
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$CONTEXT_REPORT" /tmp/context-candidate.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v8-historical-context-proof origin/main
            git reset --hard origin/main
            git clean -fd
            mkdir -p runtime_reports
            python scripts/publish_monotonic_json.py \
              --candidate /tmp/context-candidate.json \
              --existing "$CONTEXT_REPORT" \
              --output "$CONTEXT_REPORT"
            git add "$CONTEXT_REPORT"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V8 official historical context evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
