name: MLB V8 Historical Point-In-Time Context Backfill

"on":
  pull_request:
    paths:
      - '.github/workflows/mlb-v8-historical-context-backfill.yml'
      - 'hello_world/mlb_supervised_daily_objective_v2_1.py'
      - 'hello_world/mlb_v8_historical_context_overlay_v1.py'
      - 'hello_world/mlb_v8_historical_point_in_time_context_v1.py'
      - 'scripts/run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'tests/unit/test_mlb_v8_historical_context_overlay_v1.py'
      - 'tests/unit/test_mlb_v8_historical_point_in_time_context_v1.py'
      - 'tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'tests/unit/test_mlb_v8_historical_context_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-historical-context-backfill.yml'
      - 'hello_world/mlb_supervised_daily_objective_v2_1.py'
      - 'hello_world/mlb_v8_historical_context_overlay_v1.py'
      - 'hello_world/mlb_v8_historical_point_in_time_context_v1.py'
      - 'scripts/run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'tests/unit/test_mlb_v8_historical_context_overlay_v1.py'
      - 'tests/unit/test_mlb_v8_historical_point_in_time_context_v1.py'
      - 'tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'tests/unit/test_mlb_v8_historical_context_workflow.py'
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Canonical target games attempted in this bounded run
        required: false
        default: '10'

permissions:
  contents: write
  actions: write

concurrency:
  group: mlb-v8-historical-context-backfill
  cancel-in-progress: true

env:
  PYTHONPATH: .:hello_world:scripts
  HISTORICAL_STACK: parlay-platform-mlb-historical-optimizer
  FUNDAMENTALS_STACK: parlay-platform-mlb-v8-fundamentals-shadow
  TABLE_NAME: parlay_platform_snapshots
  CONTEXT_REPORT: runtime_reports/mlb_v8_historical_context_backfill_latest.json
  SETTLED_REPORT: runtime_reports/mlb_historical_settled_horizon_advance_latest.json

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate point-in-time context and unchanged guards
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'numpy>=1.26,<3' 'pytest>=8,<9'
          python -m py_compile \
            hello_world/mlb_supervised_daily_objective_v2_1.py \
            hello_world/mlb_v8_historical_context_overlay_v1.py \
            hello_world/mlb_v8_historical_point_in_time_context_v1.py \
            scripts/run_mlb_v8_historical_context_backfill_entrypoint.py
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_v8_historical_context_overlay_v1.py \
            tests/unit/test_mlb_v8_historical_point_in_time_context_v1.py \
            tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py \
            tests/unit/test_mlb_v8_historical_context_workflow.py \
            tests/unit/test_mlb_supervised_daily_objective_bbs_overlay.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_3.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_6.py
          python - <<'PY'
          import mlb_supervised_selection_guard_v2_3 as guard
          assert guard.MIN_OOF_ACCURACY_UPLIFT == 0.005
          assert guard.MIN_OOF_NET_CORRECT == 3
          assert guard.MAX_WORST_FOLD_ACCURACY_REGRESSION == 0.01
          assert guard.MIN_POSITIVE_FOLD_RATIO == 2.0 / 3.0
          assert guard.MIN_FUNDAMENTALS_COVERAGE == 0.50
          assert guard.MIN_BBS_PRIOR_COVERAGE == 0.50
          PY

  backfill-and-advance:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Install runtime dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'numpy>=1.26,<3'
      - name: Populate target-game context
        id: backfill
        continue-on-error: true
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          REQUESTED_LIMIT: ${{ inputs.limit || '10' }}
          BBS_HISTORICAL_REQUEST_DELAY_SECONDS: '1.0'
        run: |
          set +e
          mkdir -p runtime_reports
          python scripts/run_mlb_v8_historical_context_backfill_entrypoint.py \
            --region "$AWS_REGION_VALUE" \
            --table-name "$TABLE_NAME" \
            --historical-stack "$HISTORICAL_STACK" \
            --fundamentals-stack "$FUNDAMENTALS_STACK" \
            --limit "$REQUESTED_LIMIT" \
            --output "$CONTEXT_REPORT" \
            2>&1 | tee /tmp/mlb-v8-historical-context-backfill.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Ensure durable fail-closed context evidence
        if: always()
        env:
          BACKFILL_OUTCOME: ${{ steps.backfill.outcome }}
          BACKFILL_EXIT_CODE: ${{ steps.backfill.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$CONTEXT_REPORT"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-v8-historical-context-backfill.log').read_text(errors='replace')[-12000:] if Path('/tmp/mlb-v8-historical-context-backfill.log').exists() else ''
          report={
              'ok':False,
              'proofType':'MLB_V8_HISTORICAL_CONTEXT_BACKFILL',
              'version':'MLB-V8-HISTORICAL-CONTEXT-BACKFILL-v1-isolated-pointer',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'authority':'V8_HISTORICAL_BBS_SHADOW_ONLY',
              'productionAuthorityChanged':False,
              'selectionUsedOutcomes':False,
              'targetGameOutcomeUsed':False,
              'sameDayResultsExcluded':True,
              'backfillOutcome':os.environ.get('BACKFILL_OUTCOME'),
              'backfillExitCode':os.environ.get('BACKFILL_EXIT_CODE'),
              'errorLogTail':log,
              'blockers':['historical_context_execution_failed_before_report'],
          }
          Path(os.environ['CONTEXT_REPORT']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$CONTEXT_REPORT" >/dev/null
          cp "$CONTEXT_REPORT" /tmp/mlb-v8-historical-context-backfill.json
      - name: Advance settled corpus through canonical optimizer authority
        if: always()
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$HISTORICAL_STACK" \
            --region "$AWS_REGION_VALUE" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" \
            --output text)
          test -n "$FUNCTION_NAME" && test "$FUNCTION_NAME" != None
          invoke() {
            local payload="$1" output="$2"
            aws lambda invoke \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION_VALUE" \
              --cli-read-timeout 900 \
              --cli-binary-format raw-in-base64-out \
              --payload "$payload" "$output" >/tmp/invoke-meta.json
          }
          invoke '{"mode":"status","run":"mlb_v8_context_settled_before"}' /tmp/settled-before.json
          set +e
          invoke '{"mode":"orchestrate","run":"mlb_v8_context_settled_advance"}' /tmp/settled-orchestrate.json
          orchestrate_status=$?
          set -e
          invoke '{"mode":"status","run":"mlb_v8_context_settled_after"}' /tmp/settled-after.json
          ORCHESTRATE_STATUS="$orchestrate_status" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          before=json.load(open('/tmp/settled-before.json'))
          after=json.load(open('/tmp/settled-after.json'))
          b=before.get('state') or {}
          a=after.get('state') or {}
          def i(value):
              try: return int(value or 0)
              except Exception: return 0
          deltas={
              'eligibleGameDelta':i(a.get('eligibleGameCount'))-i(b.get('eligibleGameCount')),
              'completeSlateDelta':i(a.get('completeSlateCount'))-i(b.get('completeSlateCount')),
              'networkRequestDelta':i(a.get('networkRequestCount'))-i(b.get('networkRequestCount')),
              'revisionDelta':i(a.get('revision'))-i(b.get('revision')),
              'dateChanged':a.get('currentDate')!=b.get('currentDate'),
              'slotChanged':a.get('currentSlotIndex')!=b.get('currentSlotIndex'),
              'phaseChanged':a.get('phase')!=b.get('phase'),
          }
          advanced=any((deltas['eligibleGameDelta']>0,deltas['completeSlateDelta']>0,deltas['dateChanged'],deltas['slotChanged']))
          blockers=[]
          if before.get('ok') is not True: blockers.append('before_status_not_ok')
          if after.get('ok') is not True: blockers.append('after_status_not_ok')
          if int(os.environ.get('ORCHESTRATE_STATUS') or 1) != 0: blockers.append('orchestrate_invoke_failed')
          if a.get('lastError'): blockers.append('optimizer_last_error_present')
          report={
              'proofType':'MLB_HISTORICAL_SETTLED_HORIZON_ADVANCE_V1',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'authority':'CANONICAL_V7_HISTORICAL_OPTIMIZER',
              'orchestrateInvoked':True,
              'advanced':advanced,
              'stalledStage':None if advanced else a.get('phase'),
              'before':{k:b.get(k) for k in ('phase','currentDate','currentSlotIndex','eligibleGameCount','completeSlateCount','networkRequestCount','revision','optimizationRound','lastError')},
              'after':{k:a.get(k) for k in ('phase','currentDate','currentSlotIndex','eligibleGameCount','completeSlateCount','networkRequestCount','revision','optimizationRound','lastError')},
              'deltas':deltas,
              'blockers':blockers,
              'manualCursorMutation':False,
              'productionAuthorityChanged':False,
              'ok':not blockers,
          }
          Path(os.environ['SETTLED_REPORT']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          cp "$SETTLED_REPORT" /tmp/mlb-historical-settled-horizon-advance.json
      - name: Publish context and settled-horizon evidence monotonically
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v8-historical-context-proof origin/main
            mkdir -p runtime_reports
            python scripts/publish_monotonic_json.py \
              --candidate /tmp/mlb-v8-historical-context-backfill.json \
              --existing "$CONTEXT_REPORT" \
              --output "$CONTEXT_REPORT"
            python scripts/publish_monotonic_json.py \
              --candidate /tmp/mlb-historical-settled-horizon-advance.json \
              --existing "$SETTLED_REPORT" \
              --output "$SETTLED_REPORT"
            git add "$CONTEXT_REPORT" "$SETTLED_REPORT"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V8 historical context evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
      - name: Dispatch fresh supervised shadow evaluation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eligible=$(python -c "import json; print(int(json.load(open('/tmp/mlb-v8-historical-context-backfill.json')).get('eligibleGameCount') or 0))")
          if [ "$eligible" -gt 0 ]; then
            gh workflow run mlb-supervised-shadow-v2-recurring.yml --ref main
          fi
      - name: Enforce successful context materialization
        if: always()
        run: |
          python - <<'PY'
          import json
          value=json.load(open('/tmp/mlb-v8-historical-context-backfill.json'))
          assert value.get('authority') == 'V8_HISTORICAL_BBS_SHADOW_ONLY', value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('selectionUsedOutcomes') is False, value
          assert value.get('targetGameOutcomeUsed') is False, value
          assert value.get('sameDayResultsExcluded') is True, value
          assert value.get('manifestPointerPk') == 'MLB_V8_HISTORICAL_CONTEXT#V1', value
          assert value.get('ok') is True, value
          PY
