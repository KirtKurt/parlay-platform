name: MLB V8 Historical Context Compatibility

"on":
  pull_request:
    paths:
      - '.github/workflows/mlb-v8-historical-context-backfill.yml'
      - 'scripts/run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'scripts/run_mlb_v8_historical_context_backfill_autonomous.py'
      - 'hello_world/mlb_v8_historical_point_in_time_context_v1.py'
      - 'hello_world/mlb_v8_historical_context_overlay_v1.py'
      - 'tests/unit/test_mlb_v8_historical_context_overlay_v1.py'
      - 'tests/unit/test_mlb_v8_historical_point_in_time_context_v1.py'
      - 'tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'tests/unit/test_run_mlb_v8_historical_context_backfill_autonomous.py'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum official-context games in the delegated cycle
        required: false
        default: '5'

permissions:
  contents: read
  actions: write

concurrency:
  group: mlb-v8-historical-context-compatibility
  cancel-in-progress: false

env:
  PYTHONPATH: .:hello_world:scripts

jobs:
  validate-context-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
      - run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_mlb_v8_historical_context_backfill_entrypoint.py \
            scripts/run_mlb_v8_historical_context_backfill_autonomous.py
          python -m pytest -q \
            tests/unit/test_mlb_v8_historical_context_overlay_v1.py \
            tests/unit/test_mlb_v8_historical_point_in_time_context_v1.py \
            tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py \
            tests/unit/test_run_mlb_v8_historical_context_backfill_autonomous.py

  delegate-to-autonomous-controller:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-context-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch single V8 control plane
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_LIMIT: ${{ inputs.limit || '5' }}
        run: |
          set -euo pipefail
          gh workflow run mlb-v8-autonomous-controller.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f context_limit="$CONTEXT_LIMIT"
