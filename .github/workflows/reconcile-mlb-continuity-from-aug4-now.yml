name: Repair MLB prospective continuity now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-mlb-continuity-from-aug4-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-prospective-continuity-now
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch isolated unresolved-slate behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('hello_world/mlb_ml_aws_training_v1.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''    finalized_slate_authorities: Dict[str, Dict[str, Any]] = {}\n    blocked_date: Optional[str] = None\n    blocker: Optional[str] = None\n''',
                  '''    finalized_slate_authorities: Dict[str, Dict[str, Any]] = {}\n    skipped_unresolved_slate_dates: List[str] = []\n    unresolved_slate_errors: Dict[str, str] = {}\n    blocked_date: Optional[str] = None\n    blocker: Optional[str] = None\n''',
              ),
              (
                  '''        except Exception as exc:\n            blocked_date = slate_date\n            blocker = f"OFFICIAL_SLATE_UNRESOLVED:{type(exc).__name__}:{exc}"\n            break\n''',
                  '''        except Exception as exc:\n            # Fail closed for this date only: never admit its rows, but do not\n            # let one permanently unresolved historical slate block later clean\n            # independently finalized dates from prospective training.\n            skipped_unresolved_slate_dates.append(slate_date)\n            unresolved_slate_errors[slate_date] = (\n                f"OFFICIAL_SLATE_UNRESOLVED:{type(exc).__name__}:{exc}"\n            )\n            continue\n''',
              ),
              (
                  '''        "provenZeroGameSlateDates": zero_game_dates,\n        "finalizedGameSlateDates": game_dates,\n        "finalizedSlateAuthorities": finalized_slate_authorities,\n        "blockedSlateDate": blocked_date,\n        "blocker": blocker,\n''',
                  '''        "provenZeroGameSlateDates": zero_game_dates,\n        "finalizedGameSlateDates": game_dates,\n        "finalizedSlateAuthorities": finalized_slate_authorities,\n        "skippedUnresolvedSlateDates": skipped_unresolved_slate_dates,\n        "unresolvedSlateErrors": unresolved_slate_errors,\n        "blockedSlateDate": blocked_date,\n        "blocker": blocker,\n''',
              ),
              (
                  '''            "Training stops at the first unresolved official slate; only an exact "\n            "official zero-game schedule may be crossed as an off-day."\n''',
                  '''            "Training excludes unresolved official slates individually and continues "\n            "with later independently finalized slates; unresolved dates never admit "\n            "training rows and exact official zero-game schedules remain proven off-days."\n''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected prospective continuity source block not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add regression contract
        run: |
          cat > tests/unit/test_mlb_prospective_skip_unresolved_slate.py <<'PY'
          import inspect
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(__file__).resolve().parents[2] / 'hello_world'))
          import mlb_ml_aws_training_v1 as trainer


          def test_unresolved_slate_is_date_local_fail_closed_not_global_blocker():
              source = inspect.getsource(trainer._contiguous_finalized_slate_prefix)
              assert 'skipped_unresolved_slate_dates.append(slate_date)' in source
              assert 'unresolved_slate_errors[slate_date]' in source
              assert 'continue' in source
              assert '"skippedUnresolvedSlateDates": skipped_unresolved_slate_dates' in source
              assert '"unresolvedSlateErrors": unresolved_slate_errors' in source
              old_global_block = '''blocked_date = slate_date\n            blocker = f"OFFICIAL_SLATE_UNRESOLVED:{type(exc).__name__}:{exc}"\n            break'''
              assert old_global_block not in source
          PY

      - name: Run focused and trainer tests
        run: |
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m pytest -q \
            tests/unit/test_mlb_prospective_skip_unresolved_slate.py \
            tests/unit/test_mlb_trainer_continuity_compat_handler_v2.py \
            tests/unit/test_mlb_ml_aws_training_v1.py

      - name: Commit and push repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hello_world/mlb_ml_aws_training_v1.py tests/unit/test_mlb_prospective_skip_unresolved_slate.py
          git diff --cached --check
          git commit -m 'Allow MLB prospective training to skip isolated unresolved slates'
          git push origin HEAD:main
