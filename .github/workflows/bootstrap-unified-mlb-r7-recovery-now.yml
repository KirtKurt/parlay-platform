name: Bootstrap canonical unified MLB R7 recovery now

"on":
  workflow_run:
    workflows: ["MLB Scoring Guard"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# This is an idempotent one-time dispatcher, not a trainer implementation.
# The canonical recovery still owns GitHub execution serialization, and the
# deployed trainer still owns the DynamoDB execution lease.
concurrency:
  group: unified-mlb-recovery-bootstrap
  cancel-in-progress: false

env:
  REQUEST_ID: bootstrap-mlb-r7-20260826-v3

jobs:
  dispatch-once:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch canonical recovery exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ['REPOSITORY']
          request_id = os.environ['REQUEST_ID']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'unified-mlb-r7-recovery-bootstrap',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          runs_url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              'unified-mlb-learning-recovery-once.yml/runs'
              '?event=workflow_dispatch&per_page=100'
          )

          def matching_runs():
              request = urllib.request.Request(runs_url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              return [
                  run for run in payload.get('workflow_runs', [])
                  if request_id in str(run.get('display_title') or '')
              ]

          existing = matching_runs()
          if existing:
              print(json.dumps({
                  'ok': True,
                  'alreadyDispatched': True,
                  'requestId': request_id,
                  'runId': existing[0].get('id'),
                  'productionAuthorityChanged': False,
                  'otherSportChanged': False,
              }, sort_keys=True))
              raise SystemExit(0)

          dispatch_url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              'unified-mlb-learning-recovery-once.yml/dispatches'
          )
          body = json.dumps({
              'ref': 'main',
              'inputs': {'request_id': request_id},
          }).encode('utf-8')
          request = urllib.request.Request(
              dispatch_url,
              data=body,
              headers={**headers, 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'Unexpected dispatch status: {response.status}')

          deadline = time.monotonic() + 120
          created = []
          while time.monotonic() < deadline:
              created = matching_runs()
              if created:
                  break
              time.sleep(5)
          if not created:
              raise SystemExit('Canonical recovery dispatch was not observable')

          print(json.dumps({
              'ok': True,
              'alreadyDispatched': False,
              'requestId': request_id,
              'runId': created[0].get('id'),
              'productionAuthorityChanged': False,
              'otherSportChanged': False,
          }, sort_keys=True))
          PY
