name: Bootstrap canonical unified MLB R7 recovery now
run-name: "Manual MLB R7 recovery bootstrap #${{ github.run_number }}"

"on":
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Manual alias only. Automatic R7 retries are owned by
# mlb-r7-overnight-advance.yml, while EventBridge remains the only automatic
# trainer invoker. This workflow performs no deploy or AWS call.
concurrency:
  group: mlb-r7-recovery-bootstrap-dispatch
  cancel-in-progress: false

jobs:
  dispatch-queue-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical queue control with force
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = 'mlb-r7-overnight-advance.yml';

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: workflowId,
                branch: 'main',
                per_page: 100,
              },
            );
            const activeStatuses = new Set([
              'queued',
              'in_progress',
              'waiting',
              'pending',
              'requested',
            ]);
            const active = runs.find(
              (run) => activeStatuses.has(String(run.status || ''))
            );
            if (active) {
              core.notice(`R7 queue control already active: ${active.html_url}`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: {
                force: 'true',
              },
            });
            core.notice(`Dispatched ${workflowId} with force=true`);
