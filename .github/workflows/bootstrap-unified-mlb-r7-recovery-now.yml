name: Bootstrap active MLB R8 evidence watchdog now
run-name: "Manual MLB R8 evidence bootstrap #${{ github.run_number }}"

"on":
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Manual compatibility alias only. It dispatches the active-R8 evidence queue;
# neither workflow invokes AWS directly. EventBridge remains the only automatic
# trainer invoker, and model/promotion authority remains fail closed.
concurrency:
  group: mlb-r8-evidence-bootstrap-dispatch
  cancel-in-progress: false

jobs:
  dispatch-queue-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch active-R8 evidence queue with force
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = 'mlb-r7-overnight-advance.yml';

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: workflowId,
                branch: 'main',
                per_page: 100,
              },
            );
            const activeStatuses = new Set([
              'queued',
              'in_progress',
              'waiting',
              'pending',
              'requested',
            ]);
            const active = runs.find(
              (run) => activeStatuses.has(String(run.status || ''))
            );
            if (active) {
              core.notice(`R8 evidence queue already active: ${active.html_url}`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: {
                force: 'true',
              },
            });
            core.notice(`Dispatched active-R8 evidence queue ${workflowId} with force=true`);
