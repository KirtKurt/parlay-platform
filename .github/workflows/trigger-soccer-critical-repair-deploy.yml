name: Trigger Soccer Critical Repair Deploy

on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-soccer-critical-repair-deploy.yml']

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch isolated Soccer deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-soccer-auto.yml --ref main -f shared_quota_reserve_percent=0
      - name: Remove one-shot trigger
        run: |
          set -euo pipefail
          git config user.name 'Kurt Soccer Repair Agent'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/trigger-soccer-critical-repair-deploy.yml
          git commit -m 'Remove Soccer critical repair deploy trigger'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
