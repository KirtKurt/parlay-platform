name: Diagnose Tennis Runtime 410

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-tennis-runtime-410.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Capture fresh tennis cycle evidence
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-tennis-learning
          region="$AWS_REGION_VALUE"
          stack_status=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query 'Stacks[0].StackStatus' --output text)
          run_endpoint=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyRunApi'].OutputValue" --output text)
          status_endpoint=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" --output text)
          test -n "$run_endpoint" && test "$run_endpoint" != None
          test -n "$status_endpoint" && test "$status_endpoint" != None
          curl --fail --retry 3 --retry-all-errors --retry-delay 10 -X POST --max-time 900 "$run_endpoint" -o /tmp/tennis-cycle.json
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 "$status_endpoint" -o /tmp/tennis-status.json
          export STACK_STATUS="$stack_status"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          cycle=json.loads(Path('/tmp/tennis-cycle.json').read_text())
          status=json.loads(Path('/tmp/tennis-status.json').read_text())
          actions=cycle.get('actions') or {}
          collect=actions.get('collect') or {}
          settle=actions.get('settle') or {}
          failures=int(status.get('consecutive_failures') or 0)
          authority=str(status.get('authority') or 'UNKNOWN')
          snapshot={
              'checked_at':datetime.now(timezone.utc).isoformat(),
              'stack_status':os.environ.get('STACK_STATUS'),
              'cycle_response':cycle,
              'status_after':status,
              'collection_summary':collect,
              'settlement_summary':settle,
              'actionable_runtime_error':bool(cycle.get('last_error') or collect.get('errors') or settle.get('errors') or failures>=3 or authority=='DEGRADED'),
              'operationally_healthy':os.environ.get('STACK_STATUS')=='UPDATE_COMPLETE' and not cycle.get('last_error') and failures<3 and authority!='DEGRADED',
          }
          Path('/tmp/tennis_autonomy_diagnostic.json').write_text(json.dumps(snapshot,indent=2,sort_keys=True,default=str)+'\n')
          PY
      - name: Publish diagnostic and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p runtime
            cp /tmp/tennis_autonomy_diagnostic.json runtime/tennis_autonomy_diagnostic.json
            git rm -f .github/workflows/diagnose-tennis-runtime-410.yml
            git add runtime/tennis_autonomy_diagnostic.json
            git commit -m 'Publish fresh tennis runtime diagnostic [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
