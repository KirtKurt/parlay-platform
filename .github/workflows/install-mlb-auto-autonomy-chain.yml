name: Install MLB AUTO autonomy chain

on:
  push:
    branches: [agent/fix-mlb-auto-autonomy-chain]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-mlb-auto-autonomy-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-verify:
    if: github.head_ref == 'agent/fix-mlb-auto-autonomy-chain' || github.ref_name == 'agent/fix-mlb-auto-autonomy-chain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-mlb-auto-autonomy-chain
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9" "PyYAML>=6,<7" "scikit-learn>=1.4,<2"

      - name: Install canonical MLB AUTO autonomy chain
        run: |
          python scripts/install_mlb_auto_autonomy_chain.py
          python scripts/patch_mlb_auto_promotion_invariant.py
          python scripts/patch_mlb_auto_runtime_contracts.py

      - name: Prove installer is idempotent
        run: |
          BEFORE=$(git diff | sha256sum | awk '{print $1}')
          python scripts/install_mlb_auto_autonomy_chain.py
          python scripts/patch_mlb_auto_promotion_invariant.py
          python scripts/patch_mlb_auto_runtime_contracts.py
          AFTER=$(git diff | sha256sum | awk '{print $1}')
          test "$BEFORE" = "$AFTER"

      - name: Compile new autonomy runtime
        run: |
          python -m py_compile \
            hello_world/mlb_ml_autonomy_chain_v1.py \
            hello_world/mlb_ml_v2_inference_consumer_v1.py \
            hello_world/mlb_auto_llm_hypothesis_v1.py \
            scripts/reconcile_mlb_prospective_backlog_v6.py \
            scripts/synchronize_mlb_ml_deployment_identity.py \
            scripts/install_mlb_auto_autonomy_chain.py \
            scripts/patch_mlb_auto_promotion_invariant.py \
            scripts/patch_mlb_auto_runtime_contracts.py

      - name: Run focused MLB AUTO tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          pytest -q \
            tests/unit/test_mlb_auto_autonomy_chain_v1.py \
            tests/unit/test_mlb_ml_v2_inference_consumer_v1.py \
            tests/unit/test_mlb_auto_llm_hypothesis_v1.py \
            tests/unit/test_mlb_ml_promotion_policy_v2.py \
            tests/unit/test_mlb_canonical_final_labels_v1.py

      - name: Verify MLB production invariants
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python scripts/verify_mlb_schedule_invariants.py

      - name: Validate SAM template YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          class CloudFormationLoader(yaml.SafeLoader):
              pass

          def intrinsic(loader, tag_suffix, node):
              tag = f"!{tag_suffix}"
              if isinstance(node, yaml.ScalarNode):
                  value = loader.construct_scalar(node)
              elif isinstance(node, yaml.SequenceNode):
                  value = loader.construct_sequence(node, deep=True)
              elif isinstance(node, yaml.MappingNode):
                  value = loader.construct_mapping(node, deep=True)
              else:
                  raise TypeError(f"Unsupported CloudFormation node for {tag}")
              return {tag: value}

          CloudFormationLoader.add_multi_constructor("!", intrinsic)
          for name in ("template.yaml", "mlb_historical_optimizer/template.yaml"):
              payload = yaml.load(
                  Path(name).read_text(encoding="utf-8"),
                  Loader=CloudFormationLoader,
              )
              if not isinstance(payload, dict):
                  raise SystemExit(f"SAM template is not a mapping: {name}")
              if payload.get("Transform") != "AWS::Serverless-2016-10-31":
                  raise SystemExit(f"SAM transform missing: {name}")
              if not isinstance(payload.get("Resources"), dict):
                  raise SystemExit(f"SAM resources missing: {name}")
              print(f"CloudFormation YAML parsed: {name}")
          PY

      - name: Commit installed canonical sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            template.yaml \
            mlb_historical_optimizer/template.yaml \
            hello_world/mlb_accuracy_target_policy_v1.py \
            hello_world/mlb_v3_read_api.py \
            hello_world/mlb_ml_aws_training_v1_compat.py \
            hello_world/mlb_ml_autonomy_chain_v1.py \
            hello_world/mlb_ml_v2_inference_consumer_v1.py \
            hello_world/mlb_ml_runtime_install_v3.py \
            hello_world/mlb_historical_optimizer_handler.py \
            scripts/verify_api_function_mlb_v3_import.py \
            scripts/verify_mlb_schedule_invariants.py \
            scripts/stabilize_mlb_deploy_source.py
          if git diff --cached --quiet; then
            echo "MLB AUTO source already installed."
            exit 0
          fi
          git commit -m "Install MLB AUTO autonomous learning and inference chain"
          git pull --rebase --autostash origin agent/fix-mlb-auto-autonomy-chain
          git push origin HEAD:agent/fix-mlb-auto-autonomy-chain
