name: MLB Historical Status Snapshot

"on":
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-status-snapshot.yml'
      - '.github/workflows/mlb-historical-watchdog.yml'
      - '.github/workflows/mlb-historical-v7-recovery.yml'
      - 'hello_world/mlb_historical_optimizer_entrypoint.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'hello_world/mlb_historical_feature_rematerialization_v1.py'
      - 'mlb_historical_optimizer/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  OPTIMIZER_STACK: parlay-platform-mlb-historical-optimizer

concurrency:
  group: mlb-historical-status-snapshot
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Read and validate compact optimizer status
        run: |
          set -euo pipefail
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$OPTIMIZER_STACK" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" \
            --output text)
          test -n "$FUNCTION_NAME"
          test "$FUNCTION_NAME" != None
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"mode":"status","run":"scheduled_live_status_snapshot"}' \
            /tmp/status.json >/tmp/meta.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          value = json.load(open('/tmp/status.json'))
          if value.get('ok') is not True:
              raise SystemExit(f"optimizer status failed: {value}")
          state = value.get('state') or {}
          summary = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'ok': True,
              'phase': state.get('phase'),
              'currentDate': state.get('currentDate'),
              'currentSlotIndex': state.get('currentSlotIndex'),
              'networkRequestCount': state.get('networkRequestCount'),
              'creditsConsumed': state.get('creditsConsumed'),
              'eligibleGameCount': state.get('eligibleGameCount'),
              'completeSlateCount': state.get('completeSlateCount'),
              'optimizationRound': state.get('optimizationRound'),
              'latestExperiment': state.get('latestExperiment'),
              'lastError': state.get('lastError'),
              'lastErrorAtUtc': state.get('lastErrorAtUtc'),
              'stateUpdatedAtUtc': state.get('updatedAtUtc'),
              'revision': state.get('revision'),
              'featureDatasetVersion': state.get('featureDatasetVersion'),
              'featureRematerializationComplete': state.get('featureRematerializationComplete'),
              'featureRematerializedSlateCount': state.get('featureRematerializedSlateCount'),
              'featureRematerializationTotalSlateCount': state.get('featureRematerializationTotalSlateCount'),
              'featureRematerializationErrors': state.get('featureRematerializationErrors'),
              'freshAuditCollectedDayCount': state.get('freshAuditCollectedDayCount'),
              'freshAuditCollectedGameCount': state.get('freshAuditCollectedGameCount'),
              'freshAuditStartDate': state.get('freshAuditStartDate'),
              'endDate': state.get('endDate'),
              'lastQuota': state.get('lastQuota'),
              'championValidation': value.get('championValidation'),
              'cutoverValidation': value.get('cutoverValidation'),
              'productionAuthority': value.get('productionAuthority'),
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          json.dump(summary, open('/tmp/status-summary.json', 'w'), indent=2, sort_keys=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-historical-live-status-${{ github.run_id }}
          path: /tmp/status-summary.json
          retention-days: 30
      - name: Publish canonical live status safely
        run: |
          set -euo pipefail
          mkdir -p docs/runtime
          cp /tmp/status-summary.json docs/runtime/mlb-historical-live-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runtime/mlb-historical-live-status.json
          if git diff --cached --quiet; then
            echo "No status change to publish"
            exit 0
          fi
          git commit -m "chore: publish MLB historical live status"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo '::error::Unable to publish MLB historical status after three retries.'
          exit 1
