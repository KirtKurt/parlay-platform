name: MLB Historical Status Snapshot

"on":
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-status-snapshot.yml'
      - '.github/workflows/mlb-historical-watchdog.yml'
      - '.github/workflows/mlb-historical-v7-recovery.yml'
      - '.github/workflows/mlb-historical-next-round-catchup.yml'
      - 'scripts/build_mlb_historical_status.py'
      - 'scripts/run_mlb_historical_watchdog.py'
      - 'hello_world/mlb_historical_optimizer_entrypoint.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'hello_world/mlb_historical_feature_rematerialization_v1.py'
      - 'mlb_historical_optimizer/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  OPTIMIZER_STACK: parlay-platform-mlb-historical-optimizer
  PYTHONPATH: .

concurrency:
  group: mlb-historical-status-snapshot
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate the evidence-honest status renderer
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9'
          python -m py_compile scripts/build_mlb_historical_status.py
          python -m pytest -q \
            tests/unit/test_build_mlb_historical_status.py \
            tests/unit/test_mlb_historical_status_publisher_contract.py

      - name: Read and validate canonical optimizer status
        run: |
          set -euo pipefail
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$OPTIMIZER_STACK" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" \
            --output text)
          test -n "$FUNCTION_NAME"
          test "$FUNCTION_NAME" != None

          aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --output json > /tmp/function-configuration.json

          status_ready=false
          for attempt in $(seq 1 24); do
            aws lambda invoke \
              --function-name "$FUNCTION_NAME" \
              --region "${{ secrets.AWS_REGION }}" \
              --cli-read-timeout 900 \
              --cli-binary-format raw-in-base64-out \
              --payload '{"mode":"status","run":"scheduled_live_status_snapshot"}' \
              /tmp/status.json >/tmp/meta.json
            decision=$(python - <<'PY'
          import json
          value=json.load(open('/tmp/status.json'))
          state=value.get('state')
          if value.get('status') == 'LEASE_HELD' and not isinstance(state,dict):
              print('RETRY')
          elif value.get('ok') is True and isinstance(state,dict):
              print('READY')
          else:
              print('FAIL')
          PY
          )
            case "$decision" in
              READY) status_ready=true; break ;;
              RETRY) sleep 15 ;;
              FAIL)
                cat /tmp/status.json
                echo '::error::Optimizer status returned an invalid response'
                exit 1
                ;;
            esac
          done
          test "$status_ready" = true || {
            echo '::error::Optimizer status remained lease-held for six minutes'
            exit 1
          }

          python scripts/build_mlb_historical_status.py \
            --status /tmp/status.json \
            --function-configuration /tmp/function-configuration.json \
            --output /tmp/status-summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: mlb-historical-live-status-${{ github.run_id }}
          path: /tmp/status-summary.json
          retention-days: 30

      - name: Publish canonical live status safely
        run: |
          set -euo pipefail
          cp /tmp/status-summary.json /tmp/status-summary-copy.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B historical-live-status origin/main
            mkdir -p docs/runtime
            cp /tmp/status-summary-copy.json docs/runtime/mlb-historical-live-status.json
            git add docs/runtime/mlb-historical-live-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: publish MLB historical live status [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo '::error::Unable to publish MLB historical status after bounded retries.'
          exit 1
