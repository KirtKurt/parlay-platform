name: Correct MLB AUTO active Bedrock model chain now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correct-mlb-auto-live-model-chain-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correct-mlb-auto-live-model-chain-now
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Replace retired and invalid model identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          active = (
              'global.anthropic.claude-sonnet-4-20250514-v1:0,'
              'us.anthropic.claude-sonnet-4-20250514-v1:0,'
              'us.meta.llama3-3-70b-instruct-v1:0,'
              'meta.llama3-3-70b-instruct-v1:0,'
              'mistral.mistral-large-3-675b-instruct,'
              'mistral.ministral-3-3b-instruct,'
              'openai.gpt-5.6-sol,'
              'anthropic.claude-opus-4-8,'
              'anthropic.claude-opus-4-7,'
              'anthropic.claude-opus-4-6-v1,'
              'anthropic.claude-sonnet-4-6,'
              'us.amazon.nova-2-lite-v1:0,'
              'global.amazon.nova-2-lite-v1:0,'
              'us.amazon.nova-pro-v1:0,'
              'us.amazon.nova-lite-v1:0,'
              'us.amazon.nova-micro-v1:0'
          )
          obsolete = (
              'us.anthropic.claude-sonnet-4-20250514-v1:0,'
              'us.meta.llama3-3-70b-instruct-v1:0,'
              'meta.llama3-3-70b-instruct-v1:0,'
              'mistral.mistral-large-2402-v1:0,'
              'mistral.mistral-small-2402-v1:0,'
              'cohere.command-r-v1:0,'
              'cohere.command-r-plus-v1:0,'
              'openai.gpt-5.6-sol,'
              'anthropic.claude-opus-4-8,'
              'anthropic.claude-opus-4-7,'
              'anthropic.claude-opus-4-6-v1,'
              'anthropic.claude-sonnet-4-6-v1,'
              'us.amazon.nova-2-lite-v1:0,'
              'global.amazon.nova-2-lite-v1:0,'
              'us.amazon.nova-pro-v1:0,'
              'us.amazon.nova-lite-v1:0,'
              'us.amazon.nova-micro-v1:0'
          )

          deploy=Path('.github/workflows/deploy-mlb-auto-llm.yml')
          text=deploy.read_text(encoding='utf-8')
          if obsolete in text:
              text=text.replace(obsolete, active)
          if active not in text:
              raise SystemExit('active Bedrock model chain was not installed in deployment workflow')
          deploy.write_text(text, encoding='utf-8')

          installer=Path('scripts/set_mlb_auto_bedrock_model_chain.py')
          text=installer.read_text(encoding='utf-8')
          start=text.index('LIVE_MODELS = (')
          end=text.index('\n)\n\nOLD_TEMPLATE_MODELS', start)+2
          replacement='LIVE_MODELS = (\n    '+repr(active)+'\n)'
          text=text[:start]+replacement+text[end:]
          installer.write_text(text, encoding='utf-8')

          template=Path('mlb-auto-llm-template.yaml')
          text=template.read_text(encoding='utf-8')
          for token in (
              'mistral.mistral-large-2402-v1:0',
              'mistral.mistral-small-2402-v1:0',
              'cohere.command-r-v1:0',
              'cohere.command-r-plus-v1:0',
              'anthropic.claude-sonnet-4-6-v1',
          ):
              if token in text:
                  raise SystemExit(f'obsolete model remains in template: {token}')
          for token in (
              'global.anthropic.claude-sonnet-4-20250514-v1:0',
              'mistral.mistral-large-3-675b-instruct',
              'mistral.ministral-3-3b-instruct',
              'anthropic.claude-sonnet-4-6',
          ):
              if token not in text:
                  raise SystemExit(f'active model missing from template: {token}')
          PY
          python -m py_compile scripts/set_mlb_auto_bedrock_model_chain.py
          grep -q 'cancel-in-progress: false' .github/workflows/deploy-mlb-auto-llm.yml
          grep -q 'mistral.mistral-large-3-675b-instruct' .github/workflows/deploy-mlb-auto-llm.yml
          grep -q 'mistral.ministral-3-3b-instruct' .github/workflows/deploy-mlb-auto-llm.yml
          ! grep -q 'cohere.command-r-v1:0' .github/workflows/deploy-mlb-auto-llm.yml
          git diff --check

      - name: Publish corrected chain and trigger canonical isolated deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/deploy-mlb-auto-llm.yml \
            scripts/set_mlb_auto_bedrock_model_chain.py
          git diff --cached --quiet && exit 0
          git commit -m 'Use current active Bedrock profiles for MLB AUTO'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" != 5 || exit 1
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
