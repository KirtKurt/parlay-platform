name: Diagnose MLB R8 health
on:
  push:
    branches: [codex/mlb-r8-health-repair-20260909]
    paths:
      - scripts/diagnose_mlb_r8_health.py
      - scripts/mlb_challenger_benchmark.py
      - scripts/verify_mlb_starter_context.py
      - scripts/verify_mlb_team_context.py
      - hello_world/mlb_statsapi_team_context.py
      - tests/unit/test_mlb_statsapi_team_context.py
      - scripts/verify_mlb_successor_development.py
      - hello_world/mlb_successor_model_v1.py
      - hello_world/mlb_successor_model_v2.py
      - hello_world/mlb_successor_runtime_v1.py
      - tests/unit/test_mlb_successor.py
      - hello_world/mlb_statsapi_starter_context.py
      - hello_world/mlb_advanced_context.py
      - tests/unit/test_mlb_statsapi_starter_context.py
      - tests/unit/test_verify_mlb_starter_context.py
      - tests/unit/test_mlb_challenger_benchmark.py
      - .github/workflows/diagnose-mlb-r8-health.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.34,<2' 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'pytest>=8,<9'
      - run: python -m pytest -q tests/unit/test_mlb_challenger_benchmark.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: python scripts/diagnose_mlb_r8_health.py
      - name: Compare challengers against exact frozen R8 evidence
        run: python scripts/mlb_challenger_benchmark.py
      - name: Verify official pre-lock starter observations
        run: |
          python -m pytest -q tests/unit/test_mlb_statsapi_starter_context.py tests/unit/test_verify_mlb_starter_context.py
          python scripts/verify_mlb_starter_context.py --persisted
      - name: Verify successor contracts and replay exact development evidence
        run: |
          python -m pytest -q tests/unit/test_mlb_successor.py
          python scripts/verify_mlb_successor_development.py
      - name: Verify live pregame batting orders and relief workload
        run: |
          python -m pytest -q tests/unit/test_mlb_statsapi_team_context.py
          python scripts/verify_mlb_team_context.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-challenger-benchmark-${{ github.run_id }}
          path: |
            runtime_reports/mlb_r8_runtime_health_latest.json
            runtime_reports/mlb_challenger_benchmark_latest.json
            runtime_reports/mlb_starter_context_live_proof_latest.json
            runtime_reports/mlb_team_context_live_proof_latest.json
            runtime_reports/mlb_successor_development_replay_latest.json
          if-no-files-found: warn
          retention-days: 90
