name: Diagnose MLB R8 health
on:
  push:
    branches: [codex/mlb-r8-health-repair-20260909]
    paths:
      - scripts/diagnose_mlb_r8_health.py
      - .github/workflows/diagnose-mlb-r8-health.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.34,<2'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: python scripts/diagnose_mlb_r8_health.py
