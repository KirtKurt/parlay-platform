name: V10 Research Validation

"on":
  pull_request:
    paths:
      - 'hello_world/mlb_v10_autonomous_signal_discovery_v1.py'
      - 'scripts/run_mlb_v10_autonomous_signal_discovery.py'
      - 'tests/unit/test_mlb_v10_autonomous_signal_discovery_v1.py'
      - '.github/workflows/v10-pr-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9'
          PYTHONPATH=hello_world python -m py_compile hello_world/mlb_v10_autonomous_signal_discovery_v1.py scripts/run_mlb_v10_autonomous_signal_discovery.py
          PYTHONPATH=. python -m pytest -q --tb=short tests/unit/test_mlb_v10_autonomous_signal_discovery_v1.py
