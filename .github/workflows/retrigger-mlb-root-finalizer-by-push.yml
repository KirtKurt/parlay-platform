name: Retrigger MLB root finalizer by push

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retrigger-mlb-root-finalizer-by-push.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrigger-mlb-root-finalizer-by-push
  cancel-in-progress: false

jobs:
  retrigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Touch the repaired finalizer workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          path=Path('.github/workflows/finalize-mlb-root-settlement-training-now.yml')
          text=path.read_text(encoding='utf-8')
          lines=[line for line in text.splitlines() if not line.startswith('# repair-retrigger:')]
          lines.append('# repair-retrigger: ' + datetime.now(timezone.utc).isoformat())
          path.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
          git diff --check

      - name: Publish retrigger commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-mlb-root-settlement-training-now.yml
          git commit -m 'Retrigger repaired MLB settlement finalizer'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo '::error::Unable to retrigger MLB root finalizer'
          exit 1
