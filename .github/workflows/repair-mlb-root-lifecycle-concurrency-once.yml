name: Repair MLB root lifecycle concurrency once

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-root-lifecycle-concurrency-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Give MLB lifecycle deployment a dedicated queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B mlb-lifecycle-concurrency-repair origin/main
          file='.github/workflows/deploy-mlb-root-lifecycle-continuity-once.yml'
          if grep -q '^  group: parlay-platform-deploy$' "$file"; then
            sed -i 's/^  group: parlay-platform-deploy$/  group: mlb-root-lifecycle-continuity-deploy/' "$file"
          fi
          grep -q '^  group: mlb-root-lifecycle-continuity-deploy$' "$file"
          if git diff --quiet -- "$file"; then
            echo 'MLB lifecycle deployment already has dedicated concurrency.'
            exit 0
          fi
          git add "$file"
          git commit -m 'Isolate MLB lifecycle deployment concurrency'
          git push origin HEAD:main
