name: Apply Soccer Quota Generation-Stale Fix

on:
  push:
    branches:
      - agent/fix-soccer-quota-generation-stale-20260815

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-soccer-quota-generation-stale-20260815
      - name: Patch quota backpressure evidence contract
        run: |
          echo '' | base64 -d > /tmp/patch_soccer.py
          python /tmp/patch_soccer.py
      - name: Run focused Soccer tests
        run: |
          python -m py_compile soccer_auto/collector.py
          pytest -q tests/soccer_auto/test_quota_backpressure.py tests/soccer_auto/test_collection_gate.py tests/soccer_auto/test_coverage_reconciliation.py
      - name: Commit patched Soccer files
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'Kurt Soccer Repair Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add soccer_auto/collector.py tests/soccer_auto/test_quota_backpressure.py
          git commit -m 'Fix Soccer quota-deferred discovery generation evidence'
          git push origin HEAD:agent/fix-soccer-quota-generation-stale-20260815
