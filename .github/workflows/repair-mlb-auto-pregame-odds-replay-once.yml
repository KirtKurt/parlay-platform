name: Repair MLB Auto pregame Odds replay once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-auto-pregame-odds-replay-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-mlb-auto-pregame-odds-replay-once
  cancel-in-progress: false

jobs:
  repair-test-deploy-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test immutable pregame Odds replay
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python scripts/repair_mlb_auto_pregame_odds_replay_once.py
          python -m py_compile \
            mlb_auto_llm/pregame_odds_replay.py \
            mlb_auto_llm/orchestrator_v3.py \
            tests/unit/test_mlb_auto_pregame_odds_replay.py
          PYTHONPATH=mlb_auto_llm python -m pytest -q \
            tests/unit/test_mlb_auto_pregame_odds_replay.py \
            tests/unit/test_mlb_auto_model_gateway.py \
            tests/unit/test_mlb_auto_ml_authority.py
          sam validate --template-file mlb-auto-llm-template.yaml --lint
          git diff --check
          grep -q 'MLB-AUTO-PREGAME-ODDS-REPLAY-v1-immutable-evidence-only' \
            mlb_auto_llm/pregame_odds_replay.py
          grep -q 'postStartOddsFabricationAllowed' \
            mlb_auto_llm/pregame_odds_replay.py

      - name: Publish tested source without workflow-scope token dependency
        id: publish
        run: |
          set -euo pipefail
          # The installer also stages local deployment-workflow assertions, but
          # GITHUB_TOKEN may not modify workflow files. Production source does
          # not depend on that CI-only edit: SAM packages the complete CodeUri.
          git checkout -- .github/workflows/deploy-mlb-auto-llm.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mlb_auto_llm/pregame_odds_replay.py \
            mlb_auto_llm/orchestrator_v3.py \
            tests/unit/test_mlb_auto_pregame_odds_replay.py
          git diff --cached --quiet || \
            git commit -m 'Repair MLB Auto immutable pregame Odds replay [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            test "$attempt" != 5
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy and require complete three-source model cycle
        env:
          SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-mlb-auto-llm.yml --repo "$REPOSITORY" --ref main
          RUN_ID=''
          for attempt in $(seq 1 90); do
            RUN_ID=$(gh run list \
              --repo "$REPOSITORY" \
              --workflow deploy-mlb-auto-llm.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 40 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" \
              | head -n 1)
            test -z "$RUN_ID" || break
            sleep 4
          done
          test -n "$RUN_ID"
          echo "$RUN_ID" > /tmp/mlb-auto-odds-replay-deploy-run
          gh run watch "$RUN_ID" --repo "$REPOSITORY" --exit-status --interval 10

      - name: Publish repair orchestration evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          run_file=Path('/tmp/mlb-auto-odds-replay-deploy-run')
          report={
              'proofType':'MLB_AUTO_IMMUTABLE_PREGAME_ODDS_REPLAY_REPAIR',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.environ.get('JOB_STATUS'),
              'sourceSha':os.environ.get('SOURCE_SHA'),
              'deployRunId':run_file.read_text().strip() if run_file.exists() else None,
              'replayRequiresActualStoredOdds':True,
              'replayRequiresCaptureBeforeFirstPitch':True,
              'postStartOddsFabricationAllowed':False,
              'postStartPredictionCreationAllowed':False,
              'immutableCardRewriteAllowed':False,
              'secretExposed':False,
          }
          report['ok']=bool(report['jobStatus']=='success' and report['deployRunId'])
          report['conclusion']='PASS' if report['ok'] else 'FAIL'
          Path('runtime_reports/mlb_auto_pregame_odds_replay_repair_latest.json').write_text(
              json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          cp runtime_reports/mlb_auto_pregame_odds_replay_repair_latest.json \
            /tmp/mlb_auto_pregame_odds_replay_repair_latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-auto-odds-replay-proof origin/main
            cp /tmp/mlb_auto_pregame_odds_replay_repair_latest.json \
              runtime_reports/mlb_auto_pregame_odds_replay_repair_latest.json
            git add runtime_reports/mlb_auto_pregame_odds_replay_repair_latest.json
            git diff --cached --quiet || \
              git commit -m 'Publish MLB Auto pregame Odds replay repair proof [skip ci]'
            git push origin HEAD:main && break
            test "$attempt" != 5
            sleep $((attempt * 3))
          done
          python - <<'PY'
          import json
          report=json.load(open('/tmp/mlb_auto_pregame_odds_replay_repair_latest.json'))
          assert report.get('ok') is True, report
          print('MLB Auto immutable pregame Odds replay repair: PASS')
          PY
