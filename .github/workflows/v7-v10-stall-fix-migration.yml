name: V7-V10 Stall Fix Migration

"on":
  push:
    branches:
      - agent/fix-v7-v10-stalls-20260804
    paths:
      - 'scripts/migrate_v7_v10_stall_fixes.py'
      - 'scripts/fix_v7_v10_migration_idempotency.py'
      - 'scripts/run_mlb_historical_supervised_v9_shadow_cadence_v3.py'
      - 'scripts/warm_and_verify_mlb_lock_status.py'
      - 'tests/unit/test_run_mlb_historical_supervised_v9_shadow_cadence_v3.py'
      - 'tests/unit/test_run_mlb_v8_historical_context_pointer_migration.py'
      - 'tests/unit/test_warm_and_verify_mlb_lock_status.py'
      - '.github/workflows/v7-v10-stall-fix-migration.yml'
  pull_request:
    paths:
      - 'hello_world/mlb_historical_v7_feature_bridge_v1.py'
      - 'scripts/run_mlb_historical_supervised_v9_shadow_feature_aware.py'
      - 'scripts/run_mlb_historical_supervised_v9_shadow_cadence_v3.py'
      - 'scripts/run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'scripts/warm_and_verify_mlb_lock_status.py'
      - 'scripts/stabilize_mlb_deploy_source.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/mlb-historical-supervised-v9-shadow.yml'
      - 'tests/unit/test_run_mlb_historical_supervised_v9_shadow_feature_aware.py'
      - 'tests/unit/test_run_mlb_historical_supervised_v9_shadow_cadence_v3.py'
      - 'tests/unit/test_run_mlb_v8_historical_context_pointer_migration.py'
      - 'tests/unit/test_warm_and_verify_mlb_lock_status.py'
      - '.github/workflows/v7-v10-stall-fix-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v7-v10-stall-fix-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply V7-V10 stall migration
        run: |
          set -euo pipefail
          python scripts/fix_v7_v10_migration_idempotency.py
          python scripts/migrate_v7_v10_stall_fixes.py

      - name: Verify provider-neutral cadence and lock acceptance contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
          PYTHONPATH=.:hello_world:scripts python -m py_compile \
            scripts/fix_v7_v10_migration_idempotency.py \
            scripts/migrate_v7_v10_stall_fixes.py \
            scripts/run_mlb_historical_supervised_v9_shadow_cadence_v3.py \
            scripts/run_mlb_historical_supervised_v9_shadow_feature_aware.py \
            scripts/run_mlb_v8_historical_context_backfill_entrypoint.py \
            scripts/warm_and_verify_mlb_lock_status.py \
            hello_world/mlb_historical_v7_feature_bridge_v1.py
          PYTHONPATH=.:hello_world:scripts python -m pytest -q --tb=short \
            tests/unit/test_run_mlb_historical_supervised_v9_shadow_cadence.py \
            tests/unit/test_run_mlb_historical_supervised_v9_shadow_cadence_v3.py \
            tests/unit/test_run_mlb_historical_supervised_v9_shadow_feature_aware.py \
            tests/unit/test_mlb_historical_v7_feature_bridge_v1.py \
            tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py \
            tests/unit/test_run_mlb_v8_historical_context_pointer_migration.py \
            tests/unit/test_warm_and_verify_mlb_lock_status.py
          python scripts/migrate_v7_v10_stall_fixes.py --check
          python scripts/verify_mlb_no_bbd_runtime.py
          python scripts/stabilize_mlb_deploy_source.py
          git diff --check

      - name: Commit verified stall fixes to repair branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'V7-V10 stall fixes are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/migrate_v7_v10_stall_fixes.py \
            hello_world/mlb_historical_v7_feature_bridge_v1.py \
            scripts/run_mlb_historical_supervised_v9_shadow_feature_aware.py \
            scripts/run_mlb_v8_historical_context_backfill_entrypoint.py \
            scripts/stabilize_mlb_deploy_source.py \
            .github/workflows/deploy.yml \
            .github/workflows/mlb-historical-supervised-v9-shadow.yml \
            tests/unit/test_run_mlb_historical_supervised_v9_shadow_feature_aware.py
          git commit -m 'Apply verified V7-V10 stall fixes'
          git push origin "HEAD:${BRANCH}"
