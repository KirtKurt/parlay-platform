name: Repair MLB AUTO model authority fallback v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-auto-ml-authority-fallback-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-auto-ml-authority-fallback-repair-v2
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - name: Reapply installer and correct generated source
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          import textwrap
          from pathlib import Path

          installer = Path('.github/workflows/repair-mlb-auto-ml-authority-fallback-once.yml')
          source = installer.read_text(encoding='utf-8')
          match = re.search(
              r"(?ms)^      - name: Install Bedrock-first AWS ML fallback without weakening three-source authority\n"
              r"        run: \|\n"
              r"          set -euo pipefail\n"
              r"          python - <<'PY'\n"
              r"(?P<body>.*?)"
              r"^          PY\n",
              source,
          )
          if match is None:
              raise RuntimeError('ORIGINAL_INSTALLER_BODY_NOT_FOUND')
          body = textwrap.dedent(match.group('body'))
          exec(compile(body, str(installer) + ':embedded-python', 'exec'), {'__name__': '__main__'})

          orchestrator = Path('mlb_auto_llm/orchestrator_v3.py')
          text = orchestrator.read_text(encoding='utf-8')
          bad = 'ALLOWED_MODEL_AUTHORITIES = {"BEDROCK_LLM", ML_AUTHORITY]'
          good = 'ALLOWED_MODEL_AUTHORITIES = {"BEDROCK_LLM", ML_AUTHORITY}'
          if bad not in text and good not in text:
              raise RuntimeError('MODEL_AUTHORITY_SET_ANCHOR_MISSING')
          orchestrator.write_text(text.replace(bad, good), encoding='utf-8')

          authority = Path('mlb_auto_llm/ml_authority.py')
          text = authority.read_text(encoding='utf-8')
          start = text.find('def _row_probability(')
          if start < 0:
              raise RuntimeError('ROW_PROBABILITY_FUNCTION_MISSING')
          next_function = text.find('\ndef ', start + 1)
          if next_function < 0:
              raise RuntimeError('ROW_PROBABILITY_FUNCTION_END_MISSING')
          replacement = '''def _row_probability(row: Dict[str, Any]) -> float:
              value = _first(
                  row,
                  (
                      "probability",
                      "winProbability",
                      "win_probability",
                      "modelProbability",
                      "model_probability",
                      "predictedProbability",
                      "predicted_probability",
                      "confidenceProbability",
                      "confidence_probability",
                  ),
              )
              if value is None and isinstance(row.get("prediction"), dict):
                  value = _first(
                      row["prediction"],
                      ("probability", "winProbability", "win_probability", "confidence"),
                  )
              try:
                  number = float(value)
              except (TypeError, ValueError):
                  number = 0.5
              if number > 1.0:
                  number /= 100.0
              if not math.isfinite(number):
                  number = 0.5
              return min(max(number, 0.5), 0.95)
          '''
          replacement = textwrap.dedent(replacement).rstrip() + '\n'
          text = text[:start] + replacement + text[next_function + 1 :]
          bad = 'bedrock_failur or ""'
          good = 'bedrock_failure or ""'
          if bad not in text and good not in text:
              raise RuntimeError('BEDROCK_FAILURE_METADATA_ANCHOR_MISSING')
          text = text.replace(bad, good)
          authority.write_text(text, encoding='utf-8')

          deploy = Path('.github/workflows/deploy-mlb-auto-llm.yml')
          text = deploy.read_text(encoding='utf-8')
          expanded = '      - name: Prove Bedrock or AWS ML authority through deployed MLB Lambda role'
          canonical = '      - name: Prove Bedrock through deployed MLB Lambda role'
          if expanded not in text and canonical not in text:
              raise RuntimeError('CANONICAL_BEDROCK_VERIFICATION_MARKER_MISSING')
          deploy.write_text(text.replace(expanded, canonical), encoding='utf-8')
          print('Corrected generated MLB AUTO model authority source and preserved canonical verifier markers.')
          PY

      - name: Verify source, tests, SAM, and sport isolation
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          if ! python -m py_compile \
            mlb_auto_llm/handler.py \
            mlb_auto_llm/model_gateway.py \
            mlb_auto_llm/orchestrator.py \
            mlb_auto_llm/orchestrator_v2.py \
            mlb_auto_llm/orchestrator_v3.py \
            mlb_auto_llm/ml_authority.py \
            mlb_auto_llm/ml_authority_smoke.py \
            mlb_auto_llm/bedrock_smoke.py; then
            nl -ba mlb_auto_llm/ml_authority.py | sed -n '1,520p'
            nl -ba mlb_auto_llm/orchestrator_v3.py | sed -n '1,620p'
            exit 1
          fi
          PYTHONPATH=mlb_auto_llm python -m pytest -q \
            tests/unit/test_mlb_auto_model_gateway.py \
            tests/unit/test_mlb_auto_ml_authority.py
          python scripts/verify_mlb_no_bbd_runtime.py
          sam validate --template-file mlb-auto-llm-template.yaml --lint
          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(tennis_learning/|tennis-template\.yaml|soccer_auto/|soccer-auto-template\.yaml|nfl_auto/|nfl-auto-template\.yaml)'; then
            echo '::error::Sport isolation violation'
            exit 1
          fi

      - name: Commit repaired production source to main
        run: |
          set -euo pipefail
          # Preserve exact, tested workflow rewrites as ordinary report files so
          # a workflow-authorized connector can install them byte-for-byte.
          mkdir -p runtime_reports
          cp .github/workflows/deploy-mlb-auto-llm.yml \
            runtime_reports/deploy-mlb-auto-llm.patched.yml
          cp .github/workflows/verify-mlb-auto-production-chain.yml \
            runtime_reports/verify-mlb-auto-production-chain.patched.yml

          # This runner token intentionally has no workflow-write scope.
          git checkout -- \
            .github/workflows/deploy-mlb-auto-llm.yml \
            .github/workflows/verify-mlb-auto-production-chain.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mlb_auto_llm/ml_authority.py \
            mlb_auto_llm/ml_authority_smoke.py \
            mlb_auto_llm/orchestrator_v3.py \
            tests/unit/test_mlb_auto_ml_authority.py \
            mlb-auto-llm-template.yaml \
            runtime_reports/deploy-mlb-auto-llm.patched.yml \
            runtime_reports/verify-mlb-auto-production-chain.patched.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Repair MLB AUTO with Bedrock-first AWS ML authority fallback'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
