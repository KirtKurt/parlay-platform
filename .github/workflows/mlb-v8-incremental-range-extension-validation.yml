name: MLB V8 Incremental Range Extension Validation

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_historical_incremental_range_extension_v1.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'tests/unit/test_mlb_historical_incremental_range_extension_v1.py'
      - '.github/workflows/mlb-v8-incremental-range-extension-validation.yml'

permissions:
  contents: read

concurrency:
  group: mlb-v8-incremental-range-extension-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test settled-horizon extension
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          PYTHONPATH=hello_world python -m py_compile \
            hello_world/mlb_historical_incremental_range_extension_v1.py \
            hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py
          PYTHONPATH=. python -m pytest -q --tb=short \
            tests/unit/test_mlb_historical_incremental_range_extension_v1.py \
            tests/unit/test_mlb_historical_competitive_schedule_filter.py
