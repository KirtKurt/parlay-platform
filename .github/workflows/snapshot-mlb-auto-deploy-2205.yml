name: Snapshot MLB AUTO deploy 2205

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-mlb-auto-deploy-2205.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture deploy and verification runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports /tmp/mlb-auto-runs
          for workflow in deploy-mlb-auto-llm.yml verify-mlb-auto-production-chain.yml repair-mlb-auto-ml-authority-fallback-v2.yml; do
            safe=$(printf '%s' "$workflow" | tr '.-' '__')
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --limit 12 \
              --json databaseId,workflowName,event,headBranch,headSha,status,conclusion,createdAt,updatedAt,url \
              > "/tmp/mlb-auto-runs/${safe}.json" || printf '[]\n' > "/tmp/mlb-auto-runs/${safe}.json"
          done
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          body={
              'proofType':'MLB_AUTO_DEPLOY_RUN_SNAPSHOT',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'workflows':{},
              'secretExposed':False,
          }
          for path in sorted(Path('/tmp/mlb-auto-runs').glob('*.json')):
              try:
                  body['workflows'][path.stem]=json.loads(path.read_text())
              except Exception:
                  body['workflows'][path.stem]=[]
          Path('runtime_reports/mlb_auto_deploy_run_snapshot_latest.json').write_text(
              json.dumps(body, indent=2, sort_keys=True)+'\n'
          )
          PY
      - name: Publish snapshot
        run: |
          set -euo pipefail
          cp runtime_reports/mlb_auto_deploy_run_snapshot_latest.json /tmp/mlb-auto-runs/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-auto-deploy-run-snapshot origin/main
            git reset --hard origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-auto-runs/report.json runtime_reports/mlb_auto_deploy_run_snapshot_latest.json
            git add runtime_reports/mlb_auto_deploy_run_snapshot_latest.json
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB AUTO deploy run snapshot [skip ci]'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
