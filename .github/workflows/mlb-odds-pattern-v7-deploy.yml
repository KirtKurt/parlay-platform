name: MLB Odds Pattern V7 Deploy

"on":
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_historical_derived_features_v1.py'
      - 'hello_world/mlb_odds_pattern_features_v1.py'
      - 'hello_world/mlb_historical_optimizer_entrypoint.py'
      - 'mlb_historical_optimizer/**'
      - '.github/workflows/mlb-odds-pattern-v7-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parlay-platform-deploy
  cancel-in-progress: false

env:
  HISTORICAL_START_DATE: '2025-04-01'
  HISTORICAL_END_DATE: '2025-10-31'
  HISTORICAL_TARGET_GAMES: '1600'
  HISTORICAL_MAX_CREDITS: '300000'
  HISTORICAL_MAX_CANDIDATES: '25000'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - name: Install validation dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
      - name: Validate V7 pattern stack
        run: |
          set -euo pipefail
          python -m py_compile \
            hello_world/mlb_historical_derived_features_v1.py \
            hello_world/mlb_odds_pattern_features_v1.py \
            hello_world/mlb_historical_optimizer_entrypoint.py \
            hello_world/mlb_historical_daily_optimizer_v1.py \
            hello_world/mlb_historical_policy_v1.py \
            hello_world/mlb_historical_optimizer_handler.py
          python -m pytest -q \
            tests/unit/test_mlb_historical_policy_v1.py \
            tests/unit/test_mlb_historical_daily_optimizer_v1.py \
            tests/unit/test_mlb_historical_optimizer_handler.py \
            tests/unit/test_mlb_historical_read_api_contract.py
          sam validate --template-file mlb_historical_optimizer/template.yaml
          sam validate --template-file template.yaml
          sam build --no-cached --build-dir .aws-sam-historical --template-file mlb_historical_optimizer/template.yaml
          sam build --no-cached --build-dir .aws-sam-runtime --template-file template.yaml

  deploy-runtime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-mlb-patterns-v7]')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Build and deploy production runtime
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          INQSI_ADMIN_API_TOKEN_VALUE: ${{ secrets.INQSI_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          test -n "${ODDS_API_KEY_VALUE:-}"
          test -n "${INQSI_ADMIN_API_TOKEN_VALUE:-}"
          sam build --no-cached --build-dir .aws-sam-runtime --template-file template.yaml
          TEMPLATE_SHA256=$(sha256sum template.yaml | awk '{print $1}')
          sam deploy \
            --template-file .aws-sam-runtime/template.yaml \
            --stack-name parlay-platform-dev \
            --region "${{ secrets.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 --force-upload --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              "InqsiAdminApiToken=${INQSI_ADMIN_API_TOKEN_VALUE}" \
              "DeployGitSha=${GITHUB_SHA}" \
              "DeployTemplateSha256=${TEMPLATE_SHA256}" \
              "DeployRunId=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-mlb-pattern-v7"

  deploy-optimizer-and-resume:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-mlb-patterns-v7]')
    needs: [validate, deploy-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy historical optimizer V7
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          test -n "${ODDS_API_KEY_VALUE:-}"
          sam build --no-cached --build-dir .aws-sam-historical --template-file mlb_historical_optimizer/template.yaml
          sam deploy \
            --template-file .aws-sam-historical/template.yaml \
            --stack-name parlay-platform-mlb-historical-optimizer \
            --region "${{ secrets.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 --force-upload --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              "TargetSnapshotsTable=parlay_platform_snapshots" \
              "HistoricalStartDate=${HISTORICAL_START_DATE}" \
              "HistoricalEndDate=${HISTORICAL_END_DATE}" \
              "HistoricalTargetGames=${HISTORICAL_TARGET_GAMES}" \
              "HistoricalMaxCredits=${HISTORICAL_MAX_CREDITS}" \
              "HistoricalRequestsPerRun=20" \
              "HistoricalMaxCandidates=${HISTORICAL_MAX_CANDIDATES}" \
              "HistoricalMaxOptimizationRounds=6" \
              "HistoricalFreshAuditIncrementGames=250" \
              "HistoricalRangeExtensionAuthorized=true" \
              "DeployGitSha=${GITHUB_SHA}"
      - name: Resume optimizer and prove V7 configuration
        run: |
          set -euo pipefail
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name parlay-platform-mlb-historical-optimizer \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" \
            --output text)
          test -n "$FUNCTION_NAME"
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"mode":"run","run":"mlb_odds_pattern_v7_deploy_resume"}' \
            /tmp/mlb-pattern-v7-resume.json
          cat /tmp/mlb-pattern-v7-resume.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/mlb-pattern-v7-resume.json').read_text())
          if value.get('ok') is not True:
              raise SystemExit('optimizer resume failed')
          state=value.get('state') or {}
          if str(state.get('endDate') or '') < '2025-10-31':
              raise SystemExit('expanded historical range is not active')
          if state.get('phase') in {'DATA_RANGE_EXHAUSTED','RANGE_EXTENSION_BLOCKED_INCOMPLETE_LEDGER'}:
              raise SystemExit('optimizer did not resume after V7 deployment')
          PY
      - name: Upload deployment proof
        uses: actions/upload-artifact@v4
        with:
          name: mlb-odds-pattern-v7-${{ github.sha }}
          path: /tmp/mlb-pattern-v7-resume.json
          retention-days: 90
