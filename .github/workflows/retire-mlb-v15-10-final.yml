name: Finalize MLB V15.10 retirement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-mlb-v15-10-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-mlb-v15-10-retirement
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply tested MLB Auto retirement patch
        run: |
          python - <<'PY'
          from pathlib import Path

          authority = Path('mlb_auto_llm/ml_authority.py')
          s = authority.read_text()
          s = s.replace(
              'AUTHORITY = "AWS_ML_RANKED_ENSEMBLE"\nEXPECTED_MODEL = "INQSI-MLB-v5.0-ranked-winner-v15.10-active-ensemble"\n',
              'AUTHORITY = "AWS_ML_PROSPECTIVE_R7"\nRETIREMENT_POLICY = "MLB-AUTO-RETIRE-V15.10-v1"\nRETIRED_MODELS = {"INQSI-MLB-v5.0-ranked-winner-v15.10-active-ensemble"}\nRETIRED_ALGORITHMS = {"INQSI-MLB-RANKED-WINNER-v15.10.0-active-ensemble"}\n', 1)
          old = '''    model_version = str(\n        payload.get("model_version")\n        or payload.get("game_winner_model")\n        or payload.get("modelVersion")\n        or EXPECTED_MODEL\n    )\n    primary_algorithm = str(\n        payload.get("primaryAlgorithm")\n        or payload.get("primary_algorithm")\n        or "INQSI-MLB-RANKED-WINNER-v15.10.0-active-ensemble"\n    )\n'''
          new = '''    model_version = str(\n        payload.get("model_version")\n        or payload.get("game_winner_model")\n        or payload.get("modelVersion")\n        or ""\n    ).strip()\n    primary_algorithm = str(\n        payload.get("primaryAlgorithm")\n        or payload.get("primary_algorithm")\n        or ""\n    ).strip()\n    if not model_version or not primary_algorithm:\n        raise RuntimeError("MLB_ML_MODEL_IDENTITY_MISSING")\n    if model_version in RETIRED_MODELS or primary_algorithm in RETIRED_ALGORITHMS:\n        raise RuntimeError(\n            "MLB_ML_RETIRED_AUTHORITY_REJECTED:" + model_version + ":" + primary_algorithm\n        )\n'''
          if old not in s:
              raise SystemExit('authority identity block not found')
          authority.write_text(s.replace(old, new, 1))

          tests = Path('tests/unit/test_mlb_auto_ml_authority.py')
          t = tests.read_text()
          t = t.replace(
              '"model_version": ml_authority.EXPECTED_MODEL,\n            "primaryAlgorithm": "INQSI-MLB-RANKED-WINNER-v15.10.0-active-ensemble",',
              '"model_version": "INQSI-MLB-AWS-PROSPECTIVE-R7-candidate",\n            "primaryAlgorithm": "INQSI-MLB-AWS-PROSPECTIVE-R7",', 1)
          t = t.replace('row["decisionAuthority"] == "AWS_ML_RANKED_ENSEMBLE"',
                        'row["decisionAuthority"] == "AWS_ML_PROSPECTIVE_R7"', 1)
          marker = '\n\ndef test_ml_card_fails_closed_when_a_game_is_missing(monkeypatch):\n'
          extra = '''\n\ndef test_retired_v15_10_is_never_accepted(monkeypatch):\n    monkeypatch.setattr(ml_authority, "fetch_predictions", lambda slate: {\n        "ok": True,\n        "model_version": "INQSI-MLB-v5.0-ranked-winner-v15.10-active-ensemble",\n        "primaryAlgorithm": "INQSI-MLB-RANKED-WINNER-v15.10.0-active-ensemble",\n        "winner_predictions": [\n            {"gamePk": "1", "predictedWinner": "Home One", "probability": 0.61},\n            {"gamePk": "2", "predictedWinner": "Away Two", "probability": 0.58},\n        ],\n    })\n    with pytest.raises(RuntimeError, match="MLB_ML_RETIRED_AUTHORITY_REJECTED"):\n        ml_authority.build_card(packet())\n\n\ndef test_missing_model_identity_fails_closed(monkeypatch):\n    monkeypatch.setattr(ml_authority, "fetch_predictions", lambda slate: {\n        "ok": True,\n        "winner_predictions": [\n            {"gamePk": "1", "predictedWinner": "Home One", "probability": 0.61},\n            {"gamePk": "2", "predictedWinner": "Away Two", "probability": 0.58},\n        ],\n    })\n    with pytest.raises(RuntimeError, match="MLB_ML_MODEL_IDENTITY_MISSING"):\n        ml_authority.build_card(packet())\n'''
          if marker not in t:
              raise SystemExit('test marker not found')
          t = t.replace(marker, extra + marker, 1)
          t = t.replace('''        lambda slate: {\n            "ok": True,\n            "winner_predictions": [\n                {\n                    "gamePk": "1",''', '''        lambda slate: {\n            "ok": True,\n            "model_version": "INQSI-MLB-AWS-PROSPECTIVE-R7-candidate",\n            "primaryAlgorithm": "INQSI-MLB-AWS-PROSPECTIVE-R7",\n            "winner_predictions": [\n                {\n                    "gamePk": "1",''', 1)
          tests.write_text(t)

          auto_deploy = Path('.github/workflows/deploy-mlb-auto-llm.yml')
          d = auto_deploy.read_text()
          old = "          grep -q 'AWS_ML_RANKED_ENSEMBLE' mlb_auto_llm/ml_authority.py\n"
          new = "          grep -q 'AWS_ML_PROSPECTIVE_R7' mlb_auto_llm/ml_authority.py\n          grep -q 'MLB_ML_RETIRED_AUTHORITY_REJECTED' mlb_auto_llm/ml_authority.py\n"
          if old not in d:
              raise SystemExit('MLB Auto deploy authority check not found')
          auto_deploy.write_text(d.replace(old, new, 1))

          legacy = Path('.github/workflows/deploy.yml')
          x = legacy.read_text()
          anchor = '      - ".github/workflows/deploy-soccer-auto.yml"\n'
          replacement = anchor + '      - "mlb_auto_llm/**"\n      - "mlb-auto-llm-template.yaml"\n      - "tests/unit/test_mlb_auto_*.py"\n      - ".github/workflows/deploy-mlb-auto-llm.yml"\n'
          if '      - "mlb_auto_llm/**"\n' not in x:
              if anchor not in x:
                  raise SystemExit('legacy paths-ignore anchor not found')
              legacy.write_text(x.replace(anchor, replacement, 1))
          PY
          git rm -f .github/workflows/deploy-mlb-ranked-v15-10.yml .github/workflows/verify-and-recover-mlb-v15-10.yml
      - name: Verify retirement
        run: |
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          PYTHONPATH=mlb_auto_llm python -m pytest -q tests/unit/test_mlb_auto_ml_authority.py tests/unit/test_mlb_auto_direct_read.py
          grep -q 'AWS_ML_PROSPECTIVE_R7' mlb_auto_llm/ml_authority.py
          grep -q 'MLB_ML_RETIRED_AUTHORITY_REJECTED' mlb_auto_llm/ml_authority.py
          test ! -e .github/workflows/deploy-mlb-ranked-v15-10.yml
          test ! -e .github/workflows/verify-and-recover-mlb-v15-10.yml
      - name: Commit and rebase safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Retire V15.10 from MLB Auto authority [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
