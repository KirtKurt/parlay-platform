name: Inspect Tennis Scheduler 415

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tennis-scheduler-415.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Capture scheduler evidence
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-tennis-learning
          aws cloudformation describe-stacks --stack-name "$stack" --region "$REGION" > /tmp/stack.json
          aws cloudformation list-stack-resources --stack-name "$stack" --region "$REGION" > /tmp/resources.json
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          region=os.environ['REGION']
          resources=json.load(open('/tmp/resources.json')).get('StackResourceSummaries') or []
          now=datetime.now(timezone.utc); start=now-timedelta(hours=3)
          def call(args):
              p=subprocess.run(['aws',*args,'--region',region],capture_output=True,text=True)
              if p.returncode: return {'error':p.stderr.strip()}
              try: return json.loads(p.stdout or '{}')
              except Exception: return {'raw':p.stdout}
          rules=[]
          for row in resources:
              if row.get('ResourceType')!='AWS::Events::Rule': continue
              name=row.get('PhysicalResourceId')
              rules.append({
                  'logical_id':row.get('LogicalResourceId'),
                  'physical_id':name,
                  'resource_status':row.get('ResourceStatus'),
                  'describe':call(['events','describe-rule','--name',name]),
                  'targets':call(['events','list-targets-by-rule','--rule',name]),
                  'invocations':call(['cloudwatch','get-metric-statistics','--namespace','AWS/Events','--metric-name','Invocations','--dimensions',f'Name=RuleName,Value={name}','--start-time',start.isoformat(),'--end-time',now.isoformat(),'--period','300','--statistics','Sum']),
                  'failed_invocations':call(['cloudwatch','get-metric-statistics','--namespace','AWS/Events','--metric-name','FailedInvocations','--dimensions',f'Name=RuleName,Value={name}','--start-time',start.isoformat(),'--end-time',now.isoformat(),'--period','300','--statistics','Sum'])
              })
          controller=next((r.get('PhysicalResourceId') for r in resources if r.get('LogicalResourceId')=='TennisAutonomousControllerFunction'),None)
          payload={
              'checked_at':now.isoformat(),
              'window_start':start.isoformat(),
              'stack_status':json.load(open('/tmp/stack.json'))['Stacks'][0].get('StackStatus'),
              'rules':rules,
              'controller_function':controller,
              'controller_config':call(['lambda','get-function-configuration','--function-name',controller]) if controller else None,
              'controller_invocations':call(['cloudwatch','get-metric-statistics','--namespace','AWS/Lambda','--metric-name','Invocations','--dimensions',f'Name=FunctionName,Value={controller}','--start-time',start.isoformat(),'--end-time',now.isoformat(),'--period','300','--statistics','Sum']) if controller else None,
              'controller_errors':call(['cloudwatch','get-metric-statistics','--namespace','AWS/Lambda','--metric-name','Errors','--dimensions',f'Name=FunctionName,Value={controller}','--start-time',start.isoformat(),'--end-time',now.isoformat(),'--period','300','--statistics','Sum']) if controller else None,
              'mlb_resources_touched':False,
              'read_only':True
          }
          Path('/tmp/tennis_scheduler_diagnostic.json').write_text(json.dumps(payload,indent=2,sort_keys=True,default=str)+'\n')
          PY
      - name: Publish evidence and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p runtime
            cp /tmp/tennis_scheduler_diagnostic.json runtime/tennis_scheduler_diagnostic.json
            git rm -f .github/workflows/inspect-tennis-scheduler-415.yml
            git add runtime/tennis_scheduler_diagnostic.json
            git commit -m 'Publish tennis scheduler diagnostic [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
