name: Repair PR601 R7 remaining contract now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pr601-r7-remaining-contract-now.yml'

permissions:
  contents: write

concurrency:
  group: repair-pr601-r7-remaining-contract-now
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "4df94cf3383618b0a990bc41d55e2c955e2e12f2"
      - name: Apply MLB-only fail-closed contract repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          labels_path = Path('hello_world/mlb_canonical_final_labels_v1.py')
          coverage_path = Path('hello_world/mlb_slate_coverage_patch.py')
          alias_test_path = Path('tests/unit/test_mlb_cooperative_terminal_chunk.py')

          labels = labels_path.read_text()
          coverage = coverage_path.read_text()
          alias_tests = alias_test_path.read_text()

          old = '''        if not official_pk:\n            errors.append("terminal_official_game_pk_unresolved")\n        elif official_game_list:\n'''
          new = '''        if not official_pk:\n            errors.append("terminal_official_game_pk_unresolved")\n            # When an exact official roster is available, unresolved or\n            # conflicting persisted identity is also an explicit roster-binding\n            # failure.  Keep this fail-closed instead of allowing an unbound\n            # terminal row to count toward official-game-set completion.\n            if official_game_list:\n                errors.append("terminal_official_manifest_game_ambiguous")\n                errors.append("terminal_manifest_official_roster_binding_unresolved")\n        elif official_game_list:\n'''
          if labels.count(old) != 1:
              raise SystemExit('terminal roster binding block mismatch')
          labels = labels.replace(old, new, 1)

          old = '''    expected_official_pk = str(\n        game.get("officialGamePk")\n        or game.get("official_game_pk")\n        or ""\n    )\n    if str(item.get("slate_date") or "") != str(slate):\n        errors.append("terminal_manifest_slate_mismatch")\n    if str(item.get("game_identity") or "") != expected_identity:\n        errors.append("terminal_manifest_game_identity_mismatch")\n    if str(item.get("game_id") or "") != expected_game_id:\n        errors.append("terminal_manifest_game_id_mismatch")\n    if (\n        not expected_official_pk\n        or str(item.get("officialGamePk") or "") != expected_official_pk\n    ):\n        errors.append("terminal_manifest_official_game_pk_mismatch")\n'''
          new = '''    expected_official_pk = str(\n        game.get("officialGamePk")\n        or game.get("official_game_pk")\n        or ""\n    )\n    terminal_official_pk = str(\n        item.get("officialGamePk")\n        or item.get("official_game_pk")\n        or ""\n    )\n    if str(item.get("slate_date") or "") != str(slate):\n        errors.append("terminal_manifest_slate_mismatch")\n    if str(item.get("game_identity") or "") != expected_identity:\n        errors.append("terminal_manifest_game_identity_mismatch")\n    if str(item.get("game_id") or "") != expected_game_id:\n        errors.append("terminal_manifest_game_id_mismatch")\n    # Legacy provider manifests intentionally predate embedded Stats API gamePk\n    # fields.  For those manifests, retain exact provider identity/team/start and\n    # manifest-fingerprint binding while requiring the terminal row itself to\n    # carry an official gamePk.  New Stats-API-backed manifests remain strict:\n    # their embedded official gamePk must match exactly.\n    if expected_official_pk:\n        if terminal_official_pk != expected_official_pk:\n            errors.append("terminal_manifest_official_game_pk_mismatch")\n    elif not terminal_official_pk:\n        errors.append("terminal_manifest_official_game_pk_missing")\n'''
          if coverage.count(old) != 1:
              raise SystemExit('terminal manifest official-pk block mismatch')
          coverage = coverage.replace(old, new, 1)

          old = '''    token = real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.set(4)\n    try:\n        real_patch._candidate_items(object(), SLATE, game, scoring[:3])\n    finally:\n        real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.reset(\n            token\n        )\n    assert len(calls) == 4\n'''
          new = '''    # root + stable Stats API fallback + three provider aliases = five.\n    # Keep the fallback identity: it is required to discover a pre-lock snapshot\n    # that was persisted before a provider event ID existed.\n    token = real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.set(5)\n    try:\n        real_patch._candidate_items(object(), SLATE, game, scoring[:3])\n    finally:\n        real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.reset(\n            token\n        )\n    assert len(calls) == 5\n'''
          if alias_tests.count(old) != 1:
              raise SystemExit('alias cap fixture block mismatch')
          alias_tests = alias_tests.replace(old, new, 1)

          labels_path.write_text(labels)
          coverage_path.write_text(coverage)
          alias_test_path.write_text(alias_tests)
          PY
          git diff --check
      - name: Install verifier dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
      - name: Prove exact five formerly failing cases
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          pytest -q \
            tests/unit/test_mlb_canonical_final_labels_v1.py::test_final_label_validation_rejects_same_count_official_pk_swap \
            'tests/unit/test_mlb_canonical_final_labels_v1.py::test_final_label_terminal_requires_unique_official_roster_membership[outside_roster]' \
            tests/unit/test_mlb_cooperative_terminal_chunk.py::test_candidate_alias_queries_are_capped_before_any_query \
            tests/unit/test_mlb_public_per_game_authority.py::test_terminal_no_prediction_status_displays_without_current_prediction_row \
            tests/unit/test_mlb_public_per_game_authority.py::test_valid_quarantine_terminal_is_lifecycle_only_on_public_surface
      - name: Prove full affected contract suites
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          pytest -q \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_cooperative_terminal_chunk.py \
            tests/unit/test_mlb_public_per_game_authority.py
      - name: Run comprehensive MLB per-game-lock verifier
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python scripts/verify_mlb_per_game_lock.py
      - name: Commit only after all proofs pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hello_world/mlb_canonical_final_labels_v1.py \
            hello_world/mlb_slate_coverage_patch.py \
            tests/unit/test_mlb_cooperative_terminal_chunk.py
          git diff --cached --quiet && exit 1
          git commit -m 'Repair R7 terminal roster and legacy manifest validation'
          git push origin HEAD:codex/mlb-valid-prelock-quarantine-v4-567
      - name: Remove one-shot repair workflow from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/r7-repair-cleanup origin/main
          cd /tmp/r7-repair-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-pr601-r7-remaining-contract-now.yml
          git commit -m 'Remove completed PR601 R7 remaining repair [skip ci]'
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((n*2))
          done
          exit 1
