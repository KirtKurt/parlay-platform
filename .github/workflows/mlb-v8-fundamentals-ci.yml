name: MLB V8 Fundamentals CI

"on":
  push:
    branches: [main, agent/v8-fundamentals-ingestion]
    paths:
      - 'hello_world/mlb_v8_fundamentals_collector.py'
      - 'hello_world/bigballsdata_client.py'
      - 'mlb_v8_fundamentals/template.yaml'
      - 'tests/unit/test_mlb_v8_fundamentals_collector.py'
      - '.github/workflows/mlb-v8-fundamentals-ci.yml'
  pull_request:
    paths:
      - 'hello_world/mlb_v8_fundamentals_collector.py'
      - 'hello_world/bigballsdata_client.py'
      - 'mlb_v8_fundamentals/template.yaml'
      - 'tests/unit/test_mlb_v8_fundamentals_collector.py'
      - '.github/workflows/mlb-v8-fundamentals-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v8-fundamentals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test fundamentals collector
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'aws-sam-translator>=1.90,<2'
          python -m py_compile hello_world/bigballsdata_client.py hello_world/mlb_v8_fundamentals_collector.py
          python -m pytest -q tests/unit/test_mlb_v8_fundamentals_collector.py tests/unit/test_bigballsdata_client.py
      - name: Validate isolated SAM template
        run: |
          set -euo pipefail
          sam validate --lint --template-file mlb_v8_fundamentals/template.yaml || sam validate --template-file mlb_v8_fundamentals/template.yaml
      - name: Prove V7 isolation and fail-closed training contract
        run: |
          set -euo pipefail
          PYTHONPATH=hello_world python - <<'PY'
          from datetime import datetime, timezone
          from mlb_v8_fundamentals_collector import build_snapshot
          report = build_snapshot([], '2026-07-29', datetime.now(timezone.utc), 'ci')
          assert report['authority'] == 'V8_FUNDAMENTALS_SHADOW_ONLY'
          assert report['productionV7Unchanged'] is True
          assert report['automaticWagerAllowed'] is False
          assert report['trainingEligibleGameCount'] == 0
          print(report['fingerprint'])
          PY
