name: MLB V8 Fundamentals CI

"on":
  push:
    branches:
      - main
      - agent/mlb-remove-bbd-and-fix-blockers-20260802
    paths:
      - 'scripts/run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'scripts/remove_mlb_bbd_active_runtime.py'
      - 'scripts/verify_mlb_no_bbd_runtime.py'
      - 'tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'tests/unit/test_mlb_v8_historical_context_workflow.py'
      - 'tests/unit/test_verify_mlb_no_bbd_runtime.py'
      - '.github/workflows/mlb-v8-fundamentals-ci.yml'
      - '.github/workflows/mlb-v8-fundamentals-deploy.yml'
      - '.github/workflows/mlb-v8-historical-context-backfill.yml'
  pull_request:
    paths:
      - 'scripts/run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'scripts/remove_mlb_bbd_active_runtime.py'
      - 'scripts/verify_mlb_no_bbd_runtime.py'
      - 'tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py'
      - 'tests/unit/test_mlb_v8_historical_context_workflow.py'
      - 'tests/unit/test_verify_mlb_no_bbd_runtime.py'
      - '.github/workflows/mlb-v8-fundamentals-ci.yml'
      - '.github/workflows/mlb-v8-fundamentals-deploy.yml'
      - '.github/workflows/mlb-v8-historical-context-backfill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v8-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and test provider-neutral historical context
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
          python -m py_compile \
            scripts/run_mlb_v8_historical_context_backfill_entrypoint.py \
            scripts/remove_mlb_bbd_active_runtime.py \
            scripts/verify_mlb_no_bbd_runtime.py
          PYTHONPATH=scripts python -m pytest -q \
            tests/unit/test_run_mlb_v8_historical_context_backfill_entrypoint.py \
            tests/unit/test_mlb_v8_historical_context_workflow.py \
            tests/unit/test_verify_mlb_no_bbd_runtime.py

      - name: Prove active MLB workflows are provider-neutral
        run: |
          set -euo pipefail
          python scripts/remove_mlb_bbd_active_runtime.py --check
          python scripts/verify_mlb_no_bbd_runtime.py

      - name: Prove legacy fundamentals deploy is a compatibility dispatcher only
        run: |
          set -euo pipefail
          workflow=.github/workflows/mlb-v8-fundamentals-deploy.yml
          grep -Fq 'MLB V8 Fundamentals Compatibility Dispatcher' "$workflow"
          grep -Fq 'mlb-v8-historical-context-backfill.yml' "$workflow"
          grep -Fq 'provider-neutral V8 context workflow' "$workflow"
          if grep -Eq 'sam deploy|mlb_v8_fundamentals/template.yaml' "$workflow"; then
            echo 'Legacy V8 fundamentals deployment path is still active.' >&2
            exit 1
          fi

      - name: Prove context evidence remains shadow-only and leakage-safe
        run: |
          set -euo pipefail
          PYTHONPATH=scripts:hello_world python - <<'PY'
          import inspect
          import run_mlb_v8_historical_context_backfill_entrypoint as entry

          assert entry.AUTHORITY == 'V8_HISTORICAL_OFFICIAL_CONTEXT_SHADOW_ONLY'
          assert entry.REPORT_TYPE == 'MLB_V8_HISTORICAL_CONTEXT_BACKFILL'
          assert entry.ARCHIVED_WEATHER_MODEL == 'ecmwf_ifs'
          contract = inspect.getsource(entry.install_run_contract)
          for required in (
              '"bbsApiUsed": False',
              '"bbsCredentialRead": False',
              '"sameDayResultsExcluded": True',
              '"targetGameOutcomeUsed": False',
              '"selectionUsedOutcomes": False',
              '"productionAuthorityChanged": False',
              '"automaticWagerAllowed": False',
          ):
              assert required in contract, required
          print(entry.VERSION)
          PY
