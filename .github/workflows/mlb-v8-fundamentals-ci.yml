name: MLB V8 Fundamentals CI

"on":
  push:
    branches: [main, agent/v8-fundamentals-ingestion, agent/v8-fundamentals-hardening]
    paths:
      - 'hello_world/mlb_v8_fundamentals_collector.py'
      - 'hello_world/bigballsdata_client.py'
      - 'mlb_v8_fundamentals/template.yaml'
      - 'tests/unit/test_mlb_v8_fundamentals_collector.py'
      - 'tests/unit/test_bigballsdata_client.py'
      - '.github/workflows/mlb-v8-fundamentals-ci.yml'
      - '.github/workflows/mlb-v8-fundamentals-deploy.yml'
  pull_request:
    paths:
      - 'hello_world/mlb_v8_fundamentals_collector.py'
      - 'hello_world/bigballsdata_client.py'
      - 'mlb_v8_fundamentals/template.yaml'
      - 'tests/unit/test_mlb_v8_fundamentals_collector.py'
      - 'tests/unit/test_bigballsdata_client.py'
      - '.github/workflows/mlb-v8-fundamentals-ci.yml'
      - '.github/workflows/mlb-v8-fundamentals-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v8-fundamentals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - name: Compile and test fundamentals collector
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile hello_world/bigballsdata_client.py hello_world/mlb_v8_fundamentals_collector.py
          python -m pytest -q tests/unit/test_mlb_v8_fundamentals_collector.py tests/unit/test_bigballsdata_client.py
      - name: Validate and build isolated SAM template
        run: |
          set -euo pipefail
          sam validate --lint --template-file mlb_v8_fundamentals/template.yaml
          rm -rf .aws-sam-v8-fundamentals
          sam build --no-cached --build-dir .aws-sam-v8-fundamentals --template-file mlb_v8_fundamentals/template.yaml
          test -f .aws-sam-v8-fundamentals/FundamentalsCollectorFunction/mlb_v8_fundamentals_collector.py
          test -f .aws-sam-v8-fundamentals/FundamentalsCollectorFunction/bigballsdata_client.py
      - name: Prove V7 isolation and fail-closed training contract
        run: |
          set -euo pipefail
          PYTHONPATH=hello_world python - <<'PY'
          from datetime import datetime, timezone
          from mlb_v8_fundamentals_collector import build_snapshot
          report = build_snapshot([], '2026-07-29', datetime.now(timezone.utc), 'ci')
          assert report['authority'] == 'V8_FUNDAMENTALS_SHADOW_ONLY'
          assert report['productionV7Unchanged'] is True
          assert report['automaticWagerAllowed'] is False
          assert report['trainingEligibleGameCount'] == 0
          print(report['fingerprint'])
          PY
      - name: Prove deployment remains schedule-disabled without explicit manual authorization
        run: |
          set -euo pipefail
          grep -Fq "default: 'false'" .github/workflows/mlb-v8-fundamentals-deploy.yml
          grep -Fq "github.event_name == 'workflow_dispatch' && inputs.enable_schedule_after_canary == 'true'" .github/workflows/mlb-v8-fundamentals-deploy.yml
          grep -Fq "fullyAvailableGameCount" .github/workflows/mlb-v8-fundamentals-deploy.yml
