name: Apply Reconciled MLB R6 Repair Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-mlb-r6-reconciled-once.yml'

permissions:
  contents: write

concurrency:
  group: apply-reconciled-mlb-r6-repair-once
  cancel-in-progress: false

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2

      - name: Apply r6 repair to current main source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          old_id = 'mlb-v2-2026-07-29-future-prospective-r5'
          new_id = 'mlb-v2-2026-08-02-future-prospective-r6'
          old_cutoff = '2026-07-29T04:00:00+00:00'
          new_cutoff = '2026-08-02T04:00:00+00:00'

          changed = []
          for root in (Path('hello_world'), Path('scripts'), Path('tests/unit')):
              for path in root.rglob('*.py'):
                  text = path.read_text(encoding='utf-8')
                  updated = text.replace(old_id, new_id).replace(old_cutoff, new_cutoff)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))

          training = Path('hello_world/mlb_ml_aws_training_v1.py')
          text = training.read_text(encoding='utf-8')
          text = text.replace(
              'MLB ML production requires the future-prospective r5 experiment ID',
              'MLB ML production requires the configured prospective experiment ID',
          ).replace(
              'MLB ML production requires the future-prospective r5 release contract',
              'MLB ML production requires the configured prospective release contract',
          ).replace(
              'MLB ML r5 release cutoff must begin at the July 24 ET slate boundary',
              'MLB ML release cutoff must match the configured prospective slate boundary',
          )
          training.write_text(text, encoding='utf-8')
          changed.append(str(training))

          template = Path('template.yaml')
          text = template.read_text(encoding='utf-8')
          text = text.replace(old_id, new_id).replace(old_cutoff, new_cutoff)
          start = text.index('  MLBResultsSchedulerFunction:\n')
          end = text.index('\n  MLBMLTrainingFunction:\n', start)
          block = text[start:end]
          if re.search(r'(?m)^      Timeout:', block):
              block = re.sub(r'(?m)^      Timeout:.*$', '      Timeout: 600', block)
          else:
              block = block.replace(
                  '      Handler: mlb_results_scheduler.lambda_handler\n',
                  '      Handler: mlb_results_scheduler.lambda_handler\n'
                  '      # Canonical full-slate settlement performs strongly consistent\n'
                  '      # lock reads and immutable label writes for every official game.\n'
                  '      Timeout: 600\n',
                  1,
              )
          if re.search(r'(?m)^      MemorySize:', block):
              block = re.sub(r'(?m)^      MemorySize:.*$', '      MemorySize: 2048', block)
          else:
              block = block.replace('      Timeout: 600\n', '      Timeout: 600\n      MemorySize: 2048\n', 1)
          text = text[:start] + block + text[end:]
          template.write_text(text, encoding='utf-8')
          changed.append(str(template))

          for name in (
              'tests/unit/test_mlb_ml_aws_training_v1.py',
              'tests/unit/test_run_mlb_ml_v3_audit_report.py',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('2026-07-30', '2026-08-03')
              text = text.replace('2026-07-29', '2026-08-02')
              text = text.replace('datetime(2026, 7, 30', 'datetime(2026, 8, 3')
              text = text.replace('datetime(2026, 7, 29', 'datetime(2026, 8, 2')
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          clean_test = Path('tests/unit/test_mlb_ml_r5_clean_cutover.py')
          clean_test.write_text('''from __future__ import annotations\n\nfrom datetime import datetime, timezone\n\nimport pytest\n\nimport mlb_ml_aws_training_v1 as training\nimport mlb_ml_experiment_v2 as experiment\n\n\ndef _config(**overrides):\n    values = {\n        "artifacts_bucket": "versioned-artifacts",\n        "experiment_id": experiment.PRODUCTION_EXPERIMENT_ID,\n        "release_contract_id": experiment.PRODUCTION_RELEASE_CONTRACT_ID,\n        "release_cutoff_utc": experiment.PRODUCTION_RELEASE_CUTOFF_UTC,\n        "feature_vector_version": "MLB-ML-FROZEN-FEATURE-SNAPSHOT-v2-lock-safe-temporal-missingness",\n        "deployment_git_sha": "a" * 40,\n        "deployment_template_sha256": "b" * 64,\n        "automatic_promotion_enabled": False,\n    }\n    values.update(overrides)\n    return training.TrainingConfig(**values)\n\n\ndef test_r6_cutoff_is_clean_future_boundary_after_unrecoverable_prior_slates():\n    assert experiment.PRODUCTION_EXPERIMENT_ID == "mlb-v2-2026-08-02-future-prospective-r6"\n    assert experiment.PRODUCTION_RELEASE_CONTRACT_ID == experiment.PRODUCTION_EXPERIMENT_ID\n    assert experiment.PRODUCTION_RELEASE_CUTOFF_UTC == "2026-08-02T04:00:00+00:00"\n    activation = experiment.release_activation(\n        experiment_id=experiment.PRODUCTION_EXPERIMENT_ID,\n        release_contract_id=experiment.PRODUCTION_RELEASE_CONTRACT_ID,\n        release_cutoff_utc=experiment.PRODUCTION_RELEASE_CUTOFF_UTC,\n        activated_at_utc="2026-08-02T03:00:00+00:00",\n        deployment_git_sha="a" * 40,\n        deployment_template_sha256="b" * 64,\n    )\n    assert activation["immutable"] is True\n    assert activation["activatedAtUtc"] < activation["releaseCutoffUtc"]\n\n\ndef test_r6_loader_does_not_request_or_backfill_pre_cutover_slates(monkeypatch):\n    monkeypatch.setenv("OUTCOMES_TABLE", "outcomes")\n    monkeypatch.setenv("SNAPSHOTS_TABLE", "snapshots")\n    calls = []\n    def forbidden_schedule(date):\n        calls.append(("schedule", date))\n        raise AssertionError("no pre-r6 slate may be requested")\n    def forbidden_finalization(date, official):\n        calls.append(("finalization", date))\n        raise AssertionError("no pre-r6 slate may be finalized")\n    rows = training.load_canonical_training_rows(\n        _config(),\n        now=datetime(2026, 8, 2, 3, 30, tzinfo=timezone.utc),\n        official_schedule_loader=forbidden_schedule,\n        slate_finalization_loader=forbidden_finalization,\n    )\n    assert list(rows) == []\n    assert calls == []\n    assert rows.continuity["ok"] is True\n    assert rows.continuity["processedSlateDates"] == []\n    assert rows.continuity["blockedSlateDate"] is None\n    assert rows.continuity["finalizedGameSlateDates"] == []\n\n\ndef test_prior_identity_is_rejected_by_r6_production_config():\n    with pytest.raises(training.TrainingContractError, match="configured prospective experiment ID"):\n        _config(experiment_id="mlb-v2-2026-07-29-future-prospective-r5")\n''', encoding='utf-8')
          changed.append(str(clean_test))

          contract = Path('tests/unit/test_mlb_r6_recovery_contract.py')
          contract.write_text('''"""Fail-closed deployment contract for the August 2 MLB prospective reset."""\n\nfrom pathlib import Path\n\n\ndef _resource(text: str, name: str, next_name: str) -> str:\n    start = text.index(f"  {name}:\\n")\n    end = text.index(f"\\n  {next_name}:\\n", start)\n    return text[start:end]\n\n\ndef test_results_scheduler_has_full_slate_capacity():\n    text = Path("template.yaml").read_text()\n    block = _resource(text, "MLBResultsSchedulerFunction", "MLBMLTrainingFunction")\n    assert "Handler: mlb_results_scheduler.lambda_handler" in block\n    assert "Timeout: 600" in block\n    assert "MemorySize: 2048" in block\n    assert "MaximumRetryAttempts: 0" in block\n\n\ndef test_r6_starts_after_permanently_incomplete_slates():\n    text = Path("template.yaml").read_text()\n    assert "MLB_ML_EXPERIMENT_ID: 'mlb-v2-2026-08-02-future-prospective-r6'" in text\n    assert "MLB_ML_RELEASE_CONTRACT_ID: 'mlb-v2-2026-08-02-future-prospective-r6'" in text\n    assert "MLB_ML_RELEASE_CUTOFF_UTC: '2026-08-02T04:00:00+00:00'" in text\n    assert "INQSI_MLB_ML_AUTO_PROMOTE: 'false'" in text\n    assert "mlb-v2-2026-07-29-future-prospective-r5" not in text\n    assert "2026-07-29T04:00:00+00:00" not in text\n\n\ndef test_existing_lock_and_promotion_safety_is_unchanged():\n    text = Path("template.yaml").read_text()\n    assert "Handler: mlb_daily_pick_lock_protected.lambda_handler" in text\n    assert "Schedule: rate(1 minute)" in text\n    assert "MLB_REQUIRE_ALL_GAMES_FOR_LOCK: 'true'" in text\n    assert "INQSI_MLB_ML_AUTO_PROMOTE: 'false'" in text\n''', encoding='utf-8')
          changed.append(str(contract))
          print({'changedFiles': sorted(set(changed))})
          PY

      - name: Verify complete MLB source and backend contracts
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'requests>=2.31,<3' 'PyYAML>=6,<7' -r hello_world/requirements.txt
          python -m compileall -q hello_world scripts
          sam validate --template-file template.yaml
          python scripts/stabilize_mlb_deploy_source.py
          python scripts/patch_template_mlb_v1.py
          python scripts/patch_template_mlb_security.py
          python scripts/patch_template_mlb_results_routes.py
          git diff --check
          mapfile -t tests < <(find tests/unit -maxdepth 1 -type f -name 'test_mlb_*.py' -print | sort)
          test ${#tests[@]} -gt 0
          python -m pytest -q --tb=short "${tests[@]}"
          sam build --template-file template.yaml --cached
          python scripts/verify_mlb_schedule_invariants.py --template .aws-sam/build/template.yaml

      - name: Commit reconciled repair
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hello_world scripts template.yaml tests/unit
          git diff --cached --quiet && exit 0
          git commit -m 'Reconcile MLB r6 cutover with current production source'
          git push origin HEAD:"$HEAD_BRANCH"
