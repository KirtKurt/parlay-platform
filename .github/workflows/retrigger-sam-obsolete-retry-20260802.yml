name: Repair MLB fail-closed shadow authority verifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retrigger-sam-obsolete-retry-20260802.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-shadow-authority-verifier
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validators
        run: python -m pip install --quiet 'PyYAML>=6,<7' 'pytest>=8,<9'

      - name: Align live smoke verifier with manual-first fail-closed authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text(encoding='utf-8')
          old = "              'runtimeAuthorityActivationAvailable': True,"
          new = "              'runtimeAuthorityActivationAvailable': False,"
          if text.count(new) == 1 and text.count(old) == 0:
              print('Fail-closed shadow authority expectation is already installed.')
          elif text.count(old) == 1 and text.count(new) == 0:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit(
                  f'Deploy verifier drifted: old matches={text.count(old)}, '
                  f'new matches={text.count(new)}'
              )
          PY

      - name: Validate repair without weakening MLB gates
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text(encoding='utf-8')
          yaml.safe_load(text)
          assert text.count("'runtimeAuthorityActivationAvailable': False,") == 1
          assert text.count("'runtimeAuthorityActivationAvailable': True,") == 0
          assert 'MLB_V2_FIRST_PROMOTION_REQUIRES_MANUAL_REVIEW' in text
          assert 'MLB_V2_AUTOMATIC_PROMOTION_ENABLED' in text
          PY
          python scripts/stabilize_mlb_deploy_source.py
          python scripts/verify_mlb_workflow_authority.py
          python -m pytest -q \
            tests/unit/test_mlb_workflow_authority.py \
            tests/unit/test_mlb_model_version_authority.py \
            tests/unit/test_mlb_ml_runtime_install_explicit.py
          git diff --check

      - name: Publish tested verifier repair
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/deploy.yml; then
            echo 'Repair is already installed on main.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy.yml
          git commit -m 'fix(deploy): accept fail-closed MLB shadow authority'
          for attempt in $(seq 1 20); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          echo 'Failed to publish tested MLB verifier repair.' >&2
          exit 1
