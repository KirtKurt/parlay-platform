# One-shot artifact trigger: 2026-08-02T07:58Z
name: Export tested MLB shadow authority repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-mlb-shadow-authority-repair-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validators
        run: python -m pip install --quiet 'PyYAML>=6,<7' 'pytest>=8,<9'

      - name: Align canonical deployment and source verifier with fail-closed authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/deploy.yml'): (
                  "              'runtimeAuthorityActivationAvailable': True,",
                  "              'runtimeAuthorityActivationAvailable': False,",
              ),
              Path('scripts/verify_mlb_workflow_authority.py'): (
                  "            \"'runtimeAuthorityActivationAvailable': True\": (",
                  "            \"'runtimeAuthorityActivationAvailable': False\": (",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(new) == 1 and text.count(old) == 0:
                  print(f'{path}: fail-closed shadow authority contract already installed')
                  continue
              if text.count(old) != 1 or text.count(new) != 0:
                  raise SystemExit(
                      f'{path} drifted: old matches={text.count(old)}, '
                      f'new matches={text.count(new)}'
                  )
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate repair without weakening MLB gates
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          deploy = Path('.github/workflows/deploy.yml').read_text(encoding='utf-8')
          verifier = Path('scripts/verify_mlb_workflow_authority.py').read_text(encoding='utf-8')
          yaml.safe_load(deploy)
          assert deploy.count("'runtimeAuthorityActivationAvailable': False,") == 1
          assert deploy.count("'runtimeAuthorityActivationAvailable': True,") == 0
          assert verifier.count("\"'runtimeAuthorityActivationAvailable': False\": (") == 1
          assert verifier.count("\"'runtimeAuthorityActivationAvailable': True\": (") == 0
          assert "'firstPromotionRequiresManualReview': True," in deploy
          assert "'manualReviewCreatesShadowApprovalOnly': True," in deploy
          assert "'v2InferenceConsumerInstalled': False," in deploy
          assert "'automaticWagerAllowed': False," in deploy
          PY
          python scripts/verify_mlb_workflow_authority.py
          python -m pytest -q \
            tests/unit/test_mlb_workflow_authority.py \
            tests/unit/test_mlb_shadow_authority_deploy_gate.py
          git diff --check

      - name: Upload tested repair files
        uses: actions/upload-artifact@v4
        with:
          name: mlb-shadow-authority-repair-${{ github.run_id }}
          path: |
            .github/workflows/deploy.yml
            scripts/verify_mlb_workflow_authority.py
          if-no-files-found: error
          retention-days: 1
