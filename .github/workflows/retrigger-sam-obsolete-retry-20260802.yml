name: Patch MLB R7 deploy isolation self-check

"on":
  push:
    branches:
      - repair/run-mlb-r7-feature-identity-deploy-20260826
    paths:
      - '.github/workflows/retrigger-sam-obsolete-retry-20260802.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-mlb-r7-deploy-isolation-self-check
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/run-mlb-r7-feature-identity-deploy-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove validator self-match without weakening isolation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/deploy-mlb-r7-feature-identity-repair-now.yml')
          text=path.read_text(encoding='utf-8')
          old="forbidden = ('sam deploy', 'template.yaml', 'soccer', 'tennis', 'nfl')"
          new="forbidden = ('sam' + ' deploy', 'template' + '.yaml', 'soc' + 'cer', 'ten' + 'nis', 'n' + 'fl')"
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('isolation validator anchor drifted')
          path.write_text(text,encoding='utf-8')
          assert old not in text
          assert new in text
          PY
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/deploy-mlb-r7-feature-identity-repair-now.yml').read_text().lower()
          for token in ('sam deploy','template.yaml','soccer','tennis','nfl'):
              assert token not in source, token
          PY
          git diff --check
      - name: Commit validated workflow correction only
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/retrigger-sam-obsolete-retry-20260802.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/deploy-mlb-r7-feature-identity-repair-now.yml \
            .github/workflows/retrigger-sam-obsolete-retry-20260802.yml
          git diff --cached --check
          git commit -m 'Repair MLB R7 deploy isolation self-check'
          git pull --rebase origin repair/run-mlb-r7-feature-identity-deploy-20260826
          git push origin HEAD:repair/run-mlb-r7-feature-identity-deploy-20260826
