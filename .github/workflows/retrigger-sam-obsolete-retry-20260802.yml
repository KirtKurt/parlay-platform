name: Build validated MLB R7 stable feature identity repair

"on":
  push:
    branches:
      - repair/mlb-r7-stable-feature-identity-20260826
    paths:
      - '.github/workflows/retrigger-sam-obsolete-retry-20260802.yml'
      - 'hello_world/mlb_movement_feature_identity_v2.py'
      - 'scripts/apply_mlb_r7_stable_feature_identity_repair.py'
      - 'tests/unit/test_mlb_movement_feature_identity_v2.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mlb-r7-stable-feature-identity-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/mlb-r7-stable-feature-identity-20260826
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install identity and transport repair
        run: python scripts/apply_mlb_r7_stable_feature_identity_repair.py

      - name: Validate source-honest MLB-only repair
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m py_compile \
            hello_world/mlb_manual_pull.py \
            hello_world/mlb_movement_feature_identity_v2.py \
            scripts/invoke_mlb_trainer_with_retry.py \
            scripts/apply_mlb_r7_stable_feature_identity_repair.py
          python -m pytest -q \
            tests/unit/test_mlb_movement_feature_identity_v2.py \
            tests/unit/test_mlb_trainer_invoke_retry.py \
            tests/unit/test_mlb_scoring_guard_status.py \
            tests/unit/test_mlb_scoring_runtime_capacity.py
          python scripts/verify_mlb_schedule_invariants.py
          git diff --check
          ! git diff --name-only | grep -E '(^|/)(soccer|tennis|nfl)(/|_|-|$)'

      - name: Commit exact validated repair without workflow drift
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/retrigger-sam-obsolete-retry-20260802.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hello_world/mlb_manual_pull.py \
            hello_world/mlb_movement_feature_identity_v2.py \
            scripts/invoke_mlb_trainer_with_retry.py \
            scripts/apply_mlb_r7_stable_feature_identity_repair.py \
            tests/unit/test_mlb_movement_feature_identity_v2.py \
            .github/workflows/retrigger-sam-obsolete-retry-20260802.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Validated repair already persisted.'
            exit 0
          fi
          git commit -m 'Repair MLB R7 stable movement identity and trainer transport'
          git pull --rebase origin repair/mlb-r7-stable-feature-identity-20260826
          git push origin HEAD:repair/mlb-r7-stable-feature-identity-20260826
