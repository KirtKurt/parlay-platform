name: Probe MLB Auto predictions 20260813

on:
  push:
    branches:
      - agent/mlb-auto-fresh-status-20260813-1931
    paths:
      - .github/workflows/probe-mlb-auto-predictions-20260813.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-mlb-auto-predictions-20260813
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-auto-prod
  SLATE_DATE: '2026-08-13'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read authoritative MLB Auto prediction rows
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          FN=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" --logical-resource-id AutoFunction \
            --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text)
          LOCKS_TABLE=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" --logical-resource-id LocksTable \
            --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text)

          python - <<'PY' > event.json
          import json, os
          print(json.dumps({
              'requestContext': {'http': {'method': 'GET'}},
              'rawPath': '/prod/v1/mlb-auto/predictions',
              'queryStringParameters': {'date': os.environ['SLATE_DATE']},
          }))
          PY

          aws lambda invoke \
            --function-name "$FN" --region "$REGION" \
            --cli-read-timeout 180 --cli-connect-timeout 30 \
            --cli-binary-format raw-in-base64-out \
            --payload fileb://event.json predictions-response.json > invoke.json

          aws dynamodb query \
            --table-name "$LOCKS_TABLE" --region "$REGION" --consistent-read \
            --key-condition-expression 'PK = :pk' \
            --expression-attribute-values "{\":pk\":{\"S\":\"MLB_AUTO#LOCKS#${SLATE_DATE}\"}}" \
            --output json > locks-ddb.json

          python - <<'PY'
          import json
          from pathlib import Path

          def ddb(value):
              if not isinstance(value, dict) or len(value) != 1:
                  return value
              kind, raw = next(iter(value.items()))
              if kind == 'S': return raw
              if kind == 'N':
                  x = float(raw)
                  return int(x) if x.is_integer() else x
              if kind == 'BOOL': return bool(raw)
              if kind == 'NULL': return None
              if kind == 'M': return {k: ddb(v) for k, v in raw.items()}
              if kind == 'L': return [ddb(v) for v in raw]
              if kind in ('SS','NS'): return list(raw)
              return raw

          envelope=json.loads(Path('predictions-response.json').read_text())
          body=envelope.get('body') if isinstance(envelope, dict) else None
          payload=json.loads(body) if isinstance(body, str) else envelope
          rows=list(payload.get('predictions') or [])
          locks_raw=json.loads(Path('locks-ddb.json').read_text()).get('Items') or []
          locks=[{k: ddb(v) for k,v in item.items()} for item in locks_raw]
          lock_by_event={str(x.get('event_id') or x.get('SK') or ''):x for x in locks}
          clean=[]
          for row in rows:
              event_id=str(row.get('event_id') or row.get('SK') or '')
              lock=lock_by_event.get(event_id) or {}
              clean.append({
                  'event_id':event_id,
                  'away_team':row.get('away_team'),
                  'home_team':row.get('home_team'),
                  'commence_time':row.get('commence_time'),
                  'predicted_winner':row.get('predicted_winner'),
                  'win_probability':row.get('win_probability'),
                  'american_odds':row.get('american_odds'),
                  'price_book':row.get('price_book'),
                  'prediction_mode':row.get('prediction_mode'),
                  'model_id':row.get('model_id'),
                  'official_pick':bool(row.get('official_pick')),
                  'source_pull_at':row.get('source_pull_at'),
                  'lock_cutoff_at':row.get('lock_cutoff_at'),
                  'pre_lock_cutoff':row.get('pre_lock_cutoff'),
                  'locked':bool(lock),
                  'locked_predicted_winner':lock.get('predicted_winner'),
                  'locked_win_probability':lock.get('win_probability'),
                  'locked_prediction_mode':lock.get('prediction_mode'),
                  'locked_model_id':lock.get('model_id'),
                  'locked_official_pick':bool(lock.get('official_pick')) if lock else None,
                  'locked_source_pull_at':lock.get('source_pull_at'),
                  'locked_at':lock.get('locked_at'),
                  'source_before_or_at_cutoff':lock.get('source_before_or_at_cutoff'),
              })
          clean.sort(key=lambda x:(str(x.get('commence_time') or ''),str(x.get('event_id') or '')))
          report={
              'ok':payload.get('ok') is True,
              'sport':payload.get('sport'),
              'slate_date':payload.get('slate_date'),
              'count':len(clean),
              'official_pick_count':sum(1 for x in clean if x['official_pick']),
              'locked_count':sum(1 for x in clean if x['locked']),
              'predictions':clean,
          }
          Path('mlb-auto-predictions-20260813.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('=== MLB_AUTO_PREDICTIONS ===')
          print(json.dumps(report,indent=2,sort_keys=True))
          assert report['ok'] is True, report
          assert report['sport']=='mlb_auto', report
          assert report['slate_date']=='2026-08-13', report
          assert report['count']==9, report
          PY

      - name: Upload exact prediction evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-auto-predictions-${{ github.run_id }}
          path: |
            mlb-auto-predictions-20260813.json
            predictions-response.json
            locks-ddb.json
            invoke.json
          retention-days: 7
