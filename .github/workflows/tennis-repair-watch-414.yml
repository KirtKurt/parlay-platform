name: Tennis Repair Watch 414

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennis-repair-watch-414.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: tennis-repair-watch-414
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Dispatch and await isolated tennis deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          gh workflow run deploy-tennis-learning.yml --repo "$GH_REPO" --ref main

          run_id=''
          for attempt in $(seq 1 90); do
            gh api "repos/${GH_REPO}/actions/workflows/deploy-tennis-learning.yml/runs?event=workflow_dispatch&per_page=20" > /tmp/deploy-runs.json
            run_id=$(STARTED="$started" python - <<'PY'
          import json, os
          from datetime import datetime
          started=int(os.environ['STARTED'])
          candidates=[]
          for row in json.load(open('/tmp/deploy-runs.json')).get('workflow_runs') or []:
              raw=row.get('created_at')
              if not raw or row.get('head_branch') != 'main':
                  continue
              stamp=int(datetime.fromisoformat(raw.replace('Z','+00:00')).timestamp())
              if stamp >= started-30:
                  candidates.append((stamp, str(row.get('id') or '')))
          print(max(candidates)[1] if candidates else '')
          PY
            )
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id" || { echo '::error::Unable to identify dispatched tennis deployment run'; exit 1; }

          complete=false
          for attempt in $(seq 1 180); do
            gh api "repos/${GH_REPO}/actions/runs/${run_id}" > /tmp/deploy-run.json
            status=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/deploy-run.json')).get('status') or '')
          PY
            )
            if [ "$status" = completed ]; then complete=true; break; fi
            sleep 10
          done
          test "$complete" = true || { echo '::error::Tennis deployment did not complete before timeout'; exit 1; }
          gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/deploy-jobs.json
          conclusion=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/deploy-run.json')).get('conclusion') or '')
          PY
          )
          test "$conclusion" = success || { echo "::error::Tennis deployment concluded ${conclusion}"; exit 1; }

      - name: Capture fresh AWS and autonomy evidence
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-tennis-learning
          region="$AWS_REGION_VALUE"
          stack_status=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query 'Stacks[0].StackStatus' --output text)
          run_endpoint=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyRunApi'].OutputValue" --output text)
          status_endpoint=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" --output text)
          test "$stack_status" = UPDATE_COMPLETE
          test -n "$run_endpoint" && test "$run_endpoint" != None
          test -n "$status_endpoint" && test "$status_endpoint" != None

          curl --fail --retry 3 --retry-all-errors --retry-delay 10 -X POST --max-time 900 "$run_endpoint" -o /tmp/tennis-cycle.json
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 "$status_endpoint" -o /tmp/tennis-live-status.json

          export STACK_STATUS="$stack_status"
          export SOURCE_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          now=datetime.now(timezone.utc)
          cycle=json.loads(Path('/tmp/tennis-cycle.json').read_text())
          live=json.loads(Path('/tmp/tennis-live-status.json').read_text())
          deploy=json.loads(Path('/tmp/deploy-run.json').read_text())
          jobs_raw=json.loads(Path('/tmp/deploy-jobs.json').read_text())

          def as_int(v):
              try: return int(v)
              except Exception: return 0
          def as_float(v):
              try: return float(v)
              except Exception: return None

          training=as_int(live.get('training_samples'))
          audited=as_int(live.get('live_audit_count'))
          accuracy=as_float(live.get('live_accuracy'))
          brier=as_float(live.get('live_brier'))
          failures=as_int(live.get('consecutive_failures'))
          authority=str(live.get('authority') or 'UNKNOWN')
          gates={
              'training_samples_100': training >= 100,
              'live_audits_30': audited >= 30,
              'live_accuracy_55pct': accuracy is not None and accuracy >= 0.55,
              'brier_at_most_0_25': brier is not None and brier <= 0.25,
              'circuit_breaker_clear': failures < 3 and authority != 'DEGRADED',
          }
          last_cycle=live.get('last_cycle_at')
          age=None
          fresh=False
          if last_cycle:
              stamp=datetime.fromisoformat(str(last_cycle).replace('Z','+00:00')).astimezone(timezone.utc)
              age=round(max(0.0,(now-stamp).total_seconds()/60.0),2)
              fresh=age <= 25.0

          actions=cycle.get('actions') or {}
          collect=actions.get('collect') or {}
          settle=actions.get('settle') or {}
          runtime_error=bool(cycle.get('last_error') or collect.get('errors') or settle.get('errors') or failures >= 3 or authority == 'DEGRADED')

          snapshot={
              'all_promotion_gates_pass': all(gates.values()),
              'authority': authority,
              'automatic_prediction_allowed': bool(live.get('automatic_prediction_allowed',False)),
              'checked_at': now.isoformat(),
              'consecutive_failures': failures,
              'cycle_age_minutes': age,
              'cycle_fresh': fresh,
              'cycle_stale_before_repair': True,
              'expected_cycle_cadence_minutes': 15,
              'historical_backfill_enabled': live.get('historical_backfill_enabled'),
              'historical_backfill_required': live.get('historical_backfill_required'),
              'last_cycle_at': last_cycle,
              'last_error': live.get('last_error'),
              'last_warning': live.get('last_warning'),
              'live_accuracy': accuracy,
              'live_audit_count': audited,
              'live_brier': brier,
              'model_version': str(live.get('model_version')) if live.get('model_version') is not None else None,
              'operationally_healthy': os.environ.get('STACK_STATUS') == 'UPDATE_COMPLETE' and fresh and not runtime_error,
              'promotion_gates': gates,
              'query_error': None,
              'query_succeeded': True,
              'reason': live.get('reason'),
              'self_heal_attempted': True,
              'self_heal_error': None,
              'self_heal_succeeded': fresh and not runtime_error,
              'service': live.get('service'),
              'source_commit': os.environ.get('SOURCE_SHA'),
              'stack_status': os.environ.get('STACK_STATUS'),
              'stale_after_minutes': 25.0,
              'status_endpoint_available': True,
              'training_samples': training,
          }
          diagnostic={
              'actionable_runtime_error': runtime_error,
              'checked_at': now.isoformat(),
              'collection_summary': collect,
              'cycle_response': cycle,
              'mlb_resources_touched': False,
              'operationally_healthy': snapshot['operationally_healthy'],
              'settlement_summary': settle,
              'stack_status': os.environ.get('STACK_STATUS'),
              'status_after': live,
          }
          jobs=[]
          for job in jobs_raw.get('jobs') or []:
              jobs.append({
                  'id':job.get('id'),'name':job.get('name'),'status':job.get('status'),'conclusion':job.get('conclusion'),
                  'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion')} for s in job.get('steps') or []],
              })
          deploy_evidence={
              'checked_at':now.isoformat(),
              'workflow':'Deploy Tennis Learning',
              'run':{
                  'id':deploy.get('id'),'status':deploy.get('status'),'conclusion':deploy.get('conclusion'),
                  'event':deploy.get('event'),'head_sha':deploy.get('head_sha'),'created_at':deploy.get('created_at'),
                  'run_started_at':deploy.get('run_started_at'),'updated_at':deploy.get('updated_at'),'html_url':deploy.get('html_url'),
              },
              'jobs':jobs,
          }
          Path('/tmp/tennis_autonomy_status.json').write_text(json.dumps(snapshot,indent=2,sort_keys=True)+'\n')
          Path('/tmp/tennis_autonomy_diagnostic.json').write_text(json.dumps(diagnostic,indent=2,sort_keys=True,default=str)+'\n')
          Path('/tmp/tennis_deploy_runs.json').write_text(json.dumps(deploy_evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':snapshot,'diagnostic':diagnostic,'deploy':deploy_evidence},indent=2,sort_keys=True,default=str))
          PY

      - name: Publish evidence and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p runtime
            cp /tmp/tennis_autonomy_status.json runtime/tennis_autonomy_status.json
            cp /tmp/tennis_autonomy_diagnostic.json runtime/tennis_autonomy_diagnostic.json
            cp /tmp/tennis_deploy_runs.json runtime/tennis_deploy_runs.json
            git rm -f .github/workflows/tennis-repair-watch-414.yml
            git add runtime/tennis_autonomy_status.json runtime/tennis_autonomy_diagnostic.json runtime/tennis_deploy_runs.json
            git commit -m 'Publish fresh tennis repair evidence [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Unable to publish fresh tennis repair evidence' >&2
          exit 1
