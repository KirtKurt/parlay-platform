name: Build MLB R7 settlement-boundary v5.7 repair

"on":
  push:
    branches:
      - fix/mlb-r7-settlement-boundary-v57-20260827
    paths:
      - scripts/repair_mlb_r7_settlement_boundary_v57_once.py
      - .github/workflows/build-mlb-r7-settlement-boundary-v57.yml

permissions:
  contents: write

concurrency:
  group: build-mlb-r7-settlement-boundary-v57
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/mlb-r7-settlement-boundary-v57-20260827
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact boundary repair
        run: |
          set -euo pipefail
          python scripts/repair_mlb_r7_settlement_boundary_v57_once.py

      - name: Verify source and regression contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5_persistent_missed.py
          PYTHONPATH="scripts:${PYTHONPATH:-}" python -m pytest -q \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5_settlement_replay.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5_persistent_missed.py
          grep -q 'v4.5' scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'v5.7' scripts/reconcile_mlb_prospective_backlog_v5.py
          grep -q 'settlement_authoritative_persistent_missed' \
            scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'kwargs\["settlement_authoritative_persistent_missed"\] = True' \
            scripts/reconcile_mlb_prospective_backlog_v5.py
          git diff --check

      - name: Commit generated repair to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5_persistent_missed.py
          git diff --cached --quiet || \
            git commit -m 'Fix MLB R7 settlement authority boundary'
          git push origin HEAD:fix/mlb-r7-settlement-boundary-v57-20260827
