name: Retrigger MLB deploy after Titan recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retrigger-mlb-deploy-after-titan.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrigger-mlb-deploy-after-titan
  cancel-in-progress: false

jobs:
  wait-and-retrigger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for tested Titan source to reach main
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            git fetch origin main
            git reset --hard origin/main
            if grep -q 'def _invoke_titan_text' mlb_auto_llm/model_gateway.py \
              && grep -q 'amazon.titan-text-lite-v1' mlb_auto_llm/model_gateway.py; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true

      - name: Touch canonical isolated deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          path=Path('.github/workflows/deploy-mlb-auto-llm.yml')
          text=path.read_text(encoding='utf-8')
          lines=[line for line in text.splitlines() if not line.startswith('# titan-redeploy:')]
          lines.append('# titan-redeploy: ' + datetime.now(timezone.utc).isoformat())
          path.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
          git diff --check

      - name: Publish isolated deployment retrigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-mlb-auto-llm.yml
          git commit -m 'Retrigger MLB isolated deployment with Titan recovery'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo '::error::Unable to retrigger MLB isolated deployment'
          exit 1
