name: Trigger Tennis Status Refresh 394

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennis-status-refresh-394.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch permanent tennis status publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-tennis-autonomy-status.yml --repo "$GITHUB_REPOSITORY" --ref main
