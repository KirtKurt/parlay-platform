name: Hotfix MLB prospective trainer skip unresolved slate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-mlb-prospective-trainer-skip-aug4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotfix-mlb-prospective-trainer-skip-unresolved
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-dev

jobs:
  deploy-trainer-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify date-local fail-closed source
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
          python -m pytest -q \
            tests/unit/test_mlb_prospective_skip_unresolved_slate.py \
            tests/unit/test_mlb_trainer_continuity_compat_handler_v2.py \
            tests/unit/test_mlb_ml_aws_training_v1.py
          grep -q 'skipped_unresolved_slate_dates.append(slate_date)' hello_world/mlb_ml_aws_training_v1.py
          grep -q 'unresolvedSlateErrors' hello_world/mlb_ml_aws_training_v1.py

      - name: Build canonical trainer package
        run: |
          set -euo pipefail
          sam build --no-cached --template-file template.yaml MLBMLTrainingFunction
          cd .aws-sam/build/MLBMLTrainingFunction
          zip -qr /tmp/mlb-prospective-trainer.zip .

      - name: Update only the AWS prospective trainer Lambda
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" --logical-resource-id MLBMLTrainingFunction \
            --region "$AWS_REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          test -n "$function_name"
          aws lambda update-function-code --function-name "$function_name" --region "$AWS_REGION" \
            --zip-file fileb:///tmp/mlb-prospective-trainer.zip > /tmp/trainer-update.json
          aws lambda wait function-updated-v2 --function-name "$function_name" --region "$AWS_REGION"
          echo "$function_name" > /tmp/trainer-function.txt

      - name: Prove deployed package contains isolated-slate skip
        run: |
          set -euo pipefail
          function_name=$(cat /tmp/trainer-function.txt)
          location=$(aws lambda get-function --function-name "$function_name" --region "$AWS_REGION" --query 'Code.Location' --output text)
          curl --fail --silent --show-error "$location" -o /tmp/deployed-trainer.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/deployed-trainer.zip')
          text=z.read('mlb_ml_aws_training_v1.py').decode()
          assert 'skipped_unresolved_slate_dates.append(slate_date)' in text
          assert 'unresolvedSlateErrors' in text
          assert 'OFFICIAL_SLATE_UNRESOLVED' in text
          print('Deployed trainer date-local skip contract: PASS')
          PY

      - name: Run trainer now and verify it crosses August 4
        run: |
          set -euo pipefail
          function_name=$(cat /tmp/trainer-function.txt)
          aws lambda invoke --function-name "$function_name" --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 900 \
            --payload '{"mode":"scheduled"}' /tmp/trainer-run.json > /tmp/trainer-run-meta.json
          python - <<'PY'
          import json
          meta=json.load(open('/tmp/trainer-run-meta.json'))
          body=json.load(open('/tmp/trainer-run.json'))
          assert not meta.get('FunctionError'),(meta,body)
          continuity=body.get('canonicalSlateContinuity') or {}
          skipped=continuity.get('skippedUnresolvedSlateDates') or []
          processed=str(continuity.get('processedThroughSlateDate') or '')
          assert '2026-08-04' in skipped,(skipped,body)
          assert processed and processed > '2026-08-04',(processed,body)
          assert body.get('status') != 'CANONICAL_SLATE_CONTINUITY_BLOCKED',body
          print(json.dumps({
            'ok':body.get('ok'),
            'status':body.get('status'),
            'acceptedRowCount':body.get('acceptedRowCount'),
            'processedThroughSlateDate':processed,
            'skippedUnresolvedSlateDates':skipped,
            'trainingReady':body.get('trainingReady'),
            'modelTrained':body.get('modelTrained'),
          },indent=2,sort_keys=True))
          PY

      - name: Read latest trainer status
        run: |
          set -euo pipefail
          function_name=$(cat /tmp/trainer-function.txt)
          aws lambda invoke --function-name "$function_name" --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 300 \
            --payload '{"mode":"status"}' /tmp/trainer-status.json > /tmp/trainer-status-meta.json
          python - <<'PY'
          import json
          meta=json.load(open('/tmp/trainer-status-meta.json'))
          body=json.load(open('/tmp/trainer-status.json'))
          assert not meta.get('FunctionError'),(meta,body)
          print(json.dumps(body,indent=2,default=str)[:30000])
          PY
