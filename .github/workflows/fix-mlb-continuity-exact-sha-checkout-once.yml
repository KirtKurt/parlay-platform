name: Fix MLB continuity exact SHA checkout once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mlb-continuity-exact-sha-checkout-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-mlb-continuity-exact-sha-checkout-once
  cancel-in-progress: false

jobs:
  patch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin protected continuity checkout to immutable workflow SHA
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/repair-mlb-training-continuity-now.yml')
          text = path.read_text(encoding='utf-8')
          old = """      - name: Checkout exact main source
                uses: actions/checkout@v4
                with:
                  ref: main
                  fetch-depth: 0
          """.replace('                ', '')
          exact_ref = '$' + '{{ github.sha }}'
          new = old.replace('ref: main', f'ref: {exact_ref}')
          if old not in text:
              if new in text:
                  print('Exact SHA checkout already installed.')
              else:
                  raise SystemExit('Protected continuity checkout block changed unexpectedly')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Pinned protected continuity checkout to immutable workflow SHA.')
          PY

      - name: Verify fail-closed workflow identity contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/repair-mlb-training-continuity-now.yml')
          text = path.read_text(encoding='utf-8')
          value = yaml.load(text, Loader=yaml.BaseLoader)
          steps = value['jobs']['deploy-reconcile-and-train']['steps']
          checkout = next(step for step in steps if step.get('name') == 'Checkout exact main source')
          assert checkout['with']['ref'] == '${{ github.sha }}'
          assert checkout['with']['fetch-depth'] == '0'
          assert 'immutablePredictionRewriteAllowed' in text
          assert 'postStartPredictionCreationAllowed' in text
          assert 'productionAuthorityChanged' in text
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -le 1
          if [ "${#changed[@]}" -eq 1 ]; then
            test "${changed[0]}" = '.github/workflows/repair-mlb-training-continuity-now.yml'
          fi

      - name: Commit exact-checkout correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/repair-mlb-training-continuity-now.yml
          if git diff --cached --quiet; then
            echo 'No checkout correction required.'
            exit 0
          fi
          git commit -m 'Pin MLB R7 continuity deployment to exact workflow SHA'
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              pushed=true
              break
            fi
            git rebase --abort || true
            test "$attempt" != 5
            sleep $((attempt * 3))
          done
          test "$pushed" = true
