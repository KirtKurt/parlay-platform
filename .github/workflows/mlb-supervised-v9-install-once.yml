# Triggered through reviewed PR merge to ensure GitHub Actions execution.
name: Repair and Activate Supervised V7 Learning

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-supervised-v9-install-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-activate-supervised-v7
  cancel-in-progress: false

jobs:
  repair-test-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply idempotent supervised V7 repairs
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          entry_path=Path('hello_world/mlb_historical_optimizer_entrypoint.py')
          learner_path=Path('hello_world/mlb_historical_supervised_v9.py')
          recovery_path=Path('.github/workflows/mlb-historical-v7-recovery.yml')
          test_path=Path('tests/unit/test_mlb_supervised_v7_integrity_wiring.py')
          entry=entry_path.read_text()
          if 'import mlb_historical_supervised_v9 as supervised_v9' not in entry:
              entry=entry.replace('import mlb_odds_pattern_features_v1 as odds_pattern_features\n','import mlb_odds_pattern_features_v1 as odds_pattern_features\nimport mlb_historical_supervised_v9 as supervised_v9\n',1)
          entry=entry.replace('VERSION = "MLB-HISTORICAL-ENTRYPOINT-v9-opening-day-range-repair"','VERSION = "MLB-HISTORICAL-ENTRYPOINT-v10-supervised-v7-active"')
          anchor='odds_pattern_features.install(optimizer_handler.optimizer, optimizer_handler.policy_runtime)\n'
          if 'supervised_v9.install(optimizer_handler.optimizer, optimizer_handler.policy_runtime)' not in entry:
              assert anchor in entry
              entry=entry.replace(anchor,anchor+'supervised_v9.install(optimizer_handler.optimizer, optimizer_handler.policy_runtime)\n',1)
          entry_path.write_text(entry)
          learner=learner_path.read_text()
          if 'import mlb_v7_integrity_pattern_v1 as v7_integrity' not in learner:
              learner=learner.replace('import os\n','import os\nimport mlb_v7_integrity_pattern_v1 as v7_integrity\n',1)
          learner=learner.replace('FEATURE_VERSION = "MLB-SUPERVISED-PAIR-FEATURES-v1"','FEATURE_VERSION = "MLB-SUPERVISED-PAIR-FEATURES-v2-v7-integrity-patterns"')
          old='    "v8SpreadDirection", "fundamentalsDiff", "featureAvailability",\n)'
          new='    "v8SpreadDirection", "fundamentalsDiff", "featureAvailability",\n    "movementNetDiff", "movementEfficiencyDiff", "reversalMagnitudeDiff",\n    "lateMoveShareDiff", "trendPersistenceDiff", "accelerationEnergyDiff",\n    "stableConsensusDiff", "lowCoveragePenaltyDiff",\n)'
          if old in learner: learner=learner.replace(old,new,1)
          pair_anchor='        "featureAvailability": observed / 10.0,\n    }'
          pair_new='        "featureAvailability": observed / 10.0,\n        "movementNetDiff": _derived(home, "movementNet") - _derived(away, "movementNet"),\n        "movementEfficiencyDiff": _derived(home, "movementEfficiency") - _derived(away, "movementEfficiency"),\n        "reversalMagnitudeDiff": _derived(home, "reversalMagnitude") - _derived(away, "reversalMagnitude"),\n        "lateMoveShareDiff": _derived(home, "lateMoveShare") - _derived(away, "lateMoveShare"),\n        "trendPersistenceDiff": _derived(home, "trendPersistence") - _derived(away, "trendPersistence"),\n        "accelerationEnergyDiff": _derived(home, "accelerationEnergy") - _derived(away, "accelerationEnergy"),\n        "stableConsensusDiff": _derived(home, "stableConsensusSignal") - _derived(away, "stableConsensusSignal"),\n        "lowCoveragePenaltyDiff": _derived(home, "lowCoveragePenaltySignal") - _derived(away, "lowCoveragePenaltySignal"),\n    }'
          if '"movementNetDiff": _derived(home' not in learner:
              assert pair_anchor in learner
              learner=learner.replace(pair_anchor,pair_new,1)
          learner=learner.replace('out.append((day, [_f(values.get(name)) for name in FEATURES], int(row.get("homeWon") or 0)))','out.append((day, [_f(values.get(name)) for name in FEATURES], v7_integrity.strict_binary_label(row)))')
          learner=learner.replace('return (_f(metrics.get("dailyPassRate")),_f(metrics.get("minimumDailyAccuracy")),_f(metrics.get("meanDailyAccuracy")),_f(metrics.get("overallAccuracy")),-_f(metrics.get("brierScore"),1),-_f(metrics.get("logLoss"),10))','return v7_integrity.candidate_rank(metrics)')
          learner_path.write_text(learner)
          recovery=recovery_path.read_text()
          old_cfg='''            CONFIG=$(aws lambda get-function-configuration \\\n              --function-name "$FUNCTION_NAME" \\\n              --region "$AWS_REGION_VALUE" \\\n              --output json)\n            CONFIG="$CONFIG" FUNCTION_NAME="$FUNCTION_NAME" python - <<'PY'\n          import json, os\n          from pathlib import Path\n          value=json.loads(os.environ['CONFIG'])'''
          new_cfg='''            aws lambda get-function-configuration \\\n              --function-name "$FUNCTION_NAME" \\\n              --region "$AWS_REGION_VALUE" \\\n              --output json > /tmp/mlb-historical-function-config.json\n            FUNCTION_NAME="$FUNCTION_NAME" python - <<'PY'\n          import json, os\n          from pathlib import Path\n          value=json.loads(Path('/tmp/mlb-historical-function-config.json').read_text())'''
          recovery=recovery.replace(old_cfg,new_cfg)
          if "hello_world/mlb_historical_supervised_v9.py" not in recovery:
              recovery=recovery.replace("      - 'hello_world/mlb_historical_derived_features_v1.py'\n","      - 'hello_world/mlb_historical_derived_features_v1.py'\n      - 'hello_world/mlb_historical_supervised_v9.py'\n",1)
          if 'tests/unit/test_mlb_supervised_v7_integrity_wiring.py' not in recovery:
              recovery=recovery.replace('            tests/unit/test_mlb_historical_competitive_schedule_filter.py\n','            tests/unit/test_mlb_historical_competitive_schedule_filter.py \\\n            tests/unit/test_mlb_historical_supervised_v9.py \\\n            tests/unit/test_mlb_supervised_v7_integrity_wiring.py\n',1)
          if 'HistoricalOptimizerFunction/mlb_historical_supervised_v9.py' not in recovery:
              recovery=recovery.replace('          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_odds_pattern_features_v1.py\n','          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_odds_pattern_features_v1.py\n          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_historical_supervised_v9.py\n          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_v7_integrity_pattern_v1.py\n',1)
          recovery_path.write_text(recovery)
          test_path.write_text('''import pathlib\nimport sys\nimport pytest\nsys.path.insert(0, str(pathlib.Path(__file__).resolve().parents[2] / "hello_world"))\nimport mlb_historical_supervised_v9 as learner\n\ndef test_missing_label_fails_closed():\n    learner._ORIGINAL_SELECT=lambda h,a,p:("home", {"score":50}, {"score":50})\n    learner._ORIGINAL_COMPLEMENT=lambda h,a:(0.5,{})\n    with pytest.raises(ValueError):\n        learner._examples([{"slateDateEt":"2026-01-01","homeSignal":{},"awaySignal":{}}],["2026-01-01"],{})\n\ndef test_v7_features_and_rank_are_active():\n    required={"movementNetDiff","movementEfficiencyDiff","reversalMagnitudeDiff","lateMoveShareDiff","trendPersistenceDiff","accelerationEnergyDiff","stableConsensusDiff","lowCoveragePenaltyDiff"}\n    assert required.issubset(set(learner.FEATURES))\n    better={"meanDailyAccuracy":.61,"overallAccuracy":.60,"brierScore":.23,"logLoss":.66,"dailyPassRate":.1,"minimumDailyAccuracy":.4}\n    worse={"meanDailyAccuracy":.60,"overallAccuracy":.70,"brierScore":.20,"logLoss":.60,"dailyPassRate":.9,"minimumDailyAccuracy":.9}\n    assert learner._rank(better) > learner._rank(worse)\n''')
          assert 'supervised_v9.install(' in entry_path.read_text()
          assert 'strict_binary_label(row)' in learner_path.read_text()
          assert 'candidate_rank(metrics)' in learner_path.read_text()
          assert '/tmp/mlb-historical-function-config.json' in recovery_path.read_text()
          PY
      - name: Test repaired learning path
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile hello_world/mlb_historical_supervised_v9.py hello_world/mlb_v7_integrity_pattern_v1.py hello_world/mlb_historical_optimizer_entrypoint.py
          python -m pytest -q --tb=short tests/unit/test_mlb_v7_integrity_pattern_v1.py tests/unit/test_mlb_v7_learning_integration_v1.py tests/unit/test_mlb_historical_supervised_v9.py tests/unit/test_mlb_supervised_v7_integrity_wiring.py
          git diff --check
      - name: Publish repairs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hello_world/mlb_historical_optimizer_entrypoint.py hello_world/mlb_historical_supervised_v9.py .github/workflows/mlb-historical-v7-recovery.yml tests/unit/test_mlb_supervised_v7_integrity_wiring.py
          git commit -m 'Fix and activate supervised V7 historical learning'
          for attempt in 1 2 3 4 5 6; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
      - name: Dispatch recovery and shadow verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for workflow in mlb-historical-v7-recovery.yml mlb-historical-supervised-v9-shadow.yml; do
            gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" -f ref=main
          done
