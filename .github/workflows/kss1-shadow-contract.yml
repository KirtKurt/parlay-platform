name: KSS1 Shadow Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'soccer_auto/**'
      - 'tests/soccer_auto/**'
      - 'docs/KSS1_ENGINE.md'
      - 'soccer-auto-template.yaml'
      - 'scripts/train_kss1_goals.py'
      - 'scripts/kss1_open_data_research.py'
      - '.github/workflows/kss1-shadow-contract.yml'
  push:
    branches: [main]
    paths:
      - 'soccer_auto/**'
      - 'tests/soccer_auto/**'
      - 'soccer-auto-template.yaml'
      - 'scripts/train_kss1_goals.py'
      - '.github/workflows/kss1-shadow-contract.yml'

permissions:
  contents: read

jobs:
  soccer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
      - name: Verify soccer contracts on the candidate commit
        run: |
          git rev-parse HEAD
          python -m compileall -q soccer_auto
          python -m py_compile scripts/train_kss1_goals.py scripts/kss1_open_data_research.py
          python -m pytest -q tests/soccer_auto
