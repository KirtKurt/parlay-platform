name: Diagnose MLB AUTO BBD coverage now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-auto-bbd-coverage-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-mlb-auto-bbd-coverage-now
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe documented and pagination-compatible BBD query shapes
        env:
          BBS_API_KEY_VALUE: ${{ secrets.BBS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${BBS_API_KEY_VALUE:-}" || { echo '::error::Missing BBS_API_KEY'; exit 1; }
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          key=os.environ['BBS_API_KEY_VALUE']
          slate='2026-08-24'
          headers={
              'accept':'application/json',
              'authorization':f'Bearer {key}',
              'user-agent':'inqsi-mlb-auto-bbd-diagnostic/1.0',
          }

          def fetch(url, timeout=25):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as response:
                  raw=response.read()
                  return json.loads(raw.decode('utf-8')), response.status, dict(response.headers)

          def normalize(value):
              return re.sub(r'[^a-z0-9]+',' ',str(value or '').lower()).strip()

          def team_name(value):
              if isinstance(value,dict):
                  for name in ('name','team_name','teamName','display_name','displayName','short_name','shortName'):
                      if value.get(name): return str(value[name])
                  if isinstance(value.get('team'),dict): return team_name(value['team'])
              return str(value or '')

          def start_value(row):
              for name in ('kickoff_utc','start_time','startTime','commence_time','commenceTime','scheduled_at','scheduledAt','game_date','gameDate','date'):
                  if row.get(name): return row[name]
              return None

          official_url='https://statsapi.mlb.com/api/v1/schedule?'+urllib.parse.urlencode({
              'sportId':'1','date':'08/24/2026','hydrate':'team,venue,probablePitcher'
          })
          official,_,_=fetch(official_url)
          official_games=[]
          for date_row in official.get('dates') or []:
              for game in date_row.get('games') or []:
                  teams=game.get('teams') or {}
                  official_games.append({
                      'gamePk':str(game.get('gamePk') or ''),
                      'gameDate':game.get('gameDate'),
                      'home':team_name((teams.get('home') or {}).get('team')),
                      'away':team_name((teams.get('away') or {}).get('team')),
                  })

          variants=[]
          base='https://api.bigballsdata.com/v1/matches'
          query_variants=[
              ('date-limit',{'sport':'baseball','league':'mlb','date':slate,'limit':100}),
              ('date-page-1',{'sport':'baseball','league':'mlb','date':slate,'limit':100,'page':1}),
              ('date-page-2',{'sport':'baseball','league':'mlb','date':slate,'limit':100,'page':2}),
              ('date-offset-0',{'sport':'baseball','league':'mlb','date':slate,'limit':100,'offset':0}),
              ('date-offset-100',{'sport':'baseball','league':'mlb','date':slate,'limit':100,'offset':100}),
              ('start-end-date',{'sport':'baseball','league':'mlb','start_date':slate,'end_date':slate,'limit':100}),
              ('date-from-to',{'sport':'baseball','league':'mlb','date_from':slate,'date_to':slate,'limit':100}),
              ('from-to',{'sport':'baseball','league':'mlb','from':slate+'T00:00:00Z','to':slate+'T23:59:59Z','limit':100}),
              ('start-end-time',{'sport':'baseball','league':'mlb','start_time':slate+'T00:00:00Z','end_time':slate+'T23:59:59Z','limit':100}),
              ('wide-date',{'sport':'baseball','league':'mlb','date':slate,'limit':500}),
              ('stored-date',{'sport':'baseball','league':'mlb','date':slate,'limit':100,'stored':'true'}),
          ]

          all_rows={}
          for label,params in query_variants:
              url=base+'?'+urllib.parse.urlencode(params)
              result={'label':label,'params':{k:v for k,v in params.items() if k not in {'api_key','token'}},'urlPath':'/v1/matches'}
              try:
                  payload,status,response_headers=fetch(url)
                  rows=payload.get('data') if isinstance(payload,dict) else None
                  rows=rows if isinstance(rows,list) else []
                  result.update({
                      'httpStatus':status,
                      'topLevelKeys':sorted(payload.keys()) if isinstance(payload,dict) else [],
                      'count':len(rows),
                      'meta':payload.get('meta') if isinstance(payload,dict) and isinstance(payload.get('meta'),dict) else {},
                      'sampleRowKeys':sorted(rows[0].keys()) if rows and isinstance(rows[0],dict) else [],
                      'rows':[],
                  })
                  for row in rows:
                      if not isinstance(row,dict): continue
                      home=team_name(row.get('home') or row.get('home_team') or row.get('homeTeam'))
                      away=team_name(row.get('away') or row.get('away_team') or row.get('awayTeam'))
                      rid=str(row.get('id') or row.get('match_id') or row.get('matchId') or '')
                      result['rows'].append({'id':rid,'home':home,'away':away,'start':start_value(row)})
                      if rid: all_rows[rid]=row
                  result['responseHeaderNames']=sorted(str(k).lower() for k in response_headers)
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode('utf-8',errors='replace')[:500]
                  result.update({'httpStatus':exc.code,'errorType':'HTTPError','errorBody':body})
              except Exception as exc:
                  result.update({'errorType':type(exc).__name__,'error':str(exc)[:500]})
              variants.append(result)

          # Probe common machine-readable contract locations without persisting bodies.
          contract_attempts=[]
          for path in ('/openapi.json','/docs/openapi.json','/api/openapi.json','/swagger.json','/api-docs'):
              try:
                  payload,status,_=fetch('https://api.bigballsdata.com'+path)
                  paths=payload.get('paths') if isinstance(payload,dict) else None
                  op=((paths or {}).get('/v1/matches') or {}).get('get') if isinstance(paths,dict) else None
                  params=[]
                  if isinstance(op,dict):
                      for raw in op.get('parameters') or []:
                          if isinstance(raw,dict): params.append({'name':raw.get('name'),'in':raw.get('in'),'required':raw.get('required'),'schema':raw.get('schema')})
                  contract_attempts.append({'path':path,'status':status,'validOpenApi':isinstance(paths,dict),'matchesParameters':params})
              except urllib.error.HTTPError as exc:
                  contract_attempts.append({'path':path,'status':exc.code,'validOpenApi':False})
              except Exception as exc:
                  contract_attempts.append({'path':path,'errorType':type(exc).__name__,'validOpenApi':False})

          def match_official(game,row):
              rh=normalize(team_name(row.get('home') or row.get('home_team') or row.get('homeTeam')))
              ra=normalize(team_name(row.get('away') or row.get('away_team') or row.get('awayTeam')))
              return rh==normalize(game['home']) and ra==normalize(game['away'])

          matched={}
          for game in official_games:
              ids=[]
              for rid,row in all_rows.items():
                  if match_official(game,row): ids.append(rid)
              matched[game['gamePk']]=ids

          report={
              'proofType':'MLB_AUTO_BBD_LIVE_COVERAGE_DIAGNOSTIC',
              'checkedAtUtc':datetime.now(timezone.utc).isoformat(),
              'slateDateEt':slate,
              'officialGameCount':len(official_games),
              'officialGames':official_games,
              'queryVariants':variants,
              'unionDistinctEventCount':len(all_rows),
              'matchedGameCount':sum(bool(v) for v in matched.values()),
              'matchedIdsByGamePk':matched,
              'missingGamePks':[game['gamePk'] for game in official_games if not matched.get(game['gamePk'])],
              'contractAttempts':contract_attempts,
              'secretExposed':False,
          }
          Path('runtime_reports').mkdir(exist_ok=True)
          Path('runtime_reports/mlb_auto_bbd_coverage_diagnostic_latest.json').write_text(
              json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          print(json.dumps({k:report[k] for k in ('officialGameCount','unionDistinctEventCount','matchedGameCount','missingGamePks')},indent=2))
          PY

      - name: Publish redacted diagnostic
        if: always()
        run: |
          set -euo pipefail
          test -s runtime_reports/mlb_auto_bbd_coverage_diagnostic_latest.json
          cp runtime_reports/mlb_auto_bbd_coverage_diagnostic_latest.json /tmp/mlb-auto-bbd-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-auto-bbd-diagnostic origin/main
            git reset --hard origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-auto-bbd-diagnostic.json runtime_reports/mlb_auto_bbd_coverage_diagnostic_latest.json
            git add runtime_reports/mlb_auto_bbd_coverage_diagnostic_latest.json
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB AUTO BBD coverage diagnostic [skip ci]'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
