name: MLB Fundamentals Provenance Diagnostic

on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/mlb_fundamentals_provenance_diagnostic.py'
      - 'scripts/mlb_scoring_guard_post_persistence.py'
      - 'hello_world/mlb_fundamentals_snapshot_v2.py'
      - 'hello_world/mlb_fundamentals_scoring_bridge_v1.py'
      - 'tests/unit/test_mlb_fundamentals_provenance_diagnostic.py'
      - 'tests/unit/test_mlb_scoring_guard_post_persistence.py'
      - '.github/workflows/mlb-fundamentals-provenance-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/mlb_fundamentals_provenance_diagnostic.py'
      - 'scripts/mlb_scoring_guard_post_persistence.py'
      - 'hello_world/mlb_fundamentals_snapshot_v2.py'
      - 'hello_world/mlb_fundamentals_scoring_bridge_v1.py'
      - 'tests/unit/test_mlb_fundamentals_provenance_diagnostic.py'
      - 'tests/unit/test_mlb_scoring_guard_post_persistence.py'
      - '.github/workflows/mlb-fundamentals-provenance-diagnostic.yml'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install 'boto3>=1.34,<2' 'pytest>=8,<9'
      - name: Verify provenance diagnostic remains read-only and fail-closed
        run: |
          python -m pytest -q \
            tests/unit/test_mlb_fundamentals_provenance_diagnostic.py \
            tests/unit/test_mlb_scoring_guard_post_persistence.py
          python -m py_compile scripts/mlb_fundamentals_provenance_diagnostic.py

  live-read:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install 'boto3>=1.34,<2'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Diagnose live MLB provenance boundaries
        run: |
          python scripts/mlb_fundamentals_provenance_diagnostic.py \
            --output runtime_reports/mlb_fundamentals_provenance_diagnostic_latest.json
      - name: Upload read-only diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: mlb-fundamentals-provenance-${{ github.run_id }}
          path: runtime_reports/mlb_fundamentals_provenance_diagnostic_latest.json
          if-no-files-found: error
          retention-days: 30
