name: Hotfix Tennis lock timeout

on:
  push:
    branches: [agent/diagnose-tennis-lock-alarm-20260813]
    paths:
      - 'ops/tennis_lock_timeout_hotfix_v2.py'
      - '.github/workflows/hotfix-tennis-lock-timeout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-prod-lock-hotfix
  cancel-in-progress: false

env:
  FUNCTION_NAME: parlay-platform-tennis-ml-prod-tennis-lock
  RULE_NAME: parlay-platform-tennis-ml-prod-tennis-lock-every-minute
  ALARM_NAME: parlay-platform-tennis-ml-prod-tennis-lock-errors

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Backup exact running Tennis package
        run: |
          set -euo pipefail
          aws lambda get-function --function-name "$FUNCTION_NAME" --output json > function-before.json
          URL=$(python -c "import json; print(json.load(open('function-before.json'))['Code']['Location'])")
          curl --fail --silent --show-error "$URL" -o before.zip
          aws events list-targets-by-rule --rule "$RULE_NAME" --output json > targets-before.json
          python - <<'PY'
          import json
          targets=json.load(open('targets-before.json')).get('Targets') or []
          assert len(targets)==1, targets
          json.dump(targets,open('targets-original-array.json','w'))
          fixed=[]
          for target in targets:
              row=dict(target)
              row['RetryPolicy']={'MaximumRetryAttempts':0,'MaximumEventAgeInSeconds':60}
              fixed.append(row)
          json.dump(fixed,open('targets-fixed-array.json','w'))
          PY

      - name: Drain old lock invocations
        run: |
          set -euo pipefail
          aws events disable-rule --name "$RULE_NAME"
          sleep 130

      - name: Build keyed-read package
        run: |
          set -euo pipefail
          rm -rf work && mkdir work
          unzip -q before.zip -d work
          test -f work/tennis_lock_handler.py
          cp work/tennis_lock_handler.py handler-before.py
          python ops/tennis_lock_timeout_hotfix_v2.py
          python -m py_compile work/tennis_lock_handler.py
          grep -q 'v5.2-tminus45-no-rescore-keyed-reads' work/tennis_lock_handler.py
          diff -u handler-before.py work/tennis_lock_handler.py > handler.diff || true
          cd work && zip -qr ../after.zip .

      - name: Deploy and probe exact scheduled path
        run: |
          set -euo pipefail
          rollback() {
            set +e
            echo '::warning::Rolling Tennis lock back to exact pre-hotfix package'
            aws events disable-rule --name "$RULE_NAME"
            aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://before.zip >/dev/null
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            aws events put-targets --rule "$RULE_NAME" --targets file://targets-original-array.json >/dev/null
            aws events enable-rule --name "$RULE_NAME"
          }
          trap rollback ERR
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://after.zip > update.json
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          aws events put-targets --rule "$RULE_NAME" --targets file://targets-fixed-array.json > target-update.json
          START=$(date +%s)
          aws lambda invoke --cli-read-timeout 125 --cli-connect-timeout 20 --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out --payload '{"run":"scheduled_tennis_lock","hotfix_probe":1}' probe1.json > probe1-meta.json
          FIRST=$(( $(date +%s) - START ))
          START=$(date +%s)
          aws lambda invoke --cli-read-timeout 90 --cli-connect-timeout 20 --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out --payload '{"run":"scheduled_tennis_lock","hotfix_probe":2}' probe2.json > probe2-meta.json
          SECOND=$(( $(date +%s) - START ))
          FIRST="$FIRST" SECOND="$SECOND" python - <<'PY'
          import json,os
          for n in (1,2):
              meta=json.load(open(f'probe{n}-meta.json'))
              payload=json.load(open(f'probe{n}.json'))
              assert not meta.get('FunctionError'), (meta,payload)
              assert payload.get('ok') is True, payload
          first=int(os.environ['FIRST']); second=int(os.environ['SECOND'])
          print({'first_probe_seconds':first,'second_probe_seconds':second})
          assert first < 60, first
          assert second < 30, second
          PY
          aws events enable-rule --name "$RULE_NAME"
          trap - ERR

      - name: Verify autonomous cycles and alarm
        run: |
          set -euo pipefail
          VERIFIED_FROM=$(date -u +%s)
          sleep 190
          START_MS=$(( VERIFIED_FROM * 1000 ))
          aws logs filter-log-events --log-group-name "/aws/lambda/$FUNCTION_NAME" --start-time "$START_MS" --output json > post-hotfix-logs.json
          python - <<'PY'
          import json,re
          events=json.load(open('post-hotfix-logs.json')).get('events') or []
          messages=[str(e.get('message') or '') for e in events]
          timeouts=[m for m in messages if 'Status: timeout' in m or 'Task timed out' in m]
          errors=[m for m in messages if '\tERROR\t' in m or 'Runtime.ExitError' in m]
          durations=[]
          for m in messages:
              hit=re.search(r'Duration: ([0-9.]+) ms',m)
              if hit: durations.append(float(hit.group(1)))
          print({'events':len(events),'reports':len(durations),'timeouts':len(timeouts),'runtime_errors':len(errors),'max_duration_ms':max(durations) if durations else None})
          assert not timeouts, timeouts[-5:]
          assert not errors, errors[-5:]
          assert len(durations) >= 2, durations
          assert max(durations) < 60000, max(durations)
          PY
          for i in $(seq 1 10); do
            STATE=$(aws cloudwatch describe-alarms --alarm-names "$ALARM_NAME" --query 'MetricAlarms[0].StateValue' --output text)
            echo "alarm_state=$STATE attempt=$i"
            if [ "$STATE" = "OK" ]; then break; fi
            sleep 30
          done
          aws cloudwatch describe-alarms --alarm-names "$ALARM_NAME" --output json > alarm-after.json
          aws events describe-rule --name "$RULE_NAME" --output json > rule-after.json
          aws events list-targets-by-rule --rule "$RULE_NAME" --output json > targets-after.json
          python - <<'PY'
          import json
          alarm=json.load(open('alarm-after.json'))['MetricAlarms'][0]
          rule=json.load(open('rule-after.json'))
          target=(json.load(open('targets-after.json')).get('Targets') or [])[0]
          assert alarm['StateValue']=='OK', alarm.get('StateReason')
          assert rule['State']=='ENABLED', rule
          assert rule['ScheduleExpression']=='rate(1 minute)', rule
          assert target.get('RetryPolicy')=={'MaximumEventAgeInSeconds':60,'MaximumRetryAttempts':0}, target
          print({'alarm':alarm['StateValue'],'rule':rule['State'],'schedule':rule['ScheduleExpression'],'retryPolicy':target['RetryPolicy']})
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-lock-hotfix-v2-evidence-${{ github.run_id }}
          path: |
            function-before.json
            handler-before.py
            handler.diff
            probe1.json
            probe1-meta.json
            probe2.json
            probe2-meta.json
            update.json
            targets-before.json
            targets-after.json
            target-update.json
            post-hotfix-logs.json
            alarm-after.json
            rule-after.json
          retention-days: 30
