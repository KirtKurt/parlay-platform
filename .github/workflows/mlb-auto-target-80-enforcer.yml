name: Enforce MLB Auto 80 Percent Target

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-auto-target-80-enforcer.yml'
  workflow_run:
    workflows: ['Deploy MLB Auto LLM']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-auto-target-80-enforcer
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-mlb-auto-llm

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Snapshot current MLB Auto stack parameters
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            > /tmp/mlb-auto-before.json
          python - <<'PY'
          import json
          stack=json.load(open('/tmp/mlb-auto-before.json'))['Stacks'][0]
          params={p['ParameterKey']:p.get('ParameterValue') for p in stack.get('Parameters',[])}
          print('Current MLB Auto target:',params.get('TargetDailyAccuracy'))
          assert params.get('TargetDailyAccuracy') is not None,params
          PY

      - name: Set only TargetDailyAccuracy to 0.80
        run: |
          set -euo pipefail
          current=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Parameters[?ParameterKey=='TargetDailyAccuracy'].ParameterValue | [0]" \
            --output text)
          if [ "$current" = "0.80" ] || [ "$current" = "0.8" ]; then
            echo 'MLB Auto target already 0.80; no stack update required.'
          else
            aws cloudformation update-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --use-previous-template \
              --capabilities CAPABILITY_IAM \
              --parameters \
                ParameterKey=OddsApiKey,UsePreviousValue=true \
                ParameterKey=BbsApiKey,UsePreviousValue=true \
                ParameterKey=MlbMlApiBaseUrl,UsePreviousValue=true \
                ParameterKey=TargetDailyAccuracy,ParameterValue=0.80 \
                ParameterKey=CardLeadMinutesBeforeSecondGame,UsePreviousValue=true \
                ParameterKey=BedrockModels,UsePreviousValue=true
            aws cloudformation wait stack-update-complete \
              --stack-name "$STACK_NAME" --region "$AWS_REGION"
          fi

      - name: Verify target and preserve all other stack parameters
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            > /tmp/mlb-auto-after.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/mlb-auto-before.json'))['Stacks'][0]
          after=json.load(open('/tmp/mlb-auto-after.json'))['Stacks'][0]
          bp={p['ParameterKey']:p.get('ParameterValue') for p in before.get('Parameters',[])}
          ap={p['ParameterKey']:p.get('ParameterValue') for p in after.get('Parameters',[])}
          assert float(ap.get('TargetDailyAccuracy')) == 0.80,ap
          for key,value in bp.items():
              if key == 'TargetDailyAccuracy':
                  continue
              assert ap.get(key) == value,(key,value,ap.get(key))
          print('CloudFormation target=0.80; all non-target parameters unchanged.')
          PY

      - name: Verify deployed Lambda environment and public contract
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBAutoLLMFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' --output text)
          aws lambda get-function-configuration \
            --function-name "$function_name" --region "$AWS_REGION" \
            > /tmp/mlb-auto-function.json
          status_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='MLBAutoLLMStatusUrl'].OutputValue" \
            --output text)
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$status_url" > /tmp/mlb-auto-status.json
          python - <<'PY'
          import json
          cfg=json.load(open('/tmp/mlb-auto-function.json'))
          env=(cfg.get('Environment') or {}).get('Variables') or {}
          status=json.load(open('/tmp/mlb-auto-status.json'))
          assert float(env.get('MLB_AUTO_TARGET_DAILY_ACCURACY')) == 0.80,env
          assert float(status.get('targetDailyAccuracy')) == 0.80,status
          assert status.get('fullyAutonomous') is True,status
          assert set(status.get('threeSourcePolicy') or []) == {
              'MLB Stats API','The Odds API','Big Balls Sports Data Pro'
          },status
          print('Deployed MLB Auto target verified at 0.80; autonomy/data-source contract intact.')
          PY

      - name: Verify autonomous schedule remains enabled
        run: |
          set -euo pipefail
          rule_names=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Events::Rule'].PhysicalResourceId" \
            --output text)
          test -n "$rule_names"
          for name in $rule_names; do
            state=$(aws events describe-rule --name "$name" --region "$AWS_REGION" --query State --output text)
            test "$state" = 'ENABLED'
          done
          echo 'MLB Auto EventBridge schedule remains enabled.'
