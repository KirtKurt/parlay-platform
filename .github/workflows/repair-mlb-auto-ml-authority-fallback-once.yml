name: Repair MLB AUTO model authority fallback once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-auto-ml-authority-fallback-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-auto-ml-authority-fallback-repair
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - name: Install Bedrock-first AWS ML fallback without weakening three-source authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path

          ROOT = Path('.')

          FILES = {
              'mlb_auto_llm/ml_authority.py': '',
              'mlb_auto_llm/ml_authority_smoke.py': '',
              'mlb_auto_llm/orchestrator_v3.py': ' ',
              'tests/unit/test_mlb_auto_ml_authority.py': '',
          }

          for relative, encoded in FILES.items():
              path = ROOT / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))

          def read(relative: str) -> str:
              return (ROOT / relative).read_text(encoding='utf-8')

          def write(relative: str, text: str) -> None:
              (ROOT / relative).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise RuntimeError(f'PATCH_ANCHOR_MISSING:{label}')
              return text.replace(old, new, 1)

          template_path = 'mlb-auto-llm-template.yaml'
          template = read(template_path)
          template = template.replace(
              'Description: Isolated autonomous MLB winner-prediction stack using MLB Stats API, The Odds API, Big Balls Sports Data Pro, and Bedrock.',
              'Description: Isolated autonomous MLB winner-prediction stack using MLB Stats API, The Odds API, Big Balls Sports Data Pro, Bedrock, and the deployed AWS MLB ensemble.',
          )
          template = replace_once(
              template,
              "  TargetDailyAccuracy:\n",
              "  MlbMlApiBaseUrl:\n    Type: String\n  TargetDailyAccuracy:\n",
              'template-ml-api-parameter',
          )
          template = template.replace(
              'Handler: orchestrator_v2.lambda_handler',
              'Handler: orchestrator_v3.lambda_handler',
          )
          template = template.replace(
              'Handler: bedrock_smoke.lambda_handler',
              'Handler: ml_authority_smoke.lambda_handler',
          )
          if 'MLB_AUTO_ML_API_BASE_URL:' not in template:
              anchor = '          MLB_AUTO_BEDROCK_MODELS: !Ref BedrockModels\n'
              if template.count(anchor) != 2:
                  raise RuntimeError(
                      f'TEMPLATE_BEDROCK_ENV_COUNT_UNEXPECTED:{template.count(anchor)}'
                  )
              template = template.replace(
                  anchor,
                  anchor + '          MLB_AUTO_ML_API_BASE_URL: !Ref MlbMlApiBaseUrl\n',
              )
          write(template_path, template)

          deploy_path = '.github/workflows/deploy-mlb-auto-llm.yml'
          deploy = read(deploy_path)
          deploy = replace_once(
              deploy,
              "            mlb_auto_llm/orchestrator_v2.py \\\n"
              "            mlb_auto_llm/model_gateway.py \\\n"
              "            mlb_auto_llm/bedrock_smoke.py\n",
              "            mlb_auto_llm/orchestrator_v2.py \\\n"
              "            mlb_auto_llm/orchestrator_v3.py \\\n"
              "            mlb_auto_llm/ml_authority.py \\\n"
              "            mlb_auto_llm/ml_authority_smoke.py \\\n"
              "            mlb_auto_llm/model_gateway.py \\\n"
              "            mlb_auto_llm/bedrock_smoke.py\n",
              'deploy-compile-modules',
          )
          deploy = replace_once(
              deploy,
              "          python -m pytest -q tests/unit/test_mlb_auto_model_gateway.py\n",
              "          PYTHONPATH=mlb_auto_llm python -m pytest -q \\\n"
              "            tests/unit/test_mlb_auto_model_gateway.py \\\n"
              "            tests/unit/test_mlb_auto_ml_authority.py\n",
              'deploy-tests',
          )
          deploy = deploy.replace(
              "grep -q 'Handler: orchestrator_v2.lambda_handler' mlb-auto-llm-template.yaml",
              "grep -q 'Handler: orchestrator_v3.lambda_handler' mlb-auto-llm-template.yaml",
          )
          if "grep -q 'AWS_ML_RANKED_ENSEMBLE'" not in deploy:
              deploy = replace_once(
                  deploy,
                  "          grep -q 'BEDROCK_LLM' mlb_auto_llm/orchestrator_v2.py\n",
                  "          grep -q 'BEDROCK_LLM' mlb_auto_llm/orchestrator_v2.py\n"
                  "          grep -q 'AWS_ML_RANKED_ENSEMBLE' mlb_auto_llm/ml_authority.py\n"
                  "          grep -q 'FALLBACK_MARKET_CONSENSUS' mlb_auto_llm/handler.py\n",
                  'deploy-authority-greps',
              )
          deploy = replace_once(
              deploy,
              "        run: |\n"
              "          set -euo pipefail\n"
              "          sam deploy \\\n"
              "            --template-file .aws-sam/build/template.yaml \\\n"
              "            --stack-name \"$STACK_NAME\" \\\n",
              "        run: |\n"
              "          set -euo pipefail\n"
              "          MLB_ML_API_BASE_URL=$(aws cloudformation describe-stacks \\\n"
              "            --stack-name parlay-platform-dev --region \"$AWS_REGION\" \\\n"
              "            --query \"Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue\" \\\n"
              "            --output text)\n"
              "          test -n \"$MLB_ML_API_BASE_URL\"\n"
              "          test \"$MLB_ML_API_BASE_URL\" != \"None\"\n"
              "          sam deploy \\\n"
              "            --template-file .aws-sam/build/template.yaml \\\n"
              "            --stack-name \"$STACK_NAME\" \\\n",
              'deploy-resolve-ml-api',
          )
          deploy = replace_once(
              deploy,
              "              BedrockModels=\"${LIVE_BEDROCK_MODELS}\" \\\n"
              "            --no-confirm-changeset \\\n",
              "              BedrockModels=\"${LIVE_BEDROCK_MODELS}\" \\\n"
              "              MlbMlApiBaseUrl=\"${MLB_ML_API_BASE_URL}\" \\\n"
              "            --no-confirm-changeset \\\n",
              'deploy-ml-api-parameter',
          )
          deploy = deploy.replace(
              '      - name: Prove Bedrock through deployed MLB Lambda role',
              '      - name: Prove Bedrock or AWS ML authority through deployed MLB Lambda role',
          )
          deploy = deploy.replace(
              "print('MLB Auto Bedrock authority: OK via', response.get('modelId'))",
              "print('MLB Auto model authority: OK via', response.get('decisionAuthority'), response.get('modelId'))",
          )
          deploy = deploy.replace(
              "--payload '{\"mode\":\"deployment_provider_smoke\"}' \\\n",
              "--payload '{\"mode\":\"deployment_provider_smoke\",\"force_publish\":true}' \\\n",
          )
          deploy = replace_once(
              deploy,
              "          assert status in {'COLLECTING','CARD_PUBLISHED','CARD_ALREADY_PUBLISHED','NO_GAMES'}, response\n"
              "          source=response.get('sourceStatus') or {}\n",
              "          assert status in {'CARD_PUBLISHED','CARD_ALREADY_PUBLISHED','NO_GAMES'}, response\n"
              "          card=response.get('card') or {}\n"
              "          source=response.get('sourceStatus') or card.get('sourceStatus') or {}\n",
              'deploy-force-card-status',
          )
          deploy = replace_once(
              deploy,
              "          card=response.get('card') or {}\n"
              "          if status in {'CARD_PUBLISHED','CARD_ALREADY_PUBLISHED'}:\n"
              "              assert card.get('threeSourceCoverageComplete') is True, card\n"
              "              assert card.get('bedrockAuthorityComplete') is True, card\n"
              "              picks=card.get('picks') or []\n"
              "              assert picks, card\n"
              "              assert all(row.get('decisionAuthority') == 'BEDROCK_LLM' for row in picks), picks\n",
              "          if status in {'CARD_PUBLISHED','CARD_ALREADY_PUBLISHED'}:\n"
              "              assert card.get('threeSourceCoverageComplete') is True, card\n"
              "              assert card.get('modelAuthorityComplete') is True, card\n"
              "              picks=card.get('picks') or []\n"
              "              assert picks, card\n"
              "              authorities={row.get('decisionAuthority') for row in picks}\n"
              "              assert authorities <= {'BEDROCK_LLM','AWS_ML_RANKED_ENSEMBLE'}, authorities\n"
              "              assert len(authorities) == 1, authorities\n",
              'deploy-model-card-acceptance',
          )
          deploy = replace_once(
              deploy,
              "          source_status=cycle.get('sourceStatus') if isinstance(cycle.get('sourceStatus'), dict) else {}\n",
              "          source_status=(\n"
              "              cycle.get('sourceStatus')\n"
              "              if isinstance(cycle.get('sourceStatus'), dict)\n"
              "              else card.get('sourceStatus')\n"
              "              if isinstance(card.get('sourceStatus'), dict)\n"
              "              else {}\n"
              "          )\n",
              'deploy-proof-source-status',
          )
          if "'decisionAuthority':bedrock.get('decisionAuthority')" not in deploy:
              deploy = replace_once(
                  deploy,
                  "                  'endpointFamily':bedrock.get('endpointFamily'),\n",
                  "                  'endpointFamily':bedrock.get('endpointFamily'),\n"
                  "                  'decisionAuthority':bedrock.get('decisionAuthority'),\n"
                  "                  'bedrockAvailable':bedrock.get('bedrockAvailable'),\n",
                  'deploy-proof-authority-smoke',
              )
          if "'modelAuthorityComplete':card.get('modelAuthorityComplete')" not in deploy:
              deploy = replace_once(
                  deploy,
                  "                  'bedrockAuthorityComplete':card.get('bedrockAuthorityComplete'),\n",
                  "                  'bedrockAuthorityComplete':card.get('bedrockAuthorityComplete'),\n"
                  "                  'mlAuthorityComplete':card.get('mlAuthorityComplete'),\n"
                  "                  'modelAuthorityComplete':card.get('modelAuthorityComplete'),\n"
                  "                  'decisionAuthority':card.get('decisionAuthority'),\n",
                  'deploy-proof-card-authority',
              )
          if "'modelDecisionCount':sum(" not in deploy:
              deploy = replace_once(
                  deploy,
                  "                  'bedrockDecisionCount':sum(\n"
                  "                      row.get('decisionAuthority') == 'BEDROCK_LLM'\n"
                  "                      for row in picks if isinstance(row, dict)\n"
                  "                  ),\n",
                  "                  'bedrockDecisionCount':sum(\n"
                  "                      row.get('decisionAuthority') == 'BEDROCK_LLM'\n"
                  "                      for row in picks if isinstance(row, dict)\n"
                  "                  ),\n"
                  "                  'mlDecisionCount':sum(\n"
                  "                      row.get('decisionAuthority') == 'AWS_ML_RANKED_ENSEMBLE'\n"
                  "                      for row in picks if isinstance(row, dict)\n"
                  "                  ),\n"
                  "                  'modelDecisionCount':sum(\n"
                  "                      row.get('decisionAuthority') in {'BEDROCK_LLM','AWS_ML_RANKED_ENSEMBLE'}\n"
                  "                      for row in picks if isinstance(row, dict)\n"
                  "                  ),\n",
                  'deploy-proof-model-counts',
              )
          deploy = replace_once(
              deploy,
              "              and body['providerCycle']['ok'] is True\n"
              "              and body['publicStatus']['fullyAutonomous'] is True\n",
              "              and body['providerCycle']['ok'] is True\n"
              "              and body['providerCycle']['modelAuthorityComplete'] is True\n"
              "              and body['providerCycle']['modelDecisionCount'] == body['providerCycle']['pickCount']\n"
              "              and body['publicStatus']['fullyAutonomous'] is True\n",
              'deploy-proof-pass-gate',
          )
          write(deploy_path, deploy)

          verify_path = '.github/workflows/verify-mlb-auto-production-chain.yml'
          verify = read(verify_path)
          verify = replace_once(
              verify,
              "      - 'tests/unit/test_mlb_auto_model_gateway.py'\n",
              "      - 'tests/unit/test_mlb_auto_model_gateway.py'\n"
              "      - 'tests/unit/test_mlb_auto_ml_authority.py'\n",
              'verify-watch-test',
          )
          verify = replace_once(
              verify,
              "            mlb_auto_llm/orchestrator_v2.py \\\n"
              "            mlb_auto_llm/bedrock_smoke.py\n",
              "            mlb_auto_llm/orchestrator_v2.py \\\n"
              "            mlb_auto_llm/orchestrator_v3.py \\\n"
              "            mlb_auto_llm/ml_authority.py \\\n"
              "            mlb_auto_llm/ml_authority_smoke.py \\\n"
              "            mlb_auto_llm/bedrock_smoke.py\n",
              'verify-compile-modules',
          )
          verify = replace_once(
              verify,
              "            tests/unit/test_verify_mlb_no_bbd_runtime.py \\\n"
              "            tests/unit/test_mlb_auto_model_gateway.py\n",
              "            tests/unit/test_verify_mlb_no_bbd_runtime.py \\\n"
              "            tests/unit/test_mlb_auto_model_gateway.py \\\n"
              "            tests/unit/test_mlb_auto_ml_authority.py\n",
              'verify-tests',
          )
          if "grep -q 'AWS_ML_RANKED_ENSEMBLE'" not in verify:
              verify = replace_once(
                  verify,
                  "          grep -q 'AUTHORITATIVE_CARD_DEADLINE_MISSED' mlb_auto_llm/orchestrator_v2.py\n",
                  "          grep -q 'AUTHORITATIVE_CARD_DEADLINE_MISSED' mlb_auto_llm/orchestrator_v2.py\n"
                  "          grep -q 'AWS_ML_RANKED_ENSEMBLE' mlb_auto_llm/ml_authority.py\n"
                  "          grep -q 'MODEL_DECISION_AUTHORITY_REQUIRED' mlb_auto_llm/orchestrator_v3.py\n"
                  "          grep -q 'Handler: orchestrator_v3.lambda_handler' mlb-auto-llm-template.yaml\n",
                  'verify-ml-authority-markers',
              )
          write(verify_path, verify)

          allowed = {
              'mlb_auto_llm/ml_authority.py',
              'mlb_auto_llm/ml_authority_smoke.py',
              'mlb_auto_llm/orchestrator_v3.py',
              'tests/unit/test_mlb_auto_ml_authority.py',
              'mlb-auto-llm-template.yaml',
              '.github/workflows/deploy-mlb-auto-llm.yml',
              '.github/workflows/verify-mlb-auto-production-chain.yml',
          }
          print('MLB AUTO ML fallback source installed:', sorted(allowed))
          PY

      - name: Verify source, tests, SAM, and sport isolation
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m py_compile             mlb_auto_llm/handler.py             mlb_auto_llm/model_gateway.py             mlb_auto_llm/orchestrator.py             mlb_auto_llm/orchestrator_v2.py             mlb_auto_llm/orchestrator_v3.py             mlb_auto_llm/ml_authority.py             mlb_auto_llm/ml_authority_smoke.py             mlb_auto_llm/bedrock_smoke.py
          PYTHONPATH=mlb_auto_llm python -m pytest -q             tests/unit/test_mlb_auto_model_gateway.py             tests/unit/test_mlb_auto_ml_authority.py
          python scripts/verify_mlb_no_bbd_runtime.py
          sam validate --template-file mlb-auto-llm-template.yaml --lint
          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(tennis_learning/|tennis-template\.yaml|soccer_auto/|soccer-auto-template\.yaml|nfl_auto/|nfl-auto-template\.yaml)'; then
            echo '::error::Sport isolation violation'
            exit 1
          fi

      - name: Commit repaired production source to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             mlb_auto_llm/ml_authority.py             mlb_auto_llm/ml_authority_smoke.py             mlb_auto_llm/orchestrator_v3.py             tests/unit/test_mlb_auto_ml_authority.py             mlb-auto-llm-template.yaml             .github/workflows/deploy-mlb-auto-llm.yml             .github/workflows/verify-mlb-auto-production-chain.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Repair MLB AUTO with Bedrock-first AWS ML authority fallback'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
