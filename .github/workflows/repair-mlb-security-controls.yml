name: Repair and verify MLB security controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-security-controls.yml'
      - 'scripts/configure_api_protection.sh'
      - 'scripts/configure_security_alarms.sh'
      - 'scripts/verify_mlb_security_controls.py'
permissions:
  contents: read
concurrency:
  group: mlb-security-controls-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.34,<2' 'pytest>=8,<9'
      - run: python -m pytest -q tests/unit/test_mlb_security_setup.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Configure existing API protection
        continue-on-error: true
        run: |
          API_ID=$(aws cloudformation describe-stack-resource --stack-name parlay-platform-dev --logical-resource-id ServerlessRestApi --region us-east-1 --query StackResourceDetail.PhysicalResourceId --output text)
          bash scripts/configure_api_protection.sh "https://${API_ID}.execute-api.us-east-1.amazonaws.com/Prod" us-east-1
      - name: Repair metric dimensions and configure existing budget
        continue-on-error: true
        run: bash scripts/configure_security_alarms.sh parlay-platform-dev us-east-1 100
      - name: Verify actual AWS controls
        run: python scripts/verify_mlb_security_controls.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-security-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime_reports/mlb_security_controls_latest.json
          if-no-files-found: warn
          retention-days: 30
