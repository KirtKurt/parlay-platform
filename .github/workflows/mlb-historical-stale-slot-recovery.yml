name: MLB Historical Stale Slot Recovery

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-stale-slot-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: parlay-platform-deploy
  cancel-in-progress: false

jobs:
  repair-deploy-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Quarantine stale provider slots without weakening the 15-minute guard
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('hello_world/mlb_historical_optimizer_handler.py')
          text = path.read_text()
          old = '''    historical = []
              for requested in grid.timestamps_utc:
                  raw, _ = _get_s3_json(_raw_key(day, requested))
                  historical.append(
                      {
                          "requestedAtUtc": requested,
                          "payload": raw.get("payload") if isinstance(raw, Mapping) and "payload" in raw else raw,
                      }
                  )
          '''
          new = '''    historical = []
              for requested in grid.timestamps_utc:
                  raw, _ = _get_s3_json(_raw_key(day, requested))
                  payload = raw.get("payload") if isinstance(raw, Mapping) and "payload" in raw else raw
                  try:
                      optimizer.normalize_historical_snapshot(payload, requested)
                  except optimizer.HistoricalOptimizerError as exc:
                      if str(exc) != "historical response is too stale for a 15-minute grid":
                          raise
                      skipped = state.setdefault("skippedHistoricalSlots", [])
                      marker = {
                          "slateDateEt": day,
                          "requestedAtUtc": requested,
                          "reason": "provider_snapshot_too_stale",
                      }
                      if not any(
                          isinstance(row, Mapping)
                          and row.get("slateDateEt") == day
                          and row.get("requestedAtUtc") == requested
                          for row in skipped
                      ):
                          marker["recordedAtUtc"] = _now_iso()
                          skipped.append(marker)
                      continue
                  historical.append(
                      {
                          "requestedAtUtc": requested,
                          "payload": payload,
                      }
                  )
          '''
          if old not in text:
              raise SystemExit('target _complete_slate block not found or already changed')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate historical optimizer contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'cfn-lint>=1,<2'
          python -m py_compile \
            hello_world/mlb_historical_daily_optimizer_v1.py \
            hello_world/mlb_historical_optimizer_handler.py
          python -m pytest -q \
            tests/unit/test_mlb_historical_policy_v1.py \
            tests/unit/test_mlb_historical_daily_optimizer_v1.py \
            tests/unit/test_mlb_historical_optimizer_handler.py \
            tests/unit/test_mlb_historical_read_api_contract.py
          sam validate --lint --template-file mlb_historical_optimizer/template.yaml

      - name: Commit reviewed recovery patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hello_world/mlb_historical_optimizer_handler.py
          git commit -m "fix: quarantine stale MLB historical slots [deploy-mlb-v15.11]"
          git push origin HEAD:main

      - name: Deploy repaired optimizer stack
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          rm -rf .aws-sam-historical-recovery
          sam build --no-cached --build-dir .aws-sam-historical-recovery --template-file mlb_historical_optimizer/template.yaml
          sam deploy \
            --template-file .aws-sam-historical-recovery/template.yaml \
            --stack-name parlay-platform-mlb-historical-optimizer \
            --region "$AWS_REGION_VALUE" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --force-upload \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              'TargetSnapshotsTable=parlay_platform_snapshots' \
              'HistoricalStartDate=2025-04-01' \
              'HistoricalEndDate=2025-08-31' \
              'HistoricalTargetGames=1600' \
              'HistoricalMaxCredits=120000' \
              'HistoricalRequestsPerRun=100' \
              'HistoricalMaxCandidates=25000' \
              'HistoricalMaxOptimizationRounds=6' \
              'HistoricalFreshAuditIncrementGames=250' \
              "DeployGitSha=$(git rev-parse HEAD)"

      - name: Prove checkpoint resumes past the stale slot
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          FUNCTION_NAME=$(aws cloudformation describe-stacks --stack-name parlay-platform-mlb-historical-optimizer --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" --output text)
          aws lambda invoke --function-name "$FUNCTION_NAME" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload '{"mode":"orchestrate","run":"stale_slot_recovery_probe"}' /tmp/recovery.json >/tmp/recovery-meta.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/recovery.json'))
          state=value.get('state') or {}
          print(json.dumps({k:state.get(k) for k in ('phase','currentDate','currentSlotIndex','networkRequestCount','eligibleGameCount','completeSlateCount','lastError','skippedHistoricalSlots')},indent=2,default=str))
          assert state.get('lastError') != 'HistoricalOptimizerError:historical response is too stale for a 15-minute grid', state
          assert (state.get('currentDate'), int(state.get('currentSlotIndex') or 0)) != ('2025-04-14',72), state
          PY

      - name: Restart accelerated historical training
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mlb-historical-accelerator.yml \
            -f paid_authorization=AUTHORIZE_THE_ODDS_API_HISTORICAL_CREDITS \
            -f cutover_confirmation=DESTROY_V15_10_PRODUCTION_AUTHORITY_AFTER_80_PERCENT_GATE
