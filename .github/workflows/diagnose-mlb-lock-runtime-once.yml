name: Diagnose MLB Lock Runtime Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-lock-runtime-once.yml'

permissions:
  contents: write

concurrency:
  group: diagnose-mlb-lock-runtime-once
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Invoke deployed lock status and scheduled path
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          import boto3

          region=os.environ['AWS_REGION_VALUE']
          cf=boto3.client('cloudformation', region_name=region)
          lam=boto3.client('lambda', region_name=region)
          stack='parlay-platform-dev'
          detail=cf.describe_stack_resource(StackName=stack,LogicalResourceId='MLBDailyPickLockFunction')['StackResourceDetail']
          fn=detail['PhysicalResourceId']
          config=lam.get_function_configuration(FunctionName=fn)

          def invoke(payload):
              response=lam.invoke(FunctionName=fn,InvocationType='RequestResponse',Payload=json.dumps(payload).encode())
              raw=response['Payload'].read().decode('utf-8','replace')
              try: body=json.loads(raw or '{}')
              except Exception: body={'rawPayload':raw[:12000]}
              if isinstance(body,dict) and isinstance(body.get('body'),str):
                  try: decoded=json.loads(body['body'])
                  except Exception: decoded=body['body'][:12000]
              else: decoded=body
              return {'functionError':response.get('FunctionError'),'statusCode':response.get('StatusCode'),'result':decoded}

          status=invoke({'httpMethod':'GET','path':'/v1/mlb/locks/status','queryStringParameters':{}})
          today=invoke({'httpMethod':'GET','path':'/v1/mlb/locks/today','queryStringParameters':{}})
          scheduled=invoke({'sport':'mlb','run':'automation_lock_runtime_diagnostic','auto_ingest':False})
          status_after=invoke({'httpMethod':'GET','path':'/v1/mlb/locks/status','queryStringParameters':{}})
          report={
            'proofType':'MLB_LOCK_RUNTIME_LIVE_DIAGNOSTIC',
            'createdAtUtc':datetime.now(timezone.utc).isoformat(),
            'stackStatus':cf.describe_stacks(StackName=stack)['Stacks'][0].get('StackStatus'),
            'functionName':fn,
            'handler':config.get('Handler'),
            'timeout':config.get('Timeout'),
            'memorySize':config.get('MemorySize'),
            'lastUpdateStatus':config.get('LastUpdateStatus'),
            'environmentVariableNames':sorted(((config.get('Environment') or {}).get('Variables') or {}).keys()),
            'statusBefore':status,
            'todayBefore':today,
            'scheduledRun':scheduled,
            'statusAfter':status_after,
            'secretExposed':False,
          }
          Path('runtime_reports/mlb_lock_runtime_diagnostic_latest.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          PY
      - name: Publish redacted diagnostic
        if: always()
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test -f runtime_reports/mlb_lock_runtime_diagnostic_latest.json || exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime_reports/mlb_lock_runtime_diagnostic_latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MLB lock runtime diagnostic'
          git push origin HEAD:"$HEAD_BRANCH"
