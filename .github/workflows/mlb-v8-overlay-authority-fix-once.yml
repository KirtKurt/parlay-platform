# Second push activates the installed one-time workflow.
name: MLB V8 Overlay Authority Repair Once

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-overlay-authority-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-v8-overlay-authority-fix-once
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require BBD overlay in canonical V8 evaluations
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          recurring = Path('.github/workflows/mlb-supervised-shadow-v2-recurring.yml')
          text = recurring.read_text()
          old = "          MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'false'\n"
          new = "          MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'true'\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('recurring BBD required marker missing')
          recurring.write_text(text)

          realtime = Path('.github/workflows/mlb-v8-shadow-realtime-72.yml')
          text = realtime.read_text()
          marker = "          AWS_EC2_METADATA_DISABLED: 'true'\n"
          addition = (
              marker
              + "          MLB_V8_HISTORICAL_BBS_OVERLAY_ENABLED: 'true'\n"
              + "          MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'true'\n"
              + "          MLB_V8_HISTORICAL_BBS_TABLE: parlay_platform_snapshots\n"
          )
          if "MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'true'" not in text:
              if marker not in text:
                  raise SystemExit('realtime AWS env marker missing')
              text = text.replace(marker, addition, 1)
          realtime.write_text(text)
          PY

      - name: Validate workflow contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'PyYAML>=6,<7'
          python - <<'PY'
          from pathlib import Path
          import yaml

          for name in (
              '.github/workflows/mlb-supervised-shadow-v2-recurring.yml',
              '.github/workflows/mlb-v8-shadow-realtime-72.yml',
          ):
              value = yaml.safe_load(Path(name).read_text())
              assert isinstance(value, dict), name

          recurring = Path('.github/workflows/mlb-supervised-shadow-v2-recurring.yml').read_text()
          realtime = Path('.github/workflows/mlb-v8-shadow-realtime-72.yml').read_text()
          assert "MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'false'" not in recurring
          assert "MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'true'" in recurring
          assert "MLB_V8_HISTORICAL_BBS_OVERLAY_ENABLED: 'true'" in realtime
          assert "MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'true'" in realtime
          PY

      - name: Publish repair and remove installer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/mlb-supervised-shadow-v2-recurring.yml \
            .github/workflows/mlb-v8-shadow-realtime-72.yml
          git rm .github/workflows/mlb-v8-overlay-authority-fix-once.yml
          git diff --cached --check
          git commit -m 'Require BBD overlay for V8 shadow evaluation'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
