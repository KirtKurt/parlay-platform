name: Dispatch MLB production repair observer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-mlb-production-repair-deployments.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch end-to-end production repair observer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run verify-mlb-production-repair-end-to-end.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Record observer source
        run: |
          echo "source_sha=$(gh api --repo "$GITHUB_REPOSITORY" repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)"
        env:
          GH_TOKEN: ${{ github.token }}
