name: Dispatch verified MLB production repair deployments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-mlb-production-repair-deployments.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch isolated MLB AUTO deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-mlb-auto-llm.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Dispatch root production deployment and verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Dispatch end-to-end deployment observer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run verify-mlb-production-repair-end-to-end.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Record dispatched source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "source_sha=$source_sha"
