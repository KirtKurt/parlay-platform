name: MLB historical data and daily admission
on:
  workflow_dispatch:
  schedule:
    - cron: '37 10 * * *'
  push:
    branches: [main, codex/mlb-r8-health-repair-20260909]
    paths:
      - '.github/workflows/mlb-data-expansion.yml'
      - 'scripts/mlb_data_admission.py'
      - 'scripts/mlb_historical_development_data.py'
      - 'scripts/run_mlb_data_expansion.py'
      - 'scripts/publish_mlb_data_admission.py'
      - 'tests/unit/test_mlb_data_expansion.py'
permissions:
  contents: write
concurrency:
  group: mlb-reconstructed-development-data-v1
  cancel-in-progress: true
jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.34,<2' 'pytest>=8,<9'
      - name: Verify isolation and point-in-time data contracts
        run: python -m pytest -q tests/unit/test_mlb_data_expansion.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Prepare historical development data and inspect live admission
        run: python scripts/run_mlb_data_expansion.py --persist --max-rows 5000
      - name: Publish daily admission reports
        if: github.ref == 'refs/heads/main'
        run: python scripts/publish_mlb_data_admission.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-data-expansion-${{ github.run_id }}
          path: |
            runtime_reports/mlb_data_admission_latest.json
            runtime_reports/mlb_data_admission_rows_latest.json
            runtime_reports/mlb_historical_development_dataset_latest.json
          if-no-files-found: warn
          retention-days: 90
