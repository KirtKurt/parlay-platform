name: MLB V8 Selection Guard CI

"on":
  pull_request:
    paths:
      - 'hello_world/mlb_supervised_daily_objective_v2_1.py'
      - 'hello_world/mlb_supervised_selection_guard_v2_3.py'
      - 'tests/unit/test_mlb_supervised_daily_objective_v2_1.py'
      - 'tests/unit/test_mlb_supervised_selection_guard_v2_3.py'
      - '.github/workflows/mlb-v8-selection-guard-ci.yml'
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_supervised_daily_objective_v2_1.py'
      - 'hello_world/mlb_supervised_selection_guard_v2_3.py'
      - 'tests/unit/test_mlb_supervised_daily_objective_v2_1.py'
      - 'tests/unit/test_mlb_supervised_selection_guard_v2_3.py'
      - '.github/workflows/mlb-v8-selection-guard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-selection-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test V8 selection guard
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile \
            hello_world/mlb_supervised_daily_objective_v2_1.py \
            hello_world/mlb_supervised_selection_guard_v2_3.py
          PYTHONPATH=.:hello_world python -m pytest -q --tb=short \
            tests/unit/test_mlb_supervised_daily_objective_v2_1.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_3.py
