name: Diagnose PR601 R7 legacy terminal now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pr601-r7-legacy-terminal-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-pr601-r7-legacy-terminal-now
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose exact terminal classifications
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path = Path('tests/unit/test_mlb_daily_per_game_lock.py')
          spec = importlib.util.spec_from_file_location('lock_test', path)
          t = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(t)

          def dump(label, value):
              print(label, json.dumps(value, sort_keys=True, indent=2, default=str))

          source = t.pull('2026-07-13T17:15:00+00:00', [t.G1], 'source-only')
          missing = t.build_module([source], '2026-07-13T17:17:00+00:00', seed=False)
          pulls = missing._pulls_for_date(t.SLATE)
          manifest = missing._latest_games_for_date(t.SLATE, pulls)
          scoring = t.patch._scoring_pulls(missing, pulls, manifest[0])
          dump('MISSING_PULL_INTEGRITY', t.history_contract.validate_pull_integrity(source))
          dump('MISSING_SCORING_COUNT', len(scoring))
          candidate = t.patch._last_prelock_candidate(missing, t.SLATE, manifest[0], scoring)
          dump('MISSING_CANDIDATE_ERRORS', candidate[3])
          dump('MISSING_RUN', missing.run_lock(t.SLATE))

          after = t.pull('2026-07-13T17:15:01+00:00', [t.G1], 'after-cutoff')
          post = t.build_module([source, after], '2026-07-13T17:17:00+00:00', seed=False)
          t.persist_candidate(post, t.G1, after)
          ppulls = post._pulls_for_date(t.SLATE)
          pmanifest = post._latest_games_for_date(t.SLATE, ppulls)
          pscoring = t.patch._scoring_pulls(post, ppulls, pmanifest[0])
          dump('POST_CANDIDATE_ERRORS', t.patch._last_prelock_candidate(post, t.SLATE, pmanifest[0], pscoring)[3])
          dump('POST_RUN', post.run_lock(t.SLATE))

          back_source = t.pull('2026-07-13T17:14:00+00:00', [t.G1], 'backdated-source')
          back = t.build_module([back_source], '2026-07-13T17:17:00+00:00', seed=False)
          t.persist_candidate(back, t.G1, back_source, persisted_at='2026-07-13T17:15:01+00:00')
          bpulls = back._pulls_for_date(t.SLATE)
          bmanifest = back._latest_games_for_date(t.SLATE, bpulls)
          bscoring = t.patch._scoring_pulls(back, bpulls, bmanifest[0])
          dump('BACK_CANDIDATE_ERRORS', t.patch._last_prelock_candidate(back, t.SLATE, bmanifest[0], bscoring)[3])
          dump('BACK_RUN', back.run_lock(t.SLATE))

          scheduled_source = t.pull('2026-07-13T17:15:00+00:00', [t.G1], 'source-only-scheduled')
          scheduled = t.build_module([scheduled_source], '2026-07-13T17:15:00+00:00', seed=False)
          first = scheduled.run_lock(t.SLATE)
          dump('SCHEDULED_FIRST', first)
          scheduled.now = t.dt('2026-07-13T17:16:00+00:00')
          dump('SCHEDULED_SECOND', scheduled.run_lock(t.SLATE, scheduled=True))
          PY

      - name: Remove one-shot diagnostic workflow from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/r7-diag-cleanup origin/main
          cd /tmp/r7-diag-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f .github/workflows/diagnose-pr601-r7-legacy-terminal-now.yml; then
            git rm .github/workflows/diagnose-pr601-r7-legacy-terminal-now.yml
            git commit -m 'Remove completed PR601 R7 terminal diagnostic [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 2))
            done
            exit 1
          fi