name: Capture MLB R7 August 4 repair evidence after lease expiry

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-mlb-r7-aug4-after-lease.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-mlb-r7-aug4-after-lease
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Invoke protected transition after the stale lease boundary
        run: |
          set -euo pipefail
          fn=$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id MLBDailyPickLockFunction \
            --region us-east-1 \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$fn"
          test "$fn" != None

          acquired=false
          for attempt in $(seq 1 12); do
            aws lambda invoke \
              --function-name "$fn" \
              --region us-east-1 \
              --invocation-type RequestResponse \
              --cli-binary-format raw-in-base64-out \
              --cli-connect-timeout 60 \
              --cli-read-timeout 900 \
              --payload '{"sport":"mlb","run":"prospective_terminal_backlog_reconciliation_v5","slateDateEt":"2026-08-04","force":true}' \
              /tmp/terminal.json \
              >/tmp/meta.json
            ATTEMPT="$attempt" python - <<'PY'
          import json, os
          from pathlib import Path

          raw=json.loads(Path('/tmp/terminal.json').read_text())
          body=raw.get('body') if isinstance(raw,dict) else None
          if isinstance(body,str):
              try: payload=json.loads(body)
              except Exception: payload={}
          elif isinstance(body,dict):
              payload=body
          else:
              payload=raw if isinstance(raw,dict) else {}
          report=payload.get('missedLockTerminalReconciliation')
          report=report if isinstance(report,dict) else {}
          progress=report.get('progressAfter')
          progress=progress if isinstance(progress,dict) else {}
          concurrency=payload.get('lockExecutionConcurrency')
          concurrency=concurrency if isinstance(concurrency,dict) else {}
          overlap=bool(
              payload.get('reason')=='SKIPPED_OVERLAPPING_LOCK_EXECUTION'
              or payload.get('error')=='MLB_LOCK_EXECUTION_ALREADY_RUNNING'
              or concurrency.get('overlapSkipped') is True
          )
          safe={
              'attempt':int(os.environ['ATTEMPT']),
              'overlap':overlap,
              'ok':payload.get('ok'),
              'reason':payload.get('reason'),
              'error':str(payload.get('error') or '')[:500],
              'slateDateEt':payload.get('slateDateEt'),
              'missedGameCount':payload.get('missedGameCount'),
              'noPredictionDataCount':payload.get('noPredictionDataCount'),
              'lockStatusComplete':payload.get('lockStatusComplete'),
              'failClosed':payload.get('failClosed'),
              'durableNoPredictionTerminalReconciled':payload.get('durableNoPredictionTerminalReconciled'),
              'durableNoPredictionTerminalReconciledCount':payload.get('durableNoPredictionTerminalReconciledCount'),
              'terminalReport':{
                  key:report.get(key)
                  for key in (
                      'ok','version','reason','error','slateDateEt',
                      'manifestGameCount','missedBeforeCount','reconciledCount',
                      'remainingMissedCount','postStartPredictionCreationAllowed',
                      'candidateIntegrityFailuresRelabeled'
                  ) if key in report
              },
              'progressAfter':{
                  key:progress.get(key)
                  for key in (
                      'manifestGameCount','gameCount','canonicalCount',
                      'lockOutcomeCount','noPredictionDataCount','missedCount',
                      'dueMissingCount','lockedCount','complete'
                  ) if key in progress
              },
          }
          unresolved=[]
          for row in (report.get('unresolved') or [])[:20]:
              if not isinstance(row,dict): continue
              unresolved.append({
                  key:row.get(key)
                  for key in (
                      'gameIdentity','reason','candidatePresent',
                      'candidateProofPresent','candidateErrors'
                  ) if key in row
              })
          safe['unresolved']=unresolved
          Path('/tmp/safe.json').write_text(json.dumps(safe,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(safe,indent=2,sort_keys=True,default=str))
          PY
            if python - <<'PY'
          import json
          row=json.load(open('/tmp/safe.json'))
          raise SystemExit(0 if not row.get('overlap') else 1)
          PY
            then
              acquired=true
              break
            fi
            sleep 30
          done
          test "$acquired" = true

      - name: Prove exact-date durability after transition
        run: |
          set -euo pipefail
          fn=$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id MLBDailyPickLockFunction \
            --region us-east-1 \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          aws lambda invoke \
            --function-name "$fn" \
            --region us-east-1 \
            --cli-binary-format raw-in-base64-out \
            --cli-connect-timeout 60 \
            --cli-read-timeout 300 \
            --payload '{"httpMethod":"GET","path":"/v1/mlb/locks/status","queryStringParameters":{"date":"2026-08-04"}}' \
            /tmp/status.json \
            >/tmp/status-meta.json
          python - <<'PY'
          import json
          envelope=json.load(open('/tmp/status.json'))
          body=envelope.get('body')
          payload=json.loads(body) if isinstance(body,str) else dict(body or envelope)
          fields=(
              'ok','sport','slateDateEt','gameCount','lockedPredictionCount',
              'lockedStatusCount','noPredictionDataCount','missedGameCount',
              'missedLockCount','lockStatusComplete','canonicalPredictionComplete',
              'operationalDefect','reason','error'
          )
          report={key:payload.get(key) for key in fields if key in payload}
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          assert report.get('slateDateEt')=='2026-08-04', report
          PY
