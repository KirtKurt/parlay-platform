name: Apply MLB AUTO Bedrock gateway now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mlb-auto-bedrock-gateway-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-mlb-auto-bedrock-gateway-now
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic source mutation
        run: |
          set -euo pipefail
          python scripts/repair_mlb_auto_bedrock_gateway.py
          python -m py_compile \
            mlb_auto_llm/model_gateway.py \
            mlb_auto_llm/bedrock_smoke.py \
            mlb_auto_llm/handler.py \
            scripts/repair_mlb_auto_bedrock_gateway.py
          grep -q 'from model_gateway import invoke_chain_text' mlb_auto_llm/handler.py
          grep -q 'openai.gpt-5.6-sol' mlb-auto-llm-template.yaml
          grep -q 'bedrock-mantle:CallWithBearerToken' mlb-auto-llm-template.yaml
          grep -q 'test_mlb_auto_model_gateway.py' .github/workflows/deploy-mlb-auto-llm.yml
          git diff --check
      - name: Publish production gateway source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mlb_auto_llm/handler.py \
            mlb-auto-llm-template.yaml \
            .github/workflows/deploy-mlb-auto-llm.yml
          if git diff --cached --quiet; then
            echo 'Gateway source already installed.'
            exit 0
          fi
          git commit -m 'Route MLB AUTO through capability-first Bedrock gateway'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" != 5 || exit 1
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done

