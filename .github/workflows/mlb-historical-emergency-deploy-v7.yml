name: MLB Historical Emergency Deploy V7

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-emergency-deploy-v7.yml'
      - 'hello_world/mlb_historical_optimizer_handler.py'
      - 'hello_world/mlb_historical_daily_optimizer_v1.py'
      - 'mlb_historical_optimizer/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-historical-emergency-deploy-v7
  cancel-in-progress: false

env:
  HIST_STACK: parlay-platform-mlb-historical-optimizer

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate committed repair
        run: |
          set -euo pipefail
          python -m py_compile hello_world/mlb_historical_optimizer_handler.py hello_world/mlb_historical_daily_optimizer_v1.py
          grep -Fq 'provider_snapshot_too_stale' hello_world/mlb_historical_optimizer_handler.py

      - name: Build and deploy isolated historical stack
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf .aws-sam-historical-v7
          sam build --no-cached --build-dir .aws-sam-historical-v7 --template-file mlb_historical_optimizer/template.yaml
          sam deploy \
            --template-file .aws-sam-historical-v7/template.yaml \
            --stack-name "$HIST_STACK" \
            --region "$AWS_REGION_VALUE" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --force-upload \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              'TargetSnapshotsTable=parlay_platform_snapshots' \
              'HistoricalStartDate=2025-04-01' \
              'HistoricalEndDate=2026-07-26' \
              'HistoricalTargetGames=3127' \
              'HistoricalMaxCredits=250000' \
              'HistoricalRequestsPerRun=100' \
              'HistoricalMaxCandidates=25000' \
              'HistoricalMaxOptimizationRounds=12' \
              'HistoricalFreshAuditIncrementGames=250' \
              "DeployGitSha=$(git rev-parse HEAD)"

      - name: Resolve function and attest deployed package
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          HIST_FN=$(aws cloudformation describe-stacks --stack-name "$HIST_STACK" --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" --output text)
          test -n "$HIST_FN"
          echo "HIST_FN=$HIST_FN" >> "$GITHUB_ENV"
          URL=$(aws lambda get-function --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --query 'Code.Location' --output text)
          curl -fsSL "$URL" -o /tmp/historical-v7.zip
          unzip -p /tmp/historical-v7.zip mlb_historical_optimizer_handler.py | grep -Fq 'provider_snapshot_too_stale'

      - name: Invoke until cursor advances
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            aws lambda invoke --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload "{\"mode\":\"orchestrate\",\"run\":\"emergency_v7_${n}\"}" "/tmp/run${n}.json" >/tmp/meta.json
            python - <<'PY'
import json, glob
for path in sorted(glob.glob('/tmp/run*.json')):
    value=json.load(open(path))
    if value.get('FunctionError') or value.get('errorMessage'):
        raise SystemExit(f'Lambda invocation failed: {path}: {value}')
PY
            sleep 8
          done
          aws lambda invoke --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload '{"mode":"status","run":"emergency_v7_status"}' /tmp/status.json >/tmp/status-meta.json

      - name: Build verified proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          value=json.load(open('/tmp/status.json'))
          state=value.get('state') or {}
          proof={
            'checkedAt': datetime.now(timezone.utc).isoformat(),
            'version': value.get('version'),
            'phase': state.get('phase'),
            'currentDate': state.get('currentDate'),
            'currentSlotIndex': state.get('currentSlotIndex'),
            'networkRequestCount': state.get('networkRequestCount'),
            'eligibleGameCount': state.get('eligibleGameCount'),
            'completeSlateCount': state.get('completeSlateCount'),
            'optimizationRound': state.get('optimizationRound'),
            'revision': state.get('revision'),
            'creditsConsumed': state.get('creditsConsumed'),
            'lastError': state.get('lastError'),
          }
          print(json.dumps(proof,indent=2))
          assert proof['lastError'] in (None, '', []), proof
          assert 'too stale for a 15-minute grid' not in str(proof['lastError'] or ''), proof
          assert int(proof['eligibleGameCount'] or 0) > 0, proof
          assert int(proof['completeSlateCount'] or 0) > 0, proof
          os.makedirs('docs/runtime',exist_ok=True)
          json.dump(proof,open('docs/runtime/mlb-historical-emergency-v7-proof.json','w'),indent=2)
          PY

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-historical-emergency-v7-proof
          path: docs/runtime/mlb-historical-emergency-v7-proof.json
          if-no-files-found: error

      - name: Publish verified proof to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/mlb-historical-emergency-v7-proof.json
          if git diff --cached --quiet; then
            echo 'Proof unchanged; nothing to publish.'
            exit 0
          fi
          git commit -m 'chore: publish MLB historical emergency v7 proof'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo 'Unable to publish proof after five retries.' >&2
          exit 1
