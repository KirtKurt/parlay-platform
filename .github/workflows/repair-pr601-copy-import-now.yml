name: Repair PR601 R7 cooperative receipt copy import now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pr601-copy-import-now.yml'

permissions:
  contents: write

concurrency:
  group: repair-pr601-copy-import-now
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "a860118f5227ea595cc2f5e2d9d318321991a3f3"

      - name: Apply MLB-only import repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('hello_world/mlb_daily_pick_lock_protected.py')
          text = path.read_text()
          if '\nimport copy\n' in text or text.startswith('import copy\n'):
              raise SystemExit('copy import already present; refusing ambiguous rewrite')
          marker = 'from __future__ import annotations\n\n'
          if text.count(marker) != 1:
              raise SystemExit('future-import marker mismatch')
          text = text.replace(marker, marker + 'import copy\n', 1)
          path.write_text(text)
          PY
          git diff --check
          python -m py_compile hello_world/mlb_daily_pick_lock_protected.py

      - name: Install bounded verifier dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'

      - name: Prove cooperative receipt paths remain fail-closed and pass
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/unit/test_mlb_daily_pick_lock_runtime.py::test_eventbridge_owner_runs_current_first_then_completes_redacted_handoff \
            tests/unit/test_mlb_daily_pick_lock_runtime.py::test_completed_receipt_survives_acknowledgement_replacement_race \
            tests/unit/test_mlb_daily_pick_lock_runtime.py::test_persisted_completed_receipt_is_revalidated_and_rejects_hostile_extra \
            tests/unit/test_mlb_daily_pick_lock_runtime.py::test_all_quarantine_completion_response_crosses_protected_receipt_boundary

      - name: Commit only the MLB protected-handler import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hello_world/mlb_daily_pick_lock_protected.py
          test "$(git diff --cached --name-only)" = "hello_world/mlb_daily_pick_lock_protected.py"
          git diff --cached --quiet && exit 1
          git commit -m 'Fix R7 cooperative receipt deepcopy import'
          git push origin HEAD:codex/mlb-valid-prelock-quarantine-v4-567

      - name: Remove one-shot repair workflow from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/r7-copy-import-cleanup origin/main
          cd /tmp/r7-copy-import-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-pr601-copy-import-now.yml
          git commit -m 'Remove completed PR601 copy-import repair [skip ci]'
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((n*2))
          done
          exit 1
