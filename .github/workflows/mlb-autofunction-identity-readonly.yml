name: MLB separate AutoFunction identity read-only

on:
  pull_request:
    paths:
      - 'scripts/provision_ks1_identity_reader.py'
      - 'infra/ks1-autofunction-reader.json'
      - 'tests/unit/test_provision_ks1_identity_reader.py'
      - 'scripts/collect_mlb_autofunction_identity.py'
      - 'scripts/mlb_lambda_artifact_identity.py'
      - 'tests/unit/test_mlb_autofunction_identity.py'
      - '.github/workflows/mlb-autofunction-identity-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/provision_ks1_identity_reader.py'
      - 'infra/ks1-autofunction-reader.json'
      - 'tests/unit/test_provision_ks1_identity_reader.py'
      - 'scripts/collect_mlb_autofunction_identity.py'
      - 'scripts/mlb_lambda_artifact_identity.py'
      - 'tests/unit/test_mlb_autofunction_identity.py'
      - '.github/workflows/mlb-autofunction-identity-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-autofunction-identity-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7'
      - run: python -m pytest -q tests/unit/test_mlb_autofunction_identity.py tests/unit/test_provision_ks1_identity_reader.py

  evidence:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contract
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.34,<2'
      - name: Record negative evidence until restricted authentication succeeds
        run: |
          mkdir -p /tmp
          printf '%s\n' '{"identityVerified":false,"isolationAuthorized":false,"failedStage":"restricted_oidc_authentication","requiredRoleArn":"arn:aws:iam::735707987003:role/ks1-autofunction-identity-reader","awsWrites":0,"lambdaInvocations":0}' > /tmp/mlb-autofunction-identity.json
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::735707987003:role/ks1-autofunction-identity-reader
          role-session-name: ks1-autofunction-readonly
          role-duration-seconds: 900
          allowed-account-ids: '735707987003'
          aws-region: us-east-1
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["sts:GetCallerIdentity","cloudformation:DescribeStacks","cloudformation:ListStackResources","lambda:GetFunction","lambda:GetFunctionConfiguration","iam:GetRole","iam:ListRolePolicies","iam:GetRolePolicy","iam:ListAttachedRolePolicies","iam:GetPolicy","iam:GetPolicyVersion","events:ListRules","events:ListTargetsByRule"],"Resource":"*"},{"Effect":"Deny","NotAction":["sts:GetCallerIdentity","cloudformation:DescribeStacks","cloudformation:ListStackResources","lambda:GetFunction","lambda:GetFunctionConfiguration","iam:GetRole","iam:ListRolePolicies","iam:ListAttachedRolePolicies","iam:GetRolePolicy","iam:GetPolicy","iam:GetPolicyVersion","events:ListRules","events:ListTargetsByRule"],"Resource":"*"}]}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Collect stack, Lambda, IAM and rule evidence without invocation
        run: python scripts/collect_mlb_autofunction_identity.py --output /tmp/mlb-autofunction-identity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-autofunction-identity-${{ github.run_id }}
          path: /tmp/mlb-autofunction-identity.json
          if-no-files-found: error
          retention-days: 30
