name: MLB separate AutoFunction identity read-only

on:
  pull_request:
    paths:
      - 'scripts/collect_mlb_autofunction_identity.py'
      - 'scripts/mlb_lambda_artifact_identity.py'
      - 'tests/unit/test_mlb_autofunction_identity.py'
      - '.github/workflows/mlb-autofunction-identity-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_mlb_autofunction_identity.py'
      - 'scripts/mlb_lambda_artifact_identity.py'
      - 'tests/unit/test_mlb_autofunction_identity.py'
      - '.github/workflows/mlb-autofunction-identity-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-autofunction-identity-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q tests/unit/test_mlb_autofunction_identity.py

  evidence:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.34,<2'
      - name: Provision a dedicated metadata reader and assume a restricted session
        env:
          # Bootstrap alone may create the narrowly scoped reader role. All
          # repository code and later actions receive only a read-only session.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import boto3
          from botocore.exceptions import ClientError

          mutations = []
          stage = "sts:GetCallerIdentity"
          try:
              sts = boto3.client('sts', region_name='us-east-1')
              caller = sts.get_caller_identity()
              if caller['Account'] != '735707987003' or not caller['Arn'].startswith('arn:aws:iam::735707987003:user/'):
                  raise ValueError('Unexpected production IAM bootstrap principal')
              actions = [
                  'sts:GetCallerIdentity', 'cloudformation:DescribeStacks',
                  'cloudformation:ListStackResources', 'lambda:GetFunction',
                  'lambda:GetFunctionConfiguration', 'iam:GetRole',
                  'iam:ListRolePolicies', 'iam:GetRolePolicy',
                  'iam:ListAttachedRolePolicies', 'iam:GetPolicy',
                  'iam:GetPolicyVersion', 'events:ListRules',
                  'events:ListTargetsByRule',
              ]
              policy = {'Version': '2012-10-17', 'Statement': [
                  {'Effect': 'Allow', 'Action': actions, 'Resource': '*'},
                  {'Effect': 'Deny', 'NotAction': actions, 'Resource': '*'},
              ]}
              # Creation adds only a metadata reader; existing roles are never
              # rewritten. The explicit Deny also bounds the assumed session.
              iam = boto3.client('iam', region_name='us-east-1')
              role_name = 'ks1-autofunction-identity-reader'
              role_arn = 'arn:aws:iam::735707987003:role/' + role_name
              trust = {'Version': '2012-10-17', 'Statement': [{
                  'Effect': 'Allow', 'Principal': {'AWS': caller['Arn']},
                  'Action': 'sts:AssumeRole'}]}
              created = False
              try:
                  stage = 'iam:GetRole'
                  role = iam.get_role(RoleName=role_name)['Role']
              except iam.exceptions.NoSuchEntityException:
                  stage = 'iam:CreateRole'
                  role = iam.create_role(RoleName=role_name,
                      AssumeRolePolicyDocument=json.dumps(trust),
                      Description='KS1 separate AutoFunction read-only metadata evidence',
                      Tags=[{'Key': 'Purpose', 'Value': 'KS1AutoFunctionIdentityReadOnly'}])['Role']
                  created = True
                  mutations.append("iam:CreateRole")
                  stage = 'iam:PutRolePolicy'
                  iam.put_role_policy(RoleName=role_name, PolicyName='MetadataReadOnly',
                                      PolicyDocument=json.dumps(policy))
                  mutations.append("iam:PutRolePolicy")
              if role['Arn'] != role_arn or role['AssumeRolePolicyDocument'] != trust:
                  raise ValueError('Existing reader role identity or trust differs')
              stage = 'iam:GetRolePolicy'
              installed = iam.get_role_policy(RoleName=role_name,
                  PolicyName='MetadataReadOnly')['PolicyDocument']
              if installed != policy:
                  raise ValueError('Existing reader role policy differs')
              Path('/tmp/mlb-autofunction-reader-bootstrap.json').write_text(json.dumps({
                  'readerRoleArn': role_arn, 'roleCreated': created,
                  'awsMutations': mutations,
                  'policy': policy, 'trust': trust}) + '\n')
              import time
              for attempt in range(6):
                  try:
                      stage = "sts:AssumeRole"
                      response = sts.assume_role(RoleArn=role_arn,
                          RoleSessionName='ks1-autofunction-readonly', DurationSeconds=900,
                          Policy=json.dumps(policy, separators=(',', ':')))
                      break
                  except ClientError:
                      if attempt == 5:
                          raise
                      time.sleep(2)

              credentials = response['Credentials']
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  for name, field in [('AWS_ACCESS_KEY_ID', 'AccessKeyId'),
                                      ('AWS_SECRET_ACCESS_KEY', 'SecretAccessKey'),
                                      ('AWS_SESSION_TOKEN', 'SessionToken')]:
                      print('::add-mask::' + credentials[field])
                      output.write(name + '=' + credentials[field] + '\n')
                  output.write('AWS_DEFAULT_REGION=us-east-1\n')
          except Exception as exc:
              Path('/tmp/mlb-autofunction-identity.json').write_text(json.dumps({
                  'identityVerified': False, 'isolationAuthorized': False,
                  'failedStage': 'read_only_session_bootstrap',
                  'failedOperation': stage,
                  'awsErrorCode': getattr(exc, 'response', {}).get('Error', {}).get('Code'),
                  'errorType': type(exc).__name__,
                  'awsMutations': mutations, 'lambdaInvocations': 0}) + '\n')
              raise SystemExit('Read-only session bootstrap failed; see redacted artifact')
          PYTHON
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Collect stack, Lambda, IAM and rule evidence without invocation
        run: python scripts/collect_mlb_autofunction_identity.py --output /tmp/mlb-autofunction-identity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-autofunction-identity-${{ github.run_id }}
          path: /tmp/mlb-autofunction-*.json
          if-no-files-found: error
          retention-days: 30
