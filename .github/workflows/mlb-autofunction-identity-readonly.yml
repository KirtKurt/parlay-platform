name: MLB separate AutoFunction identity read-only

on:
  pull_request:
    paths:
      - 'scripts/collect_mlb_autofunction_identity.py'
      - 'tests/unit/test_mlb_autofunction_identity.py'
      - '.github/workflows/mlb-autofunction-identity-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_mlb_autofunction_identity.py'
      - 'tests/unit/test_mlb_autofunction_identity.py'
      - '.github/workflows/mlb-autofunction-identity-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-autofunction-identity-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q tests/unit/test_mlb_autofunction_identity.py

  evidence:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.34,<2'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Collect stack, Lambda, IAM and rule evidence without invocation
        run: python scripts/collect_mlb_autofunction_identity.py --output /tmp/mlb-autofunction-identity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-autofunction-identity-${{ github.run_id }}
          path: /tmp/mlb-autofunction-identity.json
          if-no-files-found: error
          retention-days: 30
