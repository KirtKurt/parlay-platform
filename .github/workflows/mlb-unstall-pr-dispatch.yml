name: Dispatch MLB V7 Post-Fix Verification From PR

"on":
  pull_request:
    paths:
      - '.github/workflows/mlb-unstall-pr-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fixed MLB V7 verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mlb-historical-supervised-v9-shadow.yml --repo "$GITHUB_REPOSITORY" --ref main
