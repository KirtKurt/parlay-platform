name: Dispatch MLB Anti-Stall Commit Builder From PR

"on":
  pull_request:
    paths:
      - '.github/workflows/mlb-unstall-pr-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validated anti-stall commit builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mlb-unstall-publish-tree-once.yml --repo "$GITHUB_REPOSITORY" --ref main
