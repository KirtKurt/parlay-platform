name: MLB Provider-Neutral Deploy Identity Migration

"on":
  push:
    branches:
      - agent/fix-mlb-provider-neutral-deploy-identity
    paths:
      - 'scripts/migrate_mlb_deploy_identity_provider_neutral.py'
      - '.github/workflows/mlb-provider-neutral-deploy-identity-migration.yml'
  pull_request:
    paths:
      - 'scripts/migrate_mlb_deploy_identity_provider_neutral.py'
      - '.github/workflows/mlb-provider-neutral-deploy-identity-migration.yml'
      - 'scripts/verify_mlb_deploy_identity.py'
      - 'scripts/verify_mlb_no_bbd_runtime.py'
      - 'tests/unit/test_mlb_deploy_identity.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-provider-neutral-deploy-identity-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply provider-neutral deploy identity migration
        run: |
          set -euo pipefail
          python scripts/migrate_mlb_deploy_identity_provider_neutral.py
          python -m py_compile \
            scripts/migrate_mlb_deploy_identity_provider_neutral.py \
            scripts/verify_mlb_deploy_identity.py \
            scripts/verify_mlb_no_bbd_runtime.py

      - name: Verify deploy identity and no-BBD contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          PYTHONPATH=. python -m pytest -q \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_verify_mlb_no_bbd_runtime.py
          python scripts/migrate_mlb_deploy_identity_provider_neutral.py --check
          python scripts/verify_mlb_no_bbd_runtime.py
          git diff --check

      - name: Commit verified provider-neutral identity source
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            scripts/verify_mlb_deploy_identity.py \
            scripts/verify_mlb_no_bbd_runtime.py \
            tests/unit/test_mlb_deploy_identity.py; then
            echo 'Provider-neutral deploy identity source is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/verify_mlb_deploy_identity.py \
            scripts/verify_mlb_no_bbd_runtime.py \
            tests/unit/test_mlb_deploy_identity.py
          git commit -m 'Migrate MLB deploy identity to provider-neutral runtime'
          git push origin "HEAD:${BRANCH}"
