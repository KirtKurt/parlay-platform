# Second push activates this one-time workflow.
name: MLB V8 V2.6 Selector Fix Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-v26-selector-fix-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v8-v26-selector-fix-once
  cancel-in-progress: false

env:
  PYTHONPATH: .:hello_world:scripts

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install executable V2.6 selector
        run: |
          set -euo pipefail
          python scripts/patch_mlb_v8_v26_once.py

      - name: Verify grid execution and seed alignment
        run: |
          set -euo pipefail
          python -m pip install --quiet 'numpy>=1.26,<3' 'pytest>=8,<9'
          python -m py_compile \
            hello_world/mlb_supervised_selection_guard_v2_3.py \
            hello_world/mlb_supervised_selection_guard_v2_5.py \
            hello_world/mlb_supervised_selection_guard_v2_6.py \
            hello_world/mlb_supervised_daily_objective_v2_1.py
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_supervised_selection_guard_v2_3.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_5.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_6.py \
            tests/unit/test_mlb_supervised_daily_objective_v2_1.py
          grep -Fq 'l2_values = tuple(REGULARIZATION_GRID)' hello_world/mlb_supervised_selection_guard_v2_3.py
          ! grep -Fq 'l2_index * 100' hello_world/mlb_supervised_selection_guard_v2_3.py
          grep -Fq 'mlb_supervised_selection_guard_v2_6 as selection_guard' hello_world/mlb_supervised_daily_objective_v2_1.py

      - name: Publish fix and remove installer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            hello_world/mlb_supervised_selection_guard_v2_3.py \
            hello_world/mlb_supervised_daily_objective_v2_1.py \
            .github/workflows/mlb-supervised-shadow-v2-recurring.yml
          git rm \
            .github/workflows/mlb-v8-v26-selector-fix-once.yml \
            scripts/patch_mlb_v8_v26_once.py
          git diff --cached --check
          git commit -m 'Execute V8 seed-aligned regularization search'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
