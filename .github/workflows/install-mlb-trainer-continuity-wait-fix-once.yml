name: Install MLB Trainer Continuity Wait Fix Once
# PR-validated syntax-safe deterministic contract.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/install-mlb-trainer-continuity-wait-fix-once.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-mlb-trainer-continuity-wait-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-mlb-trainer-continuity-wait-fix-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply fail-closed continuity-wait semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('hello_world/mlb_ml_aws_training_v1.py')
          source = source_path.read_text()
          old = '''                    "ok": False,
                    "status": "CANONICAL_SLATE_CONTINUITY_BLOCKED",
                    "executionMode": "training",
'''
          new = '''                    "ok": True,
                    "status": "WAITING_FOR_CANONICAL_SLATE_CONTINUITY",
                    "executionMode": "training",
                    "trainingReady": False,
                    "waiting": True,
                    "waitReason": "canonical_slate_continuity",
'''
          assert source.count(old) == 1, 'expected one continuity-block status anchor'
          source = source.replace(old, new, 1)
          assert old not in source
          assert source.count(new) == 1
          assert '"canonicalSlateContinuity": slate_continuity' in source
          assert '"modelTrained": False' in source
          assert '"championChanged": False' in source
          source_path.write_text(source)

          diagnostic_path = Path('.github/workflows/diagnose-mlb-trainer-function-error.yml')
          diagnostic = diagnostic_path.read_text()
          old_diagnostic = "row.get('status') == 'CANONICAL_SLATE_CONTINUITY_BLOCKED'"
          new_diagnostic = "row.get('status') in {'CANONICAL_SLATE_CONTINUITY_BLOCKED', 'WAITING_FOR_CANONICAL_SLATE_CONTINUITY'}"
          assert diagnostic.count(old_diagnostic) == 1, 'expected one diagnostic status anchor'
          diagnostic_path.write_text(diagnostic.replace(old_diagnostic, new_diagnostic, 1))

          test_path = Path('tests/unit/test_mlb_trainer_continuity_wait_v1.py')
          test_path.write_text('''from pathlib import Path\n\n\ndef test_continuity_wait_is_fail_closed_without_lambda_failure():\n    source = Path(\"hello_world/mlb_ml_aws_training_v1.py\").read_text()\n    assert '\"ok\": True' in source\n    assert '\"status\": \"WAITING_FOR_CANONICAL_SLATE_CONTINUITY\"' in source\n    assert '\"trainingReady\": False' in source\n    assert '\"waiting\": True' in source\n    assert '\"waitReason\": \"canonical_slate_continuity\"' in source\n    assert '\"canonicalSlateContinuity\": slate_continuity' in source\n    assert '\"modelTrained\": False' in source\n    assert '\"championChanged\": False' in source\n    assert '\"status\": \"CANONICAL_SLATE_CONTINUITY_BLOCKED\"' not in source\n''')
          PY
          git diff --check

      - name: Validate deterministic source contract
        run: |
          set -euo pipefail
          python -m py_compile \
            hello_world/mlb_ml_aws_training_v1.py \
            scripts/verify_mlb_trainer_deploy_response.py \
            tests/unit/test_mlb_trainer_continuity_wait_v1.py
          python - <<'PY'
          from pathlib import Path
          source=Path('hello_world/mlb_ml_aws_training_v1.py').read_text()
          assert '"status": "WAITING_FOR_CANONICAL_SLATE_CONTINUITY"' in source
          assert '"trainingReady": False' in source
          assert '"waiting": True' in source
          assert '"waitReason": "canonical_slate_continuity"' in source
          assert '"canonicalSlateContinuity": slate_continuity' in source
          assert '"status": "CANONICAL_SLATE_CONTINUITY_BLOCKED"' not in source
          assert 'raise TrainingContractError(' in source
          PY

      - name: Publish canonical source fix
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          rm .github/workflows/install-mlb-trainer-continuity-wait-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            hello_world/mlb_ml_aws_training_v1.py \
            tests/unit/test_mlb_trainer_continuity_wait_v1.py \
            .github/workflows/diagnose-mlb-trainer-function-error.yml \
            .github/workflows/install-mlb-trainer-continuity-wait-fix-once.yml
          git commit -m 'Treat canonical continuity as a fail-closed trainer wait'
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Dispatch fresh trainer diagnostic
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/diagnose-mlb-trainer-function-error.yml/dispatches" \
            -f ref=main
