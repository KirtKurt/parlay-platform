name: Install MLB Trainer Continuity Wait Fix Once
# Trusted second push after workflow installation on the default branch.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/install-mlb-trainer-continuity-wait-fix-once.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-mlb-trainer-continuity-wait-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-mlb-trainer-continuity-wait-fix-once
  cancel-in-progress: false

jobs:
  validate-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply fail-closed continuity-wait semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('hello_world/mlb_ml_aws_training_v1.py')
          source = source_path.read_text()
          old = '''                    "ok": False,
                    "status": "CANONICAL_SLATE_CONTINUITY_BLOCKED",
                    "executionMode": "training",
'''
          new = '''                    "ok": True,
                    "status": "WAITING_FOR_CANONICAL_SLATE_CONTINUITY",
                    "executionMode": "training",
                    "trainingReady": False,
                    "waiting": True,
                    "waitReason": "canonical_slate_continuity",
'''
          if old in source:
              assert source.count(old) == 1, 'continuity status anchor must be unique'
              source = source.replace(old, new, 1)
          else:
              assert new in source, 'continuity wait fix anchor is missing'
          source_path.write_text(source)

          diagnostic_path = Path('.github/workflows/diagnose-mlb-trainer-function-error.yml')
          diagnostic = diagnostic_path.read_text()
          old_diagnostic = "row.get('status') == 'CANONICAL_SLATE_CONTINUITY_BLOCKED'"
          new_diagnostic = "row.get('status') in {'CANONICAL_SLATE_CONTINUITY_BLOCKED', 'WAITING_FOR_CANONICAL_SLATE_CONTINUITY'}"
          if old_diagnostic in diagnostic:
              assert diagnostic.count(old_diagnostic) == 1
              diagnostic = diagnostic.replace(old_diagnostic, new_diagnostic, 1)
          else:
              assert new_diagnostic in diagnostic
          diagnostic_path.write_text(diagnostic)

          test_path = Path('tests/unit/test_mlb_trainer_continuity_wait_v1.py')
          test_path.write_text('''from datetime import datetime, timezone\nfrom pathlib import Path\nfrom types import SimpleNamespace\n\nimport mlb_ml_aws_training_v1 as trainer\n\n\nclass _Store:\n    def __init__(self):\n        self.released = []\n\n    def acquire_execution_lease(self, experiment_id, **kwargs):\n        return {\"experimentId\": experiment_id, **kwargs}\n\n    def release_execution_lease(self, experiment_id, **kwargs):\n        self.released.append({\"experimentId\": experiment_id, **kwargs})\n\n\nclass _WaitingService:\n    def __init__(self):\n        self.config = SimpleNamespace(experiment_id=\"continuity-wait-test\")\n        self.store = _Store()\n\n    def now(self):\n        return datetime(2026, 8, 1, 20, 30, tzinfo=timezone.utc)\n\n    def attest_execution_lease_acquired(self, lease, **kwargs):\n        assert lease[\"experimentId\"] == self.config.experiment_id\n\n    def run_scheduled(self):\n        return {\n            \"ok\": True,\n            \"status\": \"WAITING_FOR_CANONICAL_SLATE_CONTINUITY\",\n            \"executionMode\": \"training\",\n            \"trainingReady\": False,\n            \"waiting\": True,\n            \"waitReason\": \"canonical_slate_continuity\",\n            \"modelTrained\": False,\n            \"championChanged\": False,\n            \"liveInferenceAuthority\": False,\n            \"automaticPromotionEnabled\": False,\n            \"milestones\": {\"canonicalContinuityReady\": False},\n            \"canonicalSlateContinuity\": {\n                \"ok\": False,\n                \"blockedSlateDate\": \"2026-07-31\",\n                \"blocker\": \"canonical_label_finalization_incomplete\",\n            },\n        }\n\n\ndef test_continuity_wait_is_healthy_invocation_without_training_or_authority(monkeypatch):\n    service = _WaitingService()\n    monkeypatch.setattr(trainer, \"_service\", lambda: service)\n    monkeypatch.setenv(\"MLB_ML_EXECUTION_LEASE_SECONDS\", str(trainer.EXECUTION_LEASE_SECONDS))\n    context = SimpleNamespace(\n        aws_request_id=\"continuity-wait-request\",\n        get_remaining_time_in_millis=lambda: 900_000,\n    )\n\n    result = trainer.lambda_handler({\"mode\": \"scheduled\"}, context)\n\n    assert result[\"ok\"] is True\n    assert result[\"status\"] == \"WAITING_FOR_CANONICAL_SLATE_CONTINUITY\"\n    assert result[\"trainingReady\"] is False\n    assert result[\"modelTrained\"] is False\n    assert result[\"championChanged\"] is False\n    assert result[\"liveInferenceAuthority\"] is False\n    assert result[\"canonicalSlateContinuity\"][\"ok\"] is False\n    assert len(service.store.released) == 1\n\n\ndef test_source_preserves_fail_closed_continuity_evidence():\n    source = Path(\"hello_world/mlb_ml_aws_training_v1.py\").read_text()\n    assert '\"status\": \"WAITING_FOR_CANONICAL_SLATE_CONTINUITY\"' in source\n    assert '\"trainingReady\": False' in source\n    assert '\"waiting\": True' in source\n    assert '\"waitReason\": \"canonical_slate_continuity\"' in source\n    assert '\"canonicalSlateContinuity\": slate_continuity' in source\n''')
          PY
          git diff --check

      - name: Validate trainer and deploy contract
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'requests>=2.31,<3' -r hello_world/requirements.txt
          python -m py_compile \
            hello_world/mlb_ml_aws_training_v1.py \
            scripts/verify_mlb_trainer_deploy_response.py \
            tests/unit/test_mlb_trainer_continuity_wait_v1.py
          PYTHONPATH=hello_world:scripts python -m pytest -q --tb=short \
            tests/unit/test_mlb_trainer_continuity_wait_v1.py \
            tests/unit/test_mlb_ml_aws_training_v1.py \
            tests/unit/test_verify_mlb_trainer_deploy_response.py

      - name: Publish canonical source fix
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm .github/workflows/install-mlb-trainer-continuity-wait-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            hello_world/mlb_ml_aws_training_v1.py \
            tests/unit/test_mlb_trainer_continuity_wait_v1.py \
            .github/workflows/diagnose-mlb-trainer-function-error.yml \
            .github/workflows/install-mlb-trainer-continuity-wait-fix-once.yml
          git commit -m 'Treat canonical continuity as a fail-closed trainer wait'
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Dispatch canonical deployment and trainer diagnostic
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -f ref=main
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/diagnose-mlb-trainer-function-error.yml/dispatches" \
            -f ref=main
