name: Trigger MLB authority-boundary repair now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-repair-mlb-authority-boundary-now.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: trigger-repair-mlb-authority-boundary-now
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch permanent MLB authority-boundary repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run repair-mlb-authority-boundary-once.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
          echo "Dispatched repair-mlb-authority-boundary-once.yml on main"
