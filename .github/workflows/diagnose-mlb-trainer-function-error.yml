name: Apply MLB Trainer Continuity Source Fix

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-trainer-function-error.yml'

permissions:
  contents: write

concurrency:
  group: apply-mlb-trainer-continuity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply source repair and restore canonical diagnostic workflow
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path

          source_path = Path('hello_world/mlb_ml_aws_training_v1.py')
          source = source_path.read_text()
          old = '''                    "ok": False,
                    "status": "CANONICAL_SLATE_CONTINUITY_BLOCKED",
                    "executionMode": "training",
'''
          new = '''                    "ok": True,
                    "status": "WAITING_FOR_CANONICAL_SLATE_CONTINUITY",
                    "executionMode": "training",
                    "trainingReady": False,
                    "waiting": True,
                    "waitReason": "canonical_slate_continuity",
'''
          assert source.count(old) == 1, 'continuity status anchor must be unique'
          source = source.replace(old, new, 1)
          assert old not in source
          assert source.count(new) == 1
          assert '"canonicalSlateContinuity": slate_continuity' in source
          assert '"modelTrained": False' in source
          assert '"championChanged": False' in source
          source_path.write_text(source)

          test_path = Path('tests/unit/test_mlb_trainer_continuity_wait_v1.py')
          test_path.write_text('''from pathlib import Path\n\n\ndef test_continuity_wait_is_fail_closed_without_lambda_failure():\n    source = Path(\"hello_world/mlb_ml_aws_training_v1.py\").read_text()\n    assert '\"ok\": True' in source\n    assert '\"status\": \"WAITING_FOR_CANONICAL_SLATE_CONTINUITY\"' in source\n    assert '\"trainingReady\": False' in source\n    assert '\"waiting\": True' in source\n    assert '\"waitReason\": \"canonical_slate_continuity\"' in source\n    assert '\"canonicalSlateContinuity\": slate_continuity' in source\n    assert '\"modelTrained\": False' in source\n    assert '\"championChanged\": False' in source\n    assert '\"status\": \"CANONICAL_SLATE_CONTINUITY_BLOCKED\"' not in source\n''')

          obsolete = Path('.github/workflows/install-mlb-trainer-continuity-wait-fix-once.yml')
          if obsolete.exists():
              obsolete.unlink()
          PY
          git show origin/main:.github/workflows/diagnose-mlb-trainer-function-error.yml \
            > .github/workflows/diagnose-mlb-trainer-function-error.yml
          python -m py_compile \
            hello_world/mlb_ml_aws_training_v1.py \
            tests/unit/test_mlb_trainer_continuity_wait_v1.py
          git diff --check

      - name: Commit repair to pull-request branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            hello_world/mlb_ml_aws_training_v1.py \
            tests/unit/test_mlb_trainer_continuity_wait_v1.py \
            .github/workflows/diagnose-mlb-trainer-function-error.yml \
            .github/workflows/install-mlb-trainer-continuity-wait-fix-once.yml
          git commit -m 'Apply fail-closed trainer continuity wait source fix'
          git push origin HEAD:"$HEAD_BRANCH"
