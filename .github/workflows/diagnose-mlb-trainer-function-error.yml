name: Install MLB R6 July 30 Cutover

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-trainer-function-error.yml'

permissions:
  contents: write

concurrency:
  group: install-mlb-r6-july30-cutover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - name: Install forward-only R6 cutover across active source
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          old_id='mlb-v2-2026-07-29-future-prospective-r5'
          new_id='mlb-v2-2026-07-30-future-prospective-r6'
          old_cutoff='2026-07-29T04:00:00+00:00'
          new_cutoff='2026-07-30T04:00:00+00:00'
          roots=(Path('template.yaml'),Path('hello_world'),Path('scripts'),Path('tests'),Path('.github/workflows'))
          changed=[]
          for root in roots:
              paths=[root] if root.is_file() else list(root.rglob('*'))
              for path in paths:
                  if not path.is_file() or path.suffix not in {'.py','.yaml','.yml'}:
                      continue
                  text=path.read_text(errors='replace')
                  if old_id not in text:
                      continue
                  updated=text.replace(old_id,new_id).replace(old_cutoff,new_cutoff)
                  path.write_text(updated)
                  changed.append(str(path))
          assert 'template.yaml' in changed, changed
          assert changed, changed
          PY
          git show origin/main:.github/workflows/diagnose-mlb-trainer-function-error.yml > .github/workflows/diagnose-mlb-trainer-function-error.yml
          git diff --check
      - name: Validate R6 cutover and unchanged safeguards
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'requests>=2.31,<3' -r hello_world/requirements.txt
          PYTHONPATH=hello_world:scripts python -m pytest -q --tb=short \
            tests/unit/test_mlb_ml_r6_clean_cutover.py \
            tests/unit/test_mlb_ml_r5_clean_cutover.py \
            tests/unit/test_mlb_ml_aws_training_v1.py \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_trainer_table_wiring.py
          sam validate --template-file template.yaml
      - name: Commit permanent R6 cutover to PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Advance MLB prospective experiment to July 30 R6'
          git push origin HEAD:"$HEAD_BRANCH"
