name: Validate Unique MLB Trainer Handler

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-unique-mlb-trainer-handler
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate unique handler and unchanged trainer safeguards
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'requests>=2.31,<3' -r hello_world/requirements.txt
          python -m py_compile \
            hello_world/mlb_ml_aws_training_v1.py \
            hello_world/mlb_ml_aws_training_v1_compat.py \
            tests/unit/test_mlb_trainer_continuity_compat_handler_v2.py
          PYTHONPATH=hello_world:scripts python -m pytest -q --tb=short \
            tests/unit/test_mlb_trainer_continuity_compat_handler_v2.py \
            tests/unit/test_mlb_ml_aws_training_v1.py \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_mlb_canonical_final_labels_v1.py
          python - <<'PY'
          from pathlib import Path
          template=Path('template.yaml').read_text()
          assert 'Handler: mlb_ml_aws_training_v1_compat.lambda_handler' in template
          assert 'Handler: mlb_ml_aws_training_v1.lambda_handler' not in template
          assert not Path('hello_world/mlb_ml_aws_training_v1').exists()
          PY
