name: Verify MLB Trainer Repair Live

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-trainer-function-error.yml'

permissions:
  contents: write

concurrency:
  group: verify-mlb-trainer-repair-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Wait for repaired deployment and verify exact live contract
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2'
          python -m py_compile scripts/verify_mlb_trainer_repair_live.py
          python scripts/verify_mlb_trainer_repair_live.py \
            --region '${{ secrets.AWS_REGION }}' \
            --deadline-seconds 1200 \
            --retry-delay-seconds 20 \
            --output runtime_reports/mlb_trainer_repair_live_verification_latest.json
      - name: Commit live verification evidence to branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime_reports/mlb_trainer_repair_live_verification_latest.json
          git commit -m 'Publish live MLB trainer repair verification'
          git push origin HEAD:"$HEAD_BRANCH"
