name: Diagnose MLB Trainer Function Error

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-trainer-function-error.yml'

permissions:
  contents: write

concurrency:
  group: diagnose-mlb-trainer-error-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Capture exact deployed trainer error
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2'
          python scripts/diagnose_mlb_trainer_runtime_error.py \
            --region '${{ secrets.AWS_REGION }}' \
            --output runtime_reports/mlb_trainer_runtime_error_latest.json
      - name: Commit redacted diagnostic to PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/diagnose-mlb-trainer-function-error.yml \
            > .github/workflows/diagnose-mlb-trainer-function-error.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Publish exact MLB trainer runtime diagnostic'
          git push origin HEAD:"$HEAD_BRANCH"
