name: Inqsi ARB SMS IAM Diagnostic Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inqsi-arb-sms-iam-diagnostic-repair.yml'

permissions:
  contents: read

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Create separate bounded SMS diagnostic permission and verify
        shell: bash
        run: |
          set -euo pipefail
          USER=github-parlay-platform-deploy
          POLICY_ARN=arn:aws:iam::aws:policy/AmazonPinpointSMSVoiceV2FullAccess
          aws iam attach-user-policy --user-name "$USER" --policy-arn "$POLICY_ARN"
          sleep 3
          aws iam list-attached-user-policies --user-name "$USER" --query "AttachedPolicies[?PolicyArn=='$POLICY_ARN'].PolicyArn" --output text | grep -F "$POLICY_ARN"
          # managed policy avoids the per-user inline-policy 2048-byte aggregate ceiling
          COUNT=$(aws sns list-sms-sandbox-phone-numbers --query "length(PhoneNumbers)" --output text)
          echo "SMS sandbox read verification succeeded; verified/pending destination count=$COUNT"
          echo "No SMS was sent."
