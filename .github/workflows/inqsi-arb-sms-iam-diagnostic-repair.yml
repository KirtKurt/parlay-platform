name: Inqsi ARB SNS IAM Authority Proof (Read Only)
on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/inqsi-arb-sms-iam-diagnostic-repair.yml'
permissions:
  contents: read
concurrency:
  group: inqsi-arb-sns-iam-authority-proof
  cancel-in-progress: false
jobs:
  prove-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Simulate existing SNS permissions without modifying AWS
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          PRINCIPAL_ARN=$(aws sts get-caller-identity --query Arn --output text)
          REGION="${{ secrets.AWS_REGION }}"
          TOPIC_ARN="arn:aws:sns:${REGION}:${ACCOUNT_ID}:inqsi-arb-prod-ArbOpportunityTopic-*"
          RESULT_FILE=$(mktemp)
          trap 'rm -f "$RESULT_FILE"' EXIT
          if ! aws iam simulate-principal-policy \
            --policy-source-arn "$PRINCIPAL_ARN" \
            --action-names sns:CreateTopic sns:GetTopicAttributes sns:SetTopicAttributes sns:DeleteTopic sns:Subscribe sns:ListSubscriptionsByTopic sns:Unsubscribe sns:Publish \
            --resource-arns "$TOPIC_ARN" \
            --output json > "$RESULT_FILE" 2>/dev/null; then
            echo 'ARB SNS authority UNPROVEN: read-only IAM simulation unavailable or denied.'
            exit 1
          fi
          python - "$RESULT_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path
          required = {
              "sns:CreateTopic", "sns:GetTopicAttributes", "sns:SetTopicAttributes",
              "sns:DeleteTopic", "sns:Subscribe", "sns:ListSubscriptionsByTopic", "sns:Unsubscribe", "sns:Publish",
          }
          try:
              rows = json.loads(Path(sys.argv[1]).read_text())["EvaluationResults"]
              assert isinstance(rows, list) and len(rows) == len(required)
              decisions = {}
              for row in rows:
                  action = row["EvalActionName"]
                  assert action in required and action not in decisions
                  decisions[action] = row["EvalDecision"]
              assert set(decisions) == required
          except (OSError, ValueError, KeyError, TypeError, AssertionError):
              print("ARB SNS authority UNPROVEN: incomplete or malformed simulation.")
              sys.exit(1)
          denied = sorted(a for a, decision in decisions.items() if decision != "allowed")
          if denied:
              print("ARB SNS authority DENIED: " + ", ".join(denied))
              sys.exit(1)
          print("ARB SNS authority SIMULATION ALLOWED: all eight actions.")
          print("No deployment, subscription change, SNS publish, or SMS occurred.")
          PY
