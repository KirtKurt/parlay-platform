name: Inqsi ARB SMS IAM Diagnostic Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inqsi-arb-sms-iam-diagnostic-repair.yml'

permissions:
  contents: read

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Create separate bounded SMS diagnostic permission and verify
        shell: bash
        run: |
          set -euo pipefail
          USER=github-parlay-platform-deploy
          POLICY=ArbSmsDeliveryDiagnosticRead
          DOC='{"Version":"2012-10-17","Statement":[{"Sid":"ReadVerifiedSmsDestinations","Effect":"Allow","Action":"sms-voice:DescribeVerifiedDestinationNumbers","Resource":"*"}]}'
          aws iam put-user-policy --user-name "$USER" --policy-name "$POLICY" --policy-document "$DOC"
          sleep 3
          SAVED=$(aws iam get-user-policy --user-name "$USER" --policy-name "$POLICY" --query PolicyDocument --output json)
          printf '%s' "$SAVED" | python -c 'import json,sys; p=json.load(sys.stdin); target="sms-voice:DescribeVerifiedDestinationNumbers"; assert any(target in ([s.get("Action")] if isinstance(s.get("Action"),str) else s.get("Action",[])) for s in p.get("Statement",[])), "permission not persisted"; print("Separate bounded IAM policy persisted")'
          COUNT=$(aws sns list-sms-sandbox-phone-numbers --query "length(PhoneNumbers)" --output text)
          echo "SMS sandbox read verification succeeded; verified/pending destination count=$COUNT"
          echo "No SMS was sent."
