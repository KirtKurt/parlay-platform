name: Inqsi ARB SMS IAM Diagnostic Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inqsi-arb-sms-iam-diagnostic-repair.yml'

permissions:
  contents: read

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Create separate bounded SMS diagnostic permission and verify
        shell: bash
        run: |
          set -euo pipefail
          USER=github-parlay-platform-deploy
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          POLICY_NAME=ArbSmsDeliveryDiagnosticRead
          POLICY_ARN="arn:aws:iam::$ACCOUNT:policy/$POLICY_NAME"
          DOC='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"sms-voice:DescribeVerifiedDestinationNumbers","Resource":"*"}]}'
          if ! aws iam get-policy --policy-arn "$POLICY_ARN" >/dev/null 2>&1; then
            aws iam create-policy --policy-name "$POLICY_NAME" --policy-document "$DOC" >/dev/null
          fi
          GROUP=ArbSmsDeliveryDiagnostics
          aws iam get-group --group-name "$GROUP" >/dev/null 2>&1 || aws iam create-group --group-name "$GROUP" >/dev/null
          aws iam attach-group-policy --group-name "$GROUP" --policy-arn "$POLICY_ARN"
          aws iam add-user-to-group --group-name "$GROUP" --user-name "$USER" 2>/dev/null || true
          sleep 3
          aws iam list-attached-group-policies --group-name "$GROUP" --query "AttachedPolicies[?PolicyArn=='$POLICY_ARN'].PolicyArn" --output text | grep -F "$POLICY_ARN"
          aws iam get-group --group-name "$GROUP" --query "Users[?UserName=='$USER'].UserName" --output text | grep -F "$USER"
          COUNT=$(aws sns list-sms-sandbox-phone-numbers --query "length(PhoneNumbers)" --output text)
          echo "SMS sandbox read verification succeeded; verified/pending destination count=$COUNT"
          echo "No SMS was sent."
