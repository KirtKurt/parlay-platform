name: Inqsi ARB Calculator Production Proof
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Inqsi Arb"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: inqsi-arb-calculator-production-proof
  cancel-in-progress: false
jobs:
  prove-calculators:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Verify calculation-only endpoints in production
        run: |
          set -euo pipefail
          API_URL=$(aws cloudformation describe-stacks --stack-name inqsi-arb-prod --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='ArbApiUrl'].OutputValue" --output text)
          test -n "$API_URL" && test "$API_URL" != "None"
          CALC_STATUS=$(aws cloudformation describe-stack-resource --stack-name inqsi-arb-prod --logical-resource-id ArbCalculatorFunction --region "${{ secrets.AWS_REGION }}" --query 'StackResourceDetail.ResourceStatus' --output text)
          test "$CALC_STATUS" = "CREATE_COMPLETE" -o "$CALC_STATUS" = "UPDATE_COMPLETE"
          python - "$API_URL" <<'PY'
          import json, sys, time, urllib.error, urllib.request
          base=sys.argv[1].rstrip('/')

          def post(path, payload, attempts=12):
              data=json.dumps(payload).encode()
              last=None
              for i in range(1, attempts+1):
                  try:
                      req=urllib.request.Request(base+path, data=data, headers={'accept':'application/json','content-type':'application/json'}, method='POST')
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.status, json.loads(r.read())
                  except urllib.error.HTTPError as exc:
                      last=f'HTTP {exc.code}: {exc.read().decode("utf-8","replace")[:1000]}'
                  except Exception as exc:
                      last=f'{type(exc).__name__}: {exc}'
                  if i < attempts:
                      print(f'waiting for {path} propagation attempt={i}/{attempts} last={last}', flush=True)
                      time.sleep(min(5*i,15))
              raise RuntimeError(f'{path} unavailable: {last}')

          status, exchange=post('/v1/arb/exchange/back-lay', {
              'back_odds':2.20,
              'back_stake':100,
              'lay_odds':2.00,
              'commission_rate':0.02,
              'lay_liquidity':200,
              'max_liability':200,
              'fixed_costs':0
          })
          assert status == 200 and exchange['ok'] is True, exchange
          assert exchange['places_bets'] is False, exchange
          assert exchange['constraints']['liquidity_known'] is True and exchange['constraints']['liquidity_ok'] is True, exchange
          assert exchange['constraints']['liability_cap_known'] is True and exchange['constraints']['liability_ok'] is True, exchange
          assert exchange['strict_candidate'] is True and exchange['minimum_profit'] > 0, exchange

          status, discrete=post('/v1/arb/stakes/verify', {
              'bankroll':100,
              'legs':[
                  {'outcome':'A','book':'draftkings','stake':51.1628,'decimal':2.15,'stake_increment':0.01,'min_stake':1,'constraint_cap':100},
                  {'outcome':'B','book':'fanduel','stake':48.8372,'decimal':2.10,'stake_increment':0.01,'min_stake':1,'constraint_cap':100}
              ]
          })
          assert status == 200 and discrete['ok'] is True, discrete
          assert discrete['places_bets'] is False, discrete
          assert discrete['feasible'] is True and discrete['strict_arbitrage_after_rounding'] is True, discrete
          assert discrete['global_optimum_claimed'] is False, discrete
          assert discrete['minimum_profit'] > 0 and discrete['allocated_stake'] <= 100, discrete

          print(json.dumps({
              'api_url':base,
              'exchange_back_lay':'pass',
              'discrete_stake_verification':'pass',
              'exchange_minimum_profit':exchange['minimum_profit'],
              'discrete_minimum_profit':discrete['minimum_profit'],
              'places_bets':False
          }, indent=2))
          PY
