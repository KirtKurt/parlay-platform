name: Deploy MLB Auto LLM

on:
  push:
    branches: [main]
    paths:
      - 'mlb_auto_llm/**'
      - 'mlb-auto-llm-template.yaml'
      - '.github/workflows/deploy-mlb-auto-llm.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-auto-llm-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-mlb-auto-llm
  LIVE_BEDROCK_MODELS: us.anthropic.claude-sonnet-4-20250514-v1:0,us.meta.llama3-3-70b-instruct-v1:0,meta.llama3-3-70b-instruct-v1:0,mistral.mistral-large-2402-v1:0,mistral.mistral-small-2402-v1:0,cohere.command-r-v1:0,cohere.command-r-plus-v1:0,openai.gpt-5.6-sol,anthropic.claude-opus-4-8,anthropic.claude-opus-4-7,anthropic.claude-opus-4-6-v1,anthropic.claude-sonnet-4-6-v1,us.amazon.nova-2-lite-v1:0,global.amazon.nova-2-lite-v1:0,us.amazon.nova-pro-v1:0,us.amazon.nova-lite-v1:0,us.amazon.nova-micro-v1:0

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Verify credentials, source, and safety contracts
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          BBS_API_KEY_VALUE: ${{ secrets.BBS_API_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}" || { echo '::error::Missing ODDS_API_KEY'; exit 1; }
          test -n "${BBS_API_KEY_VALUE:-}" || { echo '::error::Missing BBS_API_KEY'; exit 1; }
          aws sts get-caller-identity
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m py_compile \
            mlb_auto_llm/handler.py \
            mlb_auto_llm/orchestrator.py \
            mlb_auto_llm/orchestrator_v2.py \
            mlb_auto_llm/orchestrator_v3.py \
            mlb_auto_llm/pregame_odds_replay.py \
            mlb_auto_llm/ml_authority.py \
            mlb_auto_llm/ml_authority_smoke.py \
            mlb_auto_llm/model_gateway.py \
            mlb_auto_llm/bedrock_smoke.py
          PYTHONPATH=mlb_auto_llm python -m pytest -q \
            tests/unit/test_mlb_auto_model_gateway.py \
            tests/unit/test_mlb_auto_ml_authority.py \
            tests/unit/test_mlb_auto_direct_read.py \
            tests/unit/test_mlb_auto_pregame_odds_replay.py
          sam validate --template-file mlb-auto-llm-template.yaml --lint
          grep -q 'Handler: orchestrator_v3.lambda_handler' mlb-auto-llm-template.yaml
          grep -q 'Big Balls Sports Data Pro' mlb_auto_llm/handler.py
          grep -q 'The Odds API' mlb_auto_llm/handler.py
          grep -q 'MLB Stats API' mlb_auto_llm/handler.py
          grep -q 'AWS_ML_RANKED_ENSEMBLE' mlb_auto_llm/ml_authority.py
          grep -q 'MLB_AUTO_ML_READ_STACK_NAME' mlb-auto-llm-template.yaml
          grep -q 'MLB-AUTO-PREGAME-ODDS-REPLAY-v1-immutable-evidence-only' \
            mlb_auto_llm/pregame_odds_replay.py
          grep -q 'postStartOddsFabricationAllowed' mlb_auto_llm/pregame_odds_replay.py
          git diff --check

      - name: Authenticate paid providers
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          BBS_API_KEY_VALUE: ${{ secrets.BBS_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${BBS_API_KEY_VALUE}" \
            'https://api.bigballsdata.com/v1/user/me' > /tmp/bbs-account.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/bbs-account.json'))
          assert isinstance(value,dict) and value.get('data') is not None,value
          print('Big Balls Sports Data Pro authentication: OK')
          PY
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://api.the-odds-api.com/v4/sports/baseball_mlb/odds/?apiKey=${ODDS_API_KEY_VALUE}&regions=us&markets=h2h&oddsFormat=decimal&dateFormat=iso" \
            > /tmp/odds-mlb.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/odds-mlb.json'))
          assert isinstance(value,list),type(value)
          print('The Odds API authentication: OK; live events=',len(value))
          PY

      - name: Build isolated MLB Auto stack
        run: sam build --no-cached --template-file mlb-auto-llm-template.yaml

      - name: Recover unsuccessful first creation
        run: |
          set -euo pipefail
          status=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
          case "$status" in
            ROLLBACK_COMPLETE|ROLLBACK_FAILED)
              aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$AWS_REGION"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$AWS_REGION" ;;
            *_IN_PROGRESS)
              echo "::error::MLB Auto stack is busy in $status"; exit 1 ;;
            *_FAILED)
              echo "::error::MLB Auto stack requires review in $status"; exit 1 ;;
            *) echo "MLB Auto stack pre-deploy state: ${status:-STACK_MISSING}" ;;
          esac

      - name: Deploy isolated MLB Auto stack
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          BBS_API_KEY_VALUE: ${{ secrets.BBS_API_KEY }}
        run: |
          set -euo pipefail
          MLB_ML_API_BASE_URL=$(aws cloudformation describe-stacks \
            --stack-name parlay-platform-dev --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          test -n "$MLB_ML_API_BASE_URL"
          test "$MLB_ML_API_BASE_URL" != 'None'
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              OddsApiKey="${ODDS_API_KEY_VALUE}" \
              BbsApiKey="${BBS_API_KEY_VALUE}" \
              TargetDailyAccuracy='0.70' \
              CardLeadMinutesBeforeSecondGame='45' \
              BedrockModels="${LIVE_BEDROCK_MODELS}" \
              MlbMlApiBaseUrl="${MLB_ML_API_BASE_URL}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Prove deployed model authority
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBAutoLLMBedrockSmokeFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' --output text)
          aws lambda invoke \
            --function-name "$function_name" --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 300 \
            --payload '{}' /tmp/mlb-auto-model.json \
            > /tmp/mlb-auto-model-meta.json
          python - <<'PY'
          import json
          meta=json.load(open('/tmp/mlb-auto-model-meta.json'))
          response=json.load(open('/tmp/mlb-auto-model.json'))
          assert not meta.get('FunctionError'),(meta,response)
          assert response.get('ok') is True,response
          assert response.get('responseNonEmpty') is True,response
          assert response.get('decisionAuthority') in {'BEDROCK_LLM','AWS_ML_RANKED_ENSEMBLE'},response
          print('MLB model authority: OK via',response.get('decisionAuthority'),response.get('modelId'))
          print(json.dumps(response,sort_keys=True)[:16000])
          PY

      - name: Prove autonomous three-source production cycle safely
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBAutoLLMFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' --output text)
          aws lambda invoke \
            --function-name "$function_name" --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 900 \
            --payload '{"mode":"deployment_provider_smoke","force_publish":true}' \
            /tmp/mlb-auto-cycle.json > /tmp/mlb-auto-cycle-meta.json
          python - <<'PY'
          import json
          from pathlib import Path

          meta=json.load(open('/tmp/mlb-auto-cycle-meta.json'))
          response=json.load(open('/tmp/mlb-auto-cycle.json'))
          assert not meta.get('FunctionError'),(meta,response)
          assert response.get('ok') is True,response
          status=response.get('status')
          card=response.get('card') if isinstance(response.get('card'),dict) else {}
          source=(response.get('sourceStatus') if isinstance(response.get('sourceStatus'),dict)
                  else card.get('sourceStatus') if isinstance(card.get('sourceStatus'),dict)
                  else {})
          three_source=(response.get('threeSourceCoverageComplete')
                        if 'threeSourceCoverageComplete' in response
                        else card.get('threeSourceCoverageComplete'))

          for provider in ('mlbStatsApi','theOddsApi','bigBallsDataPro'):
              row=source.get(provider) or {}
              assert row.get('ok') is True,(provider,source)
              assert not (row.get('missingGamePks') or []),(provider,source)
          assert three_source is True,response

          acceptance_mode=None
          picks=[]
          if status in {'CARD_PUBLISHED','CARD_ALREADY_PUBLISHED'}:
              picks=card.get('picks') or []
              assert picks,card
              assert card.get('modelAuthorityComplete') is True,card
              authorities={row.get('decisionAuthority') for row in picks if isinstance(row,dict)}
              assert authorities <= {'BEDROCK_LLM','AWS_ML_RANKED_ENSEMBLE'},authorities
              assert len(authorities)==1,authorities
              acceptance_mode='published_model_card'
          elif status == 'COLLECTING':
              assert response.get('latePublicationPrevented') is True,response
              assert response.get('postStartPredictionCreationAllowed') is False,response
              assert response.get('postStartOddsFabricationAllowed') is False,response
              assert response.get('providerProbeUsedFutureSlate') is False,response
              assert response.get('providerProbeUsedPersistedPregameEvidence') is True,response
              assert not card,response
              acceptance_mode='late_read_only_provider_acceptance'
          elif status == 'NO_GAMES':
              acceptance_mode='official_zero_game_slate'
          else:
              raise AssertionError(response)

          validation={
              'ok':True,
              'acceptanceMode':acceptance_mode,
              'status':status,
              'threeSourceCoverageComplete':three_source,
              'sourceStatus':source,
              'pickCount':len(picks),
              'latePublicationPrevented':response.get('latePublicationPrevented'),
              'providerProbeUsedFutureSlate':response.get('providerProbeUsedFutureSlate'),
              'providerProbeUsedPersistedPregameEvidence':response.get('providerProbeUsedPersistedPregameEvidence'),
              'postStartPredictionCreationAllowed':response.get('postStartPredictionCreationAllowed'),
              'postStartOddsFabricationAllowed':response.get('postStartOddsFabricationAllowed'),
          }
          Path('/tmp/mlb-auto-cycle-validation.json').write_text(
              json.dumps(validation,indent=2,sort_keys=True)+'\n'
          )
          print('AWS autonomous MLB cycle:',status,acceptance_mode)
          print(json.dumps(response,sort_keys=True)[:30000])
          PY

      - name: Verify public status and autonomous schedules
        run: |
          set -euo pipefail
          status_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='MLBAutoLLMStatusUrl'].OutputValue" \
            --output text)
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$status_url" > /tmp/mlb-auto-status.json
          aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Events::Rule'].PhysicalResourceId" \
            --output text | tr '\t' '\n' > /tmp/mlb-auto-rules.txt
          python - <<'PY'
          import json,subprocess
          status=json.load(open('/tmp/mlb-auto-status.json'))
          assert status.get('service')=='mlb-auto-llm',status
          assert status.get('fullyAutonomous') is True,status
          assert set(status.get('threeSourcePolicy') or [])=={
              'MLB Stats API','The Odds API','Big Balls Sports Data Pro'
          },status
          assert float(status.get('targetDailyAccuracy'))==0.70,status
          assert int(status.get('cardLeadMinutesBeforeSecondGame'))==45,status
          rules=[]
          for name in open('/tmp/mlb-auto-rules.txt',encoding='utf-8').read().splitlines():
              if not name or name=='None':
                  continue
              state=subprocess.check_output([
                  'aws','events','describe-rule','--name',name,'--region','us-east-1',
                  '--query','State','--output','text'
              ],text=True).strip()
              rules.append({'name':name,'state':state})
          assert rules,rules
          assert all(row['state']=='ENABLED' for row in rules),rules
          json.dump(rules,open('/tmp/mlb-auto-rules.json','w'),indent=2,sort_keys=True)
          print('MLB Auto public contract and autonomous schedules: OK')
          PY

      - name: Publish durable production acceptance proof
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path

          def load(path,default):
              try:return json.loads(Path(path).read_text())
              except Exception:return default

          model=load('/tmp/mlb-auto-model.json',{})
          cycle=load('/tmp/mlb-auto-cycle.json',{})
          validation=load('/tmp/mlb-auto-cycle-validation.json',{})
          public_status=load('/tmp/mlb-auto-status.json',{})
          rules=load('/tmp/mlb-auto-rules.json',[])
          card=cycle.get('card') if isinstance(cycle.get('card'),dict) else {}
          picks=card.get('picks') if isinstance(card.get('picks'),list) else []
          source=validation.get('sourceStatus') if isinstance(validation.get('sourceStatus'),dict) else {}
          mode=validation.get('acceptanceMode')

          body={
              'service':'mlb-auto-llm',
              'workflow':'Deploy MLB Auto LLM',
              'jobStatus':os.environ.get('JOB_STATUS'),
              'runId':os.environ.get('RUN_ID'),
              'runAttempt':os.environ.get('RUN_ATTEMPT'),
              'sourceSha':os.environ.get('SOURCE_SHA'),
              'publishedAtUtc':datetime.now(timezone.utc).isoformat(),
              'acceptanceMode':mode,
              'modelAuthorityProof':{
                  'ok':model.get('ok'),
                  'responseNonEmpty':model.get('responseNonEmpty'),
                  'decisionAuthority':model.get('decisionAuthority'),
                  'modelId':model.get('modelId'),
                  'predictionCount':model.get('predictionCount'),
                  'bedrockAvailable':model.get('bedrockAvailable'),
                  'attemptedModelIds':model.get('attemptedModelIds') or [],
                  'errorsBeforeSuccess':model.get('errorsBeforeSuccess') or [],
                  'errors':model.get('errors') or [],
              },
              'providerCycle':{
                  'ok':validation.get('ok'),
                  'status':validation.get('status'),
                  'threeSourceCoverageComplete':validation.get('threeSourceCoverageComplete'),
                  'sourceStatus':source,
                  'pickCount':len(picks),
                  'modelAuthorityComplete':card.get('modelAuthorityComplete'),
                  'decisionAuthority':card.get('decisionAuthority'),
                  'modelDecisionCount':sum(
                      isinstance(row,dict) and row.get('decisionAuthority') in {
                          'BEDROCK_LLM','AWS_ML_RANKED_ENSEMBLE'
                      } for row in picks
                  ),
                  'gamePks':[str(row.get('gamePk')) for row in picks if isinstance(row,dict) and row.get('gamePk') is not None],
                  'latePublicationPrevented':validation.get('latePublicationPrevented'),
                  'providerProbeUsedFutureSlate':validation.get('providerProbeUsedFutureSlate'),
                  'providerProbeUsedPersistedPregameEvidence':validation.get('providerProbeUsedPersistedPregameEvidence'),
                  'postStartPredictionCreationAllowed':validation.get('postStartPredictionCreationAllowed'),
                  'postStartOddsFabricationAllowed':validation.get('postStartOddsFabricationAllowed'),
              },
              'publicStatus':{
                  'service':public_status.get('service'),
                  'fullyAutonomous':public_status.get('fullyAutonomous'),
                  'threeSourcePolicy':public_status.get('threeSourcePolicy'),
                  'targetDailyAccuracy':public_status.get('targetDailyAccuracy'),
                  'cardLeadMinutesBeforeSecondGame':public_status.get('cardLeadMinutesBeforeSecondGame'),
              },
              'autonomousRules':rules,
              'immutableCardRewriteAllowed':False,
              'postStartPredictionCreationAllowed':False,
              'postStartOddsFabricationAllowed':False,
              'secretExposed':False,
          }

          common=(
              body['jobStatus']=='success'
              and body['modelAuthorityProof']['ok'] is True
              and body['modelAuthorityProof']['responseNonEmpty'] is True
              and body['modelAuthorityProof']['decisionAuthority'] in {'BEDROCK_LLM','AWS_ML_RANKED_ENSEMBLE'}
              and body['providerCycle']['ok'] is True
              and body['providerCycle']['threeSourceCoverageComplete'] is True
              and all((source.get(provider) or {}).get('ok') is True for provider in ('mlbStatsApi','theOddsApi','bigBallsDataPro'))
              and body['publicStatus']['fullyAutonomous'] is True
              and bool(rules)
              and all(row.get('state')=='ENABLED' for row in rules)
          )
          if mode=='published_model_card':
              mode_ok=(
                  body['providerCycle']['modelAuthorityComplete'] is True
                  and body['providerCycle']['pickCount']>0
                  and body['providerCycle']['modelDecisionCount']==body['providerCycle']['pickCount']
              )
          elif mode=='late_read_only_provider_acceptance':
              mode_ok=(
                  body['providerCycle']['latePublicationPrevented'] is True
                  and body['providerCycle']['providerProbeUsedFutureSlate'] is False
                  and body['providerCycle']['providerProbeUsedPersistedPregameEvidence'] is True
                  and body['providerCycle']['postStartPredictionCreationAllowed'] is False
                  and body['providerCycle']['postStartOddsFabricationAllowed'] is False
                  and body['providerCycle']['pickCount']==0
              )
          elif mode=='official_zero_game_slate':
              mode_ok=True
          else:
              mode_ok=False
          body['ok']=bool(common and mode_ok)
          body['conclusion']='PASS' if body['ok'] else 'FAIL'
          Path('runtime_reports/mlb_auto_llm_deploy_latest.json').write_text(
              json.dumps(body,indent=2,sort_keys=True,default=str)+'\n'
          )
          print(json.dumps(body,indent=2,sort_keys=True,default=str))
          PY
          cp runtime_reports/mlb_auto_llm_deploy_latest.json /tmp/mlb-auto-llm-deploy-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-auto-deploy-proof origin/main
            cp /tmp/mlb-auto-llm-deploy-proof.json runtime_reports/mlb_auto_llm_deploy_latest.json
            git add runtime_reports/mlb_auto_llm_deploy_latest.json
            if git diff --cached --quiet; then
              break
            fi
            git commit -m 'Publish MLB Auto LLM deployment proof [skip ci]'
            if git push origin HEAD:main; then
              break
            fi
            test "$attempt" != 5
            sleep $((attempt*3))
          done
          python - <<'PY'
          import json
          report=json.load(open('/tmp/mlb-auto-llm-deploy-proof.json'))
          assert report.get('ok') is True,report
          print('MLB Auto LLM production acceptance: PASS')
          PY
