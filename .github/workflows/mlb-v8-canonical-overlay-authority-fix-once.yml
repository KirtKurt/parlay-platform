name: MLB V8 Canonical Overlay Authority Fix Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-canonical-overlay-authority-fix-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v8-canonical-overlay-authority-fix-once
  cancel-in-progress: false

env:
  PYTHONPATH: .:hello_world:scripts

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require BBD overlay in every canonical V8 evaluation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'replacement marker missing: {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          recurring = '.github/workflows/mlb-supervised-shadow-v2-recurring.yml'
          replace_once(
              recurring,
              "          MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'false'\n",
              "          MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'true'\n",
          )
          replace_once(
              recurring,
              "          assert bbd.get('status') in {'APPLIED','MANIFEST_NOT_AVAILABLE'}, bbd\n"
              "          if bbd.get('status') == 'APPLIED':\n"
              "              assert int(bbd.get('appliedGameCount') or 0) > 0, bbd\n"
              "              assert bbd.get('selectionUsedOutcomes') is False, bbd\n",
              "          assert bbd.get('status') == 'APPLIED', bbd\n"
              "          assert int(bbd.get('appliedGameCount') or 0) > 0, bbd\n"
              "          assert bbd.get('selectionUsedOutcomes') is False, bbd\n",
          )
          replace_once(
              recurring,
              "          if bbd.get('status') == 'APPLIED':\n"
              "              assert int(bbd.get('appliedGameCount') or 0) > 0, bbd\n",
              "          assert bbd.get('status') == 'APPLIED', bbd\n"
              "          assert int(bbd.get('appliedGameCount') or 0) > 0, bbd\n",
          )

          primary = '.github/workflows/mlb-supervised-shadow-v2.yml'
          primary_env = (
              "          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}\n"
              "          AWS_EC2_METADATA_DISABLED: 'true'\n"
              "          PYTHONPATH: hello_world\n"
          )
          primary_env_fixed = (
              "          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}\n"
              "          AWS_EC2_METADATA_DISABLED: 'true'\n"
              "          PYTHONPATH: hello_world\n"
              "          MLB_V8_HISTORICAL_BBS_OVERLAY_ENABLED: 'true'\n"
              "          MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'true'\n"
              "          MLB_V8_HISTORICAL_BBS_TABLE: parlay_platform_snapshots\n"
          )
          replace_once(primary, primary_env, primary_env_fixed)
          replace_once(
              primary,
              "            hello_world/mlb_supervised_daily_objective_v2_1.py \\\n"
              "            hello_world/mlb_supervised_v8_dataset_patch_v1.py \\\n",
              "            hello_world/mlb_supervised_daily_objective_v2_1.py \\\n"
              "            hello_world/mlb_supervised_selection_guard_v2_5.py \\\n"
              "            hello_world/mlb_v8_historical_bbs_overlay_v1.py \\\n"
              "            hello_world/mlb_supervised_v8_dataset_patch_v1.py \\\n",
          )
          replace_once(
              primary,
              "            tests/unit/test_mlb_supervised_daily_objective_v2_1.py \\\n"
              "            tests/unit/test_mlb_historical_v7_status_bypass.py \\\n",
              "            tests/unit/test_mlb_supervised_daily_objective_v2_1.py \\\n"
              "            tests/unit/test_mlb_supervised_selection_guard_v2_5.py \\\n"
              "            tests/unit/test_mlb_v8_historical_bbs_overlay_v1.py \\\n"
              "            tests/unit/test_mlb_historical_v7_status_bypass.py \\\n",
          )
          replace_once(
              primary,
              "          assert float((value.get('featureCoverage') or {}).get('v8Any') or 0) > 0.80, value\n"
              "          assert (value.get('metrics') or {}).get('walkForward'), value\n",
              "          assert float((value.get('featureCoverage') or {}).get('v8Any') or 0) > 0.80, value\n"
              "          bbd=value.get('historicalBbsFundamentals') or {}\n"
              "          assert bbd.get('status') == 'APPLIED', bbd\n"
              "          assert bbd.get('authority') == 'V8_HISTORICAL_BBS_SHADOW_ONLY', bbd\n"
              "          assert bbd.get('productionAuthorityChanged') is False, bbd\n"
              "          assert int(bbd.get('appliedGameCount') or 0) > 0, bbd\n"
              "          assert bbd.get('selectionUsedOutcomes') is False, bbd\n"
              "          assert (value.get('metrics') or {}).get('walkForward'), value\n",
          )

          immediate = '.github/workflows/mlb-supervised-v2-immediate-eval-once.yml'
          replace_once(immediate, primary_env, primary_env_fixed)
          replace_once(
              immediate,
              "            hello_world/mlb_supervised_daily_objective_v2_1.py \\\n"
              "            scripts/run_mlb_supervised_shadow_v2.py \\\n",
              "            hello_world/mlb_supervised_daily_objective_v2_1.py \\\n"
              "            hello_world/mlb_supervised_selection_guard_v2_5.py \\\n"
              "            hello_world/mlb_v8_historical_bbs_overlay_v1.py \\\n"
              "            scripts/run_mlb_supervised_shadow_v2.py \\\n",
          )
          replace_once(
              immediate,
              "            tests/unit/test_mlb_supervised_daily_objective_v2_1.py \\\n"
              "            tests/unit/test_publish_monotonic_json.py\n",
              "            tests/unit/test_mlb_supervised_daily_objective_v2_1.py \\\n"
              "            tests/unit/test_mlb_supervised_selection_guard_v2_5.py \\\n"
              "            tests/unit/test_mlb_v8_historical_bbs_overlay_v1.py \\\n"
              "            tests/unit/test_publish_monotonic_json.py\n",
          )
          replace_once(
              immediate,
              "          assert value.get('productionPromotionEligible') is False, value\n"
              "          assert (value.get('selectionObjective') or {}).get('productionAuthorityChanged') is False, value\n",
              "          assert value.get('productionPromotionEligible') is False, value\n"
              "          bbd=value.get('historicalBbsFundamentals') or {}\n"
              "          assert bbd.get('status') == 'APPLIED', bbd\n"
              "          assert bbd.get('authority') == 'V8_HISTORICAL_BBS_SHADOW_ONLY', bbd\n"
              "          assert bbd.get('productionAuthorityChanged') is False, bbd\n"
              "          assert int(bbd.get('appliedGameCount') or 0) > 0, bbd\n"
              "          assert bbd.get('selectionUsedOutcomes') is False, bbd\n"
              "          assert (value.get('selectionObjective') or {}).get('productionAuthorityChanged') is False, value\n",
          )
          PY

      - name: Validate workflow and V8 contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'PyYAML>=6,<7' 'pytest>=8,<9' 'boto3>=1.34,<2' 'numpy>=1.26,<3'
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in (
              '.github/workflows/mlb-supervised-shadow-v2.yml',
              '.github/workflows/mlb-supervised-shadow-v2-recurring.yml',
              '.github/workflows/mlb-supervised-v2-immediate-eval-once.yml',
          ):
              value=yaml.safe_load(Path(name).read_text())
              assert isinstance(value, dict), name
          PY
          python -m py_compile \
            hello_world/mlb_supervised_daily_objective_v2_1.py \
            hello_world/mlb_supervised_selection_guard_v2_5.py \
            hello_world/mlb_v8_historical_bbs_overlay_v1.py \
            scripts/run_mlb_supervised_shadow_v2.py \
            scripts/publish_monotonic_json.py
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_supervised_daily_objective_v2_1.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_5.py \
            tests/unit/test_mlb_v8_historical_bbs_overlay_v1.py \
            tests/unit/test_run_mlb_supervised_shadow_v2_readiness.py \
            tests/unit/test_publish_monotonic_json.py
          test "$(grep -l "MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'true'" \
            .github/workflows/mlb-supervised-shadow-v2.yml \
            .github/workflows/mlb-supervised-shadow-v2-recurring.yml \
            .github/workflows/mlb-supervised-v2-immediate-eval-once.yml | wc -l)" -eq 3
          ! grep -Fq "MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'false'" \
            .github/workflows/mlb-supervised-shadow-v2.yml \
            .github/workflows/mlb-supervised-shadow-v2-recurring.yml \
            .github/workflows/mlb-supervised-v2-immediate-eval-once.yml

      - name: Publish fix and remove installer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/mlb-supervised-shadow-v2.yml \
            .github/workflows/mlb-supervised-shadow-v2-recurring.yml \
            .github/workflows/mlb-supervised-v2-immediate-eval-once.yml
          git rm .github/workflows/mlb-v8-canonical-overlay-authority-fix-once.yml
          git diff --cached --check
          git commit -m 'Require BBD overlay for canonical V8 evaluation'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
