name: Apply MLB production chain repair v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mlb-production-chain-repair-v2.yml'
      - 'scripts/trigger_mlb_production_chain_repair_v2.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-mlb-production-chain-repair-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic source repair
        run: python scripts/repair_mlb_production_chain_20260824.py

      - name: Compile and verify focused contracts
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m py_compile \
            mlb_auto_llm/handler.py \
            mlb_auto_llm/orchestrator.py \
            mlb_auto_llm/orchestrator_v2.py \
            mlb_auto_llm/orchestrator_v3.py \
            scripts/verify_mlb_deploy_identity.py \
            scripts/repair_mlb_production_chain_20260824.py
          PYTHONPATH=mlb_auto_llm python -m pytest -q \
            tests/unit/test_mlb_auto_bbd_utc_date_resolver.py \
            tests/unit/test_mlb_auto_model_gateway.py \
            tests/unit/test_mlb_auto_ml_authority.py
          python -m pytest -q \
            tests/unit/test_mlb_deploy_identity_isolated_v3.py \
            tests/unit/test_mlb_isolated_authority_boundary.py \
            tests/unit/test_mlb_deploy_identity.py
          python scripts/verify_mlb_no_bbd_runtime.py
          git diff --check

      - name: Commit verified source repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mlb_auto_llm/handler.py \
            scripts/verify_mlb_deploy_identity.py \
            tests/unit/test_mlb_auto_bbd_utc_date_resolver.py \
            tests/unit/test_mlb_deploy_identity_isolated_v3.py \
            .github/workflows/deploy-mlb-auto-llm.yml \
            .github/workflows/deploy.yml
          if git diff --cached --quiet; then
            echo 'MLB production source repair already installed.'
            exit 0
          fi
          git commit -m 'Repair MLB BBD UTC slate coverage and v3 verifier scope'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            test "$attempt" != 5 || exit 1
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
