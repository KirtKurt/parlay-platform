name: Advance MLB AUTO R7 now

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unified-mlb-learning
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-dev
  REPORT_PATH: runtime_reports/mlb_auto_r7_advancement_latest.json

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2'
          python -m py_compile scripts/reconcile_mlb_prospective_backlog_v5.py scripts/invoke_mlb_trainer_with_retry.py
      - name: Resolve MLB functions
        id: mlb
        run: |
          set -euo pipefail
          LOCK_FN=$(aws cloudformation describe-stack-resource --stack-name "$STACK_NAME" --logical-resource-id MLBDailyPickLockFunction --region "$AWS_REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          TRAINER=$(aws cloudformation describe-stack-resource --stack-name "$STACK_NAME" --logical-resource-id MLBMLTrainingFunction --region "$AWS_REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          ORIGINAL_TIMEOUT=$(aws lambda get-function-configuration --function-name "$LOCK_FN" --region "$AWS_REGION" --query Timeout --output text)
          test -n "$LOCK_FN"; test "$LOCK_FN" != None; test -n "$TRAINER"; test "$TRAINER" != None
          echo "lock_fn=$LOCK_FN" >> "$GITHUB_OUTPUT"
          echo "trainer=$TRAINER" >> "$GITHUB_OUTPUT"
          echo "original_timeout=$ORIGINAL_TIMEOUT" >> "$GITHUB_OUTPUT"
      - name: Extend MLB lock timeout for bounded reconciliation
        run: |
          set -euo pipefail
          aws lambda update-function-configuration --function-name '${{ steps.mlb.outputs.lock_fn }}' --timeout 900 --region "$AWS_REGION" >/dev/null
          aws lambda wait function-updated-v2 --function-name '${{ steps.mlb.outputs.lock_fn }}' --region "$AWS_REGION"
      - name: Reconcile canonical prospective backlog
        run: |
          set -euo pipefail
          mkdir -p /tmp/mlb-auto-r7
          python scripts/reconcile_mlb_prospective_backlog_v5.py --stack-name "$STACK_NAME" --region "$AWS_REGION" --max-slate-days 30 --output /tmp/mlb-auto-r7/backlog.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/mlb-auto-r7/backlog.json'))
          assert d.get('ok') is True,d
          assert d.get('directTableWrite') is False,d
          assert d.get('postStartPredictionCreationAllowed') is False,d
          assert d.get('immutablePredictionRewriteAllowed') is False,d
          assert d.get('productionAuthorityChanged') is False,d
          assert d.get('promotionAuthorityChanged') is False,d
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - name: Train and require real row advancement
        run: |
          set -euo pipefail
          TRAINER='${{ steps.mlb.outputs.trainer }}'
          python scripts/invoke_mlb_trainer_with_retry.py --function-name "$TRAINER" --region "$AWS_REGION" --payload '{"sport":"mlb","mode":"scheduled","run":"mlb_auto_r7_force_advancement_20260825"}' --response /tmp/mlb-auto-r7/training.json --invocation /tmp/mlb-auto-r7/training-invocation.json --retry-execution-lease --deadline-seconds 1800 --retry-delay-seconds 20
          python scripts/invoke_mlb_trainer_with_retry.py --function-name "$TRAINER" --region "$AWS_REGION" --status-training-result /tmp/mlb-auto-r7/training.json --response /tmp/mlb-auto-r7/status.json --invocation /tmp/mlb-auto-r7/status-invocation.json
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          training=json.loads(Path('/tmp/mlb-auto-r7/training.json').read_text())
          status=json.loads(Path('/tmp/mlb-auto-r7/status.json').read_text())
          latest=((status.get('trainingHealth') or {}).get('latestRun') or training)
          accepted=int(latest.get('acceptedRowCount',training.get('acceptedRowCount')) or 0)
          partitions=latest.get('partitionCounts',training.get('partitionCounts')) or {}
          report={
            'proofType':'MLB_AUTO_R7_ADVANCEMENT',
            'createdAtUtc':datetime.now(timezone.utc).isoformat(),
            'sourceSha':os.environ.get('GITHUB_SHA'),
            'experimentId':status.get('experimentId') or training.get('experimentId'),
            'acceptedRowCount':accepted,
            'partitionCounts':partitions,
            'modelTrained':bool(latest.get('modelTrained',training.get('modelTrained'))),
            'championChanged':bool(latest.get('championChanged',training.get('championChanged'))),
            'liveInferenceAuthority':bool(latest.get('liveInferenceAuthority',training.get('liveInferenceAuthority'))),
            'canonicalSlateContinuity':latest.get('canonicalSlateContinuity') or {},
            'trainingStatus':latest.get('status') or training.get('status'),
          }
          report['advancing']=accepted>0 or sum(int(v or 0) for v in partitions.values())>0
          report['ok']=report['advancing'] and report['experimentId']=='mlb-v2-2026-08-03-future-prospective-r7'
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          assert report['ok'] is True,report
          PY
      - name: Restore original timeout
        if: always()
        run: |
          set -euo pipefail
          aws lambda update-function-configuration --function-name '${{ steps.mlb.outputs.lock_fn }}' --timeout '${{ steps.mlb.outputs.original_timeout }}' --region "$AWS_REGION" >/dev/null || true
          aws lambda wait function-updated-v2 --function-name '${{ steps.mlb.outputs.lock_fn }}' --region "$AWS_REGION" || true
      - name: Publish advancement proof
        if: always()
        run: |
          set -euo pipefail
          test -f "$REPORT_PATH" || exit 0
          cp "$REPORT_PATH" /tmp/mlb-auto-r7-advancement-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-auto-r7-advancement-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-auto-r7-advancement-proof.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && break
            git commit -m 'Publish MLB AUTO R7 advancement proof [skip ci]'
            git push origin HEAD:main && break
            sleep $((attempt*3))
          done
