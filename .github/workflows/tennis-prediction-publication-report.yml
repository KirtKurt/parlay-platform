name: Tennis Prediction Publication Report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennis-prediction-publication-report.yml'
  schedule:
    # Run shortly after each direct or autonomous Tennis prediction cycle.
    - cron: '3,13,18,28,33,43,48,58 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: tennis-prediction-publication-report
  cancel-in-progress: false

