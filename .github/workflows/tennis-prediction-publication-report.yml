jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Decode and verify reporting helpers
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          for name in ('DISCOVER', 'DELIVER'):
              payload = gzip.decompress(base64.b64decode(os.environ[f'{name}_B64']))
              actual = hashlib.sha256(payload).hexdigest()
              expected = os.environ[f'{name}_SHA256']
              if actual != expected:
                  raise SystemExit(f'{name} helper checksum mismatch')
              Path(f'/tmp/{name.lower()}.py').write_bytes(payload)
          PY
          python -m py_compile /tmp/discover.py /tmp/deliver.py

      - name: Discover and freeze new official predictions
        id: discover
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python /tmp/discover.py

      - name: Check whether this report was already posted
        if: steps.discover.outputs.count != '0'
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.discover.outputs.fingerprint }}
        run: |
          set -euo pipefail
          marker="<!-- tennis-prediction-report:${FINGERPRINT} -->"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${REPORT_ISSUE}/comments?per_page=100" \
            --jq '.[].body' > /tmp/tennis-report-comments.txt
          if grep -Fq "$marker" /tmp/tennis-report-comments.txt; then
            echo 'already_posted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already_posted=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish immediate prediction report
        if: steps.discover.outputs.count != '0' && steps.dedupe.outputs.already_posted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "$REPORT_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file report.md

      - name: Mark reported predictions delivered
        if: steps.discover.outputs.count != '0' && success()
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          FINGERPRINT: ${{ steps.discover.outputs.fingerprint }}
        run: |
          set -euo pipefail
          python /tmp/deliver.py

      - name: Publish workflow summary
        if: always()
        run: |
          {
            echo '## Tennis prediction publication reporter'
            echo
            echo "- New official picks pending in this run: ${{ steps.discover.outputs.count || '0' }}"
            echo "- Existing picks initialized without duplicate alerting: ${{ steps.discover.outputs.bootstrapped || '0' }}"
            echo '- Delivery channel: GitHub issue #515'
            echo '- Delivery cadence: roughly two minutes after each scheduled prediction cycle'
            echo '- WATCH/PASS: excluded'
          } >> "$GITHUB_STEP_SUMMARY"
