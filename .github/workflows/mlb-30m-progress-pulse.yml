name: MLB 30-minute production progress pulse

on:
  schedule:
    # GitHub documents elevated delay/drop risk at the start of the hour.
    # Keep the 30-minute cadence while moving away from :00/:30 contention.
    - cron: '11,41 * * * *'
  # Event-driven fallbacks and the direct schedule share the same pre-deadline
  # staleness gate. This prevents a fallback pulse from being followed by a
  # near-immediate scheduled duplicate. Manual workflow_dispatch defaults to a
  # forced diagnostic pulse; watchdog dispatches opt into one final fresh check.
  workflow_run:
    workflows:
      - MLB Canonical Runtime Health Watch
      - MLB Scoring Guard
      - Deploy SAM to AWS
      - Verify MLB Scoring Fix After Deploy
      - MLB Production Source Contract
      - Unified MLB learning recovery once
      # Independent main-branch completions that remained admissible while
      # the pulse/watchdog cron slots were selectively absent.
      - MLB Daily Yesterday Audit
      - Tennis Autonomy Status Backstop
      - Publish Tennis Autonomy Status
      - NFL Auto AWS Stack Probe
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Force a pulse even when the latest visible pulse is fresh
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-30m-progress-pulse.yml'
      - 'scripts/report_mlb_30m_progress.py'
      - 'scripts/check_mlb_progress_pulse_staleness.py'
      - 'tests/unit/test_report_mlb_30m_progress.py'
      - 'tests/unit/test_mlb_progress_pulse_watchdog.py'
      - 'runtime_reports/mlb_*.json'

permissions:
  actions: read
  contents: read
  issues: write

# Serialize the issue writer. Filtering workflow_run to main above prevents
# irrelevant PR completions from displacing a valid pending pulse.
concurrency:
  group: mlb-30m-production-progress-pulse
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  MLB_ROOT_STACK: parlay-platform-dev
  MLB_AUTO_STACK: parlay-platform-mlb-auto-llm
  MLB_PROGRESS_ISSUE_NUMBER: '567'
  MLB_PROGRESS_TARGET_CADENCE_MINUTES: '30'
  MLB_PROGRESS_CADENCE_GRACE_MINUTES: '5'
  # A strict >28m gate plus a punctual five-minute watchdog observes staleness
  # by 33m; the observed sub-minute reporter leaves margin inside 35m.
  MLB_PROGRESS_STALE_AFTER_MINUTES: '28'
  MLB_R7_EXPERIMENT_ID: mlb-v2-2026-08-03-future-prospective-r7

jobs:
  pulse_decision:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_pulse: ${{ steps.decision.outputs.dispatch_required }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decide whether this event should emit a pulse
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_DISPATCH_FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/check_mlb_progress_pulse_staleness.py
          ! grep -Ei 'boto3|aws[[:space:]]+(dynamodb|lambda)|put_item|update_item|delete_item' scripts/check_mlb_progress_pulse_staleness.py
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WORKFLOW_DISPATCH_FORCE" = "true" ]; then
            echo 'stale=false' >> "$GITHUB_OUTPUT"
            echo 'dispatch_required=true' >> "$GITHUB_OUTPUT"
            echo 'reason=EXPLICIT_WORKFLOW_DISPATCH' >> "$GITHUB_OUTPUT"
            echo 'visible_pulse_age_minutes=n/a' >> "$GITHUB_OUTPUT"
          else
            python scripts/check_mlb_progress_pulse_staleness.py \
              --stale-after-minutes "$MLB_PROGRESS_STALE_AFTER_MINUTES" \
              --retry-cooldown-minutes 10 \
              --current-run-id "$GITHUB_RUN_ID" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Record pulse decision
        env:
          STALE: ${{ steps.decision.outputs.stale }}
          RUN_PULSE: ${{ steps.decision.outputs.dispatch_required }}
          REASON: ${{ steps.decision.outputs.reason }}
          VISIBLE_AGE: ${{ steps.decision.outputs.visible_pulse_age_minutes }}
        run: |
          {
            echo '## MLB progress pulse decision'
            echo
            echo "- Visible pulse stale: ${STALE}"
            echo "- Reporter job required: ${RUN_PULSE}"
            echo "- Decision: ${REASON}"
            echo "- Previous visible pulse age: ${VISIBLE_AGE} minutes"
          } >> "$GITHUB_STEP_SUMMARY"

  read-only-progress-pulse:
    needs: pulse_decision
    if: needs.pulse_decision.outputs.run_pulse == 'true'
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure read/proof AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate pulse cannot invoke mutation modes
        run: |
          set -euo pipefail
          python -m py_compile scripts/report_mlb_30m_progress.py
          grep -q '"mode": "status"' scripts/report_mlb_30m_progress.py
          ! grep -Eq '"mode": "(scheduled|selection_capture|manual_review)"' scripts/report_mlb_30m_progress.py
          ! grep -Ei 'aws[^[:alnum:]]+dynamodb' scripts/report_mlb_30m_progress.py
          ! grep -Eq 'put_item|update_item|delete_item|promote_candidate|manual_review\(' scripts/report_mlb_30m_progress.py
          grep -q 'UNSAFE_RETIRED_V15_10_AUTHORITY_LEAK' scripts/report_mlb_30m_progress.py

      - name: Collect AWS runtime evidence and post numeric issue pulse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/report_mlb_30m_progress.py
