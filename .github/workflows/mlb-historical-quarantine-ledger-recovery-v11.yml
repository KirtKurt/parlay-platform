name: MLB Historical Quarantine Ledger Recovery V11

"on":
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_historical_quarantine_contract_v2.py'
      - 'hello_world/mlb_historical_optimizer_entrypoint.py'
      - 'tests/unit/test_mlb_historical_quarantine_contract_v2.py'
      - '.github/workflows/mlb-historical-quarantine-ledger-recovery-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-historical-quarantine-ledger-recovery-v11
  cancel-in-progress: false

env:
  HIST_STACK: parlay-platform-mlb-historical-optimizer

jobs:
  deploy-test-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy exact quarantine-ledger contract and capture proof
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set +e
          RESULT=SUCCESS
          FAILED_STAGE=''
          EXIT_CODE=0
          HIST_FN=''
          : > /tmp/mlb-v11.log

          fail_stage() {
            if [ "$RESULT" = SUCCESS ]; then
              RESULT=FAILED
              FAILED_STAGE="$1"
              EXIT_CODE="$2"
            fi
          }

          echo '=== source validation ===' | tee -a /tmp/mlb-v11.log
          python -m py_compile \
            hello_world/mlb_historical_quarantine_contract_v2.py \
            hello_world/mlb_historical_optimizer_entrypoint.py \
            hello_world/mlb_historical_optimizer_handler.py \
            hello_world/mlb_historical_daily_optimizer_v1.py \
            >>/tmp/mlb-v11.log 2>&1
          rc=$?
          [ $rc -eq 0 ] || fail_stage source_compile "$rc"
          grep -Fq 'MLB-HISTORICAL-QUARANTINE-CONTRACT-v2' \
            hello_world/mlb_historical_quarantine_contract_v2.py
          rc=$?
          [ $rc -eq 0 ] || fail_stage source_contract_missing "$rc"
          grep -Fq 'quarantine_contract.install()' \
            hello_world/mlb_historical_optimizer_entrypoint.py
          rc=$?
          [ $rc -eq 0 ] || fail_stage entrypoint_install_missing "$rc"

          if [ "$RESULT" = SUCCESS ]; then
            echo '=== focused tests ===' | tee -a /tmp/mlb-v11.log
            python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' \
              >>/tmp/mlb-v11.log 2>&1
            PYTHONPATH=hello_world python -m pytest -q \
              tests/unit/test_mlb_historical_quarantine_contract_v2.py \
              tests/unit/test_mlb_historical_optimizer_handler.py \
              tests/unit/test_mlb_historical_daily_optimizer_v1.py \
              >>/tmp/mlb-v11.log 2>&1
            rc=$?
            [ $rc -eq 0 ] || fail_stage focused_tests "$rc"
          fi

          if [ "$RESULT" = SUCCESS ]; then
            echo '=== resolve isolated Lambda ===' | tee -a /tmp/mlb-v11.log
            HIST_FN=$(aws cloudformation describe-stacks \
              --stack-name "$HIST_STACK" \
              --region "$AWS_REGION_VALUE" \
              --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" \
              --output text 2>>/tmp/mlb-v11.log)
            rc=$?
            if [ $rc -ne 0 ] || [ -z "$HIST_FN" ] || [ "$HIST_FN" = None ]; then
              fail_stage resolve_historical_lambda "${rc:-1}"
            fi
          fi

          if [ "$RESULT" = SUCCESS ]; then
            PROD_FNS=$(aws cloudformation describe-stack-resources \
              --stack-name parlay-platform-dev \
              --region "$AWS_REGION_VALUE" \
              --query "StackResources[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" \
              --output text 2>>/tmp/mlb-v11.log)
            rc=$?
            [ $rc -eq 0 ] || fail_stage resolve_production_lambdas "$rc"
            for fn in $PROD_FNS; do
              if [ "$fn" = "$HIST_FN" ]; then
                echo "Historical Lambda collides with production Lambda: $fn" >>/tmp/mlb-v11.log
                fail_stage isolation_collision 1
              fi
            done
          fi

          if [ "$RESULT" = SUCCESS ]; then
            echo '=== capture baseline ===' | tee -a /tmp/mlb-v11.log
            aws lambda invoke \
              --function-name "$HIST_FN" \
              --region "$AWS_REGION_VALUE" \
              --cli-read-timeout 900 \
              --cli-binary-format raw-in-base64-out \
              --payload '{"mode":"status","run":"quarantine_v11_baseline"}' \
              /tmp/baseline.json >/tmp/baseline-meta.json 2>>/tmp/mlb-v11.log
            rc=$?
            [ $rc -eq 0 ] || fail_stage baseline_status "$rc"
          fi

          if [ "$RESULT" = SUCCESS ]; then
            echo '=== direct historical Lambda update ===' | tee -a /tmp/mlb-v11.log
            rm -f /tmp/mlb-historical-v11.zip
            (
              cd hello_world &&
              zip -qr /tmp/mlb-historical-v11.zip . -x '__pycache__/*' '*.pyc'
            ) >>/tmp/mlb-v11.log 2>&1
            rc=$?
            [ $rc -eq 0 ] || fail_stage package_lambda "$rc"
          fi

          if [ "$RESULT" = SUCCESS ]; then
            aws lambda update-function-code \
              --function-name "$HIST_FN" \
              --region "$AWS_REGION_VALUE" \
              --zip-file fileb:///tmp/mlb-historical-v11.zip \
              --publish \
              >/tmp/update-v11.json 2>>/tmp/mlb-v11.log
            rc=$?
            [ $rc -eq 0 ] || fail_stage update_function_code "$rc"
          fi

          if [ "$RESULT" = SUCCESS ]; then
            aws lambda wait function-updated-v2 \
              --function-name "$HIST_FN" \
              --region "$AWS_REGION_VALUE" \
              >>/tmp/mlb-v11.log 2>&1
            rc=$?
            [ $rc -eq 0 ] || fail_stage wait_function_updated "$rc"
          fi

          if [ "$RESULT" = SUCCESS ]; then
            echo '=== verify deployed package ===' | tee -a /tmp/mlb-v11.log
            URL=$(aws lambda get-function \
              --function-name "$HIST_FN" \
              --region "$AWS_REGION_VALUE" \
              --query 'Code.Location' \
              --output text 2>>/tmp/mlb-v11.log)
            rc=$?
            [ $rc -eq 0 ] || fail_stage resolve_deployed_package "$rc"
            curl -fsSL "$URL" -o /tmp/deployed-v11.zip 2>>/tmp/mlb-v11.log
            rc=$?
            [ $rc -eq 0 ] || fail_stage download_deployed_package "$rc"
            unzip -p /tmp/deployed-v11.zip mlb_historical_quarantine_contract_v2.py \
              >/tmp/deployed-contract-v11.py 2>>/tmp/mlb-v11.log
            rc=$?
            [ $rc -eq 0 ] || fail_stage deployed_contract_missing "$rc"
            grep -Fq 'MLB-HISTORICAL-QUARANTINE-CONTRACT-v2' \
              /tmp/deployed-contract-v11.py
            rc=$?
            [ $rc -eq 0 ] || fail_stage deployed_contract_identity "$rc"
            unzip -p /tmp/deployed-v11.zip mlb_historical_optimizer_entrypoint.py \
              >/tmp/deployed-entrypoint-v11.py 2>>/tmp/mlb-v11.log
            grep -Fq 'quarantine_contract.install()' \
              /tmp/deployed-entrypoint-v11.py
            rc=$?
            [ $rc -eq 0 ] || fail_stage deployed_entrypoint_identity "$rc"
          fi

          if [ "$RESULT" = SUCCESS ]; then
            echo '=== invoke until cursor advances ===' | tee -a /tmp/mlb-v11.log
            for i in $(seq 1 10); do
              aws lambda invoke \
                --function-name "$HIST_FN" \
                --region "$AWS_REGION_VALUE" \
                --cli-read-timeout 900 \
                --cli-binary-format raw-in-base64-out \
                --payload "{\"mode\":\"orchestrate\",\"run\":\"quarantine_v11_${i}\"}" \
                "/tmp/run-v11-${i}.json" >/tmp/meta-v11-${i}.json 2>>/tmp/mlb-v11.log
              rc=$?
              if [ $rc -ne 0 ]; then
                fail_stage invoke_optimizer "$rc"
                break
              fi
              aws lambda invoke \
                --function-name "$HIST_FN" \
                --region "$AWS_REGION_VALUE" \
                --cli-read-timeout 900 \
                --cli-binary-format raw-in-base64-out \
                --payload "{\"mode\":\"status\",\"run\":\"quarantine_v11_status_${i}\"}" \
                /tmp/status-v11.json >/tmp/status-v11-meta.json 2>>/tmp/mlb-v11.log
              rc=$?
              if [ $rc -ne 0 ]; then
                fail_stage status_after_invoke "$rc"
                break
              fi
              python - <<'PY' >>/tmp/mlb-v11.log 2>&1
          import json
          value=json.load(open('/tmp/status-v11.json'))
          state=value.get('state') or {}
          print(json.dumps({
              'version': value.get('version'),
              'phase': state.get('phase'),
              'currentDate': state.get('currentDate'),
              'currentSlotIndex': state.get('currentSlotIndex'),
              'networkRequestCount': state.get('networkRequestCount'),
              'eligibleGameCount': state.get('eligibleGameCount'),
              'completeSlateCount': state.get('completeSlateCount'),
              'lastError': state.get('lastError'),
          }, sort_keys=True))
          PY
              moved=$(python - <<'PY'
          import json
          baseline=json.load(open('/tmp/baseline.json')).get('state') or {}
          current=json.load(open('/tmp/status-v11.json')).get('state') or {}
          before=(str(baseline.get('currentDate')), int(baseline.get('currentSlotIndex') or 0), int(baseline.get('networkRequestCount') or 0), int(baseline.get('eligibleGameCount') or 0))
          after=(str(current.get('currentDate')), int(current.get('currentSlotIndex') or 0), int(current.get('networkRequestCount') or 0), int(current.get('eligibleGameCount') or 0))
          print('yes' if after != before else 'no')
          PY
          )
              [ "$moved" = yes ] && break
              sleep 5
            done
          fi

          if [ -n "$HIST_FN" ]; then
            aws lambda invoke \
              --function-name "$HIST_FN" \
              --region "$AWS_REGION_VALUE" \
              --cli-read-timeout 900 \
              --cli-binary-format raw-in-base64-out \
              --payload '{"mode":"status","run":"quarantine_v11_final"}' \
              /tmp/final-status.json >/tmp/final-status-meta.json 2>>/tmp/mlb-v11.log
            rc=$?
            [ $rc -eq 0 ] || fail_stage final_status "$rc"
          fi

          export RESULT FAILED_STAGE EXIT_CODE HIST_FN
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          def load(path):
              try:
                  return json.load(open(path))
              except Exception:
                  return {}

          baseline_value=load('/tmp/baseline.json')
          final_value=load('/tmp/final-status.json')
          baseline=baseline_value.get('state') or {}
          final=final_value.get('state') or {}
          result=os.environ.get('RESULT','FAILED')
          failed_stage=os.environ.get('FAILED_STAGE','')
          exit_code=int(os.environ.get('EXIT_CODE') or 0)
          version=str(final_value.get('version') or '')
          error=str(final.get('lastError') or '')
          before=(str(baseline.get('currentDate')), int(baseline.get('currentSlotIndex') or 0), int(baseline.get('networkRequestCount') or 0), int(baseline.get('eligibleGameCount') or 0), int(baseline.get('completeSlateCount') or 0))
          after=(str(final.get('currentDate')), int(final.get('currentSlotIndex') or 0), int(final.get('networkRequestCount') or 0), int(final.get('eligibleGameCount') or 0), int(final.get('completeSlateCount') or 0))
          advancing=after != before
          contract_ok='v1.9-quarantine-ledger-complete' in version
          blocker_cleared='historical request ledger is incomplete' not in error and 'too stale for a 15-minute grid' not in error
          cursor_recovered=(str(final.get('currentDate')), int(final.get('currentSlotIndex') or 0)) != ('2025-04-14',72)
          if result == 'SUCCESS' and not (contract_ok and blocker_cleared and advancing and cursor_recovered):
              result='FAILED'
              failed_stage='live_recovery_assertion'
              exit_code=1
          try:
              log_tail=open('/tmp/mlb-v11.log',errors='replace').read()[-12000:]
          except Exception:
              log_tail=''
          proof={
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'result': result,
              'failedStage': failed_stage or None,
              'exitCode': exit_code,
              'sourceSha': os.environ.get('GITHUB_SHA'),
              'historicalFunctionName': os.environ.get('HIST_FN') or None,
              'version': final_value.get('version'),
              'baseline': {
                  'phase': baseline.get('phase'),
                  'currentDate': baseline.get('currentDate'),
                  'currentSlotIndex': baseline.get('currentSlotIndex'),
                  'networkRequestCount': baseline.get('networkRequestCount'),
                  'eligibleGameCount': baseline.get('eligibleGameCount'),
                  'completeSlateCount': baseline.get('completeSlateCount'),
                  'lastError': baseline.get('lastError'),
              },
              'final': {
                  'phase': final.get('phase'),
                  'currentDate': final.get('currentDate'),
                  'currentSlotIndex': final.get('currentSlotIndex'),
                  'networkRequestCount': final.get('networkRequestCount'),
                  'eligibleGameCount': final.get('eligibleGameCount'),
                  'completeSlateCount': final.get('completeSlateCount'),
                  'optimizationRound': final.get('optimizationRound'),
                  'lastError': final.get('lastError'),
                  'quarantinedHistoricalSlotCount': final.get('quarantinedHistoricalSlotCount'),
                  'lastRejectedSlateError': final.get('lastRejectedSlateError'),
              },
              'contractInstalled': contract_ok,
              'priorBlockersCleared': blocker_cleared,
              'ingestionAdvancing': advancing,
              'cursorRecovered': cursor_recovered,
              'logTail': log_tail,
          }
          os.makedirs('docs/runtime',exist_ok=True)
          json.dump(proof,open('docs/runtime/mlb-historical-quarantine-ledger-v11-proof.json','w'),indent=2)
          print(json.dumps(proof,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-historical-quarantine-ledger-v11-proof
          path: |
            docs/runtime/mlb-historical-quarantine-ledger-v11-proof.json
            /tmp/mlb-v11.log
          retention-days: 30

      - name: Publish proof to main
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            git add docs/runtime/mlb-historical-quarantine-ledger-v11-proof.json
            git commit -m 'chore: publish MLB historical quarantine ledger v11 proof' || true
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1

      - name: Require successful live recovery
        run: |
          python - <<'PY'
          import json
          proof=json.load(open('docs/runtime/mlb-historical-quarantine-ledger-v11-proof.json'))
          assert proof.get('result') == 'SUCCESS', proof
          PY
