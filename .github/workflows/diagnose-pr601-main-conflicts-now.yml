name: Diagnose PR601 main conflicts now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pr601-main-conflicts-now.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0
      - name: Reproduce merge conflicts read-only
        shell: bash
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          echo '=== UNMERGED ==='
          git status --short
          echo '=== CONFLICT DIFF ==='
          git diff --cc -- hello_world/mlb_daily_pick_lock_protected.py tests/unit/test_mlb_daily_pick_lock_runtime.py
          echo '=== CONFLICT MARKERS: protected ==='
          grep -n -B 25 -A 45 '^<<<<<<<\|^=======\|^>>>>>>>' hello_world/mlb_daily_pick_lock_protected.py || true
          echo '=== CONFLICT MARKERS: runtime test ==='
          grep -n -B 25 -A 45 '^<<<<<<<\|^=======\|^>>>>>>>' tests/unit/test_mlb_daily_pick_lock_runtime.py || true
          git merge --abort || true
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/conflict-cleanup origin/main
          cd /tmp/conflict-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-pr601-main-conflicts-now.yml
          git commit -m 'Remove PR601 merge diagnostic [skip ci]'
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((n*2))
          done
          exit 1
