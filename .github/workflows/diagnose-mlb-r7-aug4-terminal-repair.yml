name: Diagnose MLB R7 August 4 terminal transition

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-mlb-r7-aug4-terminal-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-mlb-r7-aug4-terminal-transition
  cancel-in-progress: false

jobs:
  repair-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Invoke protected August 4 terminal transition and print safe evidence
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id MLBDailyPickLockFunction \
            --region us-east-1 \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$function_name"
          test "$function_name" != None

          completed=false
          for attempt in 1 2 3 4; do
            rm -f /tmp/aug4-terminal-response.json /tmp/aug4-terminal-meta.json
            set +e
            aws lambda invoke \
              --function-name "$function_name" \
              --region us-east-1 \
              --invocation-type RequestResponse \
              --cli-binary-format raw-in-base64-out \
              --cli-connect-timeout 60 \
              --cli-read-timeout 900 \
              --payload '{"sport":"mlb","run":"prospective_terminal_backlog_reconciliation_v5","slateDateEt":"2026-08-04","force":true}' \
              /tmp/aug4-terminal-response.json \
              >/tmp/aug4-terminal-meta.json 2>/tmp/aug4-terminal-cli-error.txt
            invoke_status=$?
            set -e

            ATTEMPT="$attempt" INVOKE_STATUS="$invoke_status" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          sensitive = re.compile(r"(?i)(api[_-]?key|token|secret|authorization|password|credential)(\s*[:=]\s*)([^\s,;\]}]+)")
          bearer = re.compile(r"(?i)\bbearer\s+[A-Za-z0-9._~+/=-]+")
          access_key = re.compile(r"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b")

          def safe_text(value, limit=360):
              text = str(value or "")
              text = sensitive.sub(lambda m: f"{m.group(1)}{m.group(2)}[REDACTED]", text)
              text = bearer.sub("Bearer [REDACTED]", text)
              text = access_key.sub("[REDACTED_AWS_ACCESS_KEY]", text)
              return text[:limit]

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return {}

          def object_body(value):
              if not isinstance(value, dict):
                  return {}
              body = value.get("body")
              if isinstance(body, str):
                  try:
                      parsed = json.loads(body)
                      return parsed if isinstance(parsed, dict) else {}
                  except Exception:
                      return {}
              if isinstance(body, dict):
                  return body
              return value

          raw = load("/tmp/aug4-terminal-response.json")
          meta = load("/tmp/aug4-terminal-meta.json")
          payload = object_body(raw)
          report = payload.get("missedLockTerminalReconciliation")
          report = report if isinstance(report, dict) else {}
          progress = report.get("progressAfter")
          progress = progress if isinstance(progress, dict) else {}
          current_progress = payload.get("perGameLockProgress")
          current_progress = current_progress if isinstance(current_progress, dict) else {}
          concurrency = payload.get("lockExecutionConcurrency")
          concurrency = concurrency if isinstance(concurrency, dict) else {}

          scalar_fields = (
              "ok", "reason", "error", "slateDateEt", "missedGameCount",
              "noPredictionDataCount", "lockedPredictionCount",
              "lockedStatusCount", "lockStatusComplete",
              "canonicalPredictionComplete", "failClosed",
              "durableNoPredictionTerminalReconciled",
              "durableNoPredictionTerminalReconciledCount",
              "postStartPredictionCreationAllowed",
          )
          safe = {
              "attempt": int(os.environ["ATTEMPT"]),
              "invokeExitCode": int(os.environ["INVOKE_STATUS"]),
              "lambdaStatusCode": meta.get("StatusCode"),
              "lambdaFunctionError": safe_text(meta.get("FunctionError")),
          }
          for key in scalar_fields:
              if key in payload:
                  value = payload.get(key)
                  safe[key] = safe_text(value) if isinstance(value, str) else value

          safe["lockExecutionConcurrency"] = {
              key: concurrency.get(key)
              for key in (
                  "acquired", "overlapSkipped", "leaseSeconds", "leaseOwner"
              )
              if key in concurrency and key != "leaseOwner"
          }
          safe["terminalReport"] = {
              key: safe_text(report.get(key)) if isinstance(report.get(key), str) else report.get(key)
              for key in (
                  "ok", "version", "reason", "error", "slateDateEt",
                  "manifestGameCount", "missedBeforeCount", "reconciledCount",
                  "remainingMissedCount", "postStartPredictionCreationAllowed",
                  "candidateIntegrityFailuresRelabeled",
              )
              if key in report
          }
          for label, source in (
              ("progressAfter", progress),
              ("currentProgress", current_progress),
          ):
              safe[label] = {
                  key: source.get(key)
                  for key in (
                      "manifestGameCount", "gameCount", "canonicalCount",
                      "lockOutcomeCount", "noPredictionDataCount", "missedCount",
                      "dueMissingCount", "lockedCount", "complete"
                  )
                  if key in source
              }

          unresolved = report.get("unresolved")
          if isinstance(unresolved, list):
              safe["unresolved"] = []
              for row in unresolved[:20]:
                  if not isinstance(row, dict):
                      continue
                  safe["unresolved"].append({
                      key: (
                          [safe_text(item, 180) for item in value[:20]]
                          if isinstance(value := row.get(key), list)
                          else safe_text(value)
                          if isinstance(value, str)
                          else value
                      )
                      for key in (
                          "gameIdentity", "reason", "candidatePresent",
                          "candidateProofPresent", "candidateErrors"
                      )
                      if key in row
                  })

          safe["overlap"] = bool(
              payload.get("reason") == "SKIPPED_OVERLAPPING_LOCK_EXECUTION"
              or payload.get("error") == "MLB_LOCK_EXECUTION_ALREADY_RUNNING"
              or concurrency.get("overlapSkipped") is True
          )
          Path("/tmp/aug4-terminal-safe.json").write_text(
              json.dumps(safe, indent=2, sort_keys=True, default=str) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(safe, indent=2, sort_keys=True, default=str))
          PY

            if python - <<'PY'
          import json
          row=json.load(open('/tmp/aug4-terminal-safe.json'))
          raise SystemExit(0 if row.get('overlap') else 1)
          PY
            then
              sleep $((attempt * 30))
              continue
            fi
            completed=true
            break
          done
          test "$completed" = true

      - name: Read exact-date durability after protected transition
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id MLBDailyPickLockFunction \
            --region us-east-1 \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          aws lambda invoke \
            --function-name "$function_name" \
            --region us-east-1 \
            --cli-binary-format raw-in-base64-out \
            --cli-connect-timeout 60 \
            --cli-read-timeout 300 \
            --payload '{"httpMethod":"GET","path":"/v1/mlb/locks/status","queryStringParameters":{"date":"2026-08-04"}}' \
            /tmp/aug4-status-after.json \
            >/tmp/aug4-status-after-meta.json
          python - <<'PY'
          import json
          envelope=json.load(open('/tmp/aug4-status-after.json'))
          body=envelope.get('body')
          payload=json.loads(body) if isinstance(body,str) else dict(body or envelope)
          fields=(
              'ok','sport','slateDateEt','gameCount','lockedPredictionCount',
              'lockedStatusCount','noPredictionDataCount','missedGameCount',
              'missedLockCount','lockStatusComplete','canonicalPredictionComplete',
              'operationalDefect','reason','error'
          )
          report={key:payload.get(key) for key in fields if key in payload}
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          assert report.get('slateDateEt')=='2026-08-04', report
          PY
