name: R7 post-618 recovery dispatch once

"on":
  push:
    branches:
      - ops/r7-post618-recovery-dispatch-20260829

permissions:
  actions: write
  contents: read

concurrency:
  group: r7-post618-recovery-dispatch-once
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch canonical R7 queue control on main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mlb-r7-overnight-advance.yml',
              ref: 'main',
              inputs: { force: 'true' },
            });
            core.notice('Dispatched canonical MLB R7 queue control on main with force=true');
