name: Tennis Throttle Repair Verification 2026-08-03 1948

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennis-throttle-repair-verify-20260803-1948.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennis-throttle-repair-verify-20260803-1948
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - name: Run isolated tennis tests
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile \
            tennis_learning/handler.py \
            tennis_learning/live_pipeline.py \
            tennis_learning/autonomous_controller.py \
            tennis_learning/backfill.py \
            tennis_learning/bootstrap_handler.py
          python -m pytest -q \
            tests/test_tennis_learning_handler.py \
            tests/test_tennis_autonomy_contract.py \
            tests/test_tennis_backfill_contract.py
          sam validate --template-file tennis-template.yaml
          git diff --check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Wait for deployment and verify fresh runtime evidence
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-tennis-learning
          region="$AWS_REGION_VALUE"
          work=/tmp/tennis-throttle-repair-verify
          mkdir -p "$work" runtime

          deployed=false
          for attempt in $(seq 1 80); do
            stack_status=$(aws cloudformation describe-stacks \
              --stack-name "$stack" --region "$region" \
              --query 'Stacks[0].StackStatus' --output text)
            case "$stack_status" in
              *FAILED*|*ROLLBACK*|DELETE_COMPLETE)
                echo "Tennis stack entered failure state: $stack_status" >&2
                exit 1
                ;;
            esac

            controller=$(aws cloudformation list-stack-resources \
              --stack-name "$stack" --region "$region" \
              --query "StackResourceSummaries[?LogicalResourceId=='TennisAutonomousControllerFunction'].PhysicalResourceId | [0]" \
              --output text)
            collect_rule=$(aws cloudformation list-stack-resources \
              --stack-name "$stack" --region "$region" \
              --query "StackResourceSummaries[?ResourceType=='AWS::Events::Rule' && contains(LogicalResourceId, 'CollectEvery15Minutes')].PhysicalResourceId | [0]" \
              --output text)
            settle_rule=$(aws cloudformation list-stack-resources \
              --stack-name "$stack" --region "$region" \
              --query "StackResourceSummaries[?ResourceType=='AWS::Events::Rule' && contains(LogicalResourceId, 'SettleEvery30Minutes')].PhysicalResourceId | [0]" \
              --output text)
            autonomy_rule=$(aws cloudformation list-stack-resources \
              --stack-name "$stack" --region "$region" \
              --query "StackResourceSummaries[?ResourceType=='AWS::Events::Rule' && contains(LogicalResourceId, 'AutonomousCycleEvery15Minutes')].PhysicalResourceId | [0]" \
              --output text)
            backfill_rule=$(aws cloudformation list-stack-resources \
              --stack-name "$stack" --region "$region" \
              --query "StackResourceSummaries[?ResourceType=='AWS::Events::Rule' && contains(LogicalResourceId, 'BackfillEveryHour')].PhysicalResourceId | [0]" \
              --output text)

            if [ "$controller" != None ] && [ -n "$controller" ] \
              && [ "$collect_rule" != None ] && [ -n "$collect_rule" ] \
              && [ "$settle_rule" != None ] && [ -n "$settle_rule" ] \
              && [ "$autonomy_rule" != None ] && [ -n "$autonomy_rule" ] \
              && [ "$backfill_rule" != None ] && [ -n "$backfill_rule" ]; then
              aws lambda get-function-configuration \
                --function-name "$controller" --region "$region" \
                --query '{Environment:Environment.Variables,LastModified:LastModified,CodeSha256:CodeSha256}' \
                --output json > "$work/controller.json"
              aws events describe-rule --name "$collect_rule" --region "$region" --output json > "$work/collect-rule.json"
              aws events describe-rule --name "$settle_rule" --region "$region" --output json > "$work/settle-rule.json"
              aws events describe-rule --name "$autonomy_rule" --region "$region" --output json > "$work/autonomy-rule.json"
              aws events describe-rule --name "$backfill_rule" --region "$region" --output json > "$work/backfill-rule.json"

              if STACK_STATUS="$stack_status" WORK="$work" python - <<'PY'
          import json
          import os
          from pathlib import Path

          work = Path(os.environ['WORK'])
          controller = json.loads((work / 'controller.json').read_text())
          env = controller.get('Environment') or {}
          collect = json.loads((work / 'collect-rule.json').read_text())
          settle = json.loads((work / 'settle-rule.json').read_text())
          autonomy = json.loads((work / 'autonomy-rule.json').read_text())
          backfill = json.loads((work / 'backfill-rule.json').read_text())
          assert os.environ['STACK_STATUS'] == 'UPDATE_COMPLETE'
          assert env.get('TENNIS_INVOKE_MAX_ATTEMPTS') == '4'
          assert env.get('TENNIS_INVOKE_BASE_DELAY_SECONDS') == '2'
          assert env.get('TENNIS_INVOKE_MAX_DELAY_SECONDS') == '20'
          assert collect.get('ScheduleExpression') == 'cron(1,16,31,46 * * * ? *)'
          assert settle.get('ScheduleExpression') == 'cron(6,36 * * * ? *)'
          assert autonomy.get('ScheduleExpression') == 'cron(11,26,41,56 * * * ? *)'
          assert collect.get('State') == 'ENABLED'
          assert settle.get('State') == 'ENABLED'
          assert autonomy.get('State') == 'ENABLED'
          assert backfill.get('State') == 'DISABLED'
          PY
              then
                deployed=true
                break
              fi
            fi
            sleep 15
          done
          test "$deployed" = true || { echo 'Deployed tennis throttle repair was not observed' >&2; exit 1; }

          status_endpoint=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$region" \
            --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" \
            --output text)
          run_endpoint=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$region" \
            --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyRunApi'].OutputValue" \
            --output text)
          test -n "$status_endpoint"; test "$status_endpoint" != None
          test -n "$run_endpoint"; test "$run_endpoint" != None

          curl -fsS --retry 4 --retry-all-errors --retry-delay 5 --max-time 60 \
            "$status_endpoint" -o "$work/status-before.json"
          cycle_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -fsS --retry 3 --retry-all-errors --retry-delay 15 -X POST --max-time 900 \
            "$run_endpoint" -o "$work/run-response.json"
          sleep 5
          curl -fsS --retry 4 --retry-all-errors --retry-delay 5 --max-time 60 \
            "$status_endpoint" -o "$work/status-after.json"

          STACK_STATUS="$stack_status" \
          SOURCE_SHA="$GITHUB_SHA" \
          CYCLE_STARTED="$cycle_started" \
          WORK="$work" \
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          work = Path(os.environ['WORK'])

          def load(name):
              value = json.loads((work / name).read_text())
              if isinstance(value, dict) and isinstance(value.get('body'), str):
                  try:
                      value = json.loads(value['body'])
                  except json.JSONDecodeError:
                      pass
              return value if isinstance(value, dict) else {'value': value}

          before = load('status-before.json')
          run = load('run-response.json')
          after = load('status-after.json')
          controller = load('controller.json')
          collect_rule = load('collect-rule.json')
          settle_rule = load('settle-rule.json')
          autonomy_rule = load('autonomy-rule.json')
          backfill_rule = load('backfill-rule.json')

          actions = run.get('actions') if isinstance(run.get('actions'), dict) else {}
          collect = actions.get('collect') if isinstance(actions.get('collect'), dict) else {}
          settle = actions.get('settle') if isinstance(actions.get('settle'), dict) else {}
          collect_errors = collect.get('errors') if isinstance(collect.get('errors'), dict) else {}
          settle_errors = settle.get('errors') if isinstance(settle.get('errors'), dict) else {}

          training_before = int(before.get('training_samples') or 0)
          training = int(after.get('training_samples') or run.get('training_samples') or 0)
          audits_before = int(before.get('live_audit_count') or 0)
          audits = int(after.get('live_audit_count') or run.get('live_audit_count') or 0)
          accuracy = float(after['live_accuracy']) if after.get('live_accuracy') is not None else None
          brier = float(after['live_brier']) if after.get('live_brier') is not None else None
          failures = int(after.get('consecutive_failures') or 0)
          authority = str(after.get('authority') or 'UNKNOWN')
          automatic = bool(after.get('automatic_prediction_allowed', False))

          now = datetime.now(timezone.utc)
          last_cycle_raw = after.get('last_cycle_at')
          last_cycle = datetime.fromisoformat(str(last_cycle_raw).replace('Z', '+00:00')).astimezone(timezone.utc)
          started = datetime.fromisoformat(os.environ['CYCLE_STARTED'].replace('Z', '+00:00')).astimezone(timezone.utc)
          cycle_age_minutes = round(max(0.0, (now - last_cycle).total_seconds() / 60.0), 2)

          gates = {
              'training_samples_100': training >= 100,
              'live_audits_30': audits >= 30,
              'live_accuracy_55pct': accuracy is not None and accuracy >= 0.55,
              'brier_at_most_0_25': brier is not None and brier <= 0.25,
              'circuit_breaker_clear': failures < 3 and authority != 'DEGRADED',
          }
          all_gates = all(gates.values())
          authority_consistent = (
              (authority == 'SHADOW' and automatic is False)
              or (authority == 'AUTHORITATIVE' and automatic is True and all_gates)
          )

          assert last_cycle >= started, (last_cycle, started)
          assert training >= training_before, (training_before, training)
          assert audits >= audits_before, (audits_before, audits)
          assert not collect.get('error'), collect
          assert not settle.get('error'), settle
          assert not collect_errors, collect_errors
          assert not settle_errors, settle_errors
          assert failures == 0, after
          assert after.get('last_error') in (None, ''), after
          assert after.get('last_warning') in (None, ''), after
          assert authority != 'DEGRADED', after
          assert authority_consistent, after
          assert after.get('historical_backfill_enabled') is False, after
          assert automatic is False or all_gates, after

          status = {
              'checked_at': now.isoformat(),
              'source_commit': os.environ['SOURCE_SHA'],
              'service': after.get('service'),
              'stack_status': os.environ['STACK_STATUS'],
              'status_endpoint_available': True,
              'query_succeeded': True,
              'query_error': None,
              'authority': authority,
              'authority_consistent': authority_consistent,
              'reason': after.get('reason'),
              'automatic_prediction_allowed': automatic,
              'training_samples': training,
              'live_audit_count': audits,
              'live_accuracy': accuracy,
              'live_brier': brier,
              'consecutive_failures': failures,
              'last_cycle_at': last_cycle_raw,
              'cycle_age_minutes': cycle_age_minutes,
              'cycle_fresh': cycle_age_minutes <= 25.0,
              'last_error': after.get('last_error'),
              'last_warning': after.get('last_warning'),
              'historical_backfill_enabled': after.get('historical_backfill_enabled'),
              'historical_backfill_required': after.get('historical_backfill_required'),
              'model_version': after.get('model_version'),
              'promotion_gates': gates,
              'all_promotion_gates_pass': all_gates,
              'operationally_healthy': True,
              'repair_attempted': True,
              'repair_succeeded': True,
              'repair_error': None,
              'repair': {
                  'lambda_invoke_retry': 'adaptive_bounded_exponential_jitter',
                  'invoke_max_attempts': 4,
                  'direct_collect_schedule': collect_rule.get('ScheduleExpression'),
                  'direct_settle_schedule': settle_rule.get('ScheduleExpression'),
                  'autonomy_schedule': autonomy_rule.get('ScheduleExpression'),
                  'historical_backfill_state': backfill_rule.get('State'),
                  'controller_last_modified': controller.get('LastModified'),
                  'controller_code_sha256': controller.get('CodeSha256'),
              },
              'latest_cycle_collection': collect,
              'latest_cycle_settlement': settle,
          }
          diagnostic = {
              'checked_at': now.isoformat(),
              'source_commit': os.environ['SOURCE_SHA'],
              'status_before': before,
              'cycle_response': run,
              'status_after': after,
              'controller_configuration': controller,
              'eventbridge': {
                  'collect': collect_rule,
                  'settle': settle_rule,
                  'autonomy': autonomy_rule,
                  'backfill': backfill_rule,
              },
              'training_samples_before': training_before,
              'training_samples_after': training,
              'live_audits_before': audits_before,
              'live_audits_after': audits,
              'tests': [
                  'python_compile_tennis_modules',
                  'test_tennis_learning_handler',
                  'test_tennis_autonomy_contract',
                  'test_tennis_backfill_contract',
                  'sam_validate_tennis_template',
                  'fresh_live_autonomy_cycle',
              ],
              'operationally_healthy': True,
          }
          Path('runtime/tennis_autonomy_status.json').write_text(
              json.dumps(status, indent=2, sort_keys=True, default=str) + '\n'
          )
          Path('runtime/tennis_autonomy_diagnostic.json').write_text(
              json.dumps(diagnostic, indent=2, sort_keys=True, default=str) + '\n'
          )
          print(json.dumps(status, indent=2, sort_keys=True, default=str))
          PY

          cp runtime/tennis_autonomy_status.json /tmp/tennis-autonomy-status-1948.json
          cp runtime/tennis_autonomy_diagnostic.json /tmp/tennis-autonomy-diagnostic-1948.json

      - name: Publish evidence and self-remove
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 30); do
            git fetch origin main
            git checkout -B tennis-throttle-repair-verify-publish origin/main
            mkdir -p runtime
            cp /tmp/tennis-autonomy-status-1948.json runtime/tennis_autonomy_status.json
            cp /tmp/tennis-autonomy-diagnostic-1948.json runtime/tennis_autonomy_diagnostic.json
            rm -f .github/workflows/tennis-throttle-repair-verify-20260803-1948.yml
            git add \
              runtime/tennis_autonomy_status.json \
              runtime/tennis_autonomy_diagnostic.json \
              .github/workflows/tennis-throttle-repair-verify-20260803-1948.yml
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Publish verified tennis throttle repair evidence [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Unable to publish tennis throttle repair evidence' >&2
          exit 1
