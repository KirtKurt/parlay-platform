name: Deploy Tennis Learning

on:
  push:
    branches: [main]
    paths:
      - 'tennis_learning/**'
      - 'tennis-template.yaml'
      - 'tests/test_tennis_learning_handler.py'
      - '.github/workflows/deploy-tennis-learning.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-learning-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - name: Validate code and contracts
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}" || { echo '::error::Missing ODDS_API_KEY'; exit 1; }
          python -m py_compile tennis_learning/handler.py tennis_learning/backfill.py tennis_learning/bootstrap_handler.py tennis_learning/live_pipeline.py
          python -m pip install --quiet pytest boto3
          python -m pytest -q tests/test_tennis_learning_handler.py
          sam validate --template-file tennis-template.yaml
      - name: Build and deploy isolated tennis stack
        run: |
          set -euo pipefail
          sam build --no-cached --template-file tennis-template.yaml
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name parlay-platform-tennis-learning \
            --region "${{ secrets.AWS_REGION }}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides OddsApiKey="${{ secrets.ODDS_API_KEY }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
      - name: Verify live health and start training
        run: |
          set -euo pipefail
          base=$(aws cloudformation describe-stacks --stack-name parlay-platform-tennis-learning --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='TennisLearningApi'].OutputValue" --output text)
          collect=$(aws cloudformation describe-stacks --stack-name parlay-platform-tennis-learning --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='TennisCollectApi'].OutputValue" --output text)
          backfill=$(aws cloudformation describe-stacks --stack-name parlay-platform-tennis-learning --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='TennisBackfillApi'].OutputValue" --output text)
          test -n "$base" && test -n "$collect" && test -n "$backfill"
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 "$base" | tee /tmp/tennis-health.json
          curl --fail --retry 3 --retry-all-errors --retry-delay 5 -X POST "$collect" | tee /tmp/tennis-collect.json
          curl --fail --retry 2 --retry-all-errors --retry-delay 10 -X POST --max-time 900 "$backfill" | tee /tmp/tennis-backfill.json
          python - <<'PY'
          import json
          health=json.load(open('/tmp/tennis-health.json'))
          collect=json.load(open('/tmp/tennis-collect.json'))
          backfill=json.load(open('/tmp/tennis-backfill.json'))
          assert health['service']=='tennis-learning'
          assert health['persistence']=='dynamodb'
          print({'health': health, 'collect': collect, 'backfill': backfill})
          PY
