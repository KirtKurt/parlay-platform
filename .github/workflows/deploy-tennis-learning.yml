name: Deploy Tennis Learning

# Verification trigger: 2026-08-25 all-match/all-region repair
on:
  push:
    branches: [main]
    paths:
      - 'tennis_learning/**'
      - 'tennis-template.yaml'
      - 'tests/test_tennis_learning_handler.py'
      - 'tests/test_tennis_autonomy_contract.py'
      - 'tests/test_tennis_backfill_contract.py'
      - 'tests/test_tennis_full_region_contract.py'
      - '.github/workflows/deploy-tennis-learning.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-learning-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - name: Validate code and autonomous contracts
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}" || { echo '::error::Missing ODDS_API_KEY'; exit 1; }
          python -m py_compile tennis_learning/handler.py tennis_learning/backfill.py tennis_learning/bootstrap_handler.py tennis_learning/live_pipeline.py tennis_learning/autonomous_controller.py
          python -m pip install --quiet pytest boto3
          python -m pytest -q \
            tests/test_tennis_learning_handler.py \
            tests/test_tennis_autonomy_contract.py \
            tests/test_tennis_backfill_contract.py \
            tests/test_tennis_full_region_contract.py
          sam validate --template-file tennis-template.yaml
          git diff --check
      - name: Build and deploy isolated tennis stack
        run: |
          set -euo pipefail
          sam build --no-cached --template-file tennis-template.yaml
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name parlay-platform-tennis-learning \
            --region "${{ secrets.AWS_REGION }}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides OddsApiKey="${{ secrets.ODDS_API_KEY }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
      - name: Verify deployed source, all-region collection, and autonomy
        run: |
          set -euo pipefail
          stack=parlay-platform-tennis-learning
          region="${{ secrets.AWS_REGION }}"

          health=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='TennisLearningApi'].OutputValue" --output text)
          autonomy_status=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" --output text)
          live_fn=$(aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id TennisLivePipelineFunction --region "$region" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          controller_fn=$(aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id TennisAutonomousControllerFunction --region "$region" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          test -n "$health" && test -n "$autonomy_status" && test -n "$live_fn" && test -n "$controller_fn"

          aws lambda get-function-configuration --function-name "$live_fn" --region "$region" > /tmp/tennis-live-config.json
          python - <<'PY'
          import json
          cfg=json.load(open('/tmp/tennis-live-config.json'))
          env=cfg.get('Environment',{}).get('Variables',{})
          assert env.get('TENNIS_ODDS_REGIONS') == 'us,us2,uk,eu,au,fr,se,us_ex', env
          assert env.get('TENNIS_PREDICTION_CUTOFF_MINUTES') == '10', env
          assert int(cfg.get('Timeout',0)) == 900, cfg
          print({'live_function': cfg.get('FunctionName'), 'regions': env.get('TENNIS_ODDS_REGIONS'), 'timeout': cfg.get('Timeout')})
          PY

          aws lambda invoke \
            --function-name "$live_fn" \
            --region "$region" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"collect"}' \
            --cli-read-timeout 930 \
            /tmp/tennis-full-coverage-invoke.json \
            > /tmp/tennis-full-coverage-invoke-meta.json
          python - <<'PY'
          import json
          meta=json.load(open('/tmp/tennis-full-coverage-invoke-meta.json'))
          payload=json.load(open('/tmp/tennis-full-coverage-invoke.json'))
          assert not meta.get('FunctionError'), {'meta':meta,'payload':payload}
          assert payload.get('statusCode') == 200, payload
          body=json.loads(payload['body'])
          assert body['coverage_contract'] == 'ALL_ACTIVE_NON_OUTRIGHT_MATCHES_ALL_H2H_BOOKMAKER_REGIONS', body
          assert body['h2h_regions'] == ['us','us2','uk','eu','au','fr','se','us_ex'], body
          assert body['sport_keys_truncated'] == 0, body
          assert body['coverage_complete'] is True, body
          assert body['inventory_events'] == body['resolved_events'], body
          assert body['regional_requests'] == body['regional_successes'], body
          assert body['prediction_cutoff_minutes'] == 10, body
          print(body)
          PY

          # Invoke the controller directly so a full-slate cycle is not constrained
          # by API Gateway's request-duration ceiling.
          aws lambda invoke \
            --function-name "$controller_fn" \
            --region "$region" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"autonomous_cycle"}' \
            --cli-read-timeout 930 \
            /tmp/tennis-autonomy-run.json \
            > /tmp/tennis-autonomy-run-meta.json
          python - <<'PY'
          import json
          meta=json.load(open('/tmp/tennis-autonomy-run-meta.json'))
          payload=json.load(open('/tmp/tennis-autonomy-run.json'))
          assert not meta.get('FunctionError'), {'meta':meta,'payload':payload}
          assert payload.get('statusCode') == 200, payload
          PY

          curl --fail --retry 5 --retry-all-errors --retry-delay 5 "$health" | tee /tmp/tennis-health.json
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 "$autonomy_status" | tee /tmp/tennis-autonomy-status.json
          python - <<'PY'
          import json
          health=json.load(open('/tmp/tennis-health.json'))
          status=json.load(open('/tmp/tennis-autonomy-status.json'))
          assert health['service']=='tennis-learning'
          assert health['persistence']=='dynamodb'
          assert status['service']=='tennis-autonomy'
          assert status['authority'] in {'SHADOW','AUTHORITATIVE','DEGRADED'}
          assert status.get('automatic_prediction_allowed', False) == (status['authority']=='AUTHORITATIVE')
          assert int(status.get('training_samples', 0)) > 0, status
          assert int(status.get('consecutive_failures', 0)) == 0, status
          print({'health': health, 'autonomy': status})
          PY
