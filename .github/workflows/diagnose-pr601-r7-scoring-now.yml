name: Diagnose PR601 R7 scoring now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pr601-r7-scoring-now.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect scoring filter
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9"
          python - <<'PY'
          import copy
          import importlib.util
          import inspect
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('r7_fixture', Path('tests/unit/test_mlb_daily_per_game_lock.py'))
          t = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(t)
          print('SCORING_SOURCE_BEGIN')
          print(inspect.getsource(t.patch._scoring_pulls))
          print('SCORING_SOURCE_END')
          names = t.patch._scoring_pulls.__code__.co_names
          for name in names:
              value = getattr(t.patch, name, None)
              if callable(value) and getattr(value, '__module__', None) == t.patch.__name__:
                  try:
                      print(f'HELPER_{name}_BEGIN')
                      print(inspect.getsource(value))
                      print(f'HELPER_{name}_END')
                  except Exception:
                      pass
          target = t.game('mlb_statsapi:991556', '2026-07-13T18:00:00+00:00')
          target.update({'official_game_pk':'991556','official_commence_time':target['commence_time'],'official_status':{'abstractGameState':'Preview'}})
          source = t.pull('2026-07-13T17:00:00+00:00',[target],'real-quarantine')
          module = t.build_module([source], '2026-07-13T20:00:00+00:00', seed=False)
          pulls = module._pulls_for_date(t.SLATE)
          manifest = module._latest_games_for_date(t.SLATE,pulls)
          game = manifest[0]
          print('PULL_AT', t.patch._pull_at(module,pulls[0]))
          print('LOCK_AT', t.patch._lock_at(module,game))
          print('START', t.patch._start(module,game))
          for name in names:
              value = getattr(t.patch, name, None)
              if callable(value) and name.startswith('_'):
                  try:
                      if name in {'_pull_at','_lock_at','_start'}: continue
                  except Exception: pass
          print('SCORING_RESULT', t.patch._scoring_pulls(module,pulls,game))
          PY
      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/r7-scoring-cleanup origin/main
          cd /tmp/r7-scoring-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-pr601-r7-scoring-now.yml
          git commit -m 'Remove completed PR601 R7 scoring diagnostic [skip ci]'
          git push origin HEAD:main
