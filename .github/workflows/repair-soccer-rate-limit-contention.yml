name: Repair Soccer Rate Limit Contention Source
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/repair-soccer-rate-limit-contention.yml']
permissions:
  contents: write
  actions: write
jobs:
  repair-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Patch worker contention handling and concurrency
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          p=Path('soccer_auto/collector.py')
          s=p.read_text()
          if '    OddsApiRateLimitError,\n' not in s:
              needle='    OddsApiError,\n'
              assert needle in s, 'OddsApiError import not found'
              s=s.replace(needle, needle+'    OddsApiRateLimitError,\n', 1)

          if 'except OddsApiRateLimitError as exc:' not in s:
              marker='            except (ProviderBudgetDeferred, CoverageExecutionDeferred) as exc:\n'
              assert marker in s, 'worker deferral marker not found'
              block='''            except OddsApiRateLimitError as exc:\n                # Distributed lease contention is expected backpressure, not a\n                # poison-message failure. Acknowledge this delivery only after\n                # a delayed replacement is durably queued so SQS redrive is\n                # reserved for genuine defects and T-10 work remains actionable.\n                receive_count = max(\n                    1,\n                    int((record.get("attributes") or {}).get("ApproximateReceiveCount") or 1),\n                )\n                retry_count = max(\n                    receive_count,\n                    int(job.get("rate_limit_retry_count") or 0) + 1,\n                )\n                delay_seconds = min(30, max(2, 2 * retry_count))\n                if job.get("action") == "FETCH_OUTRIGHTS":\n                    processed.append(\n                        {\n                            "deferred": True,\n                            "reason": str(exc),\n                            "retry_via_scheduler": True,\n                            "receive_count": receive_count,\n                        }\n                    )\n                    continue\n                try:\n                    store.enqueue(\n                        {\n                            **job,\n                            "rate_limit_retry_count": retry_count,\n                            "rate_limit_deferred_at": _observed_at(),\n                        },\n                        delay_seconds=delay_seconds,\n                    )\n                except Exception:\n                    failures.append({"itemIdentifier": record.get("messageId")})\n                    processed.append(\n                        {\n                            "deferred": True,\n                            "reason": str(exc),\n                            "retry_reenqueued": False,\n                            "receive_count": receive_count,\n                        }\n                    )\n                    continue\n                processed.append(\n                    {\n                        "deferred": True,\n                        "reason": str(exc),\n                        "retry_reenqueued": True,\n                        "retry_visible_in_seconds": delay_seconds,\n                        "receive_count": receive_count,\n                        "rate_limit_retry_count": retry_count,\n                    }\n                )\n'''
              s=s.replace(marker, block+marker, 1)
          p.write_text(s)

          t=Path('soccer-auto-template.yaml')
          y=t.read_text()
          y=y.replace("SOCCER_AUTO_ODDS_RATE_LIMIT_MAX_WAIT_SECONDS: '8'", "SOCCER_AUTO_ODDS_RATE_LIMIT_MAX_WAIT_SECONDS: '60'")
          y=y.replace("SOCCER_AUTO_ODDS_RATE_LIMIT_MAX_CONTENTION_ATTEMPTS: '128'", "SOCCER_AUTO_ODDS_RATE_LIMIT_MAX_CONTENTION_ATTEMPTS: '2048'")
          y=y.replace('ScalingConfig: {MaximumConcurrency: 6}', 'ScalingConfig: {MaximumConcurrency: 3}')
          t.write_text(y)

          test=Path('tests/soccer_auto/test_rate_limit_contention_retry.py')
          test.write_text('''import json\n\nfrom soccer_auto import collector\nfrom soccer_auto.odds_api import OddsApiRateLimitError\n\n\ndef test_worker_requeues_distributed_rate_limit_contention(monkeypatch):\n    class Store:\n        def __init__(self): self.enqueued=[]\n        def enqueue(self, job, delay_seconds=0): self.enqueued.append((job, delay_seconds))\n    store=Store()\n    monkeypatch.setattr(collector, "SoccerStore", lambda: store)\n    monkeypatch.setattr(collector, "_client", lambda: object())\n    monkeypatch.setattr(collector, "process_job", lambda *a, **k: (_ for _ in ()).throw(OddsApiRateLimitError("DISTRIBUTED_RATE_LIMIT_CONTENTION")))\n    job={"version":collector.JOB_VERSION,"action":"FETCH_EVENT","event":{"event_key":"EVENT#x","commence_time":"2099-01-01T00:00:00Z"}}\n    result=collector.worker_handler({"Records":[{"body":json.dumps(job),"messageId":"m1","attributes":{"ApproximateReceiveCount":"1"}}]},None)\n    assert result["batchItemFailures"] == []\n    assert result["processed"][0]["retry_reenqueued"] is True\n    assert result["processed"][0]["reason"] == "DISTRIBUTED_RATE_LIMIT_CONTENTION"\n    assert len(store.enqueued) == 1\n    assert store.enqueued[0][1] >= 2\n''')
          PY
          python -m py_compile soccer_auto/*.py
          python - <<'PY'
          from pathlib import Path
          c=Path('soccer_auto/collector.py').read_text()
          y=Path('soccer-auto-template.yaml').read_text()
          assert 'except OddsApiRateLimitError as exc:' in c
          assert "SOCCER_AUTO_ODDS_RATE_LIMIT_MAX_WAIT_SECONDS: '60'" in y
          assert "SOCCER_AUTO_ODDS_RATE_LIMIT_MAX_CONTENTION_ATTEMPTS: '2048'" in y
          assert 'ScalingConfig: {MaximumConcurrency: 3}' in y
          print('soccer_contention_static_contract_ok')
          PY
      - name: Commit source repair
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add soccer_auto/collector.py soccer-auto-template.yaml tests/soccer_auto/test_rate_limit_contention_retry.py
          git commit -m 'Fix Soccer distributed rate-limit contention handling'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*2))
          done
          exit 1
      - name: Dispatch isolated Soccer deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-soccer-auto.yml --repo "$GITHUB_REPOSITORY" --ref main -f shared_quota_reserve_percent=0
