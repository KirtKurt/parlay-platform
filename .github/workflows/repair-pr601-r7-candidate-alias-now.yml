name: Repair PR601 R7 candidate alias now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pr601-r7-candidate-alias-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr601-r7-candidate-alias-now
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify expected PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "760c76327aa6a59c0b7c087b9a4c8509506c8beb"

      - name: Add official-game-PK candidate snapshot alias
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('hello_world/mlb_daily_per_game_lock_patch.py')
          text = path.read_text(encoding='utf-8')

          marker = '''def _candidate_items(
          '''
          helper = '''def _candidate_snapshot_aliases(
              game: Dict[str, Any],
              scoring: Optional[Iterable[Dict[str, Any]]] = None,
          ) -> set[str]:
              \"\"\"Return snapshot identities strongly tied to one official MLB game.

              A provider event ID can appear after a valid pre-lock snapshot was
              already persisted under the stable Stats API fallback identity.  The
              official game PK is immutable schedule authority, so deriving that one
              fallback key broadens read discovery without creating or rewriting any
              prediction authority.  Every discovered snapshot still has to pass the
              existing exact official-PK, ordered-team, timestamp, source-pull,
              persistence, price, and fingerprint validators before use.
              \"\"\"
              aliases = {_raw_game_identity(game)}
              official_pk = _official_game_pk(game)
              if official_pk:
                  aliases.add(f\"mlb_statsapi:{official_pk}\")
              for pull in scoring or []:
                  for candidate in pull.get(\"games\") or []:
                      if not _same_game(game, candidate):
                          continue
                      aliases.add(_raw_game_identity(candidate))
                      candidate_official_pk = _official_game_pk(candidate)
                      if candidate_official_pk:
                          aliases.add(f\"mlb_statsapi:{candidate_official_pk}\")
              return {alias for alias in aliases if alias}


          def _candidate_items(
          '''
          if helper not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'unexpected _candidate_items marker count: {text.count(marker)}')
              text = text.replace(marker, helper, 1)

          old_items = '''    aliases = {_raw_game_identity(game)}
              for pull in scoring or []:
                  for candidate in pull.get("games") or []:
                      if _same_game(game, candidate):
                          aliases.add(_raw_game_identity(candidate))
              bounded_aliases = sorted(alias for alias in aliases if alias)
          '''
          new_items = '''    bounded_aliases = sorted(
                  _candidate_snapshot_aliases(game, scoring)
              )
          '''
          if new_items not in text:
              if text.count(old_items) != 1:
                  raise SystemExit(f'unexpected _candidate_items alias block count: {text.count(old_items)}')
              text = text.replace(old_items, new_items, 1)

          old_last = '''    candidate_aliases = {_raw_game_identity(game)}
              for pull in scoring:
                  for candidate_game in pull.get("games") or []:
                      if _same_game(game, candidate_game):
                          candidate_aliases.add(_raw_game_identity(candidate_game))
          '''
          new_last = '''    candidate_aliases = _candidate_snapshot_aliases(
                  game,
                  scoring,
              )
          '''
          if new_last not in text:
              if text.count(old_last) != 1:
                  raise SystemExit(f'unexpected _last_prelock_candidate alias block count: {text.count(old_last)}')
              text = text.replace(old_last, new_last, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python -m py_compile hello_world/mlb_daily_per_game_lock_patch.py

      - name: Run focused quarantine candidate tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9"
          python -m pytest -q \
            tests/unit/test_mlb_daily_per_game_lock.py::test_real_quarantine_writer_is_idempotent_and_recovery_strict

      - name: Commit repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hello_world/mlb_daily_per_game_lock_patch.py
          git diff --cached --check
          git commit -m 'Fix R7 official-game candidate snapshot lookup'
          git push origin HEAD:codex/mlb-valid-prelock-quarantine-v4-567

      - name: Remove one-shot repair workflow from main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/r7-repair-cleanup origin/main
          cd /tmp/r7-repair-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-pr601-r7-candidate-alias-now.yml
          git commit -m 'Remove completed PR601 R7 repair runner [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
