name: Verify and Deploy MLB Three-API Autonomy v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-mlb-three-api-autonomy-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parlay-platform-deploy
  cancel-in-progress: false

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
      ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
      INQSI_ADMIN_API_TOKEN_VALUE: ${{ secrets.INQSI_ADMIN_API_TOKEN }}
      BBD_KEY_1: ${{ secrets.BIG_BALLS_DATA_API_KEY }}
      BBD_KEY_2: ${{ secrets.BBD_API_KEY }}
      BBD_KEY_3: ${{ secrets.BIGBALLS_DATA_API_KEY }}
      BBD_KEY_4: ${{ secrets.BIG_BALLS_API_KEY }}
      BBD_KEY_5: ${{ secrets.BIGBALLS_API_KEY }}
      BBD_KEY_6: ${{ secrets.BIGBALLSDATA_API_KEY }}
      BBD_KEY_7: ${{ secrets.BIG_BALLS_DATA_KEY }}
      BBD_KEY_8: ${{ secrets.BBD_API_TOKEN }}
      BIG_BALLS_DATA_API_BASE_URL: ${{ vars.BIG_BALLS_DATA_API_BASE_URL || vars.BBD_API_BASE_URL || '' }}
      BIG_BALLS_DATA_OPENAPI_URL: ${{ vars.BIG_BALLS_DATA_OPENAPI_URL || vars.BBD_OPENAPI_URL || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select configured BBD Pro repository secret
        run: |
          set -euo pipefail
          selected=''
          for variable in BBD_KEY_1 BBD_KEY_2 BBD_KEY_3 BBD_KEY_4 BBD_KEY_5 BBD_KEY_6 BBD_KEY_7 BBD_KEY_8; do
            value=${!variable:-}
            if [ -n "$value" ]; then
              selected=$value
              break
            fi
          done
          test -n "$selected" || { echo '::error::No recognized Big Balls Data Pro repository secret is configured'; exit 1; }
          test -n "${ODDS_API_KEY_VALUE:-}" || { echo '::error::Missing ODDS_API_KEY'; exit 1; }
          test -n "${INQSI_ADMIN_API_TOKEN_VALUE:-}" || { echo '::error::Missing INQSI_ADMIN_API_TOKEN'; exit 1; }
          echo "BIG_BALLS_DATA_API_KEY=$selected" >> "$GITHUB_ENV"
          echo 'BBD Pro secret selected without exposing its value.'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Install integration and verification runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
          python scripts/install_mlb_three_api_autonomy_v1.py
          python -m pytest -q \
            tests/unit/test_mlb_three_api_policy.py \
            tests/unit/test_mlb_bbd_pro_context.py \
            tests/unit/test_mlb_three_api_runtime.py
          python scripts/verify_mlb_three_api_runtime.py
          python scripts/verify_mlb_schedule_invariants.py
          python scripts/verify_mlb_official_prediction_semantics.py
          sam validate --template-file template.yaml

      - name: Commit canonical installed source before deployment
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          if printf '%s\n' "$changed" | grep -Eq '^(tennis_learning/|tennis-template\.yaml|soccer_auto/|soccer-auto-template\.yaml)'; then
            echo '::error::Sport isolation violation'
            exit 1
          fi
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Install autonomous MLB three-API LLM runtime'
            git push origin HEAD:main
          fi
          echo "DEPLOY_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Live pre-deploy authentication and source audit
        env:
          PYTHONPATH: hello_world
          ODDS_API_KEY: ${{ env.ODDS_API_KEY_VALUE }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          import mlb_bbd_pro_context as bbd
          import mlb_official_schedule_authority as official
          import mlb_three_api_llm_analyst as llm

          date_et = datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          schedule = official.fetch_exact_date_schedule(date_et)
          games = schedule.get('games') or []
          assert games, schedule

          odds_url = 'https://api.the-odds-api.com/v4/sports/baseball_mlb/odds/?' + urllib.parse.urlencode({
              'apiKey': os.environ['ODDS_API_KEY'],
              'regions': 'us',
              'markets': 'h2h',
              'oddsFormat': 'american',
              'dateFormat': 'iso',
          })
          request = urllib.request.Request(odds_url, headers={'accept': 'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              odds_payload = json.loads(response.read().decode('utf-8'))
              odds_headers = dict(response.headers)
          assert isinstance(odds_payload, list), type(odds_payload)

          # Crosswalk the official first game to the market payload so the LLM
          # receives actual current bookmaker evidence during verification.
          game = dict(games[0])
          home = str(game.get('home_team') or '').lower()
          away = str(game.get('away_team') or '').lower()
          market = next((row for row in odds_payload if str(row.get('home_team') or '').lower() == home and str(row.get('away_team') or '').lower() == away), None)
          if market:
              game['provider_event_id'] = market.get('id')
              game['bookmakers'] = market.get('bookmakers') or []

          bbd_manifest = bbd.discover_manifest(force=True)
          bbd_context = bbd.collect_game_context(game, as_of_utc=datetime.now(timezone.utc).isoformat())
          merged = bbd.merge_into_advanced_context({
              'official_game_pk': game.get('official_game_pk'),
              'schedule_authority': game.get('schedule_authority'),
              'bookmakers': game.get('bookmakers') or [],
          }, bbd_context)
          llm_signal = llm.analyze_game(game, merged)

          report = {
              'ok': True,
              'checkedAtUtc': datetime.now(timezone.utc).isoformat(),
              'slateDateEt': date_et,
              'officialMlb': {
                  'status': 'CONNECTED',
                  'officialGameCount': schedule.get('officialGameCount'),
                  'source': schedule.get('source'),
              },
              'theOddsApi': {
                  'status': 'CONNECTED',
                  'eventCount': len(odds_payload),
                  'requestsRemaining': odds_headers.get('x-requests-remaining'),
                  'requestsUsed': odds_headers.get('x-requests-used'),
              },
              'bigBallsDataPro': {
                  'status': bbd_context.get('sourceStatus'),
                  'manifestOperationCount': len(bbd_manifest.get('operations') or []),
                  'operationsAttempted': bbd_context.get('operationsAttempted'),
                  'operationsSucceeded': bbd_context.get('operationsSucceeded'),
                  'contextFingerprint': bbd_context.get('contextFingerprint'),
                  'errors': bbd_context.get('errors'),
              },
              'bedrockLlm': {
                  'status': llm_signal.get('status'),
                  'modelId': llm_signal.get('modelId'),
                  'predictedWinner': llm_signal.get('predictedWinner'),
                  'predictedLoser': llm_signal.get('predictedLoser'),
                  'evidenceFingerprint': llm_signal.get('evidenceFingerprint'),
                  'modelErrors': llm_signal.get('modelErrors'),
              },
          }
          report['ok'] = bool(
              report['officialMlb']['status'] == 'CONNECTED'
              and report['theOddsApi']['status'] == 'CONNECTED'
              and report['bigBallsDataPro']['status'] in {'CONNECTED', 'PARTIAL'}
              and int(report['bigBallsDataPro']['operationsSucceeded'] or 0) > 0
          )
          os.makedirs('runtime_reports', exist_ok=True)
          with open('runtime_reports/mlb_three_api_live_source_audit_latest.json', 'w') as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          assert report['ok'], report
          PY

      - name: Wait for CloudFormation updateability
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            status=$(aws cloudformation describe-stacks \
              --stack-name parlay-platform-dev \
              --region "$AWS_REGION_VALUE" \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo STACK_MISSING)
            case "$status" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE|IMPORT_ROLLBACK_COMPLETE|STACK_MISSING) break ;;
              *_IN_PROGRESS) sleep 20 ;;
              *) echo "::error::Stack is not updateable: $status"; exit 1 ;;
            esac
          done

      - name: Build and deploy exact three-source source
        run: |
          set -euo pipefail
          rm -rf .aws-sam
          sam build --no-cached --template-file template.yaml
          template_sha=$(sha256sum template.yaml | awk '{print $1}')
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name parlay-platform-dev \
            --region "$AWS_REGION_VALUE" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --force-upload \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              "BigBallsDataApiKey=${BIG_BALLS_DATA_API_KEY}" \
              "BigBallsDataApiBaseUrl=${BIG_BALLS_DATA_API_BASE_URL:-}" \
              "InqsiAdminApiToken=${INQSI_ADMIN_API_TOKEN_VALUE}" \
              "DeployGitSha=${DEPLOY_SOURCE_SHA}" \
              "DeployTemplateSha256=${template_sha}" \
              "DeployRunId=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Ensure Bedrock invoke permission for active MLB functions
        run: |
          set -euo pipefail
          for logical_id in MLBAuditedPullFunction MLBDailyPickLockFunction MLBMLTrainingFunction MLBProductionVerifierFunction MLBThreeApiAutonomousControllerFunction; do
            function_name=$(aws cloudformation describe-stack-resource \
              --stack-name parlay-platform-dev --logical-resource-id "$logical_id" \
              --region "$AWS_REGION_VALUE" --query 'StackResourceDetail.PhysicalResourceId' --output text)
            role_arn=$(aws lambda get-function-configuration \
              --function-name "$function_name" --region "$AWS_REGION_VALUE" --query Role --output text)
            role_name=${role_arn##*/}
            aws iam put-role-policy \
              --role-name "$role_name" \
              --policy-name InqsiMlbThreeApiBedrockInvoke \
              --policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["bedrock:InvokeModel","bedrock:InvokeModelWithResponseStream"],"Resource":"*"}]}'
          done

      - name: Invoke autonomous controller and verify deployment
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id MLBThreeApiAutonomousControllerFunction \
            --region "$AWS_REGION_VALUE" \
            --query 'StackResourceDetail.PhysicalResourceId' --output text)
          aws lambda invoke \
            --function-name "$function_name" --region "$AWS_REGION_VALUE" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"run","source":"three-api-deployment"}' \
            /tmp/mlb-three-api-controller.json >/tmp/mlb-three-api-controller-meta.json
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          meta=json.load(open('/tmp/mlb-three-api-controller-meta.json'))
          body=json.load(open('/tmp/mlb-three-api-controller.json'))
          assert not meta.get('FunctionError'), (meta, body)
          assert body.get('version') == 'MLB-THREE-API-AUTONOMOUS-CONTROLLER-v1', body
          assert body.get('dailyAccuracyGoal') == 0.70, body
          assert int(body.get('officialGameCount') or 0) > 0, body
          report={
              'ok': body.get('ok') is True,
              'checkedAtUtc': datetime.now(timezone.utc).isoformat(),
              'deploySourceSha': os.environ.get('DEPLOY_SOURCE_SHA'),
              'controller': body,
              'requirements': {
                  'allThreeApis': True,
                  'autonomousCadenceMinutes': 5,
                  'firstGamePredictionLeadMinutes': 45,
                  'completeCardDeadline': 'second official game minus 45 minutes',
                  'fullSlateRequired': True,
                  'dailyAccuracyGoal': 0.70,
              },
          }
          with open('runtime_reports/mlb_three_api_deploy_latest.json','w') as handle:
              json.dump(report,handle,indent=2,sort_keys=True)
              handle.write('\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Publish verified evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add runtime_reports/mlb_three_api_install_latest.json \
                  runtime_reports/mlb_three_api_live_source_audit_latest.json \
                  runtime_reports/mlb_three_api_deploy_latest.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLB three-API autonomous deployment proof [skip ci]'
            git push origin HEAD:main
          fi
