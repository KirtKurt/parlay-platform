name: Agent dispatch verified soccer legacy-lock deployment

on:
  push:
    branches:
      - agent/soccer-authority-repair

permissions:
  contents: read
  actions: write

concurrency:
  group: agent-dispatch-verified-soccer-legacy-lock-deployment
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Dispatch verified soccer legacy-lock deployment'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the permanent isolated soccer workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body='{"ref":"agent/soccer-authority-repair","inputs":{"shared_quota_reserve_percent":"0"}}'
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-soccer-auto.yml/dispatches" \
            --data "$body"
          echo 'Permanent isolated soccer deployment dispatched.'
