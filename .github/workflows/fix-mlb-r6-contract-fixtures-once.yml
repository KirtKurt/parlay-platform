name: Fix MLB R6 Contract Fixtures Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-mlb-r6-contract-fixtures-once.yml'

permissions:
  contents: write

concurrency:
  group: fix-mlb-r6-contract-fixtures-once
  cancel-in-progress: false

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2

      - name: Align production contracts and tests to r6
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_id = 'mlb-v2-2026-07-29-future-prospective-r5'
          new_id = 'mlb-v2-2026-08-02-future-prospective-r6'
          old_cutoff = '2026-07-29T04:00:00+00:00'
          new_cutoff = '2026-08-02T04:00:00+00:00'

          roots = [Path('hello_world'), Path('scripts'), Path('tests/unit')]
          changed = []
          for root in roots:
              for path in root.rglob('*.py'):
                  text = path.read_text(encoding='utf-8')
                  updated = text.replace(old_id, new_id).replace(old_cutoff, new_cutoff)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))

          training = Path('hello_world/mlb_ml_aws_training_v1.py')
          text = training.read_text(encoding='utf-8')
          text = text.replace(
              'MLB ML production requires the future-prospective r5 experiment ID',
              'MLB ML production requires the configured prospective experiment ID',
          ).replace(
              'MLB ML production requires the future-prospective r5 release contract',
              'MLB ML production requires the configured prospective release contract',
          ).replace(
              'MLB ML r5 release cutoff must begin at the July 24 ET slate boundary',
              'MLB ML release cutoff must match the configured prospective slate boundary',
          )
          training.write_text(text, encoding='utf-8')
          if str(training) not in changed:
              changed.append(str(training))

          audit_test = Path('tests/unit/test_run_mlb_ml_v3_audit_report.py')
          text = audit_test.read_text(encoding='utf-8')
          text = text.replace('2026-07-30', '2026-08-03')
          text = text.replace('2026-07-29', '2026-08-02')
          audit_test.write_text(text, encoding='utf-8')
          if str(audit_test) not in changed:
              changed.append(str(audit_test))

          print({'changedFiles': sorted(set(changed))})
          PY

      - name: Run full MLB production source contract suite
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          sam validate --template-file template.yaml
          python scripts/stabilize_mlb_deploy_source.py
          python scripts/patch_template_mlb_v1.py
          python scripts/patch_template_mlb_security.py
          python scripts/patch_template_mlb_results_routes.py
          git diff --check
          python -m pytest -q \
            tests/unit/test_mlb_pull_guard_status.py \
            tests/unit/test_mlb_probability_actionability_guard.py \
            tests/unit/test_mlb_signal_policy_prelock_persistence.py \
            tests/unit/test_mlb_production_verifier_authority.py \
            tests/unit/test_mlb_production_verifier_per_game.py \
            tests/unit/test_mlb_advanced_context_travel_rest.py \
            tests/unit/test_mlb_bbs_status.py \
            tests/unit/test_mlb_fundamentals_snapshot_v2.py \
            tests/unit/test_mlb_last_possible_prediction_gate_provider_neutral.py \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_prediction_probability_contract_v1.py \
            tests/unit/test_mlb_ml_experiment_v2.py \
            tests/unit/test_mlb_ml_dual_model_v2.py \
            tests/unit/test_mlb_ml_promotion_policy_v2.py \
            tests/unit/test_mlb_ml_aws_training_v1.py \
            tests/unit/test_mlb_daily_pick_lock_runtime.py \
            tests/unit/test_mlb_daily_per_game_lock.py \
            tests/unit/test_mlb_lock_status_request_cache.py \
            tests/unit/test_mlb_public_per_game_authority.py \
            tests/unit/test_verify_mlb_postdeploy_scheduled_pull.py \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_mlb_deploy_http_probe.py \
            tests/unit/test_mlb_lambda_artifact_identity.py \
            tests/unit/test_mlb_trainer_invoke_retry.py \
            tests/unit/test_mlb_release_activation_predeploy.py \
            tests/unit/test_mlb_trainer_deploy_response.py \
            tests/unit/test_mlb_workflow_authority.py \
            tests/unit/test_run_mlb_ml_v3_audit_report.py

      - name: Commit fixture repair
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hello_world scripts tests/unit
          git diff --cached --quiet && exit 0
          git commit -m 'Align MLB contracts and tests to r6 cutover'
          git push origin HEAD:"$HEAD_BRANCH"
