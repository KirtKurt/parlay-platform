name: Repair NFL Historical Game Metadata

"on":
  push:
    branches:
      - automation/nfl-historical-recovery-20260825-0528
    paths:
      - '.github/workflows/nfl-historical-game-metadata-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-historical-game-metadata-recovery
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-nfl-auto
  REPORT_PATH: runtime_reports/nfl_historical_game_metadata_recovery_latest.json
  LIVE_REPORT_PATH: runtime_reports/nfl_historical_game_metadata_recovery_live_latest.json
  PYTHONPATH: .

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore checksum-controlled NFL release artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          names = [
              'part00', 'part01', 'part02', 'part03', 'part04',
              'part05a', 'part05b', 'part05c', 'part05d',
              'part06', 'part07', 'part08',
          ]
          parts = [Path('.nfl_bundle') / name for name in names]
          missing = [str(path) for path in parts if not path.is_file()]
          if missing:
              raise SystemExit(f'NFL bundle parts missing: {missing}')
          encoded = b''.join(path.read_bytes() for path in parts)
          Path('/tmp/nfl-auto.zip').write_bytes(base64.b64decode(encoded, validate=True))
          print({'partCount': len(parts), 'firstPart': parts[0].name, 'lastPart': parts[-1].name})
          PY
          unzip -tq /tmp/nfl-auto.zip
          mkdir -p .github/workflows
          unzip -p /tmp/nfl-auto.zip nfl-auto-template.yaml > nfl-auto-template.yaml
          unzip -p /tmp/nfl-auto.zip .github/workflows/deploy-nfl-auto.yml > .github/workflows/deploy-nfl-auto.yml
          python - <<'PY'
          import hashlib, json, pathlib

          manifest = json.loads(pathlib.Path('NFL_AUTO_MANIFEST.json').read_text())
          expected = {row['path']: row for row in manifest['files']}
          for name in ('nfl-auto-template.yaml', '.github/workflows/deploy-nfl-auto.yml'):
              path = pathlib.Path(name)
              row = expected[name]
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              assert observed == row['sha256'], (name, observed, row['sha256'])
              assert path.stat().st_size == int(row['bytes']), (name, path.stat().st_size, row['bytes'])
              print({'path': name, 'sha256': observed, 'bytes': path.stat().st_size})
          PY

      - name: Validate isolated NFL repair contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile nfl_auto/*.py scripts/nfl_recover_historical_game_metadata.py
          python -m pytest -q tests/nfl_auto
          python scripts/verify_nfl_auto_bundle.py
          git diff --check

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pause only the NFL historical scheduler during corpus repair
        id: pause
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          rule=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id NflAutonomousFunctionBackfillEveryMinute \
            --region "$REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$rule"; test "$rule" != None
          state=$(aws events describe-rule --name "$rule" --region "$REGION" --query State --output text)
          echo "rule=$rule" >> "$GITHUB_OUTPUT"
          echo "prior_state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = ENABLED ]; then
            aws events disable-rule --name "$rule" --region "$REGION"
          fi

      - name: Recover exact historical kickoff and team authority
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python scripts/nfl_recover_historical_game_metadata.py \
            --region "$REGION" \
            --stack-name "$STACK_NAME" \
            --output "$REPORT_PATH"

      - name: Advance repaired NFL backfill through protected application path
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          fn=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id NflAutonomousFunction \
            --region "$REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$fn"; test "$fn" != None
          for i in 1 2 3 4 5 6 7 8; do
            aws lambda invoke \
              --function-name "$fn" \
              --region "$REGION" \
              --cli-read-timeout 900 \
              --cli-binary-format raw-in-base64-out \
              --payload '{"action":"autonomous_tick"}' \
              "/tmp/nfl-tick-$i.json" >/tmp/nfl-tick-meta.json
            python - "$i" <<'PY'
          import json, sys
          i = sys.argv[1]
          body = json.load(open(f'/tmp/nfl-tick-{i}.json'))
          if body.get('ok') is not True:
              raise SystemExit(f'NFL autonomous tick {i} failed closed: {body}')
          print(json.dumps({'tick': int(i), 'result': body}, sort_keys=True, default=str))
          PY
          done

      - name: Verify repaired AWS state without changing authority
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='NflAutoStatusUrl'].OutputValue" \
            --output text)
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$url" >/tmp/nfl-status.json
          python - <<'PY'
          import datetime, json, os, pathlib

          repair = json.load(open(os.environ['REPORT_PATH']))
          status = json.load(open('/tmp/nfl-status.json'))
          champions = status.get('champions') or {}
          historical = int(status.get('historical_game_count') or 0)
          phase = str((status.get('backfill') or {}).get('phase') or '')
          ok = bool(
              repair.get('ok') is True
              and historical >= 1000
              and phase in {'BBD_PLAYS', 'ODDS_SNAPSHOTS', 'MATERIALIZE', 'READY'}
              and all(value is None for value in champions.values())
              and status.get('preseason_predictions_enabled') is False
          )
          proof = {
              'ok': ok,
              'proofType': 'NFL_HISTORICAL_GAME_METADATA_RECOVERY_LIVE_VERIFICATION',
              'observedAtUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'sourceSha': os.environ.get('GITHUB_SHA'),
              'repair': repair,
              'status': status,
              'historicalGameCount': historical,
              'backfillPhase': phase,
              'championsRemainNull': all(value is None for value in champions.values()),
              'productionAuthorityChanged': False,
              'immutablePredictionHistoryRewritten': False,
              'postStartPredictionCreated': False,
              'humanWinnerSelection': False,
              'otherSportChanged': False,
          }
          pathlib.Path(os.environ['LIVE_REPORT_PATH']).write_text(json.dumps(proof, indent=2, sort_keys=True, default=str) + '\n')
          print(json.dumps(proof, indent=2, sort_keys=True, default=str))
          if not ok:
              raise SystemExit('NFL historical metadata recovery did not reach a safe advancing state')
          PY

      - name: Restore NFL historical scheduler state
        if: always()
        env:
          REGION: ${{ secrets.AWS_REGION }}
          RULE: ${{ steps.pause.outputs.rule }}
          PRIOR_STATE: ${{ steps.pause.outputs.prior_state }}
        run: |
          set -euo pipefail
          if [ -n "${RULE:-}" ] && [ "${PRIOR_STATE:-}" = ENABLED ]; then
            aws events enable-rule --name "$RULE" --region "$REGION"
          fi

      - name: Publish isolated NFL repair proof to repair branch
        if: always() && hashFiles('runtime_reports/nfl_historical_game_metadata_recovery_latest.json') != ''
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT_PATH"
          if [ -f "$LIVE_REPORT_PATH" ]; then git add "$LIVE_REPORT_PATH"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'runtime: publish isolated NFL historical recovery proof [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
