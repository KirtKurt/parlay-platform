name: Fix MLB Trainer Table Wiring

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-mlb-trainer-table-wiring.yml'
      - 'tests/unit/test_mlb_trainer_table_wiring.py'

permissions:
  contents: write

concurrency:
  group: fix-mlb-trainer-table-wiring-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - name: Install exact trainer table wiring
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('template.yaml')
          text=path.read_text()
          start=text.index('  MLBMLTrainingFunction:')
          end=text.index('\n  SoccerSchedulerFunction:', start)
          block=text[start:end]
          variables="""          MLB_ML_ARTIFACTS_BUCKET: !Ref MLBMLArtifactsBucket
"""
          replacement="""          MLB_ML_ARTIFACTS_BUCKET: !Ref MLBMLArtifactsBucket
          SNAPSHOTS_TABLE: !Ref SnapshotsTable
          OUTCOMES_TABLE: !Ref OutcomesTable
"""
          if 'SNAPSHOTS_TABLE: !Ref SnapshotsTable' not in block:
              assert variables in block
              block=block.replace(variables,replacement,1)
          old="""        - DynamoDBReadPolicy:
            TableName: !Ref OutcomesTable
"""
          new="""        - DynamoDBCrudPolicy:
            TableName: !Ref OutcomesTable
"""
          if old in block:
              block=block.replace(old,new,1)
          assert 'SNAPSHOTS_TABLE: !Ref SnapshotsTable' in block
          assert 'OUTCOMES_TABLE: !Ref OutcomesTable' in block
          assert new in block
          assert old not in block
          path.write_text(text[:start]+block+text[end:])
          PY
          git diff --check
      - name: Validate canonical settlement and infrastructure contract
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' -r hello_world/requirements.txt
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_trainer_table_wiring.py \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_ml_aws_training_v1.py \
            tests/unit/test_mlb_deploy_identity.py
          sam validate --template-file template.yaml
      - name: Commit permanent repair to PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-mlb-trainer-table-wiring.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire MLB trainer to canonical lock and label tables'
          git push origin HEAD:"$HEAD_BRANCH"
