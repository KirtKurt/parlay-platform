name: Repair MLB training continuity now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-training-continuity-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-training-continuity-now
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-dev

jobs:
  reconcile-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify safe readable-status lifecycle reconciliation code
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            scripts/reconcile_mlb_prospective_backlog.py \
            scripts/reconcile_mlb_prospective_backlog_v3.py \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py \
            scripts/invoke_mlb_trainer_with_retry.py
          python -m pytest -q \
            tests/unit/test_reconcile_mlb_prospective_backlog.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v3.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5.py \
            tests/unit/test_mlb_prospective_status_lifecycle_repair.py

      - name: Reconcile every prospective slate through yesterday with V5
        id: reconcile
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p /tmp/mlb-training-repair runtime_reports
          python scripts/reconcile_mlb_prospective_backlog_v5.py \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --max-slate-days 30 \
            --output /tmp/mlb-training-repair/backlog.json

      - name: Invoke trainer and require real accepted rows
        id: train
        if: steps.reconcile.outcome == 'success'
        continue-on-error: true
        env:
          AWS_MAX_ATTEMPTS: '10'
          AWS_RETRY_MODE: standard
        run: |
          set -euo pipefail
          TRAINER=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBMLTrainingFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$TRAINER"
          test "$TRAINER" != 'None'

          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"scheduled","run":"canonical_continuity_repair_v5_training"}' \
            --response /tmp/mlb-training-repair/training.json \
            --invocation /tmp/mlb-training-repair/training-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 1800 \
            --retry-delay-seconds 30

          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"selection_capture","run":"canonical_continuity_repair_v5_selection"}' \
            --response /tmp/mlb-training-repair/selection.json \
            --invocation /tmp/mlb-training-repair/selection-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 1800 \
            --retry-delay-seconds 30

          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER" \
            --region "$AWS_REGION" \
            --status-training-result /tmp/mlb-training-repair/training.json \
            --status-selection-capture-result /tmp/mlb-training-repair/selection.json \
            --response /tmp/mlb-training-repair/status.json \
            --invocation /tmp/mlb-training-repair/status-invocation.json

          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          training = json.loads(Path('/tmp/mlb-training-repair/training.json').read_text())
          status = json.loads(Path('/tmp/mlb-training-repair/status.json').read_text())
          latest = ((status.get('trainingHealth') or {}).get('latestRun') or training)
          continuity = latest.get('canonicalSlateContinuity') or {}
          accepted = int(latest.get('acceptedRowCount') or training.get('acceptedRowCount') or 0)
          yesterday = (datetime.now(ZoneInfo('America/New_York')).date() - timedelta(days=1)).isoformat()
          processed = str(continuity.get('processedThroughSlateDate') or '')
          evidence = {
              'ok': accepted > 0 and not continuity.get('blockedSlateDate') and processed >= yesterday,
              'acceptedRowCount': accepted,
              'rejectedRowCount': latest.get('rejectedRowCount', training.get('rejectedRowCount')),
              'status': latest.get('status', training.get('status')),
              'canonicalSlateContinuity': continuity,
              'partitionCounts': latest.get('partitionCounts', training.get('partitionCounts')),
              'rejectionReasonCounts': latest.get('rejectionReasonCounts', training.get('rejectionReasonCounts')),
              'modelTrained': latest.get('modelTrained', training.get('modelTrained')),
              'liveInferenceAuthority': latest.get('liveInferenceAuthority', training.get('liveInferenceAuthority')),
              'productionAuthorityChanged': latest.get('productionAuthorityChanged', training.get('productionAuthorityChanged')),
              'requiredProcessedThroughSlateDate': yesterday,
          }
          Path('/tmp/mlb-training-repair/trainer-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True, default=str) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, indent=2, sort_keys=True, default=str))
          if evidence['liveInferenceAuthority'] is True:
              raise SystemExit('Continuity repair unexpectedly activated live inference authority')
          if evidence['productionAuthorityChanged'] is True:
              raise SystemExit('Continuity repair unexpectedly changed production authority')
          if not evidence['ok']:
              raise SystemExit('Trainer did not admit real rows through the complete official continuity window')
          PY

      - name: Publish durable continuity evidence
        if: always()
        run: |
          set -uo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          base = Path('/tmp/mlb-training-repair')
          def load(name):
              path = base / name
              if not path.exists():
                  return {'ok': False, 'error': f'{name}_missing'}
              try:
                  return json.loads(path.read_text())
              except Exception as exc:
                  return {'ok': False, 'error': f'{name}_invalid:{type(exc).__name__}'}

          backlog = load('backlog.json')
          trainer = load('trainer-evidence.json')
          report = {
              'proofType': 'MLB_CANONICAL_TRAINING_CONTINUITY_REPAIR_V5',
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'sourceSha': '${{ github.sha }}',
              'backlog': backlog,
              'trainer': trainer,
              'directTableWrite': False,
              'postStartPredictionCreationAllowed': False,
              'immutablePredictionRewriteAllowed': False,
              'productionAuthorityChanged': False,
          }
          report['ok'] = backlog.get('ok') is True and trainer.get('ok') is True
          report['conclusion'] = 'PASS' if report['ok'] else 'FAIL'
          Path('runtime_reports/mlb_training_continuity_repair_latest.json').write_text(
              json.dumps(report, indent=2, sort_keys=True, default=str) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True, default=str))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git add runtime_reports/mlb_training_continuity_repair_latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLB training continuity V5 repair proof [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" != 5 || exit 1
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 2))
            done
          fi

      - name: Require continuity recovery
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('runtime_reports/mlb_training_continuity_repair_latest.json').read_text())
          if report.get('ok') is not True:
              raise SystemExit(json.dumps(report, sort_keys=True))
          print('MLB canonical training continuity V5: PASS')
          PY
