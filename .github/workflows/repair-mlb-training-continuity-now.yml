# R7 continuity repair deliberately uses only the already-deployed MLB
# functions. It must never rebuild or deploy the shared root stack because that
# stack contains resources for other sports.
name: Repair MLB training continuity safely

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-mlb-training-continuity-safely
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-dev

jobs:
  reconcile-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify fail-closed MLB continuity contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m py_compile \
            hello_world/mlb_prospective_trainer_read_repair.py \
            scripts/reconcile_mlb_prospective_backlog.py \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py \
            scripts/invoke_mlb_trainer_with_retry.py
          PYTHONPATH="hello_world:scripts:${PYTHONPATH:-}" python -m pytest -q \
            tests/unit/test_mlb_protected_terminal_force_replay.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5.py \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_prospective_trainer_read_repair.py \
            tests/unit/test_mlb_training_continuity_workflow_isolation.py
          git diff --check

      - name: Resolve and verify deployed MLB functions only
        id: functions
        run: |
          set -euo pipefail
          mkdir -p /tmp/mlb-r7-safe-repair
          LOCK_FN=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBDailyPickLockFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          TRAINER_FN=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBMLTrainingFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          READ_FN=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBV3ReadFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          for value in "$LOCK_FN" "$TRAINER_FN" "$READ_FN"; do
            test -n "$value"
            test "$value" != 'None'
          done
          echo "lock_fn=$LOCK_FN" >> "$GITHUB_OUTPUT"
          echo "trainer_fn=$TRAINER_FN" >> "$GITHUB_OUTPUT"
          echo "read_fn=$READ_FN" >> "$GITHUB_OUTPUT"
          export LOCK_FN TRAINER_FN READ_FN
          python - <<'PY'
          import json
          import os
          import boto3

          client = boto3.client('lambda', region_name=os.environ['AWS_REGION'])
          expected = {
              'lock': (os.environ['LOCK_FN'], 'mlb_daily_pick_lock_protected.lambda_handler'),
              'trainer': (os.environ['TRAINER_FN'], 'mlb_ml_aws_training_v1_compat.lambda_handler'),
              'read': (os.environ['READ_FN'], 'mlb_v3_read_api.lambda_handler'),
          }
          proof = {}
          for role, (name, handler) in expected.items():
              cfg = client.get_function_configuration(FunctionName=name)
              variables = (cfg.get('Environment') or {}).get('Variables') or {}
              row = {
                  'functionName': name,
                  'handler': cfg.get('Handler'),
                  'state': cfg.get('State'),
                  'lastUpdateStatus': cfg.get('LastUpdateStatus'),
                  'deployGitSha': variables.get('INQSI_DEPLOY_GIT_SHA'),
                  'deployTemplateSha256': variables.get('INQSI_DEPLOY_TEMPLATE_SHA256'),
              }
              assert row['handler'] == handler, row
              assert row['state'] == 'Active', row
              assert row['lastUpdateStatus'] == 'Successful', row
              proof[role] = row
          trainer_env = (
              client.get_function_configuration(FunctionName=os.environ['TRAINER_FN'])
              .get('Environment', {})
              .get('Variables', {})
          )
          assert trainer_env.get('MLB_ML_EXPERIMENT_ID') == 'mlb-v2-2026-08-03-future-prospective-r7'
          assert trainer_env.get('INQSI_MLB_LEGACY_V1_AUTHORITY_ENABLED') == 'false'
          assert trainer_env.get('INQSI_MLB_ML_AUTO_PROMOTE') == 'false'
          proof['sharedRootStackDeployedByThisWorkflow'] = False
          proof['otherSportFunctionResolved'] = False
          proof['directTableWrite'] = False
          open('/tmp/mlb-r7-safe-repair/identity.json', 'w').write(
              json.dumps(proof, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY

      - name: Reconcile protected MLB prospective evidence
        run: |
          set -euo pipefail
          python scripts/reconcile_mlb_prospective_backlog_v5.py \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --max-slate-days 30 \
            --output /tmp/mlb-r7-safe-repair/backlog.json

      - name: Invoke deployed R7 trainer and selection capture
        env:
          TRAINER_FN: ${{ steps.functions.outputs.trainer_fn }}
          AWS_MAX_ATTEMPTS: '10'
          AWS_RETRY_MODE: standard
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"scheduled","run":"safe_deployed_r7_continuity_training"}' \
            --response /tmp/mlb-r7-safe-repair/training.json \
            --invocation /tmp/mlb-r7-safe-repair/training-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 1800 \
            --retry-delay-seconds 30
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"selection_capture","run":"safe_deployed_r7_continuity_selection"}' \
            --response /tmp/mlb-r7-safe-repair/selection.json \
            --invocation /tmp/mlb-r7-safe-repair/selection-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 1800 \
            --retry-delay-seconds 30
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --status-training-result /tmp/mlb-r7-safe-repair/training.json \
            --status-selection-capture-result /tmp/mlb-r7-safe-repair/selection.json \
            --response /tmp/mlb-r7-safe-repair/status.json \
            --invocation /tmp/mlb-r7-safe-repair/status-invocation.json

      - name: Require real admitted rows and unchanged authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path('/tmp/mlb-r7-safe-repair')
          training = json.loads((root / 'training.json').read_text())
          selection = json.loads((root / 'selection.json').read_text())
          status = json.loads((root / 'status.json').read_text())
          latest = ((status.get('trainingHealth') or {}).get('latestRun') or training)
          continuity = latest.get('canonicalSlateContinuity') or training.get('canonicalSlateContinuity') or {}
          accepted = int(latest.get('acceptedRowCount', training.get('acceptedRowCount', 0)) or 0)
          yesterday = (
              datetime.now(ZoneInfo('America/New_York')).date() - timedelta(days=1)
          ).isoformat()
          processed = str(continuity.get('processedThroughSlateDate') or '')
          evidence = {
              'ok': bool(
                  training.get('ok') is True
                  and selection.get('ok') is True
                  and status.get('ok') is True
                  and accepted > 0
                  and not continuity.get('blockedSlateDate')
                  and processed >= yesterday
                  and latest.get('liveInferenceAuthority') is not True
                  and latest.get('productionAuthorityChanged') is not True
                  and latest.get('automaticPromotionEnabled') is not True
                  and (status.get('trainingHealth') or {}).get('deploymentIdentityMatches') is True
                  and (status.get('selectionCaptureHealth') or {}).get('deploymentIdentityMatches') is True
              ),
              'acceptedRowCount': accepted,
              'rejectedRowCount': latest.get('rejectedRowCount', training.get('rejectedRowCount')),
              'partitionCounts': latest.get('partitionCounts', training.get('partitionCounts')),
              'canonicalSlateContinuity': continuity,
              'requiredProcessedThroughSlateDate': yesterday,
              'processedThroughSlateDate': processed,
              'modelTrained': latest.get('modelTrained', training.get('modelTrained')),
              'championChanged': latest.get('championChanged', training.get('championChanged')),
              'liveInferenceAuthority': latest.get('liveInferenceAuthority', training.get('liveInferenceAuthority')),
              'productionAuthorityChanged': latest.get('productionAuthorityChanged', training.get('productionAuthorityChanged')),
              'automaticPromotionEnabled': latest.get('automaticPromotionEnabled', training.get('automaticPromotionEnabled')),
              'trainingDeploymentIdentityMatches': (status.get('trainingHealth') or {}).get('deploymentIdentityMatches'),
              'selectionDeploymentIdentityMatches': (status.get('selectionCaptureHealth') or {}).get('deploymentIdentityMatches'),
              'sharedRootStackDeployedByThisWorkflow': False,
              'directTableWrite': False,
              'immutablePredictionRewriteAllowed': False,
              'postStartPredictionCreationAllowed': False,
          }
          (root / 'acceptance.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True, default=str) + '\n'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True, default=str))
          if not evidence['ok']:
              raise SystemExit('R7 safe continuity acceptance did not pass')
          PY

      - name: Upload isolated R7 recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r7-safe-continuity-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: /tmp/mlb-r7-safe-repair
