name: MLB Odds V8 Shadow Deploy

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_odds_market_expansion_v8.py'
      - 'hello_world/mlb_odds_v8_shadow_collector.py'
      - 'tests/unit/test_mlb_odds_market_expansion_v8.py'
      - 'scripts/recover_mlb_v8_shadow.py'
      - 'mlb_odds_v8_shadow/**'
      - '.github/workflows/mlb-odds-v8-shadow-deploy.yml'

permissions:
  contents: write

concurrency:
  group: mlb-odds-v8-shadow-deploy
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-odds-v8-shadow
  PROOF_PATH: runtime_reports/mlb_odds_v8_shadow_recovery_latest.json

jobs:
  deploy-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate V8 source, tests, credentials, and build
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          aws sts get-caller-identity > /tmp/v8-aws-identity.json
          test -n "${ODDS_API_KEY_VALUE:-}"
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile \
            hello_world/mlb_odds_market_expansion_v8.py \
            hello_world/mlb_odds_v8_shadow_collector.py \
            scripts/recover_mlb_v8_shadow.py
          python -m pytest -q --tb=short tests/unit/test_mlb_odds_market_expansion_v8.py
          sam validate --lint --template-file mlb_odds_v8_shadow/template.yaml
          grep -Fq 'State: !If [EnableV8Schedule, ENABLED, DISABLED]' mlb_odds_v8_shadow/template.yaml
          ! grep -Fq 'Condition: EnableV8Schedule' mlb_odds_v8_shadow/template.yaml
          ! grep -Fq 'ReservedConcurrentExecutions' mlb_odds_v8_shadow/template.yaml
          grep -Fq 'Value: SHADOW_ONLY' mlb_odds_v8_shadow/template.yaml
          grep -Fq "MLB_V8_PLAYER_PROPS_ENABLED: 'false'" mlb_odds_v8_shadow/template.yaml
          rm -rf .aws-sam-v8-shadow
          sam build \
            --no-cached \
            --build-dir .aws-sam-v8-shadow \
            --template-file mlb_odds_v8_shadow/template.yaml
          test -f .aws-sam-v8-shadow/ShadowCollectorFunction/mlb_odds_v8_shadow_collector.py
          test -f .aws-sam-v8-shadow/ShadowCollectorFunction/mlb_odds_market_expansion_v8.py

      - name: Run fail-closed AWS recovery
        id: recovery
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -uo pipefail
          mkdir -p runtime_reports
          python scripts/recover_mlb_v8_shadow.py \
            --template .aws-sam-v8-shadow/template.yaml \
            --report "$PROOF_PATH" \
            --region "${{ secrets.AWS_REGION }}" \
            --source-sha "$GITHUB_SHA" \
            --wait-seconds 2100 \
            --poll-seconds 30 \
            2>&1 | tee /tmp/v8-recovery.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure durable report exists
        if: always()
        env:
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$PROOF_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          report={
              'proofType':'MLB_ODDS_V8_SHADOW_RECOVERY',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ['GITHUB_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],
              'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'stackName':os.environ['STACK_NAME'],
              'authority':'SHADOW_ONLY',
              'productionAuthorityChanged':False,
              'finalScheduleState':'UNKNOWN',
              'stepOutcomes':{'recovery':os.environ['RECOVERY_OUTCOME']},
              'blockers':['recovery_report_missing'],
              'ok':False,
          }
          Path(os.environ['PROOF_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$PROOF_PATH" >/dev/null

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-odds-v8-shadow-recovery-${{ github.sha }}
          path: |
            runtime_reports/mlb_odds_v8_shadow_recovery_latest.json
            /tmp/v8-aws-identity.json
            /tmp/v8-recovery.log
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable recovery evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$PROOF_PATH" /tmp/v8-proof-copy.json
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B v8-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/v8-proof-copy.json "$PROOF_PATH"
            git add "$PROOF_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V8 shadow recovery evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce successful recovery
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_odds_v8_shadow_recovery_latest.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('authority') == 'SHADOW_ONLY', value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('finalScheduleState') == 'ENABLED_EVERY_15_MINUTES', value
          identity=value.get('deploymentIdentity') or {}
          assert identity.get('handler') == 'mlb_odds_v8_shadow_collector.lambda_handler', value
          assert identity.get('scheduleRuleStateAtCanary') == 'DISABLED', value
          scheduled=value.get('scheduledCollection') or {}
          assert scheduled.get('ruleState') == 'ENABLED', value
          checks=scheduled.get('checks') or {}
          assert checks and all(checks.values()), value
          PY
