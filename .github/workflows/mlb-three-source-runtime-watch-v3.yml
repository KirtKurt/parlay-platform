name: MLB Three-Source Runtime and Timing Watch V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-three-source-runtime-watch-v3.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-three-source-runtime-watch-v3
  cancel-in-progress: false

jobs:
  certify-runtime-and-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install verifier dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2'

      - name: Wait for stable MLB stack
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            state=$(aws cloudformation describe-stacks \
              --stack-name parlay-platform-dev \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || echo STACK_MISSING)
            echo "stack_state=$state"
            case "$state" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                exit 0 ;;
              *_IN_PROGRESS)
                sleep 15 ;;
              *)
                echo "::error::Stack is not stable: $state"
                exit 1 ;;
            esac
          done
          echo '::error::Timed out waiting for stack'
          exit 1

      - name: Certify current autonomous controller and timing schedules
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import boto3

          REGION = os.environ['AWS_REGION']
          STACK = 'parlay-platform-dev'
          REPORT = Path('runtime_reports/mlb_three_source_runtime_v3_latest.json')
          CERT = Path('runtime_reports/mlb_three_source_runtime_timing_certified.json')
          cfn = boto3.client('cloudformation', region_name=REGION)
          lam = boto3.client('lambda', region_name=REGION)
          events = boto3.client('events', region_name=REGION)

          def resource(logical_id: str) -> str:
              return cfn.describe_stack_resource(
                  StackName=STACK,
                  LogicalResourceId=logical_id,
              )['StackResourceDetail']['PhysicalResourceId']

          controller_name = resource('MLBThreeApiAutonomousControllerFunction')
          config = lam.get_function_configuration(FunctionName=controller_name)
          env = ((config.get('Environment') or {}).get('Variables') or {})
          response = lam.invoke(
              FunctionName=controller_name,
              InvocationType='RequestResponse',
              Payload=b'{"action":"health"}',
          )
          raw = response['Payload'].read()
          body = json.loads(raw.decode('utf-8') or '{}') if raw else {}
          function_error = response.get('FunctionError')

          rule_names = events.list_rule_names_by_target(
              TargetArn=config['FunctionArn']
          ).get('RuleNames') or []
          rules = []
          for name in rule_names:
              rule = events.describe_rule(Name=name)
              rules.append({
                  'name': name,
                  'state': rule.get('State'),
                  'scheduleExpression': rule.get('ScheduleExpression'),
              })
          enabled_schedules = {
              row.get('scheduleExpression')
              for row in rules
              if row.get('state') == 'ENABLED'
          }

          required_env = (
              'MLB_THREE_API_STATE_TABLE',
              'MLB_THREE_API_PULL_FUNCTION_NAME',
              'MLB_THREE_API_LOCK_FUNCTION_NAME',
              'MLB_THREE_API_TRAIN_FUNCTION_NAME',
              'MLB_THREE_API_VERIFY_FUNCTION_NAME',
          )
          env_complete = all(bool(env.get(key)) for key in required_env)
          lambda_healthy = (
              config.get('State') == 'Active'
              and config.get('LastUpdateStatus') == 'Successful'
              and function_error is None
          )
          verifier = ((body.get('actions') or {}).get('verify') or {}) if isinstance(body, dict) else {}
          status_healthy = (
              isinstance(body, dict)
              and body.get('operationalStatus') == 'HEALTHY'
              and verifier.get('ok') is True
          )
          safe_status_only = (
              isinstance(body, dict)
              and not any(
                  key in (body.get('actions') or {})
                  for key in ('pull', 'card', 'preSlateTraining', 'settlement', 'postSettlementTraining')
              )
          )
          checks = {
              'currentControllerLogicalIdResolved': True,
              'lambdaHealthy': lambda_healthy,
              'requiredFunctionBindingsPresent': env_complete,
              'statusOnlyInvocationHealthy': status_healthy,
              'statusInvocationWasReadOnly': safe_status_only,
              'lifecycleFiveMinuteRuleEnabled': 'rate(5 minutes)' in enabled_schedules,
              'contenderTwoMinuteRuleEnabled': 'rate(2 minutes)' in enabled_schedules,
          }
          ok = all(checks.values())
          report = {
              'proofType': 'MLB_THREE_SOURCE_CURRENT_CONTROLLER_RUNTIME_V3',
              'checkedAtUtc': datetime.now(timezone.utc).isoformat(),
              'ok': ok,
              'stack': STACK,
              'controllerFunction': controller_name,
              'controllerVersion': body.get('version') if isinstance(body, dict) else None,
              'operationalStatus': body.get('operationalStatus') if isinstance(body, dict) else None,
              'checks': checks,
              'rules': rules,
              'verifierStatus': verifier,
              'guardrails': {
                  'statusOnlyInvocation': True,
                  'predictionMutationAllowedByWatch': False,
                  'historicalRewriteAllowedByWatch': False,
                  'promotionGateChangesAllowedByWatch': False,
                  'winnerOverrideAllowedByWatch': False,
              },
          }
          REPORT.parent.mkdir(parents=True, exist_ok=True)
          text = json.dumps(report, indent=2, sort_keys=True) + '\n'
          REPORT.write_text(text, encoding='utf-8')
          CERT.write_text(text, encoding='utf-8')
          print(text)
          if not ok:
              raise SystemExit('current MLB three-source controller runtime certification failed')
          PY

      - name: Publish truthful runtime certification
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            runtime_reports/mlb_three_source_runtime_v3_latest.json \
            runtime_reports/mlb_three_source_runtime_timing_certified.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish current MLB three-source runtime certification [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
