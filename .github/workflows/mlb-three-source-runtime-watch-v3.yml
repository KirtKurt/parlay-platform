name: MLB Canonical Runtime Health Watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-three-source-runtime-watch-v3.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-canonical-runtime-health-watch
  cancel-in-progress: true

jobs:
  certify-current-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install verifier dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2'

      - name: Verify deployed canonical MLB runtime and recent error state
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from datetime import datetime, timedelta, timezone
          import boto3

          REGION = os.environ['AWS_REGION']
          STACK = 'parlay-platform-dev'
          cfn = boto3.client('cloudformation', region_name=REGION)
          lam = boto3.client('lambda', region_name=REGION)
          events = boto3.client('events', region_name=REGION)
          cw = boto3.client('cloudwatch', region_name=REGION)

          def resource(logical_id: str) -> str:
              return cfn.describe_stack_resource(
                  StackName=STACK,
                  LogicalResourceId=logical_id,
              )['StackResourceDetail']['PhysicalResourceId']

          required = (
              'MLBAuditedPullFunction',
              'MLBDailyPickLockFunction',
              'MLBMLTrainingFunction',
              'MLBProductionVerifierFunction',
          )
          functions = {}
          checks = {}
          for logical_id in required:
              physical = resource(logical_id)
              cfg = lam.get_function_configuration(FunctionName=physical)
              healthy = (
                  cfg.get('State') == 'Active'
                  and cfg.get('LastUpdateStatus') == 'Successful'
              )
              checks[f'{logical_id}Healthy'] = healthy
              functions[logical_id] = {
                  'physicalName': physical,
                  'state': cfg.get('State'),
                  'lastUpdateStatus': cfg.get('LastUpdateStatus'),
                  'lastModified': cfg.get('LastModified'),
              }

          pull_name = functions['MLBAuditedPullFunction']['physicalName']
          pull_cfg = lam.get_function_configuration(FunctionName=pull_name)
          rule_names = events.list_rule_names_by_target(
              TargetArn=pull_cfg['FunctionArn']
          ).get('RuleNames') or []
          rules = []
          for name in rule_names:
              row = events.describe_rule(Name=name)
              rules.append({
                  'name': name,
                  'state': row.get('State'),
                  'scheduleExpression': row.get('ScheduleExpression'),
              })
          enabled_rules = [row for row in rules if row.get('state') == 'ENABLED']
          checks['auditedPullHasEnabledSchedule'] = bool(enabled_rules)

          now = datetime.now(timezone.utc)
          start = now - timedelta(minutes=10)
          metric = cw.get_metric_statistics(
              Namespace='AWS/Lambda',
              MetricName='Errors',
              Dimensions=[{'Name': 'FunctionName', 'Value': pull_name}],
              StartTime=start,
              EndTime=now,
              Period=300,
              Statistics=['Sum'],
          )
          recent_errors = sum(float(row.get('Sum') or 0.0) for row in metric.get('Datapoints') or [])
          checks['auditedPullNoErrorsLast10Minutes'] = recent_errors == 0.0

          alarm_name = 'MLB-Auto-Critical-Canonical-Ingest-Errors'
          alarm_rows = cw.describe_alarms(AlarmNames=[alarm_name]).get('MetricAlarms') or []
          alarm = alarm_rows[0] if alarm_rows else None
          alarm_state = alarm.get('StateValue') if alarm else 'NOT_FOUND'
          # An alarm can remain ALARM briefly while its evaluation window ages out.
          # Recent Lambda Errors are the authoritative liveness check; record the
          # alarm state separately instead of hiding it or force-setting its state.

          report = {
              'proofType': 'MLB_CANONICAL_RUNTIME_HEALTH',
              'checkedAtUtc': now.isoformat(),
              'stack': STACK,
              'checks': checks,
              'functions': functions,
              'auditedPullRules': rules,
              'auditedPullErrorsLast10Minutes': recent_errors,
              'canonicalIngestAlarm': {
                  'name': alarm_name,
                  'state': alarm_state,
                  'reason': alarm.get('StateReason') if alarm else None,
              },
              'guardrails': {
                  'readOnly': True,
                  'invokesPredictionFunctions': False,
                  'writesPredictions': False,
                  'rewritesLocks': False,
                  'changesPromotionGates': False,
                  'winnerOverride': False,
              },
          }
          report['ok'] = all(checks.values())
          print(json.dumps(report, indent=2, sort_keys=True, default=str))
          if not report['ok']:
              raise SystemExit('MLB canonical runtime health certification failed')
          PY
