name: R7 Aug4 terminal alias repair once

on:
  push:
    branches: [fix/r7-aug4-official-pk-terminal-alias-20260829]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply repair
        run: python scripts/apply_r7_terminal_official_pk_alias_fix.py
      - name: Install verification runtime
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
      - name: Verify focused R7 contracts
        run: pytest -q tests/unit/test_mlb_terminal_official_pk_alias.py tests/unit/test_mlb_canonical_final_labels_v1.py tests/unit/test_mlb_prospective_backlog_workflow.py tests/unit/test_mlb_cooperative_terminal_chunk.py
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r7-aug4-official-pk-terminal-alias-once.yml scripts/apply_r7_terminal_official_pk_alias_fix.py
          git add hello_world/mlb_slate_coverage_patch.py tests/unit/test_mlb_terminal_official_pk_alias.py
          git commit -m 'Fix R7 terminal legacy identity under exact official gamePk'
          git push
