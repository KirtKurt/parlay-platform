name: R7 Aug4 official-PK terminal alias repair once

on:
  push:
    branches:
      - fix/r7-aug4-official-pk-terminal-alias-20260829

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply narrow official-PK alias repair and regression tests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('hello_world/mlb_slate_coverage_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if str(item.get("game_identity") or "") != expected_identity:\n        errors.append("terminal_manifest_game_identity_mismatch")\n    if str(item.get("game_id") or "") != expected_game_id:\n        errors.append("terminal_manifest_game_id_mismatch")\n    if (\n        not expected_official_pk\n        or str(item.get("officialGamePk") or "") != expected_official_pk\n    ):\n        errors.append("terminal_manifest_official_game_pk_mismatch")\n'''
          new = '''    observed_official_pk = str(item.get("officialGamePk") or "")\n    terminal_official_pk_exact = bool(\n        expected_official_pk\n        and observed_official_pk == expected_official_pk\n    )\n    # MLB StatsAPI gamePk is the durable official game identity. Historical\n    # terminal rows can retain a pre-rebind provider alias in game_id /\n    # game_identity after the manifest moved to the canonical StatsAPI ID.\n    # Accept only those alias differences when the immutable official gamePk\n    # is an exact match. Start time, teams, manifest fingerprint, slate and\n    # every other terminal-authority check below remain fail-closed.\n    if (\n        not terminal_official_pk_exact\n        and str(item.get("game_identity") or "") != expected_identity\n    ):\n        errors.append("terminal_manifest_game_identity_mismatch")\n    if (\n        not terminal_official_pk_exact\n        and str(item.get("game_id") or "") != expected_game_id\n    ):\n        errors.append("terminal_manifest_game_id_mismatch")\n    if not terminal_official_pk_exact:\n        errors.append("terminal_manifest_official_game_pk_mismatch")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one terminal identity block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/unit/test_mlb_terminal_official_pk_alias.py')
          test.write_text(r'''from __future__ import annotations

import sys
from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]
HELLO_WORLD = ROOT / "hello_world"
if str(HELLO_WORLD) not in sys.path:
    sys.path.insert(0, str(HELLO_WORLD))

import mlb_slate_coverage_patch as coverage

SLATE = "2026-08-04"
START = "2026-08-04T23:05:00+00:00"
OFFICIAL_PK = "824805"


def _game():
    return {
        "officialGamePk": OFFICIAL_PK,
        "game_id": f"mlb_statsapi:{OFFICIAL_PK}",
        "id": f"mlb_statsapi:{OFFICIAL_PK}",
        "commence_time": START,
        "awayTeam": "Example Away",
        "homeTeam": "Example Home",
    }


def _legacy_terminal():
    return {
        "slate_date": SLATE,
        "game_identity": "provider:legacy-provider-event-824805",
        "game_id": "legacy-provider-event-824805",
        "officialGamePk": OFFICIAL_PK,
        "commence_time": START,
        "scheduled_lock_at_utc": "2026-08-04T22:20:00+00:00",
        "data": {
            "row": {
                "awayTeam": "Example Away",
                "homeTeam": "Example Home",
            }
        },
    }


def test_exact_official_pk_accepts_only_legacy_provider_identity_aliases():
    errors = coverage._terminal_outcome_manifest_game_errors(
        _legacy_terminal(), SLATE, _game()
    )
    assert "terminal_manifest_game_identity_mismatch" not in errors
    assert "terminal_manifest_game_id_mismatch" not in errors
    assert "terminal_manifest_official_game_pk_mismatch" not in errors


def test_official_pk_swap_still_fails_closed():
    item = _legacy_terminal()
    item["officialGamePk"] = "824806"
    errors = coverage._terminal_outcome_manifest_game_errors(item, SLATE, _game())
    assert "terminal_manifest_official_game_pk_mismatch" in errors
    assert "terminal_manifest_game_identity_mismatch" in errors
    assert "terminal_manifest_game_id_mismatch" in errors


def test_exact_official_pk_does_not_relax_start_time_guard():
    item = _legacy_terminal()
    item["commence_time"] = "2026-08-04T23:06:00+00:00"
    errors = coverage._terminal_outcome_manifest_game_errors(item, SLATE, _game())
    assert "terminal_manifest_game_identity_mismatch" not in errors
    assert "terminal_manifest_game_id_mismatch" not in errors
    assert "terminal_manifest_start_mismatch" in errors
''', encoding='utf-8')
          PY
      - name: Install focused verification runtime
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
      - name: Run focused and canonical R7 contracts
        run: |
          set -euo pipefail
          pytest -q \
            tests/unit/test_mlb_terminal_official_pk_alias.py \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_prospective_backlog_workflow.py \
            tests/unit/test_mlb_daily_per_game_lock_patch.py
      - name: Commit verified repair and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r7-aug4-official-pk-terminal-alias-once.yml
          git add hello_world/mlb_slate_coverage_patch.py tests/unit/test_mlb_terminal_official_pk_alias.py
          git commit -m 'Fix R7 terminal legacy identity under exact official gamePk'
          git push
