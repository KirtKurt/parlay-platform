name: R7 exact proof implementation source diagnostic once

"on":
  push:
    branches:
      - ops/r7-v2-remediation-orchestrator-20260829

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract exact proof implementation and recursive helper graph
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          path = Path('hello_world/mlb_prospective_row_repair.py')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()
          tree = ast.parse(source)
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          requested = [
              '_prove_cooperative_prelock_candidate_review_v2_impl',
              '_prove_cooperative_prelock_candidate_review_v2',
              '_validated_cooperative_terminal_evidence',
              '_cooperative_terminal_authority_evidence',
              '_cooperative_terminal_evidence_fingerprint',
              '_cooperative_terminal_item_fingerprint',
              '_strong_read_cooperative_terminal_item',
          ]
          selected = []
          queue = list(requested)
          while queue:
              name = queue.pop(0)
              if name in selected or name not in functions:
                  continue
              selected.append(name)
              node = functions[name]
              for child in ast.walk(node):
                  if isinstance(child, ast.Call) and isinstance(child.func, ast.Name):
                      called = child.func.id
                      if called in functions and called not in selected and called not in queue:
                          if any(token in called for token in (
                              'cooperative', 'terminal', 'manifest', 'candidate',
                              'proof', 'evidence', 'strong_read', 'identity',
                          )):
                              queue.append(called)
          report = {
              'proofType': 'R7_EXACT_PROOF_IMPLEMENTATION_SOURCE_DIAGNOSTIC',
              'sourcePath': str(path),
              'functions': {},
          }
          for name in selected:
              node = functions[name]
              report['functions'][name] = {
                  'startLine': node.lineno,
                  'endLine': node.end_lineno,
                  'source': '\n'.join(lines[node.lineno - 1:node.end_lineno]),
              }
          print(json.dumps(report, indent=2, sort_keys=True))
          Path('/tmp/r7-exact-proof-source.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r7-exact-proof-source-${{ github.run_id }}
          path: /tmp/r7-exact-proof-source.json
          if-no-files-found: error
          retention-days: 14
