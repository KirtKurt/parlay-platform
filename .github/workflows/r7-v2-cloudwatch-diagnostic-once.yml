name: R7 durable-evidence DynamoDB hash diagnostic once

"on":
  push:
    branches:
      - ops/r7-v2-remediation-orchestrator-20260829

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'boto3>=1.34,<2'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Compare stored, current, and DynamoDB-normalized evidence hashes
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          MLB_ROOT_STACK: parlay-platform-dev
        run: |
          set -euo pipefail
          cat > /tmp/r7_evidence_probe.py <<'PY'
          from __future__ import annotations
          import copy, hashlib, json
          from decimal import Decimal
          from pathlib import Path
          import mlb_daily_pick_lock_protected as protected
          import mlb_prospective_row_repair as repair

          raw = protected._read_cooperative_replay()
          progress = raw.get('terminal_replay_progress') or {}
          processed = progress.get('processedGames') or []
          if len(processed) != 1:
              raise SystemExit(f'unexpected processedGames count: {len(processed)}')
          entry = processed[0]
          evidence = copy.deepcopy(entry.get('durableEvidence') or {})
          terminal_state = str(entry.get('terminalState') or '')
          authority_count = 3 if terminal_state == repair.MISSED_LOCK_VALID_PRELOCK_CANDIDATE_NOT_PROMOTED else 0

          def normalize(value):
              if isinstance(value, Decimal):
                  if value.is_finite() and value == value.to_integral_value():
                      return int(value)
                  return str(value)
              if isinstance(value, dict):
                  return {str(k): normalize(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [normalize(v) for v in value]
              return value

          material = {str(k): v for k, v in evidence.items() if k != 'evidenceFingerprint'}
          normalized_material = normalize(material)
          current = hashlib.sha256(json.dumps(material, sort_keys=True, separators=(',', ':'), default=str).encode()).hexdigest()
          normalized = hashlib.sha256(json.dumps(normalized_material, sort_keys=True, separators=(',', ':'), default=str).encode()).hexdigest()
          stored = str(evidence.get('evidenceFingerprint') or '')
          items = evidence.get('items')
          report = {
              'proofType': 'R7_DURABLE_EVIDENCE_DDB_NUMERIC_HASH_DIAGNOSTIC',
              'readOnly': True,
              'terminalState': terminal_state,
              'authorityItemCountType': type(evidence.get('authorityItemCount')).__name__,
              'dependencyItemCountType': type(evidence.get('dependencyItemCount')).__name__,
              'itemCount': len(items) if isinstance(items, list) else None,
              'authorityItemCount': str(evidence.get('authorityItemCount')),
              'dependencyItemCount': str(evidence.get('dependencyItemCount')),
              'expectedAuthorityItemCount': authority_count,
              'roles': [str(item.get('tableRole') or '') for item in items] if isinstance(items, list) else [],
              'storedFingerprint': stored,
              'currentDefaultStrFingerprint': current,
              'ddbNormalizedFingerprint': normalized,
              'storedMatchesCurrentDefaultStr': stored == current,
              'storedMatchesDdbNormalized': stored == normalized,
              'manifestAuthorityFingerprintLength': len(str(evidence.get('manifestAuthorityEvidenceFingerprint') or '')),
              'durableIdentityMatches': str(evidence.get('durableIdentity') or '') == str(entry.get('durableIdentity') or ''),
              'terminalStateMatches': str(evidence.get('terminalState') or '') == terminal_state,
              'uniqueItemKeys': len({(str(i.get('tableRole')), str(i.get('PK')), str(i.get('SK'))) for i in items}) == len(items) if isinstance(items, list) else False,
              'directTableWrite': False,
              'immutablePredictionRewriteAllowed': False,
              'productionAuthorityChanged': False,
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          Path('/tmp/r7-evidence-hash-diagnostic.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
          python - <<'PY'
          import os, subprocess, sys, boto3
          from botocore.config import Config
          region=os.environ['AWS_REGION']; stack=os.environ['MLB_ROOT_STACK']
          cfg=Config(connect_timeout=10,read_timeout=60,retries={'total_max_attempts':3,'mode':'standard'})
          cfn=boto3.client('cloudformation',region_name=region,config=cfg); lam=boto3.client('lambda',region_name=region,config=cfg)
          fn=(cfn.describe_stack_resource(StackName=stack,LogicalResourceId='MLBDailyPickLockFunction').get('StackResourceDetail') or {}).get('PhysicalResourceId')
          env=dict(os.environ); env.update({str(k):str(v) for k,v in (((lam.get_function_configuration(FunctionName=fn).get('Environment') or {}).get('Variables') or {}).items())}); env['PYTHONPATH']=os.path.abspath('hello_world')
          raise SystemExit(subprocess.run([sys.executable,'/tmp/r7_evidence_probe.py'],env=env).returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-evidence-hash-diagnostic-${{ github.run_id }}
          path: /tmp/r7-evidence-hash-diagnostic.json
          if-no-files-found: error
          retention-days: 14
