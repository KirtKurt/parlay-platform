name: R7 durable-evidence proof source diagnostic once

"on":
  push:
    branches:
      - ops/r7-v2-remediation-orchestrator-20260829

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract exact proof builder and durable-evidence validators
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          path = Path('hello_world/mlb_prospective_row_repair.py')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()
          tree = ast.parse(source)
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          requested = [
              'prove_cooperative_prelock_candidate_review_v2',
              '_validated_cooperative_terminal_evidence',
              '_cooperative_terminal_authority_evidence',
              '_cooperative_terminal_evidence_fingerprint',
              '_cooperative_terminal_item_fingerprint',
              '_strong_read_cooperative_terminal_item',
          ]
          selected = []
          queue = list(requested)
          while queue:
              name = queue.pop(0)
              if name in selected or name not in functions:
                  continue
              selected.append(name)
              node = functions[name]
              for child in ast.walk(node):
                  if (
                      isinstance(child, ast.Call)
                      and isinstance(child.func, ast.Name)
                      and child.func.id.startswith('_cooperative_terminal')
                      and child.func.id in functions
                      and child.func.id not in selected
                  ):
                      queue.append(child.func.id)
          report = {
              'proofType': 'R7_DURABLE_EVIDENCE_SOURCE_DIAGNOSTIC',
              'sourcePath': str(path),
              'functions': {},
          }
          for name in selected:
              node = functions[name]
              report['functions'][name] = {
                  'startLine': node.lineno,
                  'endLine': node.end_lineno,
                  'source': '\n'.join(lines[node.lineno - 1:node.end_lineno]),
              }
          print(json.dumps(report, indent=2, sort_keys=True))
          Path('/tmp/r7-durable-evidence-source.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r7-durable-evidence-source-${{ github.run_id }}
          path: /tmp/r7-durable-evidence-source.json
          if-no-files-found: error
          retention-days: 14
