name: R7 protected v2 source diagnostic once

"on":
  push:
    branches:
      - ops/r7-v2-remediation-orchestrator-20260829

permissions:
  contents: read

concurrency:
  group: r7-protected-v2-source-diagnostic-once
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract exact remediation function and direct helpers
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          path = Path('hello_world/mlb_daily_pick_lock_protected.py')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()
          tree = ast.parse(source)
          target = '_requeue_prelock_candidate_review_after_installed_runtime_proof_v2'
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          node = functions.get(target)
          if node is None:
              raise SystemExit(f'{target} not found')
          direct_calls = sorted({
              child.func.id
              for child in ast.walk(node)
              if isinstance(child, ast.Call)
              and isinstance(child.func, ast.Name)
              and child.func.id.startswith('_')
          })
          selected = [target]
          selected.extend(name for name in direct_calls if name in functions)
          report = {
              'proofType': 'R7_PROTECTED_V2_SOURCE_DIAGNOSTIC',
              'sourcePath': str(path),
              'functions': {},
          }
          for name in selected:
              current = functions[name]
              start = current.lineno
              end = current.end_lineno
              report['functions'][name] = {
                  'startLine': start,
                  'endLine': end,
                  'source': '\n'.join(lines[start - 1:end]),
              }
          print(json.dumps(report, indent=2, sort_keys=True))
          Path('/tmp/r7-v2-source-diagnostic.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r7-v2-source-diagnostic-${{ github.run_id }}
          path: /tmp/r7-v2-source-diagnostic.json
          if-no-files-found: error
          retention-days: 14
