name: Engineering Console Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'engineering_console/**'
      - '.github/workflows/engineering-console-deploy.yml'
  workflow_dispatch:
    inputs:
      image_uri:
        description: 'Immutable ECR image URI including @sha256 digest'
        required: true
        type: string
      aws_region:
        description: 'AWS region'
        required: true
        default: us-east-1
        type: string
      stack_name:
        description: 'CloudFormation stack name'
        required: true
        default: inqsi-engineering-console
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install Console dependencies for tests
        working-directory: engineering_console
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Console syntax and tests
        working-directory: engineering_console
        run: |
          for file in src/*.js test/*.js scripts/*.mjs; do node --check "$file"; done
          sh -n scripts/container-entrypoint.sh
          npm test
      - name: Validate CloudFormation
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir cfn-lint
          cfn-lint engineering_console/deploy/template.yaml
      - name: Build runtime image
        run: docker build --pull -t inqsi-engineering-console:validation engineering_console
      - name: Verify changed scope contains no sports or ARB code
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          changed="$(git diff --name-only "$merge_base" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(engineering_console/|\.github/workflows/engineering-console-deploy\.yml$|frontend/app/api/engineering/|frontend/components/EngineeringConsole\.tsx$)' | grep -q .; then
            echo 'Unexpected non-Console file in deployment PR' >&2
            exit 1
          fi

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: engineering-console-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject mutable image references
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
        run: printf '%s' "$IMAGE_URI" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
      - name: Deploy isolated Console stack
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
          STACK_NAME: ${{ inputs.stack_name }}
          VPC_ID: ${{ vars.VPC_ID }}
          PRIVATE_SUBNET_A_ID: ${{ vars.PRIVATE_SUBNET_A_ID }}
          PRIVATE_SUBNET_B_ID: ${{ vars.PRIVATE_SUBNET_B_ID }}
          INGRESS_SECURITY_GROUP_ID: ${{ vars.INGRESS_SECURITY_GROUP_ID }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          CONSOLE_DOMAIN_NAME: ${{ vars.CONSOLE_DOMAIN_NAME }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
          JWKS_URI: ${{ vars.JWKS_URI }}
          ADMIN_CLAIM: ${{ vars.ADMIN_CLAIM }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          WORKER_OPENAI_SECRET_ARN: ${{ vars.WORKER_OPENAI_SECRET_ARN }}
          PUBLISHER_GITHUB_SECRET_ARN: ${{ vars.PUBLISHER_GITHUB_SECRET_ARN }}
        run: |
          set -eu
          for name in VPC_ID PRIVATE_SUBNET_A_ID PRIVATE_SUBNET_B_ID INGRESS_SECURITY_GROUP_ID CERTIFICATE_ARN HOSTED_ZONE_ID CONSOLE_DOMAIN_NAME OIDC_ISSUER OIDC_AUDIENCE JWKS_URI ADMIN_CLAIM ALLOWED_ORIGIN WORKER_OPENAI_SECRET_ARN PUBLISHER_GITHUB_SECRET_ARN; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then echo "Missing protected environment variable: $name" >&2; exit 1; fi
          done
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file engineering_console/deploy/template.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ImageUri="$IMAGE_URI" \
              VpcId="$VPC_ID" \
              PrivateSubnetAId="$PRIVATE_SUBNET_A_ID" \
              PrivateSubnetBId="$PRIVATE_SUBNET_B_ID" \
              IngressSecurityGroupId="$INGRESS_SECURITY_GROUP_ID" \
              CertificateArn="$CERTIFICATE_ARN" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              ConsoleDomainName="$CONSOLE_DOMAIN_NAME" \
              OidcIssuer="$OIDC_ISSUER" \
              OidcAudience="$OIDC_AUDIENCE" \
              JwksUri="$JWKS_URI" \
              AdminClaim="$ADMIN_CLAIM" \
              AllowedOrigin="$ALLOWED_ORIGIN" \
              WorkerOpenAISecretArn="$WORKER_OPENAI_SECRET_ARN" \
              PublisherGitHubSecretArn="$PUBLISHER_GITHUB_SECRET_ARN"
      - name: Capture deployed revision evidence
        env:
          STACK_NAME: ${{ inputs.stack_name }}
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' --output json
          cluster=$(aws cloudformation describe-stack-resource --stack-name "$STACK_NAME" --logical-resource-id Cluster --query 'StackResourceDetail.PhysicalResourceId' --output text)
          worker=$(aws cloudformation describe-stack-resource --stack-name "$STACK_NAME" --logical-resource-id WorkerService --query 'StackResourceDetail.PhysicalResourceId' --output text)
          publisher=$(aws cloudformation describe-stack-resource --stack-name "$STACK_NAME" --logical-resource-id PublisherService --query 'StackResourceDetail.PhysicalResourceId' --output text)
          aws ecs wait services-stable --cluster "$cluster" --services "$worker" "$publisher"
          aws ecs describe-services --cluster "$cluster" --services "$worker" "$publisher" \
            --query 'services[].{service:serviceName,taskDefinition:taskDefinition,running:runningCount,desired:desiredCount,rollout:deployments[0].rolloutState}' --output json
