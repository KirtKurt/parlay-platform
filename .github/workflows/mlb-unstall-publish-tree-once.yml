name: Build MLB Anti-Stall Commit Once

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-unstall-publish-tree-once
  cancel-in-progress: false

jobs:
  build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply and validate tested anti-stall repairs
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pyyaml>=6,<7'
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/mlb-unstall-algorithms-install-once.yml').read_text()
          )
          steps = workflow['jobs']['install']['steps']
          wanted = {
              'Apply deterministic anti-stall repairs',
              'Validate anti-stall contracts',
          }
          found = set()
          for step in steps:
              name = step.get('name')
              if name in wanted:
                  subprocess.run(['bash', '-lc', step['run']], check=True)
                  found.add(name)
          if found != wanted:
              raise SystemExit(f'missing installer steps: {sorted(wanted - found)}')
          PY

      - name: Create unattached Git commit object
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          files = [
              '.github/workflows/mlb-supervised-shadow-v2-recurring.yml',
              '.github/workflows/mlb-v8-historical-context-backfill.yml',
              '.github/workflows/mlb-v8-historical-bbs-backfill.yml',
              '.github/workflows/mlb-v8-shadow-realtime-72.yml',
              '.github/workflows/mlb-historical-supervised-v9-shadow.yml',
              'tests/unit/test_mlb_v8_historical_context_workflow.py',
              'tests/unit/test_mlb_v8_bbd_post_backfill_workflow_contract.py',
              'tests/unit/test_mlb_supervised_v2_runtime_integration.py',
          ]
          deletions = [
              '.github/workflows/mlb-unstall-algorithms-install-once.yml',
              '.github/workflows/mlb-unstall-export-once.yml',
              '.github/workflows/mlb-unstall-publish-tree-once.yml',
              '.github/workflows/mlb-unstall-dispatcher-once.yml',
          ]
          entries = [
              {
                  'path': path,
                  'mode': '100644',
                  'type': 'blob',
                  'content': Path(path).read_text(),
              }
              for path in files
          ]
          entries.extend(
              {'path': path, 'mode': '100644', 'type': 'blob', 'sha': None}
              for path in deletions
          )
          base_commit = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          base_tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()
          Path('/tmp/tree.json').write_text(
              json.dumps({'base_tree': base_tree, 'tree': entries})
          )
          repo = os.environ['GITHUB_REPOSITORY']
          tree = json.loads(subprocess.check_output(
              ['gh', 'api', '--method', 'POST', f'repos/{repo}/git/trees', '--input', '/tmp/tree.json'],
              text=True,
          ))
          Path('/tmp/commit-request.json').write_text(json.dumps({
              'message': 'Unstall MLB training and evidence pipelines',
              'tree': tree['sha'],
              'parents': [base_commit],
          }))
          commit = json.loads(subprocess.check_output(
              ['gh', 'api', '--method', 'POST', f'repos/{repo}/git/commits', '--input', '/tmp/commit-request.json'],
              text=True,
          ))
          result = {
              'baseCommit': base_commit,
              'treeSha': tree['sha'],
              'commitSha': commit['sha'],
              'validatedFiles': files,
              'deletedHelpers': deletions,
          }
          Path('/tmp/mlb-anti-stall-commit.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f"commit_sha={commit['sha']}\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload commit proof
        uses: actions/upload-artifact@v4
        with:
          name: mlb-anti-stall-commit-${{ github.run_id }}
          path: /tmp/mlb-anti-stall-commit.json
          retention-days: 7
          if-no-files-found: error
