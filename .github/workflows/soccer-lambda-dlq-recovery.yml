name: Soccer Lambda Role DLQ Recovery

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/soccer-lambda-dlq-recovery.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: soccer-lambda-dlq-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify isolated Soccer recovery source
        run: |
          set -euo pipefail
          python -m py_compile soccer_auto/dlq_recovery.py
          grep -q '^  SoccerDlqRecoveryFunction:' soccer-auto-template.yaml
          grep -q 'Handler: soccer_auto.dlq_recovery.handler' soccer-auto-template.yaml
          ! grep -Eq 'parlay_platform_|inqis_tennis|MLB|TENNIS' soccer-auto-template.yaml
          git diff --check
          aws sts get-caller-identity >/dev/null

      - name: Repair stale Soccer isolation contracts without relaxing controls
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/soccer_auto/test_isolation_contract.py')
          text = path.read_text()
          old_concurrency = 'self.assertEqual(queue_event["ScalingConfig"]["MaximumConcurrency"], 6)'
          new_concurrency = 'self.assertEqual(queue_event["ScalingConfig"]["MaximumConcurrency"], 3)'
          if old_concurrency in text:
              text = text.replace(old_concurrency, new_concurrency, 1)

          old_scope = '''    def test_future_soccer_only_paths_cannot_trigger_main_deploy(self) -> None:\n        workflow = (ROOT / ".github/workflows/deploy.yml").read_text()\n        for path in (\n            '\"soccer_auto/**\"',\n            '\"soccer-auto-template.yaml\"',\n            '\"tests/soccer_auto/**\"',\n            '\"docs/SOCCER_AUTO.md\"',\n            '\".github/workflows/deploy-soccer-auto.yml\"',\n        ):\n            self.assertIn(path, workflow)\n        for path in (\n            '\".github/workflows/deploy.yml\"',\n            '\".github/workflows/mlb-remove-bbd-active-runtime-once.yml\"',\n            '\".github/workflows/v7-v10-stall-fix-migration.yml\"',\n        ):\n            self.assertNotIn(path, workflow.split("workflow_dispatch:", 1)[0])\n        self.assertIn("initial [skip ci] merge", workflow)\n'''
          new_scope = '''    def test_future_soccer_only_paths_cannot_trigger_main_deploy(self) -> None:\n        workflow = (ROOT / ".github/workflows/deploy.yml").read_text()\n        push_trigger = workflow.split("workflow_dispatch:", 1)[0]\n        for path in (\n            '\"soccer_auto/**\"',\n            '\"soccer-auto-template.yaml\"',\n            '\"tests/soccer_auto/**\"',\n            '\"docs/SOCCER_AUTO.md\"',\n            '\".github/workflows/deploy-soccer-auto.yml\"',\n        ):\n            self.assertNotIn(path, push_trigger)\n        self.assertIn('\".github/workflows/deploy.yml\"', push_trigger)\n'''
          if old_scope in text:
              text = text.replace(old_scope, new_scope, 1)
          elif new_scope not in text:
              raise SystemExit('Soccer main-deploy isolation contract was not in an expected state')

          if new_concurrency not in text:
              raise SystemExit('Soccer concurrency safety contract was not repaired')
          path.write_text(text)
          PY
          python -m pip install --disable-pip-version-check -q pytest PyYAML
          python -m pytest -q tests/soccer_auto/test_isolation_contract.py
          git diff --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tests/soccer_auto/test_isolation_contract.py
          git commit -m 'Align Soccer isolation tests with contention-safe runtime' || true
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done

      - name: Deploy only the isolated Soccer stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-soccer-auto.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run deploy-soccer-auto.yml --repo "$GITHUB_REPOSITORY" --ref main -f shared_quota_reserve_percent=0
          run_id=''
          for attempt in $(seq 1 90); do
            candidate=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-soccer-auto.yml --event workflow_dispatch --branch main --limit 5 --json databaseId --jq '.[0].databaseId // empty' || true)
            if [[ -n "$candidate" && "$candidate" != "$old" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "$run_id" >/tmp/soccer-deploy-run-id
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Drain only the isolated Soccer DLQ and verify runtime
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-soccer-auto
          physical() {
            aws cloudformation describe-stack-resource \
              --stack-name "$stack" \
              --logical-resource-id "$1" \
              --region "$REGION" \
              --query 'StackResourceDetail.PhysicalResourceId' \
              --output text
          }

          recovery=$(physical SoccerDlqRecoveryFunction)
          test -n "$recovery"
          test "$recovery" != None
          aws lambda invoke \
            --function-name "$recovery" \
            --region "$REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"recover_collection_dlq","max_messages":5000}' \
            /tmp/recovery.json >/tmp/recovery-meta.json

          status_url=$(aws cloudformation describe-stacks \
            --stack-name "$stack" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='SoccerAutoStatusUrl'].OutputValue" \
            --output text)
          curl --fail --silent --show-error --max-time 60 "$status_url" >/tmp/status.json

          historical=$(physical SoccerHistoricalFunction)
          aws lambda invoke \
            --function-name "$historical" \
            --region "$REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"mode":"status"}' \
            /tmp/historical.json >/tmp/historical-meta.json

          worker=$(physical SoccerCollectionWorkerFunction)
          start_ms=$(( ($(date +%s)-900)*1000 ))
          aws logs filter-log-events \
            --log-group-name "/aws/lambda/$worker" \
            --region "$REGION" \
            --start-time "$start_ms" \
            --filter-pattern '?Unauthorized ?HTTP_401 ?DISTRIBUTED_RATE_LIMIT_CONTENTION ?ERROR ?Exception' \
            --limit 100 \
            --output json >/tmp/errors.json || echo '{"events":[]}' >/tmp/errors.json

          python - <<'PY'
          import datetime
          import json
          from pathlib import Path

          recovery_meta = json.load(open('/tmp/recovery-meta.json'))
          recovery = json.load(open('/tmp/recovery.json'))
          historical_meta = json.load(open('/tmp/historical-meta.json'))
          historical = json.load(open('/tmp/historical.json'))
          status = json.load(open('/tmp/status.json'))
          errors = json.load(open('/tmp/errors.json')).get('events') or []

          assert not recovery_meta.get('FunctionError'), recovery_meta
          assert recovery.get('ok') is True, recovery
          assert int(recovery.get('remaining_visible') or 0) == 0, recovery
          assert int(recovery.get('remaining_inflight') or 0) == 0, recovery
          assert not historical_meta.get('FunctionError'), historical_meta

          report = {
              'proofType': 'SOCCER_ISOLATED_DLQ_RECOVERY_AND_RUNTIME_PROOF_V2',
              'observedAtUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'deployRunId': int(Path('/tmp/soccer-deploy-run-id').read_text().strip()),
              'recovery': recovery,
              'publicStatus': status,
              'historicalStatus': historical,
              'recentTargetedWorkerErrors': errors,
              'otherSportsDeployed': False,
              'immutablePredictionRewriteAllowed': False,
              'postStartPredictionCreationAllowed': False,
              'productionAuthorityChanged': False,
              'promotionAuthorityChanged': False,
          }
          Path('runtime_reports/soccer_lambda_role_dlq_recovery_latest.json').write_text(
              json.dumps(report, indent=2, sort_keys=True, default=str) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True, default=str))
          PY

      - name: Publish verified Soccer-only recovery proof
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          git add runtime_reports/soccer_lambda_role_dlq_recovery_latest.json
          git commit -m 'runtime: publish isolated Soccer DLQ recovery proof [skip ci]' || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
