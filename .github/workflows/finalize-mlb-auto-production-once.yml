name: Finalize MLB AUTO production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-mlb-auto-production-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-mlb-auto-production-once
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-mlb-auto-llm
  ACTIVE_BEDROCK_MODELS: global.anthropic.claude-sonnet-4-20250514-v1:0,us.anthropic.claude-sonnet-4-20250514-v1:0,us.meta.llama3-3-70b-instruct-v1:0,meta.llama3-3-70b-instruct-v1:0,mistral.mistral-large-3-675b-instruct,mistral.ministral-3-3b-instruct,openai.gpt-5.6-sol,anthropic.claude-opus-4-8,anthropic.claude-opus-4-7,anthropic.claude-opus-4-6-v1,anthropic.claude-sonnet-4-6,us.amazon.nova-2-lite-v1:0,global.amazon.nova-2-lite-v1:0,us.amazon.nova-pro-v1:0,us.amazon.nova-lite-v1:0,us.amazon.nova-micro-v1:0
  REPORT_PATH: runtime_reports/mlb_auto_production_finalization_latest.json

jobs:
  deploy-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify strict three-source source contracts
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          aws sts get-caller-identity >/tmp/mlb-auto-caller.json
          python -m py_compile \
            mlb_auto_llm/handler.py \
            mlb_auto_llm/orchestrator.py \
            mlb_auto_llm/orchestrator_v2.py \
            mlb_auto_llm/model_gateway.py \
            mlb_auto_llm/bedrock_smoke.py
          python -m pytest -q tests/unit/test_mlb_auto_model_gateway.py
          sam validate --template-file mlb-auto-llm-template.yaml --lint
          grep -q 'Handler: orchestrator_v2.lambda_handler' mlb-auto-llm-template.yaml
          grep -q 'bedrock-mantle:CreateInference' mlb-auto-llm-template.yaml
          grep -q 'global.anthropic.claude-sonnet-4-20250514-v1:0' mlb-auto-llm-template.yaml
          grep -q 'mistral.mistral-large-3-675b-instruct' mlb-auto-llm-template.yaml
          grep -q 'mistral.ministral-3-3b-instruct' mlb-auto-llm-template.yaml
          grep -q 'THREE_SOURCE_GAME_COVERAGE_INCOMPLETE' mlb_auto_llm/orchestrator.py
          grep -q 'BEDROCK_DECISION_REQUIRED' mlb_auto_llm/orchestrator.py
          grep -q 'BEDROCK_LLM' mlb_auto_llm/orchestrator_v2.py
          grep -q 'condition="attribute_not_exists(PK)"' mlb_auto_llm/handler.py

      - name: Authenticate The Odds API and Big Balls Sports Data Pro
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          BBS_API_KEY_VALUE: ${{ secrets.BBS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}"
          test -n "${BBS_API_KEY_VALUE:-}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${BBS_API_KEY_VALUE}" \
            'https://api.bigballsdata.com/v1/user/me' > /tmp/mlb-auto-bbd-account.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/mlb-auto-bbd-account.json'))
          assert isinstance(value, dict) and value.get('data') is not None, value
          print('Big Balls Sports Data Pro authentication: PASS')
          PY
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://api.the-odds-api.com/v4/sports/baseball_mlb/odds/?apiKey=${ODDS_API_KEY_VALUE}&regions=us&markets=h2h&oddsFormat=decimal&dateFormat=iso" \
            > /tmp/mlb-auto-odds.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/mlb-auto-odds.json'))
          assert isinstance(value, list), type(value)
          print('The Odds API MLB authentication: PASS; events=', len(value))
          PY

      - name: Build and deploy isolated production stack
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          BBS_API_KEY_VALUE: ${{ secrets.BBS_API_KEY }}
        run: |
          set -euo pipefail
          sam build --no-cached --template-file mlb-auto-llm-template.yaml
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              OddsApiKey="${ODDS_API_KEY_VALUE}" \
              BbsApiKey="${BBS_API_KEY_VALUE}" \
              TargetDailyAccuracy='0.70' \
              CardLeadMinutesBeforeSecondGame='45' \
              BedrockModels="${ACTIVE_BEDROCK_MODELS}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Prove Bedrock authority through deployed Lambda role
        id: bedrock
        continue-on-error: true
        run: |
          set -euo pipefail
          smoke_function=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBAutoLLMBedrockSmokeFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          aws lambda invoke \
            --function-name "$smoke_function" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 240 \
            --payload '{}' \
            /tmp/mlb-auto-final-bedrock.json \
            > /tmp/mlb-auto-final-bedrock-invocation.json
          python - <<'PY'
          import json
          invocation=json.load(open('/tmp/mlb-auto-final-bedrock-invocation.json'))
          response=json.load(open('/tmp/mlb-auto-final-bedrock.json'))
          assert not invocation.get('FunctionError'), (invocation, response)
          assert response.get('ok') is True, response
          assert response.get('modelId'), response
          print('Bedrock authority: PASS via', response.get('modelId'))
          PY

      - name: Prove official three-source autonomous cycle
        id: cycle
        continue-on-error: true
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBAutoLLMFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          aws lambda invoke \
            --function-name "$function_name" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 900 \
            --payload '{"mode":"deployment_provider_smoke"}' \
            /tmp/mlb-auto-final-cycle.json \
            > /tmp/mlb-auto-final-cycle-invocation.json
          python - <<'PY'
          import json
          invocation=json.load(open('/tmp/mlb-auto-final-cycle-invocation.json'))
          response=json.load(open('/tmp/mlb-auto-final-cycle.json'))
          assert not invocation.get('FunctionError'), (invocation, response)
          assert response.get('ok') is True, response
          assert response.get('status') in {'COLLECTING','CARD_PUBLISHED','CARD_ALREADY_PUBLISHED','NO_GAMES'}, response
          source=response.get('sourceStatus') or {}
          for provider in ('mlbStatsApi','theOddsApi','bigBallsDataPro'):
              assert (source.get(provider) or {}).get('ok') is True, (provider, source)
          card=response.get('card') or {}
          picks=card.get('picks') or []
          if response.get('status') in {'CARD_PUBLISHED','CARD_ALREADY_PUBLISHED'}:
              assert picks, response
              assert card.get('threeSourceCoverageComplete') is True, card
              assert card.get('bedrockAuthorityComplete') is True, card
              assert all(row.get('decisionAuthority') == 'BEDROCK_LLM' for row in picks), picks
              assert all(row.get('gamePk') is not None for row in picks), picks
          print('Three-source cycle:', response.get('status'))
          PY

      - name: Prove public contract and enabled autonomous schedule
        id: schedule
        continue-on-error: true
        run: |
          set -euo pipefail
          status_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='MLBAutoLLMStatusUrl'].OutputValue" \
            --output text)
          function_arn=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBAutoLLMFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text | xargs -I{} aws lambda get-function --function-name {} --region "$AWS_REGION" --query 'Configuration.FunctionArn' --output text)
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$status_url" > /tmp/mlb-auto-final-status.json
          aws events list-rule-names-by-target \
            --target-arn "$function_arn" \
            --region "$AWS_REGION" \
            > /tmp/mlb-auto-final-rules.json
          python - <<'PY'
          import json, subprocess
          status=json.load(open('/tmp/mlb-auto-final-status.json'))
          rules=json.load(open('/tmp/mlb-auto-final-rules.json')).get('RuleNames') or []
          assert status.get('service') == 'mlb-auto-llm', status
          assert status.get('fullyAutonomous') is True, status
          assert set(status.get('threeSourcePolicy') or []) == {'MLB Stats API','The Odds API','Big Balls Sports Data Pro'}, status
          assert rules, rules
          enabled=[]
          for rule in rules:
              state=subprocess.check_output([
                  'aws','events','describe-rule','--name',rule,'--region','us-east-1',
                  '--query','State','--output','text'
              ], text=True).strip()
              if state == 'ENABLED':
                  enabled.append(rule)
          assert enabled, {'rules':rules}
          print('Enabled autonomous rules:', enabled)
          PY

      - name: Publish durable redacted finalization proof
        if: always()
        env:
          BEDROCK_OUTCOME: ${{ steps.bedrock.outcome }}
          CYCLE_OUTCOME: ${{ steps.cycle.outcome }}
          SCHEDULE_OUTCOME: ${{ steps.schedule.outcome }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              try:
                  value=json.loads(Path(path).read_text())
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}

          bedrock=load('/tmp/mlb-auto-final-bedrock.json')
          cycle=load('/tmp/mlb-auto-final-cycle.json')
          status=load('/tmp/mlb-auto-final-status.json')
          rules=load('/tmp/mlb-auto-final-rules.json')
          card=cycle.get('card') if isinstance(cycle.get('card'), dict) else {}
          picks=card.get('picks') if isinstance(card.get('picks'), list) else []
          source=cycle.get('sourceStatus') if isinstance(cycle.get('sourceStatus'), dict) else {}
          provider_ok={
              name: bool((source.get(name) or {}).get('ok'))
              for name in ('mlbStatsApi','theOddsApi','bigBallsDataPro')
          }
          report={
              'proofType':'MLB_AUTO_PRODUCTION_FINALIZATION',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'outcomes':{
                  'bedrock':os.environ.get('BEDROCK_OUTCOME'),
                  'cycle':os.environ.get('CYCLE_OUTCOME'),
                  'schedule':os.environ.get('SCHEDULE_OUTCOME'),
              },
              'bedrock':{
                  'ok':bedrock.get('ok'),
                  'modelId':bedrock.get('modelId'),
                  'endpointFamily':bedrock.get('endpointFamily'),
                  'attemptedModelIds':bedrock.get('attemptedModelIds') or [],
                  'errorsBeforeSuccess':bedrock.get('errorsBeforeSuccess') or [],
                  'errors':bedrock.get('errors') or [],
              },
              'providerCycle':{
                  'ok':cycle.get('ok'),
                  'status':cycle.get('status'),
                  'providerOk':provider_ok,
                  'sourceStatus':source,
                  'pickCount':len(picks),
                  'threeSourceCoverageComplete':card.get('threeSourceCoverageComplete'),
                  'bedrockAuthorityComplete':card.get('bedrockAuthorityComplete'),
                  'bedrockDecisionCount':sum(
                      row.get('decisionAuthority') == 'BEDROCK_LLM'
                      for row in picks if isinstance(row, dict)
                  ),
                  'gamePks':[
                      str(row.get('gamePk')) for row in picks
                      if isinstance(row, dict) and row.get('gamePk') is not None
                  ],
                  'publishedAtUtc':card.get('publishedAtUtc'),
                  'publicationDeadlineUtc':card.get('publicationDeadlineUtc'),
              },
              'publicStatus':{
                  'service':status.get('service'),
                  'fullyAutonomous':status.get('fullyAutonomous'),
                  'threeSourcePolicy':status.get('threeSourcePolicy'),
                  'targetDailyAccuracy':status.get('targetDailyAccuracy'),
                  'cardLeadMinutesBeforeSecondGame':status.get('cardLeadMinutesBeforeSecondGame'),
              },
              'eventRuleNames':rules.get('RuleNames') or [],
              'secretExposed':False,
          }
          report['ok']=(
              report['outcomes'] == {'bedrock':'success','cycle':'success','schedule':'success'}
              and report['bedrock']['ok'] is True
              and all(provider_ok.values())
              and report['publicStatus']['fullyAutonomous'] is True
              and bool(report['eventRuleNames'])
          )
          report['conclusion']='PASS' if report['ok'] else 'FAIL'
          Path(os.environ['REPORT_PATH']).write_text(
              json.dumps(report, indent=2, sort_keys=True, default=str)+'\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True, default=str))
          PY
          cp "$REPORT_PATH" /tmp/mlb-auto-production-finalization.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-auto-production-finalization-proof origin/main
            git reset --hard origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-auto-production-finalization.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && break
            git commit -m 'Publish MLB AUTO production finalization proof [skip ci]'
            if git push origin HEAD:main; then break; fi
            sleep $((attempt * 3))
          done

      - name: Require complete production acceptance
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('runtime_reports/mlb_auto_production_finalization_latest.json').read_text())
          assert report.get('ok') is True, report
          print('MLB AUTO production finalization: PASS')
          PY
