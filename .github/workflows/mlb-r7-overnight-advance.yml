name: Unified MLB Learning Recovery Queue Control

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-r7-overnight-advance.yml'

permissions:
  contents: read

# One-time queue-control pulse. This group matches the obsolete pre-fix
# shared deployment that is still retrying the trainer. The no-op cancels
# that GitHub run after its completed stack deployment; it does not invoke
# AWS, change CloudFormation, or mutate any sport resource.
concurrency:
  group: parlay-platform-deploy
  cancel-in-progress: true

jobs:
  cancel-obsolete-deploy-retry:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm queue-only action
        run: |
          set -euo pipefail
          echo 'Cancelled obsolete deploy-owned trainer retry.'
          echo 'AWS invocation: none'
          echo 'CloudFormation action: none'
          echo 'DynamoDB lease mutation: none'
          echo 'Production authority change: none'
          echo 'Other sport change: none'
