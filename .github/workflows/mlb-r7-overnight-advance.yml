name: Unified MLB Learning Recovery

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-r7-overnight-advance.yml'

permissions:
  contents: read

concurrency:
  group: unified-mlb-learning
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  MLB_ROOT_STACK: parlay-platform-dev
  TARGET_SLATE_DATE: '2026-08-25'
  MIN_ACCEPTED_ROWS: '33'

jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Checkout exact recovery source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install bounded verification dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            scripts/invoke_mlb_trainer_with_retry.py \
            scripts/mlb_scoring_guard_status.py \
            scripts/verify_unified_mlb_learning_ownership.py
          mkdir -p /tmp/unified-mlb-learning

      - name: Prove one automatic unified MLB learning owner
        run: |
          set -euo pipefail
          python scripts/verify_unified_mlb_learning_ownership.py \
            | tee /tmp/unified-mlb-learning/ownership-proof.json
          python -m pytest -q tests/unit/test_unified_mlb_learning_ownership.py

      - name: Resolve the deployed unified MLB trainer only
        run: |
          set -euo pipefail
          TRAINER_FN="$(aws cloudformation describe-stack-resource \
            --stack-name "$MLB_ROOT_STACK" \
            --logical-resource-id MLBMLTrainingFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          case "$TRAINER_FN" in
            *MLBMLTrainingFunction*) ;;
            *) echo 'Resolved resource is not the unified MLB trainer' >&2; exit 1 ;;
          esac
          echo "TRAINER_FN=$TRAINER_FN" >> "$GITHUB_ENV"
          aws lambda get-function-configuration \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --query '{FunctionName:FunctionName,State:State,LastUpdateStatus:LastUpdateStatus,Handler:Handler,MemorySize:MemorySize,Timeout:Timeout}' \
            --output json | tee /tmp/unified-mlb-learning/trainer-config.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/unified-mlb-learning/trainer-config.json').read_text())
          assert value.get('State') == 'Active', value
          assert value.get('LastUpdateStatus') == 'Successful', value
          assert value.get('Handler') == 'mlb_ml_aws_training_v1_compat.lambda_handler', value
          assert int(value.get('Timeout') or 0) == 900, value
          PY

      - name: Prove unified MLB production healthy before learning
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          CURRENT_SLATE_DATE="$(TZ=America/New_York date +%F)"
          echo "CURRENT_SLATE_DATE=$CURRENT_SLATE_DATE" >> "$GITHUB_ENV"
          python scripts/mlb_scoring_guard_status.py \
            --slate-date "$CURRENT_SLATE_DATE" \
            --region "$AWS_REGION" \
            --output /tmp/unified-mlb-learning/production-before.json \
            --enforce
          python scripts/mlb_scoring_guard_status.py \
            --slate-date "$TARGET_SLATE_DATE" \
            --region "$AWS_REGION" \
            --output /tmp/unified-mlb-learning/target-slate-before.json \
            --enforce
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/unified-mlb-learning/target-slate-before.json').read_text())
          summary = value.get('summary') or {}
          assert value.get('guardPassed') is True, value
          assert value.get('readOnly') is True, value
          assert int(summary.get('officialGameCount') or 0) == 15, summary
          assert int(summary.get('movementFeatureGameCount') or 0) == 15, summary
          assert int(summary.get('missingMovementCount') or 0) == 0, summary
          assert int(summary.get('persistedPredictionGameCount') or 0) == 15, summary
          print('The exact August 25 slate has 15/15 immutable movement and prediction coverage.')
          PY

      - name: Invoke one lease-safe unified MLB training run
        env:
          PYTHONPATH: .
          AWS_MAX_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"scheduled","run":"unified_mlb_learning_recovery"}' \
            --response /tmp/unified-mlb-learning/training.json \
            --invocation /tmp/unified-mlb-learning/training-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 2400 \
            --retry-delay-seconds 20

      - name: Capture selection state without activating authority
        env:
          PYTHONPATH: .
          AWS_MAX_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"selection_capture","run":"unified_mlb_learning_recovery_selection"}' \
            --response /tmp/unified-mlb-learning/selection.json \
            --invocation /tmp/unified-mlb-learning/selection-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 600 \
            --retry-delay-seconds 20

      - name: Bind exact fresh status and require real advancement
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --status-training-result /tmp/unified-mlb-learning/training.json \
            --status-selection-capture-result /tmp/unified-mlb-learning/selection.json \
            --response /tmp/unified-mlb-learning/status.json \
            --invocation /tmp/unified-mlb-learning/status-invocation.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          training = json.loads(Path('/tmp/unified-mlb-learning/training.json').read_text())
          selection = json.loads(Path('/tmp/unified-mlb-learning/selection.json').read_text())
          status = json.loads(Path('/tmp/unified-mlb-learning/status.json').read_text())
          health = status.get('trainingHealth') or {}
          selection_health = status.get('selectionCaptureHealth') or {}
          latest = health.get('latestRun') or training
          continuity = latest.get('canonicalSlateContinuity') or {}
          finalized = set(continuity.get('finalizedGameSlateDates') or [])
          processed = set(continuity.get('processedSlateDates') or [])
          target = os.environ['TARGET_SLATE_DATE']
          minimum = int(os.environ['MIN_ACCEPTED_ROWS'])
          accepted = int(latest.get('acceptedRowCount') or 0)
          rejected = int(latest.get('rejectedRowCount') or 0)
          partition_counts = latest.get('partitionCounts') or ((latest.get('milestones') or {}).get('counts') or {})
          train_count = int(partition_counts.get('train') or 0)

          result = {
            'ok': training.get('ok') is True and selection.get('ok') is True and status.get('ok') is True,
            'acceptedRowCount': accepted,
            'rejectedRowCount': rejected,
            'partitionCounts': partition_counts,
            'targetSlateDate': target,
            'targetSlateFinalizedAndAdmitted': target in finalized and target in processed,
            'processedThroughSlateDate': continuity.get('processedThroughSlateDate'),
            'blockedSlateDate': continuity.get('blockedSlateDate'),
            'continuityBlocker': continuity.get('blocker'),
            'trainingDeploymentIdentityMatches': health.get('deploymentIdentityMatches'),
            'selectionDeploymentIdentityMatches': selection_health.get('deploymentIdentityMatches'),
            'minimumAcceptedRows': minimum,
            'advancedToMinimum': accepted >= minimum and train_count >= minimum,
            'automaticPromotionEnabled': latest.get('automaticPromotionEnabled'),
            'championChanged': latest.get('championChanged'),
            'liveInferenceAuthority': latest.get('liveInferenceAuthority'),
            'productionAuthorityChanged': latest.get('productionAuthorityChanged'),
            'immutablePredictionRewriteAllowed': False,
            'postStartPredictionCreationAllowed': False,
            'otherSportChanged': False,
          }
          Path('/tmp/unified-mlb-learning/acceptance.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(result, indent=2, sort_keys=True))

          assert result['ok'] is True, result
          assert rejected == 0, result
          assert target in finalized, result
          assert target in processed, result
          assert continuity.get('blockedSlateDate') in (None, ''), result
          assert continuity.get('blocker') in (None, ''), result
          assert health.get('deploymentIdentityMatches') is True, result
          assert selection_health.get('deploymentIdentityMatches') is True, result
          assert accepted >= minimum, result
          assert train_count >= minimum, result
          assert latest.get('automaticPromotionEnabled') is not True, result
          assert latest.get('championChanged') is not True, result
          assert latest.get('liveInferenceAuthority') is not True, result
          assert latest.get('productionAuthorityChanged') is not True, result
          PY

      - name: Prove unified MLB production remained healthy
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/mlb_scoring_guard_status.py \
            --slate-date "$CURRENT_SLATE_DATE" \
            --region "$AWS_REGION" \
            --output /tmp/unified-mlb-learning/production-after.json \
            --enforce
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/unified-mlb-learning/production-before.json').read_text())
          after = json.loads(Path('/tmp/unified-mlb-learning/production-after.json').read_text())
          b = before.get('summary') or {}
          a = after.get('summary') or {}
          assert before.get('guardPassed') is True, before
          assert after.get('guardPassed') is True, after
          assert not before.get('blockers'), before
          assert not after.get('blockers'), after
          assert int(a.get('officialGameCount') or 0) == int(b.get('officialGameCount') or 0), (b, a)
          assert int(a.get('persistedPredictionGameCount') or 0) >= int(b.get('persistedPredictionGameCount') or 0), (b, a)
          assert int(a.get('invalidPredictionTeamCount') or 0) == 0, a
          assert int(a.get('invalidMovementTeamCount') or 0) == 0, a
          print('Unified MLB production stayed healthy while accepted training rows advanced.')
          PY

      - name: Upload immutable unified MLB recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-mlb-learning-recovery-${{ github.run_id }}
          path: /tmp/unified-mlb-learning
          if-no-files-found: warn
          retention-days: 90
