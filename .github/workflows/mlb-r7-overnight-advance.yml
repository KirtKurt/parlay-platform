name: Unified MLB Learning Recovery Queue Control

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-r7-overnight-advance.yml'

permissions:
  contents: read

# One-time queue-control pulse. This group matches the obsolete pre-fix
# workflow and cancels its retry loop. It does not invoke AWS.
concurrency:
  group: mlb-r7-overnight-advance
  cancel-in-progress: true

jobs:
  cancel-obsolete-retry:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm queue-only action
        run: |
          set -euo pipefail
          echo 'Cancelled obsolete pre-fix GitHub retry loop.'
          echo 'AWS invocation: none'
          echo 'DynamoDB lease mutation: none'
          echo 'Production authority change: none'
          echo 'Other sport change: none'
