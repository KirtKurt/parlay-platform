name: Unified MLB Learning Recovery Queue Control

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-r7-overnight-advance.yml'

permissions:
  contents: read

# One active recovery is already running on the verified repair source.
# This no-op uses the same permanent concurrency group so GitHub replaces
# the older duplicate pending run without cancelling the active recovery.
concurrency:
  group: unified-mlb-learning
  cancel-in-progress: false

jobs:
  replace-duplicate-pending-run:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm queue-only action
        run: |
          set -euo pipefail
          echo 'Duplicate pending recovery replaced by no-op.'
          echo 'Active recovery cancellation: false'
          echo 'AWS invocation: none'
          echo 'DynamoDB lease mutation: none'
          echo 'Production authority change: none'
          echo 'Other sport change: none'
