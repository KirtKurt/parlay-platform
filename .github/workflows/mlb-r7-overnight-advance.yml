name: MLB R8 Overnight Advancement Evidence Queue
run-name: "MLB R8 overnight evidence queue ${{ github.event_name }} #${{ github.run_number }}"

# Compatibility path retained so old bookmarks/manual aliases keep working.
# The active learning owner is R8; this workflow no longer dispatches the
# retired R7 one-shot recovery contract.
"on":
  workflow_dispatch:
    inputs:
      force:
        description: Seed the durable R8 evidence watchdog even after a recent success
        required: false
        default: false
        type: boolean
  schedule:
    # Two off-boundary wake-ups per hour. The job itself admits only 00:00-06:59 ET.
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-r7-overnight-advance.yml'
      - 'tests/unit/test_mlb_r7_overnight_queue_control.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mlb-r7-overnight-advance.yml'
      - 'tests/unit/test_mlb_r7_overnight_queue_control.py'

permissions:
  contents: read

concurrency:
  group: mlb-r8-overnight-evidence-queue
  cancel-in-progress: false

env:
  MLB_ACTIVE_EXPERIMENT_ID: mlb-v2-2026-08-31-historical-live-r8
  MLB_DURABLE_WATCHDOG_WORKFLOW: mlb-progress-pulse-watchdog.yml
  MLB_PROGRESS_WORKFLOW: mlb-30m-progress-pulse.yml
  MLB_DURABLE_WATCHDOG_RECENT_MINUTES: '12'

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact queue-control contract
        uses: actions/checkout@v4

      - name: Prove active-R8 overnight evidence contract
        run: python tests/unit/test_mlb_r7_overnight_queue_control.py

  queue-active-r8-evidence:
    needs: validate-source
    if: github.event_name != 'pull_request'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seed durable R8 evidence and request one stale-gated pulse
        uses: actions/github-script@v7
        env:
          FORCE_INPUT: ${{ inputs.force }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;
            const force = (
              eventName === 'workflow_dispatch'
              && String(process.env.FORCE_INPUT || '').toLowerCase() === 'true'
            );
            const now = new Date();
            const newYorkHourPart = new Intl.DateTimeFormat(
              'en-US',
              {
                timeZone: 'America/New_York',
                hour: '2-digit',
                hourCycle: 'h23',
              },
            ).formatToParts(now).find((part) => part.type === 'hour');
            const nyHour = Number(newYorkHourPart?.value);

            if (
              eventName === 'schedule'
              && !(Number.isInteger(nyHour) && nyHour >= 0 && nyHour < 7)
            ) {
              core.notice(
                `Scheduled R8 evidence pulse skipped outside 00:00-06:59 America/New_York; hour=${nyHour}`
              );
              return;
            }

            const activeStatuses = new Set([
              'queued',
              'in_progress',
              'waiting',
              'pending',
              'requested',
            ]);
            const watchdogWorkflow = process.env.MLB_DURABLE_WATCHDOG_WORKFLOW;
            const progressWorkflow = process.env.MLB_PROGRESS_WORKFLOW;
            const recentMinutes = Number(
              process.env.MLB_DURABLE_WATCHDOG_RECENT_MINUTES
            );
            if (!Number.isFinite(recentMinutes) || recentMinutes <= 0) {
              throw new Error('invalid_durable_watchdog_recent_minutes');
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: watchdogWorkflow,
                branch: 'main',
                per_page: 100,
              },
            );
            const active = runs.find(
              (run) => activeStatuses.has(String(run.status || ''))
            );
            const recentCutoff = Date.now() - (recentMinutes * 60 * 1000);
            const recentSuccess = runs.find((run) => (
              run.status === 'completed'
              && run.conclusion === 'success'
              && new Date(run.created_at).getTime() >= recentCutoff
            ));

            let watchdogDispatch = 'not_required';
            if (active) {
              watchdogDispatch = `already_active:${active.id}`;
            } else if (recentSuccess && !force) {
              watchdogDispatch = `recent_success:${recentSuccess.id}`;
            } else {
              const baselineIds = new Set(runs.map((run) => Number(run.id)));
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: watchdogWorkflow,
                ref: 'main',
              });
              let observed = null;
              for (let attempt = 0; attempt < 18; attempt += 1) {
                await new Promise((resolve) => setTimeout(resolve, 5000));
                const refreshed = await github.paginate(
                  github.rest.actions.listWorkflowRuns,
                  {
                    owner,
                    repo,
                    workflow_id: watchdogWorkflow,
                    branch: 'main',
                    per_page: 100,
                  },
                );
                observed = refreshed.find((run) => (
                  run.event === 'workflow_dispatch'
                  && !baselineIds.has(Number(run.id))
                ));
                if (observed) {
                  break;
                }
              }
              if (!observed) {
                throw new Error('durable_r8_watchdog_seed_not_observable');
              }
              watchdogDispatch = `seeded:${observed.id}`;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: progressWorkflow,
              ref: 'main',
              inputs: {
                force: 'false',
              },
            });

            const result = {
              ok: true,
              eventName,
              newYorkHour: nyHour,
              force,
              activeExperimentId: process.env.MLB_ACTIVE_EXPERIMENT_ID,
              watchdogDispatch,
              progressWorkflow,
              reporterForce: false,
              automaticTrainerOwner: 'eventbridge_schedule',
              legacyR7RecoveryDispatched: false,
              awsInvocation: false,
              dynamoDbMutation: false,
              predictionOrLockMutation: false,
              productionAuthorityChanged: false,
              otherSportChanged: false,
            };
            core.info(JSON.stringify(result, null, 2));
            await core.summary
              .addHeading('MLB R8 overnight advancement evidence queue')
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Active experiment', process.env.MLB_ACTIVE_EXPERIMENT_ID],
                ['Durable watchdog', watchdogDispatch],
                ['Progress pulse', `${progressWorkflow} force=false`],
                ['Automatic trainer owner', 'eventbridge_schedule'],
                ['Legacy R7 recovery dispatched', 'false'],
              ])
              .write();
