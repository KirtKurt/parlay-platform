name: Fix MLB R7 lock timeout and lease contract now

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mlb-r7-lock-timeout-lease-contract-now.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Serialize source repair and the protected continuity deployment lane.
concurrency:
  group: repair-mlb-training-continuity-now
  cancel-in-progress: true

jobs:
  patch-test-and-redispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Prevent deployment overlap with the active exact-date replay
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_RECOVERY_RUN_ID: '32901445609'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACTIVE_RECOVERY_RUN_ID" --jq .status 2>/dev/null || echo completed)"
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 30
          done
          # A run still active after the existing 300-second Lambda timeout plus
          # a generous runner margin is stale. Cancel only this MLB recovery run
          # before changing the deployed timeout/lease contract.
          gh run cancel "$ACTIVE_RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
          for attempt in $(seq 1 10); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACTIVE_RECOVERY_RUN_ID" --jq .status 2>/dev/null || echo completed)"
            [ "$status" = "completed" ] && exit 0
            sleep 10
          done
          echo "Exact-date recovery did not stop; refusing overlapping deployment." >&2
          exit 1

      - name: Checkout latest main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Align MLB lock timeout and global lease with terminal replay
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path("template.yaml"),
              Path("scripts/patch_template_mlb_v1.py"),
              Path("scripts/verify_mlb_deploy_identity.py"),
              Path("scripts/verify_mlb_schedule_invariants.py"),
              Path("hello_world/mlb_daily_pick_lock_protected.py"),
              Path("hello_world/mlb_daily_per_game_lock_patch.py"),
              Path("tests/unit/test_mlb_daily_pick_lock_runtime.py"),
              Path("tests/unit/test_mlb_deploy_identity.py"),
              Path("tests/unit/test_mlb_daily_per_game_lock.py"),
          ]

          def patch_resource(text: str, *, source_name: str) -> str:
              # Update only the MLBDailyPickLockFunction resource. This works on
              # template.yaml and on the embedded SAM resource in the patcher.
              marker = "MLBDailyPickLockFunction:"
              positions = [m.start() for m in re.finditer(marker, text)]
              if not positions:
                  raise SystemExit(f"{source_name}: lock resource marker missing")
              result = text
              offset = 0
              changed_resource = False
              for original_start in positions:
                  start = original_start + offset
                  tail = result[start:]
                  # YAML resource ends at the next two-space resource. Embedded
                  # resource strings can run to the next triple-quote; either is
                  # a safe upper bound for these exact key replacements.
                  candidates = []
                  next_resource = re.search(r"(?m)^  [A-Za-z][A-Za-z0-9]*:\s*$", tail[len(marker):])
                  if next_resource:
                      candidates.append(len(marker) + next_resource.start())
                  triple = tail.find('"""', len(marker))
                  if triple >= 0:
                      candidates.append(triple)
                  end_rel = min(candidates) if candidates else len(tail)
                  block = tail[:end_rel]
                  new_block = re.sub(r"(?m)^(\s*Timeout:\s*)300\s*$", r"\g<1>900", block)
                  new_block = new_block.replace("MLB_LOCK_EXECUTION_LEASE_SECONDS: '360'", "MLB_LOCK_EXECUTION_LEASE_SECONDS: '960'")
                  if new_block != block:
                      result = result[:start] + new_block + result[start + len(block):]
                      offset += len(new_block) - len(block)
                      changed_resource = True
              if not changed_resource and "Timeout: 900" not in result:
                  raise SystemExit(f"{source_name}: no lock timeout/lease contract found")
              return result

          for path in paths:
              text = path.read_text(encoding="utf-8")
              original = text

              if path.name in {"template.yaml", "patch_template_mlb_v1.py"}:
                  text = patch_resource(text, source_name=str(path))
                  text = text.replace(
                      "lease_environment = \"          MLB_LOCK_EXECUTION_LEASE_SECONDS: '360'\\n\"",
                      "lease_environment = \"          MLB_LOCK_EXECUTION_LEASE_SECONDS: '960'\\n\"",
                  )

              # Named constants and environment defaults are unambiguous.
              text = text.replace("LOCK_EXECUTION_LEASE_REQUIRED_SECONDS = 360", "LOCK_EXECUTION_LEASE_REQUIRED_SECONDS = 960")
              text = text.replace("LOCK_EXECUTION_LEASE_SECONDS = 360", "LOCK_EXECUTION_LEASE_SECONDS = 960")
              text = text.replace('LOCK_EXECUTION_LEASE_SECONDS = "360"', 'LOCK_EXECUTION_LEASE_SECONDS = "960"')
              text = text.replace("LOCK_TIMEOUT_SECONDS = 300", "LOCK_TIMEOUT_SECONDS = 900")
              text = re.sub(
                  r'(MLB_LOCK_EXECUTION_LEASE_SECONDS\"?,\s*)[\"\']360[\"\']',
                  lambda m: m.group(1) + ('\"960\"' if '\"' in m.group(0) else "'960'"),
                  text,
              )
              text = text.replace('_lock_execution_lease_seconds == 360', '_lock_execution_lease_seconds == 960')
              text = text.replace('"lambdaTimeoutSeconds": 300', '"lambdaTimeoutSeconds": 900')

              # Focused invariant/test lines may compare literal values rather
              # than named constants. Change only lines whose subject is the MLB
              # lock timeout or lease.
              updated_lines = []
              for line in text.splitlines(keepends=True):
                  lowered = line.lower()
                  if any(token in lowered for token in (
                      "lockexecutionlease",
                      "lock_execution_lease",
                      "mlb_lock_execution_lease",
                      "lock timeout",
                      "lock_timeout",
                      "lambdatimeoutseconds",
                  )):
                      line = re.sub(r"(?<!\d)360(?!\d)", "960", line)
                      line = re.sub(r"(?<!\d)300(?!\d)", "900", line)
                  updated_lines.append(line)
              text = "".join(updated_lines)

              if text != original:
                  path.write_text(text, encoding="utf-8")

          template = Path("template.yaml").read_text(encoding="utf-8")
          lock_block = template.split("\n  MLBDailyPickLockFunction:\n", 1)[1].split("\n  MLBProductionVerifierFunction:\n", 1)[0]
          assert "Timeout: 900" in lock_block
          assert "MLB_LOCK_EXECUTION_LEASE_SECONDS: '960'" in lock_block

          protected = Path("hello_world/mlb_daily_pick_lock_protected.py").read_text(encoding="utf-8")
          assert "LOCK_EXECUTION_LEASE_REQUIRED_SECONDS = 960" in protected
          assert '"lambdaTimeoutSeconds": 900' in protected
          assert "_lock_execution_lease_seconds == 960" in protected

          per_game = Path("hello_world/mlb_daily_per_game_lock_patch.py").read_text(encoding="utf-8")
          assert "LOCK_EXECUTION_LEASE_SECONDS = 960" in per_game
          PY

      - name: Prove fail-closed MLB lock and continuity contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m py_compile \
            hello_world/mlb_daily_pick_lock_protected.py \
            hello_world/mlb_daily_per_game_lock_patch.py \
            scripts/patch_template_mlb_v1.py \
            scripts/verify_mlb_deploy_identity.py \
            scripts/verify_mlb_schedule_invariants.py \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py
          PYTHONPATH="hello_world:scripts:${PYTHONPATH:-}" python -m pytest -q \
            tests/unit/test_mlb_daily_pick_lock_runtime.py \
            tests/unit/test_mlb_daily_per_game_lock.py \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5.py
          python scripts/verify_mlb_schedule_invariants.py

      - name: Verify MLB-only safety boundary
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -ge 4
          for path in "${changed[@]}"; do
            case "$path" in
              template.yaml|scripts/patch_template_mlb_v1.py|scripts/verify_mlb_deploy_identity.py|scripts/verify_mlb_schedule_invariants.py|hello_world/mlb_daily_pick_lock_protected.py|hello_world/mlb_daily_per_game_lock_patch.py|tests/unit/test_mlb_daily_pick_lock_runtime.py|tests/unit/test_mlb_deploy_identity.py|tests/unit/test_mlb_daily_per_game_lock.py) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          grep -q 'Timeout: 900' template.yaml
          grep -q "MLB_LOCK_EXECUTION_LEASE_SECONDS: '960'" template.yaml
          grep -q 'LOCK_EXECUTION_LEASE_SECONDS = 960' hello_world/mlb_daily_per_game_lock_patch.py
          grep -q 'LOCK_EXECUTION_LEASE_REQUIRED_SECONDS = 960' hello_world/mlb_daily_pick_lock_protected.py
          grep -q 'read_timeout=930' scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'immutablePredictionRewriteAllowed": False' scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'promotionAuthorityChanged": False' scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'productionAuthorityChanged": False' scripts/reconcile_mlb_prospective_backlog_v4.py

      - name: Commit tested MLB timeout and lease correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            template.yaml \
            scripts/patch_template_mlb_v1.py \
            scripts/verify_mlb_deploy_identity.py \
            scripts/verify_mlb_schedule_invariants.py \
            hello_world/mlb_daily_pick_lock_protected.py \
            hello_world/mlb_daily_per_game_lock_patch.py \
            tests/unit/test_mlb_daily_pick_lock_runtime.py \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_mlb_daily_per_game_lock.py
          if git diff --cached --quiet; then
            echo "Timeout and lease correction already present."
          else
            git commit -m "Align MLB R7 lock timeout and lease for terminal replay"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            test "$pushed" = true
          fi

      - name: Verify remote main and dispatch protected MLB continuity repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:template.yaml | awk '
            /^  MLBDailyPickLockFunction:/{inside=1}
            /^  MLBProductionVerifierFunction:/{inside=0}
            inside{print}
          ' | grep -q 'Timeout: 900'
          git show origin/main:template.yaml | grep -q "MLB_LOCK_EXECUTION_LEASE_SECONDS: '960'"
          gh workflow run repair-mlb-training-continuity-now.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "Dispatched protected MLB-only continuity repair after timeout/lease alignment."
