name: MLB Auto Critical Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-auto-critical-repair-once.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: mlb-auto-critical-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      STACK_NAME: parlay-platform-dev
      ROGUE_RULE: parlay-platform-mlb-auto-prod-train-1h
      SNAPSHOTS_TABLE: parlay_platform_snapshots
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Disable exact noncanonical MLB Auto training writer
        run: |
          set -euo pipefail
          if aws events describe-rule --name "$ROGUE_RULE" --region "$AWS_REGION" >/tmp/rogue_before.json 2>/tmp/rogue_err.txt; then
            BEFORE=$(python -c 'import json; print(json.load(open("/tmp/rogue_before.json")).get("State","UNKNOWN"))')
            echo "rogue_rule_before=$BEFORE"
            if [ "$BEFORE" = "ENABLED" ]; then
              aws events disable-rule --name "$ROGUE_RULE" --region "$AWS_REGION"
            fi
            AFTER=$(aws events describe-rule --name "$ROGUE_RULE" --region "$AWS_REGION" --query State --output text)
            echo "rogue_rule_after=$AFTER"
            [ "$AFTER" = "DISABLED" ] || { echo "::error::Rogue MLB Auto training rule is still $AFTER"; exit 1; }
          else
            echo "rogue_rule_absent=true"
          fi

      - name: Resolve and verify canonical MLB ingest authority
        run: |
          set -euo pipefail
          PULL_FN=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBAuditedPullFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          [ -n "$PULL_FN" ] && [ "$PULL_FN" != "None" ]
          echo "PULL_FN=$PULL_FN" >> "$GITHUB_ENV"
          aws lambda get-function --function-name "$PULL_FN" --region "$AWS_REGION" \
            --query '{state:Configuration.State,lastUpdateStatus:Configuration.LastUpdateStatus,lastModified:Configuration.LastModified}' \
            --output json
          STATE=$(aws lambda get-function-configuration --function-name "$PULL_FN" --region "$AWS_REGION" --query State --output text)
          UPDATE=$(aws lambda get-function-configuration --function-name "$PULL_FN" --region "$AWS_REGION" --query LastUpdateStatus --output text)
          [ "$STATE" = "Active" ] && [ "$UPDATE" = "Successful" ] || { echo "::error::Canonical ingest Lambda is not healthy"; exit 1; }
          FN_ARN=$(aws lambda get-function --function-name "$PULL_FN" --region "$AWS_REGION" --query 'Configuration.FunctionArn' --output text)
          RULES=$(aws events list-rule-names-by-target --target-arn "$FN_ARN" --region "$AWS_REGION" --query 'RuleNames' --output json)
          echo "canonical_ingest_rules=$RULES"
          [ "$(printf '%s' "$RULES" | jq 'length')" -gt 0 ] || { echo "::error::No EventBridge rule targets canonical MLB ingest"; exit 1; }
          ENABLED=0
          while IFS= read -r rule; do
            STATE=$(aws events describe-rule --name "$rule" --region "$AWS_REGION" --query State --output text)
            SCHEDULE=$(aws events describe-rule --name "$rule" --region "$AWS_REGION" --query ScheduleExpression --output text)
            echo "canonical_rule=$rule state=$STATE schedule=$SCHEDULE"
            [ "$STATE" = "ENABLED" ] && ENABLED=$((ENABLED+1))
          done < <(printf '%s' "$RULES" | jq -r '.[]')
          [ "$ENABLED" -gt 0 ] || { echo "::error::Canonical MLB ingest has no enabled EventBridge schedule"; exit 1; }

      - name: Force one canonical live MLB ingest and capture failure diagnostics
        id: force_ingest
        continue-on-error: true
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$PULL_FN" \
            --region "$AWS_REGION" \
            --log-type Tail \
            --cli-binary-format raw-in-base64-out \
            --payload '{"force":true,"run":"critical_recovery"}' \
            /tmp/mlb_pull_response.json > /tmp/mlb_pull_meta.json
          python - <<'PY'
          import base64, json, re
          meta=json.load(open('/tmp/mlb_pull_meta.json'))
          raw=open('/tmp/mlb_pull_response.json', encoding='utf-8').read().strip()
          log=''
          if meta.get('LogResult'):
              try: log=base64.b64decode(meta['LogResult']).decode('utf-8','replace')
              except Exception: pass
          def clean(s):
              s=re.sub(r'(?i)(api[_-]?key|authorization|token)(\s*[:=]\s*)[^\s,;]+', r'\1\2[REDACTED]', s)
              return s[-7000:]
          print('invoke_status=', meta.get('StatusCode'))
          print('function_error=', meta.get('FunctionError'))
          print('tail_log_start')
          print(clean(log))
          print('tail_log_end')
          if raw:
              try: obj=json.loads(raw)
              except Exception: obj={'raw':raw[:1500]}
              print('response_summary=', clean(json.dumps(obj, default=str))[:3000])
          if meta.get('FunctionError'):
              raise SystemExit('Canonical MLB ingest Lambda returned FunctionError: '+str(meta.get('FunctionError')))
          if raw:
              obj=json.loads(raw)
              status=obj.get('statusCode') if isinstance(obj,dict) else None
              body=obj.get('body') if isinstance(obj,dict) else None
              if status is not None and int(status) >= 400:
                  raise SystemExit('Canonical MLB ingest returned HTTP-style failure status '+str(status))
              if isinstance(body,str):
                  try: parsed=json.loads(body)
                  except Exception: parsed={}
                  if parsed.get('ok') is False:
                      raise SystemExit('Canonical MLB ingest returned ok=false')
          PY

      - name: Verify fresh canonical pull reached DynamoDB
        id: verify_fresh
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 5
          SLATE_DATE=$(TZ=America/New_York date +%F)
          PK="PULLS#mlb#${SLATE_DATE}"
          aws dynamodb query \
            --region "$AWS_REGION" \
            --table-name "$SNAPSHOTS_TABLE" \
            --key-condition-expression 'PK = :pk' \
            --expression-attribute-values "{\":pk\":{\"S\":\"$PK\"}}" \
            --consistent-read \
            --output json > /tmp/mlb_pulls_after.json
          python scripts/mlb_pull_guard_status.py \
            --slate-date "$SLATE_DATE" \
            --pulls-json /tmp/mlb_pulls_after.json \
            --aws-ok true \
            --output /tmp/mlb_pull_after.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/mlb_pull_after.json'))
          print(json.dumps({k:p.get(k) for k in ['fresh','latestRawPullAt','latestRawPullAgeMinutes','watchdogReason','missingCleanScheduledSlots']}, indent=2))
          if p.get('fresh') is not True:
              raise SystemExit('Canonical MLB ingest is still stale after forced recovery')
          PY

      - name: Verify no MLB alarms are currently ALARM
        id: verify_alarms
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          aws cloudwatch describe-alarms --state-value ALARM --region "$AWS_REGION" --output json > /tmp/alarms.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/alarms.json'))
          rows=[]
          for key in ('MetricAlarms','CompositeAlarms'):
              for a in d.get(key) or []:
                  n=str(a.get('AlarmName') or '')
                  if 'mlb' in n.lower(): rows.append(n)
          print('active_mlb_alarms=', rows)
          if rows: raise SystemExit('Active MLB alarms remain: '+', '.join(rows))
          PY

      - name: Fail if recovery is incomplete after collecting diagnostics
        if: always()
        run: |
          set -euo pipefail
          echo "force_ingest_outcome=${{ steps.force_ingest.outcome }}"
          echo "fresh_pull_outcome=${{ steps.verify_fresh.outcome }}"
          echo "alarm_check_outcome=${{ steps.verify_alarms.outcome }}"
          if [ "${{ steps.force_ingest.outcome }}" != "success" ]; then
            echo "::error::Canonical MLB ingest recovery is still failing"
            exit 1
          fi
          if [ "${{ steps.verify_fresh.outcome }}" != "success" ]; then
            echo "::error::Canonical MLB pull is still stale"
            exit 1
          fi
          if [ "${{ steps.verify_alarms.outcome }}" != "success" ]; then
            echo "::error::One or more MLB alarms remain active"
            exit 1
          fi

      - name: Disable this one-shot repair workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/mlb-auto-critical-repair-once.yml/disable"

# recovery proof rerun 2026-08-14
