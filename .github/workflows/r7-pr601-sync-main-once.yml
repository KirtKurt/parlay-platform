name: R7 PR601 sync current main once

on:
  push:
    branches:
      - codex/mlb-valid-prelock-quarantine-v4-567
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge current main without rewriting branch history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-ff --no-edit origin/main
          merge_rc=$?
          set -e
          if [[ "$merge_rc" -ne 0 ]]; then
            for path in \
              hello_world/mlb_daily_pick_lock_protected.py \
              tests/unit/test_mlb_daily_pick_lock_runtime.py; do
              echo "===== CONFLICT $path ====="
              git checkout --conflict=diff3 -- "$path"
              grep -n -B 20 -A 60 -E '^(<<<<<<<|\|\|\|\|\|\|\||=======|>>>>>>>)' "$path" || true
            done
            exit "$merge_rc"
          fi
          git diff --check origin/main...HEAD
      - name: Install focused verification runtime
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
      - name: Compile repaired production modules
        run: |
          python -m py_compile \
            hello_world/mlb_slate_coverage_patch.py \
            hello_world/mlb_daily_per_game_lock_patch.py \
            hello_world/mlb_canonical_final_labels_v1.py
      - name: Verify repaired R7 contracts on merged tree
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: hello_world:tests/unit
        run: |
          python -m pytest -q \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_cooperative_terminal_chunk.py \
            tests/unit/test_mlb_public_per_game_authority.py \
            tests/unit/test_mlb_r7_terminal_identity_regression.py
      - name: Push verified merge commit
        run: git push origin HEAD:codex/mlb-valid-prelock-quarantine-v4-567
