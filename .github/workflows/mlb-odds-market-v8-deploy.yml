name: MLB Odds Market V8 Legacy Disable

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-odds-market-v8-deploy.yml'

permissions:
  contents: read

concurrency:
  group: parlay-platform-mlb-odds-market-v8-legacy-disable
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-odds-market-v8

jobs:
  disable-legacy-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Validate legacy template
        run: |
          set -euo pipefail
          sam validate --lint --template-file mlb_odds_market_v8/template.yaml
      - name: Build legacy stack safely
        run: |
          set -euo pipefail
          rm -rf .aws-sam-v8-legacy
          sam build --no-cached --build-dir .aws-sam-v8-legacy --template-file mlb_odds_market_v8/template.yaml
      - name: Force legacy schedule disabled
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}"
          sam deploy \
            --template-file .aws-sam-v8-legacy/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --force-upload \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              "DeployGitSha=${GITHUB_SHA}" \
              "ScheduleEnabled=false" \
              "FeaturedRegions=us" \
              "EventRegions=us,us2" \
              "PlayerPropsEnabled=false" \
              "MaxCreditsPerCycle=100" \
              "MaxEventsPerCycle=2"
      - name: Prove legacy schedule is absent
        run: |
          set -euo pipefail
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='V8CollectorFunctionName'].OutputValue" \
            --output text)
          test -n "$FUNCTION_NAME"
          FUNCTION_ARN=$(aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'Configuration.FunctionArn' --output text)
          RULE_COUNT=$(aws events list-rule-names-by-target \
            --target-arn "$FUNCTION_ARN" \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'length(RuleNames)' --output text)
          test "$RULE_COUNT" = '0'
          echo '{"legacyStack":"schedule_disabled","ruleCount":0,"productionAuthorityChanged":false}' > /tmp/mlb-v8-legacy-disabled.json
      - name: Upload shutdown proof
        uses: actions/upload-artifact@v4
        with:
          name: mlb-v8-legacy-disabled-${{ github.sha }}
          path: /tmp/mlb-v8-legacy-disabled.json
          retention-days: 90
