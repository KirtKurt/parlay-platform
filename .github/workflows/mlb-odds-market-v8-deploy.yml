name: MLB Odds Market V8 Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_odds_market_expansion_v8.py'
      - 'hello_world/mlb_odds_market_expansion_v8_handler.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'mlb_odds_market_v8/**'
      - 'tests/unit/test_mlb_odds_market_expansion_v8.py'
      - '.github/workflows/mlb-odds-market-v8-deploy.yml'

permissions:
  contents: write

concurrency:
  group: parlay-platform-mlb-odds-market-v8
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-odds-market-v8

jobs:
  validate-deploy-canary-enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate V8 source and contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile hello_world/mlb_odds_market_expansion_v8.py hello_world/mlb_odds_market_expansion_v8_handler.py hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py
          python -m pytest -q tests/unit/test_mlb_odds_market_expansion_v8.py
          sam validate --lint --template-file mlb_odds_market_v8/template.yaml

      - name: Build isolated V8 stack
        run: |
          set -euo pipefail
          rm -rf .aws-sam-v8
          sam build --no-cached --build-dir .aws-sam-v8 --template-file mlb_odds_market_v8/template.yaml
          test -f .aws-sam-v8/V8CollectorFunction/mlb_odds_market_expansion_v8_handler.py
          test -f .aws-sam-v8/V8CollectorFunction/mlb_odds_market_expansion_v8.py

      - name: Deploy schedule-disabled canary
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}"
          sam deploy --template-file .aws-sam-v8/template.yaml --stack-name "$STACK_NAME" --region "${{ secrets.AWS_REGION }}" --capabilities CAPABILITY_IAM --resolve-s3 --force-upload --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "OddsApiKey=${ODDS_API_KEY_VALUE}" "DeployGitSha=${GITHUB_SHA}" "ScheduleEnabled=false" "FeaturedRegions=us" "EventRegions=us,us2" "PlayerPropsEnabled=false" "MaxCreditsPerCycle=500" "MaxEventsPerCycle=8"

      - name: Invoke and verify cost-guarded canary
        run: |
          set -euo pipefail
          FUNCTION_NAME=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='V8CollectorFunctionName'].OutputValue" --output text)
          test -n "$FUNCTION_NAME"; test "$FUNCTION_NAME" != None
          aws lambda invoke --function-name "$FUNCTION_NAME" --region "${{ secrets.AWS_REGION }}" --cli-read-timeout 360 --cli-binary-format raw-in-base64-out --payload '{"mode":"v8_canary"}' /tmp/mlb-v8-canary.json
          cat /tmp/mlb-v8-canary.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/mlb-v8-canary.json').read_text())
          if value.get('ok') is not True:
              raise SystemExit(f'V8 canary failed: {value}')
          if value.get('status')!='COLLECTED_SHADOW':
              raise SystemExit(f'unexpected V8 status: {value}')
          contract=value.get('contract') or {}
          if contract.get('authority')!='SHADOW_ONLY' or contract.get('productionV7Unchanged') is not True:
              raise SystemExit('V8 authority isolation failed')
          budget=value.get('estimatedBudget') or {}
          if budget.get('withinBudget') is not True:
              raise SystemExit('V8 cost guard failed')
          if int(value.get('writtenEventCount') or 0)<1:
              raise SystemExit('V8 collector wrote no event features')
          PY

      - name: Enable 15-minute V8 shadow schedule
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          sam deploy --template-file .aws-sam-v8/template.yaml --stack-name "$STACK_NAME" --region "${{ secrets.AWS_REGION }}" --capabilities CAPABILITY_IAM --resolve-s3 --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "OddsApiKey=${ODDS_API_KEY_VALUE}" "DeployGitSha=${GITHUB_SHA}" "ScheduleEnabled=true" "ScheduleExpression=rate(15 minutes)" "FeaturedRegions=us" "EventRegions=us,us2" "PlayerPropsEnabled=false" "MaxCreditsPerCycle=500" "MaxEventsPerCycle=8"

      - name: Publish durable V8 deployment evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('/tmp/mlb-v8-canary.json'); canary=None
          if p.exists():
              try: canary=json.loads(p.read_text())
              except Exception as exc: canary={'parseError':f'{type(exc).__name__}:{exc}'}
          report={'proofType':'MLB_ODDS_MARKET_V8_DEPLOYMENT','createdAtUtc':datetime.now(timezone.utc).isoformat(),'jobStatus':os.environ['JOB_STATUS'],'sourceSha':os.environ['SOURCE_SHA'],'runId':os.environ['RUN_ID'],'runUrl':os.environ['RUN_URL'],'canary':canary}
          path=Path('runtime_reports/mlb_odds_market_v8_latest.json'); path.parent.mkdir(parents=True,exist_ok=True); path.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git add runtime_reports/mlb_odds_market_v8_latest.json
          git commit -m 'Publish MLB Odds market V8 deployment evidence' || exit 0
          for attempt in 1 2 3; do git push origin main && exit 0; git pull --rebase origin main; done
          exit 1
