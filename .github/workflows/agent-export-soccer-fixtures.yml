name: Agent export soccer isolation fixtures

on:
  push:
    branches:
      - agent/soccer-authority-repair

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package unchanged isolation fixtures
        shell: bash
        run: |
          set -euo pipefail
          tar -czf soccer-isolation-fixtures.tgz \
            .github/workflows/deploy.yml \
            .github/workflows/mlb-remove-bbd-active-runtime-once.yml \
            .github/workflows/v7-v10-stall-fix-migration.yml \
            docs/SOCCER_AUTO.md
      - uses: actions/upload-artifact@v4
        with:
          name: soccer-isolation-fixtures
          path: soccer-isolation-fixtures.tgz
          if-no-files-found: error
          retention-days: 1
