name: KS1 Phase 1 game table
on:
  workflow_dispatch:
    inputs:
      date:
        description: Optional YYYY-MM-DD to rebuild only that date
        required: false
        type: string
  push:
    branches: [main]
    paths: ['ks1/**', 'tests/ks1/**', '.github/workflows/ks1-phase1.yml']
  pull_request:
    paths: ['ks1/**', 'tests/ks1/**', 'docs/ks1/**', '.github/workflows/ks1-phase1.yml']
permissions:
  contents: read
concurrency:
  group: ks1-phase1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  phase1:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ks1/requirements.txt 'pytest>=8,<9'
      - name: Verify time boundaries, missingness and date publication
        run: python -m pytest -q tests/ks1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Build from retained data; publish only from main
        env:
          KS1_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          args=(--output /tmp/ks1-phase1)
          if [[ -n "$KS1_DATE" ]]; then args+=(--date "$KS1_DATE"); fi
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            args+=(--publish)
          fi
          python -m ks1.build "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ks1-phase1-${{ github.run_id }}
          path: /tmp/ks1-phase1/
          if-no-files-found: error
          retention-days: 90
