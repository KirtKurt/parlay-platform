name: MLB Historical Direct Deploy V6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-direct-deploy-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HIST_STACK: parlay-platform-mlb-historical-optimizer

jobs:
  deploy-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: mlb-historical-direct-deploy-v6
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prove repaired handler is committed
        run: |
          set -euo pipefail
          python -m py_compile hello_world/mlb_historical_optimizer_handler.py hello_world/mlb_historical_daily_optimizer_v1.py
          grep -Fq 'provider_snapshot_too_stale' hello_world/mlb_historical_optimizer_handler.py
          grep -Fq 'continue' hello_world/mlb_historical_optimizer_handler.py

      - name: Run focused tests
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'cfn-lint>=1,<2'
          PYTHONPATH=hello_world python -m pytest -q \
            tests/unit/test_mlb_historical_daily_optimizer_v1.py \
            tests/unit/test_mlb_historical_optimizer_handler.py \
            tests/unit/test_mlb_historical_policy_v1.py
          sam validate --lint --template-file mlb_historical_optimizer/template.yaml

      - name: Verify historical stack is isolated
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          HIST_FN=$(aws cloudformation describe-stacks --stack-name "$HIST_STACK" --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" --output text)
          test -n "$HIST_FN"
          PROD_FNS=$(aws cloudformation describe-stack-resources --stack-name parlay-platform-dev --region "$AWS_REGION_VALUE" --query "StackResources[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" --output text || true)
          for fn in $PROD_FNS; do
            test "$fn" != "$HIST_FN"
          done
          echo "HIST_FN=$HIST_FN" >> "$GITHUB_ENV"

      - name: Build historical optimizer
        run: |
          set -euo pipefail
          rm -rf .aws-sam-historical-v6
          sam build --no-cached --build-dir .aws-sam-historical-v6 --template-file mlb_historical_optimizer/template.yaml

      - name: Deploy historical optimizer only
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          sam deploy \
            --template-file .aws-sam-historical-v6/template.yaml \
            --stack-name "$HIST_STACK" \
            --region "$AWS_REGION_VALUE" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --force-upload \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              'TargetSnapshotsTable=parlay_platform_snapshots' \
              'HistoricalStartDate=2025-04-01' \
              'HistoricalEndDate=2025-08-31' \
              'HistoricalTargetGames=1600' \
              'HistoricalMaxCredits=120000' \
              'HistoricalRequestsPerRun=100' \
              'HistoricalMaxCandidates=25000' \
              'HistoricalMaxOptimizationRounds=6' \
              'HistoricalFreshAuditIncrementGames=250' \
              "DeployGitSha=$(git rev-parse HEAD)"

      - name: Verify deployed Lambda package contains repair
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          URL=$(aws lambda get-function --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --query 'Code.Location' --output text)
          curl -fsSL "$URL" -o /tmp/historical-lambda.zip
          unzip -p /tmp/historical-lambda.zip mlb_historical_optimizer_handler.py | grep -Fq 'provider_snapshot_too_stale'

      - name: Invoke repaired optimizer twice
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          aws lambda invoke --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload '{"mode":"orchestrate","run":"direct_deploy_v6_1"}' /tmp/run1.json >/tmp/meta1.json
          sleep 5
          aws lambda invoke --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload '{"mode":"orchestrate","run":"direct_deploy_v6_2"}' /tmp/run2.json >/tmp/meta2.json
          aws lambda invoke --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload '{"mode":"status","run":"direct_deploy_v6_status"}' /tmp/status.json >/tmp/status-meta.json

      - name: Require repaired runtime and publish proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          value=json.load(open('/tmp/status.json'))
          state=value.get('state') or {}
          proof={
            'checkedAt': datetime.now(timezone.utc).isoformat(),
            'version': value.get('version'),
            'phase': state.get('phase'),
            'currentDate': state.get('currentDate'),
            'currentSlotIndex': state.get('currentSlotIndex'),
            'networkRequestCount': state.get('networkRequestCount'),
            'eligibleGameCount': state.get('eligibleGameCount'),
            'completeSlateCount': state.get('completeSlateCount'),
            'optimizationRound': state.get('optimizationRound'),
            'lastError': state.get('lastError'),
          }
          print(json.dumps(proof,indent=2))
          assert 'too stale for a 15-minute grid' not in str(proof['lastError'] or ''), proof
          assert (proof['currentDate'], int(proof['currentSlotIndex'] or 0)) != ('2025-04-14',72), proof
          import os
          os.makedirs('docs/runtime',exist_ok=True)
          json.dump(proof,open('docs/runtime/mlb-historical-direct-deploy-v6-proof.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/mlb-historical-direct-deploy-v6-proof.json
          git commit -m 'chore: publish MLB historical direct deploy v6 proof'
          git push
