name: MLB Supervised V2 Validation Diagnostic

"on":
  pull_request:
    paths:
      - 'hello_world/mlb_supervised_*.py'
      - 'tests/unit/test_mlb_supervised_shadow_v2.py'
      - '.github/workflows/mlb-supervised-v2-diagnostic-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
      - name: Compile supervised modules
        run: |
          python -m py_compile \
            hello_world/mlb_supervised_features_v2.py \
            hello_world/mlb_supervised_model_v2.py \
            hello_world/mlb_supervised_v8_dataset_patch_v1.py
      - name: Run supervised unit tests with full diagnostics
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONPATH=hello_world python -m pytest -vv --tb=long \
            tests/unit/test_mlb_supervised_shadow_v2.py \
            2>&1 | tee /tmp/mlb-supervised-v2-tests.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-supervised-v2-validation-${{ github.run_id }}
          path: /tmp/mlb-supervised-v2-tests.log
          retention-days: 30
          if-no-files-found: error
      - name: Enforce test result
        if: always()
        run: test "${{ steps.tests.outputs.exit_code }}" = 0
