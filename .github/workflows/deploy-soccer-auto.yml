name: Deploy Isolated Soccer Auto

# Soccer deployment is manual-only after the verified publication-authority
# repair. The main workflow ignores all soccer-only paths, and this stack cannot
# mutate MLB, tennis, or legacy soccer resources.
on:
  workflow_dispatch:
    inputs:
      shared_quota_reserve_percent:
        description: Percent of shared all-sports credits soccer must leave untouched
        required: true
        default: '0'
        type: choice
        options: ['0', '20', '40', '60', '80']
permissions:
  contents: read

concurrency:
  group: soccer-auto-deploy
  # Recovery builds supersede older queued/deploying snapshots. This prevents
  # stale code from landing after a newer root-cause fix.
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - name: Verify isolated source and contracts
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}" || { echo '::error::Missing existing all-sports ODDS_API_KEY'; exit 1; }
          case '${{ secrets.AWS_REGION }}' in
            us-east-1|us-east-2|us-west-2) ;;
            *) echo '::error::Soccer Nova 2 US CRIS deployment requires a supported US AWS region'; exit 1 ;;
          esac
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m py_compile soccer_auto/*.py
          python -m pytest -q tests/soccer_auto
          python scripts/verify_soccer_auto_isolation.py
          python - <<'PY'
          from pathlib import Path
          text = Path('soccer-auto-template.yaml').read_text()
          forbidden = (
              'Mlb', 'MLB', 'Tennis', 'tennis_', 'LegacySoccer',
              'sportsdata', 'bigballs', 'BBD_API', 'BBS_API',
          )
          for value in forbidden:
              assert value not in text, value
          print('isolated_template_contract_ok')
          PY
      - name: Build isolated Soccer stack
        run: |
          set -euo pipefail
          sam build --template-file soccer-auto-template.yaml
      - name: Deploy isolated Soccer stack
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          SOCCER_SHARED_QUOTA_RESERVE_PERCENT: ${{ inputs.shared_quota_reserve_percent }}
        run: |
          set -euo pipefail
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name parlay-platform-soccer-auto \
            --region '${{ secrets.AWS_REGION }}' \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              OddsApiKey="$ODDS_API_KEY_VALUE" \
              EnableHistoricalBackfill=true \
              SharedQuotaReservePercent="$SOCCER_SHARED_QUOTA_RESERVE_PERCENT"
      - name: Verify historical schedules are enabled
        run: |
          set -euo pipefail
          stack_name=parlay-platform-soccer-auto
          region='${{ secrets.AWS_REGION }}'
          for logical_id in \
            SoccerHistoricalFunctionFeaturedHistoricalHourly \
            SoccerHistoricalFunctionAdditionalHistoricalHourly \
            SoccerHistoricalFunctionMaterializeHistoricalT45Hourly
          do
            rule=$(aws cloudformation describe-stack-resource \
              --stack-name "$stack_name" \
              --logical-resource-id "$logical_id" \
              --region "$region" \
              --query StackResourceDetail.PhysicalResourceId \
              --output text)
            test -n "$rule" && test "$rule" != None
            state=$(aws events describe-rule --name "$rule" --region "$region" --query State --output text)
            test "$state" = ENABLED
          done
      - name: Exercise provider, backfill, Bedrock, trainer, and prediction authorities
        env:
          SOCCER_SHARED_QUOTA_RESERVE_PERCENT: ${{ inputs.shared_quota_reserve_percent }}
        run: |
          set -euo pipefail
          stack_name=parlay-platform-soccer-auto
          region='${{ secrets.AWS_REGION }}'
          function_name() {
            aws cloudformation describe-stack-resource \
              --stack-name "$stack_name" \
              --logical-resource-id "$1" \
              --region "$region" \
              --query StackResourceDetail.PhysicalResourceId \
              --output text
          }
          invoke_and_assert_ok() {
            logical_id="$1"
            payload="$2"
            output_name="$3"
            response_policy="${4:-strict}"
            fn=$(function_name "$logical_id")
            aws lambda invoke \
              --function-name "$fn" \
              --region "$region" \
              --cli-binary-format raw-in-base64-out \
              --payload "$payload" \
              "/tmp/${output_name}.json" \
              > "/tmp/${output_name}-meta.json"
            python - "$output_name" "$response_policy" <<'PY'
          import json
          import pathlib
          import sys
          from datetime import datetime, timezone

          name = sys.argv[1]
          policy = sys.argv[2]
          metadata = json.loads(pathlib.Path(f"/tmp/{name}-meta.json").read_text())
          response = json.loads(pathlib.Path(f"/tmp/{name}.json").read_text())
          print(name, response)
          assert not metadata.get("FunctionError"), metadata
          if response.get("ok") is True:
              raise SystemExit(0)
          assert policy == "allow_daily_quota", (policy, response)
          assert response.get("ok") is False, response
          assert response.get("status") == "DEFERRED_QUOTA", response
          assert response.get("reason") == "BEDROCK_ALL_FALLBACK_MODELS_UNAVAILABLE", response
          assert response.get("analysis_available") is False, response
          errors = response.get("model_errors") or []
          assert errors, response
          assert all(row.get("error_code") == "ThrottlingException" and row.get("category") == "DAILY_TOKEN_QUOTA" for row in errors), response
          retry_after = datetime.fromisoformat(str(response["retry_after"]).replace("Z", "+00:00"))
          assert retry_after > datetime.now(timezone.utc), response
          PY
          }
          status_url=$(aws cloudformation describe-stacks --stack-name "$stack_name" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='SoccerAutoStatusUrl'].OutputValue" --output text)
          test -n "$status_url"
          curl --fail --retry 10 --retry-all-errors --retry-delay 10 "$status_url" >/tmp/soccer-status-before.json
          invoke_and_assert_ok SoccerCatalogFunction '{"action":"deployment_catalog_smoke"}' catalog
          invoke_and_assert_ok SoccerInventoryFunction '{"action":"deployment_inventory_smoke"}' inventory
          invoke_and_assert_ok SoccerSettlementFunction '{"action":"reconcile_admissibility_only"}' settlement_reconcile
          invoke_and_assert_ok SoccerHistoricalFunction '{"mode":"status"}' historical_status
          invoke_and_assert_ok SoccerHistoricalFunction '{"mode":"featured","sport_key":"soccer_epl","max_calls":1}' historical_featured
          invoke_and_assert_ok SoccerHistoricalFunction '{"mode":"materialize","max_events":5}' historical_materialize
          invoke_and_assert_ok SoccerControllerFunction '{"action":"deployment_controller_smoke"}' controller_before_llm
          invoke_and_assert_ok SoccerDispatchFunction '{"action":"deployment_dispatch_before_llm"}' dispatch_before_llm
          invoke_and_assert_ok SoccerLlmAnalystFunction '{"action":"deployment_llm_smoke","force_refresh":true}' llm allow_daily_quota
          invoke_and_assert_ok SoccerTrainerFunction '{"action":"deployment_trainer_smoke"}' trainer
          invoke_and_assert_ok SoccerControllerFunction '{"action":"deployment_controller_post_llm"}' controller_after_llm
          invoke_and_assert_ok SoccerDispatchFunction '{"action":"deployment_dispatch_smoke"}' dispatch
          invoke_and_assert_ok SoccerFreezeFunction '{"action":"deployment_dual_lock_smoke"}' freeze
          invoke_and_assert_ok SoccerControllerFunction '{"action":"deployment_final_health_proof"}' controller_final
          curl --fail --retry 10 --retry-all-errors --retry-delay 10 "$status_url" >/tmp/soccer-status-after.json
          python - <<'PY'
          import json
          status=json.load(open('/tmp/soccer-status-after.json'))
          assert status['system']=='soccer_auto', status
          assert status['all_component_liveness_complete'] is True, status
          assert status['historical_backfill']['enabled'] is True, status
          assert int(status['provider_429_telemetry']['rolling_count']) == 0, status
          print('soccer_deployment_final_status', status.get('authority'), status.get('reason'))
          PY
