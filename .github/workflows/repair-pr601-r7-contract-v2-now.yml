name: Repair PR601 R7 contract v2 now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pr601-r7-contract-v2-now.yml'

permissions:
  contents: write

concurrency:
  group: repair-pr601-r7-contract-v2-now
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "4df94cf3383618b0a990bc41d55e2c955e2e12f2"
      - name: Apply fail-closed roster repair and fixture alignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          labels_path = Path('hello_world/mlb_canonical_final_labels_v1.py')
          public_test_path = Path('tests/unit/test_mlb_public_per_game_authority.py')
          alias_test_path = Path('tests/unit/test_mlb_cooperative_terminal_chunk.py')

          labels = labels_path.read_text()
          public_tests = public_test_path.read_text()
          alias_tests = alias_test_path.read_text()

          old = '''        if not official_pk:\n            errors.append("terminal_official_game_pk_unresolved")\n        elif official_game_list:\n'''
          new = '''        if not official_pk:\n            errors.append("terminal_official_game_pk_unresolved")\n            # Exact official-roster admission must also record that the\n            # terminal row could not be uniquely bound to one roster member.\n            # This is strictly fail-closed; no row is admitted on ambiguity.\n            if official_game_list:\n                errors.append("terminal_official_manifest_game_ambiguous")\n                errors.append("terminal_manifest_official_roster_binding_unresolved")\n        elif official_game_list:\n'''
          if labels.count(old) != 1:
              raise SystemExit('terminal roster binding block mismatch')
          labels = labels.replace(old, new, 1)

          old = '''G1["officialGamePk"] = "810001"\nG2["officialGamePk"] = "810002"\nG1["books"] = {"fanduel": {"ml": {"home": -110, "away": 100}}}\n'''
          new = '''G1["officialGamePk"] = "810001"\nG2["officialGamePk"] = "810002"\n# Provider-manifest construction consumes the persisted snake_case field; keep\n# the public camelCase projection too so these fixtures exercise the exact same\n# official-game binding as production Stats-API-backed pulls.\nG1["official_game_pk"] = G1["officialGamePk"]\nG2["official_game_pk"] = G2["officialGamePk"]\nG1["books"] = {"fanduel": {"ml": {"home": -110, "away": 100}}}\n'''
          if public_tests.count(old) != 1:
              raise SystemExit('public official-pk fixture block mismatch')
          public_tests = public_tests.replace(old, new, 1)

          old = '''    token = real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.set(4)\n    try:\n        real_patch._candidate_items(object(), SLATE, game, scoring[:3])\n    finally:\n        real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.reset(\n            token\n        )\n    assert len(calls) == 4\n'''
          new = '''    # root + stable Stats API fallback + three provider aliases = five.\n    # The stable fallback is required for a candidate persisted before a later\n    # provider-event identity became available, so cap the test after it rather\n    # than testing it away.\n    token = real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.set(5)\n    try:\n        real_patch._candidate_items(object(), SLATE, game, scoring[:3])\n    finally:\n        real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.reset(\n            token\n        )\n    assert len(calls) == 5\n'''
          if alias_tests.count(old) != 1:
              raise SystemExit('alias cap fixture block mismatch')
          alias_tests = alias_tests.replace(old, new, 1)

          labels_path.write_text(labels)
          public_test_path.write_text(public_tests)
          alias_test_path.write_text(alias_tests)
          PY
          git diff --check
      - name: Install verifier dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
      - name: Prove exact five formerly failing cases
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          pytest -q \
            tests/unit/test_mlb_canonical_final_labels_v1.py::test_final_label_validation_rejects_same_count_official_pk_swap \
            'tests/unit/test_mlb_canonical_final_labels_v1.py::test_final_label_terminal_requires_unique_official_roster_membership[outside_roster]' \
            tests/unit/test_mlb_cooperative_terminal_chunk.py::test_candidate_alias_queries_are_capped_before_any_query \
            tests/unit/test_mlb_public_per_game_authority.py::test_terminal_no_prediction_status_displays_without_current_prediction_row \
            tests/unit/test_mlb_public_per_game_authority.py::test_valid_quarantine_terminal_is_lifecycle_only_on_public_surface
      - name: Prove full affected suites
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          pytest -q \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_cooperative_terminal_chunk.py \
            tests/unit/test_mlb_public_per_game_authority.py
      - name: Run comprehensive MLB per-game-lock verifier
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python scripts/verify_mlb_per_game_lock.py
      - name: Commit only after all proofs pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hello_world/mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_public_per_game_authority.py \
            tests/unit/test_mlb_cooperative_terminal_chunk.py
          git diff --cached --quiet && exit 1
          git commit -m 'Harden R7 terminal roster binding and exact fixtures'
          git push origin HEAD:codex/mlb-valid-prelock-quarantine-v4-567
      - name: Remove one-shot repair workflow from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/r7-repair-v2-cleanup origin/main
          cd /tmp/r7-repair-v2-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-pr601-r7-contract-v2-now.yml
          git commit -m 'Remove completed PR601 R7 v2 repair [skip ci]'
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((n*2))
          done
          exit 1
