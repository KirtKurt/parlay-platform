name: Invoke Soccer Recovery After Deploy
on:
  push:
    paths: ['.github/workflows/soccer-invoke-recovery-after-deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Wait for recovery Lambda, drain DLQ, exercise current cycle
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-soccer-auto
          recovery=''
          for i in $(seq 1 120); do
            recovery=$(aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id SoccerDlqRecoveryFunction --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text 2>/dev/null || true)
            if [[ -n "$recovery" && "$recovery" != None ]]; then break; fi
            sleep 5
          done
          test -n "$recovery" && test "$recovery" != None
          aws lambda invoke --function-name "$recovery" --region "$REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"recover_collection_dlq","max_messages":5000}' /tmp/recovery.json >/tmp/recovery-meta.json
          python - <<'PY'
          import json
          meta=json.load(open('/tmp/recovery-meta.json')); r=json.load(open('/tmp/recovery.json'))
          assert not meta.get('FunctionError'), meta
          assert r.get('ok') is True, r
          assert int(r.get('remaining_visible') or 0)==0, r
          assert int(r.get('remaining_inflight') or 0)==0, r
          print(json.dumps(r,indent=2))
          PY
          physical() { aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id "$1" --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text; }
          dispatch=$(physical SoccerDispatchFunction)
          freeze=$(physical SoccerFreezeFunction)
          controller=$(physical SoccerControllerFunction)
          historical=$(physical SoccerHistoricalFunction)
          worker=$(physical SoccerCollectionWorkerFunction)
          aws lambda invoke --function-name "$dispatch" --region "$REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"post_recovery_dispatch"}' /tmp/dispatch.json >/tmp/dispatch-meta.json
          sleep 60
          aws lambda invoke --function-name "$freeze" --region "$REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"post_recovery_freeze"}' /tmp/freeze.json >/tmp/freeze-meta.json
          aws lambda invoke --function-name "$controller" --region "$REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"post_recovery_controller"}' /tmp/controller.json >/tmp/controller-meta.json
          aws lambda invoke --function-name "$historical" --region "$REGION" --cli-binary-format raw-in-base64-out --payload '{"mode":"status"}' /tmp/historical.json >/tmp/historical-meta.json
          status_url=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='SoccerAutoStatusUrl'].OutputValue" --output text)
          curl --fail --silent --show-error --max-time 60 "$status_url" >/tmp/status.json
          start_ms=$(( ($(date +%s)-600)*1000 ))
          aws logs filter-log-events --log-group-name "/aws/lambda/$worker" --region "$REGION" --start-time "$start_ms" --filter-pattern '?Unauthorized ?HTTP_401 ?DISTRIBUTED_RATE_LIMIT_CONTENTION ?ERROR ?Exception' --limit 100 --output json >/tmp/errors.json || echo '{"events":[]}' >/tmp/errors.json
          python - <<'PY'
          import json,pathlib,datetime
          load=lambda p: json.load(open(p))
          status=load('/tmp/status.json')
          report={
            'proofType':'SOCCER_POST_RECOVERY_RUNTIME_PROOF',
            'observedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'recovery':load('/tmp/recovery.json'),
            'dispatch':load('/tmp/dispatch.json'),
            'freeze':load('/tmp/freeze.json'),
            'controller':load('/tmp/controller.json'),
            'historicalStatus':load('/tmp/historical.json'),
            'publicStatus':status,
            'recentTargetedWorkerErrors':(load('/tmp/errors.json').get('events') or []),
          }
          pathlib.Path('runtime_reports/soccer_post_recovery_runtime_latest.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
          print(json.dumps(report,indent=2,default=str))
          PY
      - name: Publish proof safely
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add runtime_reports/soccer_post_recovery_runtime_latest.json
          git commit -m 'runtime: publish Soccer post-recovery proof [skip ci]' || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*2))
          done
          exit 1
