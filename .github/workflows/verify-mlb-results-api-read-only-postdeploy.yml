name: Verify MLB results API read-only post-deploy

on:
  workflow_run:
    workflows: ["Deploy SAM to AWS"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: mlb-results-api-read-only-postdeploy
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TARGET_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      TARGET_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      PROBE_SLATE_DATE: "2026-08-04"
      VERIFIER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PROOF_PATH: runtime_reports/mlb_results_api_postdeploy_latest.json
    steps:
      - name: Checkout the exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_DEPLOY_SHA }}
          fetch-depth: 1

      - name: Prove exact checkout and input lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_DEPLOY_SHA"
          test "${#TARGET_DEPLOY_SHA}" -eq 40
          case "$TARGET_DEPLOY_SHA" in
            *[!0-9a-fA-F]*) exit 1 ;;
          esac
          test "${{ github.event.workflow_run.name }}" = "Deploy SAM to AWS"
          test "${{ github.event.workflow_run.path }}" = ".github/workflows/deploy.yml"
          test "${{ github.event.workflow_run.head_repository.full_name }}" = "$GITHUB_REPOSITORY"
          test "${{ github.event.workflow_run.head_branch }}" = main
          test "${{ github.event.workflow_run.conclusion }}" = success
          git fetch --no-tags --prune --depth=1000 origin main
          git merge-base --is-ancestor "$TARGET_DEPLOY_SHA" origin/main

      - name: Bind exact successful deploy run and attestation steps
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DEPLOY_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          expected_workflow_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml" \
            --jq '.id')
          test "$DEPLOY_WORKFLOW_ID" = "$expected_workflow_id"

          # Do not combine gh --slurp with --jq. Some hosted-runner gh versions
          # reject that option pairing before making the API request. Collect
          # pages explicitly and let jq assemble one stable jobs array instead.
          : > /tmp/mlb-results-deploy-jobs.ndjson
          completed_pages=0
          for page in $(seq 1 20); do
            page_json="/tmp/mlb-results-deploy-jobs-page-${page}.json"
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN_ID}/attempts/${DEPLOY_RUN_ATTEMPT}/jobs?per_page=100&page=${page}" \
              > "$page_json"
            jq -e '.jobs | type == "array"' "$page_json" >/dev/null
            jq -c '.jobs[]' "$page_json" >> /tmp/mlb-results-deploy-jobs.ndjson
            job_count=$(jq '.jobs | length' "$page_json")
            completed_pages=$page
            if [ "$job_count" -lt 100 ]; then
              break
            fi
          done
          test "$completed_pages" -gt 0
          if [ "$completed_pages" -eq 20 ] && \
             [ "$(jq '.jobs | length' /tmp/mlb-results-deploy-jobs-page-20.json)" -eq 100 ]; then
            echo "Deploy job pagination exceeded bounded 20-page collector" >&2
            exit 1
          fi
          jq -s '.' /tmp/mlb-results-deploy-jobs.ndjson \
            > /tmp/mlb-results-deploy-jobs.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          jobs = json.loads(
              Path('/tmp/mlb-results-deploy-jobs.json').read_text()
          )
          deploy_jobs = [job for job in jobs if job.get('name') == 'deploy']
          if len(deploy_jobs) != 1:
              raise SystemExit(f'Expected one deploy job, found {len(deploy_jobs)}')
          job = deploy_jobs[0]
          if job.get('conclusion') != 'success':
              raise SystemExit('Exact deploy job did not succeed')
          steps = {step.get('name'): step.get('conclusion') for step in job.get('steps') or []}
          required = (
              'Checkout exact source commit',
              'Prove committed MLB source is canonical',
              'Validate MLB production contracts',
              'Enforce MLB published prediction and immutable lock regressions',
              'Bind the verified clean SAM build to the deployment identity',
              'Deploy exact canonical source',
              'Prove exact deployed Lambda identity and schedules',
              'Upload exact deployment proof',
          )
          missing = [name for name in required if steps.get(name) != 'success']
          if missing:
              raise SystemExit('Deploy attestations missing: ' + json.dumps(missing))
          proof = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflowPath': '.github/workflows/deploy.yml',
              'workflowId': int(os.environ['DEPLOY_WORKFLOW_ID']),
              'runId': int(os.environ['DEPLOY_RUN_ID']),
              'runAttempt': int(os.environ['DEPLOY_RUN_ATTEMPT']),
              'headSha': os.environ['TARGET_DEPLOY_SHA'],
              'jobId': job.get('id'),
              'jobConclusion': job.get('conclusion'),
              'requiredSuccessfulSteps': list(required),
          }
          Path('/tmp/mlb-results-deploy-lineage.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Download exact triggering deploy artifact proof
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          proof_dir=/tmp/mlb-results-triggering-deploy-proof
          mkdir -p "$proof_dir"
          gh run download "$DEPLOY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "mlb-deployment-identity-${DEPLOY_RUN_ID}-${DEPLOY_RUN_ATTEMPT}" \
            --dir "$proof_dir"
          test -s "$proof_dir/mlb_lambda_build_manifest_deploy.json"
          test -s "$proof_dir/mlb_deploy_identity_latest.json"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded verification runtime
        run: python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9"

      - name: Run verifier regressions
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_mlb_results_api_postdeploy.py
          python -m pytest -q \
            tests/unit/test_verify_mlb_results_api_postdeploy.py \
            tests/unit/test_mlb_results_scheduler_http_read_only.py \
            tests/unit/test_mlb_result_signals_provenance.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify live read-only surface and natural scheduled advance
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python scripts/verify_mlb_results_api_postdeploy.py \
            --stack-name parlay-platform-dev \
            --region "$AWS_REGION_VALUE" \
            --expected-deploy-sha "$TARGET_DEPLOY_SHA" \
            --expected-deploy-run-id "$TARGET_DEPLOY_RUN_ID" \
            --probe-slate-date "$PROBE_SLATE_DATE" \
            --deploy-lineage /tmp/mlb-results-deploy-lineage.json \
            --deploy-build-manifest /tmp/mlb-results-triggering-deploy-proof/mlb_lambda_build_manifest_deploy.json \
            --deploy-identity /tmp/mlb-results-triggering-deploy-proof/mlb_deploy_identity_latest.json \
            --verifier-workflow-sha "$VERIFIER_WORKFLOW_SHA" \
            --verifier-run-id "$GITHUB_RUN_ID" \
            --verifier-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$PROOF_PATH"

      - name: Upload immutable verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-results-api-read-only-postdeploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROOF_PATH }}
            /tmp/mlb-results-deploy-lineage.json
            /tmp/mlb-results-triggering-deploy-proof/mlb_lambda_build_manifest_deploy.json
            /tmp/mlb-results-triggering-deploy-proof/mlb_deploy_identity_latest.json
          if-no-files-found: error
          retention-days: 30
