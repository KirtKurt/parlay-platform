name: Fix MLB R7 continuity timeout now

"on":
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# This deliberately shares the existing MLB-only repair lane. The new run is
# allowed to cancel a stale repair execution, but it cannot affect any sport or
# production-authority workflow outside this exact concurrency group.
concurrency:
  group: repair-mlb-training-continuity-now
  cancel-in-progress: true

jobs:
  patch-test-and-redispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch only the MLB reconciliation timeout contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = (
              (
                  Path("scripts/reconcile_mlb_prospective_backlog_v4.py"),
                  "        read_timeout=420,\n",
                  "        read_timeout=930,\n",
              ),
              (
                  Path("tests/unit/test_reconcile_mlb_prospective_backlog_v4.py"),
                  "    assert lambda_config.read_timeout == 420\n",
                  "    assert lambda_config.read_timeout == 930\n",
              ),
          )

          for path, old, new in replacements:
              text = path.read_text(encoding="utf-8")
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
              elif old_count == 0 and new_count == 1:
                  pass
              else:
                  raise SystemExit(
                      f"unexpected timeout contract in {path}: "
                      f"old={old_count} new={new_count}"
                  )
          PY

      - name: Prove fail-closed reconciliation contracts still pass
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py
          PYTHONPATH="hello_world:scripts:${PYTHONPATH:-}" python -m pytest -q \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5.py

      - name: Verify the change cannot alter predictions or authority
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -le 2
          for path in "${changed[@]}"; do
            case "$path" in
              scripts/reconcile_mlb_prospective_backlog_v4.py|tests/unit/test_reconcile_mlb_prospective_backlog_v4.py) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          grep -q 'read_timeout=930' scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'immutablePredictionRewriteAllowed": False' scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'promotionAuthorityChanged": False' scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'productionAuthorityChanged": False' scripts/reconcile_mlb_prospective_backlog_v4.py
          ! grep -q 'put_item(' scripts/reconcile_mlb_prospective_backlog_v4.py
          ! grep -q 'update_item(' scripts/reconcile_mlb_prospective_backlog_v4.py
          ! grep -q 'delete_item(' scripts/reconcile_mlb_prospective_backlog_v4.py

      - name: Commit the tested MLB-only timeout correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py
          if git diff --cached --quiet; then
            echo "Timeout correction already present on main."
          else
            git commit -m "Align MLB R7 V5 reconciliation client with 900s lock Lambda"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            test "$pushed" = true
          fi

      - name: Verify remote main and dispatch the protected repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/reconcile_mlb_prospective_backlog_v4.py \
            | grep -q 'read_timeout=930'
          gh workflow run repair-mlb-training-continuity-now.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "Dispatched the existing MLB-only protected continuity repair."
