name: Repair Tennis All Matches All Regions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_tennis_all_matches_all_regions.py'
      - 'scripts/tennis_all_regions_payloads/**'
      - '.github/workflows/repair-tennis-all-matches-all-regions.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-tennis-all-matches-all-regions
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-tennis-learning
  REPORT_PATH: runtime/tennis_all_matches_all_regions_repair_latest.json

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - name: Materialize checksum-locked Tennis-only repair source
        run: |
          set -euo pipefail
          python scripts/install_tennis_all_matches_all_regions.py | tee /tmp/tennis-repair-install.json
          python - <<'PY'
          import json
          proof=json.load(open('/tmp/tennis-repair-install.json'))
          assert proof['ok'] is True, proof
          assert proof['required_regions'] == ['us','us2','uk','eu','au'], proof
          assert proof['sport_keys_truncated'] == 0, proof
          assert proof['immutable_prediction_history_rewritten'] is False, proof
          assert proof['model_authority_changed'] is False, proof
          assert proof['human_winner_selection'] is False, proof
          assert proof['other_sport_changed'] is False, proof
          PY

      - name: Validate all-match all-region coverage contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest boto3
          python -m py_compile \
            tennis_learning/handler.py \
            tennis_learning/backfill.py \
            tennis_learning/bootstrap_handler.py \
            tennis_learning/live_pipeline.py \
            tennis_learning/autonomous_controller.py \
            scripts/install_tennis_all_matches_all_regions.py
          python -m pytest -q \
            tests/test_tennis_learning_handler.py \
            tests/test_tennis_autonomy_contract.py \
            tests/test_tennis_backfill_contract.py \
            tests/test_tennis_live_coverage_contract.py
          sam validate --template-file tennis-template.yaml
          git diff --check

      - name: Publish exact tested Tennis source to main
        run: |
          set -euo pipefail
          mkdir -p \
            /tmp/tennis-tested-source/tennis_learning \
            /tmp/tennis-tested-source/tests \
            /tmp/tennis-tested-source/.github/workflows
          cp tennis_learning/live_pipeline.py /tmp/tennis-tested-source/tennis_learning/live_pipeline.py
          cp tennis-template.yaml /tmp/tennis-tested-source/tennis-template.yaml
          cp tests/test_tennis_live_coverage_contract.py /tmp/tennis-tested-source/tests/test_tennis_live_coverage_contract.py
          cp .github/workflows/publish-tennis-daily-card.yml /tmp/tennis-tested-source/.github/workflows/publish-tennis-daily-card.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=false
          source_sha=''
          for attempt in $(seq 1 20); do
            git fetch origin main
            git checkout -B tennis-all-regions-tested-source origin/main
            mkdir -p tennis_learning tests .github/workflows
            cp /tmp/tennis-tested-source/tennis_learning/live_pipeline.py tennis_learning/live_pipeline.py
            cp /tmp/tennis-tested-source/tennis-template.yaml tennis-template.yaml
            cp /tmp/tennis-tested-source/tests/test_tennis_live_coverage_contract.py tests/test_tennis_live_coverage_contract.py
            cp /tmp/tennis-tested-source/.github/workflows/publish-tennis-daily-card.yml .github/workflows/publish-tennis-daily-card.yml
            git add \
              tennis_learning/live_pipeline.py \
              tennis-template.yaml \
              tests/test_tennis_live_coverage_contract.py \
              .github/workflows/publish-tennis-daily-card.yml
            if git diff --cached --quiet; then
              source_sha=$(git rev-parse HEAD)
              published=true
              break
            fi
            git commit -m 'Repair Tennis all-match all-region coverage [skip ci]'
            source_sha=$(git rev-parse HEAD)
            if git push origin HEAD:main; then
              published=true
              break
            fi
            sleep $((attempt * 3))
          done
          test "$published" = true
          test -n "$source_sha"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Exact tested Tennis source published at $source_sha"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Capture pre-deployment model authority
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          status_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" \
            --output text)
          test -n "$status_url"; test "$status_url" != None
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$status_url" > /tmp/tennis-authority-before.json
          python - <<'PY'
          import json
          status=json.load(open('/tmp/tennis-authority-before.json'))
          assert status.get('service') == 'tennis-autonomy', status
          assert status.get('authority') == 'AUTHORITATIVE', status
          assert status.get('automatic_prediction_allowed') is True, status
          assert int(status.get('consecutive_failures') or 0) == 0, status
          print(json.dumps(status, indent=2, sort_keys=True))
          PY

      - name: Build and deploy exact tested Tennis source
        env:
          REGION: ${{ secrets.AWS_REGION }}
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}" || { echo '::error::Missing ODDS_API_KEY'; exit 1; }
          rm -rf .aws-sam
          sam build --no-cached --template-file tennis-template.yaml
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides OddsApiKey="$ODDS_API_KEY_VALUE" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Verify deployed configuration and complete all-region evaluation
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack_status=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)
          case "$stack_status" in
            UPDATE_COMPLETE|CREATE_COMPLETE) ;;
            *) echo "::error::Unexpected Tennis stack status: $stack_status"; exit 1 ;;
          esac

          live_fn=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id TennisLivePipelineFunction \
            --region "$REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$live_fn"; test "$live_fn" != None
          aws lambda get-function-configuration \
            --function-name "$live_fn" \
            --region "$REGION" > /tmp/tennis-live-config.json

          python - <<'PY'
          import json
          cfg=json.load(open('/tmp/tennis-live-config.json'))
          env=(cfg.get('Environment') or {}).get('Variables') or {}
          required={'us', 'us2', 'uk', 'eu', 'au'}
          actual={x.strip() for x in str(env.get('TENNIS_ODDS_REGIONS') or '').split(',') if x.strip()}
          assert actual == required, {'required': sorted(required), 'actual': sorted(actual), 'config': cfg}
          assert int(env.get('TENNIS_PREDICTION_CUTOFF_MINUTES') or -1) == 10, cfg
          assert int(cfg.get('Timeout') or 0) == 600, cfg
          assert int(cfg.get('MemorySize') or 0) == 2048, cfg
          safe={
              'FunctionName': cfg.get('FunctionName'),
              'FunctionArn': cfg.get('FunctionArn'),
              'Runtime': cfg.get('Runtime'),
              'Version': cfg.get('Version'),
              'State': cfg.get('State'),
              'LastUpdateStatus': cfg.get('LastUpdateStatus'),
              'Timeout': cfg.get('Timeout'),
              'MemorySize': cfg.get('MemorySize'),
              'Environment': {
                  'Variables': {
                      key: env.get(key)
                      for key in (
                          'TENNIS_ODDS_REGIONS',
                          'TENNIS_PREDICTION_CUTOFF_MINUTES',
                          'TENNIS_COLLECTION_MAX_WORKERS',
                          'TENNIS_HTTP_MAX_ATTEMPTS',
                      )
                  }
              },
          }
          with open('/tmp/tennis-live-config-safe.json','w') as f:
              json.dump(safe, f, indent=2, sort_keys=True)
              f.write('\n')
          PY

          aws lambda invoke \
            --function-name "$live_fn" \
            --region "$REGION" \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"collect"}' \
            /tmp/tennis-collect-wrapper.json > /tmp/tennis-collect-meta.json

          python - <<'PY'
          import json
          meta=json.load(open('/tmp/tennis-collect-meta.json'))
          wrapper=json.load(open('/tmp/tennis-collect-wrapper.json'))
          assert int(meta.get('StatusCode') or 0) == 200, meta
          assert not meta.get('FunctionError'), {'meta': meta, 'wrapper': wrapper}
          assert int(wrapper.get('statusCode') or 0) == 200, wrapper
          body=wrapper.get('body')
          collect=json.loads(body) if isinstance(body, str) else body
          assert isinstance(collect, dict), wrapper
          required={'us', 'us2', 'uk', 'eu', 'au'}
          assert set(collect.get('required_regions') or []) == required, collect
          assert set(collect.get('requested_regions') or []) == required, collect
          assert collect.get('coverage_scope') == 'ALL_ACTIVE_TENNIS_KEYS_ALL_BOOKMAKER_REGIONS', collect
          assert collect.get('coverage_complete') is True, collect
          assert int(collect.get('sport_keys_truncated') or 0) == 0, collect
          assert int(collect.get('active_sport_keys', -1)) == int(collect.get('discovered_sport_keys', -2)), collect
          assert int(collect.get('evaluated_events', -1)) == int(collect.get('discovered_events', -2)), collect
          assert int(collect.get('discovered_events') or 0) > 0, collect
          assert not collect.get('failed_sport_keys'), collect
          assert not collect.get('errors'), collect
          assert not collect.get('prediction_errors'), collect
          with open('/tmp/tennis-collect.json','w') as f:
              json.dump(collect, f, indent=2, sort_keys=True, default=str)
              f.write('\n')
          print(json.dumps(collect, indent=2, sort_keys=True, default=str))
          PY

      - name: Verify authority unchanged after all-region collection
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          status_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" \
            --output text)
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$status_url" > /tmp/tennis-authority-after.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/tennis-authority-before.json'))
          after=json.load(open('/tmp/tennis-authority-after.json'))
          assert after.get('service') == 'tennis-autonomy', after
          assert before.get('authority') == after.get('authority') == 'AUTHORITATIVE', {'before': before, 'after': after}
          assert before.get('automatic_prediction_allowed') is True, before
          assert after.get('automatic_prediction_allowed') is True, after
          assert int(after.get('consecutive_failures') or 0) == 0, after
          assert before.get('model_version') == after.get('model_version'), {'before': before, 'after': after}
          print(json.dumps({'before': before, 'after': after}, indent=2, sort_keys=True))
          PY

      - name: Publish and verify complete daily card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-tennis-daily-card.yml --ref main
          run_id=''
          for attempt in $(seq 1 90); do
            run_id=$(gh run list \
              --workflow publish-tennis-daily-card.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

          for attempt in $(seq 1 20); do
            git fetch origin main
            if git show origin/main:runtime/tennis_daily_card.json > /tmp/tennis-daily-card.json 2>/dev/null; then
              break
            fi
            sleep 3
          done
          python - <<'PY'
          import json
          card=json.load(open('/tmp/tennis-daily-card.json'))
          required={'us', 'us2', 'uk', 'eu', 'au'}
          assert set(card.get('requested_regions') or []) == required, card
          assert card.get('full_slate_evaluated') is True, card
          assert int(card.get('inventory_match_count', -1)) == int(card.get('evaluated_match_count', -2)), card
          assert int(card.get('prediction_count') or 0) + int(card.get('unpredicted_match_count') or 0) == int(card.get('inventory_match_count') or 0), card
          assert int(card.get('official_pick_count') or 0) + int(card.get('watch_count') or 0) + int(card.get('pass_count') or 0) == int(card.get('prediction_count') or 0), card
          assert int(card.get('timing_violation_records_ignored') or 0) == 0, card
          assert int(card.get('malformed_prediction_timestamps') or 0) == 0, card
          print(json.dumps(card, indent=2, sort_keys=True, default=str))
          PY

      - name: Publish exact AWS-backed repair proof
        if: always()
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          def load(path):
              p=Path(path)
              return json.loads(p.read_text()) if p.exists() else None

          collect=load('/tmp/tennis-collect.json')
          before=load('/tmp/tennis-authority-before.json')
          after=load('/tmp/tennis-authority-after.json')
          card=load('/tmp/tennis-daily-card.json')
          config=load('/tmp/tennis-live-config-safe.json')
          ok=bool(
              collect
              and collect.get('coverage_complete') is True
              and after
              and after.get('authority') == 'AUTHORITATIVE'
              and after.get('automatic_prediction_allowed') is True
              and card
              and card.get('full_slate_evaluated') is True
          )
          proof={
              'ok': ok,
              'proofType': 'TENNIS_ALL_ACTIVE_MATCHES_ALL_BOOKMAKER_REGIONS_AWS_ACCEPTANCE',
              'observedAtUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'sourceSha': os.environ.get('SOURCE_SHA'),
              'requiredRegions': ['us','us2','uk','eu','au'],
              'collection': collect,
              'authorityBefore': before,
              'authorityAfter': after,
              'liveFunctionConfiguration': config,
              'dailyCard': card,
              'immutable_prediction_history_rewritten': False,
              'model_authority_changed': False,
              'human_winner_selection': False,
              'other_sport_changed': False,
          }
          Path(os.environ['REPORT_PATH']).parent.mkdir(parents=True, exist_ok=True)
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(proof, indent=2, sort_keys=True, default=str)+'\n')
          print(json.dumps(proof, indent=2, sort_keys=True, default=str))
          if not ok:
              raise SystemExit('Tennis all-match/all-region AWS acceptance did not pass')
          PY

          cp "$REPORT_PATH" /tmp/tennis-all-regions-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=false
          for attempt in $(seq 1 20); do
            git fetch origin main
            git checkout -B tennis-all-regions-proof origin/main
            mkdir -p runtime
            cp /tmp/tennis-all-regions-proof.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            if git diff --cached --quiet; then
              published=true
              break
            fi
            git commit -m 'Publish Tennis all-match all-region AWS proof [skip ci]'
            if git push origin HEAD:main; then
              published=true
              break
            fi
            sleep $((attempt * 3))
          done
          test "$published" = true
