name: Tennis Repair Watch 2026-08-03 1544

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennis-repair-watch-20260803-1544.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennis-repair-watch-20260803-1544
  cancel-in-progress: true

jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - name: Run isolated tennis tests
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile \
            tennis_learning/handler.py \
            tennis_learning/live_pipeline.py \
            tennis_learning/autonomous_controller.py \
            tennis_learning/backfill.py \
            tennis_learning/bootstrap_handler.py
          python -m pytest -q \
            tests/test_tennis_learning_handler.py \
            tests/test_tennis_autonomy_contract.py \
            tests/test_tennis_backfill_contract.py
          sam validate --template-file tennis-template.yaml
          git diff --check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Inspect, repair, execute, and verify live tennis autonomy
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-tennis-learning
          region="$AWS_REGION_VALUE"
          work=/tmp/tennis-repair-watch-1544
          mkdir -p "$work" runtime

          stack_status=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$region" \
            --query 'Stacks[0].StackStatus' --output text)
          status_endpoint=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$region" \
            --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" \
            --output text)
          run_endpoint=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$region" \
            --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyRunApi'].OutputValue" \
            --output text)

          test "$stack_status" = UPDATE_COMPLETE
          test -n "$status_endpoint"; test "$status_endpoint" != None
          test -n "$run_endpoint"; test "$run_endpoint" != None

          aws cloudformation list-stack-resources \
            --stack-name "$stack" --region "$region" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Events::Rule'].[LogicalResourceId,PhysicalResourceId]" \
            --output text > "$work/rule-identities.tsv"

          : > "$work/rules-before.tsv"
          : > "$work/repairs.tsv"
          while IFS=$'\t' read -r logical physical; do
            [ -n "$physical" ] || continue
            state=$(aws events describe-rule --name "$physical" --region "$region" --query State --output text)
            printf '%s\t%s\t%s\n' "$logical" "$physical" "$state" >> "$work/rules-before.tsv"
            case "$logical" in
              *CollectEvery15Minutes*|*SettleEvery30Minutes*|*AutonomousCycleEvery15Minutes*)
                if [ "$state" != ENABLED ]; then
                  aws events enable-rule --name "$physical" --region "$region"
                  printf '%s\t%s\t%s\n' "$logical" "$physical" 'ENABLED_REQUIRED_LIVE_RULE' >> "$work/repairs.tsv"
                fi
                ;;
              *BackfillEveryHour*)
                if [ "$state" != DISABLED ]; then
                  aws events disable-rule --name "$physical" --region "$region"
                  printf '%s\t%s\t%s\n' "$logical" "$physical" 'DISABLED_HISTORICAL_BACKFILL_RULE' >> "$work/repairs.tsv"
                fi
                ;;
            esac
          done < "$work/rule-identities.tsv"

          : > "$work/rules-after.tsv"
          while IFS=$'\t' read -r logical physical; do
            [ -n "$physical" ] || continue
            state=$(aws events describe-rule --name "$physical" --region "$region" --query State --output text)
            printf '%s\t%s\t%s\n' "$logical" "$physical" "$state" >> "$work/rules-after.tsv"
          done < "$work/rule-identities.tsv"

          curl -fsS --retry 4 --retry-all-errors --retry-delay 5 --max-time 60 \
            "$status_endpoint" -o "$work/status-before.json"
          curl -fsS --retry 2 --retry-all-errors --retry-delay 10 -X POST --max-time 900 \
            "$run_endpoint" -o "$work/run-response.json"
          sleep 5
          curl -fsS --retry 4 --retry-all-errors --retry-delay 5 --max-time 60 \
            "$status_endpoint" -o "$work/status-after.json"

          STACK_STATUS="$stack_status" \
          SOURCE_SHA="$GITHUB_SHA" \
          BEFORE_PATH="$work/status-before.json" \
          AFTER_PATH="$work/status-after.json" \
          RUN_PATH="$work/run-response.json" \
          RULES_BEFORE_PATH="$work/rules-before.tsv" \
          RULES_AFTER_PATH="$work/rules-after.tsv" \
          REPAIRS_PATH="$work/repairs.tsv" \
          STATUS_PATH="$work/status.json" \
          DIAGNOSTIC_PATH="$work/diagnostic.json" \
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              value = json.loads(Path(path).read_text())
              if isinstance(value, dict) and 'body' in value:
                  body = value.get('body')
                  if isinstance(body, str):
                      try:
                          value = json.loads(body)
                      except json.JSONDecodeError:
                          pass
                  elif isinstance(body, dict):
                      value = body
              return value if isinstance(value, dict) else {'value': value}

          def age_minutes(now, stamp):
              if not stamp:
                  return None
              parsed = datetime.fromisoformat(str(stamp).replace('Z', '+00:00')).astimezone(timezone.utc)
              return round(max(0.0, (now - parsed).total_seconds() / 60.0), 2)

          def read_rules(path):
              rows = []
              p = Path(path)
              if not p.exists():
                  return rows
              for line in p.read_text().splitlines():
                  parts = line.split('\t')
                  if len(parts) >= 3:
                      rows.append({'logical_id': parts[0], 'name': parts[1], 'state': parts[2]})
              return rows

          now = datetime.now(timezone.utc)
          before = load(os.environ['BEFORE_PATH'])
          after = load(os.environ['AFTER_PATH'])
          run = load(os.environ['RUN_PATH'])
          actions = run.get('actions') if isinstance(run.get('actions'), dict) else {}
          collect = actions.get('collect') if isinstance(actions.get('collect'), dict) else {}
          settle = actions.get('settle') if isinstance(actions.get('settle'), dict) else {}
          rules_before = read_rules(os.environ['RULES_BEFORE_PATH'])
          rules_after = read_rules(os.environ['RULES_AFTER_PATH'])
          repairs = read_rules(os.environ['REPAIRS_PATH'])

          required_tokens = ('CollectEvery15Minutes', 'SettleEvery30Minutes', 'AutonomousCycleEvery15Minutes')
          required_rules = [r for r in rules_after if any(token in r['logical_id'] for token in required_tokens)]
          backfill_rules = [r for r in rules_after if 'BackfillEveryHour' in r['logical_id']]
          required_rules_enabled = (
              len(required_rules) == len(required_tokens)
              and all(r['state'] == 'ENABLED' for r in required_rules)
          )
          backfill_fail_closed = bool(backfill_rules) and all(r['state'] == 'DISABLED' for r in backfill_rules)

          training_before = int(before.get('training_samples') or 0)
          training_after = int(after.get('training_samples') or run.get('training_samples') or 0)
          audits_before = int(before.get('live_audit_count') or 0)
          audits_after = int(after.get('live_audit_count') or run.get('live_audit_count') or 0)
          accuracy = float(after['live_accuracy']) if after.get('live_accuracy') is not None else None
          brier = float(after['live_brier']) if after.get('live_brier') is not None else None
          failures = int(after.get('consecutive_failures') or 0)
          authority = str(after.get('authority') or 'UNKNOWN')
          automatic = bool(after.get('automatic_prediction_allowed', False))
          age = age_minutes(now, after.get('last_cycle_at'))
          before_age = age_minutes(now, before.get('last_cycle_at'))

          collect_errors = collect.get('errors') if isinstance(collect.get('errors'), dict) else {}
          settle_errors = settle.get('errors') if isinstance(settle.get('errors'), dict) else {}
          trained = int(settle.get('trained') or 0)
          duplicates = int(settle.get('duplicates') or 0)
          missing = int(settle.get('missing_snapshots') or 0)
          score_events = int(settle.get('score_events') or 0)

          if collect_errors or settle_errors or collect.get('error') or settle.get('error'):
              progress_reason = 'required_live_action_failed'
          elif training_after > training_before or audits_after > audits_before or trained > 0:
              progress_reason = 'new_live_settlement_added'
          elif score_events == 0:
              progress_reason = 'provider_returned_no_recent_score_events'
          elif duplicates > 0 and missing == 0:
              progress_reason = 'all_eligible_recent_scores_already_settled'
          elif missing > 0:
              progress_reason = 'recent_scores_include_events_without_prior_live_snapshots'
          else:
              progress_reason = 'no_new_eligible_completed_match'

          gates = {
              'training_samples_100': training_after >= 100,
              'live_audits_30': audits_after >= 30,
              'live_accuracy_55pct': accuracy is not None and accuracy >= 0.55,
              'brier_at_most_0_25': brier is not None and brier <= 0.25,
              'circuit_breaker_clear': failures < 3 and authority != 'DEGRADED',
          }
          all_gates = all(gates.values())
          authority_consistent = (
              (authority == 'SHADOW' and automatic is False)
              or (authority == 'AUTHORITATIVE' and automatic is True and all_gates)
          )
          schedule_advancing_before = before_age is not None and before_age <= 25.0
          operational = (
              os.environ['STACK_STATUS'] == 'UPDATE_COMPLETE'
              and age is not None and age <= 45.0
              and required_rules_enabled
              and backfill_fail_closed
              and failures < 3
              and authority_consistent
              and after.get('last_error') in (None, '')
              and after.get('last_warning') in (None, '')
              and not collect_errors and not settle_errors
              and not collect.get('error') and not settle.get('error')
          )
          repair_attempted = bool(repairs) or not schedule_advancing_before

          status = {
              'checked_at': now.isoformat(),
              'source_commit': os.environ.get('SOURCE_SHA'),
              'service': after.get('service'),
              'stack_status': os.environ['STACK_STATUS'],
              'status_endpoint_available': True,
              'query_succeeded': True,
              'query_error': None,
              'authority': authority,
              'authority_consistent': authority_consistent,
              'reason': after.get('reason'),
              'automatic_prediction_allowed': automatic,
              'training_samples': training_after,
              'live_audit_count': audits_after,
              'live_accuracy': accuracy,
              'live_brier': brier,
              'consecutive_failures': failures,
              'last_cycle_at': after.get('last_cycle_at'),
              'cycle_age_minutes': age,
              'cycle_fresh': age is not None and age <= 45.0,
              'schedule_advancing_before_verification': schedule_advancing_before,
              'cycle_age_before_verification_minutes': before_age,
              'eventbridge_rules_before': rules_before,
              'eventbridge_rules_after': rules_after,
              'required_eventbridge_rules_enabled': required_rules_enabled,
              'historical_backfill_rule_fail_closed': backfill_fail_closed,
              'runtime_repairs': repairs,
              'verification_reason': 'stale_repository_evidence_triggered_live_repair_verification',
              'repair_attempted': repair_attempted,
              'repair_succeeded': operational,
              'repair_error': None if operational else 'post-cycle verification failed',
              'last_error': after.get('last_error'),
              'last_warning': after.get('last_warning'),
              'historical_backfill_enabled': after.get('historical_backfill_enabled'),
              'historical_backfill_required': after.get('historical_backfill_required'),
              'model_version': after.get('model_version'),
              'promotion_gates': gates,
              'all_promotion_gates_pass': all_gates,
              'progress_reason': progress_reason,
              'latest_cycle_collection': collect or None,
              'latest_cycle_settlement': settle or None,
              'operationally_healthy': operational,
          }
          diagnostic = {
              'checked_at': now.isoformat(),
              'source_commit': os.environ.get('SOURCE_SHA'),
              'stack_status': os.environ['STACK_STATUS'],
              'status_before': before,
              'status_after': after,
              'cycle_response': run,
              'collection': collect,
              'settlement': settle,
              'eventbridge_rules_before': rules_before,
              'eventbridge_rules_after': rules_after,
              'runtime_repairs': repairs,
              'training_samples_before': training_before,
              'training_samples_after': training_after,
              'training_samples_delta': training_after - training_before,
              'live_audits_before': audits_before,
              'live_audits_after': audits_after,
              'live_audits_delta': audits_after - audits_before,
              'cycle_age_before_verification_minutes': before_age,
              'progress_reason': progress_reason,
              'operationally_healthy': operational,
          }
          Path(os.environ['STATUS_PATH']).write_text(json.dumps(status, indent=2, sort_keys=True, default=str) + '\n')
          Path(os.environ['DIAGNOSTIC_PATH']).write_text(json.dumps(diagnostic, indent=2, sort_keys=True, default=str) + '\n')
          print(json.dumps(status, indent=2, sort_keys=True, default=str))

          assert status['stack_status'] == 'UPDATE_COMPLETE', status
          assert status['cycle_fresh'] is True, status
          assert status['required_eventbridge_rules_enabled'] is True, status
          assert status['historical_backfill_rule_fail_closed'] is True, status
          assert status['authority_consistent'] is True, status
          assert status['consecutive_failures'] < 3, status
          assert status['last_error'] in (None, ''), status
          assert status['last_warning'] in (None, ''), status
          assert not collect_errors and not settle_errors and not collect.get('error') and not settle.get('error'), diagnostic
          assert status['operationally_healthy'] is True, status
          PY

          cp "$work/status.json" /tmp/tennis-autonomy-status-1544.json
          cp "$work/diagnostic.json" /tmp/tennis-autonomy-diagnostic-1544.json

      - name: Publish evidence and self-remove
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 30); do
            git fetch origin main
            git checkout -B tennis-repair-watch-1544-publish origin/main
            mkdir -p runtime
            cp /tmp/tennis-autonomy-status-1544.json runtime/tennis_autonomy_status.json
            cp /tmp/tennis-autonomy-diagnostic-1544.json runtime/tennis_autonomy_diagnostic.json
            rm -f .github/workflows/tennis-repair-watch-20260803-1544.yml
            git add runtime/tennis_autonomy_status.json runtime/tennis_autonomy_diagnostic.json .github/workflows/tennis-repair-watch-20260803-1544.yml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish fresh tennis repair evidence [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Unable to publish fresh tennis repair evidence after thirty attempts' >&2
          exit 1
