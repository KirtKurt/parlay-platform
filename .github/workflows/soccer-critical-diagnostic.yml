name: Soccer Critical Diagnostic

on:
  push:
    branches:
      - agent/soccer-authority-repair
    paths:
      - .github/workflows/soccer-critical-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Install diagnostic dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2'
      - name: Diagnose Soccer T10 authority and refresh safe runtime state
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from datetime import timedelta
          import boto3
          from boto3.dynamodb.types import TypeDeserializer

          from soccer_auto.canonical import parse_utc, iso_utc, schedule_identity, digest
          from soccer_auto.config import (
              FINAL_DECISION_CAPTURE_LEAD_SECONDS,
              LOCK_MINUTES_BY_HORIZON,
              LOCK_VERSION_BY_HORIZON,
              PUBLIC_DECISION_HORIZON,
              PUBLICATION_COMMIT_HEADROOM_SECONDS,
              PUBLICATION_CUTOFF_MINUTES,
          )
          from soccer_auto.inference import live_lock_coverage_provenance_valid, lock_key
          from soccer_auto.storage import now_utc

          region = __import__('os').environ['AWS_REGION_VALUE']
          stack = 'parlay-platform-soccer-auto'
          cf = boto3.client('cloudformation', region_name=region)
          lam = boto3.client('lambda', region_name=region)
          ddb = boto3.client('dynamodb', region_name=region)
          deser = TypeDeserializer()

          def physical(logical):
              return cf.describe_stack_resource(StackName=stack, LogicalResourceId=logical)['StackResourceDetail']['PhysicalResourceId']

          def scan(logical):
              table = physical(logical)
              rows = []
              key = None
              while True:
                  kwargs = {'TableName': table}
                  if key:
                      kwargs['ExclusiveStartKey'] = key
                  page = ddb.scan(**kwargs)
                  rows.extend({k: deser.deserialize(v) for k, v in item.items()} for item in page.get('Items', []))
                  key = page.get('LastEvaluatedKey')
                  if not key:
                      return rows

          observed = now_utc()
          events = [r for r in scan('SoccerEventsTable') if r.get('entity_type') == 'SOCCER_EVENT' and r.get('completed') is not True]
          locks = [r for r in scan('SoccerLocksTable') if r.get('entity_type') == 'SOCCER_FROZEN_FEATURE_LOCK']
          lock_map = {(str(r.get('PK') or r.get('event_key') or '')), str(r.get('SK') or '')): r for r in locks}

          def reasons(lock, event):
              out = []
              try:
                  commence = parse_utc(str(event['commence_time']))
                  expected_target = commence - timedelta(minutes=LOCK_MINUTES_BY_HORIZON[PUBLIC_DECISION_HORIZON])
                  expected_deadline = expected_target - timedelta(seconds=PUBLICATION_COMMIT_HEADROOM_SECONDS)
                  expected_open = expected_deadline - timedelta(seconds=FINAL_DECISION_CAPTURE_LEAD_SECONDS)
                  def eq_time(field, expected):
                      try:
                          return parse_utc(str(lock.get(field) or '')) == expected
                      except Exception:
                          return False
                  if str(lock.get('lock_version') or '') != LOCK_VERSION_BY_HORIZON[PUBLIC_DECISION_HORIZON]: out.append('lock_version')
                  if str(lock.get('horizon') or '').upper() != PUBLIC_DECISION_HORIZON: out.append('horizon')
                  if int(lock.get('minutes_before_start') or 0) != LOCK_MINUTES_BY_HORIZON[PUBLIC_DECISION_HORIZON]: out.append('minutes_before_start')
                  if str(lock.get('schedule_identity') or '') != schedule_identity(lock): out.append('lock_schedule_identity_self')
                  if str(lock.get('schedule_identity') or '') != str(event.get('schedule_identity') or schedule_identity(event)): out.append('schedule_mismatch')
                  if int(lock.get('schedule_revision') or 0) != int(event.get('schedule_revision') or 0): out.append('revision_mismatch')
                  if not eq_time('decision_target_at', expected_target): out.append('decision_target_at')
                  if not eq_time('capture_opens_at', expected_open): out.append('capture_opens_at')
                  if not eq_time('lock_commit_deadline', expected_deadline): out.append('lock_commit_deadline')
                  try:
                      lock_at = parse_utc(str(lock.get('lock_at') or ''))
                      if not (expected_open <= lock_at <= expected_deadline): out.append('lock_at_window')
                      if parse_utc(str(lock.get('created_at') or '')) != lock_at: out.append('created_at_not_lock_at')
                  except Exception:
                      out.append('lock_at_parse')
                  if lock.get('training_eligible') is not False: out.append('training_eligible')
                  if lock.get('prediction_eligible') is not True: out.append('prediction_eligible')
                  required_fields = [
                      'coverage_certificate_version','coverage_certificate_digest','coverage_plan_digest','coverage_plan_observed_at',
                      'coverage_completed_at','coverage_required_pairs','coverage_required_pair_count','coverage_required_pair_digest',
                      'coverage_probe_pairs','coverage_probe_pair_count','coverage_probe_pair_digest','movement_baseline_certificate_digest',
                      'movement_baseline_plan_digest','movement_baseline_plan_observed_at','source_slot_ids','source_payload_hashes','source_raw_uris',
                      'movement_baseline_source_slot_ids','movement_baseline_source_payload_hashes','movement_baseline_source_raw_uris',
                      'movement_baseline_source_observed_at_max','source_observed_at_max','frozen_features','feature_hash'
                  ]
                  missing = [f for f in required_fields if f not in lock]
                  if missing: out.append('missing_fields:' + ','.join(missing))
                  if not live_lock_coverage_provenance_valid(lock): out.append('full_provenance_validator')
              except Exception as exc:
                  out.append('validator_exception:' + type(exc).__name__)
              return out

          invalid = []
          missing = []
          due = 0
          open_events = 0
          for event in events:
              try:
                  commence = parse_utc(str(event['commence_time']))
                  if not (observed - timedelta(hours=24) <= commence <= observed + timedelta(hours=24)):
                      continue
                  cutoff = commence - timedelta(minutes=PUBLICATION_CUTOFF_MINUTES)
                  deadline = cutoff - timedelta(seconds=PUBLICATION_COMMIT_HEADROOM_SECONDS)
                  capture_open = deadline - timedelta(seconds=FINAL_DECISION_CAPTURE_LEAD_SECONDS)
                  if observed < capture_open:
                      continue
                  due += 1
                  if observed <= deadline:
                      open_events += 1
                  rev = int(event.get('schedule_revision') or 0)
                  lk = lock_map.get((str(event['event_key']), lock_key(PUBLIC_DECISION_HORIZON, rev)))
                  if not lk:
                      missing.append({'event_key': event['event_key'], 'sport_key': event.get('sport_key'), 'commence_time': event.get('commence_time'), 'deadline': iso_utc(deadline)})
                      continue
                  if not live_lock_coverage_provenance_valid(lk) or str(lk.get('schedule_identity') or '') != str(event.get('schedule_identity') or schedule_identity(event)):
                      invalid.append({
                          'event_key': event['event_key'],
                          'sport_key': event.get('sport_key'),
                          'commence_time': event.get('commence_time'),
                          'deadline': iso_utc(deadline),
                          'reasons': reasons(lk, event),
                          'lock_summary': {k: lk.get(k) for k in [
                              'SK','lock_version','horizon','minutes_before_start','decision_target_at','capture_opens_at','lock_commit_deadline','lock_at','created_at',
                              'training_eligible','prediction_eligible','coverage_certificate_version','coverage_completed_at','coverage_plan_observed_at',
                              'source_observed_at_max','source_observed_before_lock','coverage_completed_before_lock','movement_baseline_source_observed_before_lock'
                          ]}
                      })
              except Exception as exc:
                  invalid.append({'event_key': event.get('event_key'), 'sport_key': event.get('sport_key'), 'reasons':['event_exception:' + repr(exc)]})

          print('SOCCER_T10_DIAGNOSTIC', json.dumps({
              'observed_at': iso_utc(observed), 'due_events': due, 'open_capture_events': open_events,
              'invalid_count': len(invalid), 'missing_count': len(missing),
              'reason_counts': Counter(reason for row in invalid for reason in row['reasons']),
              'invalid_sample': invalid[:8], 'missing_sample': missing[:8]
          }, default=lambda x: dict(x), indent=2))

          # Safe, Soccer-only runtime refreshes. Freeze is fail-closed and cannot create late locks.
          for logical, payload in [
              ('SoccerFreezeFunction', {}),
              ('SoccerControllerFunction', {}),
          ]:
              fn = physical(logical)
              response = lam.invoke(FunctionName=fn, InvocationType='RequestResponse', Payload=json.dumps(payload).encode())
              body = json.loads(response['Payload'].read().decode() or '{}')
              print(logical + '_RESPONSE', json.dumps(body, default=str)[:30000])
          PY
