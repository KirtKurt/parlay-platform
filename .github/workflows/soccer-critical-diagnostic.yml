name: Soccer Critical Diagnostic One Shot
on:
  push:
    paths: ['.github/workflows/soccer-critical-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Inspect exact Soccer DLQ
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-soccer-auto
          DLQ=$(aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id SoccerCollectionDeadLetterQueue --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text)
          WORKER=$(aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id SoccerCollectionWorkerFunction --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text)
          if [[ "$DLQ" == http* ]]; then dlq_url="$DLQ"; else dlq_url=$(aws sqs get-queue-url --queue-name "$DLQ" --region "$REGION" --query QueueUrl --output text); fi
          aws sqs get-queue-attributes --queue-url "$dlq_url" --region "$REGION" --attribute-names All > /tmp/attrs.json
          aws sqs receive-message --queue-url "$dlq_url" --region "$REGION" --max-number-of-messages 10 --visibility-timeout 0 --attribute-names All --message-attribute-names All > /tmp/messages.json
          end=$(date +%s); start_ms=$(( (end-172800)*1000 ))
          aws logs filter-log-events --log-group-name "/aws/lambda/$WORKER" --region "$REGION" --start-time "$start_ms" --limit 100 > /tmp/logs.json || true
          python - <<'PY'
          import json
          a=json.load(open('/tmp/attrs.json')).get('Attributes',{})
          ms=json.load(open('/tmp/messages.json')).get('Messages',[])
          es=json.load(open('/tmp/logs.json')).get('events',[])
          def body(m):
              try:return json.loads(m.get('Body',''))
              except:return m.get('Body','')[:4000]
          out={'attrs':{k:a.get(k) for k in ['ApproximateNumberOfMessages','ApproximateNumberOfMessagesNotVisible','ApproximateNumberOfMessagesDelayed','QueueArn']},'messages':[{'id':m.get('MessageId'),'attrs':m.get('Attributes'),'body':body(m)} for m in ms],'recent_worker_logs':[{'ts':e.get('timestamp'),'msg':e.get('message','')[:2000]} for e in es[-50:]]}
          t=json.dumps(out,sort_keys=True,default=str);print(t);print('::error title=Soccer DLQ Exact::'+t[:20000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
