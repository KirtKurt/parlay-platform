name: MLB Historical Rematerialization Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mlb-historical-rematerialization-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mlb-historical-rematerialization-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Catch up only immutable historical feature rematerialization
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2'
          python - <<'PY'
          import boto3,json,os,time,datetime,pathlib
          region=os.environ['REGION']; stack='parlay-platform-mlb-historical-optimizer'
          cf=boto3.client('cloudformation',region_name=region); lam=boto3.client('lambda',region_name=region)
          st=cf.describe_stacks(StackName=stack)['Stacks'][0]
          if st['StackStatus'] not in {'CREATE_COMPLETE','UPDATE_COMPLETE','UPDATE_ROLLBACK_COMPLETE','IMPORT_COMPLETE','IMPORT_ROLLBACK_COMPLETE'}:
              raise SystemExit('historical stack not stable:'+st['StackStatus'])
          outputs={x['OutputKey']:x['OutputValue'] for x in st.get('Outputs',[])}; fn=outputs.get('HistoricalOptimizerFunctionName')
          if not fn: raise SystemExit('HistoricalOptimizerFunctionName missing')
          cfg=lam.get_function_configuration(FunctionName=fn)
          if cfg.get('Handler')!='mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler': raise SystemExit('unexpected historical handler:'+str(cfg.get('Handler')))
          def invoke(payload):
              r=lam.invoke(FunctionName=fn,InvocationType='RequestResponse',Payload=json.dumps(payload).encode())
              body=json.loads(r['Payload'].read().decode())
              if r.get('FunctionError'): raise RuntimeError('LambdaFunctionError:'+json.dumps(body)[:1000])
              return body
          def status(tag): return invoke({'mode':'status','run':tag})
          def state(x): return x.get('state') if isinstance(x.get('state'),dict) else x
          before=status('ops_rematerialization_before'); bstate=state(before); authority=before.get('productionAuthority')
          samples=[]; final=before
          for i in range(1,5):
              current=state(final)
              complete=int(current.get('completeSlateCount') or len(current.get('completedSlates') or []))
              remat=int(current.get('featureRematerializedSlateCount') or 0)
              total=int(current.get('featureRematerializationTotalSlateCount') or 0)
              if complete>0 and remat==complete and total==complete and current.get('featureRematerializationComplete') is True and not current.get('featureRematerializationErrors'):
                  break
              action=invoke({'mode':'orchestrate','run':f'ops_rematerialization_repair_{i}'})
              after=status(f'ops_rematerialization_after_{i}')
              if after.get('productionAuthority')!=authority: raise RuntimeError('production_authority_changed_during_rematerialization')
              astate=state(after)
              samples.append({'attempt':i,'actionStatus':action.get('status'),'ok':action.get('ok'),'completeSlateCount':int(astate.get('completeSlateCount') or len(astate.get('completedSlates') or [])),'rematerialized':int(astate.get('featureRematerializedSlateCount') or 0),'total':int(astate.get('featureRematerializationTotalSlateCount') or 0),'phase':astate.get('phase'),'lastError':astate.get('lastError')})
              final=after
              if action.get('ok') is False: break
              time.sleep(2)
          fstate=state(final); complete=int(fstate.get('completeSlateCount') or len(fstate.get('completedSlates') or [])); remat=int(fstate.get('featureRematerializedSlateCount') or 0); total=int(fstate.get('featureRematerializationTotalSlateCount') or 0)
          ok=bool(complete>0 and remat==complete and total==complete and fstate.get('featureRematerializationComplete') is True and not fstate.get('featureRematerializationErrors') and not fstate.get('lastError'))
          report={'proofType':'MLB_HISTORICAL_REMATERIALIZATION_REPAIR','observedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'ok':ok,'functionName':fn,'handler':cfg.get('Handler'),'before':{'phase':bstate.get('phase'),'completeSlateCount':int(bstate.get('completeSlateCount') or len(bstate.get('completedSlates') or [])),'rematerialized':int(bstate.get('featureRematerializedSlateCount') or 0),'total':int(bstate.get('featureRematerializationTotalSlateCount') or 0),'complete':bstate.get('featureRematerializationComplete'),'lastError':bstate.get('lastError')},'after':{'phase':fstate.get('phase'),'completeSlateCount':complete,'rematerialized':remat,'total':total,'complete':fstate.get('featureRematerializationComplete'),'lastError':fstate.get('lastError')},'samples':samples,'productionAuthorityChanged':False,'promotionAuthorityChanged':False,'paidHistoricalProviderCallsRequired':0,'immutableHistoryRewritten':False,'repairMechanism':'deployed_v7_entrypoint_content_addressed_rematerialization_only'}
          pathlib.Path('/tmp/mlb-remat-repair.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          if not ok: raise SystemExit('historical rematerialization remains incomplete')
          PY
      - name: Publish repair proof
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/mlb-remat-repair.json || exit 1
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main; mkdir -p runtime_reports; cp /tmp/mlb-remat-repair.json runtime_reports/mlb_historical_rematerialization_repair_latest.json
            git add runtime_reports/mlb_historical_rematerialization_repair_latest.json
            git commit -m 'Publish MLB historical rematerialization repair proof [skip ci]' || exit 0
            git push origin HEAD:main && exit 0; sleep $((i*2))
          done
          exit 1
