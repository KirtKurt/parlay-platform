name: MLB Shadow Fixture Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-shadow-fixture-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-shadow-fixture-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Align manual-first shadow verifier fixture
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_mlb_trainer_deploy_response.py')
          text = path.read_text(encoding='utf-8')
          old = '        "runtimeAuthorityActivationAvailable": True,\n'
          new = '        "runtimeAuthorityActivationAvailable": False,\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one obsolete shadow fixture marker, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused authority and full verifier tests
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9'
          python -m pytest -q \
            tests/unit/test_mlb_shadow_authority_deploy_gate.py \
            tests/unit/test_mlb_trainer_deploy_response.py

      - name: Remove one-shot workflow and publish repair
        run: |
          set -euo pipefail
          rm .github/workflows/mlb-shadow-fixture-repair-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/test_mlb_trainer_deploy_response.py .github/workflows/mlb-shadow-fixture-repair-once.yml
          git commit -m 'test(mlb): align manual-first shadow deploy fixture'
          for attempt in $(seq 1 20); do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
