name: MLB AUTO Autonomy Chain Install

on:
  push:
    branches: ["agent/mlb-auto-autonomy-chain-20260814"]
    paths:
      - "hello_world/mlb_ml_canonical_continuity_v3.py"
      - "hello_world/mlb_ml_deployment_identity_v1.py"
      - "hello_world/mlb_ml_v2_inference_consumer.py"
      - "hello_world/mlb_ml_llm_hypothesis_v1.py"
      - "scripts/install_mlb_auto_autonomy_chain.py"
      - "tests/unit/test_mlb_auto_autonomy_chain_v1.py"
      - ".github/workflows/mlb-auto-autonomy-chain-install.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-auto-autonomy-chain-install
  cancel-in-progress: false

jobs:
  install-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[autonomy-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mlb-auto-autonomy-chain-20260814
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9" "pyyaml>=6,<7"

      - name: Apply deterministic MLB-only installer
        run: |
          python scripts/install_mlb_auto_autonomy_chain.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/unit/test_mlb_auto_autonomy_chain_v1.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    assert "tennis" not in installer.lower()\n    assert "soccer" not in installer.lower()\n',
              '    assert "tennis/" not in installer.lower()\n    assert "soccer/" not in installer.lower()\n',
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Prove installer idempotence
        run: |
          git diff > /tmp/first.patch
          python scripts/install_mlb_auto_autonomy_chain.py
          git diff > /tmp/second.patch
          cmp /tmp/first.patch /tmp/second.patch

      - name: Compile MLB autonomy modules
        run: |
          python -m py_compile \
            hello_world/mlb_ml_canonical_continuity_v3.py \
            hello_world/mlb_ml_deployment_identity_v1.py \
            hello_world/mlb_ml_v2_inference_consumer.py \
            hello_world/mlb_ml_llm_hypothesis_v1.py \
            hello_world/mlb_ml_aws_training_v1.py \
            hello_world/mlb_ml_aws_training_v1_compat.py \
            hello_world/mlb_ml_runtime_install_v3.py \
            scripts/install_mlb_auto_autonomy_chain.py

      - name: Run autonomy-chain focused tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          pytest -q tests/unit/test_mlb_auto_autonomy_chain_v1.py
          python tests/unit/test_mlb_r7_recovery_contract.py
          python tests/unit/test_mlb_trainer_continuity_compat_handler_v2.py
          python tests/unit/test_mlb_trainer_table_wiring.py
          python tests/unit/test_mlb_accuracy_target_separation.py
          python tests/unit/test_mlb_ml_promotion_safety.py

      - name: Verify no Tennis or Soccer application files changed
        run: |
          if git diff --name-only | grep -E '^(tennis|soccer|tennis_auto|soccer_auto)/|^hello_world/(tennis|soccer)'; then
            echo "::error::MLB autonomy installer modified Tennis or Soccer files"
            exit 1
          fi

      - name: Validate canonical SAM source
        uses: aws-actions/setup-sam@v2
      - run: sam validate

      - name: Commit installed MLB autonomy chain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            template.yaml \
            hello_world/mlb_ml_aws_training_v1.py \
            hello_world/mlb_ml_aws_training_v1_compat.py \
            hello_world/mlb_ml_experiment_v2.py \
            hello_world/mlb_ml_promotion_policy_v2.py \
            hello_world/mlb_ml_runtime_install_v3.py \
            tests/unit/test_mlb_auto_autonomy_chain_v1.py \
            .github/workflows/deploy.yml
          if git diff --cached --quiet; then
            echo "No installer changes to commit"
            exit 0
          fi
          git commit -m "Install MLB AUTO autonomy chain [autonomy-installed]"
          git pull --rebase --autostash origin agent/mlb-auto-autonomy-chain-20260814
          git push origin HEAD:agent/mlb-auto-autonomy-chain-20260814
