name: Publish MLB Runtime Status Markers Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mlb-runtime-markers-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Derive non-secret status markers
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report_path=Path('runtime_reports/mlb_three_source_runtime_v2_latest.json')
          cert_path=Path('runtime_reports/mlb_three_source_runtime_certified.json')
          assert report_path.is_file(), 'runtime report missing'
          assert cert_path.is_file(), 'runtime certificate missing'
          report=json.loads(report_path.read_text())
          cert=json.loads(cert_path.read_text())
          assert cert.get('certified') is True, cert

          root=Path('runtime_reports/mlb_runtime_markers')
          root.mkdir(parents=True, exist_ok=True)
          for path in root.glob('*.cert'):
              path.unlink()

          def mark(name, payload):
              (root / f'{name}.cert').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n')

          status=str(report.get('status') or 'UNKNOWN')
          mark('certified', {'certified': True, 'status': status, 'checkedAtUtc': report.get('checkedAtUtc')})
          mark(f'status_{status}', {'status': status})
          if report.get('fullCardDue') is True:
              mark('full_card_due', {'fullCardDue': True})
          else:
              mark('full_card_not_yet_due', {'fullCardDue': False})
          if int(report.get('predictionCount') or 0) > 0:
              mark('predictions_present', {'predictionCount': report.get('predictionCount')})
          if report.get('cardComplete') is True:
              mark('card_complete', {'cardComplete': True, 'predictionCount': report.get('predictionCount')})
          if report.get('allGamesNoPass') is True:
              mark('all_games_no_pass', {'allGamesNoPass': True})
          if report.get('allPredictionsThreeSourceReady') is True:
              mark('all_predictions_three_source_ready', {'allPredictionsThreeSourceReady': True})
          if report.get('infrastructureHealthy') is True:
              mark('infrastructure_healthy', {'infrastructureHealthy': True})
          if report.get('deadlineRequirementMet') is True:
              mark('deadline_requirement_met', {'deadlineRequirementMet': True})
          mark(f"official_game_count_{int(report.get('officialGameCount') or 0)}", {'officialGameCount': report.get('officialGameCount')})
          mark(f"prediction_count_{int(report.get('predictionCount') or 0)}", {'predictionCount': report.get('predictionCount')})
          PY

      - name: Remove this one-time workflow and obsolete failed fixer
        run: |
          rm -f .github/workflows/publish-mlb-runtime-markers-once.yml
          rm -f .github/workflows/fix-mlb-three-source-runtime-watch-once.yml

      - name: Commit markers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish MLB runtime status markers [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
