name: MLB Supervised V2.2 Contract

"on":
  pull_request:
    paths:
      - 'hello_world/mlb_supervised_model_v2_2.py'
      - 'hello_world/mlb_supervised_fold_policy_v2_2.py'
      - 'scripts/run_mlb_supervised_shadow_v2.py'
      - 'tests/unit/test_mlb_supervised_model_v2_2.py'
      - 'tests/unit/test_mlb_supervised_fold_policy_v2_2.py'
      - '.github/workflows/mlb-supervised-v2-2-contract.yml'
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_supervised_model_v2_2.py'
      - 'hello_world/mlb_supervised_fold_policy_v2_2.py'
      - 'scripts/run_mlb_supervised_shadow_v2.py'
      - 'tests/unit/test_mlb_supervised_model_v2_2.py'
      - 'tests/unit/test_mlb_supervised_fold_policy_v2_2.py'
      - '.github/workflows/mlb-supervised-v2-2-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test V2.2 challenger
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile \
            hello_world/mlb_supervised_model_v2_2.py \
            hello_world/mlb_supervised_fold_policy_v2_2.py \
            scripts/run_mlb_supervised_shadow_v2.py
          PYTHONPATH=hello_world python -m pytest -q --tb=short \
            tests/unit/test_mlb_supervised_model_v2_2.py \
            tests/unit/test_mlb_supervised_fold_policy_v2_2.py \
            tests/unit/test_mlb_supervised_shadow_v2.py
          grep -Fq 'freshProspectiveAuditRequired' hello_world/mlb_supervised_model_v2_2.py
          grep -Fq 'productionPromotionEligible' hello_world/mlb_supervised_model_v2_2.py
          grep -Fq 'untouchedAuditUsedForSelection' hello_world/mlb_supervised_model_v2_2.py
