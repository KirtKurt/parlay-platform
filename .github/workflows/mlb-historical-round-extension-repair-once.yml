name: MLB Historical Round Extension Repair Once

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-round-extension-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-historical-round-extension-repair-once
  cancel-in-progress: false

jobs:
  patch-canonical-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exact recovery contracts
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/mlb-historical-v7-recovery.yml')
          repair_path = Path('.github/workflows/mlb-historical-round-extension-repair-once.yml')
          text = workflow_path.read_text()

          path_anchor = "      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'\n"
          path_insert = path_anchor + "      - 'hello_world/mlb_historical_round_extension_v1.py'\n"
          if "mlb_historical_round_extension_v1.py'" not in text:
              assert text.count(path_anchor) == 1, 'unexpected recovery path anchor'
              text = text.replace(path_anchor, path_insert, 1)

          compile_anchor = "            hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py \\\n"
          compile_insert = compile_anchor + "            hello_world/mlb_historical_round_extension_v1.py \\\n"
          if "hello_world/mlb_historical_round_extension_v1.py \\" not in text:
              assert text.count(compile_anchor) == 1, 'unexpected recovery compile anchor'
              text = text.replace(compile_anchor, compile_insert, 1)

          test_anchor = "            tests/unit/test_mlb_historical_optimizer_handler.py \\\n"
          test_insert = test_anchor + "            tests/unit/test_mlb_historical_round_extension_v1.py \\\n"
          if "tests/unit/test_mlb_historical_round_extension_v1.py \\" not in text:
              assert text.count(test_anchor) == 1, 'unexpected recovery test anchor'
              text = text.replace(test_anchor, test_insert, 1)

          rounds_old = '              "HistoricalMaxOptimizationRounds=6" \\\n'
          rounds_new = '              "HistoricalMaxOptimizationRounds=12" \\\n'
          assert text.count(rounds_old) == 1, 'unexpected recovery round override'
          text = text.replace(rounds_old, rounds_new, 1)

          grep_anchor = "          grep -Fq 'Default: 300000' mlb_historical_optimizer/template.yaml\n"
          grep_insert = grep_anchor + "          grep -Fq 'Default: 12' mlb_historical_optimizer/template.yaml\n"
          if "grep -Fq 'Default: 12'" not in text:
              assert text.count(grep_anchor) == 1, 'unexpected template validation anchor'
              text = text.replace(grep_anchor, grep_insert, 1)

          assert 'HistoricalMaxOptimizationRounds=6' not in text
          assert 'HistoricalMaxOptimizationRounds=12' in text
          assert 'mlb_historical_round_extension_v1.py' in text
          assert 'test_mlb_historical_round_extension_v1.py' in text
          assert "grep -Fq 'Default: 12'" in text

          workflow_path.write_text(text)
          repair_path.unlink()
          PY

          git diff --check
          test ! -e .github/workflows/mlb-historical-round-extension-repair-once.yml
          grep -Fq 'HistoricalMaxOptimizationRounds=12' .github/workflows/mlb-historical-v7-recovery.yml
          grep -Fq 'mlb_historical_round_extension_v1.py' .github/workflows/mlb-historical-v7-recovery.yml
          grep -Fq 'test_mlb_historical_round_extension_v1.py' .github/workflows/mlb-historical-v7-recovery.yml

      - name: Publish repaired canonical recovery
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/mlb-historical-v7-recovery.yml \
            .github/workflows/mlb-historical-round-extension-repair-once.yml
          git commit -m 'Extend MLB historical fresh-audit rounds safely'
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo '::error::Unable to publish historical round-extension recovery patch'
          exit 1
