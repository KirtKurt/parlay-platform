name: Apply MLB lock-status explicit cache v2 once
run-name: "Apply MLB lock-status explicit cache v2 #${{ github.run_number }}"

"on":
  push:
    branches:
      - fix/mlb-lock-status-explicit-cache-v2-20260826
    paths:
      - '.github/workflows/apply-mlb-lock-status-explicit-cache-v2-once.yml'
      - 'scripts/apply_mlb_lock_status_explicit_cache_v2.py'

permissions:
  contents: write

concurrency:
  group: apply-mlb-lock-status-explicit-cache-v2-once
  cancel-in-progress: false

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/mlb-lock-status-explicit-cache-v2-20260826
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply explicit cache installation repair
        run: python scripts/apply_mlb_lock_status_explicit_cache_v2.py

      - name: Prove durable cache and HTTP API v2 behavior
        env:
          PYTHONPATH: hello_world
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pytest
          python -m pytest -q \
            tests/unit/test_mlb_daily_lock_status_durable_cache.py \
            tests/unit/test_mlb_lock_status_explicit_cache_install.py
          python -m py_compile \
            hello_world/mlb_daily_pick_lock.py \
            hello_world/mlb_daily_lock_status_route_patch.py

      - name: Commit only production repair and regression proof
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Install explicit MLB lock-status durable cache v2'
          git push origin HEAD:fix/mlb-lock-status-explicit-cache-v2-20260826
