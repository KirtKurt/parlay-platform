name: MLB Reliability Calibration Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'hello_world/mlb_reliability_calibration_v1.py'
      - 'scripts/mlb_reliability_calibration_shadow_audit.py'
      - 'tests/unit/test_mlb_reliability_calibration_v1.py'
      - '.github/workflows/mlb-reliability-calibration-contract.yml'
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_reliability_calibration_v1.py'
      - 'scripts/mlb_reliability_calibration_shadow_audit.py'
      - 'tests/unit/test_mlb_reliability_calibration_v1.py'
      - '.github/workflows/mlb-reliability-calibration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-reliability-calibration-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runtime
        run: python -m pip install --quiet 'pytest>=8,<9'

      - name: Compile chronology-safe calibration helper and audit
        run: |
          python -m py_compile hello_world/mlb_reliability_calibration_v1.py
          python -m py_compile scripts/mlb_reliability_calibration_shadow_audit.py

      - name: Verify calibration chronology and negative authority
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python -m pytest -q tests/unit/test_mlb_reliability_calibration_v1.py

  shadow-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure read-only audit AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install shadow audit runtime
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'numpy>=1.26,<3' 'scipy>=1.13,<2'

      - name: Run immutable-artifact calibration shadow audit
        run: |
          python scripts/mlb_reliability_calibration_shadow_audit.py \
            --stack parlay-platform-dev \
            --output runtime_reports/mlb_reliability_calibration_shadow_audit_latest.json

      - name: Upload calibration audit proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-reliability-calibration-shadow-audit-${{ github.run_id }}
          path: runtime_reports/mlb_reliability_calibration_shadow_audit_latest.json
          if-no-files-found: warn
          retention-days: 30
