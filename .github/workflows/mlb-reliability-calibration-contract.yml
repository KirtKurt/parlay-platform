name: MLB Reliability Calibration Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'hello_world/mlb_reliability_calibration_v1.py'
      - 'tests/unit/test_mlb_reliability_calibration_v1.py'
      - '.github/workflows/mlb-reliability-calibration-contract.yml'
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_reliability_calibration_v1.py'
      - 'tests/unit/test_mlb_reliability_calibration_v1.py'
      - '.github/workflows/mlb-reliability-calibration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-reliability-calibration-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runtime
        run: python -m pip install --quiet 'pytest>=8,<9'

      - name: Compile chronology-safe calibration helper
        run: python -m py_compile hello_world/mlb_reliability_calibration_v1.py

      - name: Verify calibration chronology and negative authority
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python -m pytest -q tests/unit/test_mlb_reliability_calibration_v1.py
