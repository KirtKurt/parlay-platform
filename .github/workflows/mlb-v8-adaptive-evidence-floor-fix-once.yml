name: MLB V8 Adaptive Evidence Floor Fix Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-adaptive-evidence-floor-fix-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v8-adaptive-evidence-floor-fix-once
  cancel-in-progress: false

env:
  PYTHONPATH: .:hello_world:scripts

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply adaptive evidence-floor and provider pacing fix
        run: |
          set -euo pipefail
          echo '...TRUNCATED_FOR_BREVITY' | base64 --decode > /tmp/patch_v8_adaptive_floor.py
          python /tmp/patch_v8_adaptive_floor.py

      - name: Compile and test V8 contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'numpy>=1.26,<3' 'pytest>=8,<9'
          python -m py_compile \
            hello_world/mlb_supervised_daily_objective_v2_1.py \
            hello_world/mlb_supervised_selection_guard_v2_3.py \
            hello_world/mlb_supervised_selection_guard_v2_4.py \
            hello_world/mlb_supervised_selection_guard_v2_5.py \
            scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_supervised_daily_objective_v2_1.py \
            tests/unit/test_mlb_supervised_daily_objective_bbs_overlay.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_3.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_4.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_5.py \
            tests/unit/test_run_mlb_v8_historical_bbs_prior_game_backfill.py
          grep -Fq 'MLB-SUPERVISED-SELECTION-GUARD-v2.5-adaptive-evidence-floor' hello_world/mlb_supervised_selection_guard_v2_5.py
          grep -Fq 'minimumBbsAvailableOverallGames' hello_world/mlb_supervised_selection_guard_v2_5.py
          grep -Fq "BBS_HISTORICAL_REQUEST_DELAY_SECONDS: '1.0'" .github/workflows/mlb-v8-historical-bbs-backfill.yml
          grep -Fq "MAX_BATCHES: ${{ github.event.inputs.max_batches || '4' }}" .github/workflows/mlb-v8-historical-bbs-backfill.yml
          grep -Fq 'productionAuthorityChanged": False' scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py
          grep -Fq 'selectionUsedOutcomes": False' scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py

      - name: Publish fix and remove installer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/mlb-supervised-shadow-v2-recurring.yml \
            .github/workflows/mlb-v8-historical-bbs-backfill.yml \
            .github/workflows/mlb-v8-selection-guard-ci.yml \
            hello_world/mlb_supervised_daily_objective_v2_1.py \
            hello_world/mlb_supervised_selection_guard_v2_5.py \
            scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py \
            tests/unit/test_mlb_supervised_daily_objective_v2_1.py \
            tests/unit/test_mlb_supervised_daily_objective_bbs_overlay.py \
            tests/unit/test_mlb_supervised_selection_guard_v2_5.py \
            tests/unit/test_run_mlb_v8_historical_bbs_prior_game_backfill.py
          git rm .github/workflows/mlb-v8-adaptive-evidence-floor-fix-once.yml
          git diff --cached --check
          git commit -m 'Fix V8 adaptive BBD evidence floors'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
