name: Audit MLB Auto today read only

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-mlb-auto-today-read-only.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-mlb-auto-today-read-only
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  MLB_ROOT_STACK: parlay-platform-dev
  MLB_AUTO_STACK: parlay-platform-mlb-auto-llm
  MLB_AUTO_FINAL_COLLECTION_WINDOW_MINUTES: '20'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve current and prior Eastern slate dates
        id: dates
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          today_et = datetime.now(timezone.utc).astimezone(ZoneInfo('America/New_York')).date()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'today_et={today_et.isoformat()}\n')
              output.write(f'prior_et={(today_et - timedelta(days=1)).isoformat()}\n')
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve isolated MLB Auto Lambda
        id: function
        run: |
          set -euo pipefail
          fn=$(aws cloudformation describe-stack-resource \
            --stack-name "$MLB_AUTO_STACK" \
            --logical-resource-id MLBAutoLLMFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$fn" && test "$fn" != None
          echo "name=$fn" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/mlb-auto-audit
          aws lambda get-function-configuration --function-name "$fn" --region "$AWS_REGION" \
            --query '{FunctionName:FunctionName,Handler:Handler,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json > /tmp/mlb-auto-audit/function.json
      - name: Resolve production MLB authority Lambda
        id: authority_function
        run: |
          set -euo pipefail
          fn=$(aws cloudformation describe-stack-resource \
            --stack-name "$MLB_ROOT_STACK" \
            --logical-resource-id MLBV3ReadFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$fn" && test "$fn" != None
          echo "name=$fn" >> "$GITHUB_OUTPUT"
      - name: Invoke read-only cards and production authority endpoints
        env:
          FUNCTION_NAME: ${{ steps.function.outputs.name }}
          AUTHORITY_FUNCTION_NAME: ${{ steps.authority_function.outputs.name }}
          TODAY_ET: ${{ steps.dates.outputs.today_et }}
          PRIOR_ET: ${{ steps.dates.outputs.prior_et }}
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"rawPath\":\"/v1/mlb-auto/status\",\"requestContext\":{\"http\":{\"method\":\"GET\"}},\"queryStringParameters\":{\"date\":\"$TODAY_ET\"}}" \
            /tmp/mlb-auto-audit/today-raw.json \
            > /tmp/mlb-auto-audit/today-invocation.json
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"rawPath\":\"/v1/mlb-auto/status\",\"requestContext\":{\"http\":{\"method\":\"GET\"}},\"queryStringParameters\":{\"date\":\"$PRIOR_ET\"}}" \
            /tmp/mlb-auto-audit/prior-raw.json \
            > /tmp/mlb-auto-audit/prior-invocation.json
          aws lambda invoke \
            --function-name "$AUTHORITY_FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"rawPath":"/v1/mlb/model/version","requestContext":{"http":{"method":"GET"}},"queryStringParameters":{}}' \
            /tmp/mlb-auto-audit/authority-model-raw.json \
            > /tmp/mlb-auto-audit/authority-model-invocation.json
          aws lambda invoke \
            --function-name "$AUTHORITY_FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"rawPath\":\"/v1/mlb/today\",\"requestContext\":{\"http\":{\"method\":\"GET\"}},\"queryStringParameters\":{\"date\":\"$TODAY_ET\"}}" \
            /tmp/mlb-auto-audit/authority-today-raw.json \
            > /tmp/mlb-auto-audit/authority-today-invocation.json
      - name: Build and enforce read-only card audit
        env:
          TODAY_ET: ${{ steps.dates.outputs.today_et }}
          PRIOR_ET: ${{ steps.dates.outputs.prior_et }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          root=Path('/tmp/mlb-auto-audit')
          cfg=json.loads((root/'function.json').read_text())
          today_meta=json.loads((root/'today-invocation.json').read_text())
          prior_meta=json.loads((root/'prior-invocation.json').read_text())
          authority_model_meta=json.loads((root/'authority-model-invocation.json').read_text())
          authority_today_meta=json.loads((root/'authority-today-invocation.json').read_text())

          def decode_response(name):
              outer=json.loads((root/f'{name}-raw.json').read_text())
              http_status=int(outer.get('statusCode') or 0)
              body=outer.get('body')
              if isinstance(body,str): body=json.loads(body)
              assert isinstance(body,dict),body
              return http_status,body

          def decode_status(name):
              http_status,body=decode_response(name)
              assert http_status==200,body
              assert body.get('ok') is True,body
              return body

          def authority_readiness(model_http,model,today_http,authority_today):
              errors=[]
              fail_closed_fields={
                'publicationClosed':True,
                'productionSelectionAllowed':False,
                'qualifiedChampionRequired':True,
                'qualifiedChampionPresent':False,
                'r7ChampionQualified':False,
                'primaryAlgorithmActive':False,
                'retiredAuthoritySuppressed':True,
                'retiredV15_10Eligible':False,
                'legacyFallbackAllowed':False,
                'automaticLegacyRestoreAllowed':False,
              }
              no_champion_claimed=(
                model_http==503
                and model.get('ok') is False
                and model.get('status')=='NO_QUALIFIED_CHAMPION'
                and model.get('error')=='NO_QUALIFIED_CHAMPION'
              )
              if no_champion_claimed:
                  for source_name,payload in (('model',model),('today',authority_today)):
                      for field,expected in fail_closed_fields.items():
                          if payload.get(field) is not expected:
                              errors.append(f'{source_name}_{field}_mismatch')
                      if payload.get('requestedAuthority')!='AWS_ML_PROSPECTIVE_R7':
                          errors.append(f'{source_name}_requested_authority_invalid')
                      for field in (
                        'model_version','primaryAlgorithm','soleProductionAlgorithm',
                        'game_winner_model','r7DeploymentIdentity'
                      ):
                          if payload.get(field) not in (None,''):
                              errors.append(f'{source_name}_{field}_must_be_empty')
                  if today_http!=503:
                      errors.append('today_http_status_not_503')
                  if authority_today.get('ok') is not False:
                      errors.append('today_ok_not_false')
                  if authority_today.get('status')!='NO_QUALIFIED_CHAMPION':
                      errors.append('today_status_not_no_qualified_champion')
                  if authority_today.get('error')!='NO_QUALIFIED_CHAMPION':
                      errors.append('today_error_not_no_qualified_champion')
                  if type(authority_today.get('count')) is not int or authority_today.get('count')!=0:
                      errors.append('today_winner_prediction_count_not_zero')
                  for field in ('winner_predictions','predictions'):
                      if authority_today.get(field)!=[]:
                          errors.append(f'today_{field}_not_empty')
                  state='NO_QUALIFIED_CHAMPION_SUPPRESSED' if not errors else 'AUTHORITY_READINESS_UNKNOWN'
              else:
                  qualified=(
                    model_http==200
                    and model.get('ok') is True
                    and today_http==200
                    and authority_today.get('ok') is True
                    and model.get('publicationClosed') is False
                    and model.get('productionSelectionAllowed') is True
                    and model.get('qualifiedChampionRequired') is True
                    and model.get('qualifiedChampionPresent') is True
                    and model.get('r7ChampionQualified') is True
                    and model.get('primaryAlgorithmActive') is True
                    and model.get('requestedAuthority')=='AWS_ML_PROSPECTIVE_R7'
                    and bool(model.get('model_version'))
                    and bool(model.get('primaryAlgorithm'))
                    and bool(model.get('r7DeploymentIdentity'))
                  )
                  state='QUALIFIED_AUTHORITY_READY' if qualified else 'AUTHORITY_READINESS_UNKNOWN'
                  if not qualified:
                      errors.append('authority_state_not_explicitly_fail_closed_or_qualified')
              return {'state':state,'valid':not errors,'errors':sorted(set(errors))}

          def audit_card(card, scheduled):
              picks=list((card or {}).get('picks') or [])
              errors=[]
              seen=set()
              authorities=Counter()
              rows=[]
              for pick in picks:
                  pk=str(pick.get('gamePk') or '')
                  home=str(pick.get('homeTeam') or '')
                  away=str(pick.get('awayTeam') or '')
                  winner=str(pick.get('predictedWinner') or '')
                  loser=str(pick.get('predictedLoser') or '')
                  authority=str(pick.get('decisionAuthority') or '')
                  probability=pick.get('probability')
                  presence=pick.get('sourcePresence') or {}
                  if not pk or pk in seen: errors.append(f'duplicate_or_missing_gamePk:{pk}')
                  seen.add(pk)
                  if winner not in {home,away}: errors.append(f'winner_not_in_matchup:{pk}')
                  if loser not in {home,away} or loser==winner: errors.append(f'loser_invalid:{pk}')
                  try:
                      p=float(probability)
                      if not 0.0 <= p <= 1.0: errors.append(f'probability_out_of_range:{pk}')
                  except Exception:
                      errors.append(f'probability_invalid:{pk}')
                  if authority not in {'BEDROCK_LLM','AWS_ML_PROSPECTIVE_R7'}:
                      errors.append(f'authority_invalid:{pk}:{authority}')
                  if authority in {'HUMAN','CHATGPT'}: errors.append(f'human_authority:{pk}')
                  for source in ('mlbStatsApi','theOddsApi','bigBallsDataPro'):
                      if presence.get(source) is not True: errors.append(f'source_missing:{pk}:{source}')
                  authorities[authority]+=1
                  rows.append({
                    'gamePk':pk,'awayTeam':away,'homeTeam':home,
                    'predictedWinner':winner,'predictedLoser':loser,
                    'probability':probability,'decisionAuthority':authority,
                    'sourcePresence':presence,'gameDate':pick.get('gameDate'),
                    'confidence':pick.get('confidence'),
                  })
              if card is not None and len(picks)!=scheduled:
                  errors.append(f'card_not_whole_slate:{len(picks)}/{scheduled}')
              return rows,dict(authorities),errors

          def audit_schedule(status,card):
              errors=[]
              raw_scheduled=status.get('scheduledGames')
              if status.get('scheduleOk') is not True:
                  errors.append('schedule_not_explicitly_healthy')
              if type(raw_scheduled) is not int or raw_scheduled<0:
                  errors.append(f'scheduled_games_invalid:{raw_scheduled!r}')
                  return 0,errors
              if raw_scheduled==0:
                  deadline=status.get('deadline') or {}
                  if card is not None:
                      errors.append('card_present_on_no_games_slate')
                  if (
                    deadline.get('publishDeadlineUtc') not in (None,'')
                    or deadline.get('reason')!='NO_GAMES'
                  ):
                      errors.append('no_games_deadline_contract_invalid')
              return raw_scheduled,errors

          def publication_state(card, status, authority_state, scheduled):
              if scheduled==0:
                  return False,'NO_GAMES',[]
              deadline_value=str(((status.get('deadline') or {}).get('publishDeadlineUtc')) or '')
              deadline_utc=None
              if deadline_value:
                  try:
                      deadline_utc=datetime.fromisoformat(deadline_value.replace('Z','+00:00'))
                      if deadline_utc.tzinfo is None:
                          deadline_utc=deadline_utc.replace(tzinfo=timezone.utc)
                      deadline_utc=deadline_utc.astimezone(timezone.utc)
                  except ValueError:
                      deadline_utc=None
              observed_at=datetime.now(timezone.utc)
              deadline_passed=bool(deadline_utc and observed_at>deadline_utc)
              errors=[]
              if card is None and deadline_utc is None:
                  errors.append('publication_deadline_unavailable')
              elif (
                card is None
                and deadline_passed
                and authority_state!='NO_QUALIFIED_CHAMPION_SUPPRESSED'
              ):
                  errors.append(f'card_missing_after_deadline:{deadline_value}')
              if card is not None:
                  capability_state='CARD_PUBLISHED'
              elif deadline_utc is None:
                  capability_state='DEADLINE_UNAVAILABLE'
              elif deadline_passed and authority_state=='NO_QUALIFIED_CHAMPION_SUPPRESSED':
                  capability_state='AUTHORITY_READINESS_GATED'
              elif deadline_passed:
                  capability_state='CARD_MISSING_AFTER_DEADLINE'
              elif observed_at >= deadline_utc-timedelta(
                minutes=int(os.environ['MLB_AUTO_FINAL_COLLECTION_WINDOW_MINUTES'])
              ):
                  capability_state='FINAL_WINDOW'
              else:
                  capability_state='COLLECTING_NOT_DUE'
              return deadline_passed,capability_state,errors

          def enforce_slate_identity(status, expected_slate, errors):
              actual_slate=str(status.get('slateDateEt') or '')
              if actual_slate!=expected_slate:
                  errors.append(f'slate_date_mismatch:{actual_slate or "missing"}/{expected_slate}')

          assert not today_meta.get('FunctionError'), today_meta
          assert not prior_meta.get('FunctionError'), prior_meta
          assert not authority_model_meta.get('FunctionError'),authority_model_meta
          assert not authority_today_meta.get('FunctionError'),authority_today_meta
          assert cfg.get('State')=='Active' and cfg.get('LastUpdateStatus')=='Successful',cfg

          authority_model_http,authority_model=decode_response('authority-model')
          authority_today_http,authority_today=decode_response('authority-today')
          authority=authority_readiness(
            authority_model_http,authority_model,authority_today_http,authority_today
          )
          prior_authority={
            'state':'AUTHORITY_AS_OF_UNAVAILABLE',
            'valid':False,
            'errors':['prior_slate_authority_as_of_proof_unavailable'],
          }

          today_status=decode_status('today')
          today_card=today_status.get('card')
          today_scheduled,today_schedule_errors=audit_schedule(today_status,today_card)
          today_rows,today_authorities,today_errors=audit_card(today_card,today_scheduled)
          today_errors.extend(today_schedule_errors)
          today_deadline_passed,today_capability_state,today_publication_errors=publication_state(
            today_card,today_status,authority['state'],today_scheduled
          )
          today_errors.extend(today_publication_errors)
          enforce_slate_identity(today_status,os.environ['TODAY_ET'],today_errors)

          prior_status=decode_status('prior')
          prior_card=prior_status.get('card')
          prior_scheduled,prior_schedule_errors=audit_schedule(prior_status,prior_card)
          prior_rows,prior_authorities,prior_errors=audit_card(prior_card,prior_scheduled)
          prior_errors.extend(prior_schedule_errors)
          prior_deadline_passed,prior_capability_state,prior_publication_errors=publication_state(
            prior_card,prior_status,prior_authority['state'],prior_scheduled
          )
          prior_errors.extend(prior_publication_errors)
          if (
            prior_scheduled>0
            and prior_card is None
            and prior_deadline_passed
            and prior_authority['valid'] is not True
          ):
              prior_errors.append('prior_authority_as_of_unavailable')
          enforce_slate_identity(prior_status,os.environ['PRIOR_ET'],prior_errors)
          prior_audit=prior_status.get('audit') or {}

          proof={
            'ok': bool(
              not today_errors
              and not prior_errors
              and authority['valid'] is True
            ),
            'proofType':'MLB_AUTO_READ_ONLY_CURRENT_CARD_AUDIT',
            'readOnly':True,
            'functionName':cfg.get('FunctionName'),
            'functionHandler':cfg.get('Handler'),
            'functionState':cfg.get('State'),
            'functionLastUpdateStatus':cfg.get('LastUpdateStatus'),
            'productionAuthority':{
              **authority,
              'modelHttpStatus':authority_model_http,
              'todayHttpStatus':authority_today_http,
              'winnerPredictionCount':authority_today.get('count'),
              'publicationClosed':authority_model.get('publicationClosed'),
              'productionSelectionAllowed':authority_model.get('productionSelectionAllowed'),
              'qualifiedChampionPresent':authority_model.get('qualifiedChampionPresent'),
            },
            'today':{
              'slateDateEt':today_status.get('slateDateEt'),
              'requestedSlateDateEt':os.environ['TODAY_ET'],
              'scheduledGames':today_scheduled,
              'deadline':today_status.get('deadline'),
              'deadlinePassed':today_deadline_passed,
              'cardPublished':today_card is not None,
              'pickCount':len(today_rows),
              'authorityCounts':today_authorities,
              'picks':today_rows,
              'errors':today_errors,
              'capabilityState':today_capability_state,
            },
            'prior':{
              'slateDateEt':prior_status.get('slateDateEt'),
              'requestedSlateDateEt':os.environ['PRIOR_ET'],
              'scheduledGames':prior_scheduled,
              'deadline':prior_status.get('deadline'),
              'deadlinePassed':prior_deadline_passed,
              'cardPublished':prior_card is not None,
              'pickCount':len(prior_rows),
              'authorityCounts':prior_authorities,
              'picks':prior_rows,
              'settlementAudit':prior_audit,
              'errors':prior_errors,
              'capabilityState':prior_capability_state,
              'authorityAsOfState':prior_authority['state'],
              'authorityAsOfValid':prior_authority['valid'],
              'authorityAsOfErrors':prior_authority['errors'],
            },
            'humanWinnerSelection':False,
            'chatgptWinnerSelection':False,
            'immutablePredictionHistoryRewritten':False,
            'postStartPredictionCreated':False,
            'otherSportChanged':False,
          }
          (root/'audit.json').write_text(json.dumps(proof,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(proof,indent=2,sort_keys=True,default=str))
          assert proof['ok'], proof
          PY
      - name: Upload current-card audit
        uses: actions/upload-artifact@v4
        with:
          name: mlb-auto-today-read-only-audit-${{ github.run_id }}
          path: /tmp/mlb-auto-audit
          if-no-files-found: error
          retention-days: 90
