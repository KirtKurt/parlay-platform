name: Repair Tennis Runtime Evidence Now

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-tennis-runtime-evidence-now.yml']

permissions:
  contents: write

concurrency:
  group: repair-tennis-runtime-evidence-now
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Query, self-heal if stale, and verify
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          work=/tmp/tennis-runtime-refresh
          mkdir -p "$work" runtime
          stack=parlay-platform-tennis-learning
          region="$AWS_REGION_VALUE"
          stack_status=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query 'Stacks[0].StackStatus' --output text)
          status_endpoint=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" --output text)
          run_endpoint=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyRunApi'].OutputValue" --output text)
          test -n "$status_endpoint"; test "$status_endpoint" != None
          test -n "$run_endpoint"; test "$run_endpoint" != None
          curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 "$status_endpoint" -o "$work/live.json"
          stale=$(python - "$work/live.json" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          raw=json.load(open(sys.argv[1])).get('last_cycle_at')
          if not raw: print('true')
          else:
              stamp=datetime.fromisoformat(str(raw).replace('Z','+00:00'))
              print('true' if (datetime.now(timezone.utc)-stamp.astimezone(timezone.utc)).total_seconds()>2700 else 'false')
          PY
          )
          attempted=false; succeeded=false; heal_error=''
          if [ "$stale" = true ]; then
            attempted=true
            set +e
            curl -fsS --retry 2 --retry-all-errors --retry-delay 10 -X POST --max-time 900 "$run_endpoint" -o "$work/repair.json" 2>"$work/repair.err"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              sleep 5
              curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 "$status_endpoint" -o "$work/live.json"
              succeeded=true
            else
              heal_error=$(cat "$work/repair.err")
            fi
          fi
          export STACK_STATUS="$stack_status" STALE="$stale" ATTEMPTED="$attempted" SUCCEEDED="$succeeded" HEAL_ERROR="$heal_error" SOURCE_SHA="$GITHUB_SHA" LIVE_PATH="$work/live.json"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          now=datetime.now(timezone.utc)
          live=json.loads(Path(os.environ['LIVE_PATH']).read_text())
          training=int(live.get('training_samples') or 0); audited=int(live.get('live_audit_count') or 0)
          accuracy=live.get('live_accuracy'); brier=live.get('live_brier'); failures=int(live.get('consecutive_failures') or 0)
          accuracy=float(accuracy) if accuracy is not None else None; brier=float(brier) if brier is not None else None
          authority=str(live.get('authority') or 'UNKNOWN'); last_cycle=live.get('last_cycle_at')
          age=None; fresh=False
          if last_cycle:
              stamp=datetime.fromisoformat(str(last_cycle).replace('Z','+00:00'))
              age=round(max(0,(now-stamp.astimezone(timezone.utc)).total_seconds()/60),2); fresh=age<=45
          gates={'training_samples_100':training>=100,'live_audits_30':audited>=30,'live_accuracy_55pct':accuracy is not None and accuracy>=.55,'brier_at_most_0_25':brier is not None and brier<=.25,'circuit_breaker_clear':failures<3 and authority!='DEGRADED'}
          heal_error=os.environ.get('HEAL_ERROR','').strip() or None
          out={'checked_at':now.isoformat(),'source_commit':os.environ.get('SOURCE_SHA'),'stack_status':os.environ.get('STACK_STATUS'),'status_endpoint_available':True,'query_succeeded':True,'query_error':None,'service':live.get('service'),'authority':authority,'reason':live.get('reason'),'last_error':live.get('last_error'),'last_warning':live.get('last_warning'),'historical_backfill_enabled':live.get('historical_backfill_enabled'),'historical_backfill_required':live.get('historical_backfill_required'),'automatic_prediction_allowed':bool(live.get('automatic_prediction_allowed',False)),'training_samples':training,'live_audit_count':audited,'live_accuracy':accuracy,'live_brier':brier,'consecutive_failures':failures,'last_cycle_at':last_cycle,'cycle_age_minutes':age,'cycle_fresh':fresh,'cycle_stale_before_repair':os.environ.get('STALE')=='true','self_heal_attempted':os.environ.get('ATTEMPTED')=='true','self_heal_succeeded':os.environ.get('SUCCEEDED')=='true','self_heal_error':heal_error,'model_version':live.get('model_version'),'promotion_gates':gates,'all_promotion_gates_pass':all(gates.values()),'operationally_healthy':os.environ.get('STACK_STATUS')=='UPDATE_COMPLETE' and fresh and failures<3 and authority!='DEGRADED' and not heal_error}
          Path('/tmp/tennis-runtime-refresh/snapshot.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out['stack_status']=='UPDATE_COMPLETE' and out['cycle_fresh'] and out['consecutive_failures']<3 and out['authority']!='DEGRADED' and not out['automatic_prediction_allowed'] and out['operationally_healthy'], out
          PY
      - name: Publish snapshot and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in $(seq 1 20); do
            git fetch origin main
            git checkout -B tennis-runtime-refresh-publish origin/main
            mkdir -p runtime
            cp /tmp/tennis-runtime-refresh/snapshot.json runtime/tennis_autonomy_status.json
            rm -f .github/workflows/repair-tennis-runtime-evidence-now.yml
            git add runtime/tennis_autonomy_status.json .github/workflows/repair-tennis-runtime-evidence-now.yml
            git diff --cached --quiet && exit 0
            git commit -m 'Refresh and verify tennis autonomy runtime evidence [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
