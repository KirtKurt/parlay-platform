name: MLB V10 Autonomous Signal Discovery

"on":
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v10-autonomous-signal-discovery.yml'
      - 'hello_world/mlb_v10_autonomous_signal_discovery_v1.py'
      - 'hello_world/mlb_v10_permutation_control_v2.py'
      - 'hello_world/mlb_no_bbd_context_bridge_v1.py'
      - 'hello_world/mlb_v8_historical_context_overlay_v1.py'
      - 'scripts/run_mlb_v10_autonomous_signal_discovery.py'
      - 'scripts/run_mlb_v10_context_discovery_v1.py'
      - 'runtime_reports/mlb_v8_historical_context_backfill_latest.json'
      - 'tests/unit/test_run_mlb_v10_context_discovery_v1.py'
  pull_request:
    paths:
      - '.github/workflows/mlb-v10-autonomous-signal-discovery.yml'
      - 'hello_world/mlb_v10_autonomous_signal_discovery_v1.py'
      - 'hello_world/mlb_v10_permutation_control_v2.py'
      - 'hello_world/mlb_no_bbd_context_bridge_v1.py'
      - 'scripts/run_mlb_v10_autonomous_signal_discovery.py'
      - 'scripts/run_mlb_v10_context_discovery_v1.py'
      - 'tests/unit/test_run_mlb_v10_context_discovery_v1.py'

permissions:
  contents: write

concurrency:
  group: mlb-v10-autonomous-signal-discovery
  cancel-in-progress: false

env:
  REPORT_PATH: runtime_reports/mlb_v10_autonomous_signal_discovery_latest.json
  TARGET_SNAPSHOTS_TABLE: parlay_platform_snapshots
  SNAPSHOTS_TABLE: parlay_platform_snapshots
  BBS_API_DISABLED: 'true'
  MLB_V8_HISTORICAL_BBS_OVERLAY_ENABLED: 'true'
  MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'false'
  MLB_V8_HISTORICAL_CONTEXT_OVERLAY_ENABLED: 'true'
  MLB_V8_HISTORICAL_CONTEXT_OVERLAY_REQUIRED: 'false'
  PYTHONPATH: .:hello_world:scripts

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate context-aware V10 implementation
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            hello_world/mlb_v10_autonomous_signal_discovery_v1.py \
            hello_world/mlb_v10_permutation_control_v2.py \
            hello_world/mlb_no_bbd_context_bridge_v1.py \
            scripts/run_mlb_v10_autonomous_signal_discovery.py \
            scripts/run_mlb_v10_context_discovery_v1.py \
            scripts/resolve_mlb_historical_artifacts_bucket.py
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_v10_autonomous_signal_discovery_v1.py \
            tests/unit/test_mlb_v10_permutation_control_v2.py \
            tests/unit/test_run_mlb_v10_autonomous_signal_discovery.py \
            tests/unit/test_run_mlb_v10_context_discovery_v1.py \
            tests/unit/test_mlb_no_bbd_context_bridge_v1.py \
            tests/unit/test_resolve_mlb_historical_artifacts_bucket.py

      - name: Preserve previous frozen registry
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test -s "$REPORT_PATH"; then cp "$REPORT_PATH" /tmp/mlb-v10-previous.json; else printf '{}\n' > /tmp/mlb-v10-previous.json; fi
          rm -f "$REPORT_PATH"

      - name: Resolve historical artifacts bucket
        id: runtime
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -uo pipefail
          bucket_name=$(python scripts/resolve_mlb_historical_artifacts_bucket.py \
            --region "$AWS_REGION_VALUE" \
            --json-output /tmp/mlb-v10-bucket-resolution.json)
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if test "$status" -eq 0 && test -n "$bucket_name"; then
            echo "bucket_name=$bucket_name" >> "$GITHUB_OUTPUT"
            echo 'resolved=true' >> "$GITHUB_OUTPUT"
          else
            echo 'resolved=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Scrub settled games and rebuild context-aware registry
        id: discovery
        if: steps.runtime.outputs.resolved == 'true'
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          MLB_HISTORICAL_ARTIFACTS_BUCKET: ${{ steps.runtime.outputs.bucket_name }}
          MLB_HISTORICAL_START_DATE: '2025-04-01'
          MLB_HISTORICAL_END_DATE: '2026-12-31'
          PYTHONUNBUFFERED: '1'
        run: |
          set -uo pipefail
          python -u scripts/run_mlb_v10_context_discovery_v1.py \
            --output "$REPORT_PATH" \
            --previous /tmp/mlb-v10-previous.json \
            2>&1 | tee /tmp/mlb-v10-discovery.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure fresh durable V10 evidence
        if: always()
        env:
          BUCKET_RESOLVED: ${{ steps.runtime.outputs.resolved }}
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          DISCOVERY_EXIT_CODE: ${{ steps.discovery.outputs.exit_code }}
        run: |
          set -euo pipefail
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-v10-discovery.log').read_text(errors='replace')[-12000:] if Path('/tmp/mlb-v10-discovery.log').exists() else ''
          resolved=os.environ.get('BUCKET_RESOLVED') == 'true'
          outcome=os.environ.get('DISCOVERY_OUTCOME')
          blocker='historical_artifacts_bucket_unresolved' if not resolved else ('v10_discovery_cancelled' if outcome == 'cancelled' else 'v10_report_missing_after_discovery')
          value={
              'ok':False,'proofType':'MLB_V10_AUTONOMOUS_DISCOVERY_RUN',
              'mode':'CHRONOLOGICAL_SIDE_APPLICABLE_DISCOVERY',
              'winnerKnownBeforeSignalConstruction':False,
              'outcomeUsedOnlyForTrainingLabels':True,
              'productionAuthority':False,'mayWriteChampion':False,'mayPublishPicks':False,
              'liveBbdApiAvailable':False,'liveBbdApiRequired':False,'providerCallsMade':0,
              'sourceSha':os.environ.get('GITHUB_SHA'),'runId':os.environ.get('GITHUB_RUN_ID'),
              'completedAtUtc':datetime.now(timezone.utc).isoformat(),
              'stalledStage':'V10_BUCKET_RESOLUTION' if not resolved else 'V10_DISCOVERY_BEFORE_REPORT_WRITE',
              'errorLogTail':log,'blockers':[blocker],
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v10-autonomous-discovery-${{ github.run_id }}
          path: |
            runtime_reports/mlb_v10_autonomous_signal_discovery_latest.json
            /tmp/mlb-v10-previous.json
            /tmp/mlb-v10-discovery.log
            /tmp/mlb-v10-bucket-resolution.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish latest V10 registry or failure evidence
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cp "$REPORT_PATH" /tmp/mlb-v10-report.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v10-discovery-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-v10-report.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V10 autonomous discovery evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce successful context-aware V10 discovery
        if: always()
        run: |
          python - <<'PY'
          import json, os
          value=json.load(open(os.environ['REPORT_PATH']))
          assert value.get('ok') is True, value
          assert value.get('mode') == 'CHRONOLOGICAL_SIDE_APPLICABLE_DISCOVERY', value
          assert value.get('autonomousFeatureGeneration') is True, value
          assert value.get('atomicAndInteractionDiscovery') is True, value
          assert value.get('winnerKnownBeforeSignalConstruction') is False, value
          assert value.get('outcomeUsedOnlyForTrainingLabels') is True, value
          assert value.get('canonicalEligibilityFailClosed') is True, value
          assert value.get('conflictingDuplicatesPermanentlyQuarantined') is True, value
          assert value.get('exactSignificanceTest') == 'two-sided exact binomial', value
          assert isinstance(value.get('negativeControl'), dict), value
          assert value.get('productionAuthority') is False, value
          assert value.get('mayWriteChampion') is False, value
          assert value.get('mayPublishPicks') is False, value
          assert int(value.get('settledGameCount') or 0) > 0, value
          proof=(value.get('canonicalCorpusProof') or {}).get('providerNeutralPointInTimeContext') or {}
          assert proof.get('atomicRuleContextEnabled') is True, proof
          assert proof.get('interactionRuleContextEnabled') is True, proof
          assert proof.get('statisticalGatesChanged') is False, proof
          assert int(proof.get('providerCallsMade') or 0) == 0, proof
          assert proof.get('liveBbdApiRequired') is False, proof
          assert not value.get('blockers'), value
          PY
