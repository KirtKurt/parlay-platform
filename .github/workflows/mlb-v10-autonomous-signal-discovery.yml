name: MLB V10 Autonomous Signal Discovery

"on":
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_v10_autonomous_signal_discovery_v1.py'
      - 'hello_world/mlb_v10_development_frozen_portfolio_v3.py'
      - 'hello_world/mlb_v10_permutation_control_v2.py'
      - 'scripts/run_mlb_v10_autonomous_signal_discovery.py'
      - 'scripts/resolve_mlb_historical_artifacts_bucket.py'
      - 'tests/unit/test_mlb_v10_autonomous_signal_discovery_v1.py'
      - 'tests/unit/test_run_mlb_v10_autonomous_signal_discovery.py'
      - 'tests/unit/test_mlb_v10_permutation_control_v2.py'
      - 'tests/unit/test_resolve_mlb_historical_artifacts_bucket.py'
      - '.github/workflows/mlb-v10-autonomous-signal-discovery.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v10-autonomous-signal-discovery
  cancel-in-progress: false

env:
  REPORT_PATH: runtime_reports/mlb_v10_autonomous_signal_discovery_latest.json
  TARGET_SNAPSHOTS_TABLE: parlay_platform_snapshots
  SNAPSHOTS_TABLE: parlay_platform_snapshots

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate V10 implementation
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          PYTHONPATH=hello_world python -m py_compile \
            hello_world/mlb_v10_autonomous_signal_discovery_v1.py \
            hello_world/mlb_v10_development_frozen_portfolio_v3.py \
            hello_world/mlb_v10_permutation_control_v2.py \
            scripts/run_mlb_v10_autonomous_signal_discovery.py \
            scripts/resolve_mlb_historical_artifacts_bucket.py
          PYTHONPATH=. python -m pytest -q --tb=short \
            tests/unit/test_mlb_v10_autonomous_signal_discovery_v1.py \
            tests/unit/test_run_mlb_v10_autonomous_signal_discovery.py \
            tests/unit/test_mlb_v10_permutation_control_v2.py \
            tests/unit/test_resolve_mlb_historical_artifacts_bucket.py

      - name: Preserve prior frozen registry and clear stale output
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test -s "$REPORT_PATH"; then
            cp "$REPORT_PATH" /tmp/mlb-v10-previous.json
          else
            printf '{}\n' > /tmp/mlb-v10-previous.json
          fi
          rm -f "$REPORT_PATH"

      - name: Resolve historical artifacts bucket
        id: runtime
        continue-on-error: true
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -uo pipefail
          mkdir -p runtime_reports
          bucket_name=$(python scripts/resolve_mlb_historical_artifacts_bucket.py \
            --region "${{ secrets.AWS_REGION }}" \
            --json-output /tmp/mlb-v10-bucket-resolution.json)
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if test "$status" -eq 0 && test -n "$bucket_name"; then
            echo "bucket_name=$bucket_name" >> "$GITHUB_OUTPUT"
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Scrub all settled games and rebuild registry
        id: discovery
        if: steps.runtime.outputs.resolved == 'true'
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          MLB_HISTORICAL_ARTIFACTS_BUCKET: ${{ steps.runtime.outputs.bucket_name }}
          MLB_HISTORICAL_START_DATE: '2025-04-01'
          MLB_HISTORICAL_END_DATE: '2026-12-31'
          PYTHONPATH: hello_world
          PYTHONUNBUFFERED: '1'
        run: |
          set -uo pipefail
          mkdir -p runtime_reports
          python -u scripts/run_mlb_v10_autonomous_signal_discovery.py \
            --output "$REPORT_PATH" \
            --previous /tmp/mlb-v10-previous.json \
            2>&1 | tee /tmp/mlb-v10-discovery.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure fresh durable V10 evidence exists
        if: always()
        env:
          BUCKET_RESOLVED: ${{ steps.runtime.outputs.resolved }}
          BUCKET_EXIT_CODE: ${{ steps.runtime.outputs.exit_code }}
          BUCKET_OUTCOME: ${{ steps.runtime.outcome }}
          DISCOVERY_EXIT_CODE: ${{ steps.discovery.outputs.exit_code }}
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-v10-discovery.log').read_text(errors='replace')[-12000:] if Path('/tmp/mlb-v10-discovery.log').exists() else ''
          resolution={}
          if Path('/tmp/mlb-v10-bucket-resolution.json').exists():
              try:
                  resolution=json.loads(Path('/tmp/mlb-v10-bucket-resolution.json').read_text())
              except Exception as exc:
                  resolution={'ok':False,'blockers':['bucket_resolution_evidence_invalid'],'error':str(exc)}
          bucket_resolved=os.environ.get('BUCKET_RESOLVED') == 'true'
          discovery_outcome=str(os.environ.get('DISCOVERY_OUTCOME') or '')
          blockers=list(resolution.get('blockers') or [])
          if not bucket_resolved and not blockers:
              blockers=['historical_artifacts_bucket_unresolved']
          if bucket_resolved and not blockers:
              blockers=['v10_discovery_cancelled'] if discovery_outcome == 'cancelled' else ['v10_report_missing_after_discovery']
          report={
              'ok':False,
              'proofType':'MLB_V10_AUTONOMOUS_DISCOVERY_RUN',
              'mode':'CHRONOLOGICAL_SIDE_APPLICABLE_DISCOVERY',
              'winnerKnownBeforeSignalConstruction':False,
              'outcomeUsedOnlyForTrainingLabels':True,
              'productionAuthority':False,
              'mayWriteChampion':False,
              'mayPublishPicks':False,
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'runAttempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'completedAtUtc':datetime.now(timezone.utc).isoformat(),
              'stalledStage':'V10_BUCKET_RESOLUTION' if not bucket_resolved else 'V10_DISCOVERY_BEFORE_REPORT_WRITE',
              'workflowSteps':{
                  'bucketResolution':{
                      'outcome':os.environ.get('BUCKET_OUTCOME'),
                      'exitCode':os.environ.get('BUCKET_EXIT_CODE'),
                      'resolved':bucket_resolved,
                  },
                  'discovery':{
                      'outcome':os.environ.get('DISCOVERY_OUTCOME'),
                      'exitCode':os.environ.get('DISCOVERY_EXIT_CODE'),
                  },
              },
              'errorLogTail':log,
              'bucketResolution':resolution,
              'blockers':blockers,
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_v10_autonomous_signal_discovery_latest.json').read_text())
          assert value.get('sourceSha'), value
          assert value.get('runId'), value
          assert value.get('completedAtUtc'), value
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v10-autonomous-discovery-${{ github.run_id }}
          path: |
            runtime_reports/mlb_v10_autonomous_signal_discovery_latest.json
            /tmp/mlb-v10-previous.json
            /tmp/mlb-v10-discovery.log
            /tmp/mlb-v10-bucket-resolution.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish latest V10 registry or failure evidence
        if: always()
        run: |
          set -euo pipefail
          cp "$REPORT_PATH" /tmp/mlb-v10-report.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v10-discovery-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-v10-report.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V10 autonomous discovery evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce successful V10 discovery
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_v10_autonomous_signal_discovery_latest.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('mode') == 'CHRONOLOGICAL_SIDE_APPLICABLE_DISCOVERY', value
          assert value.get('version') == 'MLB-V10-AUTONOMOUS-SIGNAL-DISCOVERY-v3.0-development-frozen-portfolio', value
          assert value.get('autonomousFeatureGeneration') is True, value
          assert value.get('atomicAndInteractionDiscovery') is True, value
          assert value.get('winnerKnownBeforeSignalConstruction') is False, value
          assert value.get('outcomeUsedOnlyForTrainingLabels') is True, value
          assert value.get('canonicalEligibilityFailClosed') is True, value
          assert value.get('conflictingDuplicatesPermanentlyQuarantined') is True, value
          assert value.get('exactSignificanceTest') == 'two-sided exact binomial', value
          assert value.get('permutationControlImplementation') == 'MLB-V10-PERMUTATION-CONTROL-v2-cached-pregame-rules', value
          assert value.get('portfolioControlImplementation') == 'MLB-V10-PORTFOLIO-PERMUTATION-v1-fixed-pregame-policy', value
          assert value.get('holdoutSelectionDefectFixed') is True, value
          assert value.get('emptyRegistryStallFixed') is True, value
          assert value.get('learningActive') is True, value
          assert int(value.get('shadowSignalCount') or 0) >= 3, value
          assert isinstance(value.get('negativeControl'), dict), value
          assert set(value['negativeControl']) == {'development','walkForward','untouchedHoldout'}, value
          for control in value['negativeControl'].values():
              assert control.get('pregameRulesCached') is True, control
              assert control.get('implementation') == value.get('permutationControlImplementation'), control
          assert isinstance(value.get('aggregateResearchPolicy'), dict), value
          assert set(value['aggregateResearchPolicy']) == {'development','walkForward','untouchedHoldout'}, value
          freeze=value.get('registryFreeze') or {}
          assert freeze.get('portfolio'), freeze
          assert int(freeze.get('frozenSignalCount') or 0) >= 3, freeze
          assert freeze.get('selectionUsedWalkForwardLabels') is False, freeze
          assert freeze.get('selectionUsedUntouchedHoldoutLabels') is False, freeze
          validation=value.get('portfolioValidation') or {}
          assert validation.get('selectionPartition') == 'development', validation
          assert validation.get('selectionUsesWalkForwardLabels') is False, validation
          assert validation.get('selectionUsesUntouchedHoldoutLabels') is False, validation
          assert validation.get('untouchedHoldoutUsedForSelection') is False, validation
          assert isinstance(value.get('prospectiveShadow'), dict), value
          assert value.get('productionAuthority') is False, value
          assert value.get('mayWriteChampion') is False, value
          assert value.get('mayPublishPicks') is False, value
          assert int(value.get('settledGameCount') or 0) > 0, value
          assert value.get('datasetFingerprint'), value
          assert not value.get('blockers'), value
          PY
