name: MLB V10 Autonomous Signal Discovery

"on":
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_v10_autonomous_signal_discovery_v1.py'
      - 'scripts/run_mlb_v10_autonomous_signal_discovery.py'
      - 'tests/unit/test_mlb_v10_autonomous_signal_discovery_v1.py'
      - '.github/workflows/mlb-v10-autonomous-signal-discovery.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v10-autonomous-signal-discovery
  cancel-in-progress: false

env:
  REPORT_PATH: runtime_reports/mlb_v10_autonomous_signal_discovery_latest.json
  TARGET_SNAPSHOTS_TABLE: parlay_platform_snapshots
  SNAPSHOTS_TABLE: parlay_platform_snapshots

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate V10 implementation
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          PYTHONPATH=hello_world python -m py_compile \
            hello_world/mlb_v10_autonomous_signal_discovery_v1.py \
            scripts/run_mlb_v10_autonomous_signal_discovery.py
          PYTHONPATH=. python -m pytest -q --tb=short \
            tests/unit/test_mlb_v10_autonomous_signal_discovery_v1.py

      - name: Resolve historical artifacts bucket
        id: runtime
        run: |
          set -euo pipefail
          bucket_name=$(aws cloudformation describe-stacks \
            --stack-name parlay-platform-mlb-historical-optimizer \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalArtifactsBucketName'].OutputValue" \
            --output text)
          test -n "$bucket_name"; test "$bucket_name" != None
          echo "bucket_name=$bucket_name" >> "$GITHUB_OUTPUT"

      - name: Scrub all settled games and rebuild registry
        id: discovery
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          MLB_HISTORICAL_ARTIFACTS_BUCKET: ${{ steps.runtime.outputs.bucket_name }}
          MLB_HISTORICAL_START_DATE: '2025-04-01'
          MLB_HISTORICAL_END_DATE: '2026-12-31'
          PYTHONPATH: hello_world
        run: |
          set -uo pipefail
          mkdir -p runtime_reports
          python scripts/run_mlb_v10_autonomous_signal_discovery.py --output "$REPORT_PATH" \
            2>&1 | tee /tmp/mlb-v10-discovery.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure durable V10 evidence exists
        if: always()
        env:
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-v10-discovery.log').read_text(errors='replace')[-12000:] if Path('/tmp/mlb-v10-discovery.log').exists() else ''
          report={
              'ok':False,
              'proofType':'MLB_V10_AUTONOMOUS_DISCOVERY_RUN',
              'mode':'OUTCOME_ANCHORED_RETROSPECTIVE_DISCOVERY',
              'productionAuthority':False,
              'mayWriteChampion':False,
              'mayPublishPicks':False,
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'runAttempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'completedAtUtc':datetime.now(timezone.utc).isoformat(),
              'stalledStage':'V10_WORKFLOW_BEFORE_REPORT_WRITE',
              'errorLogTail':log,
              'blockers':['v10_report_missing'],
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v10-autonomous-discovery-${{ github.run_id }}
          path: |
            runtime_reports/mlb_v10_autonomous_signal_discovery_latest.json
            /tmp/mlb-v10-discovery.log
          retention-days: 90
          if-no-files-found: warn

      - name: Publish latest V10 registry or failure evidence
        if: always()
        run: |
          set -euo pipefail
          cp "$REPORT_PATH" /tmp/mlb-v10-report.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v10-discovery-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-v10-report.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V10 autonomous discovery evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce successful V10 discovery
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_v10_autonomous_signal_discovery_latest.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('mode') == 'OUTCOME_ANCHORED_RETROSPECTIVE_DISCOVERY', value
          assert value.get('autonomousFeatureGeneration') is True, value
          assert value.get('winnerKnownBeforeSignalConstruction') is True, value
          assert value.get('productionAuthority') is False, value
          assert value.get('mayWriteChampion') is False, value
          assert value.get('mayPublishPicks') is False, value
          assert int(value.get('settledGameCount') or 0) > 0, value
          assert value.get('datasetFingerprint'), value
          assert not value.get('blockers'), value
          PY
