name: Repair MLB All Stalls Once

on:
  push:
    branches:
      - 'agent/repair-mlb-all-stalls-20260802'
    paths:
      - '.github/workflows/repair-mlb-all-stalls-once.yml'

permissions:
  contents: write

concurrency:
  group: repair-mlb-all-stalls-once
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2

      - name: Repair current main, validate, and publish
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -uo pipefail
          cat > /tmp/apply_mlb_repair.py <<'PY'
          from pathlib import Path

          old_ids = (
              'mlb-v2-2026-08-02-future-prospective-r6',
              'mlb-v2-2026-08-02-future-prospective-r7',
          )
          new_id = 'mlb-v2-2026-08-03-future-prospective-r7'
          old_cutoffs = (
              '2026-08-02T04:00:00+00:00',
              '2026-08-02T08:00:00+00:00',
          )
          new_cutoff = '2026-08-03T04:00:00+00:00'

          paths = []
          for root in (Path('hello_world'), Path('scripts'), Path('tests/unit')):
              if root.exists():
                  paths.extend(root.rglob('*.py'))
          paths.append(Path('template.yaml'))
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old_id in old_ids:
                  updated = updated.replace(old_id, new_id)
              for old_cutoff in old_cutoffs:
                  updated = updated.replace(old_cutoff, new_cutoff)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          clean = Path('tests/unit/test_mlb_ml_r5_clean_cutover.py')
          if clean.exists():
              text = clean.read_text(encoding='utf-8')
              text = text.replace('2026-08-02T03:00:00+00:00', '2026-08-03T03:00:00+00:00')
              text = text.replace('datetime(2026, 8, 2, 3, 30', 'datetime(2026, 8, 3, 3, 30')
              text = text.replace('test_r6_', 'test_r7_').replace('r6_loader', 'r7_loader')
              text = text.replace('pre-r6', 'pre-r7').replace('by_r6', 'by_r7')
              clean.write_text(text, encoding='utf-8')

          training = Path('tests/unit/test_mlb_ml_aws_training_v1.py')
          if training.exists():
              text = training.read_text(encoding='utf-8')
              text = text.replace(
                  'datetime(2026, 8, 2, 4, 0, tzinfo=timezone.utc),\n'
                  '        datetime(2026, 8, 2, 4, 0, 0, 1, tzinfo=timezone.utc),',
                  'datetime(2026, 8, 3, 4, 0, tzinfo=timezone.utc),\n'
                  '        datetime(2026, 8, 3, 4, 0, 0, 1, tzinfo=timezone.utc),',
              )
              marker = 'def test_partial_prior_et_slate_cannot_freeze_or_deadlock_manifest'
              if marker in text:
                  start = text.index(marker)
                  end = text.find('\ndef ', start + 4)
                  if end < 0:
                      end = len(text)
                  block = text[start:end]
                  block = block.replace(
                      'after_midnight_et = datetime(2026, 8, 3, 4, 30, tzinfo=timezone.utc)',
                      'after_midnight_et = datetime(2026, 8, 4, 4, 30, tzinfo=timezone.utc)',
                  ).replace('2026-08-02', '2026-08-03')
                  text = text[:start] + block + text[end:]
              training.write_text(text, encoding='utf-8')

          r6 = Path('tests/unit/test_mlb_r6_recovery_contract.py')
          r7 = Path('tests/unit/test_mlb_r7_recovery_contract.py')
          if r6.exists():
              text = r6.read_text(encoding='utf-8')
              text = text.replace('August 2', 'August 3')
              text = text.replace('test_r6_', 'test_r7_')
              text = text.replace('r6_starts', 'r7_starts')
              text = text.replace('2026-08-02', '2026-08-03')
              text = text.replace('r6', 'r7')
              r7.write_text(text, encoding='utf-8')
              r6.unlink()

          template = Path('template.yaml').read_text(encoding='utf-8')
          assert new_id in template, 'new MLB experiment identity absent from template'
          assert new_cutoff in template, 'new prospective cutoff absent from template'
          for value in old_ids + old_cutoffs:
              assert value not in template, f'stale release authority remains in template: {value}'
          PY

          cat > /tmp/run_validation.sh <<'SH'
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'requests>=2.31,<3' 'PyYAML>=6,<7' -r hello_world/requirements.txt
          python /tmp/apply_mlb_repair.py
          python -m compileall -q hello_world scripts
          if [ -f scripts/stabilize_mlb_deploy_source.py ]; then python scripts/stabilize_mlb_deploy_source.py; fi
          if [ -f scripts/patch_template_mlb_v1.py ]; then python scripts/patch_template_mlb_v1.py; fi
          if [ -f scripts/patch_template_mlb_security.py ]; then python scripts/patch_template_mlb_security.py; fi
          if [ -f scripts/patch_template_mlb_results_routes.py ]; then python scripts/patch_template_mlb_results_routes.py; fi
          git diff --check
          sam validate --template-file template.yaml
          tests=(
            tests/unit/test_mlb_ml_aws_training_v1.py
            tests/unit/test_mlb_ml_r5_clean_cutover.py
            tests/unit/test_mlb_r7_recovery_contract.py
            tests/unit/test_mlb_deploy_identity.py
            tests/unit/test_run_mlb_ml_v3_audit_report.py
            tests/unit/test_mlb_trainer_deploy_response.py
          )
          existing=()
          for test_file in "${tests[@]}"; do [ -f "$test_file" ] && existing+=("$test_file"); done
          test ${#existing[@]} -gt 0
          python -m pytest -q --tb=short "${existing[@]}"
          sam build --template-file template.yaml --cached
          if [ -f scripts/verify_mlb_schedule_invariants.py ]; then
            python scripts/verify_mlb_schedule_invariants.py --template .aws-sam/build/template.yaml
          fi
          SH
          chmod +x /tmp/run_validation.sh

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          status=0
          git fetch origin main
          git checkout -B mlb-all-stalls-repair origin/main
          /tmp/run_validation.sh > /tmp/mlb-repair.log 2>&1 || status=$?

          if [ "$status" -ne 0 ]; then
            git reset --hard origin/main
            mkdir -p runtime_reports
            python - "$status" <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone
          log = pathlib.Path('/tmp/mlb-repair.log').read_text(errors='replace')
          payload = {
              'proofType': 'MLB_ALL_STALLS_REPAIR_DIAGNOSTIC',
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'ok': False,
              'stage': 'source_alignment_validation',
              'exitCode': int(sys.argv[1]),
              'logTail': log[-16000:],
              'requiredAction': 'Repair the first failing fail-closed validation shown in logTail and rerun.',
          }
          pathlib.Path('runtime_reports/mlb_all_stalls_repair_latest.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY
            git add runtime_reports/mlb_all_stalls_repair_latest.json
            git commit -m 'Publish MLB all-stalls repair diagnostic [skip ci]'
            for attempt in 1 2 3 4 5; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main || { git rebase --abort; sleep $((attempt * 3)); continue; }
            done
            cat /tmp/mlb-repair.log
            exit "$status"
          fi

          rm -f .github/workflows/mlb-r7-release-window-repair-once.yml
          mkdir -p runtime_reports
          python <<'PY'
          import json, pathlib
          from datetime import datetime, timezone
          payload = {
              'proofType': 'MLB_ALL_STALLS_SOURCE_REPAIR',
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'ok': True,
              'experimentId': 'mlb-v2-2026-08-03-future-prospective-r7',
              'releaseCutoffUtc': '2026-08-03T04:00:00+00:00',
              'immutableLockRulesChanged': False,
              'canonicalDeduplicationChanged': False,
              'promotionGatesWeakened': False,
              'validation': 'targeted MLB tests, SAM validate/build, schedule invariants',
              'nextAction': 'Normal main deployment and fresh runtime verification.',
          }
          pathlib.Path('runtime_reports/mlb_all_stalls_repair_latest.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY
          git add -A hello_world scripts template.yaml tests/unit runtime_reports .github/workflows
          git commit -m 'Repair MLB release authority and deployment source'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
