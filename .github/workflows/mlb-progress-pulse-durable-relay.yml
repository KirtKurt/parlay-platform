name: MLB progress pulse durable relay

run-name: MLB durable pulse relay hop ${{ github.event_name == 'workflow_dispatch' && inputs.remaining_hops || '96' }}

on:
  # Best-effort seeds renew a finite 48-hour lease. Once any seed is admitted,
  # each successor waits on the repository-owned non-billable environment timer.
  schedule:
    - cron: '23 3 * * *'
  workflow_run:
    workflows:
      - MLB Canonical Runtime Health Watch
      - MLB Scoring Guard
      - Deploy SAM to AWS
      - Verify MLB Scoring Fix After Deploy
      - MLB Production Source Contract
      - Unified MLB learning recovery once
      - MLB Daily Yesterday Audit
      - Tennis Autonomy Status Backstop
      - Publish Tennis Autonomy Status
      - NFL Auto AWS Stack Probe
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      remaining_hops:
        description: Finite 30-minute relay hops, from 1 through 96
        required: false
        default: 96
        type: number
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-progress-pulse-durable-relay.yml'

permissions:
  actions: write
  contents: read
  issues: read

# Environment waits consume no runner. Concurrency preserves one waiting/active
# hop and at most one trusted renewal seed without canceling the current hop.
concurrency:
  group: mlb-progress-pulse-durable-relay
  cancel-in-progress: false

jobs:
  relay:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    # Do not merge until the owner configures this public-repository environment
    # with exactly one 30-minute wait timer and no reviewer/custom gates.
    environment:
      name: mlb-pulse-30m-delay
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact current main policy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate read-only relay boundary
        run: |
          set -euo pipefail
          python -m py_compile scripts/check_mlb_progress_pulse_staleness.py
          python -m py_compile scripts/run_mlb_progress_pulse_durable_relay.py
          ! grep -Ei 'boto3|aws[[:space:]]+(dynamodb|lambda)|put_item|update_item|delete_item' scripts/check_mlb_progress_pulse_staleness.py scripts/run_mlb_progress_pulse_durable_relay.py
          ! grep -Ei 'gh[[:space:]]+issue|issues:[[:space:]]+write' scripts/run_mlb_progress_pulse_durable_relay.py

      - name: Maintain one protected finite relay hop
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REMAINING_HOPS: ${{ inputs.remaining_hops }}
        run: |
          set -euo pipefail
          python scripts/run_mlb_progress_pulse_durable_relay.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --remaining-hops "${INPUT_REMAINING_HOPS:-}" \
            --event-path "$GITHUB_EVENT_PATH"
