name: Diagnose MLB August 4 prelock review (read only)

"on":
  push:
    branches:
      - codex/diagnose-mlb-aug4-prelock-review-20260829

permissions:
  contents: read

concurrency:
  group: diagnose-mlb-aug4-prelock-review-read-only
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  MLB_ROOT_STACK: parlay-platform-dev
  DIAGNOSTIC_SLATE_DATE: '2026-08-04'
  DEPLOYED_FIX_SHA: 61400606b4212925722f52e4230a711318769a27

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove diagnostic source matches deployed selector
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$DEPLOYED_FIX_SHA" HEAD
          git diff --quiet "$DEPLOYED_FIX_SHA" --             hello_world/mlb_daily_per_game_lock_patch.py             hello_world/mlb_daily_pick_lock_protected.py             hello_world/mlb_ml_runtime_install_v3.py             hello_world/mlb_prospective_row_repair.py             hello_world/inqsi_pull_history.py

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install read-only diagnostic dependency
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Strong-read exact prelock predicate matrix
        env:
          PYTHONPATH: hello_world
        run: |
          set -euo pipefail
          mkdir -p /tmp/mlb-prelock-review-diagnostic
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from decimal import Decimal
          from pathlib import Path

          import boto3

          SLATE = os.environ["DIAGNOSTIC_SLATE_DATE"]
          REGION = os.environ["AWS_REGION"]
          STACK = os.environ["MLB_ROOT_STACK"]
          LOGICAL_ID = "MLBDailyPickLockFunction"
          EXPECTED_HANDLER = "mlb_daily_pick_lock_protected.lambda_handler"
          EXPECTED_STATE = "REVIEW_REQUIRED"
          EXPECTED_STAGE = "PROVE_PRELOCK_ABSENCE"
          EXPECTED_ERROR = "PRELOCK_CANDIDATE_REQUIRES_REVIEW"

          def plain(value):
              if isinstance(value, Decimal):
                  return int(value) if value == value.to_integral_value() else float(value)
              if isinstance(value, dict):
                  return {str(key): plain(item) for key, item in value.items()}
              if isinstance(value, list):
                  return [plain(item) for item in value]
              return value

          def digest(value):
              return hashlib.sha256(str(value or "").encode("utf-8")).hexdigest()

          cloudformation = boto3.client("cloudformation", region_name=REGION)
          resource = cloudformation.describe_stack_resource(
              StackName=STACK,
              LogicalResourceId=LOGICAL_ID,
          ).get("StackResourceDetail") or {}
          function_name = str(resource.get("PhysicalResourceId") or "")
          if (
              not function_name
              or resource.get("LogicalResourceId") != LOGICAL_ID
              or resource.get("ResourceType") != "AWS::Lambda::Function"
          ):
              raise SystemExit("Protected lock Lambda resolution failed closed")

          lambda_client = boto3.client("lambda", region_name=REGION)
          configuration = lambda_client.get_function_configuration(
              FunctionName=function_name
          )
          variables = (
              (configuration.get("Environment") or {}).get("Variables") or {}
          )
          snapshots_table = str(variables.get("SNAPSHOTS_TABLE") or "")
          if (
              configuration.get("Handler") != EXPECTED_HANDLER
              or configuration.get("State") != "Active"
              or configuration.get("LastUpdateStatus") != "Successful"
              or not snapshots_table
          ):
              raise SystemExit("Protected lock Lambda/configuration is not ready")

          os.environ["SNAPSHOTS_TABLE"] = snapshots_table
          for key in (
              "OUTCOMES_TABLE",
              "MLB_DAILY_LOCK_MINUTES_BEFORE_FIRST_GAME",
              "LOCK_MINUTES_BEFORE_FIRST_GAME",
              "MLB_REQUIRE_ALL_GAMES_FOR_LOCK",
              "MLB_MIN_PULLS_PER_GAME_FOR_LOCK",
              "MLB_MAX_LATEST_PULL_AGE_MINUTES_FOR_LOCK",
              "INQSI_SLATE_TIMEZONE",
          ):
              if key in variables:
                  os.environ[key] = str(variables[key])

          sys.path.insert(0, "hello_world")
          import inqsi_pull_history as history_contract
          import mlb_daily_pick_lock_protected as protected
          import mlb_prospective_row_repair as repair

          module = protected.mlb_daily_pick_lock
          patch = protected.mlb_daily_per_game_lock_patch
          if (
              protected.ML_RUNTIME_INSTALL_STATUS.get("ok") is not True
              or protected.ML_VECTOR_PRESERVATION_STATUS.get("ok") is not True
              or protected.PER_GAME_LOCK_STATUS.get("ok") is not True
          ):
              raise SystemExit(
                  "Exact protected MLB runtime installation failed closed"
              )

          exact_table = boto3.resource(
              "dynamodb", region_name=REGION
          ).Table(snapshots_table)
          module.TABLE = exact_table
          module.history.PULLS = exact_table
          history_contract.PULLS = exact_table
          if (
              module.TABLE is None
              or module.history.PULLS is None
              or history_contract.PULLS is None
          ):
              raise SystemExit("Exact snapshots table binding failed closed")

          queue_key = {
              "PK": "MLB_LOCK_EXECUTION#V1",
              "SK": "COOPERATIVE_TERMINAL_REPLAY#V1",
          }
          queue_item = plain(
              module.TABLE.get_item(
                  Key=queue_key,
                  ConsistentRead=True,
              ).get("Item")
              or {}
          )
          progress = queue_item.get("terminal_replay_progress") or {}
          attempt = progress.get("lastAttempt") or {}
          checkpoint_matches_expected_review = bool(
              queue_item.get("record_type")
              == "mlb_cooperative_terminal_replay_v1"
              and queue_item.get("state") == EXPECTED_STATE
              and queue_item.get("slate_date_et") == SLATE
              and attempt.get("stage") == EXPECTED_STAGE
              and attempt.get("errorCode") == EXPECTED_ERROR
              and attempt.get("status") == "FAILED_CLOSED"
          )
          checkpoint_summary = {
              "recordPresent": bool(queue_item),
              "recordTypeMatches": queue_item.get("record_type")
              == "mlb_cooperative_terminal_replay_v1",
              "queueState": queue_item.get("state"),
              "slateDateEt": queue_item.get("slate_date_et"),
              "progressPresent": isinstance(progress, dict) and bool(progress),
              "progressVersion": progress.get("version"),
              "progressCounters": {
                  field: progress.get(field)
                  for field in (
                      "attemptCount",
                      "manifestGameCount",
                      "nextGameIndex",
                      "processedGameCount",
                      "terminalCount",
                      "canonicalCount",
                      "noPredictionDataCount",
                      "missedLockValidPrelockQuarantineCount",
                      "reconciledCount",
                      "verificationIndex",
                      "verifiedGameCount",
                  )
              },
              "progressProcessedGameEntries": len(
                  progress.get("processedGames") or []
              ),
              "progressVerificationComplete": progress.get(
                  "verificationComplete"
              ),
              "attemptPresent": isinstance(attempt, dict) and bool(attempt),
              "attemptStage": attempt.get("stage"),
              "attemptStatus": attempt.get("status"),
              "attemptErrorCode": attempt.get("errorCode"),
              "topLevelLastChunkStage": queue_item.get("last_chunk_stage"),
              "topLevelLastChunkStatus": queue_item.get("last_chunk_status"),
              "matchesExpectedReview": checkpoint_matches_expected_review,
              "readOnly": True,
              "directTableWrite": False,
              "secretExposed": False,
          }
          Path(
              "/tmp/mlb-prelock-review-diagnostic/checkpoint-summary.json"
          ).write_text(
              json.dumps(checkpoint_summary, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8",
          )
          print(json.dumps(checkpoint_summary, indent=2, sort_keys=True))
          if (
              not queue_item
              or queue_item.get("record_type")
              != "mlb_cooperative_terminal_replay_v1"
              or queue_item.get("slate_date_et") != SLATE
          ):
              raise SystemExit("Protected replay record identity changed")

          try:
              game_index = int(progress.get("nextGameIndex"))
          except (TypeError, ValueError) as exc:
              raise SystemExit(
                  "Protected replay next game index missing"
              ) from exc
          manifest_authority = progress.get("manifestAuthority") or {}
          checkpoint_roster = manifest_authority.get("gameRoster") or []
          if (
              not isinstance(checkpoint_roster, list)
              or game_index < 0
              or game_index >= len(checkpoint_roster)
              or not isinstance(checkpoint_roster[game_index], dict)
          ):
              raise SystemExit(
                  "Protected replay next-game roster binding missing"
              )
          checkpoint_identity = str(
              checkpoint_roster[game_index].get("gameIdentity") or ""
          )
          if not checkpoint_identity:
              raise SystemExit(
                  "Protected replay next-game identity missing"
              )

          status_token = patch._STATUS_READ_CACHE.set({"canonicalPulls": {}})
          alias_token = patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.set(
              repair.COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_QUERY_LIMIT
          )
          try:
              pulls = sorted(
                  list(module._pulls_for_date(SLATE) or []),
                  key=lambda pull: patch._pull_at(module, pull)
                  or datetime.min.replace(tzinfo=timezone.utc),
              )
              manifest = sorted(
                  list(module._latest_games_for_date(SLATE, pulls) or []),
                  key=lambda game: (
                      (
                          patch._start(module, game)
                          or datetime.min.replace(tzinfo=timezone.utc)
                      ).isoformat(),
                      str(patch.game_identity(game) or ""),
                  ),
              )
              if not pulls or game_index < 0 or game_index >= len(manifest):
                  raise SystemExit("Historical pull/manifest evidence unavailable")
              all_identity_options = [
                  repair._cooperative_terminal_identity_options(patch, item)
                  for item in manifest
              ]
              selected_manifest_authority = (
                  patch._select_provider_manifest_authority(
                      module,
                      pulls,
                      SLATE,
                      manifest,
                  )
              )
              game = manifest[game_index]
              identity_options = all_identity_options[game_index]
              if checkpoint_identity not in identity_options:
                  raise SystemExit("Checkpoint identity is not manifest-bound")

              scoring = patch._scoring_pulls(module, pulls, game)
              candidate, proof, bound, errors = patch._last_prelock_candidate(
                  module,
                  SLATE,
                  game,
                  scoring,
              )
              candidate = plain(candidate) if isinstance(candidate, dict) else None
              proof = plain(proof) if isinstance(proof, dict) else None
              bound = plain(bound) if isinstance(bound, list) else []
              errors = sorted(set(str(error) for error in (errors or [])))

              proven_absence = bool(
                  candidate is None
                  and proof is None
                  and not bound
                  and patch._is_no_prediction_candidate_failure(errors)
              )
              required_fingerprints = (
                  "candidateSnapshotFingerprint",
                  "predictionPayloadFingerprint",
                  "candidateRowFingerprint",
                  "candidateSelectionFingerprint",
                  "predictionSourcePullFingerprint",
              )
              fingerprint_lengths = {
                  field: len(str((proof or {}).get(field) or ""))
                  for field in required_fingerprints
              }
              required_keys = (
                  "pk",
                  "sk",
                  "persistenceWritePk",
                  "persistenceWriteSk",
              )
              missing_required_keys = [
                  field
                  for field in required_keys
                  if not str((proof or {}).get(field) or "")
              ]
              rejected = (
                  (proof or {}).get("rejectedNewerCandidates")
                  if isinstance((proof or {}).get("rejectedNewerCandidates"), list)
                  else None
              )
              predicate = {
                  "candidateObject": isinstance(candidate, dict),
                  "proofObject": isinstance(proof, dict),
                  "boundScoringNonEmpty": isinstance(bound, list) and bool(bound),
                  "selectorErrorsEmpty": not errors,
                  "identityBindingAccepted": (proof or {}).get(
                      "identityBindingMode"
                  )
                  in {"exact_identity", "official_game_pk"},
                  "createdAtOrBeforeCutoff": (proof or {}).get(
                      "createdAtOrBeforeCutoff"
                  )
                  is True,
                  "sourceAtOrBeforeCutoff": (proof or {}).get(
                      "sourceAtOrBeforeCutoff"
                  )
                  is True,
                  "persistedAtOrBeforeCutoff": (proof or {}).get(
                      "persistedAtOrBeforeCutoff"
                  )
                  is True,
                  "modelOrSignalRecomputedAtLockFalse": (proof or {}).get(
                      "modelOrSignalRecomputedAtLock"
                  )
                  is False,
                  "persistenceProofTypeExact": (proof or {}).get(
                      "persistenceProofType"
                  )
                  == patch.PREGAME_PERSISTENCE_PROOF_TYPE,
                  "payloadFingerprintVersionExact": (proof or {}).get(
                      "predictionPayloadFingerprintVersion"
                  )
                  == patch.PAYLOAD_FINGERPRINT_VERSION,
                  "allFiveFingerprints64": all(
                      length == 64 for length in fingerprint_lengths.values()
                  ),
                  "requiredKeysPresent": not missing_required_keys,
                  "rejectedNewerCandidateCountZero": (proof or {}).get(
                      "rejectedNewerCandidateCount"
                  )
                  == 0,
                  "rejectedNewerCandidatesEmpty": rejected == [],
              }
              valid_quarantine_candidate = all(predicate.values())
              strong_quarantine_validator_passed = False
              strong_quarantine_validator_error = None
              if valid_quarantine_candidate:
                  try:
                      patch._validated_valid_prelock_quarantine_authority(
                          module,
                          SLATE,
                          game,
                          candidate,
                          proof,
                          bound,
                      )
                      strong_quarantine_validator_passed = True
                  except Exception as exc:
                      strong_quarantine_validator_error = str(exc)[:160]

              source_checks = {
                  "proofSourceKeyPresent": False,
                  "strongSourceRowPresent": False,
                  "strongSourceRecordTypeValid": False,
                  "strongSourceIntegrityValid": False,
                  "strongSourceIdMatchesProof": False,
                  "strongSourceTimeMatchesProof": False,
                  "strongSourceFingerprintMatchesProof": False,
                  "candidatePriceMatchesStrongSource": False,
              }
              source_integrity_errors = []
              if isinstance(proof, dict):
                  source_pk = str(
                      proof.get("predictionSourcePullStoragePk") or ""
                  )
                  source_sk = str(
                      proof.get("predictionSourcePullStorageSk") or ""
                  )
                  source_checks["proofSourceKeyPresent"] = bool(
                      source_pk and source_sk
                  )
                  if source_pk and source_sk:
                      source_item = plain(
                          module.history.PULLS.get_item(
                              Key={"PK": source_pk, "SK": source_sk},
                              ConsistentRead=True,
                          ).get("Item")
                          or {}
                      )
                      source_row = (
                          source_item.get("data")
                          if isinstance(source_item.get("data"), dict)
                          else None
                      )
                      source_checks["strongSourceRowPresent"] = isinstance(
                          source_row, dict
                      )
                      source_checks["strongSourceRecordTypeValid"] = (
                          source_item.get("record_type") == "pull_run"
                      )
                      if isinstance(source_row, dict):
                          try:
                              source_integrity_errors = sorted(
                                  set(
                                      str(error)
                                      for error in history_contract._pull_integrity_errors(
                                          source_row,
                                          sport="mlb",
                                          slate=SLATE,
                                      )
                                  )
                              )
                          except Exception as exc:
                              source_integrity_errors = [
                                  "diagnostic_integrity_verifier_error:"
                                  + type(exc).__name__
                              ]
                          source_checks["strongSourceIntegrityValid"] = (
                              not source_integrity_errors
                          )
                          source_checks["strongSourceIdMatchesProof"] = str(
                              source_row.get("pull_id") or ""
                          ) == str(proof.get("predictionSourcePullId") or "")
                          source_checks["strongSourceTimeMatchesProof"] = (
                              module._parse_dt(source_row.get("pulled_at"))
                              == module._parse_dt(
                                  proof.get("predictionSourcePullAtUtc")
                              )
                          )
                          source_checks[
                              "strongSourceFingerprintMatchesProof"
                          ] = (
                              history_contract.pull_payload_fingerprint(
                                  source_row
                              )
                              == str(
                                  proof.get(
                                      "predictionSourcePullFingerprint"
                                  )
                                  or ""
                              )
                          )
                          if isinstance(candidate, dict):
                              source_checks[
                                  "candidatePriceMatchesStrongSource"
                              ] = patch._candidate_price_matches_source(
                                  candidate,
                                  source_row,
                                  game,
                              )

              snapshot_checks = {
                  "proofSnapshotKeyPresent": False,
                  "strongSnapshotPresent": False,
                  "strongSnapshotRecordTypeValid": False,
                  "strongSnapshotRowPresent": False,
                  "strongSnapshotFingerprintMatchesProof": False,
                  "strongSnapshotRowFingerprintMatchesProof": False,
              }
              if isinstance(proof, dict):
                  snapshot_pk = str(proof.get("pk") or "")
                  snapshot_sk = str(proof.get("sk") or "")
                  snapshot_checks["proofSnapshotKeyPresent"] = bool(
                      snapshot_pk and snapshot_sk
                  )
                  if snapshot_pk and snapshot_sk:
                      snapshot = plain(
                          module.history.PULLS.get_item(
                              Key={"PK": snapshot_pk, "SK": snapshot_sk},
                              ConsistentRead=True,
                          ).get("Item")
                          or {}
                      )
                      snapshot_row = (
                          snapshot.get("data")
                          if isinstance(snapshot.get("data"), dict)
                          else None
                      )
                      snapshot_checks["strongSnapshotPresent"] = bool(snapshot)
                      snapshot_checks["strongSnapshotRecordTypeValid"] = (
                          snapshot.get("record_type")
                          == patch.PREGAME_SNAPSHOT_RECORD_TYPE
                      )
                      snapshot_checks["strongSnapshotRowPresent"] = isinstance(
                          snapshot_row, dict
                      )
                      if snapshot:
                          snapshot_checks[
                              "strongSnapshotFingerprintMatchesProof"
                          ] = (
                              patch._payload_fingerprint(
                                  snapshot,
                                  patch.PAYLOAD_FINGERPRINT_VERSION,
                              )
                              == str(
                                  proof.get("candidateSnapshotFingerprint")
                                  or ""
                              )
                          )
                      if isinstance(snapshot_row, dict):
                          snapshot_checks[
                              "strongSnapshotRowFingerprintMatchesProof"
                          ] = (
                              patch._payload_fingerprint(
                                  snapshot_row,
                                  patch.PAYLOAD_FINGERPRINT_VERSION,
                              )
                              == str(
                                  proof.get("candidateRowFingerprint")
                                  or ""
                              )
                          )

              rejected_error_codes = sorted(
                  {
                      str(error)
                      for item in (rejected or [])
                      if isinstance(item, dict)
                      for error in (item.get("errors") or [])
                  }
              )

              remaining_evidence = []
              for scan_index in range(game_index, len(manifest)):
                  scan_game = manifest[scan_index]
                  (
                      observed_state,
                      _observed_identity,
                      _observed_evidence,
                      observed_error,
                  ) = repair._cooperative_terminal_observed_state(
                      module,
                      patch,
                      slate=SLATE,
                      pulls=pulls,
                      manifest=manifest,
                      game_index=scan_index,
                      identity_options=all_identity_options[scan_index],
                      selected_manifest_authority=(
                          selected_manifest_authority
                      ),
                      manifest_authority=manifest_authority,
                  )
                  entry = {
                      "gameIndex": scan_index,
                      "gameIdentityFingerprint": digest(
                          all_identity_options[scan_index][0]
                      ),
                      "observedTerminalState": observed_state,
                      "observedTerminalErrorCode": observed_error,
                      "candidatePresent": False,
                      "proofPresent": False,
                      "boundScoringPullCount": 0,
                      "selectorErrorCodes": [],
                      "provenAbsence": False,
                      "validQuarantineCandidate": False,
                      "strongQuarantineValidatorPassed": False,
                      "strongQuarantineValidatorErrorCode": None,
                      "safeClassification": False,
                  }
                  if observed_error:
                      remaining_evidence.append(entry)
                      continue
                  if observed_state:
                      entry["safeClassification"] = True
                      remaining_evidence.append(entry)
                      continue

                  scan_scoring = patch._scoring_pulls(
                      module,
                      pulls,
                      scan_game,
                  )
                  (
                      scan_candidate,
                      scan_proof,
                      scan_bound,
                      scan_errors,
                  ) = patch._last_prelock_candidate(
                      module,
                      SLATE,
                      scan_game,
                      scan_scoring,
                  )
                  scan_errors = sorted(
                      set(str(error) for error in (scan_errors or []))
                  )
                  scan_absence = bool(
                      scan_candidate is None
                      and scan_proof is None
                      and not scan_bound
                      and patch._is_no_prediction_candidate_failure(
                          scan_errors
                      )
                  )
                  scan_valid = bool(
                      isinstance(scan_candidate, dict)
                      and isinstance(scan_proof, dict)
                      and isinstance(scan_bound, list)
                      and scan_bound
                      and not scan_errors
                      and scan_proof.get("identityBindingMode")
                      in {"exact_identity", "official_game_pk"}
                      and scan_proof.get("createdAtOrBeforeCutoff")
                      is True
                      and scan_proof.get("sourceAtOrBeforeCutoff")
                      is True
                      and scan_proof.get("persistedAtOrBeforeCutoff")
                      is True
                      and scan_proof.get(
                          "modelOrSignalRecomputedAtLock"
                      )
                      is False
                      and scan_proof.get("persistenceProofType")
                      == patch.PREGAME_PERSISTENCE_PROOF_TYPE
                      and scan_proof.get(
                          "predictionPayloadFingerprintVersion"
                      )
                      == patch.PAYLOAD_FINGERPRINT_VERSION
                      and all(
                          len(str(scan_proof.get(field) or "")) == 64
                          for field in required_fingerprints
                      )
                      and all(
                          str(scan_proof.get(field) or "")
                          for field in required_keys
                      )
                      and scan_proof.get(
                          "rejectedNewerCandidateCount"
                      )
                      == 0
                      and scan_proof.get(
                          "rejectedNewerCandidates"
                      )
                      == []
                  )
                  scan_strong = False
                  scan_strong_error = None
                  if scan_valid:
                      try:
                          patch._validated_valid_prelock_quarantine_authority(
                              module,
                              SLATE,
                              scan_game,
                              scan_candidate,
                              scan_proof,
                              scan_bound,
                          )
                          scan_strong = True
                      except Exception as exc:
                          scan_strong_error = str(exc)[:160]
                  entry.update(
                      {
                          "candidatePresent": isinstance(
                              scan_candidate, dict
                          ),
                          "proofPresent": isinstance(scan_proof, dict),
                          "boundScoringPullCount": len(scan_bound or []),
                          "selectorErrorCodes": scan_errors,
                          "provenAbsence": scan_absence,
                          "validQuarantineCandidate": scan_valid,
                          "strongQuarantineValidatorPassed": (
                              scan_strong
                          ),
                          "strongQuarantineValidatorErrorCode": (
                              scan_strong_error
                          ),
                          "safeClassification": bool(
                              scan_absence or scan_strong
                          ),
                      }
                  )
                  remaining_evidence.append(entry)

              remaining_all_safe = bool(
                  remaining_evidence
                  and all(
                      item.get("safeClassification") is True
                      for item in remaining_evidence
                  )
              )
              report = {
                  "ok": True,
                  "proofType": (
                      "MLB_AUG4_PRELOCK_REVIEW_READ_ONLY_PREDICATE_MATRIX"
                  ),
                  "readOnly": True,
                  "strongConsistentReads": True,
                  "slateDateEt": SLATE,
                  "queueState": queue_item.get("state"),
                  "checkpointStage": attempt.get("stage"),
                  "checkpointErrorCode": attempt.get("errorCode"),
                  "gameIndex": game_index,
                  "checkpointNextGameIndex": progress.get("nextGameIndex"),
                  "checkpointLastAttemptGameIndex": attempt.get("gameIndex"),
                  "gameIdentityFingerprint": digest(checkpoint_identity),
                  "manifestIdentityBound": checkpoint_identity
                  in identity_options,
                  "pullCount": len(pulls),
                  "manifestGameCount": len(manifest),
                  "scoringPullCount": len(scoring),
                  "candidatePresent": isinstance(candidate, dict),
                  "proofPresent": isinstance(proof, dict),
                  "boundScoringPullCount": len(bound),
                  "selectorErrorCodes": errors,
                  "provenAbsence": proven_absence,
                  "identityBindingMode": (
                      (proof or {}).get("identityBindingMode")
                  ),
                  "fingerprintLengths": fingerprint_lengths,
                  "missingRequiredProofKeys": missing_required_keys,
                  "rejectedNewerCandidateCount": (
                      (proof or {}).get("rejectedNewerCandidateCount")
                  ),
                  "rejectedNewerCandidateErrorCodes": rejected_error_codes,
                  "validQuarantinePredicate": predicate,
                  "validQuarantineCandidate": valid_quarantine_candidate,
                  "strongQuarantineValidatorPassed": (
                      strong_quarantine_validator_passed
                  ),
                  "strongQuarantineValidatorErrorCode": (
                      strong_quarantine_validator_error
                  ),
                  "sourceProofChecks": source_checks,
                  "sourceIntegrityErrorCodes": source_integrity_errors,
                  "snapshotProofChecks": snapshot_checks,
                  "remainingGameEvidence": remaining_evidence,
                  "remainingGameCount": len(remaining_evidence),
                  "remainingAllSafe": remaining_all_safe,
                  "remainingSafeTerminalCount": sum(
                      bool(item.get("observedTerminalState"))
                      for item in remaining_evidence
                  ),
                  "remainingStrongQuarantineCount": sum(
                      item.get("strongQuarantineValidatorPassed") is True
                      for item in remaining_evidence
                  ),
                  "remainingProvenAbsenceCount": sum(
                      item.get("provenAbsence") is True
                      for item in remaining_evidence
                  ),
                  "postStartPredictionCreationAllowed": False,
                  "immutablePredictionRewriteAllowed": False,
                  "productionAuthorityChanged": False,
                  "directTableWrite": False,
                  "secretExposed": False,
              }
          finally:
              patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.reset(
                  alias_token
              )
              patch._STATUS_READ_CACHE.reset(status_token)

          output = Path(
              "/tmp/mlb-prelock-review-diagnostic/predicate-matrix.json"
          )
          output.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload redacted read-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-aug4-prelock-review-read-only-${{ github.run_id }}
          path: /tmp/mlb-prelock-review-diagnostic
          if-no-files-found: warn
          retention-days: 30
