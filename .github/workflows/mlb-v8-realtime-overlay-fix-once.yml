# Second push activates this one-time workflow.
name: MLB V8 Realtime Overlay Fix Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-realtime-overlay-fix-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v8-realtime-overlay-fix-once
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require BBD overlay in realtime shadow evaluation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('.github/workflows/mlb-v8-shadow-realtime-72.yml')
          text=path.read_text()
          marker="          AWS_EC2_METADATA_DISABLED: 'true'\n"
          required="          MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'true'\n"
          addition=(
              marker
              + "          MLB_V8_HISTORICAL_BBS_OVERLAY_ENABLED: 'true'\n"
              + required
              + "          MLB_V8_HISTORICAL_BBS_TABLE: parlay_platform_snapshots\n"
          )
          if required not in text:
              if marker not in text:
                  raise SystemExit('realtime AWS environment marker missing')
              text=text.replace(marker,addition,1)
          path.write_text(text)
          PY

      - name: Validate workflow contract
        run: |
          set -euo pipefail
          python -m pip install --quiet 'PyYAML>=6,<7'
          python - <<'PY'
          from pathlib import Path
          import yaml
          path=Path('.github/workflows/mlb-v8-shadow-realtime-72.yml')
          text=path.read_text()
          assert isinstance(yaml.safe_load(text),dict)
          assert "MLB_V8_HISTORICAL_BBS_OVERLAY_ENABLED: 'true'" in text
          assert "MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'true'" in text
          assert "MLB_V8_HISTORICAL_BBS_TABLE: parlay_platform_snapshots" in text
          PY

      - name: Publish fix and remove installer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/mlb-v8-shadow-realtime-72.yml
          git rm .github/workflows/mlb-v8-realtime-overlay-fix-once.yml
          git diff --cached --check
          git commit -m 'Require BBD overlay in V8 realtime shadow'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
