name: Retire MLB V15.10 from MLB Auto now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-mlb-v15-10-from-auto-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retire-mlb-v15-10-from-auto-now
  cancel-in-progress: false

jobs:
  retire-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Retire V15.10 from MLB Auto decision authority
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mlb_auto_llm/ml_authority.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'AUTHORITY = "AWS_ML_RANKED_ENSEMBLE"\nEXPECTED_MODEL = "INQSI-MLB-v5.0-ranked-winner-v15.10-active-ensemble"\n',
              'AUTHORITY = "AWS_ML_PROSPECTIVE_R7"\nRETIREMENT_POLICY = "MLB-AUTO-RETIRE-V15.10-v1"\nRETIRED_MODELS = {"INQSI-MLB-v5.0-ranked-winner-v15.10-active-ensemble"}\nRETIRED_ALGORITHMS = {"INQSI-MLB-RANKED-WINNER-v15.10.0-active-ensemble"}\n',
              1,
          )
          old = '''    model_version = str(\n        payload.get("model_version")\n        or payload.get("game_winner_model")\n        or payload.get("modelVersion")\n        or EXPECTED_MODEL\n    )\n    primary_algorithm = str(\n        payload.get("primaryAlgorithm")\n        or payload.get("primary_algorithm")\n        or "INQSI-MLB-RANKED-WINNER-v15.10.0-active-ensemble"\n    )\n'''
          new = '''    model_version = str(\n        payload.get("model_version")\n        or payload.get("game_winner_model")\n        or payload.get("modelVersion")\n        or ""\n    ).strip()\n    primary_algorithm = str(\n        payload.get("primaryAlgorithm")\n        or payload.get("primary_algorithm")\n        or ""\n    ).strip()\n    if not model_version or not primary_algorithm:\n        raise RuntimeError("MLB_ML_MODEL_IDENTITY_MISSING")\n    if model_version in RETIRED_MODELS or primary_algorithm in RETIRED_ALGORITHMS:\n        raise RuntimeError(\n            "MLB_ML_RETIRED_AUTHORITY_REJECTED:"\n            + model_version\n            + ":"\n            + primary_algorithm\n        )\n'''
          if old not in text:
              raise SystemExit('MLB Auto authority identity block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Update MLB Auto authority regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/test_mlb_auto_ml_authority.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"model_version": ml_authority.EXPECTED_MODEL,\n            "primaryAlgorithm": "INQSI-MLB-RANKED-WINNER-v15.10.0-active-ensemble",',
              '"model_version": "INQSI-MLB-AWS-PROSPECTIVE-R7-candidate",\n            "primaryAlgorithm": "INQSI-MLB-AWS-PROSPECTIVE-R7",',
              1,
          )
          text = text.replace(
              'row["decisionAuthority"] == "AWS_ML_RANKED_ENSEMBLE"',
              'row["decisionAuthority"] == "AWS_ML_PROSPECTIVE_R7"',
              1,
          )
          marker = '''\n\ndef test_ml_card_fails_closed_when_a_game_is_missing(monkeypatch):\n'''
          addition = '''\n\ndef test_retired_v15_10_is_never_accepted(monkeypatch):\n    monkeypatch.setattr(\n        ml_authority,\n        "fetch_predictions",\n        lambda slate: {\n            "ok": True,\n            "model_version": "INQSI-MLB-v5.0-ranked-winner-v15.10-active-ensemble",\n            "primaryAlgorithm": "INQSI-MLB-RANKED-WINNER-v15.10.0-active-ensemble",\n            "winner_predictions": [\n                {"gamePk": "1", "predictedWinner": "Home One", "probability": 0.61},\n                {"gamePk": "2", "predictedWinner": "Away Two", "probability": 0.58},\n            ],\n        },\n    )\n    with pytest.raises(RuntimeError, match="MLB_ML_RETIRED_AUTHORITY_REJECTED"):\n        ml_authority.build_card(packet())\n\n\ndef test_missing_model_identity_fails_closed(monkeypatch):\n    monkeypatch.setattr(\n        ml_authority,\n        "fetch_predictions",\n        lambda slate: {\n            "ok": True,\n            "winner_predictions": [\n                {"gamePk": "1", "predictedWinner": "Home One", "probability": 0.61},\n                {"gamePk": "2", "predictedWinner": "Away Two", "probability": 0.58},\n            ],\n        },\n    )\n    with pytest.raises(RuntimeError, match="MLB_ML_MODEL_IDENTITY_MISSING"):\n        ml_authority.build_card(packet())\n'''
          if marker not in text:
              raise SystemExit('MLB Auto test insertion marker not found')
          text = text.replace(marker, addition + marker, 1)
          text = text.replace(
              '''        lambda slate: {\n            "ok": True,\n            "winner_predictions": [\n                {\n                    "gamePk": "1",''',
              '''        lambda slate: {\n            "ok": True,\n            "model_version": "INQSI-MLB-AWS-PROSPECTIVE-R7-candidate",\n            "primaryAlgorithm": "INQSI-MLB-AWS-PROSPECTIVE-R7",\n            "winner_predictions": [\n                {\n                    "gamePk": "1",''',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove V15.10 resurrection workflows and isolate MLB Auto deploys
        run: |
          git rm -f \
            .github/workflows/deploy-mlb-ranked-v15-10.yml \
            .github/workflows/verify-and-recover-mlb-v15-10.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-mlb-auto-llm.yml')
          text = path.read_text(encoding='utf-8')
          old = "          grep -q 'AWS_ML_RANKED_ENSEMBLE' mlb_auto_llm/ml_authority.py\n"
          new = "          grep -q 'AWS_ML_PROSPECTIVE_R7' mlb_auto_llm/ml_authority.py\n          grep -q 'MLB_ML_RETIRED_AUTHORITY_REJECTED' mlb_auto_llm/ml_authority.py\n"
          if old not in text:
              raise SystemExit('MLB Auto deploy authority grep not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          main = Path('.github/workflows/deploy.yml')
          body = main.read_text(encoding='utf-8')
          anchor = '      - ".github/workflows/deploy-soccer-auto.yml"\n'
          ignored = '''      - ".github/workflows/deploy-soccer-auto.yml"\n      # MLB Auto is an isolated stack; never let its source changes redeploy\n      # the legacy MLB application stack or its retired V15.10 runtime.\n      - "mlb_auto_llm/**"\n      - "mlb-auto-llm-template.yaml"\n      - "tests/unit/test_mlb_auto_*.py"\n      - ".github/workflows/deploy-mlb-auto-llm.yml"\n'''
          if anchor not in body:
              raise SystemExit('legacy deploy paths-ignore anchor not found')
          main.write_text(body.replace(anchor, ignored, 1), encoding='utf-8')
          PY

      - name: Verify retirement and tests
        run: |
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          PYTHONPATH=mlb_auto_llm python -m pytest -q \
            tests/unit/test_mlb_auto_ml_authority.py \
            tests/unit/test_mlb_auto_direct_read.py
          python - <<'PY'
          from pathlib import Path
          source = Path('mlb_auto_llm/ml_authority.py').read_text()
          assert 'MLB_ML_RETIRED_AUTHORITY_REJECTED' in source
          assert 'AWS_ML_PROSPECTIVE_R7' in source
          assert 'RETIRED_MODELS = {"INQSI-MLB-v5.0-ranked-winner-v15.10-active-ensemble"}' in source
          assert 'RETIRED_ALGORITHMS = {"INQSI-MLB-RANKED-WINNER-v15.10.0-active-ensemble"}' in source
          assert not Path('.github/workflows/deploy-mlb-ranked-v15-10.yml').exists()
          assert not Path('.github/workflows/verify-and-recover-mlb-v15-10.yml').exists()
          PY

      - name: Commit retirement without triggering legacy stack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Retire V15.10 from MLB Auto authority [skip ci]'
          git push origin HEAD:main
