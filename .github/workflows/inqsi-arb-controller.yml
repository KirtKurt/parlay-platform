name: Inqsi ARB Production Controller
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: inqsi-arb-production-controller
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install controller runtime
        run: python -m pip install --quiet boto3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Resolve deployed endpoints and state table
        id: endpoints
        shell: bash
        run: |
          set -euo pipefail
          API_URL=$(aws cloudformation describe-stacks --stack-name inqsi-arb-prod --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='ArbApiUrl'].OutputValue" --output text)
          SPORTSBOOK_URL=$(aws cloudformation describe-stacks --stack-name inqsi-arb-sportsbook-catalog-prod --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='SportsbooksUrl'].OutputValue" --output text 2>/dev/null || true)
          STATE_TABLE=$(aws cloudformation describe-stack-resource --stack-name inqsi-arb-prod --logical-resource-id ArbStateTable --region "${{ secrets.AWS_REGION }}" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          test -n "$API_URL" && test "$API_URL" != "None"
          test -n "$STATE_TABLE" && test "$STATE_TABLE" != "None"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "sportsbook_url=$SPORTSBOOK_URL" >> "$GITHUB_OUTPUT"
          echo "state_table=$STATE_TABLE" >> "$GITHUB_OUTPUT"
      - name: Inspect production and provider health
        id: inspect
        continue-on-error: true
        env:
          BBD_API_KEY: ${{ secrets.BBD_API_KEY }}
          BIG_BALLS_DATA_API_KEY: ${{ secrets.BIG_BALLS_DATA_API_KEY }}
          BIGBALLS_DATA_API_KEY: ${{ secrets.BIGBALLS_DATA_API_KEY }}
        run: |
          python inqsi-arb/ops/controller.py \
            --api-url '${{ steps.endpoints.outputs.api_url }}' \
            --sportsbook-url '${{ steps.endpoints.outputs.sportsbook_url }}' \
            --output arb-controller-report.json
      - name: Persist live coverage snapshot
        if: steps.inspect.outcome == 'success'
        env:
          ARB_STATE_TABLE: ${{ steps.endpoints.outputs.state_table }}
        run: |
          python inqsi-arb/ops/coverage_snapshot.py \
            --api-url '${{ steps.endpoints.outputs.api_url }}' \
            --sportsbook-url '${{ steps.endpoints.outputs.sportsbook_url }}' \
            --output arb-coverage-snapshot.json
      - name: Upload controller evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inqsi-arb-controller-${{ github.run_id }}
          path: |
            arb-controller-report.json
            arb-coverage-snapshot.json
          if-no-files-found: warn
          retention-days: 30
      - name: Dispatch one bounded repair
        if: steps.inspect.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run inqsi-arb-repair.yml --ref main
      - name: Preserve failed health signal
        if: steps.inspect.outcome == 'failure'
        run: |
          echo 'Production health failed; one bounded repair was dispatched. A later controller run will verify recovery.'
          exit 1
