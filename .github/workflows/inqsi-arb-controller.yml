name: Inqsi ARB Autonomous Controller
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: inqsi-arb-autonomous-controller
  cancel-in-progress: false
jobs:
  inspect-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Resolve deployed endpoints
        id: endpoints
        shell: bash
        run: |
          set -euo pipefail
          API_URL=$(aws cloudformation describe-stacks --stack-name inqsi-arb-prod --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='ArbApiUrl'].OutputValue" --output text)
          SPORTSBOOK_URL=$(aws cloudformation describe-stacks --stack-name inqsi-arb-sportsbook-catalog-prod --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='SportsbooksUrl'].OutputValue" --output text 2>/dev/null || true)
          test -n "$API_URL" && test "$API_URL" != "None"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          if [ -n "$SPORTSBOOK_URL" ] && [ "$SPORTSBOOK_URL" != "None" ]; then
            echo "sportsbook_url=$SPORTSBOOK_URL" >> "$GITHUB_OUTPUT"
          fi
      - name: Inspect production and provider health
        id: inspect
        continue-on-error: true
        env:
          BBD_API_KEY: ${{ secrets.BBD_API_KEY }}
          BIG_BALLS_DATA_API_KEY: ${{ secrets.BIG_BALLS_DATA_API_KEY }}
          ARB_CONTROLLER_ALLOW_REDEPLOY: 'true'
        run: |
          python inqsi-arb/ops/controller.py \
            --api-url '${{ steps.endpoints.outputs.api_url }}' \
            --sportsbook-url '${{ steps.endpoints.outputs.sportsbook_url }}' \
            --output arb-controller-report.json
      - name: Upload controller evidence
        uses: actions/upload-artifact@v4
        with:
          name: inqsi-arb-controller-${{ github.run_id }}
          path: arb-controller-report.json
          retention-days: 30
      - name: Perform one bounded repair dispatch
        if: steps.inspect.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'ARB production inspection failed. Dispatching one controlled redeploy of current main.'
          gh workflow run inqsi-arb-repair.yml --ref main
      - name: Fail after repair dispatch
        if: steps.inspect.outcome == 'failure'
        run: |
          echo 'Controller detected a production fault and dispatched one bounded repair. Next controller run will verify recovery.'
          exit 1
