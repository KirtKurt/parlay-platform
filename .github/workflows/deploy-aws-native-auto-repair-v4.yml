name: Deploy AWS Native Algorithm Auto Repair V4

on:
  push:
    branches: [main]
    paths:
      - 'aws_auto_repair/**'
      - 'aws-auto-repair-template.yaml'
      - 'scripts/deploy_aws_native_auto_repair.py'
      - 'tests/unit/test_aws_native_auto_repair.py'
      - '.github/workflows/deploy-aws-native-auto-repair-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-native-algorithm-auto-repair-v4
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Verify fail-closed source
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7' 'cfn-lint>=1,<2'
          python -m py_compile aws_auto_repair/*.py scripts/deploy_aws_native_auto_repair.py
          python -m pytest -q tests/unit/test_aws_native_auto_repair.py
          sam validate --template-file aws-auto-repair-template.yaml --lint
          ! grep -R -E 'force_publish|clear_lease|bypass_lease|PutItem.*(Prediction|Lock|Settlement|Model)|UpdateItem.*(Prediction|Lock|Settlement|Model)' aws_auto_repair aws-auto-repair-template.yaml

      - name: Build exact SAM artifact
        run: |
          set -euo pipefail
          rm -rf .aws-sam
          sam build --no-cached --template-file aws-auto-repair-template.yaml

      - name: Deploy and accept all five AWS repair control planes
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python scripts/deploy_aws_native_auto_repair.py

      - name: Upload AWS deployment acceptance proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-native-auto-repair-acceptance-${{ github.run_id }}
          path: runtime_reports/aws_native_auto_repair_deployment_acceptance_latest.json
          if-no-files-found: warn
          retention-days: 90
