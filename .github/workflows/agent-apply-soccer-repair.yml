name: Agent apply verified soccer authority repair

on:
  push:
    branches:
      - agent/soccer-authority-repair

permissions:
  contents: write

concurrency:
  group: agent-apply-soccer-authority-repair
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2

      - name: Decode and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/soccer-patch.part* > /tmp/soccer-authority-repair.patch.gz.b64
          test "$(sha256sum /tmp/soccer-authority-repair.patch.gz.b64 | awk '{print $1}')" = "d2610eb472c5628b916828e70546edae2d8cd79d75c5c6e18b026b5f7c2dbaf7"
          base64 -d /tmp/soccer-authority-repair.patch.gz.b64 > /tmp/soccer-authority-repair.patch.gz
          test "$(sha256sum /tmp/soccer-authority-repair.patch.gz | awk '{print $1}')" = "7583eac563db678302fe869b19f54d937898a797b7b8dd4a83a3882e69e75bdd"
          gzip -dc /tmp/soccer-authority-repair.patch.gz > /tmp/soccer-authority-repair.patch
          test "$(sha256sum /tmp/soccer-authority-repair.patch | awk '{print $1}')" = "ffb22e53c8c2593f0b1d1179f6aa72f22579c75ba86b6d5167d05164fa4a5511"
          git rm -f --ignore-unmatch docs/SOCCER_AUTO.md
          git apply --check /tmp/soccer-authority-repair.patch
          git apply --index /tmp/soccer-authority-repair.patch

      - name: Remove temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .agent/soccer-patch.part*
          git rm -f \
            .github/workflows/agent-export-soccer-source.yml \
            .github/workflows/agent-export-soccer-fixtures.yml \
            .github/workflows/agent-apply-soccer-repair.yml

      - name: Verify soccer-only scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          exact = {
              '.github/workflows/deploy-soccer-auto.yml',
              '.github/workflows/agent-export-soccer-source.yml',
              '.github/workflows/agent-export-soccer-fixtures.yml',
              '.github/workflows/agent-apply-soccer-repair.yml',
              'soccer-auto-template.yaml',
              'docs/SOCCER_AUTO.md',
          }
          assert changed, changed
          disallowed = [
              path for path in changed
              if path not in exact
              and not path.startswith('.agent/soccer-patch.part')
              and not path.startswith('soccer_auto/')
              and not path.startswith('tests/soccer_auto/')
          ]
          assert not disallowed, disallowed
          assert not any(
              path.startswith('hello_world/')
              or path.startswith('tennis_learning/')
              or 'mlb' in path.casefold()
              for path in changed
          ), changed
          print('soccer_only_changed_files', changed)
          PY
          git diff --cached --check

      - name: Run complete isolated soccer verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
          python -m py_compile soccer_auto/*.py
          python -m pytest -q tests/soccer_auto
          sam validate --template-file soccer-auto-template.yaml --lint
          ! grep -Eq 'parlay_platform_|inqis_tennis|MLB|TENNIS' soccer-auto-template.yaml

      - name: Commit and publish verified repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kurt Soccer Repair Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix soccer T10 authority and training evidence'
          git push origin HEAD:agent/soccer-authority-repair
