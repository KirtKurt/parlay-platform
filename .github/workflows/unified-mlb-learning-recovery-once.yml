name: Unified MLB learning recovery once
run-name: Unified MLB learning recovery ${{ github.event.inputs.request_id || github.sha }}

"on":
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique unified MLB recovery request identifier
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: unified-mlb-learning
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  MLB_ROOT_STACK: parlay-platform-dev
  REPAIR_SLATE_DATE: '2026-08-04'
  TARGET_SLATE_DATE: '2026-08-25'
  HANDOFF_BASELINE_ACCEPTED_ROWS: '32'
  HANDOFF_BASELINE_REJECTED_ROWS: '1'
  HANDOFF_BASELINE_TRAIN_ROWS: '32'
  HANDOFF_BASELINE_PROCESSED_SLATES: '3'
  HANDOFF_BASELINE_FINALIZED_SLATES: '3'
  RECOVERY_TERMINAL_GAME_COUNT: '15'

jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact recovery source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded runtime and prove one recovery owner
        run: |
          set -euo pipefail
          python -m pip install --quiet \
            'boto3>=1.34,<2' \
            'pytest>=8,<9' \
            'PyYAML>=6,<7'
          python -m py_compile \
            scripts/invoke_mlb_trainer_with_retry.py \
            scripts/mlb_scoring_guard_status.py \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py \
            scripts/verify_mlb_recovery_current_slate_guard.py \
            scripts/verify_unified_mlb_learning_ownership.py \
            scripts/warm_and_verify_mlb_lock_status.py
          python -m pytest -q \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5_settlement_replay.py \
            tests/unit/test_mlb_prospective_backlog_workflow.py \
            tests/unit/test_verify_mlb_recovery_current_slate_guard.py \
            tests/unit/test_unified_mlb_learning_ownership.py
          python scripts/verify_unified_mlb_learning_ownership.py
          grep -q 'UNIFIED_MLB_LEARNING_OWNER=eventbridge_schedule' .github/workflows/deploy.yml
          ! grep -q 'Run AWS-native MLB trainer and verify fresh split health' .github/workflows/deploy.yml
          mkdir -p /tmp/unified-mlb-recovery

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for a quiet deploy queue and stable AWS runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          region = os.environ['AWS_REGION']
          stack_name = os.environ['MLB_ROOT_STACK']
          runs_url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              'deploy.yml/runs?branch=main&per_page=50'
          )
          stable_stack_states = {
              'CREATE_COMPLETE',
              'UPDATE_COMPLETE',
              'UPDATE_ROLLBACK_COMPLETE',
          }
          required_stable_probes = 8
          stable_probes = 0
          deadline = time.monotonic() + 5400
          last_state = None

          def github_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'User-Agent': 'unified-mlb-learning-recovery',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def aws_json(*args):
              command = ['aws', *args, '--region', region, '--output', 'json']
              completed = subprocess.run(
                  command,
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=120,
              )
              return json.loads(completed.stdout)

          while time.monotonic() < deadline:
              state = {
                  'activeDeployRunCount': None,
                  'stackStatus': None,
                  'trainerState': None,
                  'trainerLastUpdateStatus': None,
                  'stableProbe': stable_probes,
              }
              try:
                  run_payload = github_json(runs_url)
                  active_runs = [
                      {
                          'id': run.get('id'),
                          'headSha': run.get('head_sha'),
                          'status': run.get('status'),
                          'htmlUrl': run.get('html_url'),
                      }
                      for run in run_payload.get('workflow_runs', [])
                      if str(run.get('status') or '') != 'completed'
                  ]
                  state['activeDeployRunCount'] = len(active_runs)
                  if active_runs:
                      state['activeDeployRuns'] = active_runs[:5]

                  stacks = aws_json(
                      'cloudformation',
                      'describe-stacks',
                      '--stack-name',
                      stack_name,
                  )
                  stack = (stacks.get('Stacks') or [{}])[0]
                  stack_status = str(stack.get('StackStatus') or '')
                  state['stackStatus'] = stack_status
                  if (
                      stack_status not in stable_stack_states
                      and (
                          'FAILED' in stack_status
                          or stack_status.startswith('DELETE_')
                          or stack_status == 'ROLLBACK_COMPLETE'
                      )
                  ):
                      raise SystemExit(
                          'MLB root stack is in a terminal unsafe state: '
                          + stack_status
                      )

                  trainer_detail = aws_json(
                      'cloudformation',
                      'describe-stack-resource',
                      '--stack-name',
                      stack_name,
                      '--logical-resource-id',
                      'MLBMLTrainingFunction',
                  )
                  trainer_fn = str(
                      ((trainer_detail.get('StackResourceDetail') or {}).get(
                          'PhysicalResourceId'
                      ))
                      or ''
                  )
                  state['trainerFunctionName'] = trainer_fn
                  trainer = aws_json(
                      'lambda',
                      'get-function-configuration',
                      '--function-name',
                      trainer_fn,
                  )
                  state['trainerState'] = trainer.get('State')
                  state['trainerLastUpdateStatus'] = trainer.get('LastUpdateStatus')
                  state['trainerHandler'] = trainer.get('Handler')
                  state['trainerTimeout'] = trainer.get('Timeout')

                  runtime_ready = (
                      not active_runs
                      and stack_status in stable_stack_states
                      and trainer.get('State') == 'Active'
                      and trainer.get('LastUpdateStatus') == 'Successful'
                      and trainer.get('Handler')
                      == 'mlb_ml_aws_training_v1_compat.lambda_handler'
                      and int(trainer.get('Timeout') or 0) == 900
                  )
                  if runtime_ready:
                      stable_probes += 1
                  else:
                      stable_probes = 0
                  state['stableProbe'] = stable_probes

                  if state != last_state:
                      print(json.dumps(state, sort_keys=True), flush=True)
                      last_state = state

                  if stable_probes >= required_stable_probes:
                      proof = {
                          'ok': True,
                          'proofType': 'UNIFIED_MLB_DEPLOY_QUEUE_AND_AWS_RUNTIME_READY',
                          'activeDeployRunCount': 0,
                          'requiredStableProbes': required_stable_probes,
                          'observedStableProbes': stable_probes,
                          'stackStatus': stack_status,
                          'trainerFunctionName': trainer_fn,
                          'trainerState': trainer.get('State'),
                          'trainerLastUpdateStatus': trainer.get(
                              'LastUpdateStatus'
                          ),
                          'trainerHandler': trainer.get('Handler'),
                          'trainerTimeout': trainer.get('Timeout'),
                          'sameCommitDeploySuccessRequired': False,
                          'cancelledOrSupersededDeploysAreNonBlocking': True,
                      }
                      Path(
                          '/tmp/unified-mlb-recovery/aws-readiness.json'
                      ).write_text(
                          json.dumps(proof, indent=2, sort_keys=True) + '\n',
                          encoding='utf-8',
                      )
                      with Path(os.environ['GITHUB_ENV']).open(
                          'a', encoding='utf-8'
                      ) as stream:
                          stream.write(f'TRAINER_FN={trainer_fn}\n')
                      print(json.dumps(proof, indent=2, sort_keys=True))
                      break
              except SystemExit:
                  raise
              except Exception as exc:
                  stable_probes = 0
                  state['stableProbe'] = 0
                  state['probeError'] = f'{type(exc).__name__}:{exc}'
                  if state != last_state:
                      print(json.dumps(state, sort_keys=True), flush=True)
                      last_state = state
              time.sleep(15)
          else:
              raise SystemExit(
                  'Timed out waiting for a quiet deploy queue and stable AWS runtime'
              )
          PY

      - name: Capture active deployed unified MLB trainer
        run: |
          set -euo pipefail
          case "$TRAINER_FN" in
            *MLBMLTrainingFunction*) ;;
            *) echo 'Resolved resource is not the unified MLB trainer' >&2; exit 1 ;;
          esac
          aws lambda get-function-configuration \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --query '{FunctionName:FunctionName,State:State,LastUpdateStatus:LastUpdateStatus,Handler:Handler,MemorySize:MemorySize,Timeout:Timeout}' \
            --output json | tee /tmp/unified-mlb-recovery/trainer-config.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/unified-mlb-recovery/trainer-config.json').read_text())
          assert value.get('State') == 'Active', value
          assert value.get('LastUpdateStatus') == 'Successful', value
          assert value.get('Handler') == 'mlb_ml_aws_training_v1_compat.lambda_handler', value
          assert int(value.get('Timeout') or 0) == 900, value
          PY

      - name: Capture signed pre-recovery learning baseline
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"sport":"mlb","mode":"status"}' \
            /tmp/unified-mlb-recovery/trainer-before.json \
            | tee /tmp/unified-mlb-recovery/trainer-before-invocation.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          invocation = json.loads(
              Path('/tmp/unified-mlb-recovery/trainer-before-invocation.json').read_text()
          )
          status = json.loads(
              Path('/tmp/unified-mlb-recovery/trainer-before.json').read_text()
          )
          latest = status.get('latestStatus') or (
              (status.get('trainingHealth') or {}).get('latestRun') or {}
          )
          continuity = latest.get('canonicalSlateContinuity') or {}
          counts = latest.get('partitionCounts') or (
              (latest.get('milestones') or {}).get('counts') or {}
          )
          proof = {
              'awsStatusCode': invocation.get('StatusCode'),
              'functionError': invocation.get('FunctionError'),
              'runId': latest.get('runId'),
              'executionMode': latest.get('executionMode'),
              'acceptedRowCount': latest.get('acceptedRowCount'),
              'rejectedRowCount': latest.get('rejectedRowCount'),
              'trainRowCount': counts.get('train'),
              'processedSlateDates': continuity.get('processedSlateDates'),
              'finalizedGameSlateDates': continuity.get('finalizedGameSlateDates'),
              'automaticPromotionEnabled': latest.get('automaticPromotionEnabled'),
              'liveInferenceAuthority': latest.get('liveInferenceAuthority'),
          }
          print(json.dumps(proof, indent=2, sort_keys=True))
          assert int(invocation.get('StatusCode') or 0) == 200, proof
          assert not invocation.get('FunctionError'), proof
          assert status.get('ok') is True, proof
          assert latest.get('executionMode') == 'training', proof
          assert int(latest.get('acceptedRowCount') or 0) == int(
              os.environ['HANDOFF_BASELINE_ACCEPTED_ROWS']
          ), proof
          assert int(latest.get('rejectedRowCount') or 0) == int(
              os.environ['HANDOFF_BASELINE_REJECTED_ROWS']
          ), proof
          assert int(counts.get('train') or 0) == int(
              os.environ['HANDOFF_BASELINE_TRAIN_ROWS']
          ), proof
          assert len(continuity.get('processedSlateDates') or []) == int(
              os.environ['HANDOFF_BASELINE_PROCESSED_SLATES']
          ), proof
          assert len(continuity.get('finalizedGameSlateDates') or []) == int(
              os.environ['HANDOFF_BASELINE_FINALIZED_SLATES']
          ), proof
          assert latest.get('automaticPromotionEnabled') is not True, proof
          assert latest.get('liveInferenceAuthority') is not True, proof
          PY

      - name: Prove current integrity and August 25 immutable coverage before settlement
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          CURRENT_SLATE_DATE="$(TZ=America/New_York date +%F)"
          echo "CURRENT_SLATE_DATE=$CURRENT_SLATE_DATE" >> "$GITHUB_ENV"
          python scripts/mlb_scoring_guard_status.py \
            --slate-date "$CURRENT_SLATE_DATE" \
            --region "$AWS_REGION" \
            --output /tmp/unified-mlb-recovery/production-before.json
          python scripts/verify_mlb_recovery_current_slate_guard.py \
            --before /tmp/unified-mlb-recovery/production-before.json \
            --output /tmp/unified-mlb-recovery/production-integrity-before.json
          python scripts/mlb_scoring_guard_status.py \
            --slate-date "$TARGET_SLATE_DATE" \
            --region "$AWS_REGION" \
            --output /tmp/unified-mlb-recovery/target-before.json \
            --enforce
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/unified-mlb-recovery/target-before.json').read_text())
          summary = value.get('summary') or {}
          assert value.get('guardPassed') is True, value
          assert value.get('readOnly') is True, value
          assert int(summary.get('officialGameCount') or 0) == 15, summary
          assert int(summary.get('movementFeatureGameCount') or 0) == 15, summary
          assert int(summary.get('missingMovementCount') or 0) == 0, summary
          assert int(summary.get('persistedPredictionGameCount') or 0) == 15, summary
          PY

      - name: Reconcile protected prospective settlement backlog
        env:
          AWS_MAX_ATTEMPTS: '10'
          AWS_RETRY_MODE: standard
        run: |
          set -euo pipefail
          python scripts/reconcile_mlb_prospective_backlog_v5.py \
            --stack-name "$MLB_ROOT_STACK" \
            --region "$AWS_REGION" \
            --max-slate-days 31 \
            --target-slate-date "$REPAIR_SLATE_DATE" \
            --output /tmp/unified-mlb-recovery/settlement-gap-repair.json
          python scripts/reconcile_mlb_prospective_backlog_v5.py \
            --stack-name "$MLB_ROOT_STACK" \
            --region "$AWS_REGION" \
            --max-slate-days 31 \
            --target-slate-date "$TARGET_SLATE_DATE" \
            --output /tmp/unified-mlb-recovery/settlement-recovery.json
          LOCK_FUNCTION=$(aws cloudformation describe-stack-resource \
            --stack-name "$MLB_ROOT_STACK" \
            --logical-resource-id MLBDailyPickLockFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$LOCK_FUNCTION"
          test "$LOCK_FUNCTION" != "None"
          python scripts/warm_and_verify_mlb_lock_status.py \
            --function-name "$LOCK_FUNCTION" \
            --region "$AWS_REGION" \
            --slate-date "$REPAIR_SLATE_DATE" \
            --output /tmp/unified-mlb-recovery/repair-lock-status.json \
            --invocation-output /tmp/unified-mlb-recovery/repair-lock-status-invocation.json
          python scripts/warm_and_verify_mlb_lock_status.py \
            --function-name "$LOCK_FUNCTION" \
            --region "$AWS_REGION" \
            --slate-date "$TARGET_SLATE_DATE" \
            --output /tmp/unified-mlb-recovery/target-lock-status.json \
            --invocation-output /tmp/unified-mlb-recovery/target-lock-status-invocation.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          gap_report = json.loads(
              Path('/tmp/unified-mlb-recovery/settlement-gap-repair.json').read_text()
          )
          report = json.loads(
              Path('/tmp/unified-mlb-recovery/settlement-recovery.json').read_text()
          )
          repair = os.environ['REPAIR_SLATE_DATE']
          target = os.environ['TARGET_SLATE_DATE']
          last_slate = str(report.get('lastSlateDateEt') or '')
          repair_status = json.loads(
              Path('/tmp/unified-mlb-recovery/repair-lock-status.json').read_text()
          )
          target_status = json.loads(
              Path('/tmp/unified-mlb-recovery/target-lock-status.json').read_text()
          )
          expected_false = (
              'directTableWrite',
              'postStartPredictionCreationAllowed',
              'immutablePredictionRewriteAllowed',
              'promotionAuthorityChanged',
              'productionAuthorityChanged',
              'automaticWagerAllowed',
          )
          bad = {
              key: report.get(key)
              for key in expected_false
              if report.get(key) is not False
          }
          gap_bad = {
              key: gap_report.get(key)
              for key in expected_false
              if gap_report.get(key) is not False
          }
          assert report.get('ok') is True, report
          assert gap_report.get('ok') is True, gap_report
          assert gap_report.get('exactSlateSelection') is True, gap_report
          assert gap_report.get('selectedSlateDates') == [repair], gap_report
          assert gap_report.get('firstSlateDateEt') == repair, gap_report
          assert gap_report.get('lastSlateDateEt') == repair, gap_report
          assert int(gap_report.get('reconciledSlateCount') or 0) == 1, gap_report
          assert int(report.get('boundedMaximumSlateDays') or 0) == 31, report
          assert report.get('exactSlateSelection') is True, report
          assert report.get('selectedSlateDates') == [target], report
          assert report.get('firstSlateDateEt') == target, report
          assert last_slate == target, report
          assert int(report.get('reconciledSlateCount') or 0) == 1, report

          def require_terminal_only_receipt(value, slate_date, status):
              slates = value.get('slates') or []
              assert len(slates) == 1, value
              row = slates[0]
              expected_games = int(os.environ['RECOVERY_TERMINAL_GAME_COUNT'])
              no_data = int(row.get('terminalNoPredictionCount') or 0)
              quarantined = int(
                  row.get('missedLockValidPrelockQuarantineCount') or 0
              )
              assert row.get('slateDateEt') == slate_date, row
              assert int(row.get('manifestGameCount') or 0) == expected_games, row
              assert int(row.get('canonicalPredictionCount') or 0) == 0, row
              assert no_data + quarantined == expected_games, row
              assert int(row.get('terminalExcludedCount') or 0) == expected_games, row
              assert int(row.get('lockOutcomeCount') or 0) == expected_games, row

              settlement = row.get('settlement') or {}
              assert settlement.get('finalized') is True, settlement
              assert settlement.get('status') == 'CANONICAL_FINAL_LABELS_COMPLETE', settlement
              assert int(settlement.get('officialGameCount') or 0) == expected_games, settlement
              assert int(settlement.get('officialFinalCount') or 0) == expected_games, settlement
              assert int(settlement.get('canonicalLockCount') or 0) == 0, settlement
              assert int(settlement.get('terminalNoPredictionCount') or 0) == no_data, settlement
              assert int(
                  settlement.get('missedLockValidPrelockQuarantineCount') or 0
              ) == quarantined, settlement
              assert int(settlement.get('terminalExcludedCount') or 0) == expected_games, settlement
              assert int(settlement.get('labelWriteCount') or 0) == 0, settlement
              assert int(settlement.get('settledLabelCount') or 0) == 0, settlement
              assert settlement.get('immutablePregameRowsMutated') is False, settlement

              replays = value.get(
                  'settlementTriggeredProtectedTerminalReplays'
              ) or []
              assert len(replays) == 1, value
              replay = replays[0]
              assert replay.get('slateDateEt') == slate_date, replay
              assert replay.get(
                  'protectedLockReplayCooperativeHandoffObserved'
              ) is True, replay
              assert replay.get(
                  'protectedLockReplayCooperativeAcknowledged'
              ) is True, replay
              assert replay.get(
                  'protectedLockReplayCooperativeReceiptVerified'
              ) is True, replay
              completion = replay.get(
                  'cooperativeCompletionReceipt'
              ) or {}
              receipt = replay.get(
                  'protectedLockReplayCooperativeReceipt'
              ) or {}
              progress = receipt.get('terminalChunkProgress') or {}
              assert receipt.get('state') == 'ACKNOWLEDGED', receipt
              assert progress.get('version') == (
                  'MLB-COOPERATIVE-TERMINAL-CHUNK-'
                  'v4-valid-prelock-quarantine'
              ), progress
              assert progress.get('valid') is True, progress
              assert int(progress.get('manifestGameCount') or 0) == expected_games, progress
              assert int(progress.get('processedGameCount') or 0) == expected_games, progress
              assert int(progress.get('terminalCount') or 0) == expected_games, progress
              assert int(progress.get('canonicalCount') or 0) == 0, progress
              assert int(progress.get('noPredictionDataCount') or 0) == no_data, progress
              assert int(
                  progress.get('missedLockValidPrelockQuarantineCount') or 0
              ) == quarantined, progress
              assert int(progress.get('verifiedGameCount') or 0) == expected_games, progress
              assert progress.get('verificationComplete') is True, progress
              assert progress.get('postStartPredictionCreationAllowed') is False, progress
              assert progress.get('immutablePredictionRewriteAllowed') is False, progress
              assert progress.get('productionAuthorityChanged') is False, progress

              assert completion.get('version') == (
                  'MLB-COOPERATIVE-TERMINAL-CHUNK-'
                  'v4-valid-prelock-quarantine'
              ), completion
              assert completion.get('slateDateEt') == slate_date, completion
              assert int(completion.get('manifestGameCount') or 0) == expected_games, completion
              assert int(completion.get('processedGameCount') or 0) == expected_games, completion
              assert int(completion.get('verifiedGameCount') or 0) == expected_games, completion
              assert int(completion.get('verificationIndex') or 0) == expected_games, completion
              assert completion.get('verificationComplete') is True, completion
              assert int(completion.get('canonicalCount') or 0) == 0, completion
              assert int(completion.get('noPredictionDataCount') or 0) == no_data, completion
              assert int(
                  completion.get('missedLockValidPrelockQuarantineCount') or 0
              ) == quarantined, completion
              assert int(completion.get('lockOutcomeCount') or 0) == expected_games, completion
              assert int(completion.get('missedCount') or 0) == 0, completion
              assert int(completion.get('dueMissingCount') or 0) == 0, completion
              assert completion.get('durableTerminalVerificationComplete') is True, completion
              assert completion.get('atomicDurableProofRequired') is True, completion
              assert 0 < int(completion.get('atomicDurableItemCount') or 0) <= 100, completion
              assert completion.get('completionMutationLeaseRequired') is True, completion
              fingerprints = (
                  'checkpointFingerprint',
                  'manifestFingerprint',
                  'manifestAuthorityEvidenceFingerprint',
                  'providerManifestFingerprint',
                  'atomicDurableReadSetFingerprint',
              )
              assert all(
                  re.fullmatch(r'[0-9a-f]{64}', str(completion.get(key) or ''))
                  for key in fingerprints
              ), completion
              assert completion.get('postStartPredictionCreationAllowed') is False, completion
              assert completion.get('immutablePredictionRewriteAllowed') is False, completion
              assert completion.get('directWorkflowTableWrite') is False, completion
              assert completion.get('productionAuthorityChanged') is False, completion

              terminal_games = completion.get('terminalGames') or []
              assert len(terminal_games) == expected_games, completion
              assert terminal_games == progress.get('terminalGames'), (
                  terminal_games, progress
              )
              expected_game_set_fingerprint = hashlib.sha256(
                  json.dumps(
                      terminal_games,
                      sort_keys=True,
                      separators=(',', ':'),
                  ).encode('utf-8')
              ).hexdigest()
              assert completion.get('terminalGameSetFingerprint') == (
                  expected_game_set_fingerprint
              ), completion
              assert progress.get('terminalGameSetFingerprint') == (
                  expected_game_set_fingerprint
              ), progress

              def lifecycle(rows, state_field):
                  normalized = []
                  seen = set()
                  for game in rows or []:
                      official_pk = str(game.get('officialGamePk') or '')
                      identity = str(game.get('gameIdentity') or '')
                      state = str(game.get(state_field) or '')
                      assert official_pk and int(official_pk) > 0, game
                      assert official_pk not in seen, game
                      assert identity, game
                      assert state in {
                          'LOCKED_CANONICAL',
                          'LOCKED_NO_PREDICTION_DATA',
                          'MISSED_LOCK_VALID_PRELOCK_CANDIDATE_NOT_PROMOTED',
                      }, game
                      seen.add(official_pk)
                      normalized.append({
                          'officialGamePk': official_pk,
                          'gameIdentity': identity,
                          'terminalState': state,
                      })
                  return sorted(
                      normalized,
                      key=lambda game: int(game['officialGamePk']),
                  )

              receipt_lifecycle = lifecycle(terminal_games, 'terminalState')
              official_lifecycle = lifecycle(row.get('lifecycleGames'), 'terminalState')
              settlement_lifecycle = lifecycle(
                  settlement.get('lifecycleGames'),
                  'terminalState',
              )
              public_lifecycle = lifecycle(
                  status.get('perGameStatus'),
                  'lockStatus',
              )
              assert len(receipt_lifecycle) == expected_games, receipt_lifecycle
              assert receipt_lifecycle == official_lifecycle, row
              assert receipt_lifecycle == settlement_lifecycle, settlement
              assert receipt_lifecycle == public_lifecycle, status
              assert str(row.get('providerManifestFingerprint') or '') == (
                  completion.get('providerManifestFingerprint')
              ), row
              assert str(status.get('providerManifestFingerprint') or '') == (
                  completion.get('providerManifestFingerprint')
              ), status
              assert status.get('ok') is True, status
              assert status.get('slateDateEt') == slate_date, status
              assert int(status.get('gameCount') or 0) == expected_games, status
              assert int(status.get('lockedPredictionCount') or 0) == 0, status
              assert int(status.get('lockedStatusCount') or 0) == expected_games, status
              assert int(status.get('noPredictionDataCount') or 0) == no_data, status
              assert int(
                  status.get('missedLockValidPrelockQuarantineCount') or 0
              ) == quarantined, status
              assert status.get('lockStatusComplete') is True, status
              assert status.get('canonicalPredictionComplete') is False, status

              if slate_date == os.environ['REPAIR_SLATE_DATE']:
                  exact = [
                      game
                      for game in status.get('perGameStatus') or []
                      if str(game.get('officialGamePk') or '') == '824805'
                  ]
                  assert len(exact) == 1, status
                  game = exact[0]
                  assert game.get('lockStatus') == (
                      'MISSED_LOCK_VALID_PRELOCK_CANDIDATE_NOT_PROMOTED'
                  ), game
                  assert game.get('gameIdentity') == (
                      'provider:fadc6a3080af39afc5de586f3e2945a3'
                  ), game
                  assert (
                      game.get('gameId') == 'mlb_statsapi:824805'
                      or game.get('officialGameId') == 'mlb_statsapi:824805'
                  ), game
                  assert str(game.get('commenceTime') or '').startswith(
                      '2026-08-04T22:35:00'
                  ), game
                  assert str(game.get('scheduledLockAtUtc') or '').startswith(
                      '2026-08-04T21:50:00'
                  ), game
                  for field in (
                      'locked',
                      'lockedPrediction',
                      'canonical',
                      'officialPrediction',
                      'accuracyEligible',
                      'wagerAllowed',
                      'predictionAdopted',
                      'canonicalPredictionComplete',
                      'playable',
                      'playablePick',
                      'actionablePick',
                      'trainingEligible',
                  ):
                      assert game.get(field) is False, (field, game)
                  assert game.get('lockOutcomeRecorded') is True, game
                  assert game.get('operationalDefect') is True, game
                  assert game.get('blocked') is True, game
                  assert game.get('predictedWinner') is None, game
                  assert game.get('predictedSide') is None, game
                  assert game.get('selectionFingerprint') is None, game
                  receipt_824805 = [
                      row
                      for row in terminal_games
                      if str(row.get('officialGamePk') or '') == '824805'
                  ]
                  assert len(receipt_824805) == 1, terminal_games
                  assert receipt_824805[0].get('terminalState') == (
                      'MISSED_LOCK_VALID_PRELOCK_CANDIDATE_NOT_PROMOTED'
                  ), receipt_824805
                  assert quarantined >= 1, completion

              return {
                  'slateDateEt': slate_date,
                  'manifestGameCount': expected_games,
                  'canonicalPredictionCount': 0,
                  'terminalNoPredictionCount': no_data,
                  'missedLockValidPrelockQuarantineCount': quarantined,
                  'lockOutcomeCount': expected_games,
                  'terminalGameSetFingerprint': expected_game_set_fingerprint,
                  'providerManifestFingerprint': completion.get(
                      'providerManifestFingerprint'
                  ),
                  'atomicDurableReadSetFingerprint': completion.get(
                      'atomicDurableReadSetFingerprint'
                  ),
                  'cooperativeReceiptVerified': True,
              }

          gap_terminal_proof = require_terminal_only_receipt(
              gap_report, repair, repair_status
          )
          target_terminal_proof = require_terminal_only_receipt(
              report, target, target_status
          )
          assert not bad, bad
          assert not gap_bad, gap_bad
          assert report.get('readOnlyNonSuccessStatusBodiesPreserved') is True, report
          assert report.get('mutatingNonSuccessStatusesStillFailClosed') is True, report
          print(json.dumps({
              'ok': True,
              'repairedGapSlateDate': repair,
              'repairedGapSlateOk': gap_report.get('ok'),
              'firstSlateDateEt': report.get('firstSlateDateEt'),
              'lastSlateDateEt': report.get('lastSlateDateEt'),
              'reconciledSlateCount': report.get('reconciledSlateCount'),
              'settlementTriggeredProtectedTerminalReplayCount': report.get(
                  'settlementTriggeredProtectedTerminalReplayCount'
              ),
              'gapTerminalOnlyProof': gap_terminal_proof,
              'targetTerminalOnlyProof': target_terminal_proof,
              'targetSlateDate': target,
              'productionAuthorityChanged': report.get('productionAuthorityChanged'),
          }, indent=2, sort_keys=True))
          PY

      - name: Run one canonical lease-safe training invocation
        env:
          PYTHONPATH: .
          AWS_MAX_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"scheduled","run":"unified_mlb_single_owner_settlement_recovery"}' \
            --response /tmp/unified-mlb-recovery/training.json \
            --invocation /tmp/unified-mlb-recovery/training-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 2400 \
            --retry-delay-seconds 20

      - name: Capture selection without activating authority
        env:
          PYTHONPATH: .
          AWS_MAX_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"selection_capture","run":"unified_mlb_single_owner_settlement_selection"}' \
            --response /tmp/unified-mlb-recovery/selection.json \
            --invocation /tmp/unified-mlb-recovery/selection-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 1200 \
            --retry-delay-seconds 20

      - name: Bind fresh status and prove terminal-only advancement
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --status-training-result /tmp/unified-mlb-recovery/training.json \
            --status-selection-capture-result /tmp/unified-mlb-recovery/selection.json \
            --response /tmp/unified-mlb-recovery/status.json \
            --invocation /tmp/unified-mlb-recovery/status-invocation.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          settlement = json.loads(
              Path('/tmp/unified-mlb-recovery/settlement-recovery.json').read_text()
          )
          gap_settlement = json.loads(
              Path('/tmp/unified-mlb-recovery/settlement-gap-repair.json').read_text()
          )
          training = json.loads(Path('/tmp/unified-mlb-recovery/training.json').read_text())
          selection = json.loads(Path('/tmp/unified-mlb-recovery/selection.json').read_text())
          status = json.loads(Path('/tmp/unified-mlb-recovery/status.json').read_text())
          requested = status.get('requestedRunEvidence') or {}
          training_evidence = requested.get('training') or {}
          selection_evidence = requested.get('selectionCapture') or {}
          latest = training_evidence.get('run') or {}
          selection_run = selection_evidence.get('run') or {}
          training_run_id = str(training.get('runId') or '')
          selection_run_id = str(selection.get('runId') or '')
          continuity = latest.get('canonicalSlateContinuity') or {}
          finalized = set(continuity.get('finalizedGameSlateDates') or [])
          processed = set(continuity.get('processedSlateDates') or [])
          target = os.environ['TARGET_SLATE_DATE']
          repair = os.environ['REPAIR_SLATE_DATE']
          baseline_status = json.loads(
              Path('/tmp/unified-mlb-recovery/trainer-before.json').read_text()
          )
          baseline_latest = baseline_status.get('latestStatus') or (
              (baseline_status.get('trainingHealth') or {}).get('latestRun') or {}
          )
          baseline_counts = baseline_latest.get('partitionCounts') or (
              (baseline_latest.get('milestones') or {}).get('counts') or {}
          )
          baseline_accepted = int(baseline_latest.get('acceptedRowCount') or 0)
          baseline_rejected = int(baseline_latest.get('rejectedRowCount') or 0)
          baseline_train = int(baseline_counts.get('train') or 0)
          baseline_continuity = (
              baseline_latest.get('canonicalSlateContinuity') or {}
          )
          baseline_finalized = set(
              baseline_continuity.get('finalizedGameSlateDates') or []
          )
          baseline_processed = set(
              baseline_continuity.get('processedSlateDates') or []
          )
          accepted = int(latest.get('acceptedRowCount') or 0)
          rejected = int(latest.get('rejectedRowCount') or 0)
          counts = latest.get('partitionCounts') or ((latest.get('milestones') or {}).get('counts') or {})
          train_count = int(counts.get('train') or 0)
          slate_diagnostics = continuity.get('finalizedSlateDiagnostics') or {}
          proof = {
              'ok': (
                  settlement.get('ok') is True
                  and gap_settlement.get('ok') is True
                  and training.get('ok') is True
                  and selection.get('ok') is True
                  and status.get('ok') is True
                  and training_evidence.get('ok') is True
                  and selection_evidence.get('ok') is True
                  and training_evidence.get('requestedRunId') == training_run_id
                  and selection_evidence.get('requestedRunId') == selection_run_id
                  and latest.get('runId') == training_run_id
                  and selection_run.get('runId') == selection_run_id
                  and latest.get('executionMode') == 'training'
                  and selection_run.get('executionMode') == 'selection_capture'
              ),
              'baselineAcceptedRowCount': baseline_accepted,
              'baselineRejectedRowCount': baseline_rejected,
              'baselineTrainRowCount': baseline_train,
              'baselineProcessedSlateDates': sorted(baseline_processed),
              'baselineFinalizedSlateDates': sorted(baseline_finalized),
              'acceptedRowCount': accepted,
              'rejectedRowCount': rejected,
              'partitionCounts': counts,
              'processedSlateCount': len(processed),
              'finalizedSlateCount': len(finalized),
              'terminalOnlySlateDiagnostics': {
                  repair: slate_diagnostics.get(repair),
                  target: slate_diagnostics.get(target),
              },
              'targetSlateDate': target,
              'targetSlateFinalized': target in finalized,
              'targetSlateProcessed': target in processed,
              'processedThroughSlateDate': continuity.get('processedThroughSlateDate'),
              'blockedSlateDate': continuity.get('blockedSlateDate'),
              'continuityBlocker': continuity.get('blocker'),
              'settlementRecoveryOk': settlement.get('ok'),
              'gapSettlementRecoveryOk': gap_settlement.get('ok'),
              'gapSettlementSlateDateEt': gap_settlement.get('lastSlateDateEt'),
              'settlementLastSlateDateEt': settlement.get('lastSlateDateEt'),
              'settlementProtectedReplayCount': settlement.get(
                  'settlementTriggeredProtectedTerminalReplayCount'
              ),
              'trainingRunId': training_run_id,
              'selectionCaptureRunId': selection_run_id,
              'trainingDeploymentIdentityMatches': training_evidence.get('deploymentIdentityMatches'),
              'selectionDeploymentIdentityMatches': selection_evidence.get('deploymentIdentityMatches'),
              'automaticPromotionEnabled': latest.get('automaticPromotionEnabled'),
              'championChanged': latest.get('championChanged'),
              'liveInferenceAuthority': latest.get('liveInferenceAuthority'),
              'productionAuthorityChanged': latest.get('productionAuthorityChanged'),
              'immutablePredictionRewriteAllowed': False,
              'postStartPredictionCreationAllowed': False,
              'otherSportChanged': False,
          }
          Path('/tmp/unified-mlb-recovery/acceptance.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          assert proof['ok'] is True, proof
          assert gap_settlement.get('lastSlateDateEt') == repair, proof
          assert finalized == baseline_finalized | {repair, target}, proof
          assert processed == baseline_processed | {repair, target}, proof
          assert len(finalized) == 5, proof
          assert len(processed) == 5, proof
          assert continuity.get('blockedSlateDate') in (None, ''), proof
          assert continuity.get('blocker') in (None, ''), proof
          assert training_evidence.get('deploymentIdentityMatches') is True, proof
          assert selection_evidence.get('deploymentIdentityMatches') is True, proof
          assert accepted == baseline_accepted, proof
          assert rejected == baseline_rejected, proof
          assert train_count == baseline_train, proof
          for slate_date in (repair, target):
              diagnostic = slate_diagnostics.get(slate_date) or {}
              assert diagnostic.get('slateFinalized') is True, proof
              assert int(diagnostic.get('officialGameCount') or 0) == int(
                  os.environ['RECOVERY_TERMINAL_GAME_COUNT']
              ), proof
              assert int(diagnostic.get('canonicalLockCount') or 0) == 0, proof
              terminal_no_data = int(
                  diagnostic.get('terminalNoPredictionCount') or 0
              )
              quarantined = int(
                  diagnostic.get('missedLockValidPrelockQuarantineCount') or 0
              )
              assert terminal_no_data + quarantined == int(
                  os.environ['RECOVERY_TERMINAL_GAME_COUNT']
              ), proof
              assert int(diagnostic.get('terminalExcludedCount') or 0) == int(
                  os.environ['RECOVERY_TERMINAL_GAME_COUNT']
              ), proof
              assert int(diagnostic.get('emittedTrainingRowCount') or 0) == 0, proof
              assert int(
                  diagnostic.get('quarantinedRowsAdmittedToTraining') or 0
              ) == 0, proof
          assert latest.get('automaticPromotionEnabled') is not True, proof
          assert latest.get('championChanged') is not True, proof
          assert latest.get('liveInferenceAuthority') is not True, proof
          assert latest.get('productionAuthorityChanged') is not True, proof
          PY

      - name: Prove current-slate integrity did not regress
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/mlb_scoring_guard_status.py \
            --slate-date "$CURRENT_SLATE_DATE" \
            --region "$AWS_REGION" \
            --output /tmp/unified-mlb-recovery/production-after.json
          python scripts/verify_mlb_recovery_current_slate_guard.py \
            --before /tmp/unified-mlb-recovery/production-before.json \
            --after /tmp/unified-mlb-recovery/production-after.json \
            --output /tmp/unified-mlb-recovery/production-integrity-after.json

      - name: Upload complete recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-mlb-learning-recovery-${{ github.run_id }}
          path: /tmp/unified-mlb-recovery
          if-no-files-found: warn
          retention-days: 90
