      - name: Capture pre-recovery R7 numeric baseline
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"sport":"mlb","mode":"status"}' \
            /tmp/unified-mlb-recovery/r7-before.json \
            > /tmp/unified-mlb-recovery/r7-before-invocation.json
          python - <<'PY'
          import json
          from pathlib import Path

          invocation = json.loads(
              Path(
                  '/tmp/unified-mlb-recovery/r7-before-invocation.json'
              ).read_text()
          )
          status = json.loads(
              Path('/tmp/unified-mlb-recovery/r7-before.json').read_text()
          )
          health = status.get('trainingHealth') or {}
          latest = status.get('latestStatus') or {}
          counts = latest.get('partitionCounts') or (
              (latest.get('milestones') or {}).get('counts') or {}
          )
          health_errors = set(health.get('errors') or [])
          # A stale immutable run is still a valid numeric baseline. Every
          # integrity/manifest error remains fatal. The exact prior-deploy
          # identity mismatch is expected immediately after deploying the
          # repair; both requested post-recovery runs must bind to this deploy.
          allowed_health_errors = {
              'latest_status_stale',
              'latest_status_deployment_identity_mismatch',
          }
          deployment_identity_matches = health.get(
              'deploymentIdentityMatches'
          )
          deployment_identity_error = (
              'latest_status_deployment_identity_mismatch' in health_errors
          )
          deployment_identity_contract_ok = bool(
              isinstance(deployment_identity_matches, bool)
              and deployment_identity_error
              == (deployment_identity_matches is False)
          )
          proof = {
              'ok': (
                  int(invocation.get('StatusCode') or 0) == 200
                  and not invocation.get('FunctionError')
                  and health_errors <= allowed_health_errors
                  and deployment_identity_contract_ok
                  and latest.get('executionMode') == 'training'
              ),
              'statusOverallOk': status.get('ok'),
              'trainingHealthErrors': sorted(health_errors),
              'deploymentIdentityMatchesCurrentRepair': (
                  deployment_identity_matches
              ),
              'deploymentIdentityMismatchAllowedOnlyForBaseline': True,
              'runId': latest.get('runId'),
              'acceptedRowCount': int(latest.get('acceptedRowCount') or 0),
              'trainCount': int(counts.get('train') or 0),
              'productionAuthorityChanged': latest.get(
                  'productionAuthorityChanged'
              ),
          }
          print(json.dumps(proof, indent=2, sort_keys=True))
          assert proof['ok'] is True, proof
          assert proof['runId'], proof
          assert latest.get('statusFingerprint'), proof
          assert latest.get('statusFingerprintVersion'), proof
          assert proof['acceptedRowCount'] >= 38, proof
          assert proof['trainCount'] >= 38, proof
          assert proof['productionAuthorityChanged'] is not True, proof
          PY

