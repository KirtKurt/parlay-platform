name: Unified MLB learning recovery once
run-name: Unified MLB learning recovery ${{ github.event.inputs.request_id || github.sha }}

"on":
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique unified MLB recovery request identifier
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/unified-mlb-learning-recovery-once.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: unified-mlb-learning
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  MLB_ROOT_STACK: parlay-platform-dev
  TARGET_SLATE_DATE: '2026-08-25'
  MIN_ACCEPTED_ROWS: '33'

jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact recovery source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wait for the same-commit deployment to finish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          source_sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              f'deploy.yml/runs?head_sha={source_sha}&event=push&per_page=20'
          )
          deadline = time.monotonic() + 2700
          last_state = None
          while time.monotonic() < deadline:
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'User-Agent': 'unified-mlb-learning-recovery',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              runs = [
                  run for run in payload.get('workflow_runs', [])
                  if run.get('head_sha') == source_sha
              ]
              if not runs:
                  state = 'waiting_for_deploy_run'
              else:
                  run = max(runs, key=lambda value: int(value.get('run_number') or 0))
                  status = str(run.get('status') or '')
                  conclusion = str(run.get('conclusion') or '')
                  state = f'{status}:{conclusion or "pending"}'
                  if status == 'completed':
                      if conclusion != 'success':
                          raise SystemExit(
                              'Same-commit deployment did not pass: '
                              + json.dumps(
                                  {
                                      'runId': run.get('id'),
                                      'status': status,
                                      'conclusion': conclusion,
                                      'htmlUrl': run.get('html_url'),
                                  },
                                  sort_keys=True,
                              )
                          )
                      print(json.dumps({
                          'ok': True,
                          'deployRunId': run.get('id'),
                          'deployConclusion': conclusion,
                          'sourceSha': source_sha,
                      }, sort_keys=True))
                      break
              if state != last_state:
                  print(state, flush=True)
                  last_state = state
              time.sleep(15)
          else:
              raise SystemExit('Timed out waiting for same-commit deployment')
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install bounded runtime and prove one recovery owner
        run: |
          set -euo pipefail
          python -m pip install --quiet \
            'boto3>=1.34,<2' \
            'pytest>=8,<9' \
            'PyYAML>=6,<7'
          python -m py_compile \
            scripts/invoke_mlb_trainer_with_retry.py \
            scripts/mlb_scoring_guard_status.py \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py \
            scripts/verify_unified_mlb_learning_ownership.py
          python -m pytest -q \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5.py \
            tests/unit/test_mlb_prospective_backlog_workflow.py \
            tests/unit/test_unified_mlb_learning_ownership.py
          python scripts/verify_unified_mlb_learning_ownership.py
          grep -q 'UNIFIED_MLB_LEARNING_OWNER=eventbridge_schedule' .github/workflows/deploy.yml
          ! grep -q 'Run AWS-native MLB trainer and verify fresh split health' .github/workflows/deploy.yml
          mkdir -p /tmp/unified-mlb-recovery

      - name: Resolve active deployed unified MLB trainer
        run: |
          set -euo pipefail
          TRAINER_FN="$(aws cloudformation describe-stack-resource \
            --stack-name "$MLB_ROOT_STACK" \
            --logical-resource-id MLBMLTrainingFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          case "$TRAINER_FN" in
            *MLBMLTrainingFunction*) ;;
            *) echo 'Resolved resource is not the unified MLB trainer' >&2; exit 1 ;;
          esac
          echo "TRAINER_FN=$TRAINER_FN" >> "$GITHUB_ENV"
          aws lambda get-function-configuration \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --query '{FunctionName:FunctionName,State:State,LastUpdateStatus:LastUpdateStatus,Handler:Handler,MemorySize:MemorySize,Timeout:Timeout}' \
            --output json | tee /tmp/unified-mlb-recovery/trainer-config.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/unified-mlb-recovery/trainer-config.json').read_text())
          assert value.get('State') == 'Active', value
          assert value.get('LastUpdateStatus') == 'Successful', value
          assert value.get('Handler') == 'mlb_ml_aws_training_v1_compat.lambda_handler', value
          assert int(value.get('Timeout') or 0) == 900, value
          PY

      - name: Prove production and August 25 immutable coverage before settlement
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          CURRENT_SLATE_DATE="$(TZ=America/New_York date +%F)"
          echo "CURRENT_SLATE_DATE=$CURRENT_SLATE_DATE" >> "$GITHUB_ENV"
          python scripts/mlb_scoring_guard_status.py \
            --slate-date "$CURRENT_SLATE_DATE" \
            --region "$AWS_REGION" \
            --output /tmp/unified-mlb-recovery/production-before.json \
            --enforce
          python scripts/mlb_scoring_guard_status.py \
            --slate-date "$TARGET_SLATE_DATE" \
            --region "$AWS_REGION" \
            --output /tmp/unified-mlb-recovery/target-before.json \
            --enforce
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/unified-mlb-recovery/target-before.json').read_text())
          summary = value.get('summary') or {}
          assert value.get('guardPassed') is True, value
          assert value.get('readOnly') is True, value
          assert int(summary.get('officialGameCount') or 0) == 15, summary
          assert int(summary.get('movementFeatureGameCount') or 0) == 15, summary
          assert int(summary.get('missingMovementCount') or 0) == 0, summary
          assert int(summary.get('persistedPredictionGameCount') or 0) == 15, summary
          PY

      - name: Reconcile protected prospective settlement backlog
        env:
          AWS_MAX_ATTEMPTS: '10'
          AWS_RETRY_MODE: standard
        run: |
          set -euo pipefail
          python scripts/reconcile_mlb_prospective_backlog_v5.py \
            --stack-name "$MLB_ROOT_STACK" \
            --region "$AWS_REGION" \
            --max-slate-days 31 \
            --output /tmp/unified-mlb-recovery/settlement-recovery.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path('/tmp/unified-mlb-recovery/settlement-recovery.json').read_text()
          )
          target = os.environ['TARGET_SLATE_DATE']
          last_slate = str(report.get('lastSlateDateEt') or '')
          expected_false = (
              'directTableWrite',
              'postStartPredictionCreationAllowed',
              'immutablePredictionRewriteAllowed',
              'promotionAuthorityChanged',
              'productionAuthorityChanged',
              'automaticWagerAllowed',
          )
          bad = {
              key: report.get(key)
              for key in expected_false
              if report.get(key) is not False
          }
          assert report.get('ok') is True, report
          assert int(report.get('boundedMaximumSlateDays') or 0) == 31, report
          assert last_slate >= target, report
          assert not bad, bad
          assert report.get('readOnlyNonSuccessStatusBodiesPreserved') is True, report
          assert report.get('mutatingNonSuccessStatusesStillFailClosed') is True, report
          print(json.dumps({
              'ok': True,
              'firstSlateDateEt': report.get('firstSlateDateEt'),
              'lastSlateDateEt': report.get('lastSlateDateEt'),
              'reconciledSlateCount': report.get('reconciledSlateCount'),
              'settlementTriggeredProtectedTerminalReplayCount': report.get(
                  'settlementTriggeredProtectedTerminalReplayCount'
              ),
              'targetSlateDate': target,
              'productionAuthorityChanged': report.get('productionAuthorityChanged'),
          }, indent=2, sort_keys=True))
          PY

      - name: Run one canonical lease-safe training invocation
        env:
          PYTHONPATH: .
          AWS_MAX_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"scheduled","run":"unified_mlb_single_owner_settlement_recovery"}' \
            --response /tmp/unified-mlb-recovery/training.json \
            --invocation /tmp/unified-mlb-recovery/training-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 2400 \
            --retry-delay-seconds 20

      - name: Capture selection without activating authority
        env:
          PYTHONPATH: .
          AWS_MAX_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"selection_capture","run":"unified_mlb_single_owner_settlement_selection"}' \
            --response /tmp/unified-mlb-recovery/selection.json \
            --invocation /tmp/unified-mlb-recovery/selection-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 1200 \
            --retry-delay-seconds 20

      - name: Bind fresh status and require numeric advancement
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --status-training-result /tmp/unified-mlb-recovery/training.json \
            --status-selection-capture-result /tmp/unified-mlb-recovery/selection.json \
            --response /tmp/unified-mlb-recovery/status.json \
            --invocation /tmp/unified-mlb-recovery/status-invocation.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          settlement = json.loads(
              Path('/tmp/unified-mlb-recovery/settlement-recovery.json').read_text()
          )
          training = json.loads(Path('/tmp/unified-mlb-recovery/training.json').read_text())
          selection = json.loads(Path('/tmp/unified-mlb-recovery/selection.json').read_text())
          status = json.loads(Path('/tmp/unified-mlb-recovery/status.json').read_text())
          health = status.get('trainingHealth') or {}
          selection_health = status.get('selectionCaptureHealth') or {}
          latest = health.get('latestRun') or training
          continuity = latest.get('canonicalSlateContinuity') or {}
          finalized = set(continuity.get('finalizedGameSlateDates') or [])
          processed = set(continuity.get('processedSlateDates') or [])
          target = os.environ['TARGET_SLATE_DATE']
          minimum = int(os.environ['MIN_ACCEPTED_ROWS'])
          accepted = int(latest.get('acceptedRowCount') or 0)
          counts = latest.get('partitionCounts') or ((latest.get('milestones') or {}).get('counts') or {})
          train_count = int(counts.get('train') or 0)
          proof = {
              'ok': (
                  settlement.get('ok') is True
                  and training.get('ok') is True
                  and selection.get('ok') is True
                  and status.get('ok') is True
              ),
              'acceptedRowCount': accepted,
              'partitionCounts': counts,
              'targetSlateDate': target,
              'targetSlateFinalized': target in finalized,
              'targetSlateProcessed': target in processed,
              'processedThroughSlateDate': continuity.get('processedThroughSlateDate'),
              'blockedSlateDate': continuity.get('blockedSlateDate'),
              'continuityBlocker': continuity.get('blocker'),
              'settlementRecoveryOk': settlement.get('ok'),
              'settlementLastSlateDateEt': settlement.get('lastSlateDateEt'),
              'settlementProtectedReplayCount': settlement.get(
                  'settlementTriggeredProtectedTerminalReplayCount'
              ),
              'trainingDeploymentIdentityMatches': health.get('deploymentIdentityMatches'),
              'selectionDeploymentIdentityMatches': selection_health.get('deploymentIdentityMatches'),
              'automaticPromotionEnabled': latest.get('automaticPromotionEnabled'),
              'championChanged': latest.get('championChanged'),
              'liveInferenceAuthority': latest.get('liveInferenceAuthority'),
              'productionAuthorityChanged': latest.get('productionAuthorityChanged'),
              'immutablePredictionRewriteAllowed': False,
              'postStartPredictionCreationAllowed': False,
              'otherSportChanged': False,
          }
          Path('/tmp/unified-mlb-recovery/acceptance.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          assert proof['ok'] is True, proof
          assert target in finalized, proof
          assert target in processed, proof
          assert continuity.get('blockedSlateDate') in (None, ''), proof
          assert continuity.get('blocker') in (None, ''), proof
          assert health.get('deploymentIdentityMatches') is True, proof
          assert selection_health.get('deploymentIdentityMatches') is True, proof
          assert accepted >= minimum, proof
          assert train_count >= minimum, proof
          assert latest.get('automaticPromotionEnabled') is not True, proof
          assert latest.get('championChanged') is not True, proof
          assert latest.get('liveInferenceAuthority') is not True, proof
          assert latest.get('productionAuthorityChanged') is not True, proof
          PY

      - name: Prove unified MLB production remained healthy
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/mlb_scoring_guard_status.py \
            --slate-date "$CURRENT_SLATE_DATE" \
            --region "$AWS_REGION" \
            --output /tmp/unified-mlb-recovery/production-after.json \
            --enforce
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/unified-mlb-recovery/production-before.json').read_text())
          after = json.loads(Path('/tmp/unified-mlb-recovery/production-after.json').read_text())
          b = before.get('summary') or {}
          a = after.get('summary') or {}
          assert before.get('guardPassed') is True, before
          assert after.get('guardPassed') is True, after
          assert not before.get('blockers'), before
          assert not after.get('blockers'), after
          assert int(a.get('officialGameCount') or 0) == int(b.get('officialGameCount') or 0), (b, a)
          assert int(a.get('persistedPredictionGameCount') or 0) >= int(b.get('persistedPredictionGameCount') or 0), (b, a)
          assert int(a.get('invalidPredictionTeamCount') or 0) == 0, a
          assert int(a.get('invalidMovementTeamCount') or 0) == 0, a
          PY

      - name: Upload complete recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-mlb-learning-recovery-${{ github.run_id }}
          path: /tmp/unified-mlb-recovery
          if-no-files-found: warn
          retention-days: 90
