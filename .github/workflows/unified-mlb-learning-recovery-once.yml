      - name: Bind fresh status and require numeric advancement
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FN" \
            --region "$AWS_REGION" \
            --status-training-result /tmp/unified-mlb-recovery/training.json \
            --status-selection-capture-result /tmp/unified-mlb-recovery/selection.json \
            --response /tmp/unified-mlb-recovery/status.json \
            --invocation /tmp/unified-mlb-recovery/status-invocation.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          settlement = json.loads(
              Path('/tmp/unified-mlb-recovery/settlement-recovery.json').read_text()
          )
          gap_settlement = json.loads(
              Path('/tmp/unified-mlb-recovery/settlement-gap-repair.json').read_text()
          )
          before = json.loads(
              Path('/tmp/unified-mlb-recovery/r7-before.json').read_text()
          )
          training = json.loads(Path('/tmp/unified-mlb-recovery/training.json').read_text())
          selection = json.loads(Path('/tmp/unified-mlb-recovery/selection.json').read_text())
          status = json.loads(Path('/tmp/unified-mlb-recovery/status.json').read_text())
          requested = status.get('requestedRunEvidence') or {}
          training_evidence = requested.get('training') or {}
          selection_evidence = requested.get('selectionCapture') or {}
          latest = training_evidence.get('run') or {}
          selection_run = selection_evidence.get('run') or {}
          training_run_id = str(training.get('runId') or '')
          selection_run_id = str(selection.get('runId') or '')
          continuity = latest.get('canonicalSlateContinuity') or {}
          finalized = set(continuity.get('finalizedGameSlateDates') or [])
          processed = set(continuity.get('processedSlateDates') or [])
          target = os.environ['TARGET_SLATE_DATE']
          repair = os.environ['REPAIR_SLATE_DATE']
          minimum = int(os.environ['MIN_ACCEPTED_ROWS'])
          accepted = int(latest.get('acceptedRowCount') or 0)
          counts = latest.get('partitionCounts') or ((latest.get('milestones') or {}).get('counts') or {})
          train_count = int(counts.get('train') or 0)
          before_latest = before.get('latestStatus') or {}
          before_counts = before_latest.get('partitionCounts') or (
              (before_latest.get('milestones') or {}).get('counts') or {}
          )
          before_accepted = int(before_latest.get('acceptedRowCount') or 0)
          before_train_count = int(before_counts.get('train') or 0)
          proof = {
              'ok': (
                  settlement.get('ok') is True
                  and gap_settlement.get('ok') is True
                  and training.get('ok') is True
                  and selection.get('ok') is True
                  and status.get('ok') is True
                  and training_evidence.get('ok') is True
                  and selection_evidence.get('ok') is True
                  and training_evidence.get('requestedRunId') == training_run_id
                  and selection_evidence.get('requestedRunId') == selection_run_id
                  and latest.get('runId') == training_run_id
                  and selection_run.get('runId') == selection_run_id
                  and latest.get('executionMode') == 'training'
                  and selection_run.get('executionMode') == 'selection_capture'
              ),
              'acceptedRowCount': accepted,
              'acceptedRowCountBefore': before_accepted,
              'acceptedRowCountAdvanced': accepted > before_accepted,
              'partitionCounts': counts,
              'trainCountBefore': before_train_count,
              'trainCountAdvanced': train_count > before_train_count,
              'championUnchanged': before.get('champion') == status.get('champion'),
              'noQualifiedChampion': status.get('champion') in (None, {}),
              'targetSlateDate': target,
              'targetSlateFinalized': target in finalized,
              'targetSlateProcessed': target in processed,
              'repairSlateDate': repair,
              'repairSlateFinalized': repair in finalized,
              'repairSlateProcessed': repair in processed,
              'processedThroughSlateDate': continuity.get('processedThroughSlateDate'),
              'blockedSlateDate': continuity.get('blockedSlateDate'),
              'continuityBlocker': continuity.get('blocker'),
              'settlementRecoveryOk': settlement.get('ok'),
              'gapSettlementRecoveryOk': gap_settlement.get('ok'),
              'gapSettlementSlateDateEt': gap_settlement.get('lastSlateDateEt'),
              'settlementLastSlateDateEt': settlement.get('lastSlateDateEt'),
              'settlementProtectedReplayCount': settlement.get(
                  'settlementTriggeredProtectedTerminalReplayCount'
              ),
              'trainingRunId': training_run_id,
              'selectionCaptureRunId': selection_run_id,
              'trainingDeploymentIdentityMatches': training_evidence.get('deploymentIdentityMatches'),
              'selectionDeploymentIdentityMatches': selection_evidence.get('deploymentIdentityMatches'),
              'automaticPromotionEnabled': latest.get('automaticPromotionEnabled'),
              'championChanged': latest.get('championChanged'),
              'liveInferenceAuthority': latest.get('liveInferenceAuthority'),
              'productionAuthorityChanged': latest.get('productionAuthorityChanged'),
              'immutablePredictionRewriteAllowed': latest.get(
                  'immutablePredictionRewriteAllowed'
              ),
              'postStartPredictionCreationAllowed': latest.get(
                  'postStartPredictionCreationAllowed'
              ),
              'otherSportChanged': latest.get('otherSportChanged'),
          }
          Path('/tmp/unified-mlb-recovery/acceptance.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          assert proof['ok'] is True, proof
          assert gap_settlement.get('lastSlateDateEt') == repair, proof
          assert repair in finalized, proof
          assert repair in processed, proof
          assert target in finalized, proof
          assert target in processed, proof
          assert continuity.get('blockedSlateDate') in (None, ''), proof
          assert continuity.get('blocker') in (None, ''), proof
          assert training_evidence.get('deploymentIdentityMatches') is True, proof
          assert selection_evidence.get('deploymentIdentityMatches') is True, proof
          assert accepted >= minimum, proof
          assert train_count >= minimum, proof
          assert accepted > before_accepted, proof
          assert train_count > before_train_count, proof
          assert before.get('champion') == status.get('champion'), proof
          assert status.get('champion') in (None, {}), proof
          assert before.get('automaticPromotionEnabled') is False, proof
          assert status.get('automaticPromotionEnabled') is False, proof
          assert latest.get('automaticPromotionEnabled') is False, proof
          assert latest.get('championChanged') is False, proof
          assert latest.get('liveInferenceAuthority') is False, proof
          assert latest.get('productionAuthorityChanged') is False, proof
          assert latest.get('immutablePredictionRewriteAllowed') is False, proof
          assert latest.get('postStartPredictionCreationAllowed') is False, proof
          assert latest.get('otherSportChanged') is False, proof
          PY

      - name: Prove current-slate integrity did not regress
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/mlb_scoring_guard_status.py \
            --slate-date "$CURRENT_SLATE_DATE" \
            --region "$AWS_REGION" \
            --output /tmp/unified-mlb-recovery/production-after.json
          python scripts/verify_mlb_recovery_current_slate_guard.py \
            --before /tmp/unified-mlb-recovery/production-before.json \
            --after /tmp/unified-mlb-recovery/production-after.json \
            --output /tmp/unified-mlb-recovery/production-integrity-after.json

      - name: Upload complete recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-mlb-learning-recovery-${{ github.run_id }}
          path: /tmp/unified-mlb-recovery
          if-no-files-found: warn
          retention-days: 90
