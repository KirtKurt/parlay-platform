          assert int(report.get('boundedMaximumSlateDays') or 0) == 31, report
          assert report.get('exactSlateSelection') is True, report
          assert report.get('selectedSlateDates') == [target], report
          assert report.get('firstSlateDateEt') == target, report
          assert last_slate == target, report
          assert int(report.get('reconciledSlateCount') or 0) == 1, report
          assert not bad, bad
          assert not gap_bad, gap_bad
          assert report.get('readOnlyNonSuccessStatusBodiesPreserved') is True, report
          assert report.get('mutatingNonSuccessStatusesStillFailClosed') is True, report
          print(json.dumps({
              'ok': True,
              'repairedGapSlateDate': repair,
              'repairedGapSlateOk': gap_report.get('ok'),
              'firstSlateDateEt': report.get('firstSlateDateEt'),
              'lastSlateDateEt': report.get('lastSlateDateEt'),
              'reconciledSlateCount': report.get('reconciledSlateCount'),
              'settlementTriggeredProtectedTerminalReplayCount': report.get(
                  'settlementTriggeredProtectedTerminalReplayCount'
              ),
              'targetSlateDate': target,
              'productionAuthorityChanged': report.get('productionAuthorityChanged'),
          }, indent=2, sort_keys=True))
          PY

