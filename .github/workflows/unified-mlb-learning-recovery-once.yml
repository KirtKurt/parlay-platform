name: Unified MLB learning recovery once
run-name: Unified MLB learning recovery ${{ github.event.inputs.request_id || github.sha }}

"on":
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique unified MLB recovery request identifier
        required: false
        type: string
      requeue_source_pull_proof_review_after_rebind:
        description: Requeue the exact protected source-pull proof review once
        required: false
        default: false
        type: boolean
      requeue_prelock_candidate_review_after_installed_runtime_proof_v2:
        description: Requeue exact Aug 4 review after strong installed-runtime proof
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: unified-mlb-learning
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  MLB_ROOT_STACK: parlay-platform-dev
  REPAIR_SLATE_DATE: '2026-08-04'
  TARGET_SLATE_DATE: '2026-08-25'
  # Production was already at 38 accepted/train rows before this repair. The
  # recovery must prove a real R7 increase, not merely retain an older floor.
  MIN_ACCEPTED_ROWS: '39'

jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact recovery source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded runtime and prove one recovery owner
        run: |
          set -euo pipefail
          python -m pip install --quiet \
            'boto3>=1.34,<2' \
            'pytest>=8,<9' \
            'PyYAML>=6,<7'
          python -m py_compile \
            scripts/invoke_mlb_trainer_with_retry.py \
            scripts/mlb_scoring_guard_status.py \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py \
            scripts/verify_mlb_recovery_current_slate_guard.py \
            scripts/verify_unified_mlb_learning_ownership.py
          python -m pytest -q \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5_settlement_replay.py \
            tests/unit/test_mlb_prospective_backlog_workflow.py \
            tests/unit/test_verify_mlb_recovery_current_slate_guard.py \
            tests/unit/test_unified_mlb_learning_ownership.py
          python scripts/verify_unified_mlb_learning_ownership.py
          grep -q 'UNIFIED_MLB_LEARNING_OWNER=eventbridge_schedule' .github/workflows/deploy.yml
          ! grep -q 'Run AWS-native MLB trainer and verify fresh split health' .github/workflows/deploy.yml
          mkdir -p /tmp/unified-mlb-recovery

      - name: Reject ambiguous remediation flags
        env:
          REQUEUE_SOURCE_PULL_V1: ${{ inputs.requeue_source_pull_proof_review_after_rebind }}
          REQUEUE_PRELOCK_V2: ${{ inputs.requeue_prelock_candidate_review_after_installed_runtime_proof_v2 }}
        run: |
          set -euo pipefail
          if [[ "$REQUEUE_SOURCE_PULL_V1" == "true" && "$REQUEUE_PRELOCK_V2" == "true" ]]; then
            echo 'Only one incident remediation flag may be enabled' >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for a quiet deploy queue and stable AWS runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          region = os.environ['AWS_REGION']
          stack_name = os.environ['MLB_ROOT_STACK']
          runs_url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              'deploy.yml/runs?branch=main&per_page=50'
          )
          stable_stack_states = {
              'CREATE_COMPLETE',
              'UPDATE_COMPLETE',
              'UPDATE_ROLLBACK_COMPLETE',
          }
          required_stable_probes = 8
          stable_probes = 0
          deadline = time.monotonic() + 5400
          last_state = None

          def github_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'User-Agent': 'unified-mlb-learning-recovery',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def aws_json(*args):
              command = ['aws', *args, '--region', region, '--output', 'json']
              completed = subprocess.run(
                  command,
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=120,
              )
              return json.loads(completed.stdout)

          while time.monotonic() < deadline:
              state = {
                  'activeDeployRunCount': None,
                  'stackStatus': None,
                  'trainerState': None,
                  'trainerLastUpdateStatus': None,
                  'stableProbe': stable_probes,
              }
              try:
                  run_payload = github_json(runs_url)
                  active_runs = [
                      {
                          'id': run.get('id'),
                          'headSha': run.get('head_sha'),
                          'status': run.get('status'),
                          'htmlUrl': run.get('html_url'),
                      }
                      for run in run_payload.get('workflow_runs', [])
                      if str(run.get('status') or '') != 'completed'
                  ]
                  state['activeDeployRunCount'] = len(active_runs)
                  if active_runs:
                      state['activeDeployRuns'] = active_runs[:5]

                  stacks = aws_json(
                      'cloudformation',
                      'describe-stacks',
                      '--stack-name',
                      stack_name,
                  )
                  stack = (stacks.get('Stacks') or [{}])[0]
                  stack_status = str(stack.get('StackStatus') or '')
                  state['stackStatus'] = stack_status
                  if (
                      stack_status not in stable_stack_states
                      and (
                          'FAILED' in stack_status
                          or stack_status.startswith('DELETE_')
                          or stack_status == 'ROLLBACK_COMPLETE'
                      )
                  ):
                      raise SystemExit(
                          'MLB root stack is in a terminal unsafe state: '
                          + stack_status
                      )

                  trainer_detail = aws_json(
                      'cloudformation',
                      'describe-stack-resource',
                      '--stack-name',
                      stack_name,
                      '--logical-resource-id',
                      'MLBMLTrainingFunction',
                  )
                  trainer_fn = str(
                      ((trainer_detail.get('StackResourceDetail') or {}).get(
                          'PhysicalResourceId'
                      ))
                      or ''
                  )
                  state['trainerFunctionName'] = trainer_fn
                  trainer = aws_json(
                      'lambda',
                      'get-function-configuration',
                      '--function-name',
                      trainer_fn,
                  )
                  state['trainerState'] = trainer.get('State')
                  state['trainerLastUpdateStatus'] = trainer.get('LastUpdateStatus')
                  state['trainerHandler'] = trainer.get('Handler')
                  state['trainerTimeout'] = trainer.get('Timeout')

                  runtime_ready = (
                      not active_runs
                      and stack_status in stable_stack_states
                      and trainer.get('State') == 'Active'
                      and trainer.get('LastUpdateStatus') == 'Successful'
                      and trainer.get('Handler')
                      == 'mlb_ml_aws_training_v1_compat.lambda_handler'
                      and int(trainer.get('Timeout') or 0) == 900
                  )
                  if runtime_ready:
                      stable_probes += 1
                  else:
                      stable_probes = 0
                  state['stableProbe'] = stable_probes

                  if state != last_state:
                      print(json.dumps(state, sort_keys=True), flush=True)
                      last_state = state

                  if stable_probes >= required_stable_probes:
                      proof = {
                          'ok': True,
                          'proofType': 'UNIFIED_MLB_DEPLOY_QUEUE_AND_AWS_RUNTIME_READY',
                          'activeDeployRunCount': 0,
                          'requiredStableProbes': required_stable_probes,
                          'observedStableProbes': stable_probes,
                          'stackStatus': stack_status,
                          'trainerFunctionName': trainer_fn,
                          'trainerState': trainer.get('State'),
                          'trainerLastUpdateStatus': trainer.get(
                              'LastUpdateStatus'
                          ),
                          'trainerHandler': trainer.get('Handler'),
                          'trainerTimeout': trainer.get('Timeout'),
                          'sameCommitDeploySuccessRequired': False,
                          'cancelledOrSupersededDeploysAreNonBlocking': True,
                      }
                      Path(
                          '/tmp/unified-mlb-recovery/aws-readiness.json'
                      ).write_text(
                          json.dumps(proof, indent=2, sort_keys=True) + '\n',
                          encoding='utf-8',
                      )
                      with Path(os.environ['GITHUB_ENV']).open(
                          'a', encoding='utf-8'
                      ) as stream:
                          stream.write(f'TRAINER_FN={trainer_fn}\n')
                      print(json.dumps(proof, indent=2, sort_keys=True))
                      break
              except SystemExit:
                  raise
              except Exception as exc:
                  stable_probes = 0
                  state['stableProbe'] = 0
                  state['probeError'] = f'{type(exc).__name__}:{exc}'
                  if state != last_state:
                      print(json.dumps(state, sort_keys=True), flush=True)
                      last_state = state
              time.sleep(15)
          else:
              raise SystemExit(
                  'Timed out waiting for a quiet deploy queue and stable AWS runtime'
              )
          PY

      - name: Requeue protected source-binding review once
        if: ${{ inputs.requeue_source_pull_proof_review_after_rebind }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any, Mapping

          import boto3
          from botocore.config import Config

          LOGICAL_RESOURCE_ID = 'MLBDailyPickLockFunction'
          EXPECTED_HANDLER = 'mlb_daily_pick_lock_protected.lambda_handler'
          EXPECTED_RUN = 'prospective_terminal_backlog_reconciliation_v5'
          EVENT_FLAG = 'requeueSourcePullProofReviewAfterRebind'
          INCIDENT_SLATE_DATE = '2026-08-04'
          EXPECTED_STATUS_BY_STATE = {
              'QUEUED': 'QUEUED_FOR_EVENTBRIDGE_LOCK_OWNER',
              'CLAIMED': 'CLAIMED_BY_EVENTBRIDGE_LOCK_OWNER',
              'COMPLETED': 'COMPLETED_BY_EVENTBRIDGE_LOCK_OWNER',
              'ACKNOWLEDGED': 'ACKNOWLEDGED_COMPLETION',
          }
          COMPLETED_STATES = {'COMPLETED', 'ACKNOWLEDGED'}
          REMEDIATION_VERSION = (
              'MLB-COOPERATIVE-SOURCE-PULL-REBIND-REVIEW-REMEDIATION-'
              'v1-one-shot'
          )
          SOURCE_REBIND_VERSION = (
              'MLB-STATUS-SOURCE-PULL-REBIND-v1-strong-immutable-row'
          )
          SAFETY_FIELDS = (
              'activeLeaseMutationAllowed',
              'postStartPredictionCreationAllowed',
              'immutablePredictionRewriteAllowed',
              'directWorkflowTableWrite',
              'productionAuthorityChanged',
          )

          region = os.environ['AWS_REGION']
          stack_name = os.environ['MLB_ROOT_STACK']
          repair_slate = os.environ['REPAIR_SLATE_DATE']
          if repair_slate != INCIDENT_SLATE_DATE:
              raise SystemExit(
                  'Protected remediation incident slate is not exact'
              )
          event = {
              'sport': 'mlb',
              'run': EXPECTED_RUN,
              'slateDateEt': repair_slate,
              'force': True,
              EVENT_FLAG: True,
          }
          if set(event) != {
              'sport',
              'run',
              'slateDateEt',
              'force',
              EVENT_FLAG,
          }:
              raise SystemExit('Protected remediation event is not exact')

          cloudformation = boto3.client(
              'cloudformation',
              region_name=region,
              config=Config(
                  connect_timeout=10,
                  read_timeout=120,
                  retries={'total_max_attempts': 3, 'mode': 'standard'},
              ),
          )
          resource = cloudformation.describe_stack_resource(
              StackName=stack_name,
              LogicalResourceId=LOGICAL_RESOURCE_ID,
          ).get('StackResourceDetail') or {}
          function_name = str(resource.get('PhysicalResourceId') or '')
          if (
              not function_name
              or resource.get('LogicalResourceId') != LOGICAL_RESOURCE_ID
              or resource.get('ResourceType') != 'AWS::Lambda::Function'
          ):
              raise SystemExit('Protected lock Lambda resolution failed closed')

          lambda_client = boto3.client(
              'lambda',
              region_name=region,
              config=Config(
                  connect_timeout=10,
                  read_timeout=900,
                  retries={'total_max_attempts': 1, 'mode': 'standard'},
              ),
          )
          configuration = lambda_client.get_function_configuration(
              FunctionName=function_name,
          )
          if (
              configuration.get('FunctionName') != function_name
              or configuration.get('Handler') != EXPECTED_HANDLER
              or configuration.get('State') != 'Active'
              or configuration.get('LastUpdateStatus') != 'Successful'
          ):
              raise SystemExit('Resolved protected lock Lambda is not ready')

          invocation = lambda_client.invoke(
              FunctionName=function_name,
              InvocationType='RequestResponse',
              Payload=json.dumps(
                  event,
                  sort_keys=True,
                  separators=(',', ':'),
              ).encode('utf-8'),
          )
          lambda_status = int(invocation.get('StatusCode') or 0)
          raw = invocation['Payload'].read()
          if lambda_status != 200 or invocation.get('FunctionError'):
              raise SystemExit('Protected lock Lambda invocation failed closed')
          try:
              envelope = json.loads(raw.decode('utf-8'))
          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(
                  'Protected lock Lambda response was not JSON'
              ) from exc
          if not isinstance(envelope, Mapping) or 'statusCode' not in envelope:
              raise SystemExit('Protected lock Lambda response envelope invalid')
          try:
              application_status = int(envelope.get('statusCode'))
          except (TypeError, ValueError) as exc:
              raise SystemExit(
                  'Protected lock application status invalid'
              ) from exc
          body = envelope.get('body')
          try:
              application = json.loads(body) if isinstance(body, str) else body
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  'Protected lock application body was not JSON'
              ) from exc
          if application_status != 200 or not isinstance(application, Mapping):
              raise SystemExit('Protected lock application failed closed')

          replay = application.get('cooperativeTerminalReplay')
          if not isinstance(replay, Mapping):
              raise SystemExit('Protected remediation replay receipt missing')
          remediation_idempotent = application.get(
              'sourcePullRebindReviewRemediationIdempotent'
          )
          if not isinstance(remediation_idempotent, bool):
              raise SystemExit('Protected remediation idempotency receipt invalid')
          replay_state = str(replay.get('state') or '')
          expected_status = EXPECTED_STATUS_BY_STATE.get(replay_state)
          if expected_status is None:
              raise SystemExit('Protected remediation replay state invalid')
          durable_history = application.get(
              'sourcePullRebindReviewRemediationDurableHistory'
          )
          nested_durable_history = replay.get(
              'durableRemediationHistory'
          )
          if (
              durable_history is not None
              and durable_history is not True
          ):
              raise SystemExit(
                  'Protected remediation durable history receipt invalid'
              )
          if (
              durable_history is None
              and nested_durable_history is not None
          ):
              raise SystemExit(
                  'Protected remediation nested durable history invalid'
              )
          if durable_history is True:
              if (
                  remediation_idempotent is not True
                  or replay_state != 'ACKNOWLEDGED'
                  or nested_durable_history is not True
              ):
                  raise SystemExit(
                      'Protected remediation durable history state invalid'
                  )
              # This workflow is the mutating recovery owner. A compact
              # receipt proves the incident was already consumed. The normal
              # v5 step must accept only its official-read-bound no-op path;
              # the protected handler durably fences every duplicate queue.
          if not remediation_idempotent and replay_state != 'QUEUED':
              raise SystemExit(
                  'New protected remediation did not remain exactly queued'
              )
          expected_completed = replay_state in COMPLETED_STATES
          expected_application = {
              'ok': True,
              'sport': event['sport'],
              'slateDateEt': event['slateDateEt'],
              'status': expected_status,
              'reason': expected_status,
              'skipped': True,
              'mutatingRunAttempted': False,
              'cooperativeTerminalReplayCompleted': expected_completed,
              'sourcePullRebindReviewRemediationApplied': True,
              'sourcePullRebindReviewRemediationVersion': (
                  REMEDIATION_VERSION
              ),
              'sourcePullRebindVersion': SOURCE_REBIND_VERSION,
          }
          mismatched = {
              key: application.get(key)
              for key, expected in expected_application.items()
              if (
                  application.get(key) is not expected
                  if isinstance(expected, bool)
                  else application.get(key) != expected
              )
          }
          unsafe = {
              key: application.get(key)
              for key in SAFETY_FIELDS
              if application.get(key) is not False
          }
          replay_unsafe = {
              key: replay.get(key)
              for key in SAFETY_FIELDS[:-1]
              if replay.get(key) is not False
          }
          if mismatched or unsafe or replay_unsafe:
              raise SystemExit('Protected remediation receipt failed validation')
          if (
              replay.get('slateDateEt') != event['slateDateEt']
              or replay.get('automaticExecutionOwner')
              != 'eventbridge_daily_lock_schedule'
              or replay.get('ownerIdentifierExposed') is not False
              or replay.get('failClosed') is not True
          ):
              raise SystemExit('Protected remediation authority invalid')

          receipt: dict[str, Any] = {
              'ok': True,
              'proofType': (
                  'MLB_PROTECTED_SOURCE_PULL_REBIND_REVIEW_REMEDIATION'
              ),
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'logicalResourceId': LOGICAL_RESOURCE_ID,
              'resolvedFunctionName': function_name,
              'resolvedFunctionHandler': configuration.get('Handler'),
              'lambdaStatusCode': lambda_status,
              'applicationStatusCode': application_status,
              'request': dict(event),
              'application': {
                  **expected_application,
                  'sourcePullRebindReviewRemediationIdempotent': (
                      remediation_idempotent
                  ),
                  'sourcePullRebindReviewRemediationDurableHistory': (
                      durable_history is True
                  ),
                  **{key: False for key in SAFETY_FIELDS},
                  'cooperativeTerminalReplay': {
                      'state': replay.get('state'),
                      'slateDateEt': replay.get('slateDateEt'),
                      'automaticExecutionOwner': replay.get(
                          'automaticExecutionOwner'
                      ),
                      'ownerIdentifierExposed': False,
                      'activeLeaseMutationAllowed': False,
                      'postStartPredictionCreationAllowed': False,
                      'immutablePredictionRewriteAllowed': False,
                      'directWorkflowTableWrite': False,
                      'durableRemediationHistory': (
                          nested_durable_history is True
                      ),
                      'failClosed': True,
                  },
              },
              'rawLambdaPayloadPersisted': False,
              'requestIdentifierExposed': False,
              'checkpointMaterialExposed': False,
              'automaticRequeueAllowed': False,
          }
          forbidden_receipt_keys = {
              'requestId',
              'request_id',
              'requestedAtEpoch',
              'requested_at_epoch',
              'checkpointFingerprint',
              'terminalChunkProgress',
              'lastAttempt',
              'claimOwner',
              'claim_owner',
          }

          def keys(value: Any) -> set[str]:
              if isinstance(value, Mapping):
                  return {
                      str(key)
                      for key in value
                  } | set().union(*(keys(child) for child in value.values()))
              if isinstance(value, list):
                  return set().union(*(keys(child) for child in value))
              return set()

          if keys(receipt) & forbidden_receipt_keys:
              raise SystemExit('Protected remediation artifact was not redacted')
          output = Path(
              '/tmp/unified-mlb-recovery/'
              'source-pull-rebind-review-remediation.json'
          )
          output.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Requeue protected prelock review after installed-runtime proof v2
        if: ${{ inputs.requeue_prelock_candidate_review_after_installed_runtime_proof_v2 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any, Mapping

          import boto3
          from botocore.config import Config

          LOGICAL_RESOURCE_ID = 'MLBDailyPickLockFunction'
          EXPECTED_HANDLER = 'mlb_daily_pick_lock_protected.lambda_handler'
          EXPECTED_RUN = 'prospective_terminal_backlog_reconciliation_v5'
          EVENT_FLAG = (
              'requeuePrelockCandidateReviewAfterInstalledRuntimeProofV2'
          )
          INCIDENT_SLATE_DATE = '2026-08-04'
          REMEDIATION_VERSION = (
              'MLB-COOPERATIVE-PRELOCK-CANDIDATE-REVIEW-REMEDIATION-'
              'v2-one-shot-installed-runtime-proof'
          )
          EXPECTED_STATUS_BY_STATE = {
              'QUEUED': 'QUEUED_FOR_EVENTBRIDGE_LOCK_OWNER',
              'CLAIMED': 'CLAIMED_BY_EVENTBRIDGE_LOCK_OWNER',
              'COMPLETED': 'COMPLETED_BY_EVENTBRIDGE_LOCK_OWNER',
              'ACKNOWLEDGED': 'ACKNOWLEDGED_COMPLETION',
          }
          COMPLETED_STATES = {'COMPLETED', 'ACKNOWLEDGED'}
          SAFETY_FIELDS = (
              'activeLeaseMutationAllowed',
              'postStartPredictionCreationAllowed',
              'immutablePredictionRewriteAllowed',
              'directWorkflowTableWrite',
              'productionAuthorityChanged',
          )

          repository = os.environ['GITHUB_REPOSITORY']
          commit_sha = os.environ['GITHUB_SHA']
          github_ref = os.environ['GITHUB_REF']
          github_token = os.environ['GH_TOKEN']
          if github_ref != 'refs/heads/main' or not commit_sha:
              raise SystemExit(
                  'Protected v2 requires an exact main-branch commit'
              )
          github_headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {github_token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          deploy_runs_url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              'deploy.yml/runs?branch=main&per_page=100'
          )
          main_ref_url = (
              f'https://api.github.com/repos/{repository}/git/ref/heads/main'
          )

          def github_json(url):
              request = urllib.request.Request(
                  url,
                  headers=github_headers,
              )
              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30,
                  ) as response:
                      value = json.load(response)
              except Exception as exc:
                  raise SystemExit(
                      'Protected v2 deploy attestation read failed'
                  ) from exc
              if not isinstance(value, Mapping):
                  raise SystemExit(
                      'Protected v2 deploy attestation was invalid'
                  )
              return value

          def latest_exact_deploy():
              main_ref = github_json(main_ref_url)
              main_object = main_ref.get('object') or {}
              if (
                  not isinstance(main_object, Mapping)
                  or main_object.get('sha') != commit_sha
              ):
                  raise SystemExit(
                      'Protected v2 main ref no longer matches the run'
                  )
              deploy_payload = github_json(deploy_runs_url)
              deploy_runs = deploy_payload.get('workflow_runs') or []
              latest = deploy_runs[0] if deploy_runs else None
              if (
                  not isinstance(latest, Mapping)
                  or latest.get('head_sha') != commit_sha
                  or latest.get('head_branch') != 'main'
                  or latest.get('status') != 'completed'
                  or latest.get('conclusion') != 'success'
              ):
                  raise SystemExit(
                      'Protected v2 latest main deploy is not exact and successful'
                  )
              return dict(latest)

          pinned_deploy = latest_exact_deploy()
          try:
              pinned_deploy_id = int(pinned_deploy['id'])
              pinned_deploy_attempt = int(
                  pinned_deploy.get('run_attempt') or 1
              )
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit(
                  'Protected v2 deploy run identity is invalid'
              ) from exc
          if pinned_deploy_id <= 0 or pinned_deploy_attempt <= 0:
              raise SystemExit(
                  'Protected v2 deploy run identity is invalid'
              )
          expected_deploy_run_id = (
              f'{pinned_deploy_id}-{pinned_deploy_attempt}'
          )

          region = os.environ['AWS_REGION']
          stack_name = os.environ['MLB_ROOT_STACK']
          repair_slate = os.environ['REPAIR_SLATE_DATE']
          if repair_slate != INCIDENT_SLATE_DATE:
              raise SystemExit('Protected v2 incident slate is not exact')
          event = {
              'sport': 'mlb',
              'run': EXPECTED_RUN,
              'slateDateEt': repair_slate,
              'force': True,
              EVENT_FLAG: True,
          }
          if set(event) != {
              'sport',
              'run',
              'slateDateEt',
              'force',
              EVENT_FLAG,
          }:
              raise SystemExit('Protected v2 event is not exact')

          cloudformation = boto3.client(
              'cloudformation',
              region_name=region,
              config=Config(
                  connect_timeout=10,
                  read_timeout=120,
                  retries={'total_max_attempts': 3, 'mode': 'standard'},
              ),
          )
          stacks = cloudformation.describe_stacks(
              StackName=stack_name,
          ).get('Stacks') or []
          stack = stacks[0] if len(stacks) == 1 else None
          parameters = {
              str(parameter.get('ParameterKey') or ''): str(
                  parameter.get('ParameterValue') or ''
              )
              for parameter in (
                  stack.get('Parameters') or []
                  if isinstance(stack, Mapping)
                  else []
              )
              if isinstance(parameter, Mapping)
          }
          if (
              not isinstance(stack, Mapping)
              or stack.get('StackStatus')
              not in {'CREATE_COMPLETE', 'UPDATE_COMPLETE'}
              or parameters.get('DeployGitSha') != commit_sha
              or parameters.get('DeployRunId')
              != expected_deploy_run_id
          ):
              raise SystemExit(
                  'Protected v2 stack deployment identity is not exact'
              )

          resource = cloudformation.describe_stack_resource(
              StackName=stack_name,
              LogicalResourceId=LOGICAL_RESOURCE_ID,
          ).get('StackResourceDetail') or {}
          function_name = str(resource.get('PhysicalResourceId') or '')
          if (
              not function_name
              or resource.get('LogicalResourceId') != LOGICAL_RESOURCE_ID
              or resource.get('ResourceType') != 'AWS::Lambda::Function'
          ):
              raise SystemExit('Protected lock Lambda resolution failed closed')

          lambda_client = boto3.client(
              'lambda',
              region_name=region,
              config=Config(
                  connect_timeout=10,
                  read_timeout=900,
                  retries={'total_max_attempts': 1, 'mode': 'standard'},
              ),
          )
          configuration = lambda_client.get_function_configuration(
              FunctionName=function_name,
          )
          pinned_revision_id = str(configuration.get('RevisionId') or '')
          pinned_code_sha256 = str(configuration.get('CodeSha256') or '')
          if (
              configuration.get('FunctionName') != function_name
              or configuration.get('Handler') != EXPECTED_HANDLER
              or configuration.get('State') != 'Active'
              or configuration.get('LastUpdateStatus') != 'Successful'
              or not pinned_revision_id
              or not pinned_code_sha256
          ):
              raise SystemExit('Resolved protected lock Lambda is not ready')

          invocation_configuration = (
              lambda_client.get_function_configuration(
                  FunctionName=function_name,
              )
          )
          pinned_fields = {
              'FunctionName': function_name,
              'Handler': EXPECTED_HANDLER,
              'State': 'Active',
              'LastUpdateStatus': 'Successful',
              'RevisionId': pinned_revision_id,
              'CodeSha256': pinned_code_sha256,
          }
          if any(
              invocation_configuration.get(key) != expected_value
              for key, expected_value in pinned_fields.items()
          ):
              raise SystemExit(
                  'Protected lock Lambda identity changed before invocation'
              )

          invocation = lambda_client.invoke(
              FunctionName=function_name,
              InvocationType='RequestResponse',
              Payload=json.dumps(
                  event,
                  sort_keys=True,
                  separators=(',', ':'),
              ).encode('utf-8'),
          )
          lambda_status = int(invocation.get('StatusCode') or 0)
          raw = invocation['Payload'].read()
          if lambda_status != 200 or invocation.get('FunctionError'):
              raise SystemExit('Protected v2 Lambda invocation failed closed')
          try:
              envelope = json.loads(raw.decode('utf-8'))
              application_status = int(envelope.get('statusCode'))
              body = envelope.get('body')
              application = (
                  json.loads(body) if isinstance(body, str) else body
              )
          except (
              AttributeError,
              TypeError,
              ValueError,
              UnicodeDecodeError,
              json.JSONDecodeError,
          ) as exc:
              raise SystemExit(
                  'Protected v2 Lambda response was invalid'
              ) from exc
          if application_status != 200 or not isinstance(application, Mapping):
              raise SystemExit('Protected v2 application failed closed')

          replay = application.get('cooperativeTerminalReplay')
          if not isinstance(replay, Mapping):
              raise SystemExit('Protected v2 replay receipt missing')
          replay_state = str(replay.get('state') or '')
          expected_status = EXPECTED_STATUS_BY_STATE.get(replay_state)
          idempotent = application.get(
              'prelockCandidateReviewV2RemediationIdempotent'
          )
          durable_history = application.get(
              'prelockCandidateReviewV2DurableHistory'
          )
          nested_durable_history = replay.get(
              'durableRemediationHistory'
          )
          if (
              expected_status is None
              or not isinstance(idempotent, bool)
              or (
                  durable_history is not None
                  and durable_history is not True
              )
              or (
                  durable_history is None
                  and nested_durable_history is not None
              )
              or (
                  durable_history is True
                  and (
                      idempotent is not True
                      or replay_state != 'ACKNOWLEDGED'
                      or nested_durable_history is not True
                  )
              )
              or (not idempotent and replay_state != 'QUEUED')
          ):
              raise SystemExit('Protected v2 state receipt invalid')

          expected = {
              'ok': True,
              'sport': 'mlb',
              'slateDateEt': INCIDENT_SLATE_DATE,
              'status': expected_status,
              'reason': expected_status,
              'skipped': True,
              'mutatingRunAttempted': False,
              'cooperativeTerminalReplayCompleted': (
                  replay_state in COMPLETED_STATES
              ),
              'prelockCandidateReviewV2RemediationApplied': True,
              'prelockCandidateReviewV2RemediationVersion': (
                  REMEDIATION_VERSION
              ),
              'installedRuntimePositiveProofBound': True,
              'priorSourcePullRebindRemediationValidated': True,
              'automaticRetryAllowed': False,
          }
          mismatched = {
              key: application.get(key)
              for key, expected_value in expected.items()
              if (
                  application.get(key) is not expected_value
                  if isinstance(expected_value, bool)
                  else application.get(key) != expected_value
              )
          }
          unsafe = {
              key: application.get(key)
              for key in SAFETY_FIELDS
              if application.get(key) is not False
          }
          replay_unsafe = {
              key: replay.get(key)
              for key in SAFETY_FIELDS[:-1]
              if replay.get(key) is not False
          }
          if (
              mismatched
              or unsafe
              or replay_unsafe
              or replay.get('slateDateEt') != INCIDENT_SLATE_DATE
              or replay.get('automaticExecutionOwner')
              != 'eventbridge_daily_lock_schedule'
              or replay.get('ownerIdentifierExposed') is not False
              or replay.get('failClosed') is not True
          ):
              raise SystemExit('Protected v2 authority receipt invalid')

          receipt: dict[str, Any] = {
              'ok': True,
              'proofType': (
                  'MLB_PROTECTED_PRELOCK_CANDIDATE_REVIEW_REMEDIATION_V2'
              ),
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'logicalResourceId': LOGICAL_RESOURCE_ID,
              'resolvedFunctionName': function_name,
              'resolvedFunctionHandler': configuration.get('Handler'),
              'resolvedFunctionRevisionId': pinned_revision_id,
              'resolvedFunctionCodeSha256': pinned_code_sha256,
              'sameCommitDeploySuccessRequired': True,
              'deployedCommitSha': commit_sha,
              'lambdaStatusCode': lambda_status,
              'applicationStatusCode': application_status,
              'request': dict(event),
              'application': {
                  **expected,
                  'prelockCandidateReviewV2RemediationIdempotent': (
                      idempotent
                  ),
                  'prelockCandidateReviewV2DurableHistory': (
                      durable_history is True
                  ),
                  **{key: False for key in SAFETY_FIELDS},
                  'cooperativeTerminalReplay': {
                      'state': replay_state,
                      'slateDateEt': replay.get('slateDateEt'),
                      'automaticExecutionOwner': replay.get(
                          'automaticExecutionOwner'
                      ),
                      'ownerIdentifierExposed': False,
                      'activeLeaseMutationAllowed': False,
                      'postStartPredictionCreationAllowed': False,
                      'immutablePredictionRewriteAllowed': False,
                      'directWorkflowTableWrite': False,
                      'durableRemediationHistory': (
                          nested_durable_history is True
                      ),
                      'failClosed': True,
                  },
              },
              'rawLambdaPayloadPersisted': False,
              'requestIdentifierExposed': False,
              'checkpointMaterialExposed': False,
              'positiveProofMaterialExposed': False,
              'automaticRequeueAllowed': False,
          }
          forbidden = {
              'requestId',
              'request_id',
              'requestedAtEpoch',
              'requested_at_epoch',
              'checkpointFingerprint',
              'progressFingerprint',
              'positiveProof',
              'terminalChunkProgress',
              'lastAttempt',
              'claimOwner',
              'claim_owner',
          }

          def keys(value: Any) -> set[str]:
              if isinstance(value, Mapping):
                  return {
                      str(key)
                      for key in value
                  } | set().union(*(keys(child) for child in value.values()))
              if isinstance(value, list):
                  return set().union(*(keys(child) for child in value))
              return set()

          if keys(receipt) & forbidden:
              raise SystemExit('Protected v2 artifact was not redacted')
          output = Path(
              '/tmp/unified-mlb-recovery/'
              'prelock-candidate-review-remediation-v2.json'
          )
          output.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

