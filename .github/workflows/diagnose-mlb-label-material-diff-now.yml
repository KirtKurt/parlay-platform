name: Diagnose MLB label material diff now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-label-material-diff-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-mlb-label-material-diff-now
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SNAPSHOTS_TABLE: parlay_platform_snapshots
  OUTCOMES_TABLE: parlay_platform_outcomes
  SLATE_DATE_ET: '2026-08-03'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Compare immutable stored label with current proposal
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'requests>=2.31,<3'
          mkdir -p runtime_reports
          PYTHONPATH=hello_world python - <<'PY'
          import copy
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import mlb_canonical_final_labels_v1 as labels

          slate=os.environ['SLATE_DATE_ET']
          locks,rejected=labels._validated_canonical_locks(slate)
          lock_by_pk,duplicates=labels._lock_index(locks)
          official=labels.fetch_official_schedule(slate)
          comparisons=[]
          for final in official.get('games') or []:
              game_pk=str(final.get('officialGamePk') or '')
              locked=lock_by_pk.get(game_pk)
              if not locked or final.get('completed') is not True:
                  continue
              proposed=labels._build_label(
                  slate,
                  final,
                  locked,
                  datetime.now(timezone.utc).isoformat(),
              )
              key=labels._label_key(slate, game_pk)
              existing=labels.outcomes_tbl.get_item(Key=key, ConsistentRead=True).get('Item')
              if not isinstance(existing,dict):
                  comparisons.append({'officialGamePk':game_pk,'existingMissing':True})
                  continue
              existing_material=labels._plain(labels._settlement_material(existing))
              proposed_material=labels._plain(labels._settlement_material(proposed))
              differing={}
              for field in sorted(set(existing_material)|set(proposed_material)):
                  old=existing_material.get(field)
                  new=proposed_material.get(field)
                  if old != new:
                      differing[field]={'stored':old,'proposed':new}
              comparisons.append({
                  'officialGamePk':game_pk,
                  'existingLabelValid':not labels._label_record_errors(existing,slate,game_pk),
                  'existingLabelErrors':labels._label_record_errors(existing,slate,game_pk),
                  'storedSettlementFingerprint':existing.get('settlement_fingerprint'),
                  'proposedSettlementFingerprint':proposed.get('settlement_fingerprint'),
                  'sameSettlementMaterial':not differing,
                  'differingFields':differing,
              })
          report={
              'proofType':'MLB_CANONICAL_LABEL_MATERIAL_DIFF_DIAGNOSTIC',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'slateDateEt':slate,
              'officialGameCount':official.get('officialGameCount'),
              'canonicalLockCount':len(lock_by_pk),
              'rejectedCanonicalLocks':rejected+duplicates,
              'comparisons':comparisons,
              'conflictCount':sum(not row.get('sameSettlementMaterial',False) for row in comparisons),
              'directTableWrite':False,
              'immutablePredictionRewriteAllowed':False,
              'postStartPredictionCreationAllowed':False,
              'secretExposed':False,
          }
          report['ok']=not report['rejectedCanonicalLocks'] and all(row.get('existingLabelValid') is True for row in comparisons)
          Path('runtime_reports/mlb_label_material_diff_latest.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          PY
      - name: Publish read-only diff
        run: |
          set -euo pipefail
          cp runtime_reports/mlb_label_material_diff_latest.json /tmp/mlb-label-material-diff.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-label-material-diff-proof origin/main
            cp /tmp/mlb-label-material-diff.json runtime_reports/mlb_label_material_diff_latest.json
            git add runtime_reports/mlb_label_material_diff_latest.json
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB label material diff [skip ci]'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

