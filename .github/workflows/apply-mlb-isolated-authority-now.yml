name: Apply MLB isolated authority now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mlb-isolated-authority-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-mlb-isolated-authority-now
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and compile repair
        run: |
          set -euo pipefail
          python scripts/repair_mlb_isolated_authority_boundary.py
          python -m py_compile scripts/verify_mlb_deploy_identity.py
          git diff --check
      - name: Publish repaired verifier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_mlb_deploy_identity.py
          if git diff --cached --quiet; then
            echo 'Verifier already repaired.'
            exit 0
          fi
          git commit -m 'Authorize isolated three-source MLB production boundary'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" != 5 || exit 1
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
