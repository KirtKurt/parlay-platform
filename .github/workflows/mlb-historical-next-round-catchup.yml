name: MLB Historical Next Round Catch-up

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-next-round-catchup.yml'
      - 'scripts/run_mlb_historical_next_round_catchup.py'
      - 'scripts/run_mlb_historical_watchdog.py'
      - 'mlb_historical_optimizer/template.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-historical-next-round-catchup
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_historical_next_round_catchup_latest.json
  PYTHONPATH: .

jobs:
  catch-up:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate readiness-aware catch-up contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile scripts/run_mlb_historical_watchdog.py scripts/run_mlb_historical_next_round_catchup.py
          python -m pytest -q tests/unit/test_run_mlb_historical_watchdog.py tests/unit/test_run_mlb_historical_next_round_catchup.py

      - name: Repair historical Lambda provider credential drift without changing model authority
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}"
          python - <<'PY'
          import hashlib,json,os
          import boto3
          region=os.environ['AWS_REGION_VALUE']; stack=os.environ['STACK_NAME']; desired=os.environ['ODDS_API_KEY_VALUE']
          cf=boto3.client('cloudformation',region_name=region); lam=boto3.client('lambda',region_name=region)
          outputs={x['OutputKey']:x['OutputValue'] for x in cf.describe_stacks(StackName=stack)['Stacks'][0].get('Outputs',[])}
          fn=outputs.get('HistoricalOptimizerFunctionName')
          if not fn: raise SystemExit('HistoricalOptimizerFunctionName output missing')
          cfg=lam.get_function_configuration(FunctionName=fn)
          if cfg.get('Handler')!='mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler': raise SystemExit(f"unexpected handler: {cfg.get('Handler')}")
          env=dict((cfg.get('Environment') or {}).get('Variables') or {}); current=env.get('ODDS_API_KEY',''); changed=current!=desired
          before=hashlib.sha256(current.encode()).hexdigest()[:12] if current else None; after=hashlib.sha256(desired.encode()).hexdigest()[:12]
          if changed:
              env['ODDS_API_KEY']=desired
              lam.update_function_configuration(FunctionName=fn,Environment={'Variables':env})
              lam.get_waiter('function_updated_v2').wait(FunctionName=fn,WaiterConfig={'Delay':2,'MaxAttempts':120})
          final=((lam.get_function_configuration(FunctionName=fn).get('Environment') or {}).get('Variables') or {}).get('ODDS_API_KEY','')
          if final!=desired: raise SystemExit('historical Lambda ODDS_API_KEY did not converge to current secret')
          print(json.dumps({'functionName':fn,'credentialChanged':changed,'previousFingerprint':before,'currentFingerprint':after,'productionAuthorityChanged':False},sort_keys=True))
          PY

      - name: Prove provider quota from installed credential
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          url='https://api.the-odds-api.com/v4/sports?'+urllib.parse.urlencode({'apiKey':os.environ['ODDS_API_KEY_VALUE']})
          with urllib.request.urlopen(urllib.request.Request(url,headers={'user-agent':'inqsi-mlb-history-key-proof/1.0'}),timeout=30) as r:
              r.read()
              def n(k):
                  v=r.headers.get(k)
                  try:return int(v) if v is not None else None
                  except:return v
              q={'remaining':n('x-requests-remaining'),'used':n('x-requests-used'),'last':n('x-requests-last')}
          print(json.dumps(q,sort_keys=True))
          if not isinstance(q.get('remaining'),int) or q['remaining']<=100: raise SystemExit(f'provider quota unavailable: {q}')
          PY

      - name: Advance only when the canonical next round is ready
        id: catchup
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          EXPECTED_MAX_CREDITS="$(python - <<'PY'
          import os
          import boto3
          region=os.environ['AWS_REGION_VALUE']; stack=os.environ['STACK_NAME']
          cf=boto3.client('cloudformation',region_name=region); lam=boto3.client('lambda',region_name=region)
          outputs={x['OutputKey']:x['OutputValue'] for x in cf.describe_stacks(StackName=stack)['Stacks'][0].get('Outputs',[])}
          fn=outputs.get('HistoricalOptimizerFunctionName')
          if not fn: raise SystemExit('HistoricalOptimizerFunctionName output missing')
          env=((lam.get_function_configuration(FunctionName=fn).get('Environment') or {}).get('Variables') or {})
          value=str(env.get('MLB_HISTORICAL_MAX_CREDITS') or '').strip()
          if not value.isdigit() or int(value) < 1000: raise SystemExit(f'invalid deployed MLB_HISTORICAL_MAX_CREDITS:{value!r}')
          print(value)
          PY
          )"
          echo "Using deployed historical credit budget: ${EXPECTED_MAX_CREDITS}"
          python scripts/run_mlb_historical_next_round_catchup.py --region "$AWS_REGION_VALUE" --stack-name "$STACK_NAME" --expected-handler mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler --expected-max-credits "$EXPECTED_MAX_CREDITS" --template mlb_historical_optimizer/template.yaml --max-attempts 8 --output "$REPORT_PATH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-historical-next-round-catchup-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          retention-days: 30
          if-no-files-found: warn

      - name: Publish the exact catch-up proof safely
        if: always() && hashFiles('runtime_reports/mlb_historical_next_round_catchup_latest.json') != ''
        run: |
          set -euo pipefail
          cp "$REPORT_PATH" /tmp/mlb-historical-next-round-catchup.json
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git checkout -B historical-next-round-proof origin/main; mkdir -p "$(dirname "$REPORT_PATH")"; cp /tmp/mlb-historical-next-round-catchup.json "$REPORT_PATH"; git add "$REPORT_PATH"
            if git diff --cached --quiet; then published=true; break; fi
            git commit -m "chore: publish MLB historical next-round proof [skip ci]"
            if git push origin HEAD:main; then published=true; break; fi
            sleep $((attempt*3))
          done
          test "$published" = true || exit 1

      - name: Fail closed on a real catch-up blocker
        if: steps.catchup.outcome == 'failure'
        run: |
          cat "$REPORT_PATH" || true
          exit 1
