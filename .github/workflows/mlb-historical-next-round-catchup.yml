name: MLB Historical Next Round Catch-up

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-next-round-catchup.yml'
      - 'scripts/run_mlb_historical_next_round_catchup.py'
      - 'scripts/run_mlb_historical_watchdog.py'
      - 'mlb_historical_optimizer/template.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-historical-next-round-catchup
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_historical_next_round_catchup_latest.json
  PYTHONPATH: .

jobs:
  catch-up:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate readiness-aware catch-up contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            scripts/run_mlb_historical_watchdog.py \
            scripts/run_mlb_historical_next_round_catchup.py
          python -m pytest -q \
            tests/unit/test_run_mlb_historical_watchdog.py \
            tests/unit/test_run_mlb_historical_next_round_catchup.py

      - name: Advance only when the canonical next round is ready
        id: catchup
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python scripts/run_mlb_historical_next_round_catchup.py \
            --region "$AWS_REGION_VALUE" \
            --stack-name "$STACK_NAME" \
            --expected-handler mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler \
            --expected-max-credits 300000 \
            --template mlb_historical_optimizer/template.yaml \
            --max-attempts 4 \
            --output "$REPORT_PATH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-historical-next-round-catchup-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          retention-days: 30
          if-no-files-found: warn

      - name: Publish the exact catch-up proof safely
        if: always() && hashFiles('runtime_reports/mlb_historical_next_round_catchup_latest.json') != ''
        run: |
          set -euo pipefail
          cp "$REPORT_PATH" /tmp/mlb-historical-next-round-catchup.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B historical-next-round-proof origin/main
            mkdir -p "$(dirname "$REPORT_PATH")"
            cp /tmp/mlb-historical-next-round-catchup.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            if git diff --cached --quiet; then
              published=true
              break
            fi
            git commit -m "chore: publish MLB historical next-round proof [skip ci]"
            if git push origin HEAD:main; then
              published=true
              break
            fi
            sleep $((attempt * 3))
          done
          test "$published" = true || {
            echo '::error::Unable to publish MLB historical next-round proof after bounded retries.'
            exit 1
          }

      - name: Fail closed on a real catch-up blocker
        if: steps.catchup.outcome == 'failure'
        run: |
          cat "$REPORT_PATH" || true
          exit 1
