name: Trigger Tennis Autonomy Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-tennis-autonomy-refresh.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch permanent tennis autonomy publisher
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/publish-tennis-autonomy-status.yml/dispatches" \
            -d '{"ref":"main"}'
