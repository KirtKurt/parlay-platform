name: MLB Auto postcutoff smoke repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-auto-postcutoff-smoke-once.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch fail-closed MLB Auto smoke acceptance
        env:
          OLD_STATUS_B64: 
          NEW_STATUS_B64: 
          OLD_FIELDS_B64: 
          NEW_FIELDS_B64: 
          OLD_OK_B64: 
          NEW_OK_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path=Path('.github/workflows/deploy-mlb-auto-llm.yml')
          text=path.read_text(encoding='utf-8')
          pairs=[
              ('OLD_STATUS_B64','NEW_STATUS_B64'),
              ('OLD_FIELDS_B64','NEW_FIELDS_B64'),
              ('OLD_OK_B64','NEW_OK_B64'),
          ]
          for old_name,new_name in pairs:
              old=base64.b64decode(os.environ[old_name]).decode()
              new=base64.b64decode(os.environ[new_name]).decode()
              if old not in text:
                  raise SystemExit(f'{old_name} target not found; refusing broad edit')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
          python -m pip install --quiet 'PyYAML>=6,<7'
          python - <<'PY'
          import yaml
          from pathlib import Path
          text=Path('.github/workflows/deploy-mlb-auto-llm.yml').read_text(encoding='utf-8')
          yaml.safe_load(text)
          assert "'COLLECTING'" in text
          assert "latePublicationPrevented" in text
          assert "postStartPredictionCreationAllowed" in text
          assert "postStartOddsFabricationAllowed" in text
          assert "body['bedrockSmoke']['ok'] is True" in text
          assert "body['publicStatus']['fullyAutonomous'] is True" in text
          PY
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/deploy-mlb-auto-llm.yml'
      - name: Commit MLB-only repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-mlb-auto-llm.yml
          git commit -m 'Accept fail-closed MLB Auto post-cutoff smoke'
          git pull --rebase origin main
          git push origin HEAD:main
