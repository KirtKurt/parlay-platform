name: MLB V8 Historical BBD Prior-Game Backfill

"on":
  workflow_dispatch:
    inputs:
      batch_size:
        description: Maximum supported canonical games to attempt in this run
        required: true
        default: '100'
        type: choice
        options: ['25', '50', '100', '200']
  schedule:
    - cron: '37 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'hello_world/bigballsdata_client.py'
      - 'hello_world/mlb_v8_historical_bbs_overlay_v1.py'
      - 'hello_world/mlb_v8_historical_bbs_prior_game_v1.py'
      - 'hello_world/mlb_v8_historical_bbs_prior_game_features_v1.py'
      - 'hello_world/mlb_supervised_daily_objective_v2_1.py'
      - 'scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py'
      - 'tests/unit/test_bigballsdata_historical_as_of.py'
      - 'tests/unit/test_mlb_v8_historical_bbs_overlay_v1.py'
      - 'tests/unit/test_mlb_v8_historical_bbs_prior_game_v1.py'
      - 'tests/unit/test_mlb_v8_historical_bbs_prior_game_features_v1.py'
      - 'tests/unit/test_run_mlb_v8_historical_bbs_prior_game_backfill.py'
      - 'tests/unit/test_mlb_supervised_daily_objective_bbs_overlay.py'
      - '.github/workflows/mlb-v8-historical-bbs-backfill.yml'
  pull_request:
    paths:
      - 'hello_world/bigballsdata_client.py'
      - 'hello_world/mlb_v8_historical_bbs_overlay_v1.py'
      - 'hello_world/mlb_v8_historical_bbs_prior_game_v1.py'
      - 'hello_world/mlb_v8_historical_bbs_prior_game_features_v1.py'
      - 'hello_world/mlb_supervised_daily_objective_v2_1.py'
      - 'scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py'
      - 'tests/unit/test_bigballsdata_historical_as_of.py'
      - 'tests/unit/test_mlb_v8_historical_bbs_overlay_v1.py'
      - 'tests/unit/test_mlb_v8_historical_bbs_prior_game_v1.py'
      - 'tests/unit/test_mlb_v8_historical_bbs_prior_game_features_v1.py'
      - 'tests/unit/test_run_mlb_v8_historical_bbs_prior_game_backfill.py'
      - 'tests/unit/test_mlb_supervised_daily_objective_bbs_overlay.py'
      - '.github/workflows/mlb-v8-historical-bbs-backfill.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v8-historical-bbd-prior-game-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

env:
  REPORT_PATH: runtime_reports/mlb_v8_historical_bbs_backfill_latest.json
  HISTORICAL_STACK: parlay-platform-mlb-historical-optimizer
  TABLE_NAME: parlay_platform_snapshots
  PYTHONPATH: .:hello_world:scripts

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and test leakage-safe historical BBD learning
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            hello_world/bigballsdata_client.py \
            hello_world/mlb_v8_historical_bbs_overlay_v1.py \
            hello_world/mlb_v8_historical_bbs_prior_game_v1.py \
            hello_world/mlb_v8_historical_bbs_prior_game_features_v1.py \
            hello_world/mlb_supervised_daily_objective_v2_1.py \
            scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py
          python -m pytest -q --tb=short \
            tests/unit/test_bigballsdata_client.py \
            tests/unit/test_bigballsdata_historical_as_of.py \
            tests/unit/test_mlb_v8_historical_bbs_overlay_v1.py \
            tests/unit/test_mlb_v8_historical_bbs_prior_game_v1.py \
            tests/unit/test_mlb_v8_historical_bbs_prior_game_features_v1.py \
            tests/unit/test_run_mlb_v8_historical_bbs_prior_game_backfill.py \
            tests/unit/test_mlb_supervised_daily_objective_bbs_overlay.py
          grep -Fq 'selectionUsedOutcomes": False' scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py
          grep -Fq 'targetGameOutcomeUsed": False' scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py
          grep -Fq 'sameDayResultsExcluded": True' scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py
          grep -Fq 'productionAuthorityChanged": False' scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py

  backfill:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backfill runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run bounded historical BBD prior-game enrichment
        id: enrichment
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
          BBS_API_SECRET_ARN: ${{ secrets.BBS_API_SECRET_ARN }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '100' }}
        run: |
          set -o pipefail
          if test -z "${BBS_API_KEY:-}" && test -z "${BBS_API_SECRET_ARN:-}"; then
            echo 'BBD credential is not configured'
            exit 1
          fi
          mkdir -p runtime_reports
          rm -f "$REPORT_PATH" /tmp/mlb-v8-historical-bbd-prior-game.log
          python scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py \
            --region "$AWS_REGION_VALUE" \
            --table-name "$TABLE_NAME" \
            --historical-stack "$HISTORICAL_STACK" \
            --batch-size "$BATCH_SIZE" \
            --history-days 45 \
            --coverage-start 2026-03-01 \
            --start-tolerance-minutes 5 \
            --output "$REPORT_PATH" \
            2>&1 | tee /tmp/mlb-v8-historical-bbd-prior-game.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure exact durable BBD evidence exists
        if: always()
        env:
          ENRICHMENT_OUTCOME: ${{ steps.enrichment.outcome }}
          ENRICHMENT_EXIT_CODE: ${{ steps.enrichment.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-v8-historical-bbd-prior-game.log').read_text(errors='replace')[-16000:] if Path('/tmp/mlb-v8-historical-bbd-prior-game.log').exists() else ''
          report={
              'proofType':'MLB_V8_HISTORICAL_BBS_PRIOR_GAME_BACKFILL',
              'version':'MLB-V8-HISTORICAL-BBS-PRIOR-GAME-BACKFILL-v1',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'authority':'V8_HISTORICAL_BBS_SHADOW_ONLY',
              'productionAuthorityChanged':False,
              'automaticWagerAllowed':False,
              'selectionUsedOutcomes':False,
              'targetGameOutcomeUsed':False,
              'sameDayResultsExcluded':True,
              'pointInTimeRequired':True,
              'enrichmentOutcome':os.environ.get('ENRICHMENT_OUTCOME'),
              'enrichmentExitCode':os.environ.get('ENRICHMENT_EXIT_CODE'),
              'errorLogTail':log,
              'blockers':['historical_bbd_prior_game_backfill_failed_before_report'],
              'ok':False,
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null
          cp "$REPORT_PATH" /tmp/mlb-v8-historical-bbd-prior-game-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v8-historical-bbd-prior-game-${{ github.run_id }}
          path: |
            /tmp/mlb-v8-historical-bbd-prior-game-report.json
            /tmp/mlb-v8-historical-bbd-prior-game.log
          retention-days: 90
          if-no-files-found: error

      - name: Publish latest historical BBD evidence monotonically
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v8-historical-bbd-prior-proof origin/main
            mkdir -p runtime_reports
            python scripts/publish_monotonic_json.py \
              --candidate /tmp/mlb-v8-historical-bbd-prior-game-report.json \
              --existing "$REPORT_PATH" \
              --output "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V8 historical BBD prior-game learning evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce historical BBD learning and shadow safety
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/mlb-v8-historical-bbd-prior-game-report.json').read_text())
          assert value.get('authority') == 'V8_HISTORICAL_BBS_SHADOW_ONLY', value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('automaticWagerAllowed') is False, value
          assert value.get('selectionUsedOutcomes') is False, value
          assert value.get('targetGameOutcomeUsed') is False, value
          assert value.get('sameDayResultsExcluded') is True, value
          assert value.get('pointInTimeRequired') is True, value
          assert value.get('ok') is True, value
          assert not value.get('blockers'), value
          assert int(value.get('newEligibleGameCount') or 0) > 0, value
          assert int(value.get('eligibleGameCount') or 0) > 0, value
          assert int(value.get('activePointerRevision') or 0) > 0, value
          assert float(value.get('supportedTrainingCoverage') or 0.0) > 0.0, value
          PY
