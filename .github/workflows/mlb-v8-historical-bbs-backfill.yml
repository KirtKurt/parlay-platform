name: MLB V8 Historical BBD Prior-Game Backfill

"on":
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-historical-bbs-backfill.yml'
      - 'hello_world/mlb_no_bbd_context_bridge_v1.py'
      - 'hello_world/mlb_v8_historical_bbs_overlay_v1.py'
      - 'runtime_reports/mlb_v8_historical_bbs_backfill_latest.json'
  pull_request:
    paths:
      - '.github/workflows/mlb-v8-historical-bbs-backfill.yml'
      - 'hello_world/mlb_no_bbd_context_bridge_v1.py'
      - 'hello_world/mlb_v8_historical_bbs_overlay_v1.py'

permissions:
  contents: write

concurrency:
  group: mlb-v8-historical-bbd-provider-capability-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIOR_REPORT: runtime_reports/mlb_v8_historical_bbs_backfill_latest.json
  CAPABILITY_REPORT: runtime_reports/mlb_v8_bbd_provider_capability_latest.json
  PYTHONPATH: .:hello_world:scripts
  BBS_API_DISABLED: 'true'

jobs:
  monitor-provider-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate stored-manifest no-BBD mode
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            hello_world/mlb_no_bbd_context_bridge_v1.py \
            hello_world/mlb_v8_historical_bbs_overlay_v1.py
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_no_bbd_context_bridge_v1.py \
            tests/unit/test_mlb_v8_historical_bbs_overlay_v1.py

      - name: Publish explicit provider-unavailable capability state
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          prior_path=Path(os.environ['PRIOR_REPORT'])
          prior={}
          if prior_path.exists() and prior_path.stat().st_size:
              prior=json.loads(prior_path.read_text())
          eligible=int(prior.get('eligibleGameCount') or 0)
          remaining=int(prior.get('remainingSupportedGameCount') or 0)
          complete=bool(prior.get('ok') is True and eligible > 0 and remaining == 0)
          value={
              'ok':True,
              'proofType':'MLB_V8_BBD_PROVIDER_CAPABILITY',
              'version':'MLB-V8-BBD-PROVIDER-CAPABILITY-v1-explicit-unavailable',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),'runId':os.environ.get('GITHUB_RUN_ID'),
              'status':'STORED_SUPPORTED_COHORT_COMPLETE' if complete else 'LIVE_PROVIDER_UNAVAILABLE',
              'liveBbdApiAvailable':False,'liveBbdApiRequired':False,
              'liveBbdHttpRequestsMade':0,
              'storedManifestAvailable':eligible > 0,
              'storedCohortComplete':complete,
              'storedEligibleGameCount':eligible,
              'remainingSupportedGameCount':remaining,
              'trainerMayUseStoredManifest':eligible > 0,
              'newBackfillAttempted':False,
              'newEligibleGameCount':0,
              'providerUnavailabilityBlocksV7':False,
              'providerUnavailabilityBlocksV8':False,
              'providerUnavailabilityBlocksV9':False,
              'providerUnavailabilityBlocksV10':False,
              'officialPointInTimeContextIsPrimaryExpansionPath':True,
              'productionAuthorityChanged':False,
              'automaticWagerAllowed':False,
              'selectionUsedOutcomes':False,
              'blockers':[],
          }
          Path(os.environ['CAPABILITY_REPORT']).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
          python -m json.tool "$CAPABILITY_REPORT" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: mlb-v8-bbd-provider-capability-${{ github.run_id }}
          path: runtime_reports/mlb_v8_bbd_provider_capability_latest.json
          retention-days: 90
          if-no-files-found: error

      - name: Publish durable capability evidence
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cp "$CAPABILITY_REPORT" /tmp/mlb-v8-bbd-capability.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v8-bbd-capability-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-v8-bbd-capability.json "$CAPABILITY_REPORT"
            git add "$CAPABILITY_REPORT"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V8 BBD provider capability evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce non-blocking no-BBD contract
        run: |
          python - <<'PY'
          import json, os
          value=json.load(open(os.environ['CAPABILITY_REPORT']))
          assert value.get('ok') is True, value
          assert value.get('liveBbdApiAvailable') is False, value
          assert value.get('liveBbdApiRequired') is False, value
          assert int(value.get('liveBbdHttpRequestsMade') or 0) == 0, value
          assert value.get('officialPointInTimeContextIsPrimaryExpansionPath') is True, value
          assert value.get('providerUnavailabilityBlocksV7') is False, value
          assert value.get('providerUnavailabilityBlocksV8') is False, value
          assert value.get('providerUnavailabilityBlocksV9') is False, value
          assert value.get('providerUnavailabilityBlocksV10') is False, value
          assert value.get('productionAuthorityChanged') is False, value
          assert not value.get('blockers'), value
          PY
