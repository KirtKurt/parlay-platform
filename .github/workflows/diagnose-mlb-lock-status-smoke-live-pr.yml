name: Diagnose MLB lock-status smoke live PR
run-name: "Diagnose live MLB lock-status smoke PR #${{ github.run_number }}"

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-lock-status-smoke-live-pr.yml'
      - 'scripts/diagnose_mlb_lock_status_smoke_live.py'
      - 'scripts/mlb_deploy_cutoff_smoke_policy.py'

permissions:
  contents: read

concurrency:
  group: diagnose-mlb-lock-status-smoke-live-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install direct-invocation runtime
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3>=1.34,<2'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Warm cache and classify the exact live smoke contract
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          LOCK_FUNCTION=$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id MLBDailyPickLockFunction \
            --region "$AWS_REGION_VALUE" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name parlay-platform-dev \
            --region "$AWS_REGION_VALUE" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          test -n "$LOCK_FUNCTION"
          test "$LOCK_FUNCTION" != "None"
          test -n "$API_URL"
          test "$API_URL" != "None"

          python scripts/warm_and_verify_mlb_lock_status.py \
            --function-name "$LOCK_FUNCTION" \
            --region "$AWS_REGION_VALUE" \
            --output /tmp/mlb-lock-status-direct.json \
            --invocation-output /tmp/mlb-lock-status-direct-invocation.json \
            --attempts 2 \
            --delay-seconds 3

          python scripts/diagnose_mlb_lock_status_smoke_live.py \
            --api-url "$API_URL" \
            --source-sha "$GITHUB_SHA" \
            --output /tmp/mlb-lock-status-lifecycle.json

      - name: Upload read-only lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-lock-status-lifecycle-${{ github.run_id }}
          path: |
            /tmp/mlb-lock-status-direct.json
            /tmp/mlb-lock-status-direct-invocation.json
            /tmp/mlb-lock-status-lifecycle.json
          if-no-files-found: warn
          retention-days: 14
