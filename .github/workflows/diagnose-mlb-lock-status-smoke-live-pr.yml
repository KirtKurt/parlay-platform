name: Diagnose MLB lock-status smoke live PR
run-name: "Diagnose live MLB lock-status smoke PR #${{ github.run_number }}"

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-lock-status-smoke-live-pr.yml'
      - 'scripts/diagnose_mlb_lock_status_smoke_live.py'
      - 'scripts/mlb_deploy_cutoff_smoke_policy.py'
      - 'hello_world/mlb_daily_lock_status_route_patch.py'

permissions:
  contents: read

concurrency:
  group: diagnose-mlb-lock-status-smoke-live-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Invoke lock Lambda directly and retain authoritative payload
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          LOCK_FUNCTION=$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id MLBDailyPickLockFunction \
            --region "$AWS_REGION_VALUE" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$LOCK_FUNCTION"
          test "$LOCK_FUNCTION" != "None"
          python scripts/warm_and_verify_mlb_lock_status.py \
            --function-name "$LOCK_FUNCTION" \
            --region "$AWS_REGION_VALUE" \
            --output /tmp/mlb-lock-status-direct.json \
            --invocation-output /tmp/mlb-lock-status-direct-invocation.json \
            --attempts 2 \
            --delay-seconds 3

      - name: Measure cacheability and retry the public hot path once
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name parlay-platform-dev \
            --region "$AWS_REGION_VALUE" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          test -n "$API_URL"
          test "$API_URL" != "None"
          API_URL="$API_URL" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          from scripts.mlb_deploy_http_probe import fetch_json_object

          payload_path = Path('/tmp/mlb-lock-status-direct.json')
          invocation_path = Path('/tmp/mlb-lock-status-direct-invocation.json')
          payload = json.loads(payload_path.read_text(encoding='utf-8'))
          invocation = json.loads(invocation_path.read_text(encoding='utf-8'))

          def encoded_size(value):
              return len(json.dumps(value, sort_keys=True, separators=(',', ':'), default=str).encode('utf-8'))

          top_sizes = sorted(
              ((key, encoded_size(value)) for key, value in payload.items()),
              key=lambda item: item[1],
              reverse=True,
          )
          rows = [row for row in payload.get('perGameStatus') or [] if isinstance(row, dict)]
          row_sizes = [encoded_size(row) for row in rows]
          aggregate_field_sizes = Counter()
          field_presence = Counter()
          for row in rows:
              for key, value in row.items():
                  aggregate_field_sizes[key] += encoded_size(value)
                  field_presence[key] += 1

          public = {'ok': False, 'error': None, 'elapsedSeconds': None}
          started = time.monotonic()
          try:
              public_payload = fetch_json_object(
                  os.environ['API_URL'].rstrip('/') + '/v1/mlb/locks/status',
                  max_wait_seconds=40,
                  request_timeout_seconds=35,
                  retry_delay_seconds=1,
                  max_attempts=1,
                  headers={
                      'accept': 'application/json',
                      'user-agent': 'inqsi-lock-cacheability-diagnostic/1.0',
                  },
              )
              public.update({
                  'ok': True,
                  'gameCount': public_payload.get('gameCount'),
                  'statusCache': public_payload.get('statusCache'),
                  'payloadBytes': encoded_size(public_payload),
              })
          except Exception as exc:
              public['error'] = f'{type(exc).__name__}:{exc}'
          public['elapsedSeconds'] = round(time.monotonic() - started, 3)

          full_bytes = encoded_size(payload)
          report = {
              'proofType': 'MLB_LOCK_STATUS_CACHEABILITY_LIVE_DIAGNOSTIC',
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'readOnly': True,
              'sourceSha': os.environ.get('GITHUB_SHA'),
              'slateDateEt': payload.get('slateDateEt'),
              'gameCount': payload.get('gameCount'),
              'directInvocation': invocation,
              'directPayloadBytes': full_bytes,
              'dynamoDbItemLimitBytes': 400 * 1024,
              'payloadExceedsDynamoDbItemLimit': full_bytes >= 400 * 1024,
              'payloadExceedsApiGatewayComfortBudget': full_bytes >= 1024 * 1024,
              'statusCacheInDirectPayload': payload.get('statusCache'),
              'topLevelLargestFields': [
                  {'field': key, 'bytes': size}
                  for key, size in top_sizes[:15]
              ],
              'perGameStatus': {
                  'rowCount': len(rows),
                  'totalBytes': encoded_size(rows),
                  'maximumRowBytes': max(row_sizes, default=0),
                  'minimumRowBytes': min(row_sizes, default=0),
                  'averageRowBytes': round(sum(row_sizes) / len(row_sizes), 2) if row_sizes else 0,
                  'largestAggregateFields': [
                      {
                          'field': key,
                          'aggregateBytes': size,
                          'rowPresence': field_presence[key],
                      }
                      for key, size in aggregate_field_sizes.most_common(25)
                  ],
              },
              'publicHotPathAfterDirectWarm': public,
              'secretExposed': False,
          }
          Path('/tmp/mlb-lock-status-cacheability-live-diagnostic.json').write_text(
              json.dumps(report, indent=2, sort_keys=True, default=str) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'directPayloadBytes': full_bytes,
              'payloadExceedsDynamoDbItemLimit': report['payloadExceedsDynamoDbItemLimit'],
              'perGameStatusBytes': report['perGameStatus']['totalBytes'],
              'maximumRowBytes': report['perGameStatus']['maximumRowBytes'],
              'publicHotPathAfterDirectWarm': public,
              'largestFields': report['topLevelLargestFields'][:5],
          }, indent=2))
          PY

      - name: Upload compact diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: mlb-lock-status-smoke-live-${{ github.run_id }}
          path: /tmp/mlb-lock-status-cacheability-live-diagnostic.json
          if-no-files-found: error
          retention-days: 14
