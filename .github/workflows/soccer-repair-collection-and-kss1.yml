name: Soccer Repair Collection And KSS1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soccer-repair-collection-and-kss1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Hot-update recovery and freeze Lambdas
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-soccer-auto
          physical() { aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id "$1" --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text; }
          rm -rf /tmp/soccer-hot && mkdir -p /tmp/soccer-hot/soccer_auto
          cp soccer_auto/*.py /tmp/soccer-hot/soccer_auto/
          (cd /tmp/soccer-hot && zip -qr /tmp/soccer-runtime.zip soccer_auto)
          for logical in SoccerDlqRecoveryFunction SoccerFreezeFunction SoccerCollectionWorkerFunction; do
            fn=$(physical "$logical")
            aws lambda update-function-code --function-name "$fn" --region "$REGION" --zip-file fileb:///tmp/soccer-runtime.zip >/dev/null
            aws lambda wait function-updated-v2 --function-name "$fn" --region "$REGION"
            echo "updated $logical $fn"
          done
      - name: Drain stale main-queue work via Lambda role
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-soccer-auto
          recovery=$(aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id SoccerDlqRecoveryFunction --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text)
          aws lambda invoke --function-name "$recovery" --region "$REGION" --cli-read-timeout 300 --cli-binary-format raw-in-base64-out --payload '{"action":"recover_collection_dlq","max_messages":1000}' /tmp/dlq.json >/tmp/dlq-meta.json
          aws lambda invoke --function-name "$recovery" --region "$REGION" --cli-read-timeout 300 --cli-binary-format raw-in-base64-out --payload '{"action":"recover_collection_main","max_messages":2000}' /tmp/main1.json >/tmp/main1-meta.json
          aws lambda invoke --function-name "$recovery" --region "$REGION" --cli-read-timeout 300 --cli-binary-format raw-in-base64-out --payload '{"action":"recover_collection_main","max_messages":2000}' /tmp/main2.json >/tmp/main2-meta.json
          python3 - <<'PY'
          import json
          for name in ('dlq','main1','main2'):
              meta=json.load(open(f'/tmp/{name}-meta.json'))
              body=json.load(open(f'/tmp/{name}.json'))
              print(name, meta.get('FunctionError'), json.dumps(body)[:1500])
              assert not meta.get('FunctionError'), (name, meta, body)
              assert body.get('ok') is True, (name, body)
          PY
      - name: Prove freeze, bounded settlement, and status API
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-soccer-auto
          physical() { aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id "$1" --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text; }
          freeze=$(physical SoccerFreezeFunction)
          settlement=$(physical SoccerSettlementFunction)
          api=$(physical SoccerApiFunction)
          aws lambda invoke --function-name "$freeze" --region "$REGION" --cli-read-timeout 300 --cli-binary-format raw-in-base64-out --payload '{"action":"freeze_t45_training_and_t10_final_decision"}' /tmp/freeze.json >/tmp/freeze-meta.json
          aws lambda invoke --function-name "$settlement" --region "$REGION" --cli-read-timeout 360 --cli-binary-format raw-in-base64-out --payload '{"action":"reconcile_admissibility_only"}' /tmp/settlement.json >/tmp/settlement-meta.json
          aws lambda invoke --function-name "$api" --region "$REGION" --cli-read-timeout 60 --cli-binary-format raw-in-base64-out --payload '{"httpMethod":"GET","path":"/v1/soccer-auto/status"}' /tmp/api.json >/tmp/api-meta.json || true
          status_url=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='SoccerAutoStatusUrl'].OutputValue" --output text)
          curl --fail --silent --show-error --max-time 45 "$status_url" >/tmp/status.json || echo '{"status_curl_failed":true}' >/tmp/status.json
          python3 - <<'PY'
          import json
          freeze=json.load(open('/tmp/freeze.json'))
          settle=json.load(open('/tmp/settlement.json'))
          main=json.load(open('/tmp/main2.json'))
          status=json.load(open('/tmp/status.json'))
          print('main_after', main.get('after'))
          print('freeze', {k:freeze.get(k) for k in ('ok','kss1_engine','kss1_shadow_written','kss1_shadow_skipped','kss1_shadow_error','lock_reason_counts')})
          print('settlement_ok', settle.get('ok'), settle.get('action'), (settle.get('admissibility_reconciliation') or {}).get('scan_mode'))
          print('status_keys', sorted(status)[:20] if isinstance(status, dict) else type(status))
          assert freeze.get('ok') is True, freeze
          assert freeze.get('kss1_engine')=='kss1-goals-v1', freeze
          assert 'kss1_shadow_error' not in freeze, freeze
          assert settle.get('ok') is True, settle
          PY
