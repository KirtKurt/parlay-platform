name: Patch MLB Backend Recovery Fixtures

on:
  push:
    branches: [agent/mlb-backend-recovery-audit-20260725]
    paths:
      - '.github/workflows/patch-mlb-backend-recovery-fixtures.yml'

permissions:
  contents: write

concurrency:
  group: patch-mlb-backend-recovery-fixtures
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mlb-backend-recovery-audit-20260725
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch stale MLB backend fixtures
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          acceptance = Path('tests/unit/test_mlb_production_acceptance.py')
          text = acceptance.read_text(encoding='utf-8')
          replacements = {
              'NOW = datetime(2026, 7, 23, 3, 0, tzinfo=timezone.utc)':
                  'NOW = datetime(2026, 7, 25, 3, 0, tzinfo=timezone.utc)',
              '2026-07-22': '2026-07-24',
              'test_pre_r3_missing_locks_are_quarantined_from_post_cutoff_acceptance':
                  'test_pre_r4_missing_locks_are_quarantined_from_post_cutoff_acceptance',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'expected acceptance fixture text missing: {old}')
              text = text.replace(old, new)
          acceptance.write_text(text, encoding='utf-8')

          optimizer_test = Path('tests/unit/test_mlb_historical_optimizer_template.py')
          text = optimizer_test.read_text(encoding='utf-8')
          text = text.replace(
              '    assert "DynamoDB lease" in text\n',
              '    assert "MLB_HISTORICAL_LEASE_SECONDS" in text\n',
          )
          optimizer_test.write_text(text, encoding='utf-8')

          read_test = Path('tests/unit/test_mlb_v3_read_api_security.py')
          text = read_test.read_text(encoding='utf-8')
          text = text.replace(
              '    runtime.install = lambda: {"ok": runtime_ok, "steps": {}, "version": "test-runtime"}\n',
              '''    runtime.install = lambda: {\n        "ok": runtime_ok,\n        "steps": {\n            "rankedWinnerV15_10SelectionInstalled": runtime_ok,\n            "historicalAuthorityStateCoherent": runtime_ok,\n        },\n        "version": "test-runtime",\n        "historicalDailyChampionOutermostAuthorityInstalled": runtime_ok,\n        "historicalDailyChampionActive": False,\n        "productionAuthoritySource": "mlb_ranked_winner_v15_10_active_ensemble",\n    }\n''',
          )
          text = text.replace(
              '    engine.MODEL_VERSION = "test-model"\n    engine.ENGINE = "test-engine"\n',
              '    engine.MODEL_VERSION = "test-model"\n    engine.ENGINE = "test-engine"\n    engine.MLB_RANKED_WINNER_VERSION = "test-ranked-winner"\n    engine.MLB_RANKED_WINNER_POLICY_VERSION = "test-ranked-policy"\n',
          )
          text = text.replace(
              '    assert body["apiRuntimeVersion"] == "MLB-V3-READ-API-v4-persisted-canonical-v2-shadow"\n',
              '    assert body["apiRuntimeVersion"] == "MLB-V3-READ-API-v6-ranked-winner-v15.10"\n',
          )
          text = text.replace(
              '    engine.MLB_ML_RUNTIME_INSTALL_V3 = {"ok": True}\n',
              '''    engine.MLB_ML_RUNTIME_INSTALL_V3 = {\n        "ok": True,\n        "steps": {"rankedWinnerV15_10SelectionInstalled": True},\n    }\n    engine.MLB_RANKED_WINNER_VERSION = core.PRIMARY_ALGORITHM\n    engine.MLB_RANKED_WINNER_POLICY_VERSION = core.POLICY_VERSION\n''',
          )
          read_test.write_text(text, encoding='utf-8')
          PY

      - name: Validate repaired contracts
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SESSION_TOKEN: testing
          PYTHONPATH: ${{ github.workspace }}/hello_world:${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_historical_optimizer_template.py \
            tests/unit/test_mlb_r4_acceptance_fixture_contract.py \
            tests/unit/test_mlb_production_acceptance.py \
            tests/unit/test_mlb_v3_read_api_security.py

      - name: Commit durable backend fixture repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-mlb-backend-recovery-fixtures.yml
          git add tests/unit/test_mlb_production_acceptance.py \
                  tests/unit/test_mlb_historical_optimizer_template.py \
                  tests/unit/test_mlb_v3_read_api_security.py
          git commit -m 'Repair MLB backend recovery test contracts'
          git push origin HEAD:agent/mlb-backend-recovery-audit-20260725
