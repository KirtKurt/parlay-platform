name: Tennis Post-Fix Tests 2026-08-03 1649

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennis-post-fix-tests-20260803-1649.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennis-post-fix-tests-20260803-1649
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - name: Compile and test isolated tennis runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile \
            tennis_learning/handler.py \
            tennis_learning/live_pipeline.py \
            tennis_learning/autonomous_controller.py \
            tennis_learning/backfill.py \
            tennis_learning/bootstrap_handler.py
          python -m pytest -q \
            tests/test_tennis_learning_handler.py \
            tests/test_tennis_autonomy_contract.py \
            tests/test_tennis_backfill_contract.py
          sam validate --template-file tennis-template.yaml
          git diff --check

      - name: Publish successful verification and self-remove
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 20); do
            git fetch origin main
            git checkout -B tennis-post-fix-tests-publish origin/main
            rm -f .github/workflows/tennis-post-fix-tests-20260803-1649.yml
            git add .github/workflows/tennis-post-fix-tests-20260803-1649.yml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record successful tennis post-fix verification [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Unable to publish tennis post-fix verification' >&2
          exit 1
