name: Verify Tennis Alpha Schedules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Confirm rules enabled
        run: |
          set -euo pipefail
          collect=$(aws events describe-rule --name tennis-alpha-collect --query State --output text)
          settle=$(aws events describe-rule --name tennis-alpha-settle --query State --output text)
          echo collect=$collect settle=$settle
          test "$collect" = ENABLED
          test "$settle" = ENABLED
