name: MLB R7 Complete Alignment Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-r7-release-window-repair-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-r7-complete-alignment-once
  cancel-in-progress: false

jobs:
  align-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2

      - name: Build and apply complete r7 alignment
        run: |
          set -euo pipefail
          cat > /tmp/apply_mlb_r7_alignment.py <<'PY'
          from pathlib import Path

          old_ids = (
              'mlb-v2-2026-08-02-future-prospective-r6',
              'mlb-v2-2026-08-02-future-prospective-r7',
          )
          new_id = 'mlb-v2-2026-08-03-future-prospective-r7'
          old_cutoffs = (
              '2026-08-02T04:00:00+00:00',
              '2026-08-02T08:00:00+00:00',
          )
          new_cutoff = '2026-08-03T04:00:00+00:00'

          paths = []
          for root in (Path('hello_world'), Path('scripts'), Path('tests/unit')):
              paths.extend(root.rglob('*.py'))
          paths.append(Path('template.yaml'))
          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated = text
              for old_id in old_ids:
                  updated = updated.replace(old_id, new_id)
              for old_cutoff in old_cutoffs:
                  updated = updated.replace(old_cutoff, new_cutoff)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          clean = Path('tests/unit/test_mlb_ml_r5_clean_cutover.py')
          if clean.exists():
              text = clean.read_text(encoding='utf-8')
              text = text.replace('2026-08-02T03:00:00+00:00', '2026-08-03T03:00:00+00:00')
              text = text.replace('datetime(2026, 8, 2, 3, 30', 'datetime(2026, 8, 3, 3, 30')
              text = text.replace('test_r6_', 'test_r7_').replace('r6_loader', 'r7_loader')
              text = text.replace('pre-r6', 'pre-r7').replace('by_r6', 'by_r7')
              clean.write_text(text, encoding='utf-8')

          training_test = Path('tests/unit/test_mlb_ml_aws_training_v1.py')
          text = training_test.read_text(encoding='utf-8')
          text = text.replace(
              'datetime(2026, 8, 2, 4, 0, tzinfo=timezone.utc),\n'
              '        datetime(2026, 8, 2, 4, 0, 0, 1, tzinfo=timezone.utc),',
              'datetime(2026, 8, 3, 4, 0, tzinfo=timezone.utc),\n'
              '        datetime(2026, 8, 3, 4, 0, 0, 1, tzinfo=timezone.utc),',
          )
          start = text.index('def test_partial_prior_et_slate_cannot_freeze_or_deadlock_manifest')
          end = text.find('\ndef ', start + 4)
          if end < 0:
              end = len(text)
          block = text[start:end]
          block = block.replace(
              'after_midnight_et = datetime(2026, 8, 3, 4, 30, tzinfo=timezone.utc)',
              'after_midnight_et = datetime(2026, 8, 4, 4, 30, tzinfo=timezone.utc)',
          ).replace('2026-08-02', '2026-08-03')
          training_test.write_text(text[:start] + block + text[end:], encoding='utf-8')

          r6 = Path('tests/unit/test_mlb_r6_recovery_contract.py')
          r7 = Path('tests/unit/test_mlb_r7_recovery_contract.py')
          if r6.exists():
              text = r6.read_text(encoding='utf-8')
              text = text.replace('August 2', 'August 3')
              text = text.replace('test_r6_', 'test_r7_')
              text = text.replace('r6_starts', 'r7_starts')
              text = text.replace('2026-08-02', '2026-08-03')
              text = text.replace('r6', 'r7')
              r7.write_text(text, encoding='utf-8')
              r6.unlink()

          template = Path('template.yaml').read_text(encoding='utf-8')
          assert new_id in template and new_cutoff in template
          for old_id in old_ids:
              assert old_id not in template
          for old_cutoff in old_cutoffs:
              assert old_cutoff not in template
          PY
          python /tmp/apply_mlb_r7_alignment.py
          git diff --check

      - name: Verify complete MLB safety contracts
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'requests>=2.31,<3' 'PyYAML>=6,<7' -r hello_world/requirements.txt
          python -m compileall -q hello_world scripts
          python scripts/stabilize_mlb_deploy_source.py
          python scripts/patch_template_mlb_v1.py
          python scripts/patch_template_mlb_security.py
          python scripts/patch_template_mlb_results_routes.py
          git diff --check
          sam validate --template-file template.yaml
          mapfile -t tests < <(find tests/unit -maxdepth 1 -type f -name 'test_mlb_*.py' -print | sort)
          test ${#tests[@]} -gt 0
          python -m pytest -q --tb=short "${tests[@]}"
          sam build --template-file template.yaml --cached
          python scripts/verify_mlb_schedule_invariants.py --template .aws-sam/build/template.yaml

      - name: Publish onto latest main and remove one-time workflow
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-r7-complete-alignment origin/main
            python /tmp/apply_mlb_r7_alignment.py
            rm -f .github/workflows/mlb-r7-release-window-repair-once.yml
            git diff --check
            python -m pytest -q --tb=short \
              tests/unit/test_mlb_ml_aws_training_v1.py \
              tests/unit/test_mlb_ml_r5_clean_cutover.py \
              tests/unit/test_mlb_r7_recovery_contract.py \
              tests/unit/test_mlb_deploy_identity.py \
              tests/unit/test_run_mlb_ml_v3_audit_report.py
            sam validate --template-file template.yaml
            git add -A hello_world scripts template.yaml tests/unit .github/workflows
            if git diff --cached --quiet; then
              echo 'Latest main already has complete r7 alignment.'
              exit 0
            fi
            git commit -m 'Align complete MLB source to clean r7 boundary'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
