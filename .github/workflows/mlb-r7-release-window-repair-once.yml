name: MLB R7 Release Window Repair Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-r7-release-window-repair-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-r7-release-window-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Align every active MLB release authority to r7
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_id = 'mlb-v2-2026-08-02-future-prospective-r6'
          new_id = 'mlb-v2-2026-08-02-future-prospective-r7'
          old_cutoff = '2026-08-02T04:00:00+00:00'
          new_cutoff = '2026-08-02T08:00:00+00:00'
          paths = [
              Path('template.yaml'),
              Path('hello_world/mlb_ml_experiment_v2.py'),
              Path('scripts/stabilize_mlb_deploy_source.py'),
              Path('scripts/verify_mlb_ml_training_readiness.py'),
              Path('scripts/verify_mlb_ml_optimization_v3.py'),
              Path('scripts/verify_mlb_ml_installation_1_5.py'),
              Path('scripts/verify_mlb_schedule_invariants.py'),
              Path('scripts/verify_mlb_deploy_identity.py'),
              Path('scripts/run_mlb_ml_v3_audit_report.py'),
              Path('scripts/verify_mlb_trainer_deploy_response.py'),
              Path('scripts/enforce_mlb_production_acceptance.py'),
              Path('tests/unit/test_mlb_r6_recovery_contract.py'),
              Path('tests/unit/test_mlb_ml_r5_clean_cutover.py'),
              Path('tests/unit/test_mlb_deploy_identity.py'),
              Path('tests/unit/test_run_mlb_ml_v3_audit_report.py'),
              Path('tests/unit/test_mlb_trainer_deploy_response.py'),
              Path('.github/workflows/deploy.yml'),
          ]
          changed = []
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text()
              updated = text.replace(old_id, new_id).replace(old_cutoff, new_cutoff)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              print('All active release authorities were already aligned.')
          else:
              print('Aligned release authorities:')
              print('\n'.join(changed))
          for required in (
              Path('template.yaml'),
              Path('hello_world/mlb_ml_experiment_v2.py'),
              Path('scripts/verify_mlb_schedule_invariants.py'),
          ):
              text = required.read_text()
              assert new_id in text, required
              assert new_cutoff in text, required
              assert old_id not in text, required
              assert old_cutoff not in text, required
          PY

      - name: Validate aligned release, lock, and promotion contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
          python scripts/verify_mlb_schedule_invariants.py
          python -m pytest -q \
            tests/unit/test_mlb_r6_recovery_contract.py \
            tests/unit/test_mlb_trainer_deploy_response.py \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_run_mlb_ml_v3_audit_report.py

      - name: Publish aligned release authorities
        run: |
          set -euo pipefail
          mkdir -p /tmp/mlb-r7-aligned
          tracked=(
            template.yaml
            hello_world/mlb_ml_experiment_v2.py
            scripts/stabilize_mlb_deploy_source.py
            scripts/verify_mlb_ml_training_readiness.py
            scripts/verify_mlb_ml_optimization_v3.py
            scripts/verify_mlb_ml_installation_1_5.py
            scripts/verify_mlb_schedule_invariants.py
            scripts/verify_mlb_deploy_identity.py
            scripts/run_mlb_ml_v3_audit_report.py
            scripts/verify_mlb_trainer_deploy_response.py
            scripts/enforce_mlb_production_acceptance.py
            tests/unit/test_mlb_r6_recovery_contract.py
            tests/unit/test_mlb_ml_r5_clean_cutover.py
            tests/unit/test_mlb_deploy_identity.py
            tests/unit/test_run_mlb_ml_v3_audit_report.py
            tests/unit/test_mlb_trainer_deploy_response.py
            .github/workflows/deploy.yml
          )
          for path in "${tracked[@]}"; do
            if [ -f "$path" ]; then
              mkdir -p "/tmp/mlb-r7-aligned/$(dirname "$path")"
              cp "$path" "/tmp/mlb-r7-aligned/$path"
            fi
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-r7-release-authority-alignment origin/main
            for path in "${tracked[@]}"; do
              if [ -f "/tmp/mlb-r7-aligned/$path" ]; then
                cp "/tmp/mlb-r7-aligned/$path" "$path"
              fi
            done
            git add "${tracked[@]}"
            git diff --cached --quiet && exit 0
            git commit -m 'Align all active MLB r7 release authorities'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
