name: MLB AUTO T45 Training Bridge Install

on:
  push:
    branches: ["agent/mlb-auto-autonomy-chain-20260814"]
    paths:
      - "hello_world/mlb_ml_training_envelope_bridge_v1.py"
      - "scripts/install_mlb_training_envelope_bridge.py"
      - "tests/unit/test_mlb_training_envelope_bridge_v1.py"
      - ".github/workflows/mlb-auto-training-envelope-bridge-install.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message || '', '[t45-bridge-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mlb-auto-autonomy-chain-20260814
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9"
      - name: Install bridge idempotently
        run: |
          python scripts/install_mlb_training_envelope_bridge.py
          git diff > /tmp/bridge.patch
          python scripts/install_mlb_training_envelope_bridge.py
          git diff > /tmp/bridge-second.patch
          cmp /tmp/bridge.patch /tmp/bridge-second.patch
      - name: Compile and test
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python -m py_compile hello_world/mlb_ml_training_envelope_bridge_v1.py hello_world/mlb_ml_aws_training_v1.py
          pytest -q tests/unit/test_mlb_training_envelope_bridge_v1.py tests/unit/test_mlb_auto_autonomy_chain_v1.py
          python scripts/verify_mlb_auto_autonomy_chain.py
      - name: Commit bridge installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hello_world/mlb_ml_aws_training_v1.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install strict MLB T45 training bridge [t45-bridge-installed]"
          git pull --rebase --autostash origin agent/mlb-auto-autonomy-chain-20260814
          git push origin HEAD:agent/mlb-auto-autonomy-chain-20260814
