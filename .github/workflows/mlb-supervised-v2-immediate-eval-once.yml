name: MLB Supervised V2 Immediate Evaluation Once
# Trusted second push after workflow installation on the default branch.

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-supervised-v2-immediate-eval-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-supervised-shadow-v2
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_supervised_shadow_v2_latest.json
  EXPECTED_FEATURE_DATASET: MLB-HISTORICAL-FEATURE-DATASET-v8-supervised-trainable

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate model and selection objective
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile \
            hello_world/mlb_supervised_features_v2.py \
            hello_world/mlb_supervised_model_v2.py \
            hello_world/mlb_supervised_daily_objective_v2_1.py \
            scripts/run_mlb_supervised_shadow_v2.py \
            scripts/guard_mlb_v8_shadow_report.py
          PYTHONPATH=hello_world python -m pytest -q --tb=short \
            tests/unit/test_mlb_supervised_shadow_v2.py \
            tests/unit/test_mlb_supervised_daily_objective_v2_1.py \
            tests/unit/test_guard_mlb_v8_shadow_report.py

      - name: Verify AWS evidence schema
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          import boto3
          region=os.environ['AWS_REGION_VALUE']
          cf=boto3.client('cloudformation',region_name=region)
          lam=boto3.client('lambda',region_name=region)
          outputs={str(x.get('OutputKey')):str(x.get('OutputValue')) for x in (cf.describe_stacks(StackName=os.environ['STACK_NAME']).get('Stacks') or [])[0].get('Outputs') or []}
          function_name=outputs.get('HistoricalOptimizerFunctionName')
          assert function_name
          config=lam.get_function_configuration(FunctionName=function_name)
          assert config.get('Handler')=='mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler', config
          response=lam.invoke(FunctionName=function_name,InvocationType='RequestResponse',Payload=b'{"mode":"status","run":"supervised_v2_immediate_evidence_check"}')
          value=json.loads(response['Payload'].read().decode())
          assert not response.get('FunctionError'), value
          assert value.get('ok') is True, value
          state=value.get('state') or {}
          assert state.get('featureDatasetVersion')==os.environ['EXPECTED_FEATURE_DATASET'], state
          assert state.get('featureRematerializationComplete') is True, state
          assert not state.get('featureRematerializationErrors'), state
          assert not state.get('lastError'), state
          PY

      - name: Evaluate immutable AWS historical evidence
        id: evaluation
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: hello_world
        run: |
          set -o pipefail
          mkdir -p runtime_reports
          rm -f "$REPORT_PATH" /tmp/mlb-supervised-v2-immediate.log
          python scripts/run_mlb_supervised_shadow_v2.py \
            --region "$AWS_REGION_VALUE" \
            --stack-name "$STACK_NAME" \
            --table-name parlay_platform_snapshots \
            --output "$REPORT_PATH" \
            2>&1 | tee /tmp/mlb-supervised-v2-immediate.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure exact durable evidence exists
        if: always()
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          EVALUATION_EXIT_CODE: ${{ steps.evaluation.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-supervised-v2-immediate.log').read_text(errors='replace')[-16000:] if Path('/tmp/mlb-supervised-v2-immediate.log').exists() else ''
          value={
              'proofType':'MLB_SUPERVISED_SHADOW_V2_EVIDENCE',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ['GITHUB_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'authority':'SHADOW_ONLY',
              'productionAuthorityChanged':False,
              'automaticWagerAllowed':False,
              'productionPromotionEligible':False,
              'evaluationOutcome':os.environ.get('EVALUATION_OUTCOME'),
              'evaluationExitCode':os.environ.get('EVALUATION_EXIT_CODE'),
              'evaluationLogTail':log,
              'blockers':['supervised_immediate_evaluation_failed'],
              'ok':False,
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-supervised-v2-immediate-${{ github.run_id }}
          path: |
            runtime_reports/mlb_supervised_shadow_v2_latest.json
            /tmp/mlb-supervised-v2-immediate.log
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$REPORT_PATH" /tmp/mlb-supervised-v2-immediate-report.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-supervised-v2-immediate-proof origin/main
            mkdir -p runtime_reports
            python scripts/guard_mlb_v8_shadow_report.py \
              --incoming /tmp/mlb-supervised-v2-immediate-report.json \
              --destination "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB supervised shadow V2 evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce complete safe evaluation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_supervised_shadow_v2_latest.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('authority')=='SHADOW_ONLY', value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('automaticWagerAllowed') is False, value
          assert value.get('productionPromotionEligible') is False, value
          assert (value.get('selectionObjective') or {}).get('productionAuthorityChanged') is False, value
          assert not value.get('blockers'), value
          PY