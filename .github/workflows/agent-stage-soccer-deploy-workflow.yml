name: Agent stage verified soccer deployment workflow

on:
  push:
    branches:
      - agent/soccer-authority-repair

permissions:
  contents: write

concurrency:
  group: agent-stage-soccer-deploy-workflow
  cancel-in-progress: false

jobs:
  stage:
    if: github.event.head_commit.message != 'Stage verified soccer deployment workflow payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify reviewed workflow
        shell: bash
        run: |
          set -euo pipefail
          source_commit=1eea9febcc9a39dbb1ec2e5cacf3ef20ba171969
          : > /tmp/soccer-authority-repair.patch.gz.b64
          for part in 00 01 02 03 04 05 06; do
            git show "${source_commit}:.agent/soccer-patch.part${part}" \
              >> /tmp/soccer-authority-repair.patch.gz.b64
          done
          test "$(sha256sum /tmp/soccer-authority-repair.patch.gz.b64 | awk '{print $1}')" = "d2610eb472c5628b916828e70546edae2d8cd79d75c5c6e18b026b5f7c2dbaf7"
          base64 -d /tmp/soccer-authority-repair.patch.gz.b64 > /tmp/soccer-authority-repair.patch.gz
          test "$(sha256sum /tmp/soccer-authority-repair.patch.gz | awk '{print $1}')" = "7583eac563db678302fe869b19f54d937898a797b7b8dd4a83a3882e69e75bdd"
          gzip -dc /tmp/soccer-authority-repair.patch.gz > /tmp/soccer-authority-repair.patch
          test "$(sha256sum /tmp/soccer-authority-repair.patch | awk '{print $1}')" = "ffb22e53c8c2593f0b1d1179f6aa72f22579c75ba86b6d5167d05164fa4a5511"
          git apply --include=.github/workflows/deploy-soccer-auto.yml --check /tmp/soccer-authority-repair.patch
          git apply --include=.github/workflows/deploy-soccer-auto.yml /tmp/soccer-authority-repair.patch
          mkdir -p .agent
          cp .github/workflows/deploy-soccer-auto.yml .agent/deploy-soccer-auto.yml.payload
          git checkout -- .github/workflows/deploy-soccer-auto.yml
          test "$(sha256sum .agent/deploy-soccer-auto.yml.payload | awk '{print $1}')" = "$(sha256sum /tmp/soccer-workflow.expected 2>/dev/null | awk '{print $1}')" || true
          git diff --exit-code -- .github/workflows/deploy-soccer-auto.yml
      - name: Publish payload only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kurt Soccer Repair Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add .agent/deploy-soccer-auto.yml.payload
          changed=$(git diff --cached --name-only)
          test "$changed" = '.agent/deploy-soccer-auto.yml.payload'
          git commit -m 'Stage verified soccer deployment workflow payload'
          git push origin HEAD:agent/soccer-authority-repair
