# MLB-only, read-only production diagnostic for R7 row admission.
name: Diagnose MLB R7 admission now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-r7-admission-now.yml'
      - 'scripts/diagnose_mlb_r7_admission.py'
      - 'hello_world/mlb_prospective_trainer_read_repair.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-mlb-r7-admission-now
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read exact R7 admission evidence
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2'
          PYTHONPATH="hello_world:${PYTHONPATH:-}" python scripts/diagnose_mlb_r7_admission.py

      - name: Publish read-only diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_reports/mlb_r7_admission_diagnostic_latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish MLB R7 row admission diagnostic [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
