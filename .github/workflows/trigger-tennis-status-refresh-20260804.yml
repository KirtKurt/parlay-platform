name: Trigger Tennis Status Refresh 2026-08-04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-tennis-status-refresh-20260804.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch permanent tennis status publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish-tennis-autonomy-status.yml --repo "$GH_REPO"
