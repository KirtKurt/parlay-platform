name: Validate repaired R7 quarantine PR now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-pr601-r7-repair-now.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF: codex/mlb-valid-prelock-quarantine-v4-567
    steps:
      - name: Dispatch exact branch safety contracts
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            mlb-production-source-contract.yml \
            mlb-deploy-cutoff-smoke-contract.yml \
            mlb-postcutoff-storage-contract.yml
          do
            gh api \
              --method POST \
              "repos/${REPO}/actions/workflows/${workflow}/dispatches" \
              -f ref="${REF}"
          done

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-shot validator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          if test -f .github/workflows/validate-pr601-r7-repair-now.yml; then
            git rm .github/workflows/validate-pr601-r7-repair-now.yml
            git commit -m 'Remove completed R7 PR validator [skip ci]'
            for n in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
              sleep $((n*2))
            done
            exit 1
          fi