name: MLB V9 R5 Source Publish Retry Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v9-r5-source-publish-retry-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v9-r5-source-publish-retry-once
  cancel-in-progress: false

env:
  REPORT_PATH: runtime_reports/mlb_v9_r5_source_publish_retry_latest.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Apply validated R5 source migration without workflow edits
        id: migrate
        continue-on-error: true
        run: |
          set -uo pipefail
          (
            set -euo pipefail
            python - <<'PY'
          from pathlib import Path
          import json

          old_id = 'mlb-v2-2026-07-24-future-prospective-r4'
          new_id = 'mlb-v2-2026-07-29-future-prospective-r5'
          old_cutoff = '2026-07-24T04:00:00+00:00'
          new_cutoff = '2026-07-29T04:00:00+00:00'
          excluded_roots = {'runtime_reports', 'docs', '.git', '.github'}
          changed = []

          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or (path.parts and path.parts[0] in excluded_roots):
                  continue
              try:
                  raw = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = raw.replace(old_id, new_id).replace(old_cutoff, new_cutoff)
              updated = updated.replace('future-prospective r4', 'future-prospective r5')
              updated = updated.replace('future prospective r4', 'future prospective r5')
              updated = updated.replace('r4 release cutoff', 'r5 release cutoff')
              updated = updated.replace('r4 release', 'r5 release')
              updated = updated.replace('r4 experiment', 'r5 experiment')
              updated = updated.replace('r4 clean cutover', 'r5 clean cutover')
              updated = updated.replace('test_mlb_ml_r4_clean_cutover.py', 'test_mlb_ml_r5_clean_cutover.py')
              if updated != raw:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          boundary_fixtures = {
              Path('tests/unit/test_mlb_ml_aws_training_v1.py'): (
                  ('2026-07-24', '2026-07-29'),
                  ('datetime(2026, 7, 24', 'datetime(2026, 7, 29'),
                  ('datetime(2026, 7, 25, 4, 30', 'datetime(2026, 7, 30, 4, 30'),
              ),
              Path('tests/unit/test_run_mlb_ml_v3_audit_report.py'): (
                  ('2026-07-24', '2026-07-29'),
                  ('datetime(2026, 7, 24', 'datetime(2026, 7, 29'),
                  ('SETTLEMENT_NOW = datetime(2026, 7, 25, 3, 0', 'SETTLEMENT_NOW = datetime(2026, 7, 30, 3, 0'),
              ),
          }
          for path, replacements in boundary_fixtures.items():
              raw = path.read_text(encoding='utf-8')
              updated = raw
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != raw:
                  path.write_text(updated, encoding='utf-8')
                  if str(path) not in changed:
                      changed.append(str(path))

          old_test = Path('tests/unit/test_mlb_ml_r4_clean_cutover.py')
          new_test = Path('tests/unit/test_mlb_ml_r5_clean_cutover.py')
          if old_test.exists():
              old_test.rename(new_test)
              changed.extend([str(old_test), str(new_test)])

          required = {
              Path('hello_world/mlb_ml_experiment_v2.py'),
              Path('scripts/verify_mlb_trainer_deploy_response.py'),
              Path('scripts/verify_mlb_release_activation_predeploy.py'),
              Path('template.yaml'),
          }
          missing = [str(path) for path in required if new_id not in path.read_text(encoding='utf-8')]
          if missing:
              raise SystemExit('R5 identity not installed in required files: ' + ','.join(missing))

          stale = []
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or (path.parts and path.parts[0] in excluded_roots):
                  continue
              try:
                  value = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old_id in value or old_cutoff in value:
                  stale.append(str(path))
          if stale:
              raise SystemExit('Active source still references expired R4 boundary: ' + ','.join(stale))

          Path('/tmp/mlb-r5-retry-changed-files.json').write_text(json.dumps(changed, indent=2) + '\n')
          print('\n'.join(changed))
          PY
          ) 2>&1 | tee /tmp/mlb-r5-retry-migration.log
          exit ${PIPESTATUS[0]}

      - name: Re-run the validated R5 contract gate
        id: validate
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -uo pipefail
          (
            set -euo pipefail
            python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'pyyaml>=6,<7'
            python -m py_compile \
              hello_world/mlb_ml_experiment_v2.py \
              hello_world/mlb_ml_aws_training_v1.py \
              scripts/verify_mlb_trainer_deploy_response.py \
              scripts/verify_mlb_release_activation_predeploy.py \
              scripts/verify_mlb_deploy_identity.py
            PYTHONPATH=hello_world:. python -m pytest -q --tb=short \
              tests/unit/test_mlb_ml_r5_clean_cutover.py \
              tests/unit/test_mlb_trainer_deploy_response.py \
              tests/unit/test_mlb_ml_aws_training_v1.py \
              tests/unit/test_mlb_deploy_identity.py \
              tests/unit/test_run_mlb_ml_v3_audit_report.py
            python scripts/verify_mlb_release_activation_predeploy.py \
              --stack-name parlay-platform-dev \
              --region "$AWS_REGION_VALUE" \
              --output /tmp/mlb-r5-retry-predeploy.json
            python - <<'PY'
          import json
          value=json.load(open('/tmp/mlb-r5-retry-predeploy.json'))
          assert value.get('ok') is True, value
          assert value.get('decision') in {'ALLOW_FIRST_ACTIVATION','ALLOW_EXISTING_ACTIVATION'}, value
          assert value.get('experimentId') == 'mlb-v2-2026-07-29-future-prospective-r5', value
          assert value.get('releaseCutoffUtc') == '2026-07-29T04:00:00+00:00', value
          PY
          ) 2>&1 | tee /tmp/mlb-r5-retry-validation.log
          exit ${PIPESTATUS[0]}

      - name: Commit and push only non-workflow R5 source
        id: publish_source
        if: steps.migrate.outcome == 'success' && steps.validate.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          (
            set -euo pipefail
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git restore --staged .github 2>/dev/null || true
            git restore .github 2>/dev/null || true
            git add hello_world scripts tests template.yaml
            test ! -z "$(git status --porcelain)"
            git commit -m 'Recover MLB V9 with R5 prospective cutover'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                git rev-parse HEAD >/tmp/mlb-r5-retry-source-commit.txt
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          ) 2>&1 | tee /tmp/mlb-r5-retry-publish.log
          exit ${PIPESTATUS[0]}

      - name: Create durable retry evidence
        if: always()
        env:
          MIGRATION_OUTCOME: ${{ steps.migrate.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          SOURCE_PUBLISH_OUTCOME: ${{ steps.publish_source.outcome }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def tail(path):
              value=Path(path)
              return value.read_text(errors='replace')[-16000:] if value.exists() else ''
          def load(path, default):
              value=Path(path)
              try:
                  return json.loads(value.read_text()) if value.exists() else default
              except Exception:
                  return default
          migration=os.environ.get('MIGRATION_OUTCOME')
          validation=os.environ.get('VALIDATION_OUTCOME')
          published=os.environ.get('SOURCE_PUBLISH_OUTCOME')
          ok=migration == validation == published == 'success'
          blockers=[]
          if migration != 'success': blockers.append('r5_retry_migration_failed')
          if migration == 'success' and validation != 'success': blockers.append('r5_retry_validation_failed')
          if migration == validation == 'success' and published != 'success': blockers.append('r5_retry_source_publish_failed')
          report={
              'ok':ok,
              'proofType':'MLB_V9_R5_SOURCE_PUBLISH_RETRY',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'triggerSha':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'experimentId':'mlb-v2-2026-07-29-future-prospective-r5',
              'releaseCutoffUtc':'2026-07-29T04:00:00+00:00',
              'stepOutcomes':{'migration':migration,'validation':validation,'sourcePublish':published},
              'changedFiles':load('/tmp/mlb-r5-retry-changed-files.json', []),
              'predeployDecision':load('/tmp/mlb-r5-retry-predeploy.json', {}),
              'sourceRepairCommit':Path('/tmp/mlb-r5-retry-source-commit.txt').read_text().strip() if Path('/tmp/mlb-r5-retry-source-commit.txt').exists() else None,
              'migrationLogTail':tail('/tmp/mlb-r5-retry-migration.log'),
              'validationLogTail':tail('/tmp/mlb-r5-retry-validation.log'),
              'publishLogTail':tail('/tmp/mlb-r5-retry-publish.log'),
              'blockers':blockers,
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v9-r5-source-publish-retry-${{ github.run_id }}
          path: |
            runtime_reports/mlb_v9_r5_source_publish_retry_latest.json
            /tmp/mlb-r5-retry-*.log
            /tmp/mlb-r5-retry-*.json
            /tmp/mlb-r5-retry-source-commit.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable retry evidence
        if: always()
        run: |
          set -euo pipefail
          test -s "$REPORT_PATH"
          cp "$REPORT_PATH" /tmp/mlb-v9-r5-retry-report.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v9-r5-retry-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-v9-r5-retry-report.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V9 R5 source retry evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce successful source publication
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ['REPORT_PATH']).read_text())
          assert value.get('ok') is True, value
          assert value.get('sourceRepairCommit'), value
          assert not value.get('blockers'), value
          PY
