name: Install MLB Three-API Autonomy v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-mlb-three-api-autonomy-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-mlb-three-api-autonomy-v2
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runtime
        run: python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'

      - name: Install canonical MLB three-API integration
        run: python scripts/install_mlb_three_api_autonomy_v1.py

      - name: Prove sport isolation
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(tennis_learning/|tennis-template\.yaml|soccer_auto/|soccer-auto-template\.yaml)'; then
            echo '::error::MLB integration attempted to modify an isolated tennis or soccer asset'
            exit 1
          fi

      - name: Compile and test three-source contracts
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python -m py_compile \
            hello_world/mlb_advanced_context.py \
            hello_world/mlb_bbd_pro_context.py \
            hello_world/mlb_three_api_llm_analyst.py \
            hello_world/mlb_three_api_policy.py \
            hello_world/mlb_three_api_autonomous_controller.py \
            scripts/verify_mlb_three_api_runtime.py
          python -m pytest -q \
            tests/unit/test_mlb_three_api_policy.py \
            tests/unit/test_mlb_bbd_pro_context.py \
            tests/unit/test_mlb_three_api_runtime.py
          python scripts/verify_mlb_three_api_runtime.py

      - name: Commit installed production source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Three-API integration is already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install autonomous MLB three-API LLM runtime'
          git push origin HEAD:main
