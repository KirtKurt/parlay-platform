name: Trigger Soccer Post Drain Verify
# Explicit second dispatch after DLQ deletion propagation.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/trigger-soccer-post-drain-verify.yml']
permissions:
  actions: write
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run soccer-post-drain-verify.yml --repo "$GITHUB_REPOSITORY" --ref main
