name: Trigger Soccer Quota Backpressure Deploy

# Explicitly dispatch the root-cause Soccer contention repair on 2026-08-24.
on:
  push:
    paths:
      - '.github/workflows/trigger-soccer-quota-backpressure-deploy.yml'

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Soccer contention repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run repair-soccer-rate-limit-contention.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
