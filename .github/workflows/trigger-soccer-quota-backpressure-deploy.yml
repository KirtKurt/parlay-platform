name: Trigger Soccer Quota Backpressure Deploy

# Operational trigger refreshed after ODDS_API_KEY rotation on 2026-08-24.
# Fresh isolated recovery trigger at 13:xx ET to verify provider, backfill, and Bedrock runtime.
on:
  push:
    paths:
      - '.github/workflows/trigger-soccer-quota-backpressure-deploy.yml'

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch isolated Soccer deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Redeploy current main after restoring the Soccer lock-hash persistence contract.
          gh workflow run deploy-soccer-auto.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f shared_quota_reserve_percent=0
