name: Trigger Soccer Quota Backpressure Deploy

# Explicitly run the isolated deploy and force-recovery proof after the contention fix.
on:
  push:
    paths:
      - '.github/workflows/trigger-soccer-quota-backpressure-deploy.yml'

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch isolated Soccer deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-soccer-auto.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f shared_quota_reserve_percent=0
      - name: Dispatch Soccer force recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run soccer-force-recover.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
