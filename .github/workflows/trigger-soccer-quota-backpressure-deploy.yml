name: Trigger Soccer Quota Backpressure Deploy

# Lightweight live proof while the full recovery path is running.
on:
  push:
    paths:
      - '.github/workflows/trigger-soccer-quota-backpressure-deploy.yml'

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Soccer live proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run soccer-live-proof.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
