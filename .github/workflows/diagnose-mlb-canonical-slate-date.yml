name: Diagnose MLB Forward Canonical Slates

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose_mlb_canonical_slate_date.py'
      - '.github/workflows/diagnose-mlb-canonical-slate-date.yml'

permissions:
  contents: write

jobs:
  diagnose-forward-slates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Install dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2' -r hello_world/requirements.txt
      - name: Settle and diagnose each forward slate
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: hello_world:scripts
        run: |
          set -euo pipefail
          for slate in 2026-07-29 2026-07-30 2026-07-31 2026-08-01; do
            python scripts/diagnose_mlb_canonical_slate_date.py \
              --date "$slate" \
              --output "runtime_reports/mlb_canonical_slate_${slate}_diagnostic.json"
          done
      - name: Commit diagnostics
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime_reports/mlb_canonical_slate_2026-*.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MLB forward canonical slate diagnostics'
          git push origin HEAD:"$HEAD_BRANCH"
