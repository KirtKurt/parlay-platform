name: Diagnose MLB Canonical Slate Date

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose_mlb_canonical_slate_date.py'
      - '.github/workflows/diagnose-mlb-canonical-slate-date.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2'
      - name: Fetch exact official slate state
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: hello_world:scripts
        run: |
          set -euo pipefail
          python scripts/diagnose_mlb_canonical_slate_date.py \
            --date 2026-07-29 \
            --output runtime_reports/mlb_canonical_slate_2026-07-29_diagnostic.json
      - name: Commit diagnostic
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime_reports/mlb_canonical_slate_2026-07-29_diagnostic.json
          git commit -m 'Publish MLB July 29 canonical slate diagnostic'
          git push origin HEAD:"$HEAD_BRANCH"
