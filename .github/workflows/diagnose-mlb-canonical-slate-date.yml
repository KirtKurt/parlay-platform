name: Diagnose MLB Canonical Slate Date

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose_mlb_canonical_slate_date.py'
      - '.github/workflows/diagnose-mlb-canonical-slate-date.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Install dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2'
      - name: Fetch exact official slate state
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: hello_world:scripts
        run: |
          set -euo pipefail
          python scripts/diagnose_mlb_canonical_slate_date.py \
            --date 2026-07-29 \
            --output runtime_reports/mlb_canonical_slate_2026-07-29_diagnostic.json
      - name: Recheck repaired production trainer against final slate
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from pathlib import Path
          import boto3

          region=os.environ['AWS_REGION_VALUE']
          cf=boto3.client('cloudformation', region_name=region)
          lam=boto3.client('lambda', region_name=region)
          stack=cf.describe_stacks(StackName='parlay-platform-dev')['Stacks'][0]
          outputs={x['OutputKey']:x['OutputValue'] for x in stack.get('Outputs',[])}
          fn=outputs['MLBMLTrainingFunctionArn']
          attempts=[]
          final=None
          for attempt in range(1,7):
              response=lam.invoke(FunctionName=fn,InvocationType='RequestResponse',Payload=json.dumps({'sport':'mlb','mode':'scheduled','run':'post_final_slate_continuity_recheck'}).encode())
              raw=response['Payload'].read().decode('utf-8','replace')
              try: body=json.loads(raw or '{}')
              except Exception: body={'rawPayload':raw[:4000]}
              attempts.append({'attempt':attempt,'at':datetime.now(timezone.utc).isoformat(),'functionError':response.get('FunctionError'),'status':body.get('status') if isinstance(body,dict) else None,'errorType':body.get('errorType') if isinstance(body,dict) else None,'errorMessage':body.get('errorMessage') if isinstance(body,dict) else None})
              final=body
              if response.get('FunctionError') is None:
                  break
              message=str(body.get('errorMessage') or '') if isinstance(body,dict) else ''
              if 'execution lease' not in message.lower():
                  break
              time.sleep(20)
          report={'proofType':'MLB_CANONICAL_CONTINUITY_LIVE_RECHECK','createdAtUtc':datetime.now(timezone.utc).isoformat(),'stackStatus':stack.get('StackStatus'),'functionName':fn,'attempts':attempts,'result':final,'secretExposed':False}
          Path('runtime_reports/mlb_canonical_continuity_live_recheck.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          if attempts[-1]['functionError'] is not None:
              raise SystemExit(1)
          PY
      - name: Commit diagnostic
        if: always()
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime_reports/mlb_canonical_slate_2026-07-29_diagnostic.json runtime_reports/mlb_canonical_continuity_live_recheck.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MLB canonical continuity live recheck'
          git push origin HEAD:"$HEAD_BRANCH"
