name: Diagnose MLB Forward Lock Coverage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-canonical-slate-date.yml'

permissions:
  contents: write

concurrency:
  group: diagnose-mlb-forward-lock-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-raw-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Query official games and raw immutable lifecycle coverage
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2'
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          import boto3
          from boto3.dynamodb.conditions import Key

          region=os.environ['AWS_REGION_VALUE']
          cf=boto3.client('cloudformation',region_name=region)
          lam=boto3.client('lambda',region_name=region)
          stack=cf.describe_stacks(StackName='parlay-platform-dev')['Stacks'][0]
          outputs={x['OutputKey']:x['OutputValue'] for x in stack.get('Outputs',[])}
          fn=outputs['MLBMLTrainingFunctionArn']
          config=lam.get_function_configuration(FunctionName=fn)
          env=((config.get('Environment') or {}).get('Variables') or {})
          table_name=env['SNAPSHOTS_TABLE']
          table=boto3.resource('dynamodb',region_name=region).Table(table_name)

          def query_count(pk,prefix):
              count=0; start=None
              while True:
                  args={'KeyConditionExpression':Key('PK').eq(pk)&Key('SK').begins_with(prefix),'Select':'COUNT','ConsistentRead':True}
                  if start: args['ExclusiveStartKey']=start
                  page=table.query(**args); count+=int(page.get('Count') or 0)
                  start=page.get('LastEvaluatedKey')
                  if not start: return count

          def official(date):
              q=urllib.parse.urlencode({'sportId':'1','startDate':date,'endDate':date,'hydrate':'linescore'})
              url='https://statsapi.mlb.com/api/v1/schedule?'+q
              req=urllib.request.Request(url,headers={'accept':'application/json','user-agent':'inqsi-mlb-lock-coverage/1.0'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  payload=json.loads(response.read().decode())
              games=[g for d in payload.get('dates') or [] for g in d.get('games') or []]
              finals=sum(str((g.get('status') or {}).get('abstractGameState') or '').upper()=='FINAL' for g in games)
              return len(games),finals,url

          rows=[]
          for date in ('2026-07-29','2026-07-30','2026-07-31','2026-08-01'):
              games,finals,url=official(date)
              locks=query_count(f'GAME_WINNERS#mlb#{date}','LOCKED#GAME#')
              terminals=query_count(f'LOCKED_PICKS#mlb#{date}','PER_GAME_LOCK_OUTCOME#TMINUS45#')
              rows.append({'slateDateEt':date,'officialGameCount':games,'officialFinalCount':finals,'rawCanonicalLockCount':locks,'rawTerminalNoPredictionCount':terminals,'rawLifecycleCoverageCount':locks+terminals,'rawCountCouldCoverOfficialSet':games>0 and locks+terminals>=games,'sourceUrl':url})
          report={'proofType':'MLB_FORWARD_RAW_IMMUTABLE_LIFECYCLE_COVERAGE','createdAtUtc':datetime.now(timezone.utc).isoformat(),'stackStatus':stack.get('StackStatus'),'trainerHandler':config.get('Handler'),'rows':rows,'secretExposed':False}
          Path('runtime_reports/mlb_forward_raw_lock_coverage_latest.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Commit coverage diagnostic
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime_reports/mlb_forward_raw_lock_coverage_latest.json
          git commit -m 'Publish MLB forward raw lock coverage'
          git push origin HEAD:"$HEAD_BRANCH"
