name: Tennis Status Activity Backstop

on:
  workflow_dispatch:
  schedule:
    # Independent five-minute cadence closes gaps when GitHub delays primary schedules.
    - cron: '*/5 * * * *'
  workflow_run:
    # Bot-authored evidence commits do not reliably emit new push-triggered workflows.
    # Completed recurring workflows provide a token-independent dispatch signal.
    workflows:
      - 'MLB V8 Autonomous Controller'
      - 'MLB Historical Hourly Liveness V1'
      - 'MLB V7 Settled Horizon Resume Deploy'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'runtime_reports/mlb_supervised_shadow_v2_latest.json'
      - 'runtime_reports/mlb_v8_shadow_realtime_72_latest.json'
      - 'runtime_reports/mlb_pull_guard_status_latest.json'
      - 'docs/runtime/mlb-historical-hourly-liveness-latest.json'
      - '.github/workflows/tennis-status-activity-backstop.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: tennis-status-activity-backstop
  cancel-in-progress: false

jobs:
  dispatch-tennis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch fail-closed tennis status backstop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-tennis-autonomy-status-backstop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

  dispatch-mlb-fallback:
    # Intentionally independent from dispatch-tennis. A tennis dispatch failure
    # must never suppress the MLB progress evidence watchdog.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch stale-gated MLB production progress pulse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # force=false preserves the reporter's fail-closed staleness gate and
          # duplicate suppression. This job never invokes AWS or mutates model state.
          gh workflow run mlb-30m-progress-pulse.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f force=false

      - name: Record MLB fallback safety contract
        run: |
          {
            echo '## MLB fallback isolation'
            echo
            echo '- Independent from Tennis dispatch: true'
            echo '- Reporter force: false'
            echo '- AWS/model/lock mutation: false'
          } >> "$GITHUB_STEP_SUMMARY"
