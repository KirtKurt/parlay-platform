name: Deploy isolated MLB Auto V1

on:
  push:
    branches: [agent/mlb-auto-tennis-lifecycle-v1]
    paths:
      - 'mlb_auto/**'
      - '.github/workflows/deploy-mlb-auto-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-auto-v1-isolated-deploy
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-auto-prod

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'

      - name: Validate MLB Auto implementation
        working-directory: mlb_auto
        env:
          PYTHONPATH: src
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          python -m pytest -q
          python scripts/verify_isolation.py
          python -m compileall -q src

      - uses: aws-actions/setup-sam@v2

      - name: Validate and build isolated SAM application
        working-directory: mlb_auto
        run: |
          set -euo pipefail
          sam validate --template-file template.yaml --lint
          rm -rf .aws-sam
          sam build --template-file template.yaml --no-cached

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity and Odds API credential
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          test -n "${ODDS_API_KEY_VALUE:-}" || { echo '::error::Missing ODDS_API_KEY'; exit 1; }

      - name: Fingerprint protected MLB and Tennis stacks
        id: before
        run: |
          set -euo pipefail
          stack_fp() {
            local stack="$1"
            if ! aws cloudformation describe-stacks --stack-name "$stack" >/dev/null 2>&1; then
              printf 'MISSING'
              return
            fi
            {
              aws cloudformation get-template --stack-name "$stack" --query TemplateBody --output text
              aws cloudformation list-stack-resources --stack-name "$stack" --output json
            } | sha256sum | awk '{print $1}'
          }
          echo "mlb=$(stack_fp parlay-platform-dev)" >> "$GITHUB_OUTPUT"
          echo "tennis=$(stack_fp parlay-platform-tennis-ml-prod)" >> "$GITHUB_OUTPUT"

      - name: Deploy MLB Auto with schedules disabled
        working-directory: mlb_auto
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              "ScheduleState=DISABLED" \
              "DeployGitSha=${GITHUB_SHA}"

      - name: Prove live MLB Auto ingestion before activation
        run: |
          set -euo pipefail
          FN=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id AutoFunction \
            --query StackResourceDetail.PhysicalResourceId \
            --output text)
          aws lambda invoke \
            --function-name "$FN" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"MLB_AUTO_HEARTBEAT"}' \
            ingest.json >/tmp/invoke-meta.json
          cat ingest.json
          python - <<'PY'
          import json
          x=json.load(open('ingest.json'))
          assert x.get('ok') is True, x
          assert x.get('action') in ('INGEST','HEARTBEAT_ONLY'), x
          if x.get('action') == 'INGEST':
              assert int(x.get('event_count') or 0) > 0, x
              assert int(x.get('prediction_count') or 0) > 0, x
          PY
          aws lambda invoke \
            --function-name "$FN" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"STATUS"}' \
            status.json >/tmp/status-meta.json
          cat status.json
          python - <<'PY'
          import json
          x=json.load(open('status.json'))
          assert x.get('ok') is True, x
          assert x.get('sport') == 'mlb_auto', x
          assert x.get('provider_sport_key') == 'baseball_mlb', x
          assert x.get('autonomous') is True, x
          assert x.get('cost_throttling') is False, x
          PY

      - name: Enable autonomous schedules
        working-directory: mlb_auto
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              "ScheduleState=ENABLED" \
              "DeployGitSha=${GITHUB_SHA}"

      - name: Verify all autonomous schedules enabled
        run: |
          set -euo pipefail
          aws events list-rules --name-prefix "${STACK_NAME}-" --output json > rules.json
          cat rules.json
          python - <<'PY'
          import json
          rows=json.load(open('rules.json')).get('Rules') or []
          expected=('heartbeat-5m','lock-1m','settle-30m','train-1h','repair-5m')
          names={r.get('Name'):r.get('State') for r in rows}
          for suffix in expected:
              matches=[(n,s) for n,s in names.items() if n and n.endswith(suffix)]
              assert len(matches)==1, (suffix,names)
              assert matches[0][1]=='ENABLED', matches[0]
          PY

      - name: Prove protected stacks unchanged
        env:
          MLB_BEFORE: ${{ steps.before.outputs.mlb }}
          TENNIS_BEFORE: ${{ steps.before.outputs.tennis }}
        run: |
          set -euo pipefail
          stack_fp() {
            local stack="$1"
            if ! aws cloudformation describe-stacks --stack-name "$stack" >/dev/null 2>&1; then
              printf 'MISSING'
              return
            fi
            {
              aws cloudformation get-template --stack-name "$stack" --query TemplateBody --output text
              aws cloudformation list-stack-resources --stack-name "$stack" --output json
            } | sha256sum | awk '{print $1}'
          }
          MLB_AFTER=$(stack_fp parlay-platform-dev)
          TENNIS_AFTER=$(stack_fp parlay-platform-tennis-ml-prod)
          echo "MLB before=$MLB_BEFORE after=$MLB_AFTER"
          echo "Tennis before=$TENNIS_BEFORE after=$TENNIS_AFTER"
          test "$MLB_BEFORE" = "$MLB_AFTER"
          test "$TENNIS_BEFORE" = "$TENNIS_AFTER"

      - name: Write deployment evidence
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json > mlb-auto-stack.json
          aws cloudformation list-stack-resources --stack-name "$STACK_NAME" --output json > mlb-auto-resources.json
          sha256sum mlb-auto-stack.json mlb-auto-resources.json rules.json status.json ingest.json > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mlb-auto-v1-deployment-evidence-${{ github.run_id }}
          path: |
            ingest.json
            status.json
            rules.json
            mlb-auto-stack.json
            mlb-auto-resources.json
            SHA256SUMS
          retention-days: 30
