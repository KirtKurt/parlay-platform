name: Deploy isolated MLB Auto V1

on:
  push:
    branches: [agent/mlb-auto-tennis-lifecycle-v1]
    paths: ['mlb_auto/**', '.github/workflows/deploy-mlb-auto-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-auto-v1-isolated-deploy
  cancel-in-progress: true

env:
  STACK_NAME: parlay-platform-mlb-auto-prod

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate autonomous implementation
        working-directory: mlb_auto
        env:
          PYTHONPATH: src
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
          python -m pytest -q
          python scripts/verify_isolation.py
          python -m compileall -q src
      - uses: aws-actions/setup-sam@v2
      - name: Validate and build isolated SAM application
        working-directory: mlb_auto
        run: |
          set -euo pipefail
          sam validate --template-file template.yaml --lint
          rm -rf .aws-sam
          sam build --template-file template.yaml --no-cached
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Verify AWS and provider credential
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          test -n "${ODDS_API_KEY_VALUE:-}" || { echo '::error::Missing ODDS_API_KEY'; exit 1; }
      - name: Fingerprint protected stacks
        id: before
        run: |
          set -euo pipefail
          fp() { local s="$1"; if ! aws cloudformation describe-stacks --stack-name "$s" >/dev/null 2>&1; then printf MISSING; return; fi; { aws cloudformation get-template --stack-name "$s" --output json; aws cloudformation list-stack-resources --stack-name "$s" --output json; } | sha256sum | awk '{print $1}'; }
          echo "mlb=$(fp parlay-platform-dev)" >> "$GITHUB_OUTPUT"
          echo "tennis=$(fp parlay-platform-tennis-ml-prod)" >> "$GITHUB_OUTPUT"
      - name: Deploy schedule-disabled canary
        working-directory: mlb_auto
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          sam deploy --template-file .aws-sam/build/template.yaml --stack-name "$STACK_NAME" --capabilities CAPABILITY_IAM --resolve-s3 --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "OddsApiKey=${ODDS_API_KEY_VALUE}" "ScheduleState=DISABLED" "DeployGitSha=${GITHUB_SHA}"
      - name: Live provider, historical, and runtime proof
        run: |
          set -euo pipefail
          FN=$(aws cloudformation describe-stack-resource --stack-name "$STACK_NAME" --logical-resource-id AutoFunction --query StackResourceDetail.PhysicalResourceId --output text)
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out --payload '{"action":"MLB_AUTO_HEARTBEAT"}' ingest.json >/dev/null
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out --payload '{"action":"MLB_AUTO_HISTORICAL_BACKFILL"}' history.json >/dev/null
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out --payload '{"action":"STATUS"}' status.json >/dev/null
          cat ingest.json; cat history.json; cat status.json
          python - <<'PY'
          import json
          i=json.load(open('ingest.json')); h=json.load(open('history.json')); s=json.load(open('status.json'))
          assert i.get('ok') is True, i
          assert i.get('action') in ('INGEST','HEARTBEAT_ONLY'), i
          if i.get('action')=='INGEST':
              assert int(i.get('event_count') or 0)>0, i
              assert int(i.get('prediction_count') or 0)>0, i
          assert h.get('ok') is True and h.get('action')=='HISTORICAL_BACKFILL', h
          assert int(h.get('attempted') or 0)>0, h
          assert int(h.get('added') or 0)>0, h
          assert int(h.get('training_examples') or 0)>0, h
          assert s.get('ok') is True and s.get('sport')=='mlb_auto', s
          assert s.get('provider_sport_key')=='baseball_mlb' and s.get('autonomous') is True, s
          assert s.get('cost_throttling') is False, s
          PY
      - name: Enable autonomous schedules
        working-directory: mlb_auto
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          sam deploy --template-file .aws-sam/build/template.yaml --stack-name "$STACK_NAME" --capabilities CAPABILITY_IAM --resolve-s3 --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "OddsApiKey=${ODDS_API_KEY_VALUE}" "ScheduleState=ENABLED" "DeployGitSha=${GITHUB_SHA}"
      - name: Verify schedules and protected stacks
        env:
          MLB_BEFORE: ${{ steps.before.outputs.mlb }}
          TENNIS_BEFORE: ${{ steps.before.outputs.tennis }}
        run: |
          set -euo pipefail
          aws events list-rules --name-prefix "${STACK_NAME}-" --output json > rules.json
          python - <<'PY'
          import json
          rows=json.load(open('rules.json')).get('Rules') or []
          names={r.get('Name'):r.get('State') for r in rows}
          for suffix in ('heartbeat-5m','lock-1m','settle-30m','train-1h','repair-5m','history-15m'):
              m=[(n,s) for n,s in names.items() if n and n.endswith(suffix)]
              assert len(m)==1 and m[0][1]=='ENABLED', (suffix,names)
          PY
          fp() { local s="$1"; if ! aws cloudformation describe-stacks --stack-name "$s" >/dev/null 2>&1; then printf MISSING; return; fi; { aws cloudformation get-template --stack-name "$s" --output json; aws cloudformation list-stack-resources --stack-name "$s" --output json; } | sha256sum | awk '{print $1}'; }
          test "$MLB_BEFORE" = "$(fp parlay-platform-dev)"
          test "$TENNIS_BEFORE" = "$(fp parlay-platform-tennis-ml-prod)"
      - name: Capture deployment evidence
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json > stack.json
          aws cloudformation list-stack-resources --stack-name "$STACK_NAME" --output json > resources.json
          sha256sum ingest.json history.json status.json rules.json stack.json resources.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-auto-v1-deployment-evidence-${{ github.run_id }}
          path: |
            ingest.json
            history.json
            status.json
            rules.json
            stack.json
            resources.json
            SHA256SUMS
          retention-days: 30
