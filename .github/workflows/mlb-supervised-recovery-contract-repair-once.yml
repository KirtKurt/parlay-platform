name: MLB Supervised Recovery Contract Repair Once

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-supervised-recovery-contract-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mlb-supervised-recovery-contract-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical recovery for versioned supervised rematerialization
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          workflow_path=Path('.github/workflows/mlb-historical-v7-recovery.yml')
          self_path=Path('.github/workflows/mlb-supervised-recovery-contract-repair-once.yml')
          text=workflow_path.read_text()

          trigger_anchor="      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'\n"
          trigger_rows=(
              trigger_anchor
              + "      - 'hello_world/mlb_supervised_v8_dataset_patch_v1.py'\n"
              + "      - 'hello_world/mlb_supervised_features_v2.py'\n"
              + "      - 'hello_world/mlb_supervised_model_v2.py'\n"
              + "      - 'tests/unit/test_mlb_historical_feature_rematerialization_v1.py'\n"
              + "      - 'tests/unit/test_mlb_supervised_v2_runtime_integration.py'\n"
              + "      - 'tests/unit/test_mlb_supervised_shadow_v2.py'\n"
          )
          if "      - 'hello_world/mlb_supervised_v8_dataset_patch_v1.py'\n" not in text:
              assert text.count(trigger_anchor)==1, 'recovery trigger anchor changed'
              text=text.replace(trigger_anchor,trigger_rows,1)

          env_anchor="  HISTORICAL_MAX_OPTIMIZATION_ROUNDS: '12'\n"
          if "  EXPECTED_FEATURE_DATASET: 'MLB-HISTORICAL-FEATURE-DATASET-v8-supervised-trainable'\n" not in text:
              assert text.count(env_anchor)==1, 'recovery env anchor changed'
              text=text.replace(
                  env_anchor,
                  env_anchor+"  EXPECTED_FEATURE_DATASET: 'MLB-HISTORICAL-FEATURE-DATASET-v8-supervised-trainable'\n",
                  1,
              )

          compile_anchor='            hello_world/mlb_odds_pattern_features_v1.py \\\n'
          compile_rows=(
              compile_anchor
              + '            hello_world/mlb_supervised_v8_dataset_patch_v1.py \\\n'
              + '            hello_world/mlb_supervised_features_v2.py \\\n'
              + '            hello_world/mlb_supervised_model_v2.py \\\n'
          )
          if '            hello_world/mlb_supervised_v8_dataset_patch_v1.py \\\n' not in text:
              assert text.count(compile_anchor)==1, 'recovery compile anchor changed'
              text=text.replace(compile_anchor,compile_rows,1)

          test_anchor='            tests/unit/test_mlb_historical_competitive_schedule_filter.py\n'
          test_rows=(
              '            tests/unit/test_mlb_historical_competitive_schedule_filter.py \\\n'
              + '            tests/unit/test_mlb_historical_feature_rematerialization_v1.py \\\n'
              + '            tests/unit/test_mlb_supervised_v2_runtime_integration.py \\\n'
              + '            tests/unit/test_mlb_supervised_shadow_v2.py\n'
          )
          if '            tests/unit/test_mlb_supervised_v2_runtime_integration.py \\\n' not in text:
              assert text.count(test_anchor)==1, 'recovery test anchor changed'
              text=text.replace(test_anchor,test_rows,1)

          artifact_anchor='          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_odds_pattern_features_v1.py\n'
          artifact_rows=(
              artifact_anchor
              + '          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_supervised_v8_dataset_patch_v1.py\n'
              + '          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_supervised_features_v2.py\n'
              + '          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_supervised_model_v2.py\n'
          )
          if 'HistoricalOptimizerFunction/mlb_supervised_v8_dataset_patch_v1.py' not in text:
              assert text.count(artifact_anchor)==1, 'recovery artifact anchor changed'
              text=text.replace(artifact_anchor,artifact_rows,1)

          text=text.replace('for attempt in $(seq 1 18); do','for attempt in $(seq 1 120); do',1)
          text=text.replace('test "$attempt" != 18','test "$attempt" != 120',1)

          decision_old="""          state=value.get('state') or {}
          status=str(value.get('status') or state.get('phase') or '')
          if status == 'LEASE_HELD':
              print('RETRY')
          elif status in {'BACKFILLING','OPTIMIZING'}:
              print('READY')
          else:
              print('RETRY')
"""
          decision_new="""          state=value.get('state') or {}
          status=str(value.get('status') or state.get('phase') or '')
          expected=os.environ['EXPECTED_FEATURE_DATASET']
          rematerialized=int(state.get('featureRematerializedSlateCount') or 0)
          total=int(state.get('featureRematerializationTotalSlateCount') or 0)
          complete=bool(
              state.get('featureDatasetVersion') == expected
              and state.get('featureRematerializationComplete') is True
              and total > 0
              and rematerialized == total
              and not (state.get('featureRematerializationErrors') or [])
          )
          if status == 'LEASE_HELD':
              print('RETRY')
          elif status in {'BACKFILLING','OPTIMIZING'} and complete:
              print('READY')
          else:
              print('RETRY')
"""
          if "expected=os.environ['EXPECTED_FEATURE_DATASET']" not in text:
              assert text.count(decision_old)==1, 'recovery rematerialization decision anchor changed'
              text=text.replace(decision_old,decision_new,1)

          check_anchor="              'rematerializationComplete':a.get('featureRematerializationComplete') is True,\n"
          dataset_check="              'supervisedFeatureDatasetActive':a.get('featureDatasetVersion') == os.environ['EXPECTED_FEATURE_DATASET'],\n"
          if dataset_check not in text:
              assert text.count(check_anchor)==1, 'recovery final check anchor changed'
              text=text.replace(check_anchor,dataset_check+check_anchor,1)

          identity_anchor="              'maximumRounds':env.get('MLB_HISTORICAL_MAX_OPTIMIZATION_ROUNDS') == '12',\n"
          batch_check="              'rematerializationBatch':env.get('MLB_HISTORICAL_REMATERIALIZE_SLATES_PER_RUN') == '5',\n"
          if batch_check not in text:
              assert text.count(identity_anchor)==1, 'recovery identity anchor changed'
              text=text.replace(identity_anchor,identity_anchor+batch_check,1)

          assert 'for attempt in $(seq 1 120); do' in text
          assert 'test "$attempt" != 120' in text
          assert "expected=os.environ['EXPECTED_FEATURE_DATASET']" in text
          assert "'supervisedFeatureDatasetActive'" in text
          assert "'rematerializationBatch'" in text
          workflow_path.write_text(text)
          self_path.unlink()
          PY
          git diff --check
          grep -Fq "EXPECTED_FEATURE_DATASET: 'MLB-HISTORICAL-FEATURE-DATASET-v8-supervised-trainable'" .github/workflows/mlb-historical-v7-recovery.yml
          grep -Fq 'for attempt in $(seq 1 120); do' .github/workflows/mlb-historical-v7-recovery.yml
          grep -Fq "'supervisedFeatureDatasetActive'" .github/workflows/mlb-historical-v7-recovery.yml
          test ! -e .github/workflows/mlb-supervised-recovery-contract-repair-once.yml

      - name: Publish canonical recovery repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/mlb-historical-v7-recovery.yml .github/workflows/mlb-supervised-recovery-contract-repair-once.yml
          git commit -m 'Make MLB recovery complete supervised rematerialization'
          for attempt in 1 2 3 4 5 6; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Dispatch repaired recovery and supervised evaluator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for workflow in mlb-historical-v7-recovery.yml mlb-supervised-shadow-v2.yml; do
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref=main
          done
