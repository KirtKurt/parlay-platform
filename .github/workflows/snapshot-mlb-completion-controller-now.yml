name: Snapshot MLB completion controller now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-mlb-completion-controller-now.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture latest repair workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_reports /tmp/mlb-completion-runs
          workflows=(
            install-mlb-titan-native-recovery-v3.yml
            deploy-mlb-auto-llm.yml
            finalize-mlb-root-settlement-training-now.yml
            complete-mlb-production-repair-now.yml
          )
          for workflow in "${workflows[@]}"; do
            safe=${workflow//[^A-Za-z0-9]/_}
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=10" \
              > "/tmp/mlb-completion-runs/${safe}.json"
          done
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          names=(
              'install-mlb-titan-native-recovery-v3.yml',
              'deploy-mlb-auto-llm.yml',
              'finalize-mlb-root-settlement-training-now.yml',
              'complete-mlb-production-repair-now.yml',
          )
          def safe(name):
              return ''.join(ch if ch.isalnum() else '_' for ch in name)
          def rows(name):
              payload=json.loads(Path('/tmp/mlb-completion-runs',safe(name)+'.json').read_text())
              return [{
                  'id':r.get('id'),
                  'status':r.get('status'),
                  'conclusion':r.get('conclusion'),
                  'headSha':r.get('head_sha'),
                  'createdAtUtc':r.get('created_at'),
                  'updatedAtUtc':r.get('updated_at'),
                  'htmlUrl':r.get('html_url'),
              } for r in (payload.get('workflow_runs') or [])]
          report={
              'proofType':'MLB_COMPLETION_CONTROLLER_RUN_SNAPSHOT',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'workflows':{name:rows(name) for name in names},
          }
          Path('/tmp/mlb_completion_controller_runs_latest.json').write_text(
              json.dumps(report,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Publish snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mlb_completion_controller_runs_latest.json runtime_reports/mlb_completion_controller_runs_latest.json
            git add runtime_reports/mlb_completion_controller_runs_latest.json
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB completion controller run snapshot [skip ci]'
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1
