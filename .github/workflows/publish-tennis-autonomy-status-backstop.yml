name: Tennis Autonomy Status Backstop

on:
  workflow_dispatch:
  schedule:
    # Backstop only; the primary publisher runs more frequently.
    - cron: '8,28,48 * * * *'
  workflow_run:
    # Run directly after recurring workflows so bot-authored commits and delayed cron schedules
    # cannot leave tennis evidence stale. The freshness check keeps this bounded and fail-closed.
    workflows:
      - 'MLB V8 Autonomous Controller'
      - 'MLB Historical Hourly Liveness V1'
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-tennis-autonomy-status-backstop.yml'

permissions:
  contents: write

concurrency:
  group: publish-tennis-autonomy-status-backstop
  cancel-in-progress: false

jobs:
  publish-if-needed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check checked-in evidence freshness
        id: freshness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          needed = True
          path = Path('runtime/tennis_autonomy_status.json')
          if path.exists():
              try:
                  payload = json.loads(path.read_text())
                  raw = payload.get('checked_at')
                  if raw:
                      stamp = datetime.fromisoformat(str(raw).replace('Z', '+00:00'))
                      age = (datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds()
                      needed = age > 1200
              except Exception:
                  needed = True
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f"needed={'true' if needed else 'false'}\n")
          print({'publish_needed': needed})
          PY

      - name: Configure AWS credentials
        if: steps.freshness.outputs.needed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Query, self-heal, and build fresh snapshot
        if: steps.freshness.outputs.needed == 'true'
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-tennis-learning
          stale_after_seconds=1500

          stack_status=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$REGION" \
            --query 'Stacks[0].StackStatus' --output text)
          test "$stack_status" = UPDATE_COMPLETE

          status_endpoint=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" \
            --output text)
          run_endpoint=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyRunApi'].OutputValue" \
            --output text)
          test -n "$status_endpoint" && test "$status_endpoint" != None
          test -n "$run_endpoint" && test "$run_endpoint" != None

          curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 \
            "$status_endpoint" -o /tmp/tennis-live.json

          stale=$(STALE_AFTER_SECONDS="$stale_after_seconds" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = json.load(open('/tmp/tennis-live.json'))
          raw = payload.get('last_cycle_at')
          if not raw:
              print('true')
          else:
              stamp = datetime.fromisoformat(str(raw).replace('Z', '+00:00'))
              age = (datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds()
              print('true' if age > int(os.environ['STALE_AFTER_SECONDS']) else 'false')
          PY
          )

          repaired=false
          if [ "$stale" = true ]; then
            curl -fsS --retry 2 --retry-all-errors --retry-delay 10 \
              -X POST --max-time 900 "$run_endpoint" -o /tmp/tennis-repair.json
            repaired=true
            sleep 5
            curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 \
              "$status_endpoint" -o /tmp/tennis-live.json
          fi

          STACK_STATUS="$stack_status" REPAIRED="$repaired" SOURCE_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          live = json.load(open('/tmp/tennis-live.json'))
          training = int(live.get('training_samples') or 0)
          audited = int(live.get('live_audit_count') or 0)
          accuracy = float(live['live_accuracy']) if live.get('live_accuracy') is not None else None
          brier = float(live['live_brier']) if live.get('live_brier') is not None else None
          failures = int(live.get('consecutive_failures') or 0)
          authority = str(live.get('authority') or 'UNKNOWN')
          last_cycle = live.get('last_cycle_at')
          age = None
          fresh = False
          if last_cycle:
              stamp = datetime.fromisoformat(str(last_cycle).replace('Z', '+00:00'))
              age = round(max(0.0, (now - stamp.astimezone(timezone.utc)).total_seconds() / 60.0), 2)
              fresh = age <= 25.0
          gates = {
              'training_samples_100': training >= 100,
              'live_audits_30': audited >= 30,
              'live_accuracy_55pct': accuracy is not None and accuracy >= 0.55,
              'brier_at_most_0_25': brier is not None and brier <= 0.25,
              'circuit_breaker_clear': failures < 3 and authority != 'DEGRADED',
          }
          repaired = os.environ.get('REPAIRED') == 'true'
          snapshot = {
              'all_promotion_gates_pass': all(gates.values()),
              'authority': authority,
              'automatic_prediction_allowed': bool(live.get('automatic_prediction_allowed', False)),
              'checked_at': now.isoformat(),
              'consecutive_failures': failures,
              'cycle_age_minutes': age,
              'cycle_fresh': fresh,
              'cycle_stale_before_repair': repaired,
              'expected_cycle_cadence_minutes': 15,
              'historical_backfill_enabled': live.get('historical_backfill_enabled'),
              'historical_backfill_required': live.get('historical_backfill_required'),
              'last_cycle_at': last_cycle,
              'last_error': live.get('last_error'),
              'last_warning': live.get('last_warning'),
              'live_accuracy': accuracy,
              'live_audit_count': audited,
              'live_brier': brier,
              'model_version': str(live.get('model_version')) if live.get('model_version') is not None else None,
              'operationally_healthy': (
                  os.environ.get('STACK_STATUS') == 'UPDATE_COMPLETE'
                  and fresh
                  and failures < 3
                  and authority != 'DEGRADED'
                  and not live.get('last_error')
              ),
              'promotion_gates': gates,
              'query_error': None,
              'query_succeeded': True,
              'reason': live.get('reason'),
              'self_heal_attempted': repaired,
              'self_heal_error': None,
              'self_heal_succeeded': repaired and fresh,
              'service': live.get('service'),
              'source_commit': os.environ.get('SOURCE_SHA'),
              'stack_status': os.environ.get('STACK_STATUS'),
              'stale_after_minutes': 25.0,
              'status_endpoint_available': True,
              'training_samples': training,
          }
          if not snapshot['operationally_healthy']:
              raise SystemExit('tennis runtime did not verify healthy after backstop repair')
          Path('/tmp/tennis_autonomy_status.json').write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(snapshot, indent=2, sort_keys=True))
          PY

      - name: Publish fresh snapshot
        if: steps.freshness.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p runtime
            cp /tmp/tennis_autonomy_status.json runtime/tennis_autonomy_status.json
            git add runtime/tennis_autonomy_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish tennis autonomy backstop status [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update blocked attempt $attempt; retrying"
            sleep 3
          done
          exit 1
