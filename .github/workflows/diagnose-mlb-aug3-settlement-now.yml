name: Diagnose MLB August 3 settlement now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mlb-aug3-settlement-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-mlb-aug3-settlement-now
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Invoke exact protected status and settlement routes
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2'
          mkdir -p runtime_reports
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          import boto3
          from botocore.config import Config

          region='us-east-1'
          stack='parlay-platform-dev'
          slate='2026-08-03'
          cf=boto3.client('cloudformation', region_name=region)
          lam=boto3.client('lambda', region_name=region, config=Config(read_timeout=420, connect_timeout=10, retries={'total_max_attempts':1,'mode':'standard'}))

          def physical(logical):
              return cf.describe_stack_resource(StackName=stack, LogicalResourceId=logical)['StackResourceDetail']['PhysicalResourceId']

          def invoke(name, event):
              response=lam.invoke(FunctionName=name, InvocationType='RequestResponse', Payload=json.dumps(event,separators=(',',':')).encode())
              raw=response['Payload'].read().decode('utf-8')
              outer=json.loads(raw)
              body=outer.get('body')
              if isinstance(body,str):
                  try: body=json.loads(body)
                  except Exception: body={'rawBody':body[:12000]}
              return {
                  'lambdaStatusCode':response.get('StatusCode'),
                  'functionError':response.get('FunctionError'),
                  'applicationStatusCode':outer.get('statusCode'),
                  'body':body if isinstance(body,dict) else outer,
              }

          lock=physical('MLBDailyPickLockFunction')
          results=physical('MLBResultsSchedulerFunction')
          status=invoke(lock, {'httpMethod':'GET','path':'/v1/mlb/locks/status','queryStringParameters':{'date':slate}})
          settlement=invoke(results, {'sport':'mlb','run':'diagnose_protected_settlement','slate_date':slate,'days_from':0,'legacy_diagnostic':False})
          report={
              'proofType':'MLB_PROTECTED_SETTLEMENT_BLOCKER_DIAGNOSTIC',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'slateDateEt':slate,
              'readOnlyLockStatus':status,
              'protectedSettlement':settlement,
              'directTableWrite':False,
              'immutablePredictionRewriteAllowed':False,
              'postStartPredictionCreationAllowed':False,
              'secretExposed':False,
          }
          report['ok']=settlement.get('applicationStatusCode') == 200 and (settlement.get('body') or {}).get('ok') is True
          Path('runtime_reports/mlb_aug3_settlement_diagnostic_latest.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          PY
      - name: Publish diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git add runtime_reports/mlb_aug3_settlement_diagnostic_latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish exact MLB August 3 settlement blocker [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              test "$attempt" != 5 || exit 1
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 2))
            done
          fi

