# Merge-triggered execution
name: Unstall MLB Algorithms Install Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-unstall-algorithms-install-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: mlb-unstall-algorithms-install-once
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic anti-stall repairs
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, value):
              Path(path).write_text(value)

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise AssertionError(f"missing patch anchor: {label}")
              if text.count(old) != 1:
                  raise AssertionError(f"non-unique patch anchor: {label} count={text.count(old)}")
              return text.replace(old, new, 1)

          def clean_publisher(text, checkout_line, label):
              hardened = (
                  checkout_line
                  + "\n            git reset --hard origin/main"
                  + "\n            git clean -fd"
              )
              if hardened in text:
                  return text
              return replace_once(text, checkout_line, hardened, label)

          trainer_path = ".github/workflows/mlb-supervised-shadow-v2-recurring.yml"
          trainer = read(trainer_path)
          workflow_run = (
              "  workflow_run:\n"
              "    workflows:\n"
              "      - MLB V8 Historical BBD Prior-Game Backfill\n"
              "    types:\n"
              "      - completed\n"
          )
          trainer = trainer.replace(workflow_run, "", 1)
          trainer = trainer.replace("    - cron: '17 * * * *'", "    - cron: '7 * * * *'", 1)
          trainer = trainer.replace(
              "      - 'runtime_reports/mlb_v8_historical_bbs_backfill_latest.json'\n",
              "",
              1,
          )
          trainer = trainer.replace(
              "    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'\n",
              "",
              1,
          )
          old_ref = "          ref: $" + "{{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}\n"
          new_ref = "          ref: $" + "{{ github.sha }}\n"
          trainer = trainer.replace(old_ref, new_ref, 1)
          trainer = replace_once(
              trainer,
              "      - name: Publish latest supervised evidence monotonically\n        if: always()\n",
              "      - name: Publish latest supervised evidence monotonically\n        if: steps.evaluation.outcome == 'success'\n",
              "trainer-success-only-publication",
          )
          trainer = clean_publisher(
              trainer,
              "            git checkout -B mlb-supervised-recurring-proof origin/main",
              "trainer-clean-publisher",
          )
          write(trainer_path, trainer)

          context_path = ".github/workflows/mlb-v8-historical-context-backfill.yml"
          context = read(context_path)
          context = replace_once(
              context,
              "concurrency:\n  group: mlb-v8-historical-context-backfill\n  cancel-in-progress: true\n",
              "concurrency:\n  group: mlb-v8-historical-context-backfill\n  cancel-in-progress: false\n",
              "context-serialize",
          )
          dispatch_start = "      - name: Dispatch fresh supervised shadow evaluation\n"
          enforce_start = "      - name: Enforce successful context materialization\n"
          if dispatch_start in context:
              before, tail = context.split(dispatch_start, 1)
              _dispatch, after = tail.split(enforce_start, 1)
              context = before + enforce_start + after
          context = clean_publisher(
              context,
              "            git checkout -B mlb-v8-historical-context-proof origin/main",
              "context-clean-publisher",
          )
          write(context_path, context)

          bbd_path = ".github/workflows/mlb-v8-historical-bbs-backfill.yml"
          bbd = read(bbd_path)
          bbd = clean_publisher(
              bbd,
              "            git checkout -B mlb-v8-historical-bbd-prior-proof origin/main",
              "bbd-clean-publisher",
          )
          write(bbd_path, bbd)

          realtime_path = ".github/workflows/mlb-v8-shadow-realtime-72.yml"
          realtime = read(realtime_path)
          realtime = realtime.replace("    - cron: '7 * * * *'", "    - cron: '27 * * * *'", 1)
          realtime = clean_publisher(
              realtime,
              "            git checkout -B mlb-v8-shadow-proof origin/main",
              "realtime-clean-publisher",
          )
          write(realtime_path, realtime)

          v7_path = ".github/workflows/mlb-historical-supervised-v9-shadow.yml"
          v7 = read(v7_path)
          v7 = clean_publisher(
              v7,
              "            git checkout -B mlb-supervised-v9-proof origin/main",
              "v7-clean-publisher",
          )
          write(v7_path, v7)

          context_test_path = "tests/unit/test_mlb_v8_historical_context_workflow.py"
          context_test = read(context_test_path)
          context_test = replace_once(
              context_test,
              '    assert "mlb-supervised-shadow-v2-recurring.yml" in text\n',
              '    assert "mlb-supervised-shadow-v2-recurring.yml" not in text\n'
              '    assert "cancel-in-progress: false" in text\n'
              '    assert "git reset --hard origin/main" in text\n'
              '    assert "git clean -fd" in text\n',
              "context-workflow-test",
          )
          write(context_test_path, context_test)

          bbd_test_path = "tests/unit/test_mlb_v8_bbd_post_backfill_workflow_contract.py"
          write(
              bbd_test_path,
              """from pathlib import Path\n\n\ndef test_supervised_workflow_runs_once_per_hour_after_backfills():\n    trainer = Path('.github/workflows/mlb-supervised-shadow-v2-recurring.yml').read_text()\n    context = Path('.github/workflows/mlb-v8-historical-context-backfill.yml').read_text()\n\n    assert 'workflow_run:' not in trainer\n    assert \"cron: '7 * * * *'\" in trainer\n    assert 'mlb_v8_historical_bbs_backfill_latest.json' not in trainer\n    assert \"if: steps.evaluation.outcome == 'success'\" in trainer\n    assert 'cancel-in-progress: false' in trainer\n    assert 'gh workflow run mlb-supervised-shadow-v2-recurring.yml' not in context\n    assert 'cancel-in-progress: false' in context\n\n\ndef test_mlb_publishers_refresh_clean_main_before_monotonic_compare():\n    paths = [\n        '.github/workflows/mlb-supervised-shadow-v2-recurring.yml',\n        '.github/workflows/mlb-v8-historical-context-backfill.yml',\n        '.github/workflows/mlb-v8-historical-bbs-backfill.yml',\n        '.github/workflows/mlb-v8-shadow-realtime-72.yml',\n        '.github/workflows/mlb-historical-supervised-v9-shadow.yml',\n    ]\n    for path in paths:\n        text = Path(path).read_text()\n        assert 'git reset --hard origin/main' in text, path\n        assert 'git clean -fd' in text, path\n\n\ndef test_realtime_shadow_is_staggered_after_trainer():\n    text = Path('.github/workflows/mlb-v8-shadow-realtime-72.yml').read_text()\n    assert \"cron: '27 * * * *'\" in text\n""",
          )

          integration_path = "tests/unit/test_mlb_supervised_v2_runtime_integration.py"
          integration = read(integration_path)
          addition = (
              "\n\ndef test_recurring_trainer_never_publishes_cancelled_failure_as_latest():\n"
              "    source = Path(\".github/workflows/mlb-supervised-shadow-v2-recurring.yml\").read_text()\n"
              "    assert \"workflow_run:\" not in source\n"
              "    assert \"if: steps.evaluation.outcome == 'success'\" in source\n"
              "    assert \"git reset --hard origin/main\" in source\n"
              "    assert \"git clean -fd\" in source\n"
              "    assert \"cancel-in-progress: false\" in source\n"
          )
          if "test_recurring_trainer_never_publishes_cancelled_failure_as_latest" not in integration:
              integration += addition
          write(integration_path, integration)

          self_path = Path(".github/workflows/mlb-unstall-algorithms-install-once.yml")
          self_path.unlink()

          assert "workflow_run:" not in read(trainer_path)
          assert "if: steps.evaluation.outcome == 'success'" in read(trainer_path)
          assert "gh workflow run mlb-supervised-shadow-v2-recurring.yml" not in read(context_path)
          assert "cancel-in-progress: false" in read(context_path)
          PY

      - name: Validate anti-stall contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'pyyaml>=6,<7' 'boto3>=1.34,<2' 'numpy>=1.26,<3'
          python - <<'PY'
          import yaml
          from pathlib import Path
          paths = [
              ".github/workflows/mlb-supervised-shadow-v2-recurring.yml",
              ".github/workflows/mlb-v8-historical-context-backfill.yml",
              ".github/workflows/mlb-v8-historical-bbs-backfill.yml",
              ".github/workflows/mlb-v8-shadow-realtime-72.yml",
              ".github/workflows/mlb-historical-supervised-v9-shadow.yml",
          ]
          for path in paths:
              value = yaml.safe_load(Path(path).read_text())
              assert isinstance(value, dict), path
              assert value.get("jobs"), path
          PY
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_v8_historical_context_workflow.py \
            tests/unit/test_mlb_v8_bbd_post_backfill_workflow_contract.py \
            tests/unit/test_mlb_supervised_v2_runtime_integration.py \
            tests/unit/test_publish_monotonic_json.py
          git diff --check

      - name: Publish repairs atomically
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/mlb-supervised-shadow-v2-recurring.yml \
            .github/workflows/mlb-v8-historical-context-backfill.yml \
            .github/workflows/mlb-v8-historical-bbs-backfill.yml \
            .github/workflows/mlb-v8-shadow-realtime-72.yml \
            .github/workflows/mlb-historical-supervised-v9-shadow.yml \
            tests/unit/test_mlb_v8_historical_context_workflow.py \
            tests/unit/test_mlb_v8_bbd_post_backfill_workflow_contract.py \
            tests/unit/test_mlb_supervised_v2_runtime_integration.py \
            .github/workflows/mlb-unstall-algorithms-install-once.yml
          git commit -m 'Unstall MLB training and evidence pipelines'
          for attempt in 1 2 3 4 5 6; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Dispatch clean verification cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mlb-supervised-shadow-v2-recurring.yml --ref main
          gh workflow run mlb-historical-supervised-v9-shadow.yml --ref main
          gh workflow run mlb-v8-historical-context-backfill.yml --ref main -f limit=10
