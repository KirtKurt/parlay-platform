name: Repair MLB Auto direct read once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-auto-direct-read-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-mlb-auto-direct-read-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - name: Install MLB Auto direct-read patch
        run: python scripts/repair_mlb_auto_direct_read_once.py

      - name: Verify isolated MLB Auto repair
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m py_compile mlb_auto_llm/ml_authority.py mlb_auto_llm/ml_authority_smoke.py
          PYTHONPATH=mlb_auto_llm python -m pytest -q tests/unit/test_mlb_auto_model_gateway.py tests/unit/test_mlb_auto_ml_authority.py
          sam validate --template-file mlb-auto-llm-template.yaml --lint
          git diff --check
          changed=$(git diff --name-only | grep -v '^.github/workflows/repair-mlb-auto-direct-read-once.yml$' | grep -v '^scripts/repair_mlb_auto_direct_read_once.py$' || true)
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(mlb_auto_llm/|mlb-auto-llm-template.yaml$|.github/workflows/deploy-mlb-auto-llm.yml$)'; then
            echo '::error::Repair escaped MLB Auto isolation'
            exit 1
          fi

      - name: Commit tested repair and dispatch canonical deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-mlb-auto-direct-read-once.yml scripts/repair_mlb_auto_direct_read_once.py
          git add mlb_auto_llm/ml_authority.py mlb-auto-llm-template.yaml .github/workflows/deploy-mlb-auto-llm.yml
          git commit -m 'Route MLB Auto model reads directly through AWS Lambda'
          git pull --rebase origin main
          git push origin HEAD:main
          sleep 5
          gh workflow run deploy-mlb-auto-llm.yml --ref main
