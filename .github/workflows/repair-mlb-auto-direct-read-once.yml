name: Repair MLB Auto direct read once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-auto-direct-read-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-mlb-auto-direct-read-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - name: Install direct Lambda read repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          authority = Path('mlb_auto_llm/ml_authority.py')
          text = authority.read_text(encoding='utf-8')
          if 'import boto3\n' not in text:
              text = text.replace(
                  'import urllib.request\nfrom datetime import datetime, timezone\n',
                  'import urllib.request\n\nimport boto3\nfrom datetime import datetime, timezone\n',
                  1,
              )
          if 'READ_FUNCTION_NAME = os.environ.get("MLB_AUTO_ML_READ_FUNCTION", "").strip()' not in text:
              text = text.replace(
                  'API_BASE_URL = os.environ.get("MLB_AUTO_ML_API_BASE_URL", "").rstrip("/")\n',
                  'API_BASE_URL = os.environ.get("MLB_AUTO_ML_API_BASE_URL", "").rstrip("/")\nREAD_FUNCTION_NAME = os.environ.get("MLB_AUTO_ML_READ_FUNCTION", "").strip()\n',
                  1,
              )

          old = '''def _http_json(path: str, params: Optional[Dict[str, Any]] = None) -> Dict[str, Any]:
    if not API_BASE_URL:
        raise RuntimeError("MLB_AUTO_ML_API_BASE_URL_MISSING")
    query = urllib.parse.urlencode(
        {key: value for key, value in (params or {}).items() if value is not None}
    )
    url = API_BASE_URL + "/" + path.lstrip("/")
    if query:
        url += "?" + query
    request = urllib.request.Request(
        url,
        headers={
            "accept": "application/json",
            "user-agent": "inqsi-mlb-auto-ml-authority/1.0",
        },
    )
    timeout_seconds = float(os.environ.get("MLB_AUTO_ML_HTTP_TIMEOUT_SECONDS", "60"))
    with urllib.request.urlopen(request, timeout=timeout_seconds) as response:
        payload = json.loads(response.read().decode("utf-8"))
    if not isinstance(payload, dict):
        raise RuntimeError("MLB_ML_API_RESPONSE_NOT_OBJECT")
    return payload
'''
          new = '''def _direct_lambda_json(path: str, params: Optional[Dict[str, Any]] = None) -> Dict[str, Any]:
    if not READ_FUNCTION_NAME:
        raise RuntimeError("MLB_AUTO_ML_READ_FUNCTION_MISSING")
    query = {
        str(key): str(value)
        for key, value in (params or {}).items()
        if value is not None
    }
    event = {
        "rawPath": path,
        "path": path,
        "httpMethod": "GET",
        "requestContext": {"http": {"method": "GET", "path": path}},
        "queryStringParameters": query,
    }
    response = boto3.client("lambda").invoke(
        FunctionName=READ_FUNCTION_NAME,
        InvocationType="RequestResponse",
        Payload=json.dumps(event).encode("utf-8"),
    )
    raw = response["Payload"].read()
    envelope = json.loads(raw.decode("utf-8")) if raw else {}
    if response.get("FunctionError"):
        raise RuntimeError(
            "MLB_ML_DIRECT_READ_FUNCTION_ERROR:"
            + json.dumps(envelope, sort_keys=True, default=str)[:2000]
        )
    if not isinstance(envelope, dict):
        raise RuntimeError("MLB_ML_DIRECT_READ_ENVELOPE_NOT_OBJECT")
    status = int(envelope.get("statusCode") or 200)
    body = envelope.get("body", envelope)
    payload = json.loads(body) if isinstance(body, str) else body
    if status >= 400:
        raise RuntimeError(
            f"MLB_ML_DIRECT_READ_HTTP_{status}:"
            + json.dumps(payload, sort_keys=True, default=str)[:2000]
        )
    if not isinstance(payload, dict):
        raise RuntimeError("MLB_ML_API_RESPONSE_NOT_OBJECT")
    return payload


def _http_json(path: str, params: Optional[Dict[str, Any]] = None) -> Dict[str, Any]:
    # API Gateway has a hard integration timeout shorter than the protected MLB
    # read Lambda's worst-case cold path. In AWS, call that exact read Lambda
    # directly so the same persisted, read-only authority is used without a
    # gateway 504. HTTP remains a local/test fallback only when no function is
    # configured. This does not recalculate or rewrite any prediction.
    if READ_FUNCTION_NAME:
        return _direct_lambda_json(path, params)
    if not API_BASE_URL:
        raise RuntimeError("MLB_AUTO_ML_API_BASE_URL_MISSING")
    query = urllib.parse.urlencode(
        {key: value for key, value in (params or {}).items() if value is not None}
    )
    url = API_BASE_URL + "/" + path.lstrip("/")
    if query:
        url += "?" + query
    request = urllib.request.Request(
        url,
        headers={
            "accept": "application/json",
            "user-agent": "inqsi-mlb-auto-ml-authority/1.0",
        },
    )
    timeout_seconds = float(os.environ.get("MLB_AUTO_ML_HTTP_TIMEOUT_SECONDS", "60"))
    with urllib.request.urlopen(request, timeout=timeout_seconds) as response:
        payload = json.loads(response.read().decode("utf-8"))
    if not isinstance(payload, dict):
        raise RuntimeError("MLB_ML_API_RESPONSE_NOT_OBJECT")
    return payload
'''
          if old not in text and '_direct_lambda_json' not in text:
              raise SystemExit('ml_authority HTTP block drifted; refusing unsafe patch')
          if old in text:
              text = text.replace(old, new, 1)
          authority.write_text(text, encoding='utf-8')

          template = Path('mlb-auto-llm-template.yaml')
          text = template.read_text(encoding='utf-8')
          if '  MlbMlReadFunctionName:\n' not in text:
              text = text.replace(
                  '  MlbMlApiBaseUrl:\n    Type: String\n',
                  '  MlbMlApiBaseUrl:\n    Type: String\n  MlbMlReadFunctionName:\n    Type: String\n',
                  1,
              )
          text = text.replace(
              '          MLB_AUTO_ML_API_BASE_URL: !Ref MlbMlApiBaseUrl\n',
              '          MLB_AUTO_ML_API_BASE_URL: !Ref MlbMlApiBaseUrl\n          MLB_AUTO_ML_READ_FUNCTION: !Ref MlbMlReadFunctionName\n',
          )
          invoke_policy = '''            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${MlbMlReadFunctionName}'
'''
          marker = '''            - Effect: Allow
              Action:
                - aws-marketplace:ViewSubscriptions
              Resource: '*'
'''
          if invoke_policy not in text:
              first = text.find(marker)
              if first < 0:
                  raise SystemExit('template policy marker missing')
              text = text[:first] + invoke_policy + text[first:]
              second = text.find(marker, first + len(invoke_policy) + len(marker))
              if second < 0:
                  raise SystemExit('second template policy marker missing')
              text = text[:second] + invoke_policy + text[second:]
          template.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/deploy-mlb-auto-llm.yml')
          text = workflow.read_text(encoding='utf-8')
          if 'MLB_ML_READ_FUNCTION=$(aws cloudformation describe-stack-resource' not in text:
              anchor = '''          test -n "$MLB_ML_API_BASE_URL"
          test "$MLB_ML_API_BASE_URL" != "None"
          sam deploy \\
'''
              replacement = '''          test -n "$MLB_ML_API_BASE_URL"
          test "$MLB_ML_API_BASE_URL" != "None"
          MLB_ML_READ_FUNCTION=$(aws cloudformation describe-stack-resource \\
            --stack-name parlay-platform-dev --region "$AWS_REGION" \\
            --logical-resource-id MLBV3ReadFunction \\
            --query 'StackResourceDetail.PhysicalResourceId' \\
            --output text)
          test -n "$MLB_ML_READ_FUNCTION"
          test "$MLB_ML_READ_FUNCTION" != "None"
          sam deploy \\
'''
              if anchor not in text:
                  raise SystemExit('deploy workflow anchor missing')
              text = text.replace(anchor, replacement, 1)
          if 'MlbMlReadFunctionName="${MLB_ML_READ_FUNCTION}"' not in text:
              text = text.replace(
                  '              MlbMlApiBaseUrl="${MLB_ML_API_BASE_URL}" \\
',
                  '              MlbMlApiBaseUrl="${MLB_ML_API_BASE_URL}" \\
              MlbMlReadFunctionName="${MLB_ML_READ_FUNCTION}" \\
',
                  1,
              )
          if "grep -q 'MLB_AUTO_ML_READ_FUNCTION' mlb_auto_llm/ml_authority.py" not in text:
              text = text.replace(
                  "          grep -q 'AWS_ML_RANKED_ENSEMBLE' mlb_auto_llm/ml_authority.py\n",
                  "          grep -q 'AWS_ML_RANKED_ENSEMBLE' mlb_auto_llm/ml_authority.py\n          grep -q 'MLB_AUTO_ML_READ_FUNCTION' mlb_auto_llm/ml_authority.py\n          grep -q 'MlbMlReadFunctionName' mlb-auto-llm-template.yaml\n",
                  1,
              )
          workflow.write_text(text, encoding='utf-8')
          PY

      - name: Verify repair contracts
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m py_compile mlb_auto_llm/ml_authority.py mlb_auto_llm/ml_authority_smoke.py
          PYTHONPATH=mlb_auto_llm python -m pytest -q \
            tests/unit/test_mlb_auto_model_gateway.py \
            tests/unit/test_mlb_auto_ml_authority.py
          sam validate --template-file mlb-auto-llm-template.yaml --lint
          git diff --check
          changed=$(git diff --name-only | grep -v '^.github/workflows/repair-mlb-auto-direct-read-once.yml$' || true)
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(mlb_auto_llm/|mlb-auto-llm-template.yaml$|.github/workflows/deploy-mlb-auto-llm.yml$)'; then
            echo '::error::Repair escaped MLB Auto isolation'
            exit 1
          fi

      - name: Commit tested MLB Auto repair and remove installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-mlb-auto-direct-read-once.yml
          git add mlb_auto_llm/ml_authority.py mlb-auto-llm-template.yaml .github/workflows/deploy-mlb-auto-llm.yml
          git commit -m 'Route MLB Auto model reads directly through AWS Lambda'
          git pull --rebase origin main
          git push origin HEAD:main
          sleep 5
          gh workflow run deploy-mlb-auto-llm.yml --ref main
