name: Diagnose PR601 candidate items now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pr601-candidate-items-now.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 1
      - name: Print exact candidate items function
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hello_world/mlb_daily_per_game_lock_patch.py').read_text()
          s=p.index('def _candidate_items(')
          e=p.index('\ndef ', s+1)
          print(p[s:e])
          PY
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/cleanup origin/main
          cd /tmp/cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-pr601-candidate-items-now.yml
          git commit -m 'Remove PR601 candidate diagnostic [skip ci]'
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((n*2))
          done
          exit 1