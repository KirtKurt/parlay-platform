name: Forensic Tennis Settlement 2026-08-02 1045

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forensic-tennis-settlement-20260802-1045.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forensic-tennis-settlement-20260802-1045
  cancel-in-progress: true

jobs:
  inspect-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run isolated tennis contract checks
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile \
            tennis_learning/handler.py \
            tennis_learning/live_pipeline.py \
            tennis_learning/autonomous_controller.py \
            tennis_learning/backfill.py
          python -m pytest -q \
            tests/test_tennis_autonomy_contract.py \
            tests/test_tennis_backfill_contract.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Compare stored live provenance with current provider scores
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}"
          mkdir -p runtime /tmp/tennis-forensics-1045
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from decimal import Decimal
          from pathlib import Path

          import boto3

          TABLE = 'inqis_tennis_learning'
          BASE = 'https://api.the-odds-api.com/v4'
          KEY = os.environ['ODDS_API_KEY_VALUE']
          REGION = os.environ['AWS_REGION_VALUE']
          now = datetime.now(timezone.utc)
          table = boto3.resource('dynamodb', region_name=REGION).Table(TABLE)

          def iso(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(str(value).replace('Z', '+00:00')).astimezone(timezone.utc)
              except Exception:
                  return None

          def clean(value):
              if isinstance(value, Decimal):
                  return float(value)
              if isinstance(value, dict):
                  return {k: clean(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [clean(v) for v in value]
              return value

          items = []
          kwargs = {}
          while True:
              page = table.scan(**kwargs)
              items.extend(page.get('Items', []))
              cursor = page.get('LastEvaluatedKey')
              if not cursor:
                  break
              kwargs['ExclusiveStartKey'] = cursor

          live = {}
          settlements = set()
          predictions = set()
          autonomy_runs = 0
          for item in items:
              pk = str(item.get('PK') or '')
              if pk.startswith('LIVE#'):
                  live[pk.split('#', 1)[1]] = item
              elif pk.startswith('SETTLEMENT#'):
                  settlements.add(pk.split('#', 1)[1])
              elif pk.startswith('PREDICTION#'):
                  predictions.add(pk.split('#', 1)[1])
              elif pk == 'AUTONOMY#RUN':
                  autonomy_runs += 1

          sport_keys = sorted({str(v.get('sport_key') or '') for v in live.values() if str(v.get('sport_key') or '').startswith('tennis_')})
          provider_errors = {}
          score_events = []
          for sport_key in sport_keys:
              query = urllib.parse.urlencode({'apiKey': KEY, 'daysFrom': 3, 'dateFormat': 'iso'})
              url = f'{BASE}/sports/{sport_key}/scores/?{query}'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'inqis-tennis-forensics/1.0'})
                  with urllib.request.urlopen(req, timeout=45) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  if not isinstance(payload, list):
                      provider_errors[sport_key] = 'unexpected scores response'
                      continue
                  for event in payload:
                      if isinstance(event, dict):
                          score_events.append((sport_key, event))
              except Exception as exc:
                  provider_errors[sport_key] = str(exc)

          completed = {}
          incomplete_ids = set()
          malformed_completed = []
          for sport_key, event in score_events:
              event_id = str(event.get('id') or '')
              if not event_id:
                  continue
              if not event.get('completed'):
                  incomplete_ids.add(event_id)
                  continue
              scores = event.get('scores') or []
              if len(scores) != 2:
                  malformed_completed.append({'event_id': event_id, 'sport_key': sport_key, 'scores': clean(scores)})
                  continue
              try:
                  first = int(scores[0]['score'])
                  second = int(scores[1]['score'])
              except Exception:
                  malformed_completed.append({'event_id': event_id, 'sport_key': sport_key, 'scores': clean(scores)})
                  continue
              if first == second:
                  malformed_completed.append({'event_id': event_id, 'sport_key': sport_key, 'scores': clean(scores), 'reason': 'tie'})
                  continue
              completed[event_id] = {
                  'sport_key': sport_key,
                  'commence_time': event.get('commence_time'),
                  'winner': scores[0].get('name') if first > second else scores[1].get('name'),
                  'scores': clean(scores),
              }

          completed_ids = set(completed)
          live_ids = set(live)
          matched_completed = completed_ids & live_ids
          missing_snapshot_completed = completed_ids - live_ids
          matched_unsettled = matched_completed - settlements
          matched_settled = matched_completed & settlements

          past_uncompleted = []
          for event_id, item in live.items():
              if event_id in completed_ids or event_id in settlements:
                  continue
              commence = iso(item.get('commence_time'))
              if not commence or commence > now:
                  continue
              age_hours = round((now - commence).total_seconds() / 3600.0, 2)
              past_uncompleted.append({
                  'event_id': event_id,
                  'sport_key': item.get('sport_key'),
                  'player': item.get('player'),
                  'opponent': item.get('opponent'),
                  'commence_time': item.get('commence_time'),
                  'updated_at': item.get('updated_at'),
                  'age_hours': age_hours,
                  'provider_currently_incomplete': event_id in incomplete_ids,
                  'prediction_exists': event_id in predictions,
              })
          past_uncompleted.sort(key=lambda row: row['age_hours'], reverse=True)

          matched_unsettled_examples = []
          for event_id in sorted(matched_unsettled):
              item = live[event_id]
              matched_unsettled_examples.append({
                  'event_id': event_id,
                  'sport_key': item.get('sport_key'),
                  'player': item.get('player'),
                  'opponent': item.get('opponent'),
                  'commence_time': item.get('commence_time'),
                  'updated_at': item.get('updated_at'),
                  'prediction_exists': event_id in predictions,
                  'provider_result': completed[event_id],
              })

          missing_examples = []
          for event_id in sorted(missing_snapshot_completed):
              missing_examples.append({'event_id': event_id, **completed[event_id]})

          blockers = []
          if provider_errors:
              blockers.append('provider_score_query_errors')
          if matched_unsettled:
              blockers.append('completed_events_with_live_snapshot_not_settled')
          if malformed_completed:
              blockers.append('completed_score_shape_not_supported')

          evidence = {
              'checked_at': now.isoformat(),
              'source_commit': os.environ.get('SOURCE_SHA'),
              'table': TABLE,
              'table_item_count_scanned': len(items),
              'live_snapshot_count': len(live),
              'prediction_event_count': len(predictions),
              'settlement_event_count': len(settlements),
              'autonomy_run_count': autonomy_runs,
              'stored_sport_keys': sport_keys,
              'provider_score_event_count': len(score_events),
              'provider_completed_parseable_count': len(completed),
              'provider_incomplete_count': len(incomplete_ids),
              'provider_errors': provider_errors,
              'matched_completed_live_count': len(matched_completed),
              'matched_completed_settled_count': len(matched_settled),
              'matched_completed_unsettled_count': len(matched_unsettled),
              'missing_snapshot_completed_count': len(missing_snapshot_completed),
              'malformed_completed_count': len(malformed_completed),
              'past_live_uncompleted_count': len(past_uncompleted),
              'past_live_uncompleted_over_1h': sum(row['age_hours'] >= 1 for row in past_uncompleted),
              'past_live_uncompleted_over_4h': sum(row['age_hours'] >= 4 for row in past_uncompleted),
              'past_live_uncompleted_over_12h': sum(row['age_hours'] >= 12 for row in past_uncompleted),
              'matched_completed_unsettled_examples': matched_unsettled_examples[:20],
              'missing_snapshot_completed_examples': missing_examples[:20],
              'malformed_completed_examples': malformed_completed[:20],
              'past_live_uncompleted_examples': past_uncompleted[:30],
              'actionable_blockers': blockers,
              'no_actionable_settlement_blocker': not blockers,
          }
          Path('/tmp/tennis-forensics-1045/tennis_settlement_forensics.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True, default=str) + '\n'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True, default=str))
          PY

      - name: Publish forensic evidence and self-remove
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in $(seq 1 30); do
            git fetch origin main
            git checkout -B tennis-forensics-1045-publish origin/main
            mkdir -p runtime
            cp /tmp/tennis-forensics-1045/tennis_settlement_forensics.json runtime/tennis_settlement_forensics.json
            rm -f .github/workflows/forensic-tennis-settlement-20260802-1045.yml
            git add runtime/tennis_settlement_forensics.json \
              .github/workflows/forensic-tennis-settlement-20260802-1045.yml
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Publish tennis settlement provenance forensics [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update blocked publish attempt ${attempt}; retrying"
            sleep 3
          done

          echo 'Unable to publish tennis settlement forensics after thirty attempts' >&2
          exit 1
