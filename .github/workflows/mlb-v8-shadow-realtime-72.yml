name: MLB V8 Real-Time Shadow 72

"on":
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-shadow-realtime-72.yml'
      - 'hello_world/mlb_v8_shadow_realtime_policy_v1.py'
      - 'hello_world/mlb_no_bbd_context_bridge_v1.py'
      - 'hello_world/mlb_v8_historical_context_overlay_v1.py'
      - 'scripts/run_mlb_supervised_shadow_v2.py'
      - 'runtime_reports/mlb_v8_historical_context_backfill_latest.json'

permissions:
  contents: write

concurrency:
  group: mlb-v8-shadow-realtime-72
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_v8_shadow_realtime_72_latest.json
  MLB_V8_SHADOW_TARGET_ACCURACY: '0.72'
  MLB_V8_SHADOW_AUTHORITY: SHADOW_ONLY
  PYTHONPATH: .:hello_world:scripts
  BBS_API_DISABLED: 'true'
  MLB_V8_HISTORICAL_BBS_OVERLAY_ENABLED: 'true'
  MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'false'
  MLB_V8_HISTORICAL_BBS_TABLE: parlay_platform_snapshots
  MLB_V8_HISTORICAL_CONTEXT_OVERLAY_ENABLED: 'true'
  MLB_V8_HISTORICAL_CONTEXT_OVERLAY_REQUIRED: 'true'
  MLB_V8_HISTORICAL_CONTEXT_TABLE: parlay_platform_snapshots

jobs:
  shadow-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate shadow-only policy and provider-neutral runner
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'numpy>=1.26,<3'
          python -m py_compile \
            scripts/run_mlb_supervised_shadow_v2.py \
            hello_world/mlb_no_bbd_context_bridge_v1.py \
            hello_world/mlb_v8_historical_context_overlay_v1.py
          python - <<'PY'
          from mlb_v8_shadow_realtime_policy_v1 import status
          value=status()
          assert value['targetAccuracy'] == 0.72, value
          assert value['authority'] == 'SHADOW_ONLY', value
          assert value['productionAuthorityChanged'] is False, value
          assert value['automaticWagerAllowed'] is False, value
          assert value['historicalLearningEnabled'] is True, value
          assert value['liveShadowEvaluationEnabled'] is True, value
          PY

      - name: Run shadow evaluation against immutable historical evidence
        id: evaluation
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set +e
          rm -f /tmp/mlb_v8_shadow_source.json
          python scripts/run_mlb_supervised_shadow_v2.py \
            --region "$AWS_REGION_VALUE" \
            --stack-name "$STACK_NAME" \
            --table-name parlay_platform_snapshots \
            --output /tmp/mlb_v8_shadow_source.json \
            2>&1 | tee /tmp/mlb_v8_shadow_realtime.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish real-time shadow dashboard report
        if: always()
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          EVALUATION_EXIT_CODE: ${{ steps.evaluation.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from mlb_v8_shadow_realtime_policy_v1 import status
          def load(path):
              p=Path(path)
              if not p.exists() or not p.stat().st_size:return {}
              try:return json.loads(p.read_text())
              except Exception as exc:return {'parseError':str(exc)}
          source=load('/tmp/mlb_v8_shadow_source.json')
          context=source.get('historicalTargetGameContext') or {}
          prior=source.get('historicalBbsFundamentals') or {}
          outcome=os.environ.get('EVALUATION_OUTCOME')
          exit_code=os.environ.get('EVALUATION_EXIT_CODE')
          succeeded=bool(
              outcome == 'success'
              and str(exit_code) == '0'
              and source.get('ok') is True
              and context.get('status') == 'APPLIED'
              and int(context.get('appliedGameCount') or 0) > 0
          )
          log_tail=Path('/tmp/mlb_v8_shadow_realtime.log').read_text(errors='replace')[-12000:] if Path('/tmp/mlb_v8_shadow_realtime.log').exists() else ''
          report={
              'proofType':'MLB_V8_REALTIME_SHADOW_72',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              **status(),
              'evaluationOutcome':outcome,'evaluationExitCode':exit_code,
              'evaluationSucceeded':succeeded,
              'liveBbdApiAvailable':False,'liveBbdApiRequired':False,
              'liveBbdHttpRequestsMade':0,
              'storedPriorGameOverlayStatus':prior.get('status'),
              'pointInTimeContextOverlayStatus':context.get('status'),
              'pointInTimeContextAppliedGameCount':int(context.get('appliedGameCount') or 0),
              'historicalTrainerContinuesIndependently':True,
              'sourceEvaluation':source,
              'errorLogTail':'' if succeeded else log_tail,
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          python -m json.tool "$REPORT_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v8-shadow-realtime-72-${{ github.run_id }}
          path: |
            runtime_reports/mlb_v8_shadow_realtime_72_latest.json
            /tmp/mlb_v8_shadow_source.json
            /tmp/mlb_v8_shadow_realtime.log
          retention-days: 90
          if-no-files-found: warn

      - name: Commit durable dashboard state
        if: always()
        run: |
          set -euo pipefail
          cp "$REPORT_PATH" /tmp/mlb-v8-shadow-report.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v8-shadow-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-v8-shadow-report.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Update MLB V8 72% real-time shadow dashboard [skip ci]'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce successful provider-neutral shadow execution
        if: always()
        run: |
          python - <<'PY'
          import json, os
          value=json.load(open(os.environ['REPORT_PATH']))
          assert value.get('authority') == 'SHADOW_ONLY', value
          assert value.get('automaticWagerAllowed') is False, value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('liveBbdApiAvailable') is False, value
          assert value.get('liveBbdApiRequired') is False, value
          assert int(value.get('liveBbdHttpRequestsMade') or 0) == 0, value
          assert value.get('evaluationSucceeded') is True, value
          assert value.get('pointInTimeContextOverlayStatus') == 'APPLIED', value
          assert int(value.get('pointInTimeContextAppliedGameCount') or 0) > 0, value
          PY
