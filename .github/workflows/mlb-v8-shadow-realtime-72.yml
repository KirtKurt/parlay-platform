name: MLB V8 Real-Time Shadow 72 Compatibility

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mlb-v8-shadow-realtime-72-compatibility
  cancel-in-progress: false

env:
  PYTHONPATH: hello_world:scripts

jobs:
  delegate-to-autonomous-controller:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact compatibility source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify shadow policy remains safe
        run: |
          set -euo pipefail
          python - <<'PY'
          from mlb_v8_shadow_realtime_policy_v1 import status
          value=status()
          assert value['authority'] == 'SHADOW_ONLY', value
          assert value['productionAuthorityChanged'] is False, value
          assert value['automaticWagerAllowed'] is False, value
          assert value['historicalLearningEnabled'] is True, value
          assert value['liveShadowEvaluationEnabled'] is True, value
          PY

      - name: Dispatch the single V8 control plane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mlb-v8-autonomous-controller.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
