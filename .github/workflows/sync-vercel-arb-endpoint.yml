name: Sync Vercel ARB Endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-vercel-arb-endpoint.yml'
  workflow_run:
    workflows: ['Deploy Inqsi Arb']
    types: [completed]

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve current ARB API endpoint
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          API_URL="$(aws cloudformation describe-stacks             --stack-name inqsi-arb-prod             --region "${{ secrets.AWS_REGION }}"             --query "Stacks[0].Outputs[?OutputKey=='ArbApiUrl'].OutputValue"             --output text)"
          test -n "$API_URL"
          test "$API_URL" != "None"
          case "$API_URL" in
            https://*.execute-api.*.amazonaws.com/Prod) ;;
            *) echo "Unexpected ArbApiUrl: $API_URL"; exit 1 ;;
          esac
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Update generated frontend endpoint
        env:
          API_URL: ${{ steps.resolve.outputs.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = os.environ["API_URL"].rstrip("/")
          body = (
              "// Generated by .github/workflows/sync-vercel-arb-endpoint.yml.\n"
              "// Public API Gateway base URL only; never place secrets in this file.\n"
              f"export const GENERATED_ARB_API_URL = {json.dumps(value)};\n"
          )
          Path("frontend/lib/generatedArbApi.ts").write_text(body)
          PY

      - name: Commit endpoint update if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/lib/generatedArbApi.ts; then
            echo "ARB API endpoint already current"
            exit 0
          fi
          git config user.name "inqsi-endpoint-sync"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/lib/generatedArbApi.ts
          git commit -m "Sync Vercel ARB API endpoint [skip ci]"
          git push origin HEAD:main
