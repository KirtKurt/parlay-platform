name: Verify Tennis Alpha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify schedules, rank points, settle, and CLV gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, boto3, subprocess
          ev = boto3.client("events")
          for name in ("tennis-alpha-collect", "tennis-alpha-settle"):
              rule = ev.describe_rule(Name=name)
              print(name, rule["State"])
              assert rule["State"] == "ENABLED", rule
          PY
          aws lambda invoke --function-name tennis-alpha-live --cli-binary-format raw-in-base64-out --payload '{"action":"collect"}' --cli-read-timeout 930 /tmp/ta-collect.json > /tmp/ta-collect-meta.json
          python - <<'PY'
          import json
          meta=json.load(open("/tmp/ta-collect-meta.json"))
          body=json.load(open("/tmp/ta-collect.json"))
          if meta.get("FunctionError"):
              raise SystemExit(json.dumps({"meta":meta,"body":body}, default=str))
          payload=json.loads(body["body"]) if isinstance(body, dict) and isinstance(body.get("body"), str) else body
          print(json.dumps({k: payload.get(k) for k in ("stored","predicted","skipped","ratings","errors")}, indent=2, default=str))
          assert int(payload.get("stored") or 0) >= 1, payload
          PY
          python - <<'PY'
          import json, boto3
          table = boto3.resource("dynamodb").Table("tennis_alpha")
          resp = table.scan(
              FilterExpression="begins_with(PK, :p) AND SK = :sk",
              ExpressionAttributeValues={ ":p": "LIVE#", ":sk": "LATEST" },
              Limit=20,
          )
          items = resp.get("Items") or []
          print("live_rows", len(items))
          assert items, "no LIVE rows"
          nonzero = 0
          for item in items:
              signals = item.get("signals") or {}
              edge = float(signals.get("rank_points_edge") or 0)
              print(item.get("player"), item.get("opponent"), "rank_points_edge", edge)
              if edge != 0:
                  nonzero += 1
          assert nonzero >= 1, "rank_points_edge still stubbed at 0 on all live rows"
          PY
          aws lambda invoke --function-name tennis-alpha-live --cli-binary-format raw-in-base64-out --payload '{"action":"settle"}' --cli-read-timeout 930 /tmp/ta-settle.json > /tmp/ta-settle-meta.json
          python - <<'PY'
          import json, boto3
          meta=json.load(open("/tmp/ta-settle-meta.json"))
          body=json.load(open("/tmp/ta-settle.json"))
          if meta.get("FunctionError"):
              raise SystemExit(json.dumps({"meta":meta,"body":body}, default=str))
          payload=json.loads(body["body"]) if isinstance(body, dict) and isinstance(body.get("body"), str) else body
          print("settle", json.dumps(payload, indent=2, default=str)[:2000])
          table = boto3.resource("dynamodb").Table("tennis_alpha")
          resp = table.scan(
              FilterExpression="begins_with(PK, :p) AND SK = :sk",
              ExpressionAttributeValues={ ":p": "CLV#", ":sk": "RECORD" },
          )
          rows = resp.get("Items") or []
          if not rows:
              print(json.dumps({"clv_rows": 0, "gate": "WAIT", "reason": "no settled H2H CLV yet; set/game markets blocked"}))
          else:
              clvs = [float(r.get("clv") or 0) for r in rows]
              beats = [bool(r.get("beat_close")) for r in rows]
              mean = sum(clvs)/len(clvs)
              beat_rate = sum(beats)/len(beats)
              gate = "PASS" if mean > 0 and beat_rate >= 0.5 and len(rows) >= 20 else "WAIT"
              print(json.dumps({"clv_rows": len(rows), "mean_clv": mean, "beat_close_rate": beat_rate, "gate": gate}))
          PY
