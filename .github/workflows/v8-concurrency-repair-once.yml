name: V8 Concurrency Repair Once

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/v8-concurrency-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: v8-concurrency-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact idempotent V8 concurrency repair
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          template_path = Path('mlb_odds_v8_shadow/template.yaml')
          workflow_path = Path('.github/workflows/mlb-odds-v8-shadow-deploy.yml')
          repair_path = Path('.github/workflows/v8-concurrency-repair-once.yml')

          template = template_path.read_text()
          workflow = workflow_path.read_text()

          template_old = '      ReservedConcurrentExecutions: 1\n'
          assertion_old = "          assert int(concurrency.get('ReservedConcurrentExecutions') or 0) == 1, concurrency\n"
          assertion_new = "          assert 'ReservedConcurrentExecutions' not in concurrency, concurrency\n"
          identity_old = "              'reservedConcurrency': 1,\n"
          identity_new = (
              "              'reservedConcurrency': None,\n"
              "              'concurrencyMode': 'ACCOUNT_UNRESERVED',\n"
          )

          if template_old in template:
              template = template.replace(
                  template_old,
                  "      # Account concurrency remains unreserved. The 15-minute schedule, five-minute timeout,\n"
                  "      # EventBridge retry limit, and per-cycle credit cap bound this shadow collector.\n",
                  1,
              )
          if assertion_old in workflow:
              workflow = workflow.replace(assertion_old, assertion_new, 1)
          if identity_old in workflow:
              workflow = workflow.replace(identity_old, identity_new, 1)

          assert 'ReservedConcurrentExecutions: 1' not in template
          assert assertion_new in workflow
          assert "'concurrencyMode': 'ACCOUNT_UNRESERVED'" in workflow
          assert 'Schedule: rate(15 minutes)' in template
          assert 'Value: SHADOW_ONLY' in template
          assert "MLB_V8_PLAYER_PROPS_ENABLED: 'false'" in template

          template_path.write_text(template)
          workflow_path.write_text(workflow)
          repair_path.unlink()
          PY

          git diff --check
          ! grep -Fq 'ReservedConcurrentExecutions: 1' mlb_odds_v8_shadow/template.yaml
          grep -Fq "'ReservedConcurrentExecutions' not in concurrency" .github/workflows/mlb-odds-v8-shadow-deploy.yml
          grep -Fq "'concurrencyMode': 'ACCOUNT_UNRESERVED'" .github/workflows/mlb-odds-v8-shadow-deploy.yml
          test ! -e .github/workflows/v8-concurrency-repair-once.yml

      - name: Publish repair to main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mlb_odds_v8_shadow/template.yaml .github/workflows/mlb-odds-v8-shadow-deploy.yml .github/workflows/v8-concurrency-repair-once.yml
          git commit -m 'Fix V8 Lambda concurrency recovery'
          for attempt in $(seq 1 8); do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo '::error::Unable to publish V8 concurrency recovery after bounded retries'
          exit 1

      - name: Dispatch corrected V8 recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/mlb-odds-v8-shadow-deploy.yml/dispatches" \
            -f ref=main
