name: MLB research source ingestion
on:
  workflow_dispatch:
  pull_request:
    paths: ['ks1/**', 'tests/ks1_phase4/**', '.github/workflows/mlb-research-ingestion.yml']
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'ks1/**'
      - 'mlb_research/**'
      - 'scripts/run_mlb_research_ingestion.py'
      - 'scripts/publish_mlb_research_dataset.py'
      - '.github/workflows/mlb-research-ingestion.yml'
permissions:
  contents: read
concurrency:
  group: mlb-research-source-ingestion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ingest:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AWS_DEFAULT_REGION: us-east-1
      OPENBLAS_NUM_THREADS: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r mlb_research/requirements.txt -r ks1/poisson-requirements.txt pytest PyYAML
      - run: python -m pytest -q tests/unit/test_mlb_research_v1.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: python scripts/run_mlb_research_ingestion.py --seconds 2400
      - name: Capture and score KS1 using the existing hourly trigger
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m ks1.live_inputs --output /tmp/ks1-daily-inputs
          python -m ks1.daily --inputs /tmp/ks1-daily-inputs --output /tmp/ks1-daily --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ks1-daily-${{ github.run_id }}
          path: /tmp/ks1-daily/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-research-ingestion-${{ github.run_id }}
          path: runtime_reports/mlb_research_ingestion_latest.json
          retention-days: 90

  verify-ks1:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ks1/poisson-requirements.txt 'pytest>=8,<9' 'PyYAML>=6,<7'
      - run: python -m pytest -q tests/ks1 tests/ks1_phase4
