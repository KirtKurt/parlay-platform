# Second push activates this one-time workflow.
name: MLB V8 BBD Request Pacing Fix Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-bbd-request-pacing-fix-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v8-bbd-request-pacing-fix-once
  cancel-in-progress: false

env:
  PYTHONPATH: .:hello_world:scripts

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Add bounded intra-batch provider pacing
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script=Path('scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py')
          text=script.read_text()
          if 'import time\n' not in text:
              marker='import os\n'
              if marker not in text:
                  raise SystemExit('time import marker missing')
              text=text.replace(marker,marker+'import time\n',1)

          helper='''def _historical_request_delay_seconds() -> float:\n    """Return a bounded delay between stored-catalogue requests."""\n    try:\n        value = float(os.environ.get("BBS_HISTORICAL_REQUEST_DELAY_SECONDS", "0") or 0)\n    except (TypeError, ValueError):\n        return 0.0\n    return min(max(value, 0.0), 5.0)\n\n\n'''
          if 'def _historical_request_delay_seconds(' not in text:
              marker='def _date_range(start: date, end: date) -> List[str]:\n'
              if marker not in text:
                  raise SystemExit('delay helper insertion marker missing')
              text=text.replace(marker,helper+marker,1)

          old='''        client = client_factory(timeout_seconds=8, max_attempts=2)\n        for game_day in _date_range(history_start_date, history_end_date):\n            envelope = client.list_mlb_matches(game_day, limit=200, stored=True)\n'''
          new='''        client = client_factory(timeout_seconds=8, max_attempts=2)\n        request_delay_seconds = _historical_request_delay_seconds()\n        for request_index, game_day in enumerate(\n            _date_range(history_start_date, history_end_date)\n        ):\n            if request_index and request_delay_seconds:\n                time.sleep(request_delay_seconds)\n            envelope = client.list_mlb_matches(game_day, limit=200, stored=True)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('provider request loop marker missing')
              text=text.replace(old,new,1)
          script.write_text(text)

          workflow=Path('.github/workflows/mlb-v8-historical-bbs-backfill.yml')
          text=workflow.read_text()
          setting="          BBS_HISTORICAL_REQUEST_DELAY_SECONDS: '1.0'\n"
          if setting not in text:
              marker='          BBS_API_SECRET_ARN: ${{ secrets.BBS_API_SECRET_ARN }}\n'
              if marker not in text:
                  raise SystemExit('backfill workflow pacing marker missing')
              text=text.replace(marker,marker+setting,1)
          workflow.write_text(text)

          tests=Path('tests/unit/test_run_mlb_v8_historical_bbs_prior_game_backfill.py')
          text=tests.read_text()
          if 'test_historical_request_delay_is_bounded' not in text:
              text += '''\n\n\ndef test_historical_request_delay_is_bounded(monkeypatch):\n    monkeypatch.setenv("BBS_HISTORICAL_REQUEST_DELAY_SECONDS", "1.25")\n    assert backfill._historical_request_delay_seconds() == 1.25\n\n    monkeypatch.setenv("BBS_HISTORICAL_REQUEST_DELAY_SECONDS", "99")\n    assert backfill._historical_request_delay_seconds() == 5.0\n\n    monkeypatch.setenv("BBS_HISTORICAL_REQUEST_DELAY_SECONDS", "invalid")\n    assert backfill._historical_request_delay_seconds() == 0.0\n'''
              tests.write_text(text)
          PY

      - name: Compile and test pacing contract
        run: |
          set -euo pipefail
          python -m pip install --quiet 'PyYAML>=6,<7' 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py
          PYTHONPATH=.:hello_world:scripts python -m pytest -q --tb=short \
            tests/unit/test_run_mlb_v8_historical_bbs_prior_game_backfill.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          path=Path('.github/workflows/mlb-v8-historical-bbs-backfill.yml')
          text=path.read_text()
          assert isinstance(yaml.safe_load(text),dict)
          assert "BBS_HISTORICAL_REQUEST_DELAY_SECONDS: '1.0'" in text
          assert 'time.sleep(request_delay_seconds)' in Path('scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py').read_text()
          PY

      - name: Publish fix and remove installer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/mlb-v8-historical-bbs-backfill.yml \
            scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py \
            tests/unit/test_run_mlb_v8_historical_bbs_prior_game_backfill.py
          git rm .github/workflows/mlb-v8-bbd-request-pacing-fix-once.yml
          git diff --cached --check
          git commit -m 'Pace V8 historical BBD requests'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
