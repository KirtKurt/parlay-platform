name: Verify deployed MLB R7 admission now

"on":
  push:
    branches:
      - repair/mlb-r7-runtime-admission-proof-20260825
    paths:
      - '.github/workflows/mlb-trainer-health-diagnose-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-deployed-mlb-r7-admission-now
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-dev
  EXPERIMENT_ID: mlb-v2-2026-08-03-future-prospective-r7

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact proof branch
        uses: actions/checkout@v4
        with:
          ref: repair/mlb-r7-runtime-admission-proof-20260825
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install runtime dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2'

      - name: Prove deployed trainer package contains the R7 repair
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          TRAINER_FUNCTION=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id MLBMLTrainingFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$TRAINER_FUNCTION" && test "$TRAINER_FUNCTION" != None
          echo "TRAINER_FUNCTION=$TRAINER_FUNCTION" >> "$GITHUB_ENV"
          aws lambda wait function-updated-v2 \
            --function-name "$TRAINER_FUNCTION" \
            --region "$AWS_REGION"
          aws lambda get-function-configuration \
            --function-name "$TRAINER_FUNCTION" \
            --region "$AWS_REGION" > /tmp/mlb-r7-function-config.json
          PACKAGE_URL=$(aws lambda get-function \
            --function-name "$TRAINER_FUNCTION" \
            --region "$AWS_REGION" \
            --query 'Code.Location' \
            --output text)
          curl --fail --silent --show-error "$PACKAGE_URL" -o /tmp/mlb-r7-trainer.zip
          unzip -l /tmp/mlb-r7-trainer.zip | grep -F 'mlb_r7_source_honest_training_repair.py'
          unzip -p /tmp/mlb-r7-trainer.zip mlb_r7_source_honest_training_repair.py \
            | grep -F 'MLB-R7-SOURCE-HONEST-TRAINING-ADMISSION-v2-label-lock-bound'
          unzip -p /tmp/mlb-r7-trainer.zip mlb_ml_aws_training_v1_compat.py \
            | grep -F 'r7_source_honest_training_repair.install'

      - name: Invoke the deployed R7 trainer with bounded lease-safe retry
        run: |
          set -euo pipefail
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FUNCTION" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"scheduled","run":"r7_source_honest_runtime_admission_proof"}' \
            --response /tmp/mlb-r7-training.json \
            --invocation /tmp/mlb-r7-training-invocation.json \
            --retry-execution-lease \
            --deadline-seconds 1200 \
            --retry-delay-seconds 20
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$TRAINER_FUNCTION" \
            --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"status","run":"r7_source_honest_runtime_status_proof"}' \
            --response /tmp/mlb-r7-status.json \
            --invocation /tmp/mlb-r7-status-invocation.json

      - name: Verify public authority remains fail closed or qualified R7 only
        run: |
          set -euo pipefail
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          test -n "$API_URL" && test "$API_URL" != None
          python scripts/verify_mlb_authority_response.py \
            --url "${API_URL%/}/v1/mlb/model/version" \
            --output /tmp/mlb-r7-public-authority.json \
            --request-timeout-seconds 20

      - name: Enforce persisted R7 progress and safety invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any, Mapping

          EXPERIMENT = os.environ['EXPERIMENT_ID']

          def load(path: str) -> dict[str, Any]:
              value = json.loads(Path(path).read_text(encoding='utf-8'))
              if isinstance(value, dict) and 'body' in value:
                  body = value.get('body')
                  value = json.loads(body) if isinstance(body, str) else body
              if not isinstance(value, dict):
                  raise SystemExit(f'non-object evidence: {path}')
              return value

          training = load('/tmp/mlb-r7-training.json')
          status = load('/tmp/mlb-r7-status.json')
          authority = load('/tmp/mlb-r7-public-authority.json')
          config = load('/tmp/mlb-r7-function-config.json')
          latest = (((status.get('trainingHealth') or {}).get('latestRun')) or {})
          authoritative = latest if latest else training
          continuity = authoritative.get('canonicalSlateContinuity') or {}
          partitions = authoritative.get('partitionCounts') or {}
          milestones = authoritative.get('milestones') or {}
          counts = milestones.get('counts') or {}

          accepted = int(authoritative.get('acceptedRowCount') or 0)
          rejected = int(authoritative.get('rejectedRowCount') or 0)
          train_count = int(partitions.get('train') or counts.get('train') or 0)
          validation_count = int(partitions.get('validation') or counts.get('validation') or 0)
          prospective_count = int(partitions.get('prospectiveTest') or counts.get('prospectiveTest') or 0)
          finalized_dates = sorted(str(v) for v in continuity.get('finalizedGameSlateDates') or [])
          assertions = {
              'trainingInvocationHealthy': training.get('ok') is True,
              'statusInvocationHealthy': status.get('ok') is True,
              'experimentIdentityExact': str(status.get('experimentId') or training.get('experimentId') or '') == EXPERIMENT,
              'processedThroughAugust24OrLater': str(continuity.get('processedThroughSlateDate') or '') >= '2026-08-24',
              'exactKnownFinalizedSlatesPresent': {'2026-08-03', '2026-08-24'} <= set(finalized_dates),
              'acceptedRowsAboveZero': accepted > 0,
              'acceptedRowsAtLeastCurrentExactSet': accepted >= 18,
              'rejectedRowsZero': rejected == 0,
              'trainPartitionStarted': train_count > 0,
              'modelNotPrematurelyTrained': authoritative.get('modelTrained') is not True,
              'championNotPrematurelyChanged': authoritative.get('championChanged') is not True,
              'liveInferenceAuthorityStillFalse': authoritative.get('liveInferenceAuthority') is not True,
              'productionAuthorityUnchanged': authoritative.get('productionAuthorityChanged') is not True,
              'automaticPromotionStillDisabled': authoritative.get('automaticPromotionEnabled') is not True,
              'publicAuthorityContractHealthy': authority.get('ok') is True,
              'retiredAuthoritySuppressed': authority.get('retiredAuthoritySuppressed') is True,
              'retiredV15_10Ineligible': authority.get('retiredV15_10Eligible') is False,
          }
          failed = sorted(name for name, ok in assertions.items() if ok is not True)
          report = {
              'ok': not failed,
              'proofType': 'MLB_R7_DEPLOYED_SOURCE_HONEST_ADMISSION_RUNTIME_PROOF_V1',
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'sourceSha': os.environ.get('GITHUB_SHA'),
              'workflowRunId': os.environ.get('GITHUB_RUN_ID'),
              'experimentId': EXPERIMENT,
              'lambdaConfiguration': {
                  'functionName': config.get('FunctionName'),
                  'handler': config.get('Handler'),
                  'lastModified': config.get('LastModified'),
                  'lastUpdateStatus': config.get('LastUpdateStatus'),
                  'codeSha256': config.get('CodeSha256'),
                  'timeout': config.get('Timeout'),
              },
              'trainingRunId': authoritative.get('runId'),
              'processedThroughSlateDate': continuity.get('processedThroughSlateDate'),
              'finalizedGameSlateDates': finalized_dates,
              'acceptedRowCount': accepted,
              'rejectedRowCount': rejected,
              'rejectionReasonCounts': authoritative.get('rejectionReasonCounts') or {},
              'partitionCounts': {
                  'train': train_count,
                  'validation': validation_count,
                  'prospectiveTest': prospective_count,
              },
              'milestoneTargets': milestones.get('targets') or {},
              'milestoneRemainingRows': milestones.get('remainingRows') or {},
              'modelTrained': authoritative.get('modelTrained'),
              'championChanged': authoritative.get('championChanged'),
              'liveInferenceAuthority': authoritative.get('liveInferenceAuthority'),
              'productionAuthorityChanged': authoritative.get('productionAuthorityChanged'),
              'automaticPromotionEnabled': authoritative.get('automaticPromotionEnabled'),
              'publicAuthority': authority,
              'assertions': assertions,
              'failedAssertions': failed,
              'immutablePredictionOrLockMutated': False,
              'immutableLabelMutated': False,
              'sportIsolationPreserved': True,
              'promotionGateChanged': False,
              'retiredV15_10Used': False,
              'secretExposed': False,
          }
          destination = Path('runtime_reports/mlb_r7_deployed_admission_runtime_proof_latest.json')
          destination.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          if failed:
              raise SystemExit('R7 runtime proof failed: ' + ','.join(failed))
          PY

      - name: Upload exact R7 runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r7-deployed-admission-runtime-proof
          path: |
            runtime_reports/mlb_r7_deployed_admission_runtime_proof_latest.json
            /tmp/mlb-r7-training.json
            /tmp/mlb-r7-training-invocation.json
            /tmp/mlb-r7-status.json
            /tmp/mlb-r7-status-invocation.json
            /tmp/mlb-r7-public-authority.json
            /tmp/mlb-r7-function-config.json
          if-no-files-found: warn
