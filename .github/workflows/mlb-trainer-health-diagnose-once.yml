name: Publish MLB AWS Trainer Health

"on":
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: mlb-trainer-health-status
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Capture persisted trainer status
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          TRAINER_ARN=$(aws cloudformation describe-stacks --stack-name parlay-platform-dev --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='MLBMLTrainingFunctionArn'].OutputValue" --output text)
          test -n "$TRAINER_ARN" && test "$TRAINER_ARN" != None
          aws lambda get-function-configuration --function-name "$TRAINER_ARN" --region "$AWS_REGION_VALUE" > /tmp/config.json
          aws lambda invoke --function-name "$TRAINER_ARN" --region "$AWS_REGION_VALUE" --cli-read-timeout 300 --cli-binary-format raw-in-base64-out --payload '{"sport":"mlb","mode":"status"}' /tmp/status.json > /tmp/status-meta.json
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('/tmp/status-meta.json').read_text())
          if meta.get('FunctionError'):
              raise SystemExit(f"trainer status invocation failed: {meta['FunctionError']}")
          status = json.loads(Path('/tmp/status.json').read_text())
          if not isinstance(status, dict):
              raise SystemExit('trainer status response must be an object')
          PY
      - name: Publish sanitized continuity status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          config=json.loads(Path('/tmp/config.json').read_text())
          status=json.loads(Path('/tmp/status.json').read_text())
          latest=status.get('latestStatus') or {}
          report={
              'proofType':'MLB_AWS_TRAINER_CONTINUITY_STATUS_V4',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'lambdaConfiguration':{
                  'functionName':config.get('FunctionName'),
                  'runtime':config.get('Runtime'),
                  'handler':config.get('Handler'),
                  'state':config.get('State'),
                  'lastUpdateStatus':config.get('LastUpdateStatus'),
                  'codeSha256':config.get('CodeSha256'),
              },
              'statusOk':status.get('ok'),
              'trainingHealth':status.get('trainingHealth'),
              'selectionCaptureHealth':status.get('selectionCaptureHealth'),
              'latestTrainingStatus':{
                  'ok':latest.get('ok'),
                  'status':latest.get('status'),
                  'createdAtUtc':latest.get('createdAtUtc'),
                  'runId':latest.get('runId'),
                  'acceptedRowCount':latest.get('acceptedRowCount'),
                  'rejectedRowCount':latest.get('rejectedRowCount'),
                  'trainingRowCount':latest.get('trainingRowCount'),
                  'validationSampleCount':latest.get('validationSampleCount'),
                  'walkForwardSampleCount':latest.get('walkForwardSampleCount'),
                  'canonicalSlateContinuity':latest.get('canonicalSlateContinuity'),
                  'modelTrained':latest.get('modelTrained'),
                  'candidateArtifact':latest.get('candidateArtifact'),
                  'promotionDecision':latest.get('promotionDecision'),
                  'failure':latest.get('failure'),
              },
          }
          Path('/tmp/summary.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp /tmp/summary.json /tmp/publish.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-trainer-health-diagnostic-proof origin/main
            git reset --hard origin/main
            git clean -fd
            mkdir -p runtime_reports
            cp /tmp/publish.json runtime_reports/mlb_trainer_health_diagnostic_latest.json
            git add runtime_reports/mlb_trainer_health_diagnostic_latest.json
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB trainer continuity status [skip ci]'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-trainer-health-status-${{ github.run_id }}
          retention-days: 7
          path: |
            /tmp/config.json
            /tmp/status.json
            /tmp/status-meta.json
            /tmp/summary.json
