name: MLB V7 Learning Integration CI

on:
  pull_request:
    paths:
      - 'hello_world/mlb_v7_integrity_pattern_v1.py'
      - 'hello_world/mlb_v7_learning_integration_v1.py'
      - 'tests/unit/test_mlb_v7_integrity_pattern_v1.py'
      - 'tests/unit/test_mlb_v7_learning_integration_v1.py'
      - '.github/workflows/mlb-v7-learning-integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v7-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile V7 modules
        run: python -m py_compile hello_world/mlb_v7_integrity_pattern_v1.py hello_world/mlb_v7_learning_integration_v1.py
      - name: Run V7 integrity and integration tests
        run: pytest -q tests/unit/test_mlb_v7_integrity_pattern_v1.py tests/unit/test_mlb_v7_learning_integration_v1.py
