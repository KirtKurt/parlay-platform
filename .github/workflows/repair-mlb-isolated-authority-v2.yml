name: Repair MLB isolated authority v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_mlb_isolated_authority_boundary.py'
      - 'tests/unit/test_mlb_isolated_authority_boundary.py'
      - '.github/workflows/repair-mlb-isolated-authority-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-isolated-authority-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic authority-boundary repair
        run: |
          set -euo pipefail
          python scripts/repair_mlb_isolated_authority_boundary.py
          python -m py_compile \
            scripts/repair_mlb_isolated_authority_boundary.py \
            scripts/verify_mlb_deploy_identity.py

      - name: Verify provider and authority contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
          python scripts/migrate_mlb_deploy_identity_provider_neutral.py --check
          python scripts/verify_mlb_no_bbd_runtime.py
          python -m pytest -q \
            tests/unit/test_mlb_isolated_authority_boundary.py \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_verify_mlb_no_bbd_runtime.py
          git diff --check

      - name: Publish repaired verifier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_mlb_deploy_identity.py
          if git diff --cached --quiet; then
            echo 'Verifier is already repaired.'
            exit 0
          fi
          git commit -m 'Authorize isolated three-source MLB production boundary'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            test "$attempt" != 5 || exit 1
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
