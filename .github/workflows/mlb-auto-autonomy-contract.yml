name: MLB AUTO Autonomy Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "hello_world/mlb_ml_*.py"
      - "scripts/*mlb*auto*.py"
      - "scripts/install_mlb_auto_autonomy_chain.py"
      - "tests/unit/test_mlb_auto_autonomy_chain_v1.py"
      - "template.yaml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/mlb-auto-autonomy-contract.yml"
  push:
    branches: [main]
    paths:
      - "hello_world/mlb_ml_*.py"
      - "scripts/*mlb*auto*.py"
      - "scripts/install_mlb_auto_autonomy_chain.py"
      - "tests/unit/test_mlb_auto_autonomy_chain_v1.py"
      - "template.yaml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/mlb-auto-autonomy-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-auto-autonomy-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: aws-actions/setup-sam@v2
      - name: Install dependencies
        run: python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9" "pyyaml>=6,<7"
      - name: Prove deterministic source is already installed
        run: |
          python scripts/install_mlb_auto_autonomy_chain.py
          git diff --exit-code -- \
            template.yaml \
            hello_world/mlb_ml_aws_training_v1.py \
            hello_world/mlb_ml_aws_training_v1_compat.py \
            hello_world/mlb_ml_experiment_v2.py \
            hello_world/mlb_ml_promotion_policy_v2.py \
            hello_world/mlb_ml_runtime_install_v3.py \
            .github/workflows/deploy.yml
      - name: Compile autonomy chain
        run: |
          python -m py_compile \
            hello_world/mlb_ml_canonical_continuity_v3.py \
            hello_world/mlb_ml_deployment_identity_v1.py \
            hello_world/mlb_ml_v2_inference_consumer.py \
            hello_world/mlb_ml_llm_hypothesis_v1.py \
            hello_world/mlb_ml_aws_training_v1.py \
            hello_world/mlb_ml_aws_training_v1_compat.py \
            hello_world/mlb_ml_runtime_install_v3.py
      - name: Run focused and existing MLB contracts
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          pytest -q tests/unit/test_mlb_auto_autonomy_chain_v1.py
          python tests/unit/test_mlb_r7_recovery_contract.py
          python tests/unit/test_mlb_trainer_continuity_compat_handler_v2.py
          python tests/unit/test_mlb_trainer_table_wiring.py
          python tests/unit/test_mlb_accuracy_target_separation.py
          python tests/unit/test_mlb_ml_promotion_safety.py
          python tests/unit/test_mlb_production_acceptance.py
      - name: Validate and build SAM
        run: |
          sam validate
          rm -rf .aws-sam
          sam build --no-cached
      - name: Enforce MLB-only isolation
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '^(tennis|soccer|tennis_auto|soccer_auto)/|^hello_world/(tennis|soccer)'; then
            echo "::error::MLB AUTO autonomy work modified Tennis or Soccer application files"
            exit 1
          fi
