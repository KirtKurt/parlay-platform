name: Repair MLB Canonical Ingest Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-canonical-ingest-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-canonical-ingest-now
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind same-slot retries to the persisted canonical authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('hello_world/mlb_manual_pull.py')
          text = path.read_text(encoding='utf-8')

          old = '''        expected_authority = compact.get("official_schedule_authority") or {}\n        official_authority_bound = bool(\n            not expected_authority\n            or (\n                manifest.get("official_schedule_backed") is True\n                and manifest.get("official_schedule_authority_version") == expected_authority.get("version")\n                and manifest.get("official_schedule_authority_fingerprint") == expected_authority.get("fingerprint")\n                and int(manifest.get("official_schedule_game_count") or -1) == len(games)\n            )\n        )\n        manifest_bound = bool(\n            stored.get("ok") is True\n            and canonical_binding_complete\n            and manifest.get("immutable") is True\n            and manifest.get("full_provider_schedule") is True\n            and int(manifest.get("game_count") or -1) == len(games)\n            and manifest.get("fingerprint")\n            and manifest.get("pk")\n            and manifest.get("sk")\n            and official_authority_bound\n        )\n'''
          new = '''        expected_authority = compact.get("official_schedule_authority") or {}\n        persisted_manifest = (\n            stored_pull.get("provider_schedule_manifest")\n            if isinstance(stored_pull, dict)\n            else {}\n        ) or {}\n        persisted_schedule_authority = (\n            persisted_manifest.get("scheduleAuthority")\n            if isinstance(persisted_manifest, dict)\n            else {}\n        ) or {}\n        official_authority_required = bool(\n            expected_authority\n            or persisted_schedule_authority\n            or manifest.get("official_schedule_backed") is True\n        )\n        manifest_validation_errors = []\n        if official_authority_required:\n            validator = getattr(\n                pull_history,\n                "validate_provider_schedule_manifest",\n                None,\n            )\n            if not stored_pull:\n                manifest_validation_errors.append("canonical_pull_readback_missing")\n            elif not callable(validator):\n                manifest_validation_errors.append(\n                    "provider_manifest_validator_unavailable"\n                )\n            else:\n                validation_result = validator(\n                    stored_pull,\n                    game_date,\n                    verify_immutable_storage=True,\n                )\n                if isinstance(validation_result, list):\n                    manifest_validation_errors.extend(\n                        str(error) for error in validation_result\n                    )\n                elif validation_result:\n                    manifest_validation_errors.append(str(validation_result))\n        canonical_game_count = (\n            len(stored_pull.get("games") or [])\n            if isinstance(stored_pull, dict)\n            else 0\n        )\n        # A same-quarter-hour retry must bind to the first immutable canonical\n        # observation. The retry's freshly fetched schedule proof has a new\n        # observedAtUtc/fingerprint and is not the authority for that slot.\n        # Validate the persisted pull and its strongly consistent manifest\n        # readback, then compare summary fields to that persisted proof only.\n        official_authority_bound = bool(\n            not official_authority_required\n            or (\n                not manifest_validation_errors\n                and manifest.get("official_schedule_backed") is True\n                and bool(persisted_schedule_authority)\n                and manifest.get("official_schedule_authority_version")\n                == persisted_schedule_authority.get("version")\n                and manifest.get("official_schedule_authority_fingerprint")\n                == persisted_schedule_authority.get("fingerprint")\n                and int(manifest.get("official_schedule_game_count") or -1)\n                == canonical_game_count\n            )\n        )\n        manifest_bound = bool(\n            stored.get("ok") is True\n            and canonical_binding_complete\n            and canonical_game_count > 0\n            and not manifest_validation_errors\n            and manifest.get("immutable") is True\n            and manifest.get("full_provider_schedule") is True\n            and int(manifest.get("game_count") or -1) == canonical_game_count\n            and manifest.get("fingerprint")\n            and manifest.get("pk")\n            and manifest.get("sk")\n            and official_authority_bound\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError('canonical retry authority binding anchor missing')

          old_return = '''            "providerManifestBound": manifest_bound,\n            "officialScheduleBacked": manifest.get("official_schedule_backed") is True,\n'''
          new_return = '''            "providerManifestBound": manifest_bound,\n            "providerManifestValidationErrors": sorted(\n                set(manifest_validation_errors)\n            ),\n            "canonicalManifestValidatedAgainstPersistedPull": bool(\n                stored_pull and not manifest_validation_errors\n            ),\n            "sameSlotRetryAuthorityRebound": bool(\n                canonical_slot.get("retryReturnedExistingCanonicalPull") is True\n                and expected_authority\n                and persisted_schedule_authority\n                and expected_authority.get("fingerprint")\n                != persisted_schedule_authority.get("fingerprint")\n            ),\n            "officialScheduleBacked": manifest.get("official_schedule_backed") is True,\n'''
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
          elif new_return not in text:
              raise RuntimeError('canonical retry diagnostic return anchor missing')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add focused same-slot authority regressions
        run: |
          cat > tests/unit/test_mlb_canonical_retry_authority_binding.py <<'PY'
          from __future__ import annotations

          import copy
          import sys
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[2]
          HELLO_WORLD = ROOT / "hello_world"
          if str(HELLO_WORLD) not in sys.path:
              sys.path.insert(0, str(HELLO_WORLD))

          import mlb_manual_pull


          GAME_DATE = "2026-08-26"
          CANONICAL_AT = "2026-08-26T17:15:27.196414+00:00"
          RETRY_AT = "2026-08-26T17:17:43.767563+00:00"
          SLOT_AT = "2026-08-26T17:15:00+00:00"


          def _game():
              return {
                  "game_id": "provider-game-1",
                  "id": "provider-game-1",
                  "game_key": "mlb|2026-08-26|away club|home club",
                  "home_team": "Home Club",
                  "away_team": "Away Club",
                  "commence_time": "2026-08-26T23:05:00+00:00",
                  "provider_sport_key": "baseball_mlb",
                  "books": {"fanduel": {"ml": {"home": -120, "away": 110}}},
              }


          def _persisted_pull():
              authority = {
                  "version": "MLB-OFFICIAL-SCHEDULE-AUTHORITY-v1-statsapi-exact-date",
                  "source": "MLB Stats API exact-date schedule",
                  "slateDate": GAME_DATE,
                  "observedAtUtc": CANONICAL_AT,
                  "officialGameCount": 1,
                  "authoritativeRoster": True,
                  "authoritativeStartTimes": True,
                  "verified": True,
                  "fingerprint": "persisted-authority-fingerprint",
              }
              return {
                  "pull_id": "first-slot-pull",
                  "sport": "mlb",
                  "slate_date": GAME_DATE,
                  "pulled_at": CANONICAL_AT,
                  "source": "the_odds_api",
                  "games": [_game()],
                  "provider_schedule_manifest": {
                      "scheduleAuthority": authority,
                  },
              }


          def _stored_result(persisted_pull):
              authority = persisted_pull["provider_schedule_manifest"][
                  "scheduleAuthority"
              ]
              return {
                  "ok": True,
                  "stored": {
                      "pk": f"PULLS#mlb#{GAME_DATE}",
                      "sk": f"PULL#SLOT#{SLOT_AT}",
                      "pull_id": "first-slot-pull",
                      "provider_manifest": {
                          "version": "INQSI-PROVIDER-SCHEDULE-MANIFEST-v1",
                          "fingerprint": "persisted-manifest-fingerprint",
                          "game_count": 1,
                          "pk": f"PROVIDER_MANIFEST#mlb#{GAME_DATE}",
                          "sk": (
                              f"OBSERVED#{CANONICAL_AT}#PULL#first-slot-pull"
                          ),
                          "immutable": True,
                          "full_provider_schedule": True,
                          "official_schedule_backed": True,
                          "official_schedule_authority_version": authority[
                              "version"
                          ],
                          "official_schedule_authority_fingerprint": authority[
                              "fingerprint"
                          ],
                          "official_schedule_game_count": 1,
                      },
                  },
                  "pull": copy.deepcopy(persisted_pull),
                  "deduped": True,
                  "canonicalSlot": {
                      "slotStartUtc": SLOT_AT,
                      "canonicalPullId": "first-slot-pull",
                      "canonicalPulledAtUtc": CANONICAL_AT,
                      "retryReturnedExistingCanonicalPull": True,
                  },
              }


          def _retry_compact():
              return {
                  "games": [_game()],
                  "official_schedule_authority": {
                      "version": (
                          "MLB-OFFICIAL-SCHEDULE-AUTHORITY-v1-statsapi-exact-date"
                      ),
                      "slateDate": GAME_DATE,
                      "observedAtUtc": RETRY_AT,
                      "officialGameCount": 1,
                      "authoritativeRoster": True,
                      "authoritativeStartTimes": True,
                      "verified": True,
                      # A fresh observation legitimately has a different proof
                      # fingerprint; it must not replace the slot authority.
                      "fingerprint": "retry-observation-fingerprint",
                  },
              }


          def test_same_slot_retry_binds_to_persisted_manifest_not_fresh_fingerprint(
              monkeypatch,
          ):
              persisted_pull = _persisted_pull()
              calls = []

              monkeypatch.setattr(
                  mlb_manual_pull.pull_history,
                  "store_pull",
                  lambda _body: _stored_result(persisted_pull),
              )

              def validate(pull, slate, verify_immutable_storage=False):
                  calls.append((pull, slate, verify_immutable_storage))
                  return []

              monkeypatch.setattr(
                  mlb_manual_pull.pull_history,
                  "validate_provider_schedule_manifest",
                  validate,
              )

              result = mlb_manual_pull._store_canonical_pull_history(
                  game_date=GAME_DATE,
                  asof=RETRY_AT,
                  run="same_slot_retry",
                  compact=_retry_compact(),
              )

              assert result["ok"] is True
              assert result["providerManifestBound"] is True
              assert result["officialScheduleAuthorityBound"] is True
              assert result["sameSlotRetryAuthorityRebound"] is True
              assert result["providerManifestValidationErrors"] == []
              assert result["canonicalPullId"] == "first-slot-pull"
              assert calls == [(persisted_pull, GAME_DATE, True)]


          def test_same_slot_retry_fails_closed_on_immutable_manifest_readback_error(
              monkeypatch,
          ):
              persisted_pull = _persisted_pull()
              monkeypatch.setattr(
                  mlb_manual_pull.pull_history,
                  "store_pull",
                  lambda _body: _stored_result(persisted_pull),
              )
              monkeypatch.setattr(
                  mlb_manual_pull.pull_history,
                  "validate_provider_schedule_manifest",
                  lambda *_args, **_kwargs: [
                      "immutable_provider_manifest_readback_mismatch"
                  ],
              )

              result = mlb_manual_pull._store_canonical_pull_history(
                  game_date=GAME_DATE,
                  asof=RETRY_AT,
                  run="same_slot_retry",
                  compact=_retry_compact(),
              )

              assert result["ok"] is False
              assert result["providerManifestBound"] is False
              assert result["officialScheduleAuthorityBound"] is False
              assert result["providerManifestValidationErrors"] == [
                  "immutable_provider_manifest_readback_mismatch"
              ]
          PY

      - name: Run MLB-only canonical ingest regressions
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile hello_world/mlb_manual_pull.py
          python -m py_compile hello_world/mlb_manual_pull_protected.py
          pytest -q \
            tests/unit/test_mlb_canonical_retry_authority_binding.py \
            tests/unit/test_mlb_manual_pull_manifest.py \
            tests/unit/test_mlb_ingest_alarm_repair.py \
            tests/unit/test_mlb_postcutoff_storage_contract.py \
            tests/unit/test_mlb_manual_pull_protected_runtime.py \
            tests/unit/test_mlb_scoring_runtime_capacity.py
          python scripts/verify_mlb_schedule_invariants.py

      - name: Commit repaired MLB source and regression proof
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hello_world/mlb_manual_pull.py \
            tests/unit/test_mlb_canonical_retry_authority_binding.py
          if git diff --cached --quiet; then
            echo 'Canonical retry authority fix is already present.'
            exit 0
          fi
          git commit -m 'Fix MLB same-slot canonical authority binding'
          for attempt in $(seq 1 12); do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
