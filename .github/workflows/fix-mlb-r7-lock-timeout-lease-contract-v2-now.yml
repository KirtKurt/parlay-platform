name: Fix MLB R7 lock timeout and lease contract v2 now

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mlb-r7-lock-timeout-lease-contract-v2-now.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fix-mlb-r7-lock-timeout-lease-contract-v2
  cancel-in-progress: false

jobs:
  patch-test-commit-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply coherent 900 second timeout and 960 second lease contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('template.yaml'),
              Path('scripts/patch_template_mlb_v1.py'),
              Path('scripts/verify_mlb_deploy_identity.py'),
              Path('scripts/verify_mlb_schedule_invariants.py'),
              Path('hello_world/mlb_daily_pick_lock_protected.py'),
              Path('hello_world/mlb_daily_per_game_lock_patch.py'),
              Path('tests/unit/test_mlb_daily_pick_lock_runtime.py'),
              Path('tests/unit/test_mlb_deploy_identity.py'),
              Path('tests/unit/test_mlb_daily_per_game_lock.py'),
              Path('tests/unit/test_mlb_daily_pick_lock_lease_duration.py'),
              Path('tests/unit/test_mlb_daily_pick_lock_protected.py'),
          ]
          paths = [path for path in paths if path.exists()]

          def patch_lock_resource(text: str, source: str) -> str:
              marker = 'MLBDailyPickLockFunction:'
              positions = [match.start() for match in re.finditer(marker, text)]
              if not positions:
                  raise SystemExit(f'{source}: MLBDailyPickLockFunction missing')
              result = text
              offset = 0
              for original_start in positions:
                  start = original_start + offset
                  tail = result[start:]
                  candidates = []
                  next_resource = re.search(
                      r'(?m)^  [A-Za-z][A-Za-z0-9]*:\s*$',
                      tail[len(marker):],
                  )
                  if next_resource:
                      candidates.append(len(marker) + next_resource.start())
                  triple = tail.find('"""', len(marker))
                  if triple >= 0:
                      candidates.append(triple)
                  end_rel = min(candidates) if candidates else len(tail)
                  block = tail[:end_rel]
                  patched = re.sub(
                      r'(?m)^(\s*Timeout:\s*)(?:300|900)\s*$',
                      r'\g<1>900',
                      block,
                  )
                  patched = patched.replace(
                      "MLB_LOCK_EXECUTION_LEASE_SECONDS: '360'",
                      "MLB_LOCK_EXECUTION_LEASE_SECONDS: '960'",
                  )
                  patched = patched.replace(
                      'MLB_LOCK_EXECUTION_LEASE_SECONDS: "360"',
                      'MLB_LOCK_EXECUTION_LEASE_SECONDS: "960"',
                  )
                  if patched != block:
                      result = result[:start] + patched + result[start + len(block):]
                      offset += len(patched) - len(block)
              return result

          direct_replacements = (
              ('LOCK_EXECUTION_LEASE_REQUIRED_SECONDS = 360', 'LOCK_EXECUTION_LEASE_REQUIRED_SECONDS = 960'),
              ('LOCK_EXECUTION_LEASE_SECONDS = 360', 'LOCK_EXECUTION_LEASE_SECONDS = 960'),
              ('LOCK_EXECUTION_LEASE_SECONDS = "360"', 'LOCK_EXECUTION_LEASE_SECONDS = "960"'),
              ("LOCK_EXECUTION_LEASE_SECONDS = '360'", "LOCK_EXECUTION_LEASE_SECONDS = '960'"),
              ('LOCK_TIMEOUT_SECONDS = 300', 'LOCK_TIMEOUT_SECONDS = 900'),
              ('lease_seconds=360', 'lease_seconds=960'),
              ('lease_seconds = 360', 'lease_seconds = 960'),
              ('lease_seconds=359', 'lease_seconds=959'),
              ('lease_seconds = 359', 'lease_seconds = 959'),
              ('"leaseSeconds": 360', '"leaseSeconds": 960'),
              ("'leaseSeconds': 360", "'leaseSeconds': 960"),
              ('"requiredLeaseSeconds": 360', '"requiredLeaseSeconds": 960'),
              ("'requiredLeaseSeconds': 360", "'requiredLeaseSeconds': 960"),
              ('"lambdaTimeoutSeconds": 300', '"lambdaTimeoutSeconds": 900'),
              ("'lambdaTimeoutSeconds': 300", "'lambdaTimeoutSeconds': 900"),
              ('remaining_millis=300_001', 'remaining_millis=900_001'),
              ('remaining_millis = 300_001', 'remaining_millis = 900_001'),
              ('["timeoutSeconds"] == 300', '["timeoutSeconds"] == 900'),
              ("['timeoutSeconds'] == 300", "['timeoutSeconds'] == 900"),
              ('["executionLeaseSeconds"] == 360', '["executionLeaseSeconds"] == 960'),
              ("['executionLeaseSeconds'] == 360", "['executionLeaseSeconds'] == 960"),
              ('_lock_execution_lease_seconds == 360', '_lock_execution_lease_seconds == 960'),
          )

          for path in paths:
              text = path.read_text(encoding='utf-8')
              original = text
              if path.name in {'template.yaml', 'patch_template_mlb_v1.py'}:
                  text = patch_lock_resource(text, str(path))
                  text = text.replace(
                      "lease_environment = \"          MLB_LOCK_EXECUTION_LEASE_SECONDS: '360'\\n\"",
                      "lease_environment = \"          MLB_LOCK_EXECUTION_LEASE_SECONDS: '960'\\n\"",
                  )
              for old, new in direct_replacements:
                  text = text.replace(old, new)

              updated = []
              for line in text.splitlines(keepends=True):
                  lowered = line.lower()
                  if any(token in lowered for token in (
                      'lockexecutionlease',
                      'lock_execution_lease',
                      'mlb_lock_execution_lease',
                      'executionleaseseconds',
                      'leaseseconds',
                      'requiredleaseseconds',
                  )):
                      line = re.sub(r'(?<!\d)360(?!\d)', '960', line)
                      line = re.sub(r'(?<!\d)359(?!\d)', '959', line)
                  if any(token in lowered for token in (
                      'lock_timeout',
                      'lock timeout',
                      'lambdatimeoutseconds',
                      'timeoutseconds',
                  )):
                      line = re.sub(r'(?<!\d)300(?!\d)', '900', line)
                  updated.append(line)
              text = ''.join(updated)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          template = Path('template.yaml').read_text(encoding='utf-8')
          lock_block = template.split('\n  MLBDailyPickLockFunction:\n', 1)[1].split(
              '\n  MLBProductionVerifierFunction:\n', 1
          )[0]
          assert 'Timeout: 900' in lock_block
          assert "MLB_LOCK_EXECUTION_LEASE_SECONDS: '960'" in lock_block

          protected = Path('hello_world/mlb_daily_pick_lock_protected.py').read_text(encoding='utf-8')
          assert 'LOCK_EXECUTION_LEASE_REQUIRED_SECONDS = 960' in protected
          assert '"lambdaTimeoutSeconds": 900' in protected
          assert '_lock_execution_lease_seconds == 960' in protected
          assert '"leaseSeconds": 360' not in protected

          per_game = Path('hello_world/mlb_daily_per_game_lock_patch.py').read_text(encoding='utf-8')
          assert 'LOCK_EXECUTION_LEASE_SECONDS = 960' in per_game
          assert '"leaseSeconds": 360' not in per_game

          runtime_test = Path('tests/unit/test_mlb_daily_pick_lock_runtime.py').read_text(encoding='utf-8')
          for stale in (
              'lease_seconds=360',
              'module.MLB_LOCK_EXECUTION_LEASE_SECONDS = 360',
              '"leaseSeconds": 360',
              '"requiredLeaseSeconds": 360',
              '"lambdaTimeoutSeconds": 300',
              'remaining_millis=300_001',
          ):
              assert stale not in runtime_test, stale
          assert 'lease_seconds=960' in runtime_test
          assert 'remaining_millis=900_001' in runtime_test
          PY

      - name: Prove focused lock, deployment, and continuity contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m py_compile \
            hello_world/mlb_daily_pick_lock_protected.py \
            hello_world/mlb_daily_per_game_lock_patch.py \
            scripts/patch_template_mlb_v1.py \
            scripts/verify_mlb_deploy_identity.py \
            scripts/verify_mlb_schedule_invariants.py \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py
          tests=(
            tests/unit/test_mlb_daily_pick_lock_runtime.py
            tests/unit/test_mlb_daily_per_game_lock.py
            tests/unit/test_mlb_deploy_identity.py
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py
            tests/unit/test_reconcile_mlb_prospective_backlog_v5.py
          )
          for optional in \
            tests/unit/test_mlb_daily_pick_lock_lease_duration.py \
            tests/unit/test_mlb_daily_pick_lock_protected.py; do
            [ ! -f "$optional" ] || tests+=("$optional")
          done
          PYTHONPATH="hello_world:scripts:${PYTHONPATH:-}" python -m pytest -q "${tests[@]}"
          python scripts/verify_mlb_schedule_invariants.py
          git diff --check

      - name: Enforce MLB-only safety boundary
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -ge 4
          for path in "${changed[@]}"; do
            case "$path" in
              template.yaml|scripts/patch_template_mlb_v1.py|scripts/verify_mlb_deploy_identity.py|scripts/verify_mlb_schedule_invariants.py|hello_world/mlb_daily_pick_lock_protected.py|hello_world/mlb_daily_per_game_lock_patch.py|tests/unit/test_mlb_daily_pick_lock_runtime.py|tests/unit/test_mlb_deploy_identity.py|tests/unit/test_mlb_daily_per_game_lock.py|tests/unit/test_mlb_daily_pick_lock_lease_duration.py|tests/unit/test_mlb_daily_pick_lock_protected.py) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          grep -q 'read_timeout=930' scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'immutablePredictionRewriteAllowed": False' scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'promotionAuthorityChanged": False' scripts/reconcile_mlb_prospective_backlog_v4.py
          grep -q 'productionAuthorityChanged": False' scripts/reconcile_mlb_prospective_backlog_v4.py

      - name: Commit tested timeout and lease correction to main
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            template.yaml \
            scripts/patch_template_mlb_v1.py \
            scripts/verify_mlb_deploy_identity.py \
            scripts/verify_mlb_schedule_invariants.py \
            hello_world/mlb_daily_pick_lock_protected.py \
            hello_world/mlb_daily_per_game_lock_patch.py \
            tests/unit/test_mlb_daily_pick_lock_runtime.py \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_mlb_daily_per_game_lock.py
          for optional in \
            tests/unit/test_mlb_daily_pick_lock_lease_duration.py \
            tests/unit/test_mlb_daily_pick_lock_protected.py; do
            [ ! -f "$optional" ] || git add "$optional"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Fix MLB R7 900s lock timeout and 960s lease contract'
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort || true
            test "$attempt" != 5
            sleep $((attempt * 3))
          done
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify remote correction and dispatch protected continuity repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:template.yaml | awk '
            /^  MLBDailyPickLockFunction:/{inside=1}
            /^  MLBProductionVerifierFunction:/{inside=0}
            inside{print}
          ' | grep -q 'Timeout: 900'
          git show origin/main:template.yaml | grep -q "MLB_LOCK_EXECUTION_LEASE_SECONDS: '960'"
          git show origin/main:hello_world/mlb_daily_pick_lock_protected.py | grep -q 'LOCK_EXECUTION_LEASE_REQUIRED_SECONDS = 960'
          git show origin/main:hello_world/mlb_daily_per_game_lock_patch.py | grep -q 'LOCK_EXECUTION_LEASE_SECONDS = 960'
          gh workflow run repair-mlb-training-continuity-now.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "Dispatched protected MLB continuity repair from ${{ steps.publish.outputs.source_sha }}."
