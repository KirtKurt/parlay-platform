name: Inspect MLB R8 execution leases read-only

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read and sanitize exact MLB R8 execution leases
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          table_name=$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-dev \
            --logical-resource-id SnapshotsTable \
            --region "$AWS_REGION_VALUE" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$table_name"
          test "$table_name" != "None"
          trainer_arn=$(aws cloudformation describe-stacks \
            --stack-name parlay-platform-dev \
            --region "$AWS_REGION_VALUE" \
            --query "Stacks[0].Outputs[?OutputKey=='MLBMLTrainingFunctionArn'].OutputValue" \
            --output text)
          test -n "$trainer_arn"
          test "$trainer_arn" != "None"
          report_path=/tmp/mlb-r8-execution-lease-readonly.json
          TABLE_NAME="$table_name" TRAINER_ARN="$trainer_arn" REPORT_PATH="$report_path" python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          experiment_pk = "MLB_ML_EXPERIMENT#V2#mlb-v2-2026-07-21-future-prospective-r2"
          lease_keys = (
              ("STATE_MUTATION", "EXECUTION_LEASE#STATE_MUTATION"),
              ("SELECTION_CAPTURE", "EXECUTION_LEASE#SELECTION_CAPTURE"),
              ("LEGACY_SENTINEL", "EXECUTION_LEASE"),
          )
          projection = "record_type,#version,lease_domain,lease_owner,execution_mode,acquired_at,lease_expires_at,lease_expires_at_epoch"
          attribute_names = {"#version": "version"}

          def scalar(item, name):
              node = item.get(name)
              if not isinstance(node, dict):
                  return None
              for data_type in ("S", "N", "BOOL"):
                  if data_type in node:
                      return node[data_type]
              return None

          def safe_identifier(value, limit=128):
              if value is None or isinstance(value, (dict, list)):
                  return None
              compact = " ".join(str(value).split())
              safe = re.sub(r"[^A-Za-z0-9._:/#@+-]", "_", compact)
              return safe[:limit] or None

          def safe_message(value, limit=300):
              if value is None or isinstance(value, (dict, list)):
                  return None
              compact = " ".join(str(value).split())
              compact = re.sub(
                  r"(?i)\b(api[_-]?key|secret|token|password|credential)s?\b\s*[:=]\s*[^\s,;]+",
                  r"\1=[REDACTED]",
                  compact,
              )
              compact = re.sub(
                  r"(?i)\bbearer\s+[^\s,;]+",
                  "Bearer [REDACTED]",
                  compact,
              )
              compact = re.sub(
                  r"arn:aws[a-zA-Z-]*:[^\s,;]+",
                  "[REDACTED_ARN]",
                  compact,
              )
              compact = re.sub(r"\b\d{12}\b", "[REDACTED_ACCOUNT]", compact)
              compact = re.sub(
                  r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b",
                  "[REDACTED_ACCESS_KEY]",
                  compact,
              )
              compact = re.sub(
                  r"\b[A-Za-z0-9_+/=-]{40,}\b",
                  "[REDACTED_TOKEN]",
                  compact,
              )
              return compact[:limit] or None

          def safe_count(value):
              if value is None or isinstance(value, bool):
                  return None
              try:
                  parsed = int(value)
              except (TypeError, ValueError):
                  return None
              return parsed if parsed >= 0 else None

          now_epoch = int(time.time())
          leases = []
          for lease_key, sort_key in lease_keys:
              command = [
                  "aws",
                  "dynamodb",
                  "get-item",
                  "--table-name",
                  os.environ["TABLE_NAME"],
                  "--consistent-read",
                  "--key",
                  json.dumps(
                      {
                          "PK": {"S": experiment_pk},
                          "SK": {"S": sort_key},
                      },
                      separators=(",", ":"),
                  ),
                  "--projection-expression",
                  projection,
                  "--expression-attribute-names",
                  json.dumps(attribute_names, separators=(",", ":")),
                  "--region",
                  os.environ["AWS_REGION_VALUE"],
                  "--output",
                  "json",
                  "--no-cli-pager",
              ]
              completed = subprocess.run(
                  command,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              response = json.loads(completed.stdout.strip() or "{}")
              item = response.get("Item")
              if not isinstance(item, dict):
                  item = {}
              owner = str(scalar(item, "lease_owner") or "")
              raw_expiry_epoch = scalar(item, "lease_expires_at_epoch")
              try:
                  expiry_epoch = (
                      int(str(raw_expiry_epoch))
                      if raw_expiry_epoch is not None
                      else None
                  )
              except (TypeError, ValueError):
                  expiry_epoch = None
              active = expiry_epoch is not None and expiry_epoch > now_epoch
              leases.append(
                  {
                      "leaseKey": lease_key,
                      "present": bool(item),
                      "mode": scalar(item, "execution_mode"),
                      "domain": scalar(item, "lease_domain"),
                      "acquiredAt": scalar(item, "acquired_at"),
                      "expiresAt": scalar(item, "lease_expires_at"),
                      "expiresAtEpoch": expiry_epoch,
                      "recordType": scalar(item, "record_type"),
                      "version": scalar(item, "version"),
                      "active": active,
                      "secondsRemaining": (
                          max(0, expiry_epoch - now_epoch)
                          if expiry_epoch is not None
                          else 0
                      ),
                      "ownerFingerprint": (
                          hashlib.sha256(owner.encode("utf-8")).hexdigest()[:16]
                          if owner
                          else None
                      ),
                  }
              )

          status_file = None
          try:
              descriptor, status_name = tempfile.mkstemp(
                  prefix="mlb-r8-trainer-status-",
                  suffix=".json",
              )
              os.close(descriptor)
              status_file = Path(status_name)
              status_request = json.dumps(
                  {"sport": "mlb", "mode": "status"},
                  separators=(",", ":"),
              )
              status_command = [
                  "aws",
                  "lambda",
                  "invoke",
                  "--function-name",
                  os.environ["TRAINER_ARN"],
                  "--region",
                  os.environ["AWS_REGION_VALUE"],
                  "--cli-binary-format",
                  "raw-in-base64-out",
                  "--payload",
                  status_request,
                  "--output",
                  "json",
                  "--no-cli-pager",
                  str(status_file),
              ]
              status_completed = subprocess.run(
                  status_command,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              invocation = json.loads(status_completed.stdout.strip() or "{}")
              if (
                  invocation.get("StatusCode") != 200
                  or invocation.get("FunctionError")
              ):
                  raise RuntimeError("MLB trainer status read failed")
              status_payload = json.loads(status_file.read_text().strip() or "{}")
              if not isinstance(status_payload, dict):
                  raise RuntimeError("MLB trainer status was not an object")
          finally:
              if status_file is not None:
                  status_file.unlink(missing_ok=True)

          training_health = status_payload.get("trainingHealth")
          if not isinstance(training_health, dict):
              training_health = {}
          latest_run = training_health.get("latestRun")
          if not isinstance(latest_run, dict):
              latest_run = {}
          failure = latest_run.get("failure")
          if not isinstance(failure, dict):
              failure = {}
          partition_counts = latest_run.get("partitionCounts")
          if not isinstance(partition_counts, dict):
              partition_counts = {}
          sanitized_training_health = {
              "deploymentIdentityMatches": (
                  training_health.get("deploymentIdentityMatches")
                  if isinstance(
                      training_health.get("deploymentIdentityMatches"), bool
                  )
                  else None
              ),
              "latestRun": {
                  "runId": safe_identifier(latest_run.get("runId")),
                  "status": safe_identifier(latest_run.get("status")),
                  "counts": {
                      "acceptedRowCount": safe_count(
                          latest_run.get("acceptedRowCount")
                      ),
                      "rejectedRowCount": safe_count(
                          latest_run.get("rejectedRowCount")
                      ),
                      "partitionCounts": {
                          name: safe_count(partition_counts.get(name))
                          for name in (
                              "train",
                              "validation",
                              "prospectiveTest",
                          )
                      },
                  },
                  "failure": {
                      "type": safe_identifier(failure.get("type")),
                      "message": safe_message(failure.get("message")),
                  },
              },
          }

          report = {
              "proofType": "MLB_R8_EXECUTION_LEASE_READ_ONLY",
              "readOnly": True,
              "generatedAtUtc": datetime.now(timezone.utc).isoformat(),
              "observedAtEpoch": now_epoch,
              "experimentPk": experiment_pk,
              "leases": leases,
              "trainingHealth": sanitized_training_health,
          }
          report_path = Path(os.environ["REPORT_PATH"])
          report_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          test -s "$report_path"

      - name: Upload sanitized MLB R8 execution lease report only
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r8-execution-lease-readonly-${{ github.run_id }}
          path: /tmp/mlb-r8-execution-lease-readonly.json
          if-no-files-found: error
          retention-days: 3
