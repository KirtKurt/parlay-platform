name: MLB V8 Source And Enforcement Normalizer

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mlb-supervised-shadow-v2.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v8-source-normalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize V8 verifier and publisher enforcement
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def git_blob_sha1(body: bytes) -> str:
              header = f"blob {len(body)}\0".encode("ascii")
              return hashlib.sha1(header + body).hexdigest()

          verifier_core = Path("scripts/_verify_mlb_trainer_deploy_response_core.py")
          verifier_body = verifier_core.read_bytes()
          assert git_blob_sha1(verifier_body) == "6366c6c0fa36f66654e396c78e6655acfe7728bd"
          verifier_text = verifier_body.decode("utf-8")
          old = (
              '    if status_after.get("runtimeAuthorityActivationAvailable") is not True:\n'
              '        errors.append("runtime_authority_activation_not_available")\n'
          )
          new = (
              '    if status_after.get("manualReviewCreatesShadowApprovalOnly") is not True:\n'
              '        errors.append("manual_review_shadow_only_contract_missing")\n'
              '    if status_after.get("runtimeAuthorityActivationAvailable") is not False:\n'
              '        errors.append("runtime_authority_activation_must_remain_unavailable")\n'
          )
          assert verifier_text.count(old) == 1
          Path("scripts/verify_mlb_trainer_deploy_response.py").write_text(
              verifier_text.replace(old, new), encoding="utf-8"
          )

          test_core = Path("tests/unit/_test_mlb_trainer_deploy_response_core.py")
          test_body = test_core.read_bytes()
          assert git_blob_sha1(test_body) == "3f0a60ec4a47fcc71c611a04e29d60905e72d873"
          test_text = test_body.decode("utf-8")
          old_fixture = (
              '        "firstPromotionRequiresManualReview": True,\n'
              '        "v2InferenceConsumerInstalled": False,\n'
              '        "runtimeAuthorityActivationAvailable": True,\n'
          )
          new_fixture = (
              '        "firstPromotionRequiresManualReview": True,\n'
              '        "manualReviewCreatesShadowApprovalOnly": True,\n'
              '        "v2InferenceConsumerInstalled": False,\n'
              '        "runtimeAuthorityActivationAvailable": False,\n'
          )
          assert test_text.count(old_fixture) == 1
          test_text = test_text.replace(old_fixture, new_fixture)
          test_text += '''\n\n
def test_rejects_runtime_authority_activation_exposure() -> None:
    training, selection, after = _payloads()
    after["runtimeAuthorityActivationAvailable"] = True

    assert "runtime_authority_activation_must_remain_unavailable" in _verify(
        training, selection, after
    )


def test_rejects_missing_shadow_only_manual_review_attestation() -> None:
    training, selection, after = _payloads()
    after["manualReviewCreatesShadowApprovalOnly"] = False

    assert "manual_review_shadow_only_contract_missing" in _verify(
        training, selection, after
    )
'''
          Path("tests/unit/test_mlb_trainer_deploy_response.py").write_text(
              test_text, encoding="utf-8"
          )
          verifier_core.unlink()
          test_core.unlink()

          recurring = Path(".github/workflows/mlb-supervised-shadow-v2-recurring.yml")
          recurring_text = recurring.read_text(encoding="utf-8")
          old_recurring = "value=json.loads(Path(os.environ['REPORT_PATH']).read_text())"
          assert recurring_text.count(old_recurring) == 2
          prefix, separator, suffix = recurring_text.rpartition(old_recurring)
          assert separator
          recurring.write_text(
              prefix
              + "value=json.loads(Path('/tmp/mlb-supervised-shadow-v2.json').read_text())"
              + suffix,
              encoding="utf-8",
          )

          immediate = Path(".github/workflows/mlb-supervised-v2-immediate-eval-once.yml")
          immediate_text = immediate.read_text(encoding="utf-8")
          old_immediate = (
              "value=json.loads(Path('runtime_reports/"
              "mlb_supervised_shadow_v2_latest.json').read_text())"
          )
          assert immediate_text.count(old_immediate) == 1
          immediate.write_text(
              immediate_text.replace(
                  old_immediate,
                  "value=json.loads(Path('/tmp/mlb-supervised-v2-immediate-report.json').read_text())",
              ),
              encoding="utf-8",
          )

          v9 = Path(".github/workflows/mlb-v9-event-id-direct-recovery-once.yml")
          v9_text = v9.read_text(encoding="utf-8")
          old_recovery = (
              "recovery=json.loads(Path('runtime_reports/"
              "mlb_v9_event_id_recovery_latest.json').read_text())"
          )
          old_shadow = (
              "shadow=json.loads(Path('runtime_reports/"
              "mlb_supervised_shadow_v2_latest.json').read_text())"
          )
          assert v9_text.count(old_recovery) == 1
          assert v9_text.count(old_shadow) == 1
          v9_text = v9_text.replace(
              old_recovery,
              "recovery=json.loads(Path('/tmp/mlb-v9-recovery-report.json').read_text())",
          ).replace(
              old_shadow,
              "shadow=json.loads(Path('/tmp/mlb-v9-shadow-report.json').read_text())",
          )
          v9.write_text(v9_text, encoding="utf-8")
          PY
      - name: Verify normalized V8 contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
          python -m py_compile \
            scripts/verify_mlb_trainer_deploy_response.py \
            scripts/guard_mlb_v8_shadow_report.py
          PYTHONPATH=hello_world:. python -m pytest -q --tb=short \
            tests/unit/test_mlb_trainer_deploy_response.py \
            tests/unit/test_guard_mlb_v8_shadow_report.py \
            tests/unit/test_mlb_v8_shadow_report_publishers.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (
              '.github/workflows/mlb-supervised-shadow-v2-recurring.yml',
              '.github/workflows/mlb-supervised-v2-immediate-eval-once.yml',
              '.github/workflows/mlb-v9-event-id-direct-recovery-once.yml',
          ):
              value = yaml.safe_load(Path(path).read_text(encoding='utf-8'))
              assert isinstance(value, dict), path
          PY
          test ! -e scripts/_verify_mlb_trainer_deploy_response_core.py
          test ! -e tests/unit/_test_mlb_trainer_deploy_response_core.py
          grep -Fq 'runtime_authority_activation_must_remain_unavailable' scripts/verify_mlb_trainer_deploy_response.py
          grep -Fq 'manual_review_shadow_only_contract_missing' scripts/verify_mlb_trainer_deploy_response.py
          grep -Fq "Path('/tmp/mlb-supervised-shadow-v2.json')" .github/workflows/mlb-supervised-shadow-v2-recurring.yml
          grep -Fq "Path('/tmp/mlb-supervised-v2-immediate-report.json')" .github/workflows/mlb-supervised-v2-immediate-eval-once.yml
          grep -Fq "Path('/tmp/mlb-v9-shadow-report.json')" .github/workflows/mlb-v9-event-id-direct-recovery-once.yml
      - name: Commit normalized V8 source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            scripts/verify_mlb_trainer_deploy_response.py \
            scripts/_verify_mlb_trainer_deploy_response_core.py \
            tests/unit/test_mlb_trainer_deploy_response.py \
            tests/unit/_test_mlb_trainer_deploy_response_core.py \
            .github/workflows/mlb-supervised-shadow-v2-recurring.yml \
            .github/workflows/mlb-supervised-v2-immediate-eval-once.yml \
            .github/workflows/mlb-v9-event-id-direct-recovery-once.yml
          git diff --cached --check
          git commit -m 'Normalize V8 shadow contracts and current-run enforcement'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}