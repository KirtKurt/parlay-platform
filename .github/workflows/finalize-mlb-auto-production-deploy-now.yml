name: Finalize isolated MLB AUTO production deployment now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-mlb-auto-production-deploy-now.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: finalize-mlb-auto-production-deploy-now
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Dispatch final isolated deployment
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          gh workflow run deploy-mlb-auto-llm.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Require final isolated deployment success
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.dispatch.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 90); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow deploy-mlb-auto-llm.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq '.[] | select(.headSha == "'"$SOURCE_SHA"'") | .databaseId' \
              | head -n 1)
            [ -z "$run_id" ] || break
            sleep 10
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "Final isolated deployment passed: $run_id"

      - name: Dispatch complete production-chain verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run verify-mlb-auto-production-chain.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo 'Dispatched complete MLB AUTO production-chain verification.'
