name: MLB Historical Direct Lambda Recovery V9

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-direct-lambda-recovery-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HIST_STACK: parlay-platform-mlb-historical-optimizer

jobs:
  direct-update-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate exact repaired source
        run: |
          set -euo pipefail
          python -m py_compile hello_world/mlb_historical_optimizer_handler.py hello_world/mlb_historical_optimizer_entrypoint.py
          grep -Fq 'v1.8-archive-before-freshness-quarantine' hello_world/mlb_historical_optimizer_handler.py
          grep -Fq 'provider_snapshot_too_stale' hello_world/mlb_historical_optimizer_handler.py
          if sed -n '/def _fetch_historical/,/return dict(payload), headers/p' hello_world/mlb_historical_optimizer_handler.py | grep -Fq 'normalize_historical_snapshot'; then
            echo 'fetch path still validates freshness before archival' >&2
            exit 1
          fi

      - name: Run focused regression tests
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          PYTHONPATH=hello_world python -m pytest -q \
            tests/unit/test_mlb_historical_archive_before_validation_v8.py \
            tests/unit/test_mlb_historical_optimizer_handler.py \
            tests/unit/test_mlb_historical_daily_optimizer_v1.py

      - name: Resolve isolated historical Lambda
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          HIST_FN=$(aws cloudformation describe-stacks \
            --stack-name "$HIST_STACK" \
            --region "$AWS_REGION_VALUE" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" \
            --output text)
          test -n "$HIST_FN"
          PROD_FNS=$(aws cloudformation describe-stack-resources \
            --stack-name parlay-platform-dev \
            --region "$AWS_REGION_VALUE" \
            --query "StackResources[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" \
            --output text || true)
          for fn in $PROD_FNS; do
            test "$fn" != "$HIST_FN"
          done
          echo "HIST_FN=$HIST_FN" >> "$GITHUB_ENV"

      - name: Package and directly update historical Lambda only
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          rm -f /tmp/mlb-historical-v9.zip
          cd hello_world
          zip -qr /tmp/mlb-historical-v9.zip . -x '__pycache__/*' '*.pyc'
          cd ..
          aws lambda update-function-code \
            --function-name "$HIST_FN" \
            --region "$AWS_REGION_VALUE" \
            --zip-file fileb:///tmp/mlb-historical-v9.zip \
            --publish \
            >/tmp/update-function-code.json
          aws lambda wait function-updated-v2 \
            --function-name "$HIST_FN" \
            --region "$AWS_REGION_VALUE"

      - name: Verify deployed AWS package
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          URL=$(aws lambda get-function \
            --function-name "$HIST_FN" \
            --region "$AWS_REGION_VALUE" \
            --query 'Code.Location' \
            --output text)
          curl -fsSL "$URL" -o /tmp/deployed-v9.zip
          unzip -p /tmp/deployed-v9.zip mlb_historical_optimizer_handler.py >/tmp/deployed-handler-v9.py
          grep -Fq 'v1.8-archive-before-freshness-quarantine' /tmp/deployed-handler-v9.py
          grep -Fq 'provider_snapshot_too_stale' /tmp/deployed-handler-v9.py
          if sed -n '/def _fetch_historical/,/return dict(payload), headers/p' /tmp/deployed-handler-v9.py | grep -Fq 'normalize_historical_snapshot'; then
            echo 'AWS Lambda still contains pre-archive freshness validation' >&2
            exit 1
          fi

      - name: Invoke until historical cursor recovers
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            aws lambda invoke \
              --function-name "$HIST_FN" \
              --region "$AWS_REGION_VALUE" \
              --cli-read-timeout 900 \
              --cli-binary-format raw-in-base64-out \
              --payload "{\"mode\":\"orchestrate\",\"run\":\"direct_lambda_v9_${i}\"}" \
              "/tmp/run-v9-${i}.json" >/tmp/meta-v9-${i}.json
            sleep 3
          done
          aws lambda invoke \
            --function-name "$HIST_FN" \
            --region "$AWS_REGION_VALUE" \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"mode":"status","run":"direct_lambda_v9_status"}' \
            /tmp/status-v9.json >/tmp/status-meta-v9.json

      - name: Require recovery and publish proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          value = json.load(open('/tmp/status-v9.json'))
          state = value.get('state') or {}
          proof = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'sourceSha': os.environ.get('GITHUB_SHA'),
              'version': value.get('version'),
              'phase': state.get('phase'),
              'currentDate': state.get('currentDate'),
              'currentSlotIndex': state.get('currentSlotIndex'),
              'networkRequestCount': state.get('networkRequestCount'),
              'eligibleGameCount': state.get('eligibleGameCount'),
              'completeSlateCount': state.get('completeSlateCount'),
              'optimizationRound': state.get('optimizationRound'),
              'lastError': state.get('lastError'),
              'skippedHistoricalSlotCount': len(state.get('skippedHistoricalSlots') or []),
          }
          assert 'v1.8-archive-before-freshness-quarantine' in str(proof['version']), proof
          assert 'too stale for a 15-minute grid' not in str(proof['lastError'] or ''), proof
          assert (str(proof['currentDate']), int(proof['currentSlotIndex'] or 0)) != ('2025-04-14', 72), proof
          os.makedirs('docs/runtime', exist_ok=True)
          with open('docs/runtime/mlb-historical-direct-lambda-v9-proof.json', 'w') as f:
              json.dump(proof, f, indent=2)
          print(json.dumps(proof, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/mlb-historical-direct-lambda-v9-proof.json
          git commit -m 'chore: publish MLB historical direct Lambda v9 proof'
          git push origin HEAD:main
