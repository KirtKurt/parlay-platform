name: Repair MLB AUTO deployment and verification contract now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-auto-deploy-contract-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-auto-deploy-contract-now
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair durable isolated deployment contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          deploy = Path('.github/workflows/deploy-mlb-auto-llm.yml')
          source = deploy.read_text(encoding='utf-8')
          source = source.replace(
              '  cancel-in-progress: true\n',
              '  cancel-in-progress: false\n',
              1,
          )
          source = source.replace(
              "run: python -m pip install --quiet 'boto3>=1.34,<2'",
              "run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'",
              1,
          )
          source = source.replace(
              'python -m py_compile mlb_auto_llm/handler.py mlb_auto_llm/orchestrator.py mlb_auto_llm/bedrock_smoke.py',
              'python -m py_compile mlb_auto_llm/handler.py mlb_auto_llm/orchestrator.py mlb_auto_llm/orchestrator_v2.py mlb_auto_llm/model_gateway.py mlb_auto_llm/bedrock_smoke.py',
              1,
          )
          anchor = "          grep -q 'teamRecentForm' mlb_auto_llm/orchestrator.py\n"
          additions = anchor + '''          grep -q 'Handler: orchestrator_v2.lambda_handler' mlb-auto-llm-template.yaml
          grep -q 'openai.gpt-5.6-sol' mlb-auto-llm-template.yaml
          grep -q 'bedrock-mantle:CreateInference' mlb-auto-llm-template.yaml
          python -m pytest -q tests/unit/test_mlb_auto_model_gateway.py
'''
          if "grep -q 'bedrock-mantle:CreateInference' mlb-auto-llm-template.yaml" not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('deployment source assertion anchor is not unique')
              source = source.replace(anchor, additions, 1)
          old_models = "BedrockModels='us.amazon.nova-2-lite-v1:0,global.amazon.nova-2-lite-v1:0,us.amazon.nova-pro-v1:0,us.amazon.nova-lite-v1:0,us.amazon.nova-micro-v1:0'"
          new_models = "BedrockModels='openai.gpt-5.6-sol,anthropic.claude-opus-4-8,anthropic.claude-opus-4-7,anthropic.claude-opus-4-6-v1,anthropic.claude-sonnet-4-6-v1,us.amazon.nova-2-lite-v1:0,global.amazon.nova-2-lite-v1:0,us.amazon.nova-pro-v1:0,us.amazon.nova-lite-v1:0,us.amazon.nova-micro-v1:0'"
          source = source.replace(old_models, new_models, 1)

          old_body = '''          body={
              'service':'mlb-auto-llm',
              'workflow':'Deploy MLB Auto LLM',
              'jobStatus':os.environ['JOB_STATUS'],
              'runId':os.environ['RUN_ID'],
              'runAttempt':os.environ['RUN_ATTEMPT'],
              'sourceSha':os.environ['SOURCE_SHA'],
              'publishedAtUtc':datetime.now(timezone.utc).isoformat(),
          }
'''
          new_body = '''          def load(path):
              try:
                  with open(path, encoding='utf-8') as handle:
                      value=json.load(handle)
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}

          bedrock=load('/tmp/mlb-auto-bedrock.json')
          cycle=load('/tmp/mlb-auto-cycle.json')
          public_status=load('/tmp/mlb-auto-status.json')
          card=cycle.get('card') if isinstance(cycle.get('card'), dict) else {}
          picks=card.get('picks') if isinstance(card.get('picks'), list) else []
          source_status=cycle.get('sourceStatus') if isinstance(cycle.get('sourceStatus'), dict) else {}
          body={
              'service':'mlb-auto-llm',
              'workflow':'Deploy MLB Auto LLM',
              'jobStatus':os.environ['JOB_STATUS'],
              'runId':os.environ['RUN_ID'],
              'runAttempt':os.environ['RUN_ATTEMPT'],
              'sourceSha':os.environ['SOURCE_SHA'],
              'publishedAtUtc':datetime.now(timezone.utc).isoformat(),
              'bedrockSmoke':{
                  'ok':bedrock.get('ok'),
                  'modelId':bedrock.get('modelId'),
                  'endpointFamily':bedrock.get('endpointFamily'),
                  'attemptedModelIds':bedrock.get('attemptedModelIds') or [],
                  'errorCodes':[
                      item.get('errorCode') or item.get('error')
                      for item in (bedrock.get('errors') or [])
                      if isinstance(item, dict)
                  ],
              },
              'providerCycle':{
                  'ok':cycle.get('ok'),
                  'status':cycle.get('status'),
                  'threeSourceCoverageComplete':(
                      cycle.get('threeSourceCoverageComplete')
                      if 'threeSourceCoverageComplete' in cycle
                      else card.get('threeSourceCoverageComplete')
                  ),
                  'bedrockAuthorityComplete':card.get('bedrockAuthorityComplete'),
                  'sourceStatus':source_status,
                  'pickCount':len(picks),
                  'bedrockDecisionCount':sum(
                      row.get('decisionAuthority') == 'BEDROCK_LLM'
                      for row in picks if isinstance(row, dict)
                  ),
                  'gamePks':[
                      str(row.get('gamePk')) for row in picks
                      if isinstance(row, dict) and row.get('gamePk') is not None
                  ],
              },
              'publicStatus':{
                  'service':public_status.get('service'),
                  'fullyAutonomous':public_status.get('fullyAutonomous'),
                  'threeSourcePolicy':public_status.get('threeSourcePolicy'),
                  'targetDailyAccuracy':public_status.get('targetDailyAccuracy'),
                  'cardLeadMinutesBeforeSecondGame':public_status.get('cardLeadMinutesBeforeSecondGame'),
              },
              'secretExposed':False,
          }
'''
          if old_body in source:
              source = source.replace(old_body, new_body, 1)
          elif "'bedrockSmoke':{" not in source:
              raise SystemExit('deployment proof body marker was not found')
          deploy.write_text(source, encoding='utf-8')

          verify = Path('.github/workflows/verify-mlb-auto-production-chain.yml')
          text = verify.read_text(encoding='utf-8')
          if '  workflow_dispatch:\n' not in text:
              text = text.replace(
                  'on:\n  pull_request:',
                  'on:\n  workflow_dispatch:\n  pull_request:',
                  1,
              )
          text = text.replace(
              '            mlb_auto_llm/orchestrator.py \\\n            mlb_auto_llm/bedrock_smoke.py',
              '            mlb_auto_llm/orchestrator.py \\\n            mlb_auto_llm/orchestrator_v2.py \\\n            mlb_auto_llm/model_gateway.py \\\n            mlb_auto_llm/bedrock_smoke.py',
              1,
          )
          verify_anchor = '          python -m pytest -q tests/unit/test_verify_mlb_no_bbd_runtime.py\n'
          verify_add = verify_anchor + '''          python -m pytest -q tests/unit/test_mlb_auto_model_gateway.py
          grep -q 'Handler: orchestrator_v2.lambda_handler' mlb-auto-llm-template.yaml
          grep -q 'bedrock-mantle:CreateInference' mlb-auto-llm-template.yaml
'''
          if 'test_mlb_auto_model_gateway.py' not in text:
              if text.count(verify_anchor) != 1:
                  raise SystemExit('verification workflow test anchor is not unique')
              text = text.replace(verify_anchor, verify_add, 1)
          verify.write_text(text, encoding='utf-8')

          repair = Path('scripts/repair_mlb_auto_bedrock_gateway.py')
          text = repair.read_text(encoding='utf-8')
          old = '''    replacement = action_block + \'''                - bedrock:CallWithBearerToken
                - bedrock-mantle:CallWithBearerToken
\'''
'''
          new = '''    replacement = action_block + \'''                - bedrock:CallWithBearerToken
                - bedrock-mantle:CallWithBearerToken
                - bedrock-mantle:CreateInference
\'''
'''
          if 'bedrock-mantle:CreateInference' not in text:
              if text.count(old) != 1:
                  raise SystemExit('Bedrock repair IAM marker is not unique')
              text = text.replace(old, new, 1)
          repair.write_text(text, encoding='utf-8')
          PY

          python -m py_compile \
            mlb_auto_llm/handler.py \
            mlb_auto_llm/orchestrator.py \
            mlb_auto_llm/orchestrator_v2.py \
            mlb_auto_llm/model_gateway.py \
            mlb_auto_llm/bedrock_smoke.py \
            scripts/repair_mlb_auto_bedrock_gateway.py
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m pytest -q tests/unit/test_mlb_auto_model_gateway.py
          grep -q 'cancel-in-progress: false' .github/workflows/deploy-mlb-auto-llm.yml
          grep -q 'bedrock-mantle:CreateInference' mlb-auto-llm-template.yaml
          grep -q 'bedrock-mantle:CreateInference' scripts/repair_mlb_auto_bedrock_gateway.py
          grep -q 'workflow_dispatch:' .github/workflows/verify-mlb-auto-production-chain.yml
          git diff --check

      - name: Publish durable deployment contract repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/deploy-mlb-auto-llm.yml \
            .github/workflows/verify-mlb-auto-production-chain.yml \
            scripts/repair_mlb_auto_bedrock_gateway.py
          git diff --cached --quiet && exit 0
          git commit -m 'Harden MLB AUTO production deployment acceptance'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" != 5 || exit 1
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
