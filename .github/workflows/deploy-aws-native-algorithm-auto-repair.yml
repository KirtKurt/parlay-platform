name: Deploy AWS Native Algorithm Auto Repair

on:
  push:
    branches:
      - automation/aws-native-algorithm-auto-repair-20260825
    paths:
      - 'aws_auto_repair/**'
      - 'aws-auto-repair-template.yaml'
      - 'tests/aws_auto_repair/**'
      - '.github/workflows/deploy-aws-native-algorithm-auto-repair.yml'
      - '.deploy/aws-native-auto-repair-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-native-algorithm-auto-repair-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - name: Verify source, isolation, and fail-closed contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<10' 'boto3>=1.34,<2' 'PyYAML>=6,<7' 'cfn-lint>=1,<2'
          python -m py_compile aws_auto_repair/*.py
          python -m pytest -q tests/aws_auto_repair
          sam validate --template-file aws-auto-repair-template.yaml --lint
          python - <<'PY'
          from pathlib import Path
          template = Path('aws-auto-repair-template.yaml').read_text()
          source = Path('aws_auto_repair/handler.py').read_text()
          required = (
              'lambda:InvokeFunction',
              'events:EnableRule',
              'cloudformation:ListStackResources',
              'REPAIR_STATE_TABLE',
              'DataContractBlockers',
              'ExternalBlockers',
          )
          for marker in required:
              assert marker in template or marker in source, marker
          forbidden = (
              'lambda:UpdateFunctionCode',
              'lambda:UpdateFunctionConfiguration',
              'lambda:PutFunctionConcurrency',
              'events:DisableRule',
              'dynamodb:BatchWriteItem',
              'dynamodb:TransactWriteItems',
              's3:PutObject',
              'bedrock:InvokeModel',
          )
          for marker in forbidden:
              assert marker not in template, marker
          assert 'update_function_code(' not in source
          assert 'update_function_configuration(' not in source
          assert 'disable_rule(' not in source
          assert 'transact_write_items(' not in source
          assert 'batch_write_item(' not in source
          assert 'put_object(' not in source
          print('aws_native_auto_repair_static_contracts_ok')
          PY
      - name: Build exact source once
        run: sam build --no-cached --template-file aws-auto-repair-template.yaml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sport: mlb-auto
            target_stack: parlay-platform-mlb-auto-llm
            repair_stack: parlay-platform-auto-repair-mlb-auto
          - sport: tennis
            target_stack: parlay-platform-tennis-learning
            repair_stack: parlay-platform-auto-repair-tennis
          - sport: soccer
            target_stack: parlay-platform-soccer-auto
            repair_stack: parlay-platform-auto-repair-soccer
          - sport: nfl
            target_stack: parlay-platform-nfl-auto
            repair_stack: parlay-platform-auto-repair-nfl
    env:
      AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
      SPORT: ${{ matrix.sport }}
      TARGET_STACK: ${{ matrix.target_stack }}
      REPAIR_STACK: ${{ matrix.repair_stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Prove target stack is present and stable
        run: |
          set -euo pipefail
          test -n "$AWS_REGION_VALUE"
          aws sts get-caller-identity
          status=$(aws cloudformation describe-stacks \
            --stack-name "$TARGET_STACK" \
            --region "$AWS_REGION_VALUE" \
            --query 'Stacks[0].StackStatus' \
            --output text)
          case "$status" in
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE) ;;
            *) echo "::error::$SPORT target stack is not stable: $status"; exit 1 ;;
          esac
          echo "TARGET_STACK_STATUS_BEFORE=$status" >> "$GITHUB_ENV"
      - name: Build isolated repair stack
        run: |
          set -euo pipefail
          sam build \
            --no-cached \
            --template-file aws-auto-repair-template.yaml \
            --build-dir ".aws-sam/build-$SPORT"
      - name: Deploy isolated repair stack to AWS
        run: |
          set -euo pipefail
          sam deploy \
            --template-file ".aws-sam/build-$SPORT/template.yaml" \
            --stack-name "$REPAIR_STACK" \
            --region "$AWS_REGION_VALUE" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              SportName="$SPORT" \
              TargetStackName="$TARGET_STACK" \
              FunctionNamePrefix="$TARGET_STACK" \
              RuleNamePrefix="$TARGET_STACK" \
              "RepairCadence=rate(5 minutes)" \
              RepairLeaseSeconds=960 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
      - name: Resolve deployed repair resources
        run: |
          set -euo pipefail
          repair_function=$(aws cloudformation describe-stacks \
            --stack-name "$REPAIR_STACK" \
            --region "$AWS_REGION_VALUE" \
            --query "Stacks[0].Outputs[?OutputKey=='AutoRepairFunctionName'].OutputValue" \
            --output text)
          state_table=$(aws cloudformation describe-stacks \
            --stack-name "$REPAIR_STACK" \
            --region "$AWS_REGION_VALUE" \
            --query "Stacks[0].Outputs[?OutputKey=='AutoRepairStateTableName'].OutputValue" \
            --output text)
          test -n "$repair_function" && test "$repair_function" != None
          test -n "$state_table" && test "$state_table" != None
          echo "REPAIR_FUNCTION=$repair_function" >> "$GITHUB_ENV"
          echo "REPAIR_STATE_TABLE=$state_table" >> "$GITHUB_ENV"
      - name: Run read-only discovery proof
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            aws lambda invoke \
              --function-name "$REPAIR_FUNCTION" \
              --region "$AWS_REGION_VALUE" \
              --cli-binary-format raw-in-base64-out \
              --cli-read-timeout 900 \
              --payload "{\"action\":\"cycle\",\"sport\":\"$SPORT\",\"dry_run\":true}" \
              /tmp/auto-repair-dry.json >/tmp/auto-repair-dry-meta.json
            status=$(python - <<'PY'
          import json
          meta=json.load(open('/tmp/auto-repair-dry-meta.json'))
          body=json.load(open('/tmp/auto-repair-dry.json'))
          if meta.get('FunctionError'):
              raise SystemExit('FUNCTION_ERROR')
          print(body.get('status') or 'UNKNOWN')
          PY
            )
            if [ "$status" != REPAIR_LEASE_HELD ]; then break; fi
            sleep 10
          done
          python - <<'PY'
          import json, os
          meta=json.load(open('/tmp/auto-repair-dry-meta.json'))
          body=json.load(open('/tmp/auto-repair-dry.json'))
          assert not meta.get('FunctionError'), (meta, body)
          assert body.get('ok') is True, body
          assert body.get('sport') == os.environ['SPORT'], body
          assert body.get('target_stack') == os.environ['TARGET_STACK'], body
          assert body.get('status') in {'DRY_RUN','TARGET_STACK_BUSY_OR_UNSAFE'}, body
          for key in ('immutable_prediction_history_rewritten','promotion_gate_changed','winner_authority_changed','other_sport_changed'):
              assert body.get(key) is False, (key, body)
          assert body.get('forbidden_operations_available', False) is False, body
          print(json.dumps(body, indent=2, sort_keys=True))
          PY
      - name: Run live safe repair cycle and verify result
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            aws lambda invoke \
              --function-name "$REPAIR_FUNCTION" \
              --region "$AWS_REGION_VALUE" \
              --cli-binary-format raw-in-base64-out \
              --cli-read-timeout 900 \
              --payload "{\"action\":\"cycle\",\"sport\":\"$SPORT\"}" \
              /tmp/auto-repair-live.json >/tmp/auto-repair-live-meta.json
            status=$(python - <<'PY'
          import json
          meta=json.load(open('/tmp/auto-repair-live-meta.json'))
          body=json.load(open('/tmp/auto-repair-live.json'))
          if meta.get('FunctionError'):
              raise SystemExit('FUNCTION_ERROR')
          print(body.get('status') or 'UNKNOWN')
          PY
            )
            if [ "$status" != REPAIR_LEASE_HELD ]; then break; fi
            sleep 10
          done
          python - <<'PY'
          import json, os
          meta=json.load(open('/tmp/auto-repair-live-meta.json'))
          body=json.load(open('/tmp/auto-repair-live.json'))
          assert not meta.get('FunctionError'), (meta, body)
          assert body.get('ok') is True, body
          assert body.get('sport') == os.environ['SPORT'], body
          assert body.get('target_stack') == os.environ['TARGET_STACK'], body
          assert body.get('status') in {
              'REPAIRED_OR_HEALTHY',
              'SAFE_REPAIR_COMPLETED_WITH_BLOCKERS',
              'TARGET_STACK_BUSY_OR_UNSAFE',
          }, body
          for key in ('immutable_prediction_history_rewritten','promotion_gate_changed','winner_authority_changed','other_sport_changed'):
              assert body.get(key) is False, (key, body)
          assert body.get('forbidden_operations_available', False) is False, body
          metrics=body.get('metrics') or {}
          assert int(metrics.get('RepairFailures') or 0) == 0, body
          print(json.dumps(body, indent=2, sort_keys=True))
          PY
      - name: Verify schedule, alarms, state persistence, and target isolation
        run: |
          set -euo pipefail
          stack_status=$(aws cloudformation describe-stacks \
            --stack-name "$REPAIR_STACK" \
            --region "$AWS_REGION_VALUE" \
            --query 'Stacks[0].StackStatus' \
            --output text)
          case "$stack_status" in CREATE_COMPLETE|UPDATE_COMPLETE) ;; *) exit 1 ;; esac
          rule_name=$(aws cloudformation list-stack-resources \
            --stack-name "$REPAIR_STACK" \
            --region "$AWS_REGION_VALUE" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Events::Rule'].PhysicalResourceId | [0]" \
            --output text)
          test -n "$rule_name" && test "$rule_name" != None
          rule_state=$(aws events describe-rule --name "$rule_name" --region "$AWS_REGION_VALUE" --query State --output text)
          test "$rule_state" = ENABLED
          alarm_count=$(aws cloudformation list-stack-resources \
            --stack-name "$REPAIR_STACK" \
            --region "$AWS_REGION_VALUE" \
            --query "length(StackResourceSummaries[?ResourceType=='AWS::CloudWatch::Alarm'])" \
            --output text)
          test "$alarm_count" -ge 6
          aws dynamodb get-item \
            --table-name "$REPAIR_STATE_TABLE" \
            --region "$AWS_REGION_VALUE" \
            --consistent-read \
            --key "{\"PK\":{\"S\":\"STATUS#$SPORT\"},\"SK\":{\"S\":\"LATEST\"}}" \
            --output json >/tmp/auto-repair-state.json
          python - <<'PY'
          import json
          state=json.load(open('/tmp/auto-repair-state.json'))
          assert state.get('Item'), state
          PY
          target_after=$(aws cloudformation describe-stacks \
            --stack-name "$TARGET_STACK" \
            --region "$AWS_REGION_VALUE" \
            --query 'Stacks[0].StackStatus' \
            --output text)
          case "$target_after" in CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE) ;; *) exit 1 ;; esac
          echo "REPAIR_STACK_STATUS=$stack_status" >> "$GITHUB_ENV"
          echo "REPAIR_RULE_NAME=$rule_name" >> "$GITHUB_ENV"
          echo "REPAIR_RULE_STATE=$rule_state" >> "$GITHUB_ENV"
          echo "REPAIR_ALARM_COUNT=$alarm_count" >> "$GITHUB_ENV"
          echo "TARGET_STACK_STATUS_AFTER=$target_after" >> "$GITHUB_ENV"
      - name: Build durable AWS proof artifact
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          def load(path):
              p=Path(path)
              if not p.exists(): return None
              try: return json.loads(p.read_text())
              except Exception as exc: return {'read_error':str(exc),'raw':p.read_text()[:2000]}
          proof={
              'sport': os.environ.get('SPORT'),
              'target_stack': os.environ.get('TARGET_STACK'),
              'target_stack_status_before': os.environ.get('TARGET_STACK_STATUS_BEFORE'),
              'target_stack_status_after': os.environ.get('TARGET_STACK_STATUS_AFTER'),
              'repair_stack': os.environ.get('REPAIR_STACK'),
              'repair_stack_status': os.environ.get('REPAIR_STACK_STATUS'),
              'repair_function': os.environ.get('REPAIR_FUNCTION'),
              'repair_state_table': os.environ.get('REPAIR_STATE_TABLE'),
              'repair_rule_name': os.environ.get('REPAIR_RULE_NAME'),
              'repair_rule_state': os.environ.get('REPAIR_RULE_STATE'),
              'repair_alarm_count': int(os.environ.get('REPAIR_ALARM_COUNT') or 0),
              'source_commit': os.environ.get('GITHUB_SHA'),
              'dry_run': load('/tmp/auto-repair-dry.json'),
              'live_run': load('/tmp/auto-repair-live.json'),
              'durable_state': load('/tmp/auto-repair-state.json'),
              'production_authority_changed': False,
              'immutable_prediction_history_rewritten': False,
              'promotion_gate_changed': False,
              'human_or_chatgpt_winner_selection': False,
              'other_sport_changed': False,
          }
          out=Path(f"/tmp/aws-native-auto-repair-{os.environ['SPORT']}.json")
          out.write_text(json.dumps(proof, indent=2, sort_keys=True)+'\n')
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-native-auto-repair-${{ matrix.sport }}-${{ github.run_id }}
          path: /tmp/aws-native-auto-repair-${{ matrix.sport }}.json
          if-no-files-found: warn
          retention-days: 90
