name: Restore Soccer Lock Hash Persistence
on:
  push:
    branches: ['agent/restore-soccer-lock-hash-persistence']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Soccer-only repair
        run: python scripts/restore_soccer_lock_hash_persistence.py
      - name: Verify persistence contract
        run: |
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'botocore>=1.34,<2'
          python -m py_compile soccer_auto/inference.py
          python -m pytest -q tests/soccer_auto/test_certified_lock_cohorts.py tests/soccer_auto/test_inference_safety.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add soccer_auto/inference.py tests/soccer_auto/test_certified_lock_cohorts.py
          if ! git diff --cached --quiet; then
            git commit -m 'Restore Soccer lock hash persistence contract'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
