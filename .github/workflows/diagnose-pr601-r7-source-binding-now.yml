name: Diagnose PR601 R7 source binding now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pr601-r7-source-binding-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect candidate/source binding fixtures
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9"
          python - <<'PY'
          import copy
          import importlib.util
          import inspect
          from pathlib import Path

          path = Path('tests/unit/test_mlb_daily_per_game_lock.py')
          spec = importlib.util.spec_from_file_location('r7_fixture', path)
          t = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(t)

          print('PERSIST_CANDIDATE_SOURCE_BEGIN')
          print(inspect.getsource(t.persist_candidate))
          print('PERSIST_CANDIDATE_SOURCE_END')

          for mode, canonical in [('exact_identity', False), ('official_game_pk', True)]:
              target = t.game('mlb_statsapi:991556' if mode == 'exact_identity' else 'provider-event-991556', '2026-07-13T18:00:00+00:00')
              target.update({'official_game_pk': '991556', 'official_commence_time': target['commence_time'], 'official_status': {'abstractGameState': 'Preview'}})
              candidate_game = copy.deepcopy(target)
              if mode == 'official_game_pk':
                  candidate_game['game_id'] = 'mlb_statsapi:991556'
                  candidate_game['game_key'] = 'mlb-mlb_statsapi:991556'
              source = t.pull('2026-07-13T17:00:00+00:00', [target], 'real-quarantine')
              if canonical:
                  source['canonicalPullStorage'] = {'pk': f'PULLS#mlb#{t.SLATE}', 'sk': 'PULL#SLOT#2026-07-13T17:00:00+00:00', 'recordType': 'pull_run'}
              module = t.build_module([source], '2026-07-13T20:00:00+00:00', seed=False)
              t.persist_candidate(module, candidate_game, source)
              pulls = module._pulls_for_date(t.SLATE)
              manifest = module._latest_games_for_date(t.SLATE, pulls)
              scoring = t.patch._scoring_pulls(module, pulls, manifest[0])
              items = t.patch._candidate_items(module, t.SLATE, manifest[0], scoring)
              print('MODE', mode, 'CANONICAL', canonical)
              print('SOURCE', source)
              print('PULLS', pulls)
              print('SCORING', scoring)
              print('ITEMS', items)
              for item in items:
                  row = item.get('data') or {}
                  source_at = t.patch._candidate_source_at(item, row)
                  source_id = t.patch._candidate_source_id(item, row)
                  print('CANDIDATE_SOURCE', source_at, source_id)
                  print('SOURCE_LOOKUP', t.patch._source_pull_for_candidate(module, scoring, source_at, source_id))
              print('LAST', t.patch._last_prelock_candidate(module, t.SLATE, manifest[0], scoring))
          PY
      - name: Remove one-shot diagnostic workflow from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/r7-diag-cleanup origin/main
          cd /tmp/r7-diag-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-pr601-r7-source-binding-now.yml
          git commit -m 'Remove completed PR601 R7 diagnostic runner [skip ci]'
          git push origin HEAD:main
