name: NFL Live Schedule Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read one rejected 2026 schedule row and its reason
        run: |
          set -euo pipefail
          REGION="${AWS_REGION}"
          STACK=parlay-platform-nfl-auto
          resource() {
            aws cloudformation describe-stack-resource --stack-name "$STACK" --logical-resource-id "$1" --region "$REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text
          }
          BUCKET=$(resource NflRawBucket)
          OPS=$(resource NflOpsTable)
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "bbd/nfl/live-schedule/2026/offset-0/" --output json > /tmp/keys.json
          aws dynamodb query --table-name "$OPS" --region "$REGION" --key-condition-expression "PK = :pk" --expression-attribute-values '{":pk":{"S":"LIVE_SCHEDULE_EXCLUSION"}}' --limit 8 --output json > /tmp/ops.json
          python3 - << 'PY'
          import json, subprocess, os
          listing = json.load(open("/tmp/keys.json"))
          contents = listing.get("Contents") or []
          contents.sort(key=lambda row: row.get("LastModified") or "")
          key = contents[-1]["Key"]
          bucket = os.environ["BUCKET"]
          subprocess.check_call(["aws", "s3", "cp", f"s3://{bucket}/{key}", "/tmp/sched.json"])
          payload = json.load(open("/tmp/sched.json"))
          rows = payload.get("data") or []
          print("objects", len(contents), "rows", len(rows), "pagination", payload.get("pagination"))
          row = rows[0] if rows else {}
          print("keys", sorted(row.keys()))
          interesting = ("game_id", "id", "season", "week", "week_number", "game_type", "season_type", "type", "game_date", "gameday", "kickoff_utc", "kickoff", "commence_time", "start_time", "gametime", "game_time", "home_team", "away_team", "home", "away", "home_score", "away_score", "status")
          sample = {}
          for name in interesting:
              if name in row:
                  value = row[name]
                  if isinstance(value, dict):
                      sample[name] = {child: value.get(child) for child in list(value)[:8]}
                  else:
                      sample[name] = value
          print("sample", json.dumps(sample, default=str)[:2500])
          ops = json.load(open("/tmp/ops.json"))
          reasons = []
          for item in ops.get("Items") or []:
              reasons.append({"sk": (item.get("SK") or {}).get("S"), "reason": (item.get("reason") or {}).get("S")})
          print("reasons", json.dumps(reasons)[:2000])
          PY
        env:
          BUCKET: ${{ env.BUCKET }}
