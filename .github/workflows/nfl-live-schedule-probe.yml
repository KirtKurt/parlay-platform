name: NFL Live Schedule Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read one rejected 2026 schedule row and its reason
        run: |
          set -euo pipefail
          REGION="${AWS_REGION}"
          STACK=parlay-platform-nfl-auto
          resource() {
            aws cloudformation describe-stack-resource --stack-name "$STACK" --logical-resource-id "$1" --region "$REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text
          }
          BUCKET=$(resource NflRawBucket)
          OPS=$(resource NflOpsTable)
          KEY=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "bbd/nfl/live-schedule/2026/offset-0/" --query 'sort_by(Contents, &LastModified)[-1].Key' --output text)
          echo "KEY=$KEY"
          aws s3 cp "s3://$BUCKET/$KEY" /tmp/sched.json
          aws dynamodb query --table-name "$OPS" --region "$REGION" --key-condition-expression "PK = :pk" --expression-attribute-values '{":pk":{"S":"LIVE_SCHEDULE_EXCLUSION"}}' --limit 5 --output json > /tmp/ops.json
          python3 - << 'PY'
          import json
          payload = json.load(open("/tmp/sched.json"))
          rows = payload.get("data") or []
          print("rows", len(rows), "pagination", payload.get("pagination"))
          row = rows[0] if rows else {}
          print("keys", sorted(row.keys()))
          interesting = ("game_id", "id", "season", "week", "week_number", "game_type", "season_type", "type", "game_date", "gameday", "kickoff_utc", "kickoff", "commence_time", "start_time", "gametime", "game_time", "home_team", "away_team", "home", "away", "home_score", "away_score", "status")
          sample = {}
          for key in interesting:
              if key in row:
                  value = row[key]
                  if isinstance(value, dict):
                      sample[key] = {child: value.get(child) for child in list(value)[:8]}
                  else:
                      sample[key] = value
          print("sample", json.dumps(sample, default=str)[:2500])
          ops = json.load(open("/tmp/ops.json"))
          reasons = []
          for item in ops.get("Items") or []:
              reasons.append({"sk": (item.get("SK") or {}).get("S"), "reason": (item.get("reason") or {}).get("S")})
          print("reasons", json.dumps(reasons)[:2000])
          PY
