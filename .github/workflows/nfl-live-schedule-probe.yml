name: NFL Live Schedule Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Invoke the live schedule tick and print the result
        run: |
          set -euo pipefail
          REGION="${AWS_REGION}"
          STACK=parlay-platform-nfl-auto
          FN=$(aws cloudformation describe-stack-resource --stack-name "$STACK" --logical-resource-id NflLiveFunction --region "$REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          RULE=$(aws cloudformation describe-stack-resource --stack-name "$STACK" --logical-resource-id NflLiveFunctionLiveEveryFiveMinutes --region "$REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          echo "FUNCTION=$FN"
          aws events describe-rule --name "$RULE" --region "$REGION" --query '{Name:Name,State:State,Schedule:ScheduleExpression}' --output json
          STATE=$(aws events describe-rule --name "$RULE" --region "$REGION" --query 'State' --output text)
          if [ "$STATE" != "ENABLED" ]; then
            echo "Enabling disabled live schedule rule"
            aws events enable-rule --name "$RULE" --region "$REGION"
          fi
          START_MS=$(( ($(date +%s) - 3600) * 1000 ))
          echo "--- recent live logs ---"
          aws logs filter-log-events \
            --region "$REGION" \
            --log-group-name "/aws/lambda/$FN" \
            --start-time "$START_MS" \
            --filter-pattern '?BBD ?ERROR ?Exception ?Traceback ?Task' \
            --max-items 15 \
            --query 'events[].message' \
            --output text | head -c 4000 || true
          echo
          aws lambda invoke \
            --function-name "$FN" \
            --region "$REGION" \
            --cli-read-timeout 180 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"live_tick"}' \
            /tmp/live.json > /tmp/meta.json
          python3 - << 'PY'
          import json
          meta = json.load(open("/tmp/meta.json"))
          body = json.load(open("/tmp/live.json"))
          print("INVOKE", {k: meta.get(k) for k in ("StatusCode", "FunctionError")})

          def scrub(value, depth=0):
              if depth > 6:
                  return "..."
              if isinstance(value, dict):
                  hidden = {"api_key", "authorization", "Authorization", "token"}
                  return {key: scrub(item, depth + 1) for key, item in value.items() if key not in hidden}
              if isinstance(value, list):
                  return [scrub(item, depth + 1) for item in value[:12]]
              if isinstance(value, str) and len(value) > 300:
                  return value[:300]
              return value

          print(json.dumps(scrub(body), sort_keys=True)[:7000])
          PY
