name: MLB Historical Recovery V10

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-recovery-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HIST_STACK: parlay-platform-mlb-historical-optimizer

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Recover historical optimizer and always publish evidence
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set +e
          mkdir -p docs/runtime /tmp/mlb-v10
          PROOF=docs/runtime/mlb-historical-recovery-v10-proof.json
          LOG=/tmp/mlb-v10/recovery.log
          STATUS=/tmp/mlb-v10/status.json
          RESULT=FAILED
          FAILED_STAGE=bootstrap

          publish() {
            EXIT_CODE="$1"
            python - "$PROOF" "$LOG" "$STATUS" "$RESULT" "$FAILED_STAGE" "$EXIT_CODE" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          proof_path, log_path, status_path, result, stage, exit_code = sys.argv[1:]
          status = {}
          if os.path.exists(status_path):
              try:
                  status = json.load(open(status_path))
              except Exception as exc:
                  status = {'statusParseError': f'{type(exc).__name__}:{exc}'}
          state = status.get('state') or {}
          log = ''
          if os.path.exists(log_path):
              log = open(log_path, errors='replace').read()[-12000:]
          proof = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'result': result,
              'failedStage': stage,
              'exitCode': int(exit_code),
              'workflowSha': os.environ.get('GITHUB_SHA'),
              'version': status.get('version'),
              'phase': state.get('phase'),
              'currentDate': state.get('currentDate'),
              'currentSlotIndex': state.get('currentSlotIndex'),
              'networkRequestCount': state.get('networkRequestCount'),
              'eligibleGameCount': state.get('eligibleGameCount'),
              'completeSlateCount': state.get('completeSlateCount'),
              'optimizationRound': state.get('optimizationRound'),
              'lastError': state.get('lastError'),
              'skippedHistoricalSlotCount': len(state.get('skippedHistoricalSlots') or []),
              'logTail': log,
          }
          json.dump(proof, open(proof_path, 'w'), indent=2)
          print(json.dumps(proof, indent=2))
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$PROOF"
            git commit -m "chore: publish MLB historical recovery v10 evidence" || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
            exit "$EXIT_CODE"
          }

          FAILED_STAGE=validate_source
          python -m py_compile hello_world/mlb_historical_optimizer_handler.py hello_world/mlb_historical_optimizer_entrypoint.py >>"$LOG" 2>&1 || publish $?
          grep -Fq 'v1.8-archive-before-freshness-quarantine' hello_world/mlb_historical_optimizer_handler.py >>"$LOG" 2>&1 || publish $?
          if sed -n '/def _fetch_historical/,/return dict(payload), headers/p' hello_world/mlb_historical_optimizer_handler.py | grep -Fq 'normalize_historical_snapshot'; then
            echo 'fetch path still validates freshness before archival' >>"$LOG"
            publish 91
          fi

          FAILED_STAGE=resolve_lambda
          HIST_FN=$(aws cloudformation describe-stacks --stack-name "$HIST_STACK" --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" --output text 2>>"$LOG") || publish $?
          test -n "$HIST_FN" || { echo 'Historical Lambda name missing' >>"$LOG"; publish 92; }
          echo "Historical Lambda: $HIST_FN" >>"$LOG"

          FAILED_STAGE=package
          rm -f /tmp/mlb-v10/function.zip
          (cd hello_world && zip -qr /tmp/mlb-v10/function.zip . -x '__pycache__/*' '*.pyc') >>"$LOG" 2>&1 || publish $?

          FAILED_STAGE=update_lambda
          aws lambda update-function-code --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --zip-file fileb:///tmp/mlb-v10/function.zip --publish >/tmp/mlb-v10/update.json 2>>"$LOG" || publish $?
          aws lambda wait function-updated-v2 --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" >>"$LOG" 2>&1 || publish $?

          FAILED_STAGE=verify_package
          URL=$(aws lambda get-function --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --query 'Code.Location' --output text 2>>"$LOG") || publish $?
          curl -fsSL "$URL" -o /tmp/mlb-v10/deployed.zip 2>>"$LOG" || publish $?
          unzip -p /tmp/mlb-v10/deployed.zip mlb_historical_optimizer_handler.py >/tmp/mlb-v10/deployed-handler.py 2>>"$LOG" || publish $?
          grep -Fq 'v1.8-archive-before-freshness-quarantine' /tmp/mlb-v10/deployed-handler.py || { echo 'AWS package missing v1.8' >>"$LOG"; publish 93; }

          FAILED_STAGE=invoke
          for i in 1 2 3 4 5 6 7 8; do
            aws lambda invoke --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload "{\"mode\":\"orchestrate\",\"run\":\"recovery_v10_${i}\"}" "/tmp/mlb-v10/run-${i}.json" >>"$LOG" 2>&1 || publish $?
            cat "/tmp/mlb-v10/run-${i}.json" >>"$LOG" 2>&1
            sleep 2
          done

          FAILED_STAGE=status
          aws lambda invoke --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload '{"mode":"status","run":"recovery_v10_status"}' "$STATUS" >>"$LOG" 2>&1 || publish $?

          FAILED_STAGE=validate_recovery
          python - "$STATUS" >>"$LOG" 2>&1 <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1]))
          state=value.get('state') or {}
          assert 'v1.8-archive-before-freshness-quarantine' in str(value.get('version')), value
          assert 'too stale for a 15-minute grid' not in str(state.get('lastError') or ''), state
          assert (str(state.get('currentDate')), int(state.get('currentSlotIndex') or 0)) != ('2025-04-14',72), state
          PY
          RC=$?
          if [ "$RC" -ne 0 ]; then publish "$RC"; fi

          RESULT=SUCCESS
          FAILED_STAGE=none
          publish 0
