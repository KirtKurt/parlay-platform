name: MLB AUTO Autonomy Recover Live

on:
  push:
    branches: ["agent/mlb-auto-autonomy-chain-20260814"]
    paths:
      - ".github/workflows/mlb-auto-autonomy-recover-live.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mlb-auto-autonomy-recover-live
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "boto3>=1.34,<2"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run latest enabled prospective backlog reconciler
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORKFLOW=$(gh workflow list --all --json path,state \
            --jq '[.[] | select(.state == "active") | select(.path | test("mlb-prospective-backlog-reconcile.*\\.yml$"))] | sort_by(.path) | last | .path // ""')
          if [ -z "$WORKFLOW" ]; then
            echo "workflow=" >> "$GITHUB_OUTPUT"
            echo "conclusion=not_found" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Selected backlog workflow: $WORKFLOW"
          BEFORE=$(gh run list --workflow "$WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run "$WORKFLOW" --ref main
          RUN_ID=""
          for attempt in $(seq 1 40); do
            RUN_ID=$(gh run list --workflow "$WORKFLOW" --branch main --limit 5 --json databaseId --jq ".[0].databaseId // 0")
            if [ "$RUN_ID" != "0" ] && [ "$RUN_ID" != "$BEFORE" ]; then break; fi
            sleep 5
          done
          test -n "$RUN_ID" && test "$RUN_ID" != "0"
          CONCLUSION=""
          for attempt in $(seq 1 120); do
            STATUS=$(gh run view "$RUN_ID" --json status --jq '.status')
            CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion // ""')
            echo "Backlog reconciliation $RUN_ID status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then break; fi
            sleep 10
          done
          echo "workflow=$WORKFLOW" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          if [ "$CONCLUSION" != "success" ]; then
            gh run view "$RUN_ID" --log-failed || true
          fi

      - name: Dispatch and wait for canonical main deploy
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse HEAD)
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          gh workflow run deploy.yml --ref main || true
          RUN_ID=""
          CONCLUSION=""
          for attempt in $(seq 1 140); do
            LINE=$(gh run list --workflow deploy.yml --branch main --limit 30 --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$MAIN_SHA\")" | head -n 1)
            if [ -n "$LINE" ]; then
              RUN_ID=$(printf '%s' "$LINE" | jq -r '.databaseId')
              STATUS=$(printf '%s' "$LINE" | jq -r '.status')
              CONCLUSION=$(printf '%s' "$LINE" | jq -r '.conclusion // ""')
              echo "Deploy $RUN_ID status=$STATUS conclusion=$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then break; fi
            fi
            sleep 15
          done
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          if [ "$CONCLUSION" != "success" ]; then
            gh run view "$RUN_ID" --log-failed || true
          fi

      - name: Invoke recovered trainer and hypothesis layer
        id: invoke
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          TRAINER=$(aws cloudformation describe-stack-resource --stack-name parlay-platform-dev --region "$AWS_REGION" --logical-resource-id MLBMLTrainingFunction --query 'StackResourceDetail.PhysicalResourceId' --output text)
          LLM=$(aws cloudformation describe-stack-resource --stack-name parlay-platform-dev --region "$AWS_REGION" --logical-resource-id MLBLLMHypothesisFunction --query 'StackResourceDetail.PhysicalResourceId' --output text)
          echo "trainer=$TRAINER" >> "$GITHUB_OUTPUT"
          echo "llm=$LLM" >> "$GITHUB_OUTPUT"
          for MODE in selection_capture training status; do
            PAYLOAD=$(printf '{"execution_mode":"%s","executionMode":"%s","mode":"%s","continueAfterUnresolved":true,"reconcileBacklog":true}' "$MODE" "$MODE" "$MODE")
            aws lambda invoke --function-name "$TRAINER" --region "$AWS_REGION" --cli-binary-format raw-in-base64-out --payload "$PAYLOAD" "/tmp/recovered_${MODE}.json" >/dev/null
          done
          aws lambda invoke --function-name "$LLM" --region "$AWS_REGION" --cli-binary-format raw-in-base64-out --payload '{"researchContext":{"weakPatterns":["high reversal count","agreement without structural confirmation","late instability"],"latestMetrics":{"targetAccuracyPct":90},"currentModelFamilies":["logistic","gradient_boosted_trees"]}}' /tmp/recovered_llm.json >/dev/null

      - name: Build recovery proof
        env:
          MAIN_SHA: ${{ steps.deploy.outputs.main_sha }}
          DEPLOY_RUN_ID: ${{ steps.deploy.outputs.run_id }}
          DEPLOY_CONCLUSION: ${{ steps.deploy.outputs.conclusion }}
          RECONCILE_WORKFLOW: ${{ steps.reconcile.outputs.workflow }}
          RECONCILE_RUN_ID: ${{ steps.reconcile.outputs.run_id }}
          RECONCILE_CONCLUSION: ${{ steps.reconcile.outputs.conclusion }}
          TRAINER_FUNCTION: ${{ steps.invoke.outputs.trainer }}
          LLM_FUNCTION: ${{ steps.invoke.outputs.llm }}
        run: |
          mkdir -p runtime_reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(name):
              value = json.load(open(f"/tmp/recovered_{name}.json", encoding="utf-8"))
              if isinstance(value, dict) and isinstance(value.get("body"), str):
                  try:
                      body = json.loads(value["body"])
                      if isinstance(body, dict): return body
                  except Exception: pass
              return value

          selection, training, status, llm = (load(name) for name in ("selection_capture", "training", "status", "llm"))
          chain = training.get("mlbAutoAutonomyChain") or {}
          consumer = status.get("v2InferenceConsumer") or (status.get("mlbAutoAutonomyChain") or {}).get("v2InferenceConsumer") or {}
          continuity = training.get("canonicalSlateContinuity") or {}
          accepted = int(training.get("acceptedRowCount") or 0)
          blockers = []
          if os.environ.get("DEPLOY_CONCLUSION") != "success": blockers.append("main_deploy_not_successful")
          if os.environ.get("RECONCILE_CONCLUSION") not in {"success", ""}: blockers.append("backlog_reconciliation_not_successful")
          if accepted <= 0: blockers.append("accepted_training_rows_not_above_zero")
          if continuity.get("unresolvedSlateStopsLaterEvaluation") is not False: blockers.append("continuity_still_stop_first")
          if chain.get("automaticPromotionEnabled") is not True: blockers.append("automatic_promotion_disabled")
          if chain.get("firstPromotionRequiresManualReview") is not False: blockers.append("manual_first_promotion_required")
          if chain.get("learningContinuesBelow90Pct") is not True: blockers.append("learning_below_90_disabled")
          if consumer.get("installed") is not True: blockers.append("v2_consumer_not_installed")
          if llm.get("ok") is not True or int(llm.get("hypothesisCount") or 0) <= 0: blockers.append("llm_hypothesis_not_generated")
          proof = {
              "ok": not blockers,
              "proofType": "MLB_AUTO_AUTONOMY_LIVE_RECOVERY",
              "createdAtUtc": datetime.now(timezone.utc).isoformat(),
              "mainGitSha": os.environ.get("MAIN_SHA"),
              "deployRunId": os.environ.get("DEPLOY_RUN_ID"),
              "deployConclusion": os.environ.get("DEPLOY_CONCLUSION"),
              "backlogReconciler": {
                  "workflow": os.environ.get("RECONCILE_WORKFLOW"),
                  "runId": os.environ.get("RECONCILE_RUN_ID"),
                  "conclusion": os.environ.get("RECONCILE_CONCLUSION"),
              },
              "trainerFunction": os.environ.get("TRAINER_FUNCTION"),
              "llmFunction": os.environ.get("LLM_FUNCTION"),
              "acceptedRowCount": accepted,
              "trainingStatus": training.get("status"),
              "canonicalSlateContinuity": continuity,
              "automaticPromotionEnabled": chain.get("automaticPromotionEnabled"),
              "firstPromotionRequiresManualReview": chain.get("firstPromotionRequiresManualReview"),
              "learningContinuesBelow90Pct": chain.get("learningContinuesBelow90Pct"),
              "v2InferenceConsumer": consumer,
              "llmHypothesis": {
                  "ok": llm.get("ok"),
                  "status": llm.get("status"),
                  "hypothesisCount": llm.get("hypothesisCount"),
                  "modelId": llm.get("modelId"),
                  "errorType": llm.get("errorType"),
                  "productionAuthority": llm.get("productionAuthority"),
              },
              "blockers": blockers,
              "secretExposed": False,
          }
          Path("runtime_reports/mlb_auto_autonomy_live_recovery_latest.json").write_text(json.dumps(proof, indent=2, default=str) + "\n", encoding="utf-8")
          print(json.dumps(proof, indent=2, default=str))
          PY

      - name: Publish recovery proof
        if: always()
        run: |
          cp runtime_reports/mlb_auto_autonomy_live_recovery_latest.json /tmp/recovery.json
          git fetch origin agent/mlb-auto-autonomy-chain-20260814
          git checkout -B agent/mlb-auto-autonomy-chain-20260814 origin/agent/mlb-auto-autonomy-chain-20260814
          mkdir -p runtime_reports
          cp /tmp/recovery.json runtime_reports/mlb_auto_autonomy_live_recovery_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_reports/mlb_auto_autonomy_live_recovery_latest.json
          git commit -m "Publish MLB AUTO live recovery proof [skip ci]" || true
          git push origin HEAD:agent/mlb-auto-autonomy-chain-20260814 || true

      - name: Enforce recovered autonomy
        run: |
          python - <<'PY'
          import json
          proof = json.load(open('runtime_reports/mlb_auto_autonomy_live_recovery_latest.json', encoding='utf-8'))
          if proof.get('ok') is not True:
              raise SystemExit('MLB AUTO live recovery remains blocked: ' + json.dumps(proof.get('blockers')))
          PY
