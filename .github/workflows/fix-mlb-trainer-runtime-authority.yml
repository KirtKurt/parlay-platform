name: Fix MLB trainer runtime authority contract

on:
  push:
    branches: [main]
    paths:
      - ".github/mlb-trainer-runtime-authority-trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repair stale trainer capability assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify_mlb_trainer_deploy_response.py")
          text = path.read_text(encoding="utf-8")
          old_check = 'status_after.get("runtimeAuthorityActivationAvailable") is not False'
          new_check = 'status_after.get("runtimeAuthorityActivationAvailable") is not True'
          old_error = 'runtime_authority_activation_must_remain_unavailable'
          new_error = 'runtime_authority_activation_not_available'
          if old_check in text:
              if text.count(old_check) != 1 or text.count(old_error) != 1:
                  raise SystemExit("trainer runtime authority assertion is ambiguous")
              text = text.replace(old_check, new_check, 1)
              text = text.replace(old_error, new_error, 1)
          elif new_check not in text or new_error not in text:
              raise SystemExit("trainer runtime authority assertion anchor not found")
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/unit/test_mlb_trainer_runtime_authority_contract.py")
          test_path.write_text('''from pathlib import Path


def test_trainer_and_live_runtime_agree_activation_is_available() -> None:
    verifier = Path("scripts/verify_mlb_trainer_deploy_response.py").read_text(encoding="utf-8")
    workflow = Path(".github/workflows/deploy.yml").read_text(encoding="utf-8")
    assert 'runtimeAuthorityActivationAvailable") is not True' in verifier
    assert 'runtime_authority_activation_not_available' in verifier
    assert "'runtimeAuthorityActivationAvailable': True" in workflow
    assert 'runtime_authority_activation_must_remain_unavailable' not in verifier
''', encoding="utf-8")
          PY
      - name: Run contract regressions
        run: |
          python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9" "PyYAML>=6,<7"
          python -m pytest -q tests/unit/test_mlb_trainer_runtime_authority_contract.py tests/unit/test_mlb_deploy_identity.py tests/unit/test_mlb_production_acceptance.py
          python -m py_compile scripts/verify_mlb_trainer_deploy_response.py
      - name: Commit verified repair
        run: |
          if git diff --quiet; then
            echo "Repair already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_mlb_trainer_deploy_response.py tests/unit/test_mlb_trainer_runtime_authority_contract.py
          git commit -m "Align MLB trainer runtime authority verification"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
