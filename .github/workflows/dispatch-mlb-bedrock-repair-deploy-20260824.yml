name: Dispatch tested MLB Bedrock endpoint repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-mlb-bedrock-repair-deploy-20260824.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require tested repair on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api --repo "$GITHUB_REPOSITORY" repos/${GITHUB_REPOSITORY}/commits/6b54528163823284fce6f6a0305d5b99f4edc5a6 --jq .sha)" = "6b54528163823284fce6f6a0305d5b99f4edc5a6"

      - name: Dispatch isolated MLB AUTO production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-mlb-auto-llm.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
