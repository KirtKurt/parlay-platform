name: Soccer workflow read-only diagnostic

on:
  workflow_dispatch:
  push:
    branches: ['codex/soccer-workflow-repair-20260920']
    paths:
      - '.github/workflows/soccer-workflow-diagnostic.yml'
      - 'scripts/diagnose_soccer_workflows.py'
      - 'soccer_auto/**'
      - 'tests/soccer_auto/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test isolated soccer contracts
        run: |
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m pytest -q tests/soccer_auto
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Read isolated API logs and evidence table sizes
        run: |
          python scripts/diagnose_soccer_workflows.py --candidate-readback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-workflow-diagnostic-${{ github.run_id }}
          path: /tmp/soccer-workflow-diagnostic.json
