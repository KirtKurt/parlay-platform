name: Diagnose PR601 R7 integrity now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pr601-r7-integrity-now.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect synthetic pull integrity
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9"
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('r7_fixture', Path('tests/unit/test_mlb_daily_per_game_lock.py'))
          t = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(t)
          target = t.game('mlb_statsapi:991556', '2026-07-13T18:00:00+00:00')
          target.update({'official_game_pk':'991556','official_commence_time':target['commence_time'],'official_status':{'abstractGameState':'Preview'}})
          source = t.pull('2026-07-13T17:00:00+00:00',[target],'real-quarantine')
          print('PULL_INTEGRITY', t.history_contract._pull_integrity_errors(source, sport='mlb'))
          print('MANIFEST_ERRORS', t.history_contract.validate_provider_schedule_manifest(source, t.SLATE))
          print('HAS_MONEYLINE_RAW', t.patch._has_moneyline(source['games'][0]))
          canonical = t.history_contract.canonicalize_pull_slots([source], sport='mlb')
          print('CANONICAL_COUNT', len(canonical))
          if canonical:
              print('HAS_MONEYLINE_CANONICAL', t.patch._has_moneyline(canonical[0]['games'][0]))
              print('MATCHING', bool(t.patch._matching_game(canonical[0], source['games'][0])))
          PY
      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/r7-integrity-cleanup origin/main
          cd /tmp/r7-integrity-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-pr601-r7-integrity-now.yml
          git commit -m 'Remove completed PR601 R7 integrity diagnostic [skip ci]'
          git push origin HEAD:main
