name: Repair Tennis Autonomy Runtime 2026-08-02 0438

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-tennis-autonomy-runtime-20260802-0438.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-tennis-autonomy-runtime-20260802-0438
  cancel-in-progress: false

jobs:
  test-query-repair-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run isolated tennis autonomy contract tests
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2'
          python -m py_compile \
            tennis_learning/handler.py \
            tennis_learning/live_pipeline.py \
            tennis_learning/autonomous_controller.py \
            tennis_learning/backfill.py
          python -m pytest -q \
            tests/test_tennis_autonomy_contract.py \
            tests/test_tennis_backfill_contract.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Query live state and self-heal only when stale
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-tennis-learning
          region="$AWS_REGION_VALUE"
          work=/tmp/tennis-autonomy-runtime-0438
          mkdir -p "$work" runtime

          stack_status=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$region" \
            --query 'Stacks[0].StackStatus' --output text)
          status_endpoint=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$region" \
            --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" \
            --output text)
          run_endpoint=$(aws cloudformation describe-stacks \
            --stack-name "$stack" --region "$region" \
            --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyRunApi'].OutputValue" \
            --output text)

          test -n "$status_endpoint"; test "$status_endpoint" != None
          test -n "$run_endpoint"; test "$run_endpoint" != None

          curl -fsS --retry 4 --retry-all-errors --retry-delay 5 --max-time 60 \
            "$status_endpoint" -o "$work/status-before.json"

          stale=$(python - "$work/status-before.json" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          payload=json.load(open(sys.argv[1]))
          raw=payload.get('last_cycle_at')
          if not raw:
              print('true')
          else:
              stamp=datetime.fromisoformat(str(raw).replace('Z','+00:00'))
              age=(datetime.now(timezone.utc)-stamp.astimezone(timezone.utc)).total_seconds()
              print('true' if age > 2700 else 'false')
          PY
          )

          attempted=false
          succeeded=false
          heal_error=''
          if [ "$stale" = true ]; then
            attempted=true
            set +e
            curl -fsS --retry 2 --retry-all-errors --retry-delay 10 \
              -X POST --max-time 900 "$run_endpoint" \
              -o "$work/repair-response.json" 2>"$work/repair-error.txt"
            repair_rc=$?
            set -e
            if [ "$repair_rc" -eq 0 ]; then
              for attempt in $(seq 1 10); do
                sleep 10
                if curl -fsS --retry 3 --retry-all-errors --retry-delay 3 --max-time 60 \
                  "$status_endpoint" -o "$work/status-after.json"; then
                  fresh=$(python - "$work/status-after.json" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          payload=json.load(open(sys.argv[1]))
          raw=payload.get('last_cycle_at')
          if not raw:
              print('false')
          else:
              stamp=datetime.fromisoformat(str(raw).replace('Z','+00:00'))
              age=(datetime.now(timezone.utc)-stamp.astimezone(timezone.utc)).total_seconds()
              print('true' if age <= 2700 else 'false')
          PY
                  )
                  if [ "$fresh" = true ]; then
                    succeeded=true
                    break
                  fi
                fi
              done
              if [ "$succeeded" != true ]; then
                heal_error='Autonomy invocation returned successfully but fresh status was not observed within the verification window.'
              fi
            else
              heal_error=$(cat "$work/repair-error.txt")
            fi
          else
            cp "$work/status-before.json" "$work/status-after.json"
          fi

          if [ ! -s "$work/status-after.json" ]; then
            cp "$work/status-before.json" "$work/status-after.json"
          fi

          export STACK_STATUS="$stack_status"
          export STALE_BEFORE="$stale"
          export SELF_HEAL_ATTEMPTED="$attempted"
          export SELF_HEAL_SUCCEEDED="$succeeded"
          export SELF_HEAL_ERROR="$heal_error"
          export SOURCE_SHA="$GITHUB_SHA"
          export LIVE_PATH="$work/status-after.json"
          export OUTPUT_PATH="$work/snapshot.json"

          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          now=datetime.now(timezone.utc)
          live=json.loads(Path(os.environ['LIVE_PATH']).read_text())
          training=int(live.get('training_samples') or 0)
          audited=int(live.get('live_audit_count') or 0)
          accuracy=live.get('live_accuracy')
          brier=live.get('live_brier')
          accuracy=float(accuracy) if accuracy is not None else None
          brier=float(brier) if brier is not None else None
          failures=int(live.get('consecutive_failures') or 0)
          authority=str(live.get('authority') or 'UNKNOWN')
          automatic=bool(live.get('automatic_prediction_allowed', False))
          last_cycle=live.get('last_cycle_at')
          age=None
          fresh=False
          if last_cycle:
              stamp=datetime.fromisoformat(str(last_cycle).replace('Z','+00:00'))
              age=round(max(0.0,(now-stamp.astimezone(timezone.utc)).total_seconds()/60.0),2)
              fresh=age <= 45.0

          gates={
              'training_samples_100': training >= 100,
              'live_audits_30': audited >= 30,
              'live_accuracy_55pct': accuracy is not None and accuracy >= 0.55,
              'brier_at_most_0_25': brier is not None and brier <= 0.25,
              'circuit_breaker_clear': failures < 3 and authority != 'DEGRADED',
          }
          all_gates=all(gates.values())
          heal_error=os.environ.get('SELF_HEAL_ERROR','').strip() or None
          stack_status=os.environ.get('STACK_STATUS') or 'UNKNOWN'
          authority_consistent=(
              (authority == 'SHADOW' and automatic is False)
              or (authority == 'AUTHORITATIVE' and automatic is True and all_gates)
          )
          operational=(
              stack_status == 'UPDATE_COMPLETE'
              and fresh
              and failures < 3
              and authority in {'SHADOW','AUTHORITATIVE'}
              and authority_consistent
              and not heal_error
              and live.get('last_error') in (None, '')
          )
          snapshot={
              'checked_at': now.isoformat(),
              'source_commit': os.environ.get('SOURCE_SHA'),
              'stack_status': stack_status,
              'status_endpoint_available': True,
              'query_succeeded': True,
              'query_error': None,
              'service': live.get('service'),
              'authority': authority,
              'authority_consistent': authority_consistent,
              'reason': live.get('reason'),
              'last_error': live.get('last_error'),
              'last_warning': live.get('last_warning'),
              'historical_backfill_enabled': live.get('historical_backfill_enabled'),
              'historical_backfill_required': live.get('historical_backfill_required'),
              'automatic_prediction_allowed': automatic,
              'training_samples': training,
              'live_audit_count': audited,
              'live_accuracy': accuracy,
              'live_brier': brier,
              'consecutive_failures': failures,
              'last_cycle_at': last_cycle,
              'cycle_age_minutes': age,
              'cycle_fresh': fresh,
              'cycle_stale_before_repair': os.environ.get('STALE_BEFORE') == 'true',
              'self_heal_attempted': os.environ.get('SELF_HEAL_ATTEMPTED') == 'true',
              'self_heal_succeeded': os.environ.get('SELF_HEAL_SUCCEEDED') == 'true',
              'self_heal_error': heal_error,
              'model_version': live.get('model_version'),
              'promotion_gates': gates,
              'all_promotion_gates_pass': all_gates,
              'operationally_healthy': operational,
          }
          Path(os.environ['OUTPUT_PATH']).write_text(json.dumps(snapshot,indent=2,sort_keys=True)+'\n')
          print(json.dumps(snapshot,indent=2,sort_keys=True))

          assert snapshot['stack_status'] == 'UPDATE_COMPLETE', snapshot
          assert snapshot['cycle_fresh'] is True, snapshot
          assert snapshot['consecutive_failures'] < 3, snapshot
          assert snapshot['authority'] in {'SHADOW','AUTHORITATIVE'}, snapshot
          assert snapshot['authority_consistent'] is True, snapshot
          assert snapshot['last_error'] in (None, ''), snapshot
          assert snapshot['operationally_healthy'] is True, snapshot
          PY

          cp "$work/snapshot.json" /tmp/tennis-autonomy-runtime-0438-snapshot.json

      - name: Publish verified snapshot and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in $(seq 1 30); do
            git fetch origin main
            git checkout -B tennis-autonomy-runtime-0438-publish origin/main
            mkdir -p runtime
            cp /tmp/tennis-autonomy-runtime-0438-snapshot.json runtime/tennis_autonomy_status.json
            rm -f .github/workflows/repair-tennis-autonomy-runtime-20260802-0438.yml
            git add runtime/tennis_autonomy_status.json \
              .github/workflows/repair-tennis-autonomy-runtime-20260802-0438.yml
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Verify and refresh tennis autonomy runtime evidence [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((3 + attempt % 7))
          done

          echo 'Unable to publish verified tennis autonomy evidence after 30 attempts.' >&2
          exit 1
