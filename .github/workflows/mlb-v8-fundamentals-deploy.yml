name: Deploy MLB V8 Fundamentals Shadow

on:
  workflow_dispatch:
    inputs:
      enable_schedule_after_canary:
        description: Enable the 15-minute schedule only after a successful provider-resource canary
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_v8_fundamentals_collector.py'
      - 'hello_world/bigballsdata_client.py'
      - 'mlb_v8_fundamentals/template.yaml'
      - '.github/workflows/mlb-v8-fundamentals-deploy.yml'

permissions:
  contents: read

concurrency:
  group: mlb-v8-fundamentals-shadow-deploy
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-v8-fundamentals-shadow
  AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}

jobs:
  deploy-canary-enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Validate required secrets
        env:
          BBS_API_SECRET_ARN: ${{ secrets.BBS_API_SECRET_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION_VALUE"
          test -n "$BBS_API_SECRET_ARN"
      - name: Validate, build, and deploy schedule-disabled stack
        env:
          BBS_API_SECRET_ARN: ${{ secrets.BBS_API_SECRET_ARN }}
        run: |
          set -euo pipefail
          sam validate --lint --template-file mlb_v8_fundamentals/template.yaml
          sam build --no-cached --template-file mlb_v8_fundamentals/template.yaml
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION_VALUE" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BbsApiSecretArn="$BBS_API_SECRET_ARN" \
              DeployGitSha="${GITHUB_SHA}" \
              FundamentalsScheduleEnabled=false
      - name: Invoke live provider canary and verify all required resource feeds
        id: canary
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='FundamentalsCollectorFunctionName'].OutputValue" --output text)
          bucket_name=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='FundamentalsArtifactsBucketName'].OutputValue" --output text)
          test -n "$function_name"; test "$function_name" != None
          test -n "$bucket_name"; test "$bucket_name" != None
          aws lambda invoke --function-name "$function_name" --region "$AWS_REGION_VALUE" --payload '{"mode":"manual_canary"}' --cli-binary-format raw-in-base64-out /tmp/v8-fundamentals-canary.json >/tmp/v8-fundamentals-invoke.json
          artifact_key=$(python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/v8-fundamentals-canary.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('authority') == 'V8_FUNDAMENTALS_SHADOW_ONLY', value
          assert value.get('productionV7Unchanged') is True, value
          assert value.get('fingerprint'), value
          assert value.get('artifactKey'), value
          assert int(value.get('gameCount') or 0) > 0, 'canary returned no MLB games; provider coverage is unproven'
          print(value['artifactKey'])
          PY
          )
          aws s3 cp "s3://${bucket_name}/${artifact_key}" /tmp/v8-fundamentals-artifact.json --region "$AWS_REGION_VALUE"
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/v8-fundamentals-artifact.json').read_text())
          required={'pitchers','bullpens','lineups','injuries','team_context'}
          games=value.get('games') or []
          assert games, 'artifact contains no games'
          fully_available=[]
          for game in games:
              evidence=game.get('providerEvidence') or {}
              available={name for name in required if (evidence.get(name) or {}).get('available') is True}
              if available == required:
                  fully_available.append(game.get('matchId'))
          assert fully_available, 'no game proved all required provider resource endpoints available'
          print(json.dumps({'gameCount':len(games),'fullyAvailableGameCount':len(fully_available),'fullyAvailableMatchIds':fully_available},indent=2,sort_keys=True))
          PY
      - name: Enable 15-minute schedule only after explicit manual authorization
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_schedule_after_canary == 'true' }}
        env:
          BBS_API_SECRET_ARN: ${{ secrets.BBS_API_SECRET_ARN }}
        run: |
          set -euo pipefail
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION_VALUE" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BbsApiSecretArn="$BBS_API_SECRET_ARN" \
              DeployGitSha="${GITHUB_SHA}" \
              FundamentalsScheduleEnabled=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v8-fundamentals-canary-${{ github.run_id }}
          path: |
            /tmp/v8-fundamentals-canary.json
            /tmp/v8-fundamentals-invoke.json
            /tmp/v8-fundamentals-artifact.json
          retention-days: 90
          if-no-files-found: warn
