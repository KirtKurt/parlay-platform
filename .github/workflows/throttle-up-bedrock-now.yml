name: Ramp MLB AUTO Bedrock capacity now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/throttle-up-bedrock-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-auto-bedrock-capacity-ramp
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: parlay-platform-mlb-auto-llm
  REPORT_PATH: runtime_reports/bedrock_throughput_validation_latest.json

jobs:
  ramp-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate MLB-only Bedrock capacity contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m py_compile \
            mlb_auto_llm/model_gateway.py \
            mlb_auto_llm/production_model_gateway.py \
            mlb_auto_llm/bedrock_smoke.py \
            mlb_auto_llm/ml_authority_smoke.py \
            mlb_auto_llm/capacity_manager.py
          python -m pytest -q \
            tests/unit/test_mlb_auto_bedrock_smoke.py \
            tests/unit/test_mlb_auto_production_model_gateway.py \
            tests/unit/test_mlb_auto_capacity_manager.py
          python - <<'PY'
          import yaml
          from pathlib import Path

          template = yaml.safe_load(Path('mlb-auto-llm-template.yaml').read_text())
          resources = template['Resources']
          main = resources['MLBAutoLLMFunction']['Properties']
          smoke = resources['MLBAutoLLMBedrockSmokeFunction']['Properties']
          manager = resources['MLBAutoBedrockCapacityManagerFunction']['Properties']
          assert int(main['MemorySize']) == 10240
          assert int(main['EphemeralStorage']['Size']) >= 2048
          assert int(smoke['Environment']['Variables']['MLB_AUTO_BEDROCK_SMOKE_ROUTE_LIMIT']) >= 16
          assert int(smoke['Environment']['Variables']['MLB_AUTO_BEDROCK_MAX_MODEL_ATTEMPTS']) >= 80
          assert manager['Handler'] == 'capacity_manager.lambda_handler'
          actions = {
              action
              for policy in manager['Policies']
              for statement in policy.get('Statement', [])
              for action in statement.get('Action', [])
          }
          assert 'servicequotas:ListServiceQuotas' in actions
          assert 'servicequotas:RequestServiceQuotaIncrease' in actions
          assert 'bedrock:InvokeModel' in actions
          print('MLB AUTO maximum compute, route diversification, and isolated quota role: PASS')
          PY
          git diff --check

      - name: Wait for isolated capacity-manager Lambda deployment
        id: manager
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            function_name=$(aws cloudformation describe-stack-resource \
              --stack-name "$STACK_NAME" \
              --logical-resource-id MLBAutoBedrockCapacityManagerFunction \
              --region "$AWS_REGION" \
              --query 'StackResourceDetail.PhysicalResourceId' \
              --output text 2>/dev/null || true)
            if [ -n "$function_name" ] && [ "$function_name" != "None" ]; then
              handler=$(aws lambda get-function-configuration \
                --function-name "$function_name" \
                --region "$AWS_REGION" \
                --query 'Handler' \
                --output text 2>/dev/null || true)
              update_status=$(aws lambda get-function-configuration \
                --function-name "$function_name" \
                --region "$AWS_REGION" \
                --query 'LastUpdateStatus' \
                --output text 2>/dev/null || true)
              if [ "$handler" = 'capacity_manager.lambda_handler' ] && [ "$update_status" = 'Successful' ]; then
                echo "function_name=$function_name" >> "$GITHUB_OUTPUT"
                echo "Capacity manager ready: $function_name"
                exit 0
              fi
            fi
            sleep 20
          done
          echo 'MLB AUTO capacity-manager Lambda did not become ready.' >&2
          exit 1

      - name: Request 10x quotas and require live Lambda-role capacity
        shell: bash
        env:
          CAPACITY_FUNCTION: ${{ steps.manager.outputs.function_name }}
        run: |
          set -euo pipefail
          test -n "$CAPACITY_FUNCTION"
          mkdir -p runtime_reports /tmp/mlb-bedrock-capacity
          success=false
          for attempt in $(seq 1 8); do
            payload=$(python - <<PY
          import json
          print(json.dumps({
              'requestQuotaIncreases': True,
              'desiredMultiplier': 10,
              'maxQuotaRequests': 30,
              'maxRoutesPerRegion': 24 if $attempt == 1 else 12,
          }, separators=(',', ':')))
          PY
            )
            set +e
            aws lambda invoke \
              --function-name "$CAPACITY_FUNCTION" \
              --region "$AWS_REGION" \
              --cli-binary-format raw-in-base64-out \
              --cli-connect-timeout 30 \
              --cli-read-timeout 900 \
              --payload "$payload" \
              "/tmp/mlb-bedrock-capacity/response-$attempt.json" \
              >"/tmp/mlb-bedrock-capacity/invocation-$attempt.json"
            invoke_rc=$?
            set -e
            ATTEMPT="$attempt" INVOKE_RC="$invoke_rc" python - <<'PY'
          import json
          import os
          from pathlib import Path

          attempt = int(os.environ['ATTEMPT'])
          invoke_rc = int(os.environ['INVOKE_RC'])
          response_path = Path(f'/tmp/mlb-bedrock-capacity/response-{attempt}.json')
          invocation_path = Path(f'/tmp/mlb-bedrock-capacity/invocation-{attempt}.json')
          invocation = (
              json.loads(invocation_path.read_text())
              if invocation_path.exists() and invocation_path.stat().st_size
              else {}
          )
          response = (
              json.loads(response_path.read_text())
              if response_path.exists() and response_path.stat().st_size
              else {}
          )
          report = dict(response) if isinstance(response, dict) else {}
          report.update({
              'sourceSha': os.environ.get('GITHUB_SHA'),
              'runId': os.environ.get('GITHUB_RUN_ID'),
              'runAttempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'capacityWorkflowAttempt': attempt,
              'lambdaInvocationExitCode': invoke_rc,
              'lambdaFunctionError': invocation.get('FunctionError'),
              'lambdaStatusCode': invocation.get('StatusCode'),
          })
          Path('runtime_reports/bedrock_throughput_validation_latest.json').write_text(
              json.dumps(report, indent=2, sort_keys=True, default=str) + '\n'
          )
          print(json.dumps({
              'attempt': attempt,
              'ok': report.get('ok'),
              'liveCapacityOk': report.get('liveCapacityOk'),
              'successfulRegions': report.get('successfulRegions'),
              'quotaIncreaseSubmittedCount': report.get('quotaIncreaseSubmittedCount'),
              'quotaIncreaseAcceptedOrPendingCount': report.get('quotaIncreaseAcceptedOrPendingCount'),
              'quotaIncreaseRequestFailureCount': report.get('quotaIncreaseRequestFailureCount'),
              'lambdaFunctionError': report.get('lambdaFunctionError'),
          }, indent=2, sort_keys=True))
          PY
            if python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('runtime_reports/bedrock_throughput_validation_latest.json').read_text())
          raise SystemExit(0 if (
              report.get('liveCapacityOk') is True
              and report.get('capacityManagerRoleUsed') is True
              and report.get('lambdaFunctionError') in (None, '')
          ) else 1)
          PY
            then
              success=true
              break
            fi
            if [ "$attempt" != 8 ]; then
              echo 'Capacity not live yet; preserving quota requests and retrying in five minutes.'
              sleep 300
            fi
          done
          test "$success" = true

      - name: Publish Bedrock capacity and quota proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REPORT_PATH"
          cp "$REPORT_PATH" /tmp/bedrock-throughput-validation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git checkout -B bedrock-throughput-proof origin/main
            git reset --hard origin/main
            mkdir -p runtime_reports
            cp /tmp/bedrock-throughput-validation.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Publish MLB AUTO Bedrock capacity validation [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce capacity and authority boundaries
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('runtime_reports/bedrock_throughput_validation_latest.json').read_text()
          )
          assert report.get('liveCapacityOk') is True, report
          assert report.get('capacityManagerRoleUsed') is True, report
          assert report.get('mainLambdaMemoryMb') == 10240, report
          assert report.get('mainLambdaEphemeralStorageMb') == 2048, report
          assert report.get('productionRouteAttemptCeiling') == 80, report
          assert report.get('smokeRouteAttemptCeiling') == 16, report
          assert report.get('productionAuthorityChanged') is False, report
          assert report.get('automaticWagerAllowed') is False, report
          assert report.get('secretExposed') is False, report
          assert report.get('lambdaFunctionError') in (None, ''), report
          print(json.dumps({
              'liveCapacityOk': report.get('liveCapacityOk'),
              'successfulRegions': report.get('successfulRegions'),
              'applicationRoute': (report.get('applicationSmoke') or {}).get('routeId'),
              'quotaIncreaseSubmittedCount': report.get('quotaIncreaseSubmittedCount'),
              'quotaIncreaseAcceptedOrPendingCount': report.get('quotaIncreaseAcceptedOrPendingCount'),
              'mainLambdaMemoryMb': report.get('mainLambdaMemoryMb'),
              'productionRouteAttemptCeiling': report.get('productionRouteAttemptCeiling'),
          }, indent=2, sort_keys=True))
          PY
