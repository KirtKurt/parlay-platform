name: Diagnose root deploy workflow initialization failure

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-deploy-workflow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy workflow syntax and expressions
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:latest \
            -color \
            .github/workflows/deploy.yml
