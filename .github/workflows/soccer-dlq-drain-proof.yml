name: Soccer DLQ Drain Proof
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/soccer-dlq-drain-proof.yml']
permissions:
  contents: write
jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Drain with Soccer execution role and always restore worker
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set +e
          mkdir -p runtime_reports /tmp/soccer-drain/pkg/soccer_auto
          stack=parlay-platform-soccer-auto
          worker=$(aws cloudformation describe-stack-resource --stack-name "$stack" --logical-resource-id SoccerCollectionWorkerFunction --region "$REGION" --query StackResourceDetail.PhysicalResourceId --output text)
          mapping=$(aws lambda list-event-source-mappings --function-name "$worker" --region "$REGION" --query 'EventSourceMappings[0].UUID' --output text)
          cp soccer_auto/*.py /tmp/soccer-drain/pkg/soccer_auto/
          (cd /tmp/soccer-drain/pkg && zip -qr /tmp/soccer-drain/worker.zip soccer_auto)
          aws lambda update-function-code --function-name "$worker" --region "$REGION" --zip-file fileb:///tmp/soccer-drain/worker.zip >/tmp/soccer-drain/code.json 2>/tmp/soccer-drain/code.err
          echo $? >/tmp/soccer-drain/code.rc
          aws lambda wait function-updated-v2 --function-name "$worker" --region "$REGION" 2>/tmp/soccer-drain/code-wait.err
          if [[ -n "$mapping" && "$mapping" != None ]]; then
            aws lambda update-event-source-mapping --uuid "$mapping" --region "$REGION" --enabled false --scaling-config MaximumConcurrency=3 >/tmp/soccer-drain/map-disable.json 2>/tmp/soccer-drain/map-disable.err
            for i in $(seq 1 90); do
              state=$(aws lambda get-event-source-mapping --uuid "$mapping" --region "$REGION" --query State --output text 2>/dev/null)
              [[ "$state" == Disabled ]] && break
              sleep 1
            done
          fi
          aws lambda update-function-configuration --function-name "$worker" --region "$REGION" --handler soccer_auto.dlq_recovery.handler >/tmp/soccer-drain/handler-set.json 2>/tmp/soccer-drain/handler-set.err
          echo $? >/tmp/soccer-drain/handler-set.rc
          aws lambda wait function-updated-v2 --function-name "$worker" --region "$REGION" 2>/tmp/soccer-drain/handler-wait.err
          aws lambda invoke --function-name "$worker" --region "$REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"recover_collection_dlq","max_messages":5000}' /tmp/soccer-drain/recovery.json >/tmp/soccer-drain/recovery-meta.json 2>/tmp/soccer-drain/recovery.err
          echo $? >/tmp/soccer-drain/recovery.rc
          aws lambda update-function-configuration --function-name "$worker" --region "$REGION" --handler soccer_auto.collector.worker_handler >/tmp/soccer-drain/handler-restore.json 2>/tmp/soccer-drain/handler-restore.err
          echo $? >/tmp/soccer-drain/handler-restore.rc
          aws lambda wait function-updated-v2 --function-name "$worker" --region "$REGION" 2>/tmp/soccer-drain/restore-wait.err
          if [[ -n "$mapping" && "$mapping" != None ]]; then
            aws lambda update-event-source-mapping --uuid "$mapping" --region "$REGION" --enabled true --scaling-config MaximumConcurrency=3 >/tmp/soccer-drain/map-enable.json 2>/tmp/soccer-drain/map-enable.err
            for i in $(seq 1 90); do
              state=$(aws lambda get-event-source-mapping --uuid "$mapping" --region "$REGION" --query State --output text 2>/dev/null)
              [[ "$state" == Enabled ]] && break
              sleep 1
            done
          fi
          aws lambda get-function-configuration --function-name "$worker" --region "$REGION" --query '{Handler:Handler,State:State,LastUpdateStatus:LastUpdateStatus,LastModified:LastModified,CodeSha256:CodeSha256}' --output json >/tmp/soccer-drain/worker-final.json 2>/tmp/soccer-drain/worker-final.err
          aws lambda get-event-source-mapping --uuid "$mapping" --region "$REGION" --query '{State:State,ScalingConfig:ScalingConfig,FunctionResponseTypes:FunctionResponseTypes}' --output json >/tmp/soccer-drain/map-final.json 2>/tmp/soccer-drain/map-final.err
          python - <<'PY'
          import json,pathlib,datetime
          root=pathlib.Path('/tmp/soccer-drain')
          def text(n):
              p=root/n; return p.read_text() if p.exists() else ''
          def load(n):
              p=root/n
              if not p.exists() or not p.read_text().strip(): return None
              try:return json.loads(p.read_text())
              except:return {'raw':p.read_text()[:20000]}
          report={'proofType':'SOCCER_DLQ_DRAIN_PROOF','observedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'codeRc':text('code.rc').strip(),'codeError':text('code.err'),'handlerSetRc':text('handler-set.rc').strip(),'handlerSetError':text('handler-set.err'),'recoveryRc':text('recovery.rc').strip(),'recoveryMeta':load('recovery-meta.json'),'recovery':load('recovery.json'),'recoveryError':text('recovery.err'),'handlerRestoreRc':text('handler-restore.rc').strip(),'handlerRestoreError':text('handler-restore.err'),'workerFinal':load('worker-final.json'),'workerFinalError':text('worker-final.err'),'mappingFinal':load('map-final.json'),'mappingFinalError':text('map-final.err')}
          r=report.get('recovery') or {}
          report['dlqClear']=bool(r.get('ok')) and int(r.get('remaining_visible') or 0)==0 and int(r.get('remaining_inflight') or 0)==0
          report['workerRestored']=bool(report.get('workerFinal')) and report['workerFinal'].get('Handler')=='soccer_auto.collector.worker_handler' and report['workerFinal'].get('LastUpdateStatus')=='Successful'
          report['mappingRestored']=bool(report.get('mappingFinal')) and report['mappingFinal'].get('State')=='Enabled' and int((report['mappingFinal'].get('ScalingConfig') or {}).get('MaximumConcurrency') or 0)==3
          pathlib.Path('runtime_reports/soccer_dlq_drain_proof_latest.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
          print(json.dumps(report,indent=2,default=str))
          PY
      - name: Publish drain proof
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add runtime_reports/soccer_dlq_drain_proof_latest.json
          git commit -m 'runtime: publish Soccer DLQ drain proof [skip ci]' || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*2))
          done
          exit 1
