name: KS1 seven-day model validation
on:
  push:
    branches: [main]
    paths: ['ks1/**', 'tests/ks1/**', 'tests/ks1_phase2/**', 'tests/ks1_recent/**', '.github/workflows/ks1-retrain-recent.yml']
  pull_request:
    paths: ['ks1/**', 'tests/ks1/**', 'tests/ks1_phase2/**', 'tests/ks1_recent/**', '.github/workflows/ks1-retrain-recent.yml']
  workflow_dispatch:
  schedule:
    - cron: '35 7 * * 1'
permissions:
  contents: read
concurrency:
  group: ks1-retrain-recent-${{ github.ref }}
  # Superseded PR checks may stop, but main backfills must finish so concurrent
  # KS1 repairs cannot repeatedly discard the historical comparison.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ks1/training-requirements.txt 'pytest>=8,<9'
      - run: python -m pytest -q tests/ks1 tests/ks1_phase2 tests/ks1_recent
  evaluate:
    needs: verify-training
    # This job executes checked-out code after receiving long-lived AWS
    # credentials. PR access stays restricted; reviewed main repairs also
    # rebuild isolated candidate artifacts without changing serving references.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/ks1-historical-starter-bridge-20260913') ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      # One clock for all expensive commands; reserve cleanup inside 150 minutes.
      - name: Start bounded KS1 evaluation clock
        run: echo "KS1_EVALUATE_STARTED_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ks1/training-requirements.txt 'pytest>=8,<9'
      - run: python -m pytest -q tests/ks1 tests/ks1_phase2 tests/ks1_recent
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Backfill timestamped pregame starters and compare on rolling holdout
        run: |
          remaining=$(python -m ks1.forensic_runtime --remaining-budget)
          timeout --signal=TERM --kill-after=30s "${remaining}s" python -m ks1.retrain_recent --output /tmp/ks1-recent
      - name: Train forensic signals and existing KS1 features as one challenger
        run: |
          remaining=$(python -m ks1.forensic_runtime --remaining-budget)
          timeout --signal=TERM --kill-after=30s "${remaining}s" python -m ks1.forensic_unified \
            --input /tmp/ks1-recent/input_table.parquet \
            --proof /tmp/ks1-recent/input_proof.json \
            --output /tmp/ks1-unified
      - name: Develop explicit forensic derived features without consuming final holdout
        run: |
          remaining=$(python -m ks1.forensic_runtime --remaining-budget)
          timeout --signal=TERM --kill-after=30s "${remaining}s" python -m ks1.forensic_derived_development \
            --input /tmp/ks1-recent/input_table.parquet \
            --proof /tmp/ks1-recent/input_proof.json \
            --output /tmp/ks1-forensic-derived
      - name: Prove retained pre-T10 lineup season-batting coverage on development fit only
        run: |
          remaining=$(python -m ks1.forensic_runtime --remaining-budget)
          timeout --signal=TERM --kill-after=30s "${remaining}s" python -m ks1.historical_lineup_season_probe \
            --input /tmp/ks1-recent/input_table.parquet \
            --proof /tmp/ks1-recent/input_proof.json \
            --output /tmp/ks1-historical-lineup-season
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ks1-recent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/ks1-recent/
            /tmp/ks1-unified/
            /tmp/ks1-forensic-derived/
            /tmp/ks1-historical-lineup-season/
          if-no-files-found: error
          retention-days: 90
