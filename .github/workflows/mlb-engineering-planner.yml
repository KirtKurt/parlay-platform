name: MLB Engineering Planner

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engineering_agent/**'
      - '.github/workflows/mlb-engineering-planner.yml'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  MLB_PLANNER_STACK: parlay-platform-mlb-auto-llm
  MLB_PLANNER_LOGICAL_FUNCTION: MLBAutoLLMBedrockSmokeFunction

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 30

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install planner validation runtime
        run: python -m pip install 'boto3>=1.34,<2'

      - name: Build current-system MLB evidence packet
        shell: bash
        run: |
          mkdir -p runtime_reports/engineering_planner
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import subprocess

          root = Path('runtime_reports')
          patterns = (
              'mlb_research_*.json',
              'mlb_trainer_*.json',
              'mlb_successor_*.json',
              'mlb_ml_*latest*.json',
              'ks1_*latest*.json',
              'mlb_bedrock_*latest*.json',
          )
          retired_tokens = ('mlb_v7_', 'mlb_v8_', 'mlb_v9_', 'mlb_v10_', 'mlb_v15_')
          timestamp_keys = (
              'updatedAtUtc', 'createdAtUtc', 'observedAtUtc', 'generatedAtUtc',
              'capturedAtUtc', 'asOfUtc', 'runAtUtc', 'timestamp', 'as_of', 'updated_at',
          )

          def parse_time(value):
              if not isinstance(value, str):
                  return None
              text = value.strip().replace('Z', '+00:00')
              try:
                  dt = datetime.fromisoformat(text)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.timestamp()

          def evidence_time(value):
              if isinstance(value, dict):
                  direct = [parse_time(value.get(k)) for k in timestamp_keys]
                  direct = [x for x in direct if x is not None]
                  if direct:
                      return max(direct)
                  nested = [evidence_time(v) for v in value.values()]
                  nested = [x for x in nested if x is not None]
                  return max(nested) if nested else None
              if isinstance(value, list):
                  nested = [evidence_time(v) for v in value]
                  nested = [x for x in nested if x is not None]
                  return max(nested) if nested else None
              return None

          candidates = {}
          for pattern in patterns:
              for path in root.glob(pattern):
                  name = path.name.lower()
                  if not path.is_file() or path.stat().st_size > 2_000_000:
                      continue
                  if any(token in name for token in retired_tokens):
                      continue
                  try:
                      text = path.read_text(encoding='utf-8', errors='replace')
                      parsed = json.loads(text)
                  except Exception:
                      continue
                  candidates[path] = (evidence_time(parsed) or 0.0, text)

          selected = sorted(candidates, key=lambda p: (candidates[p][0], str(p)))[-20:]
          chunks = []
          try:
              git_log = subprocess.check_output(
                  ['git', 'log', '--date=iso-strict', '--pretty=format:%H %ad %s', '-20'],
                  text=True,
              )
          except Exception:
              git_log = ''
          chunks.append(json.dumps({
              'kind': 'recent_main_history',
              'currentCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'content': git_log,
          }, ensure_ascii=False))
          for path in selected:
              observed, text = candidates[path]
              chunks.append(json.dumps({
                  'kind': 'current_runtime_report',
                  'path': str(path),
                  'observedEpoch': observed,
                  'content': text[-12000:],
              }, ensure_ascii=False))
          Path('runtime_reports/engineering_planner/evidence.jsonl').write_text(
              '\n'.join(chunks) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'selectedFiles': [str(p) for p in selected],
              'count': len(selected),
              'excludedRetiredGenerations': list(retired_tokens),
          }))
          PY

      - name: Build bounded planner request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('engineering_agent/policy.json').read_text())
          evidence = Path('runtime_reports/engineering_planner/evidence.jsonl').read_text(encoding='utf-8', errors='replace')[-32000:]
          prompt = json.dumps({
              'mission': (
                  'Continuously improve the MLB research and successor-learning platform. '
                  'Prioritize source-honest point-in-time data capture, autonomous research, diagnostics, '
                  'feature/model evaluation, calibration, and reliability. Preserve immutable evidence, '
                  'chronological validation, fail-closed production authority, and sport isolation.'
              ),
              'latestOperationalEvidence': evidence,
              'policy': policy,
              'instruction': (
                  'Choose exactly one highest-value unresolved engineering task actionable from current evidence '
                  'and suitable for a small reviewed PR. Recent main-history evidence is authoritative for whether '
                  'a repair has already been merged; do not re-propose a task already represented by a newer main '
                  'commit merely because an older runtime report still contains its pre-repair symptom. Do not '
                  'weaken thresholds merely to pass. Return strict JSON only with: title (string), objective '
                  '(string), implementation (array of concrete steps), likelyFiles (array), acceptanceTests '
                  '(array), safetyReceipts (array), evidenceBasis (array).'
              ),
          }, separators=(',', ':'))
          size = len(prompt.encode('utf-8'))
          if size > 50000:
              raise SystemExit(f'planner request exceeded 50KB contract: {size}')
          Path('/tmp/mlb-planner-event.json').write_text(
              json.dumps({'mode': 'engineering_plan', 'prompt': prompt}), encoding='utf-8'
          )
          print(json.dumps({'promptBytes': size, 'evidenceChars': len(evidence)}))
          PY

      - name: Invoke planner through Bedrock-capable AWS runtime role
        shell: bash
        run: |
          set -euo pipefail
          function_name="$(aws cloudformation describe-stack-resource \
            --stack-name "$MLB_PLANNER_STACK" \
            --logical-resource-id "$MLB_PLANNER_LOGICAL_FUNCTION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          test -n "$function_name"
          test "$function_name" != "None"
          aws lambda invoke \
            --function-name "$function_name" \
            --cli-binary-format raw-in-base64-out \
            --payload fileb:///tmp/mlb-planner-event.json \
            runtime_reports/engineering_planner/lambda-response.json \
            > runtime_reports/engineering_planner/invoke-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('runtime_reports/engineering_planner/invoke-metadata.json').read_text())
          if metadata.get('FunctionError'):
              raise SystemExit('planner Lambda FunctionError: ' + str(metadata.get('FunctionError')))
          PY

      - name: Validate planner response and safety policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from engineering_agent.planner import parse_json, validate

          response = json.loads(Path('runtime_reports/engineering_planner/lambda-response.json').read_text())
          if response.get('ok') is not True or response.get('mode') != 'engineering_plan':
              raise SystemExit('planner Lambda failed: ' + json.dumps(response, default=str))
          text = str(response.get('text') or '').strip()
          if not text:
              raise SystemExit('planner Lambda returned empty task text')
          task = validate(parse_json(text))
          task['plannerRoute'] = {
              key: response.get(key)
              for key in ('routeId', 'region', 'modelId', 'endpointFamily')
          }
          task['runtimeDecisionAuthority'] = response.get('decisionAuthority')
          task['bedrockAvailable'] = response.get('bedrockAvailable')
          Path('runtime_reports/engineering_planner/next-task.json').write_text(
              json.dumps(task, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({'ok': True, 'title': task['title'], 'plannerRoute': task['plannerRoute']}))
          PY

      - name: Verify negative authority receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('runtime_reports/engineering_planner/next-task.json').read_text())
          required = [
              'noDirectProductionDeploy',
              'noMainBranchWrite',
              'noModelPromotion',
              'noSecretMutation',
              'noOtherSportChange',
          ]
          bad = [k for k in required if value.get(k) is not True]
          if bad:
              raise SystemExit('planner authority receipt failure: ' + ','.join(bad))
          print(json.dumps({'ok': True, 'title': value.get('title'), 'receipts': required}))
          PY

      - name: Upload planner evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-engineering-planner-${{ github.run_id }}
          path: |
            runtime_reports/engineering_planner/evidence.jsonl
            runtime_reports/engineering_planner/invoke-metadata.json
            runtime_reports/engineering_planner/lambda-response.json
            runtime_reports/engineering_planner/next-task.json
          if-no-files-found: warn
          retention-days: 30
