name: MLB Engineering Planner

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engineering_agent/**'
      - '.github/workflows/mlb-engineering-planner.yml'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  MLB_PLANNER_STACK: parlay-platform-mlb-auto-llm
  MLB_PLANNER_LOGICAL_FUNCTION: MLBAutoLLMBedrockSmokeFunction

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install planner validation runtime
        run: python -m pip install 'boto3>=1.34,<2'

      - name: Build bounded MLB evidence packet
        shell: bash
        run: |
          mkdir -p runtime_reports/engineering_planner
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('runtime_reports')
          candidates = []
          for path in root.glob('*mlb*latest*.json'):
              if path.is_file() and path.stat().st_size <= 2_000_000:
                  candidates.append(path)
          for path in root.glob('mlb_*.json'):
              if path.is_file() and path.stat().st_size <= 2_000_000 and path not in candidates:
                  candidates.append(path)
          selected = sorted(candidates, key=lambda p: (p.stat().st_mtime_ns, str(p)))[-20:]
          chunks = []
          for path in selected:
              try:
                  text = path.read_text(encoding='utf-8', errors='replace')
              except Exception:
                  continue
              chunks.append(json.dumps({'path': str(path), 'content': text[-12000:]}, ensure_ascii=False))
          Path('runtime_reports/engineering_planner/evidence.jsonl').write_text('\n'.join(chunks) + ('\n' if chunks else ''), encoding='utf-8')
          print(json.dumps({'selectedFiles': [str(p) for p in selected], 'count': len(selected)}))
          PY

      - name: Build bounded planner request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('engineering_agent/policy.json').read_text())
          # Reserve ample headroom for JSON escaping, mission text, policy and instruction.
          evidence = Path('runtime_reports/engineering_planner/evidence.jsonl').read_text(encoding='utf-8', errors='replace')[-32000:]
          prompt = json.dumps({
              'mission': (
                  'Continuously improve the MLB research and successor-learning platform. '
                  'Prioritize source-honest point-in-time data capture, autonomous research, diagnostics, '
                  'feature/model evaluation, calibration, and reliability. Preserve immutable evidence, '
                  'chronological validation, fail-closed production authority, and sport isolation.'
              ),
              'latestOperationalEvidence': evidence,
              'policy': policy,
              'instruction': (
                  'Choose exactly one highest-value engineering task that is actionable from current evidence '
                  'and can be implemented in a small reviewed PR. Do not repeat a task already shown as fixed. '
                  'Do not propose weakening thresholds merely to pass. Return strict JSON only with: '
                  'title (string), objective (string), implementation (array of concrete steps), '
                  'likelyFiles (array), acceptanceTests (array), safetyReceipts (array), evidenceBasis (array).'
              ),
          }, separators=(',', ':'))
          size = len(prompt.encode('utf-8'))
          if size > 50000:
              raise SystemExit(f'planner request exceeded 50KB contract: {size}')
          Path('/tmp/mlb-planner-event.json').write_text(
              json.dumps({'mode': 'engineering_plan', 'prompt': prompt}), encoding='utf-8'
          )
          print(json.dumps({'promptBytes': size, 'evidenceChars': len(evidence)}))
          PY

      - name: Invoke planner through Bedrock-capable AWS runtime role
        shell: bash
        run: |
          set -euo pipefail
          function_name="$(aws cloudformation describe-stack-resource \
            --stack-name "$MLB_PLANNER_STACK" \
            --logical-resource-id "$MLB_PLANNER_LOGICAL_FUNCTION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          test -n "$function_name"
          test "$function_name" != "None"
          aws lambda invoke \
            --function-name "$function_name" \
            --cli-binary-format raw-in-base64-out \
            --payload fileb:///tmp/mlb-planner-event.json \
            runtime_reports/engineering_planner/lambda-response.json \
            > runtime_reports/engineering_planner/invoke-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('runtime_reports/engineering_planner/invoke-metadata.json').read_text())
          if metadata.get('FunctionError'):
              raise SystemExit('planner Lambda FunctionError: ' + str(metadata.get('FunctionError')))
          PY

      - name: Validate planner response and safety policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from engineering_agent.planner import parse_json, validate

          response = json.loads(Path('runtime_reports/engineering_planner/lambda-response.json').read_text())
          if response.get('ok') is not True or response.get('mode') != 'engineering_plan':
              raise SystemExit('planner Lambda failed: ' + json.dumps(response, default=str))
          text = str(response.get('text') or '').strip()
          if not text:
              raise SystemExit('planner Lambda returned empty task text')
          task = validate(parse_json(text))
          task['plannerRoute'] = {
              key: response.get(key)
              for key in ('routeId', 'region', 'modelId', 'endpointFamily')
          }
          task['runtimeDecisionAuthority'] = response.get('decisionAuthority')
          task['bedrockAvailable'] = response.get('bedrockAvailable')
          Path('runtime_reports/engineering_planner/next-task.json').write_text(
              json.dumps(task, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({'ok': True, 'title': task['title'], 'plannerRoute': task['plannerRoute']}))
          PY

      - name: Verify negative authority receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('runtime_reports/engineering_planner/next-task.json').read_text())
          required = [
              'noDirectProductionDeploy',
              'noMainBranchWrite',
              'noModelPromotion',
              'noSecretMutation',
              'noOtherSportChange',
          ]
          bad = [k for k in required if value.get(k) is not True]
          if bad:
              raise SystemExit('planner authority receipt failure: ' + ','.join(bad))
          print(json.dumps({'ok': True, 'title': value.get('title'), 'receipts': required}))
          PY

      - name: Upload planner evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-engineering-planner-${{ github.run_id }}
          path: |
            runtime_reports/engineering_planner/evidence.jsonl
            runtime_reports/engineering_planner/invoke-metadata.json
            runtime_reports/engineering_planner/lambda-response.json
            runtime_reports/engineering_planner/next-task.json
          if-no-files-found: warn
          retention-days: 30
