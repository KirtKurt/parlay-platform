name: MLB Engineering Planner

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engineering_agent/**'
      - '.github/workflows/mlb-engineering-planner.yml'

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  INQSI_ENGINEERING_REGIONS: us-east-1,us-east-2,us-west-2
  INQSI_ENGINEERING_MODEL_IDS: us.amazon.nova-2-lite-v1:0,global.amazon.nova-2-lite-v1:0,amazon.nova-pro-v1:0

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install planner runtime
        run: python -m pip install 'boto3>=1.34,<2'

      - name: Build bounded MLB evidence packet
        shell: bash
        run: |
          mkdir -p runtime_reports/engineering_planner
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('runtime_reports')
          candidates = []
          for path in sorted(root.glob('*mlb*latest*.json')):
              if path.is_file() and path.stat().st_size <= 2_000_000:
                  candidates.append(path)
          for path in sorted(root.glob('mlb_*.json')):
              if path.is_file() and path.stat().st_size <= 2_000_000 and path not in candidates:
                  candidates.append(path)
          selected = candidates[-20:]
          chunks = []
          for path in selected:
              try:
                  text = path.read_text(encoding='utf-8', errors='replace')
              except Exception:
                  continue
              chunks.append(json.dumps({'path': str(path), 'content': text[-12000:]}, ensure_ascii=False))
          Path('runtime_reports/engineering_planner/evidence.jsonl').write_text('\n'.join(chunks) + ('\n' if chunks else ''), encoding='utf-8')
          print(json.dumps({'selectedFiles': [str(p) for p in selected], 'count': len(selected)}))
          PY

      - name: Run bounded Bedrock planner
        run: |
          python engineering_agent/planner.py \
            --evidence runtime_reports/engineering_planner/evidence.jsonl \
            --output runtime_reports/engineering_planner/next-task.json

      - name: Verify negative authority receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('runtime_reports/engineering_planner/next-task.json')
          value = json.loads(p.read_text())
          required = [
              'noDirectProductionDeploy',
              'noMainBranchWrite',
              'noModelPromotion',
              'noSecretMutation',
              'noOtherSportChange',
          ]
          bad = [k for k in required if value.get(k) is not True]
          if bad:
              raise SystemExit('planner authority receipt failure: ' + ','.join(bad))
          print(json.dumps({'ok': True, 'title': value.get('title'), 'receipts': required}))
          PY

      - name: Upload planner evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-engineering-planner-${{ github.run_id }}
          path: |
            runtime_reports/engineering_planner/evidence.jsonl
            runtime_reports/engineering_planner/next-task.json
          retention-days: 30
