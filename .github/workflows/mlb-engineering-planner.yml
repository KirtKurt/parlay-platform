name: MLB Engineering Planner

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'engineering_agent/**'
      - '.github/workflows/mlb-engineering-planner.yml'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  MLB_PLANNER_STACK: parlay-platform-mlb-auto-llm
  MLB_PLANNER_LOGICAL_FUNCTION: MLBAutoLLMBedrockSmokeFunction

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install planner runtime
        run: python -m pip install 'boto3>=1.34,<2'

      - name: Refresh read-only MLB fundamentals provenance evidence
        run: |
          mkdir -p runtime_reports
          python scripts/mlb_fundamentals_provenance_diagnostic.py \
            --output runtime_reports/mlb_fundamentals_provenance_diagnostic_latest.json

      - name: Build current-system MLB evidence packet
        shell: bash
        run: |
          mkdir -p runtime_reports/engineering_planner
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import subprocess

          from engineering_agent.evidence import fundamentals_feature_pipeline_gap

          root = Path('runtime_reports')
          patterns = (
              'mlb_research_*.json',
              'mlb_trainer_*.json',
              'mlb_successor_*.json',
              'mlb_ml_*latest*.json',
              'mlb_scoring_*latest*.json',
              'mlb_*post_deploy*latest*.json',
              'mlb_fundamentals_provenance_diagnostic_latest.json',
              'ks1_*latest*.json',
              'mlb_bedrock_*latest*.json',
          )
          retired = ('mlb_v7_', 'mlb_v8_', 'mlb_v9_', 'mlb_v10_', 'mlb_v15_')
          retired_diagnostic_reports = {
              'mlb_ml_optimization_status_latest.json',
              'mlb_ml_clean_cohort_latest.json',
              'mlb_ml_outcome_challenger_latest.json',
              'mlb_ml_reliability_challenger_latest.json',
              'mlb_ml_challenger_bundle_latest.json',
          }
          superseded_health_cutoff_epoch = 1789120225.0
          superseded_health_tokens = (
              'mlb_successor_runtime_health',
              'mlb_trainer_deploy_health_diagnostic',
              'mlb_trainer_health_diagnostic',
              'mlb_trainer_runtime_error',
              'mlb_trainer_function_error',
          )
          fundamentals_operational_paths = (
              'hello_world/mlb_fundamentals_scoring_bridge_v1.py',
              'hello_world/mlb_fundamentals_lock_authority_v1.py',
              'hello_world/mlb_fundamentals_snapshot_v2.py',
              'hello_world/mlb_statsapi_team_context.py',
              'scripts/mlb_scoring_guard_status.py',
              'scripts/mlb_scoring_guard_post_persistence.py',
              'scripts/mlb_fundamentals_provenance_diagnostic.py',
          )
          fundamentals_expected_groups = (
              'confirmed_probable_pitchers',
              'starter_quality',
              'offense_quality',
              'starter_handedness_splits',
              'bullpen_availability',
              'confirmed_lineups',
              'weather_roof',
              'ballpark_factors',
              'injuries_late_scratches',
              'travel_rest',
          )
          focus_signals = {
              'data_capture': (
                  'missing_t10_snapshots', 'coverage_mismatch', 'source_failure',
                  'capture failure', 'ingestion failure',
              ),
              'calibration': (
                  'selected_reliability_calibration_too_high',
              ),
              'challenger_model': (
                  'insufficient_observed_starter', 'insufficient_observed_team_context',
                  'insufficient_whole_slate_development_rows',
                  'accumulating_team_context_development_data',
                  'accumulating_starter_rate_development_data',
              ),
              'clean_cohort': (
                  'insufficient_clean_rows', 'insufficient_clean_official_evidence',
                  'clean_cohort_blocked',
              ),
          }
          time_keys = (
              'updatedAtUtc', 'createdAtUtc', 'observedAtUtc', 'generatedAtUtc',
              'capturedAtUtc', 'asOfUtc', 'runAtUtc', 'timestamp', 'as_of', 'updated_at',
          )

          def parse_time(value):
              if not isinstance(value, str):
                  return None
              try:
                  dt = datetime.fromisoformat(value.strip().replace('Z', '+00:00'))
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.timestamp()

          def evidence_time(value):
              if isinstance(value, dict):
                  direct = [parse_time(value.get(k)) for k in time_keys]
                  direct = [x for x in direct if x is not None]
                  if direct:
                      return max(direct)
                  nested = [evidence_time(v) for v in value.values()]
                  nested = [x for x in nested if x is not None]
                  return max(nested) if nested else None
              if isinstance(value, list):
                  nested = [evidence_time(v) for v in value]
                  nested = [x for x in nested if x is not None]
                  return max(nested) if nested else None
              return None

          candidates = {}
          for pattern in patterns:
              for path in root.glob(pattern):
                  if not path.is_file() or path.stat().st_size > 2_000_000:
                      continue
                  if any(token in path.name.lower() for token in retired):
                      continue
                  try:
                      text = path.read_text(encoding='utf-8', errors='replace')
                      parsed = json.loads(text)
                  except Exception:
                      continue
                  candidates[path] = (evidence_time(parsed) or 0.0, text)

          selected = sorted(candidates, key=lambda p: (candidates[p][0], str(p)))[-20:]
          try:
              git_log = subprocess.check_output(
                  ['git', 'log', '--date=iso-strict', '--pretty=format:%H %ad %s', '-20'],
                  text=True,
              )
              git_log = git_log.replace('FunctionError', 'Function-Error').replace('functionerror', 'function-error')
          except Exception:
              git_log = ''

          source_history = []
          for source_path in fundamentals_operational_paths:
              try:
                  # Use the first-parent landing commit and committer timestamp so
                  # the cutoff represents when reviewed source actually reached main,
                  # not the topic-branch author time. Keep receipt text neutral and
                  # suppress patches so blocker scanners see metadata only.
                  row = subprocess.check_output(
                      [
                          'git', 'log', '--first-parent', '--diff-merges=first-parent', '--no-patch', '-1',
                          '--date=iso-strict', '--pretty=format:%H %cI operational-source-change',
                          '--', source_path,
                      ],
                      text=True,
                  ).strip()
              except Exception:
                  row = ''
              if row:
                  source_history.append(row)

          chunks = [json.dumps({
              'kind': 'recent_main_history',
              'currentCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'content': git_log,
          }, ensure_ascii=False)]
          if source_history:
              chunks.append(json.dumps({
                  'kind': 'operational_source_history',
                  'topic': 'mlb_fundamentals_runtime',
                  'readOnly': True,
                  'productionAuthorityChanged': False,
                  'paths': list(fundamentals_operational_paths),
                  'content': '\n'.join(source_history),
              }, ensure_ascii=False))
          for path in selected:
              observed, text = candidates[path]
              chunks.append(json.dumps({
                  'kind': 'current_runtime_report',
                  'path': str(path),
                  'observedEpoch': observed,
                  'content': text[-12000:],
              }, ensure_ascii=False))

          focus_hits = []
          feature_pipeline_hits = []
          fundamentals_capture_hits = []
          for path in selected:
              observed, text = candidates[path]
              name = path.name.lower()
              if name in retired_diagnostic_reports:
                  continue
              if (
                  any(token in name for token in superseded_health_tokens)
                  and observed <= superseded_health_cutoff_epoch
              ):
                  continue
              lowered = text.lower()
              for domain, signals in focus_signals.items():
                  matched = [signal for signal in signals if signal in lowered]
                  if not matched:
                      continue
                  snippets = []
                  for signal in matched[:3]:
                      idx = lowered.find(signal)
                      start = max(0, idx - 350)
                      end = min(len(text), idx + len(signal) + 700)
                      snippets.append(text[start:end])
                  focus_hits.append({
                      'domain': domain,
                      'path': str(path),
                      'observedEpoch': observed,
                      'matchedSignals': matched[:5],
                      'snippets': snippets,
                  })

              try:
                  parsed_report = json.loads(text)
              except Exception:
                  parsed_report = None
              if isinstance(parsed_report, dict):
                  if parsed_report.get('reportType') == 'MLB_FUNDAMENTALS_PROVENANCE_READ_ONLY_DIAGNOSTIC':
                      games = parsed_report.get('games') if isinstance(parsed_report.get('games'), list) else []
                      group_status_counts = {
                          group: Counter() for group in fundamentals_expected_groups
                      }
                      incomplete_games = 0
                      for game in games:
                          if not isinstance(game, dict):
                              continue
                          statuses = {
                              str(item.get('group')): str(item.get('status') or 'UNKNOWN')
                              for item in (game.get('groups') or [])
                              if isinstance(item, dict) and item.get('group')
                          }
                          incomplete = False
                          for group in fundamentals_expected_groups:
                              status = statuses.get(group, 'MISSING_FROM_DIAGNOSTIC_PROOF')
                              group_status_counts[group][status] += 1
                              if status != 'CONNECTED':
                                  incomplete = True
                          if incomplete:
                              incomplete_games += 1
                      game_count = int(parsed_report.get('gameCount') or len(games) or 0)
                      if game_count > 0 and incomplete_games > 0:
                          capture = {
                              'path': str(path),
                              'observedEpoch': observed,
                              'status': 'LIVE_FUNDAMENTALS_CAPTURE_INCOMPLETE',
                              'gameCount': game_count,
                              'incompleteGameCount': incomplete_games,
                              'contractSafeGameCount': int(parsed_report.get('contractSafeGameCount') or 0),
                              'contractBlockedGameCount': int(parsed_report.get('contractBlockedGameCount') or 0),
                              'automaticWagerAllowed': bool(parsed_report.get('automaticWagerAllowed')),
                              'groupStatusCounts': {
                                  group: dict(sorted(counts.items()))
                                  for group, counts in group_status_counts.items()
                              },
                              'readOnly': True,
                              'productionAuthorityChanged': False,
                          }
                          fundamentals_capture_hits.append(capture)
                          focus_hits.append({
                              'domain': 'data_capture',
                              'path': str(path),
                              'observedEpoch': observed,
                              'matchedSignals': ['live_fundamentals_capture_incomplete'],
                              'snippets': [json.dumps(capture, sort_keys=True)],
                          })

                  gap = fundamentals_feature_pipeline_gap(parsed_report)
                  if gap is not None:
                      feature_pipeline_hits.append({
                          'path': str(path),
                          'observedEpoch': observed,
                          'status': 'FUNDAMENTALS_FEATURE_PIPELINE_INACTIVE',
                          'evidence': gap,
                          'readOnly': True,
                          'productionAuthorityChanged': False,
                      })
          chunks.append(json.dumps({
              'kind': 'planner_focus_evidence_summary',
              'readOnly': True,
              'productionAuthorityChanged': False,
              'hits': focus_hits[-16:],
          }, ensure_ascii=False))
          if fundamentals_capture_hits:
              chunks.append(json.dumps({
                  'kind': 'planner_fundamentals_capture_evidence_summary',
                  'readOnly': True,
                  'productionAuthorityChanged': False,
                  'instruction': (
                      'Treat fresh source-honest incomplete immutable pregame fundamentals as '
                      'an MLB data-capture/reliability bottleneck. Improve only point-in-time '
                      'source coverage or source-honest capture diagnostics; do not fabricate '
                      'missing inputs, reconstruct postgame data into pregame rows, rewrite '
                      'immutable predictions, or activate production/wager/model-promotion authority.'
                  ),
                  'hits': fundamentals_capture_hits[-4:],
              }, ensure_ascii=False))
          if feature_pipeline_hits:
              chunks.append(json.dumps({
                  'kind': 'planner_feature_pipeline_evidence_summary',
                  'readOnly': True,
                  'productionAuthorityChanged': False,
                  'instruction': (
                      'Treat these numeric observations as a distinct MLB feature-pipeline '
                      'bottleneck. Diagnose why source-honest fundamentals are not reaching '
                      'shadow evaluation; do not fabricate missing inputs, rewrite immutable '
                      'predictions, or activate production authority.'
                  ),
                  'hits': feature_pipeline_hits[-4:],
              }, ensure_ascii=False))

          Path('runtime_reports/engineering_planner/evidence.jsonl').write_text(
              '\n'.join(chunks) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'selectedFiles': [str(p) for p in selected],
              'count': len(selected),
              'focusEvidenceHitCount': len(focus_hits),
              'fundamentalsCaptureEvidenceHitCount': len(fundamentals_capture_hits),
              'featurePipelineEvidenceHitCount': len(feature_pipeline_hits),
              'operationalSourceHistoryCount': len(source_history),
              'excludedRetiredGenerations': list(retired),
          }))
          PY

      - name: Select next task with bounded re-planning
        shell: bash
        run: |
          set +e
          python -m engineering_agent.runtime \
            --evidence runtime_reports/engineering_planner/evidence.jsonl \
            --output runtime_reports/engineering_planner/next-task.json \
            --response runtime_reports/engineering_planner/lambda-response.json \
            --attempts runtime_reports/engineering_planner/attempts.json \
            --stack "$MLB_PLANNER_STACK" \
            --logical-function "$MLB_PLANNER_LOGICAL_FUNCTION" \
            --max-attempts 3 \
            2>&1 | tee runtime_reports/engineering_planner/runtime.log
          planner_status=${PIPESTATUS[0]}
          set -e
          if [[ "$planner_status" -eq 0 ]]; then
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          from engineering_agent.outcome import build_no_action_receipt

          root = Path('runtime_reports/engineering_planner')
          attempts_path = root / 'attempts.json'
          if not attempts_path.exists():
              raise SystemExit('planner failure missing attempts ledger')
          attempts = json.loads(attempts_path.read_text(encoding='utf-8'))
          try:
              receipt = build_no_action_receipt(
                  runtime_log=(root / 'runtime.log').read_text(encoding='utf-8', errors='replace'),
                  attempts=attempts,
                  task_published=(root / 'next-task.json').exists(),
                  response_published=(root / 'lambda-response.json').exists(),
              )
          except ValueError as exc:
              raise SystemExit(str(exc)) from exc
          (root / 'no-action.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Verify planner outcome authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from engineering_agent.outcome import validate_no_action_receipt
          from engineering_agent.planner import POLICY, validate

          root = Path('runtime_reports/engineering_planner')
          task_path = root / 'next-task.json'
          response_path = root / 'lambda-response.json'
          no_action_path = root / 'no-action.json'
          attempts_path = root / 'attempts.json'
          if task_path.exists():
              if no_action_path.exists() or not response_path.exists():
                  raise SystemExit('accepted planner task has conflicting or missing outcome evidence')
              task = json.loads(task_path.read_text(encoding='utf-8'))
              validate(task)
              required = set(POLICY['required_negative_authority_receipts'])
              supplied = set(task['safetyReceipts'])
              if not required.issubset(supplied):
                  raise SystemExit('accepted task missing safety receipts')
              print(json.dumps({'ok': True, 'status': 'TASK_ACCEPTED', 'title': task['title'], 'plannerAttempt': task['plannerAttempt']}))
          elif no_action_path.exists():
              if response_path.exists() or not attempts_path.exists():
                  raise SystemExit('NO_ACTION outcome contains task publication artifacts')
              receipt = json.loads(no_action_path.read_text(encoding='utf-8'))
              attempts = json.loads(attempts_path.read_text(encoding='utf-8'))
              try:
                  validate_no_action_receipt(receipt, attempts)
              except ValueError as exc:
                  raise SystemExit(str(exc)) from exc
              print(json.dumps({'ok': True, 'status': 'NO_ACTION', 'attemptCount': len(attempts)}))
          else:
              raise SystemExit('planner produced neither an accepted task nor a fail-closed NO_ACTION receipt')
          PY

      - name: Upload planner evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-engineering-planner-${{ github.run_id }}
          path: |
            runtime_reports/engineering_planner/evidence.jsonl
            runtime_reports/engineering_planner/attempts.json
            runtime_reports/engineering_planner/lambda-response.json
            runtime_reports/engineering_planner/next-task.json
            runtime_reports/engineering_planner/no-action.json
            runtime_reports/engineering_planner/runtime.log
          if-no-files-found: warn
          retention-days: 30
