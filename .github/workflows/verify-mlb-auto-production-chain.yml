name: Verify MLB AUTO production chain

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify_mlb_no_bbd_runtime.py'
      - 'tests/unit/test_verify_mlb_no_bbd_runtime.py'
      - 'tests/unit/test_mlb_auto_model_gateway.py'
      - 'mlb_auto_llm/**'
      - 'mlb-auto-llm-template.yaml'
      - '.github/workflows/deploy-mlb-auto-llm.yml'
      - '.github/workflows/verify-mlb-auto-production-chain.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - name: Install verification runtime
        run: python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
      - name: Compile complete MLB AUTO runtime and provider verifier
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/verify_mlb_no_bbd_runtime.py \
            mlb_auto_llm/handler.py \
            mlb_auto_llm/model_gateway.py \
            mlb_auto_llm/orchestrator.py \
            mlb_auto_llm/orchestrator_v2.py \
            mlb_auto_llm/bedrock_smoke.py
      - name: Verify provider boundary, quota recovery, and immutable authority
        run: |
          set -euo pipefail
          python scripts/verify_mlb_no_bbd_runtime.py
          python -m pytest -q \
            tests/unit/test_verify_mlb_no_bbd_runtime.py \
            tests/unit/test_mlb_auto_model_gateway.py
          sam validate --template-file mlb-auto-llm-template.yaml --lint
          grep -q 'list_inference_profiles' mlb_auto_llm/model_gateway.py
          grep -q 'list_foundation_models' mlb_auto_llm/model_gateway.py
          grep -q 'BEDROCK_BATCH_CARD_AUTHORITY_REQUIRED' mlb_auto_llm/orchestrator_v2.py
          grep -q 'AUTHORITATIVE_CARD_DEADLINE_MISSED' mlb_auto_llm/orchestrator_v2.py
          grep -q 'bedrock:ListInferenceProfiles' mlb-auto-llm-template.yaml
          grep -q 'bedrock:ListFoundationModels' mlb-auto-llm-template.yaml
          if grep -q 'FALLBACK_MARKET_CONSENSUS' mlb_auto_llm/orchestrator_v2.py; then
            echo '::error::Strict MLB AUTO V2 authority retains a market-only fallback'
            exit 1
          fi
