name: Verify MLB AUTO production chain

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify_mlb_no_bbd_runtime.py'
      - 'tests/unit/test_verify_mlb_no_bbd_runtime.py'
      - 'mlb_auto_llm/**'
      - 'mlb-auto-llm-template.yaml'
      - '.github/workflows/deploy-mlb-auto-llm.yml'
      - '.github/workflows/verify-mlb-auto-production-chain.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification runtime
        run: python -m pip install --quiet 'pytest>=8,<9' 'boto3>=1.34,<2' 'PyYAML>=6,<7'
      - name: Compile MLB AUTO runtime and provider verifier
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/verify_mlb_no_bbd_runtime.py \
            mlb_auto_llm/handler.py \
            mlb_auto_llm/orchestrator.py \
            mlb_auto_llm/bedrock_smoke.py
      - name: Verify provider boundary and isolated three-source authority
        run: |
          set -euo pipefail
          python scripts/verify_mlb_no_bbd_runtime.py
          python -m pytest -q tests/unit/test_verify_mlb_no_bbd_runtime.py
