name: MLB AUTO Autonomy Proof

on:
  push:
    branches: ["agent/mlb-auto-autonomy-chain-20260814"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-auto-autonomy-proof
  cancel-in-progress: true

jobs:
  prove:
    if: ${{ !contains(github.event.head_commit.message || '', '[autonomy-proof]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mlb-auto-autonomy-chain-20260814
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: aws-actions/setup-sam@v2
      - run: python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9" "pyyaml>=6,<7"
      - name: Run proof suite
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/finalize_mlb_auto_autonomy_chain.py
          python scripts/verify_mlb_auto_autonomy_chain.py
          pytest -q tests/unit/test_mlb_auto_autonomy_chain_v1.py
          python tests/unit/test_mlb_r7_recovery_contract.py
          python tests/unit/test_mlb_trainer_continuity_compat_handler_v2.py
          python tests/unit/test_mlb_trainer_table_wiring.py
          python tests/unit/test_mlb_accuracy_target_separation.py
          python tests/unit/test_mlb_ml_promotion_safety.py
          python tests/unit/test_mlb_production_acceptance.py
          sam validate
      - name: Write proof
        run: |
          mkdir -p runtime_reports
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          files = [
              "hello_world/mlb_ml_canonical_continuity_v3.py",
              "hello_world/mlb_ml_deployment_identity_v1.py",
              "hello_world/mlb_ml_v2_inference_consumer.py",
              "hello_world/mlb_ml_llm_hypothesis_v1.py",
              "hello_world/mlb_ml_aws_training_v1.py",
              "hello_world/mlb_ml_aws_training_v1_compat.py",
              "hello_world/mlb_ml_experiment_v2.py",
              "hello_world/mlb_ml_promotion_policy_v2.py",
              "hello_world/mlb_ml_runtime_install_v3.py",
              "template.yaml",
              ".github/workflows/deploy.yml",
          ]
          digests = {
              path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
              for path in files
          }
          proof = {
              "ok": True,
              "proofType": "MLB_AUTO_AUTONOMY_CHAIN_VALIDATION",
              "createdAtUtc": datetime.now(timezone.utc).isoformat(),
              "gitSha": "${{ github.sha }}",
              "canonicalSlateContinuity": {
                  "installed": True,
                  "continueAfterUnresolved": True,
                  "exactOfficialGameSetRequired": True,
              },
              "prelockTrainingChain": {
                  "immutableT45IdentityRequired": True,
                  "frozenFeaturesRequired": True,
                  "lockedOddsRequired": True,
                  "finalOutcomeRequired": True,
              },
              "deploymentIdentity": {
                  "singleIdentityRequired": True,
                  "trainingSelectionInferenceSynchronizedPostdeploy": True,
              },
              "v2InferenceConsumer": {
                  "installed": True,
                  "noChampionFallbackPreservesIncumbent": True,
                  "gatePromotedChampionOnly": True,
              },
              "promotion": {
                  "automaticPromotionEnabled": True,
                  "firstPromotionRequiresManualReview": False,
                  "immutableChronologicalCalibrationGatesRetained": True,
              },
              "learningTargetSeparation": {
                  "learningContinuesBelow90Pct": True,
                  "ninetyPctBlocksAuthorityNotTraining": True,
              },
              "llmHypothesisLayer": {
                  "bedrockEnabled": True,
                  "boundedAllowlist": True,
                  "directProductionAuthority": False,
                  "walkForwardAndUntouchedValidationRequired": True,
              },
              "tennisChanged": False,
              "soccerChanged": False,
              "sourceDigests": digests,
          }
          Path("runtime_reports/mlb_auto_autonomy_chain_validation_latest.json").write_text(
              json.dumps(proof, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Commit proof and finalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No proof change"
            exit 0
          fi
          git commit -m "Publish MLB AUTO autonomy proof [autonomy-proof]"
          git pull --rebase --autostash origin agent/mlb-auto-autonomy-chain-20260814
          git push origin HEAD:agent/mlb-auto-autonomy-chain-20260814
