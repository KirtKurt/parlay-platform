name: MLB V7 V8 Slate Analysis Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_mlb_v7_v8_today_test.py'
      - '.github/workflows/mlb-v7-v8-today-test-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v7-v8-slate-analysis-once-20260726
  cancel-in-progress: false

env:
  TEST_DATE_ET: '2026-07-26'
  REPORT_PATH: runtime_reports/mlb_v7_v8_today_test_20260726.json

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate identity and source
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/tmp/mlb-v7-v8-test-identity.json
          test -n "${ODDS_API_KEY_VALUE:-}"
          python -m pip install --quiet 'boto3>=1.34,<2' 'requests>=2.31,<3'
          PYTHONPATH=hello_world python -m py_compile scripts/run_mlb_v7_v8_today_test.py
          grep -Fq 'MAX_ONE_TIME_ESTIMATED_CREDITS = 150' scripts/run_mlb_v7_v8_today_test.py
          grep -Fq 'productionAuthorityChanged": False' scripts/run_mlb_v7_v8_today_test.py

      - name: Run one-time pre-lock slate analysis
        id: analysis
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          SNAPSHOTS_TABLE: parlay_platform_snapshots
          TARGET_SNAPSHOTS_TABLE: parlay_platform_snapshots
          PYTHONPATH: hello_world
        run: |
          set -uo pipefail
          mkdir -p runtime_reports
          # Never let an earlier failed report masquerade as evidence for this run.
          rm -f "$REPORT_PATH" /tmp/mlb-v7-v8-today-test.log
          python scripts/run_mlb_v7_v8_today_test.py \
            --date "$TEST_DATE_ET" \
            --region "$AWS_REGION_VALUE" \
            --output "$REPORT_PATH" \
            2>&1 | tee /tmp/mlb-v7-v8-today-test.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >>"$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure durable report exists
        if: always()
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          ANALYSIS_EXIT_CODE: ${{ steps.analysis.outputs.exit_code }}
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log_path=Path('/tmp/mlb-v7-v8-today-test.log')
          log=log_path.read_text(errors='replace')[-16000:] if log_path.exists() else ''
          secret=os.environ.get('ODDS_API_KEY_VALUE','')
          if secret:
              log=log.replace(secret,'[REDACTED]')
          value={
              'proofType':'MLB_V7_V8_ONE_TIME_TODAY_TEST',
              'version':'MLB-V7-V8-TODAY-TEST-v1-diagnostic',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'slateDateEt':os.environ['TEST_DATE_ET'],
              'runId':os.environ['GITHUB_RUN_ID'],
              'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'testOnly':True,
              'researchOnly':True,
              'productionAuthorityChanged':False,
              'games':[],
              'gameCount':0,
              'analysisOutcome':os.environ.get('ANALYSIS_OUTCOME'),
              'analysisExitCode':os.environ.get('ANALYSIS_EXIT_CODE'),
              'errorLogTail':log,
              'blockers':['analysis_process_failed_before_report_creation:'+str(os.environ.get('ANALYSIS_OUTCOME'))],
              'ok':False,
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-v7-v8-slate-analysis-${{ github.run_id }}
          path: |
            runtime_reports/mlb_v7_v8_today_test_20260726.json
            /tmp/mlb-v7-v8-today-test.log
            /tmp/mlb-v7-v8-test-identity.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable report
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$REPORT_PATH" /tmp/mlb-v7-v8-today-test-report.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v7-v8-one-time-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-v7-v8-today-test-report.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish one-time MLB V7 and V8 slate analysis'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          echo '::error::Unable to publish one-time MLB V7/V8 report'
          exit 1

      - name: Enforce complete pre-lock analysis
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_v7_v8_today_test_20260726.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('testOnly') is True, value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('allDataCapturedBeforeEarliestGameTMinus45') is True, value
          assert int(value.get('gameCount') or 0) == 15, value
          assert int(value.get('v7PredictionCount') or 0) == 15, value
          assert int(value.get('v8PredictionCount') or 0) == 15, value
          assert not value.get('blockers'), value
          PY
