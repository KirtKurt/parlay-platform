name: Fix MLB verifier historical authority

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-mlb-verifier-historical-authority.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch verifier and add regression
        run: |
          python - <<'PY'
          from pathlib import Path

          verifier = Path("scripts/verify_mlb_deploy_identity.py")
          text = verifier.read_text(encoding="utf-8")
          old = '''MLB_WRITER_TOKENS = (
              "PULL",
              "INGEST",
              "TRAIN",
              "LEARN",
              "OPTIM",
              "CHAMPION",
              "CHALLENGER",
          )
          '''
          new = '''MLB_WRITER_TOKENS = (
              "PULL",
              "INGEST",
              "TRAIN",
              "LEARN",
              "OPTIM",
              "CHAMPION",
              "CHALLENGER",
          )

          HISTORICAL_NONCANONICAL_WRITER_TOKENS = (
              "HISTORICALOPTIMIZER",
              "HISTORICALOPTIMIZERV7RECOVERYENTRYPOINT",
          )
          '''
          if "HISTORICAL_NONCANONICAL_WRITER_TOKENS" not in text:
              if old not in text:
                  raise SystemExit("writer token anchor not found")
              text = text.replace(old, new, 1)

          old_fn = '''def _is_mlb_pull_or_training_writer(*values: Any) -> bool:
              text = _authority_text(*values)
              if any(token in text for token in LEGACY_TOKENS):
                  return True
              return "MLB" in text and any(token in text for token in MLB_WRITER_TOKENS)
          '''
          new_fn = '''def _is_mlb_pull_or_training_writer(*values: Any) -> bool:
              text = _authority_text(*values)
              if any(token in text for token in LEGACY_TOKENS):
                  return True
              if any(token in text for token in HISTORICAL_NONCANONICAL_WRITER_TOKENS):
                  return False
              return "MLB" in text and any(token in text for token in MLB_WRITER_TOKENS)
          '''
          if old_fn in text:
              text = text.replace(old_fn, new_fn, 1)
          elif new_fn not in text:
              raise SystemExit("writer classifier anchor not found")
          verifier.write_text(text, encoding="utf-8")

          tests = Path("tests/unit/test_mlb_deploy_identity.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_historical_optimizer_is_not_classified_as_live_writer()"
          if marker not in test_text:
              test_text += '''\n\n
def test_historical_optimizer_is_not_classified_as_live_writer() -> None:
    assert deploy_identity._is_mlb_pull_or_training_writer(
        "parlay-platform-mlb-histo-HistoricalOptimizerFunction",
        "mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler",
    ) is False
    assert deploy_identity._is_mlb_pull_or_training_writer(
        "parlay-platform-dev-MLBMLTrainingFunction",
        "mlb_ml_aws_training_v1.lambda_handler",
    ) is True
    assert deploy_identity._is_mlb_pull_or_training_writer(
        "MLBBasePullLegacyRule",
    ) is True
'''
              tests.write_text(test_text, encoding="utf-8")
          PY
      - name: Run targeted regression tests
        run: |
          python -m pip install --quiet "boto3>=1.34,<2" "pytest>=8,<9" "PyYAML>=6,<7"
          python -m pytest -q tests/unit/test_mlb_deploy_identity.py tests/unit/test_mlb_production_acceptance.py
      - name: Commit verified repair
        run: |
          if git diff --quiet; then
            echo "Repair already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_mlb_deploy_identity.py tests/unit/test_mlb_deploy_identity.py
          git commit -m "Fix MLB historical optimizer authority classification"
          git push origin HEAD:main
