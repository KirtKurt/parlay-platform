name: Diagnose tennis lock alarm

on:
  push:
    branches: [agent/diagnose-tennis-lock-alarm-20260813]
    paths: ['.github/workflows/diagnose-tennis-lock-alarm.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  FUNCTION_NAME: parlay-platform-tennis-ml-prod-tennis-lock
  ALARM_NAME: parlay-platform-tennis-ml-prod-tennis-lock-errors

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Inspect exact deployed runtime and triggers
        run: |
          set -euo pipefail
          aws cloudwatch describe-alarms --alarm-names "$ALARM_NAME" --output json > alarm.json
          aws lambda get-function --function-name "$FUNCTION_NAME" --output json > function.json
          aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --output json > lambda.json
          ARN=$(python -c "import json; print(json.load(open('lambda.json'))['FunctionArn'])")
          aws lambda list-tags --resource "$ARN" --output json > tags.json
          aws lambda get-policy --function-name "$FUNCTION_NAME" --output json > policy.json || echo '{}' > policy.json
          aws events list-rule-names-by-target --target-arn "$ARN" --output json > target-rules.json
          mkdir -p deployed
          CODE_URL=$(python -c "import json; print(json.load(open('function.json'))['Code']['Location'])")
          curl --fail --silent --show-error "$CODE_URL" -o deployed.zip
          unzip -q deployed.zip -d deployed
          find deployed -maxdepth 3 -type f | sort > deployed-files.txt
          python - <<'PY'
          import json, os
          tags=json.load(open('tags.json')).get('Tags') or {}
          rules=json.load(open('target-rules.json')).get('RuleNames') or []
          print('TAGS', json.dumps(tags,indent=2))
          print('RULES', rules)
          for rule in rules:
              os.system(f"aws events describe-rule --name '{rule}' --output json > 'rule-{rule}.json'")
              os.system(f"aws events list-targets-by-rule --rule '{rule}' --output json > 'targets-{rule}.json'")
          print('FILES')
          print(open('deployed-files.txt').read())
          PY
          STACK=$(python - <<'PY'
          import json
          t=json.load(open('tags.json')).get('Tags') or {}
          print(t.get('aws:cloudformation:stack-name') or t.get('aws:cloudformation:stack-id','').split('/')[-2] if t.get('aws:cloudformation:stack-id') else '')
          PY
          )
          if [ -n "$STACK" ]; then
            aws cloudformation get-template --stack-name "$STACK" --output json > stack-template.json
            aws cloudformation list-stack-resources --stack-name "$STACK" --output json > stack-resources.json
          else
            echo '{}' > stack-template.json
            echo '{}' > stack-resources.json
          fi
          echo '--- handler candidates ---'
          grep -RIn --exclude='*.pyc' -E 'def (lambda_handler|handler)|lock|requests\.|urllib|httpx|boto3' deployed | head -300 || true

      - uses: actions/upload-artifact@v4
        with:
          name: tennis-lock-runtime-diagnostic-${{ github.run_id }}
          path: |
            alarm.json
            function.json
            lambda.json
            tags.json
            policy.json
            target-rules.json
            rule-*.json
            targets-*.json
            stack-template.json
            stack-resources.json
            deployed-files.txt
            deployed/
          retention-days: 14
