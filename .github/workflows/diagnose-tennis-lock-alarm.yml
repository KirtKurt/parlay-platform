name: Diagnose tennis lock alarm

on:
  push:
    branches: [agent/diagnose-tennis-lock-alarm-20260813]
    paths: ['.github/workflows/diagnose-tennis-lock-alarm.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  FUNCTION_NAME: parlay-platform-tennis-ml-prod-tennis-lock
  ALARM_NAME: parlay-platform-tennis-ml-prod-tennis-lock-errors

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read alarm, Lambda configuration, recent metrics, and exact error logs
        run: |
          set -euo pipefail
          aws cloudwatch describe-alarms --alarm-names "$ALARM_NAME" --output json > alarm.json
          aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --output json > lambda.json
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          START=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name Errors \
            --dimensions Name=FunctionName,Value="$FUNCTION_NAME" --statistics Sum --period 300 \
            --start-time "$START" --end-time "$NOW" --output json > errors.json
          aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name Invocations \
            --dimensions Name=FunctionName,Value="$FUNCTION_NAME" --statistics Sum --period 300 \
            --start-time "$START" --end-time "$NOW" --output json > invocations.json
          LOG_GROUP="/aws/lambda/$FUNCTION_NAME"
          START_MS=$(date -u -d '2026-08-13 16:50:00 UTC' +%s%3N)
          END_MS=$(date -u -d '2026-08-13 17:10:00 UTC' +%s%3N)
          aws logs filter-log-events --log-group-name "$LOG_GROUP" --start-time "$START_MS" --end-time "$END_MS" --output json > exact-window.json
          RECENT_MS=$(date -u -d '90 minutes ago' +%s%3N)
          aws logs filter-log-events --log-group-name "$LOG_GROUP" --start-time "$RECENT_MS" --output json > recent-window.json
          python - <<'PY'
          import json
          alarm=json.load(open('alarm.json'))['MetricAlarms'][0]
          cfg=json.load(open('lambda.json'))
          exact=json.load(open('exact-window.json')).get('events',[])
          recent=json.load(open('recent-window.json')).get('events',[])
          errs=sorted(json.load(open('errors.json')).get('Datapoints',[]), key=lambda x:x.get('Timestamp',''))
          inv=sorted(json.load(open('invocations.json')).get('Datapoints',[]), key=lambda x:x.get('Timestamp',''))
          def important(events):
              rows=[]
              for e in events:
                  m=str(e.get('message','')).strip()
                  if any(x in m for x in ('ERROR','Error','Exception','Task timed out','Runtime.ExitError','REPORT RequestId')):
                      rows.append({'timestamp':e.get('timestamp'),'message':m[:4000]})
              return rows
          out={
              'alarm_state':alarm.get('StateValue'),
              'alarm_reason':alarm.get('StateReason'),
              'alarm_updated':alarm.get('StateUpdatedTimestamp'),
              'lambda_last_modified':cfg.get('LastModified'),
              'lambda_timeout':cfg.get('Timeout'),
              'lambda_memory_mb':cfg.get('MemorySize'),
              'lambda_state':cfg.get('State'),
              'error_datapoints':errs,
              'invocation_datapoints':inv,
              'exact_window_important':important(exact),
              'recent_window_important':important(recent),
              'recent_log_event_count':len(recent),
          }
          print(json.dumps(out, indent=2, default=str))
          open('diagnostic.json','w').write(json.dumps(out, indent=2, default=str))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tennis-lock-alarm-diagnostic-${{ github.run_id }}
          path: |
            alarm.json
            lambda.json
            errors.json
            invocations.json
            exact-window.json
            recent-window.json
            diagnostic.json
          retention-days: 14
