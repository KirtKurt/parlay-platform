name: Repair MLB Auto Post-Deadline Proof Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-auto-postdeadline-proof-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-mlb-auto-postdeadline-proof-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make deployment proof timing-aware without permitting late publication
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-mlb-auto-llm.yml')
          text = path.read_text(encoding='utf-8')

          old = """          status=response.get('status')\n          assert status in {'CARD_PUBLISHED','CARD_ALREADY_PUBLISHED','NO_GAMES'}, response\n          card=response.get('card') or {}\n          source=response.get('sourceStatus') or card.get('sourceStatus') or {}\n          if status != 'NO_GAMES':\n"""
          new = """          status=response.get('status')\n          assert status in {'CARD_PUBLISHED','CARD_ALREADY_PUBLISHED','NO_GAMES','COLLECTING'}, response\n          card=response.get('card') or {}\n          source=response.get('sourceStatus') or card.get('sourceStatus') or {}\n          if status == 'COLLECTING':\n              # A deployment smoke may occur after the immutable publication deadline.\n              # In that case success means the runtime remains healthy and explicitly\n              # refuses to create a late card; it must never force-publish for a test.\n              assert response.get('latePublicationPrevented') is True, response\n              assert response.get('threeSourceCoverageComplete') is True, response\n              deadline=response.get('deadline') or {}\n              assert deadline.get('publishDeadlineUtc'), response\n          if status != 'NO_GAMES':\n"""
          if old not in text:
              raise SystemExit('production-cycle assertion anchor not found')
          text = text.replace(old, new, 1)

          old = """                  'status':cycle.get('status'),\n                  'threeSourceCoverageComplete':(\n"""
          new = """                  'status':cycle.get('status'),\n                  'latePublicationPrevented':cycle.get('latePublicationPrevented'),\n                  'postDeadlineFailClosed':(\n                      cycle.get('status') == 'COLLECTING'\n                      and cycle.get('latePublicationPrevented') is True\n                  ),\n                  'threeSourceCoverageComplete':(\n"""
          if old not in text:
              raise SystemExit('durable provider-cycle anchor not found')
          text = text.replace(old, new, 1)

          old = """          body['ok']=(\n              body['jobStatus'] == 'success'\n              and body['bedrockSmoke']['ok'] is True\n              and body['providerCycle']['ok'] is True\n              and body['providerCycle']['modelAuthorityComplete'] is True\n              and body['providerCycle']['modelDecisionCount'] == body['providerCycle']['pickCount']\n              and body['publicStatus']['fullyAutonomous'] is True\n              and bool(rules)\n              and all(row.get('state') == 'ENABLED' for row in rules)\n          )\n"""
          new = """          card_authority_ok=(\n              body['providerCycle']['modelAuthorityComplete'] is True\n              and body['providerCycle']['pickCount'] > 0\n              and body['providerCycle']['modelDecisionCount'] == body['providerCycle']['pickCount']\n          )\n          postdeadline_fail_closed_ok=(\n              body['providerCycle']['postDeadlineFailClosed'] is True\n              and body['providerCycle']['threeSourceCoverageComplete'] is True\n              and body['providerCycle']['pickCount'] == 0\n              and body['bedrockSmoke']['decisionAuthority'] in {'BEDROCK_LLM','AWS_ML_RANKED_ENSEMBLE'}\n          )\n          body['ok']=(\n              body['jobStatus'] == 'success'\n              and body['bedrockSmoke']['ok'] is True\n              and body['providerCycle']['ok'] is True\n              and (card_authority_ok or postdeadline_fail_closed_ok)\n              and body['publicStatus']['fullyAutonomous'] is True\n              and bool(rules)\n              and all(row.get('state') == 'ENABLED' for row in rules)\n          )\n"""
          if old not in text:
              raise SystemExit('durable acceptance anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify repair remains fail-closed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          path=Path('.github/workflows/deploy-mlb-auto-llm.yml')
          text=path.read_text(encoding='utf-8')
          yaml.safe_load(text)
          assert "status == 'COLLECTING'" in text
          assert "latePublicationPrevented') is True" in text
          assert "threeSourceCoverageComplete') is True" in text
          assert "pickCount'] == 0" in text
          assert "force_publish\":true" in text
          assert "CARD_PUBLISHED" in text and "AWS_ML_RANKED_ENSEMBLE" in text
          assert "postDeadlineFailClosed" in text
          print('timing-aware deployment acceptance contract verified')
          PY
        env:
          PYTHONPATH: .

      - name: Commit repaired deployment contract
        run: |
          set -euo pipefail
          python -m pip install --quiet 'PyYAML>=6,<7'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-mlb-auto-llm.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Accept verified MLB Auto post-deadline fail-closed smoke'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              git push origin HEAD:main && break
              sleep $((attempt * 3))
            done
          fi

      - name: Dispatch repaired isolated MLB Auto deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          gh workflow run deploy-mlb-auto-llm.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Repaired MLB Auto deployment dispatched.'
