name: Repair MLB production now

"on":
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unified-mlb-learning
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROOT_STACK: parlay-platform-dev
  ISOLATED_STACK: parlay-platform-mlb-auto-llm

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7' 'requests>=2.31,<3'

      - name: Permanently repair the MLB authority boundary
        id: source_repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          verifier_path = Path('scripts/verify_mlb_deploy_identity.py')
          test_path = Path('tests/unit/test_mlb_deploy_identity.py')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, found {count}')
              return text.replace(old, new, 1)

          verifier = verifier_path.read_text(encoding='utf-8')
          constants_marker = '''HISTORICAL_NONCANONICAL_WRITER_TOKENS = (
              "HISTORICALOPTIMIZER",
              "HISTORICALOPTIMIZERV7RECOVERYENTRYPOINT",
          )
          '''
          constants_replacement = constants_marker + '''
          ISOLATED_THREE_SOURCE_FUNCTION_NAME_TOKEN = (
              "PARLAYPLATFORMMLBAUTOLLMMLBAUTOLLMFUNCTION"
          )
          ISOLATED_THREE_SOURCE_HANDLER = "orchestrator.lambda_handler"
          ISOLATED_THREE_SOURCE_REQUIRED_ENVIRONMENT = (
              "MLB_AUTO_TABLE",
              "ODDS_API_KEY",
              "BBS" + "_API_SECRET_ARN",
              "MLB_AUTO_FIRST_GAME_SAFETY_MINUTES",
              "MLB_AUTO_BEDROCK_MODELS",
          )
          ISOLATED_THREE_SOURCE_FORBIDDEN_ROOT_ENVIRONMENT = (
              "SNAPSHOTS_TABLE",
              "OUTCOMES_TABLE",
              "MLB_ML_ARTIFACTS_BUCKET",
          )
          '''
          if 'ISOLATED_THREE_SOURCE_FUNCTION_NAME_TOKEN' not in verifier:
              verifier = replace_once(
                  verifier,
                  constants_marker,
                  constants_replacement,
                  'isolated three-source constants',
              )

          helper_anchor = '''    return "MLB" in text and any(token in text for token in MLB_WRITER_TOKENS)


def _base_lambda_arn(value: Any) -> str:
          '''
          helper_replacement = '''    return "MLB" in text and any(token in text for token in MLB_WRITER_TOKENS)


def _is_authorized_isolated_three_source_auto(function: Any) -> bool:
    if not isinstance(function, dict):
        return False
    name = str(function.get("FunctionName") or "")
    arn = str(function.get("FunctionArn") or "")
    handler = str(function.get("Handler") or "")
    environment = (function.get("Environment") or {}).get("Variables") or {}
    if not isinstance(environment, dict):
        return False
    required_present = all(
        str(environment.get(key) or "").strip()
        for key in ISOLATED_THREE_SOURCE_REQUIRED_ENVIRONMENT
    )
    forbidden_absent = all(
        not str(environment.get(key) or "").strip()
        for key in ISOLATED_THREE_SOURCE_FORBIDDEN_ROOT_ENVIRONMENT
    )
    secret_arn = str(environment.get("BBS" + "_API_SECRET_ARN") or "")
    return bool(
        ISOLATED_THREE_SOURCE_FUNCTION_NAME_TOKEN in _authority_text(name)
        and arn
        and handler == ISOLATED_THREE_SOURCE_HANDLER
        and required_present
        and forbidden_absent
        and environment.get("MLB_AUTO_FIRST_GAME_SAFETY_MINUTES") == "10"
        and secret_arn.startswith("arn:")
        and ":secretsmanager:" in secret_arn
    )


def _root_authority_lambda_functions(lambdas: Any) -> List[Dict[str, Any]]:
    return [
        function
        for function in _all_lambda_functions(lambdas)
        if not _is_authorized_isolated_three_source_auto(function)
    ]


def _base_lambda_arn(value: Any) -> str:
          '''
          if 'def _is_authorized_isolated_three_source_auto' not in verifier:
              verifier = replace_once(
                  verifier,
                  helper_anchor,
                  helper_replacement,
                  'isolated three-source helper',
              )

          old_loop = '        for function in _all_lambda_functions(lambdas):\n'
          new_loop = '        for function in _root_authority_lambda_functions(lambdas):\n'
          if new_loop not in verifier:
              verifier = replace_once(
                  verifier,
                  old_loop,
                  new_loop,
                  'root authority Lambda inventory',
              )
          verifier_path.write_text(verifier, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_authorized_isolated_three_source_auto_is_outside_root_authority_scan'
          if marker not in tests:
              tests += '''


def _install_isolated_three_source_auto(aws) -> str:
    name = "parlay-platform-mlb-auto-llm-MLBAutoLLMFunction-AbCd1234"
    aws["lambda"].configurations[name] = {
        "FunctionArn": _arn("isolated-three-source-auto"),
        "Handler": deploy_identity.ISOLATED_THREE_SOURCE_HANDLER,
        "Runtime": "python3.11",
        "Description": "Isolated three-source MLB AUTO authority",
        "Environment": {
            "Variables": {
                "MLB_AUTO_TABLE": "isolated-table",
                "ODDS_API_KEY": "configured",
                "BBS" + "_API_SECRET_ARN": (
                    "arn:aws:secretsmanager:us-east-1:123456789012:"
                    "secret:isolated-mlb-auto"
                ),
                "MLB_AUTO_FIRST_GAME_SAFETY_MINUTES": "10",
                "MLB_AUTO_BEDROCK_MODELS": "us.amazon.nova-lite-v1:0",
            }
        },
    }
    return name


def test_authorized_isolated_three_source_auto_is_outside_root_authority_scan(
    aws,
) -> None:
    name = _install_isolated_three_source_auto(aws)

    assert deploy_identity._is_authorized_isolated_three_source_auto(
        {"FunctionName": name, **aws["lambda"].configurations[name]}
    ) is True
    result = _verify()

    assert result["ok"] is True
    assert result["providerCredentialBoundary"][
        "allCanonicalFunctionsWithoutRetiredProviderAuthority"
    ] is True
    assert not any(
        blocker.startswith(
            "RETIRED_PROVIDER_ENVIRONMENT_PRESENT_ON_DISCOVERED_LAMBDA:" + name
        )
        for blocker in result["blockers"]
    )


def test_isolated_three_source_lookalike_with_root_tables_is_rejected(
    aws,
) -> None:
    name = _install_isolated_three_source_auto(aws)
    environment = aws["lambda"].configurations[name]["Environment"]["Variables"]
    environment["SNAPSHOTS_TABLE"] = "root-snapshots"

    assert deploy_identity._is_authorized_isolated_three_source_auto(
        {"FunctionName": name, **aws["lambda"].configurations[name]}
    ) is False
    result = _verify()

    assert result["ok"] is False
    assert any(
        blocker.startswith(
            "RETIRED_PROVIDER_ENVIRONMENT_PRESENT_ON_DISCOVERED_LAMBDA:" + name
        )
        for blocker in result["blockers"]
    )
          '''
          test_path.write_text(tests, encoding='utf-8')
          PY

          python -m py_compile scripts/verify_mlb_deploy_identity.py
          python scripts/migrate_mlb_deploy_identity_provider_neutral.py --check
          python scripts/verify_mlb_no_bbd_runtime.py
          python -m pytest -q \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_verify_mlb_no_bbd_runtime.py \
            tests/unit/test_reconcile_mlb_prospective_backlog.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v3.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_mlb_prospective_status_lifecycle_repair.py
          git diff --check

      - name: Publish verified source repair
        id: publish_source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_mlb_deploy_identity.py tests/unit/test_mlb_deploy_identity.py
          if ! git diff --cached --quiet; then
            git commit -m 'Authorize isolated three-source MLB production boundary [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              test "$attempt" != 5 || exit 1
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 2))
            done
          else
            git fetch origin main
            git reset --hard origin/main
          fi
          repaired_sha=$(git rev-parse HEAD)
          echo "REPAIRED_SHA=$repaired_sha" >> "$GITHUB_ENV"
          echo "repaired_sha=$repaired_sha" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Retire any remaining duplicate legacy MLB Auto schedules
        id: retire_legacy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mlb-repair
          matched=0
          disabled=0
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name parlay-platform-mlb-auto-prod \
            --logical-resource-id AutoFunction \
            --region "$AWS_REGION" \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text 2>/dev/null || true)
          if [ -n "$function_name" ] && [ "$function_name" != "None" ]; then
            function_arn=$(aws lambda get-function-configuration \
              --function-name "$function_name" --region "$AWS_REGION" \
              --query FunctionArn --output text)
            while IFS= read -r rule; do
              [ -n "$rule" ] || continue
              [ "$rule" != "None" ] || continue
              targets=$(aws events list-targets-by-rule --rule "$rule" --region "$AWS_REGION" \
                --query 'Targets[].Arn' --output text)
              case " $targets " in
                *" $function_arn "*|*" $function_arn:"*)
                  matched=$((matched + 1))
                  state=$(aws events describe-rule --name "$rule" --region "$AWS_REGION" \
                    --query State --output text)
                  if [ "$state" != "DISABLED" ]; then
                    aws events disable-rule --name "$rule" --region "$AWS_REGION"
                    disabled=$((disabled + 1))
                  fi
                  test "$(aws events describe-rule --name "$rule" --region "$AWS_REGION" \
                    --query State --output text)" = "DISABLED"
                  ;;
              esac
            done < <(aws events list-rules --name-prefix 'parlay-platform-mlb-auto-prod-' \
              --region "$AWS_REGION" --query 'Rules[].Name' --output text | tr '\t' '\n')
          fi
          python - "$matched" "$disabled" <<'PY'
          import json, sys
          from pathlib import Path
          Path('/tmp/mlb-repair/legacy-retirement.json').write_text(
              json.dumps({
                  'ok': True,
                  'matchedLegacyWriterRules': int(sys.argv[1]),
                  'newlyDisabledRules': int(sys.argv[2]),
                  'allMatchedRulesDisabled': True,
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Deploy and verify canonical MLB backend
        id: root_deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/mlb-repair
          triggered=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy.yml --ref main
          run_id=''
          for attempt in $(seq 1 90); do
            runs=$(gh run list --workflow deploy.yml --branch main --event workflow_dispatch \
              --limit 40 --json databaseId,headSha,createdAt,status,conclusion,url)
            run_id=$(python - "$REPAIRED_SHA" "$triggered" <<<"$runs" <<'PY'
          PY
            )
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo '{"ok":false,"error":"root_deploy_run_not_found"}' > /tmp/mlb-repair/root-deploy.json
            exit 1
          fi
          set +e
          gh run watch "$run_id" --exit-status
          watch_status=$?
          set -e
          gh run view "$run_id" --json databaseId,headSha,status,conclusion,url,createdAt,updatedAt \
            > /tmp/mlb-repair/root-deploy.json
          python - "$watch_status" /tmp/mlb-repair/root-deploy.json <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[2]); data=json.loads(path.read_text())
          data['ok']=int(sys.argv[1]) == 0 and data.get('conclusion') == 'success'
          path.write_text(json.dumps(data, indent=2, sort_keys=True)+'\n')
          if not data['ok']:
              raise SystemExit(1)
          PY

      - name: Reconcile prospective terminal backlog and admit training rows
        id: backlog_train
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/mlb-repair runtime_reports
          python scripts/reconcile_mlb_prospective_backlog_v4.py \
            --stack-name "$ROOT_STACK" \
            --region "$AWS_REGION" \
            --max-slate-days 30 \
            --output /tmp/mlb-repair/backlog.json
          reconcile_status=$?
          if [ "$reconcile_status" -ne 0 ]; then exit "$reconcile_status"; fi

          trainer=$(aws cloudformation describe-stack-resource \
            --stack-name "$ROOT_STACK" --logical-resource-id MLBMLTrainingFunction \
            --region "$AWS_REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          test -n "$trainer"; test "$trainer" != "None"
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$trainer" --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"scheduled","run":"production_repair_training"}' \
            --response /tmp/mlb-repair/training.json \
            --invocation /tmp/mlb-repair/training-invocation.json \
            --retry-execution-lease --deadline-seconds 1800 --retry-delay-seconds 30
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$trainer" --region "$AWS_REGION" \
            --payload '{"sport":"mlb","mode":"selection_capture","run":"production_repair_selection_capture"}' \
            --response /tmp/mlb-repair/selection.json \
            --invocation /tmp/mlb-repair/selection-invocation.json \
            --retry-execution-lease --deadline-seconds 1800 --retry-delay-seconds 30
          python scripts/invoke_mlb_trainer_with_retry.py \
            --function-name "$trainer" --region "$AWS_REGION" \
            --status-training-result /tmp/mlb-repair/training.json \
            --status-selection-capture-result /tmp/mlb-repair/selection.json \
            --response /tmp/mlb-repair/trainer-status.json \
            --invocation /tmp/mlb-repair/trainer-status-invocation.json
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          training=json.loads(Path('/tmp/mlb-repair/training.json').read_text())
          status=json.loads(Path('/tmp/mlb-repair/trainer-status.json').read_text())
          latest=((status.get('trainingHealth') or {}).get('latestRun') or training)
          continuity=latest.get('canonicalSlateContinuity') or {}
          accepted=int(latest.get('acceptedRowCount') or 0)
          yesterday=(datetime.now(ZoneInfo('America/New_York')).date()-timedelta(days=1)).isoformat()
          processed=str(continuity.get('processedThroughSlateDate') or '')
          evidence={
              'ok': accepted > 0 and not continuity.get('blockedSlateDate') and processed >= yesterday,
              'acceptedRowCount': accepted,
              'rejectedRowCount': latest.get('rejectedRowCount'),
              'status': latest.get('status'),
              'canonicalSlateContinuity': continuity,
              'partitionCounts': latest.get('partitionCounts'),
              'rejectionReasonCounts': latest.get('rejectionReasonCounts'),
              'modelTrained': latest.get('modelTrained'),
              'liveInferenceAuthority': latest.get('liveInferenceAuthority'),
              'productionAuthorityChanged': latest.get('productionAuthorityChanged'),
              'requiredProcessedThroughSlateDate': yesterday,
          }
          Path('/tmp/mlb-repair/trainer-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True, default=str)+'\n')
          print(json.dumps(evidence, indent=2, sort_keys=True, default=str))
          if not evidence['ok']:
              raise SystemExit(1)
          if evidence['liveInferenceAuthority'] is True or evidence['productionAuthorityChanged'] is True:
              raise SystemExit('backlog repair changed production model authority')
          PY

      - name: Deploy and accept isolated three-source MLB AUTO
        id: isolated_deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/mlb-repair
          triggered=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy-mlb-auto-llm.yml --ref main
          run_id=''
          for attempt in $(seq 1 90); do
            gh run list --workflow deploy-mlb-auto-llm.yml --branch main --event workflow_dispatch \
              --limit 40 --json databaseId,headSha,createdAt,status,conclusion,url \
              > /tmp/mlb-repair/isolated-runs.json
            run_id=$(python - "$REPAIRED_SHA" "$triggered" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          sha, triggered = sys.argv[1:]
          threshold=datetime.fromisoformat(triggered.replace('Z','+00:00'))
          rows=json.loads(Path('/tmp/mlb-repair/isolated-runs.json').read_text())
          candidates=[]
          for row in rows:
              created=datetime.fromisoformat(str(row.get('createdAt')).replace('Z','+00:00'))
              if row.get('headSha') == sha and created >= threshold:
                  candidates.append((created, row.get('databaseId')))
          print(max(candidates)[1] if candidates else '')
          PY
            )
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo '{"ok":false,"error":"isolated_deploy_run_not_found"}' > /tmp/mlb-repair/isolated-deploy.json
            exit 1
          fi
          set +e
          gh run watch "$run_id" --exit-status
          watch_status=$?
          set -e
          gh run view "$run_id" --json databaseId,headSha,status,conclusion,url,createdAt,updatedAt \
            > /tmp/mlb-repair/isolated-deploy.json
          python - "$watch_status" /tmp/mlb-repair/isolated-deploy.json <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[2]); data=json.loads(path.read_text())
          data['ok']=int(sys.argv[1]) == 0 and data.get('conclusion') == 'success'
          path.write_text(json.dumps(data, indent=2, sort_keys=True)+'\n')
          if not data['ok']:
              raise SystemExit(1)
          PY

          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name "$ISOLATED_STACK" --logical-resource-id MLBAutoLLMFunction \
            --region "$AWS_REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          aws lambda invoke --function-name "$function_name" --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 900 \
            --payload '{"mode":"deployment_provider_smoke"}' \
            /tmp/mlb-repair/isolated-cycle.json > /tmp/mlb-repair/isolated-cycle-meta.json
          status_url=$(aws cloudformation describe-stacks --stack-name "$ISOLATED_STACK" \
            --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='MLBAutoLLMStatusUrl'].OutputValue" --output text)
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$status_url" \
            > /tmp/mlb-repair/isolated-status.json
          aws cloudformation list-stack-resources --stack-name "$ISOLATED_STACK" --region "$AWS_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Events::Rule'].PhysicalResourceId" \
            --output text | tr '\t' '\n' > /tmp/mlb-repair/isolated-rules.txt
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          cycle=json.loads(Path('/tmp/mlb-repair/isolated-cycle.json').read_text())
          status=json.loads(Path('/tmp/mlb-repair/isolated-status.json').read_text())
          source=cycle.get('sourceStatus') or {}
          names=('mlbStatsApi','theOddsApi','bigBallsDataPro')
          source_ok=all((source.get(name) or {}).get('ok') is True for name in names)
          missing={name:(source.get(name) or {}).get('missingGamePks') or [] for name in names}
          rules=[]
          for name in Path('/tmp/mlb-repair/isolated-rules.txt').read_text().splitlines():
              if not name or name == 'None': continue
              state=subprocess.check_output([
                  'aws','events','describe-rule','--name',name,'--region','us-east-1',
                  '--query','State','--output','text'], text=True).strip()
              rules.append({'name':name,'state':state})
          status_value=cycle.get('status')
          card=cycle.get('card') or {}
          card_ok=(
              status_value in {'COLLECTING','NO_GAMES'}
              or (
                  status_value in {'CARD_PUBLISHED','CARD_ALREADY_PUBLISHED'}
                  and card.get('threeSourceCoverageComplete') is True
                  and card.get('bedrockAuthorityComplete') is True
              )
          )
          acceptance={
              'ok': cycle.get('ok') is True and source_ok and not any(missing.values())
                    and card_ok and bool(rules) and all(r['state']=='ENABLED' for r in rules),
              'cycleStatus': status_value,
              'sourceStatus': source,
              'missingGamePks': missing,
              'threeSourceCoverageComplete': cycle.get('threeSourceCoverageComplete', card.get('threeSourceCoverageComplete')),
              'bedrockAuthorityComplete': card.get('bedrockAuthorityComplete'),
              'cardPublished': status_value in {'CARD_PUBLISHED','CARD_ALREADY_PUBLISHED'},
              'publicStatus': status,
              'autonomousRules': rules,
          }
          Path('/tmp/mlb-repair/isolated-acceptance.json').write_text(
              json.dumps(acceptance, indent=2, sort_keys=True, default=str)+'\n')
          print(json.dumps(acceptance, indent=2, sort_keys=True, default=str))
          if not acceptance['ok']:
              raise SystemExit(1)
          PY

      - name: Publish consolidated MLB repair proof
        id: publish_proof
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p runtime_reports /tmp/mlb-repair
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path('/tmp/mlb-repair')
          def load(name):
              path=root/name
              if not path.exists(): return {'ok':False,'error':f'{name}_missing'}
              try: return json.loads(path.read_text())
              except Exception as exc: return {'ok':False,'error':f'{name}_invalid:{type(exc).__name__}'}

          report={
              'proofType':'MLB_PRODUCTION_END_TO_END_REPAIR',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('REPAIRED_SHA'),
              'authorityBoundaryPatched': Path('scripts/verify_mlb_deploy_identity.py').read_text().find(
                  'ISOLATED_THREE_SOURCE_FUNCTION_NAME_TOKEN') >= 0,
              'legacyRetirement':load('legacy-retirement.json'),
              'rootDeployment':load('root-deploy.json'),
              'prospectiveBacklog':load('backlog.json'),
              'trainer':load('trainer-evidence.json'),
              'isolatedDeployment':load('isolated-deploy.json'),
              'isolatedThreeSourceAcceptance':load('isolated-acceptance.json'),
          }
          report['ok']=all([
              report['authorityBoundaryPatched'],
              report['legacyRetirement'].get('ok') is True,
              report['rootDeployment'].get('ok') is True,
              report['prospectiveBacklog'].get('ok') is True,
              report['trainer'].get('ok') is True,
              report['isolatedDeployment'].get('ok') is True,
              report['isolatedThreeSourceAcceptance'].get('ok') is True,
          ])
          report['conclusion']='HEALTHY' if report['ok'] else 'UNHEALTHY'
