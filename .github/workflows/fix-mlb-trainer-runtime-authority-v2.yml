name: Fix MLB trainer runtime authority v2

on:
  push:
    branches: [main]
    paths:
      - ".github/mlb-trainer-runtime-authority-v2-trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch and verify trainer authority contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify_mlb_trainer_deploy_response.py")
          text = path.read_text(encoding="utf-8")
          old_check = 'status_after.get("runtimeAuthorityActivationAvailable") is not False'
          old_error = 'runtime_authority_activation_must_remain_unavailable'
          new_check = 'status_after.get("runtimeAuthorityActivationAvailable") is not True'
          new_error = 'runtime_authority_activation_not_available'

          if text.count(old_check) != 1 or text.count(old_error) != 1:
              raise SystemExit("stale trainer authority contract anchor count mismatch")
          text = text.replace(old_check, new_check, 1).replace(old_error, new_error, 1)
          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/deploy.yml").read_text(encoding="utf-8")
          if "'runtimeAuthorityActivationAvailable': True" not in workflow:
              raise SystemExit("live deployment authority contract is not available=true")
          if old_check in text or old_error in text:
              raise SystemExit("stale trainer authority assertion remains")
          if new_check not in text or new_error not in text:
              raise SystemExit("new trainer authority assertion missing")
          PY
          python -m py_compile scripts/verify_mlb_trainer_deploy_response.py
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_mlb_trainer_deploy_response.py
          git commit -m "Align MLB trainer runtime authority verification"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
