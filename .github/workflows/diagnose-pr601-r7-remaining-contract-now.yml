name: Diagnose PR601 R7 remaining contract now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pr601-r7-remaining-contract-now.yml'

permissions:
  contents: write

concurrency:
  group: diagnose-pr601-r7-remaining-contract-now
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "4df94cf3383618b0a990bc41d55e2c955e2e12f2"
      - name: Install diagnostic runtime
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
      - name: Diagnose terminal public-surface validation
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          import pytest

          path = Path('tests/unit/test_mlb_public_per_game_authority.py').resolve()
          spec = importlib.util.spec_from_file_location('r7_public_tests', path)
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)

          def run(quarantine=False):
              mp = pytest.MonkeyPatch()
              try:
                  mp.setattr(mod.exact_contract, 'validate_exact_locked_row', lambda row: [])
                  mp.setattr(mod.immutable_storage, 'validate_canonical_stage_authority', lambda table, row: [])
                  canonical = mod._canonical_item(mod.G1, mod.G1['home_team'], 'home', 71)
                  assessment = mod._playability_item(
                      mod.G1,
                      canonical,
                      'T_MINUS_15',
                      '2026-07-17T22:45:05+00:00',
                      playable=True,
                  )
                  terminal = (
                      mod._quarantine_terminal_outcome_item(mod.G2)
                      if quarantine
                      else mod._terminal_outcome_item(mod.G2)
                  )
                  current = [
                      mod._live(mod.G1, mod.G1['away_team'], 'away')
                  ]
                  if quarantine:
                      current.append({
                          **mod._live(mod.G2, mod.G2['home_team'], 'home'),
                          'futureNestedModel': {
                              'winner': 'Hostile Selection Winner',
                              'probability': 0.99,
                          },
                      })
                  engine = mod._engine(
                      [canonical],
                      current=current,
                      status_items=[assessment, terminal],
                  )
                  mod._install(engine)
                  mp.setattr(
                      mod.coverage,
                      '_now_utc',
                      lambda: datetime(2026, 7, 18, 2, 1, tzinfo=timezone.utc),
                  )
                  result = engine.predict_all(mod.SLATE, store=False)
                  print(json.dumps({
                      'case': 'quarantine' if quarantine else 'no_data',
                      'lockedStatusCount': result.get('lockedStatusCount'),
                      'noPredictionDataCount': result.get('noPredictionDataCount'),
                      'quarantineCount': result.get('missedLockValidPrelockQuarantineCount'),
                      'invalidTerminalLifecycleRows': result.get('invalidTerminalLifecycleRows'),
                      'lockStatus': result.get('lockStatus'),
                      'predictions': [
                          {
                              'gameId': row.get('gameId'),
                              'lockStatus': row.get('lockStatus'),
                              'displayPrediction': row.get('displayPrediction'),
                          }
                          for row in result.get('predictions') or []
                      ],
                  }, sort_keys=True))
              finally:
                  mp.undo()

          run(False)
          run(True)
          PY
      - name: Reproduce exact five failures
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        shell: bash
        run: |
          set +e
          pytest -q \
            tests/unit/test_mlb_canonical_final_labels_v1.py::test_final_label_validation_rejects_same_count_official_pk_swap \
            'tests/unit/test_mlb_canonical_final_labels_v1.py::test_final_label_terminal_requires_unique_official_roster_membership[outside_roster]' \
            tests/unit/test_mlb_cooperative_terminal_chunk.py::test_candidate_alias_queries_are_capped_before_any_query \
            tests/unit/test_mlb_public_per_game_authority.py::test_terminal_no_prediction_status_displays_without_current_prediction_row \
            tests/unit/test_mlb_public_per_game_authority.py::test_valid_quarantine_terminal_is_lifecycle_only_on_public_surface
          exit 0
      - name: Remove one-shot diagnostic from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/r7-diagnostic-cleanup origin/main
          cd /tmp/r7-diagnostic-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-pr601-r7-remaining-contract-now.yml
          git commit -m 'Remove completed PR601 R7 diagnostic [skip ci]'
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((n*2))
          done
          exit 1
