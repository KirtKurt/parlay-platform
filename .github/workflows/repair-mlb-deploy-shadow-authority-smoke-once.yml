name: Repair MLB deploy shadow authority smoke once
# retrigger-registered-workflow: 2026-08-02

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-deploy-shadow-authority-smoke-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-deploy-shadow-authority-smoke-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused validators
        run: python -m pip install --quiet 'PyYAML>=6,<7' 'pytest>=8,<9'

      - name: Align deploy smoke and repository authority verifier
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/deploy.yml'): (
                  "              'runtimeAuthorityActivationAvailable': True,",
                  "              'runtimeAuthorityActivationAvailable': False,",
              ),
              Path('scripts/verify_mlb_workflow_authority.py'): (
                  "            \"'runtimeAuthorityActivationAvailable': True\": (",
                  "            \"'runtimeAuthorityActivationAvailable': False\": (",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
                  print(f'{path}: installed fail-closed shadow authority expectation')
              elif old_count == 0 and new_count == 1:
                  print(f'{path}: repair already installed')
              else:
                  raise SystemExit(
                      f'{path} authority contract drifted: '
                      f'old matches={old_count}, new matches={new_count}'
                  )
          PY

      - name: Validate repair without weakening learning or promotion gates
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          deploy = Path('.github/workflows/deploy.yml').read_text(encoding='utf-8')
          verifier = Path('scripts/verify_mlb_workflow_authority.py').read_text(encoding='utf-8')
          read_api = Path('hello_world/mlb_v3_read_api.py').read_text(encoding='utf-8')

          yaml.safe_load(deploy)
          assert deploy.count("'runtimeAuthorityActivationAvailable': False,") == 1
          assert deploy.count("'runtimeAuthorityActivationAvailable': True,") == 0
          assert verifier.count("\"'runtimeAuthorityActivationAvailable': False\": (") == 1
          assert verifier.count("\"'runtimeAuthorityActivationAvailable': True\": (") == 0
          assert "'firstPromotionRequiresManualReview': True," in deploy
          assert "'manualReviewCreatesShadowApprovalOnly': True," in deploy
          assert "'v2InferenceConsumerInstalled': False," in deploy
          assert "'automaticWagerAllowed': False," in deploy
          assert '"runtimeAuthorityActivationAvailable": historical_active' in read_api
          PY
          python -m py_compile scripts/verify_mlb_workflow_authority.py
          python scripts/verify_mlb_workflow_authority.py
          python -m pytest -q \
            tests/unit/test_mlb_workflow_authority.py \
            tests/unit/test_mlb_shadow_authority_deploy_gate.py \
            tests/unit/test_mlb_historical_read_api_contract.py \
            tests/unit/test_mlb_trainer_deploy_response.py
          git diff --check

      - name: Publish tested repair and self-remove
        run: |
          set -euo pipefail
          workflow='.github/workflows/repair-mlb-deploy-shadow-authority-smoke-once.yml'
          rm -f "$workflow"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/deploy.yml \
            scripts/verify_mlb_workflow_authority.py \
            "$workflow"

          if git diff --cached --quiet; then
            echo 'Repair is already installed and the one-shot workflow is absent.'
            exit 0
          fi

          git commit -m 'fix(mlb): align deploy smoke with fail-closed shadow authority'

          for attempt in $(seq 1 30); do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'Published tested MLB deploy smoke repair.'
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            echo "Concurrent main update blocked publish attempt ${attempt}; retrying"
            sleep 3
          done

          echo 'Unable to publish tested MLB deploy smoke repair after thirty attempts.' >&2
          exit 1
