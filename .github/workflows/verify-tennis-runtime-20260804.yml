name: Verify Tennis Runtime 2026-08-04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tennis-runtime-20260804.yml'

permissions:
  contents: write

concurrency:
  group: verify-tennis-runtime-20260804
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Run isolated tennis tests
        run: |
          set -euo pipefail
          python -m py_compile tennis_learning/handler.py tennis_learning/backfill.py tennis_learning/bootstrap_handler.py tennis_learning/live_pipeline.py tennis_learning/autonomous_controller.py
          python -m pip install --quiet pytest boto3
          python -m pytest -q tests/test_tennis_learning_handler.py tests/test_tennis_autonomy_contract.py tests/test_tennis_backfill_contract.py
          sam validate --template-file tennis-template.yaml
      - name: Capture fresh AWS-backed runtime diagnostic
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=parlay-platform-tennis-learning
          region="$AWS_REGION_VALUE"
          stack_status=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query 'Stacks[0].StackStatus' --output text)
          run_endpoint=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyRunApi'].OutputValue" --output text)
          status_endpoint=$(aws cloudformation describe-stacks --stack-name "$stack" --region "$region" --query "Stacks[0].Outputs[?OutputKey=='TennisAutonomyStatusApi'].OutputValue" --output text)
          test -n "$run_endpoint" && test "$run_endpoint" != None
          test -n "$status_endpoint" && test "$status_endpoint" != None
          curl --fail --retry 3 --retry-all-errors --retry-delay 10 -X POST --max-time 900 "$run_endpoint" -o /tmp/tennis-cycle.json
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 "$status_endpoint" -o /tmp/tennis-status.json
          export STACK_STATUS="$stack_status"
          export SOURCE_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          cycle = json.loads(Path('/tmp/tennis-cycle.json').read_text())
          status = json.loads(Path('/tmp/tennis-status.json').read_text())
          actions = cycle.get('actions') or {}
          collect = actions.get('collect') or {}
          settle = actions.get('settle') or {}
          failures = int(status.get('consecutive_failures') or 0)
          authority = str(status.get('authority') or 'UNKNOWN')
          snapshot = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'source_commit': os.environ.get('SOURCE_SHA'),
              'stack_status': os.environ.get('STACK_STATUS'),
              'tests': {
                  'python_compile': 'passed',
                  'tennis_pytest_suites': 'passed',
                  'sam_validate': 'passed',
              },
              'cycle_response': cycle,
              'status_after': status,
              'collection_summary': collect,
              'settlement_summary': settle,
              'actionable_runtime_error': bool(
                  cycle.get('last_error')
                  or collect.get('errors')
                  or settle.get('errors')
                  or failures >= 3
                  or authority == 'DEGRADED'
              ),
              'operationally_healthy': (
                  os.environ.get('STACK_STATUS') == 'UPDATE_COMPLETE'
                  and not cycle.get('last_error')
                  and failures < 3
                  and authority != 'DEGRADED'
              ),
          }
          Path('runtime/tennis_autonomy_diagnostic.json').write_text(
              json.dumps(snapshot, indent=2, sort_keys=True, default=str) + '\n'
          )
          print(json.dumps(snapshot, indent=2, sort_keys=True, default=str))
          PY
          cp runtime/tennis_autonomy_diagnostic.json /tmp/tennis-autonomy-diagnostic.json
      - name: Publish diagnostic and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p runtime
            cp /tmp/tennis-autonomy-diagnostic.json runtime/tennis_autonomy_diagnostic.json
            git rm -f .github/workflows/verify-tennis-runtime-20260804.yml
            git add runtime/tennis_autonomy_diagnostic.json
            git commit -m 'Publish fresh tennis runtime diagnostic [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Unable to publish tennis runtime diagnostic' >&2
          exit 1
