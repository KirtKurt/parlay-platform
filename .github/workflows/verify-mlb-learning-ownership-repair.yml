name: Verify MLB learning ownership repair

"on":
  push:
    branches:
      - fix/mlb-unified-learning-ownership-20260826
    paths:
      - '.github/workflows/mlb-r7-overnight-advance.yml'
      - '.github/workflows/unified-mlb-learning-recovery-once.yml'
      - '.github/workflows/mlb-prospective-settlement-date-recovery-once.yml'
      - 'scripts/verify_unified_mlb_learning_ownership.py'
      - 'tests/unit/test_unified_mlb_learning_ownership.py'
      - '.github/workflows/verify-mlb-learning-ownership-repair.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run MLB-only static ownership proof
        run: |
          set -euo pipefail
          python scripts/verify_unified_mlb_learning_ownership.py
          python -m pytest -q tests/unit/test_unified_mlb_learning_ownership.py
          python -m py_compile scripts/verify_unified_mlb_learning_ownership.py
          git diff --check

