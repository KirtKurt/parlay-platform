name: MLB Historical Surgical Recovery V8

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-surgical-recovery-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HIST_STACK: parlay-platform-mlb-historical-optimizer

jobs:
  patch-deploy-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: mlb-historical-surgical-recovery-v8
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Apply surgical stale-response recovery
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('hello_world/mlb_historical_optimizer_handler.py')
          s = p.read_text()
          old_version = 'VERSION = "MLB-HISTORICAL-OPTIMIZER-AWS-v1.6-complete-ledger-fresh-audit-append-only-authority"'
          new_version = 'VERSION = "MLB-HISTORICAL-OPTIMIZER-AWS-v1.8-archive-before-freshness-quarantine"'
          if old_version in s:
              s = s.replace(old_version, new_version, 1)
          elif new_version not in s:
              raise SystemExit('unexpected VERSION anchor')

          old = '''    # Validate time direction and basic schema before spending another credit.\n    optimizer.normalize_historical_snapshot(payload, requested_at_utc)\n    return dict(payload), headers\n'''
          new = '''    # Archive the provider response before applying freshness policy.\n    # Freshness is evaluated during slate assembly, where stale slots are\n    # quarantined without trapping the resumable cursor.\n    return dict(payload), headers\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('fetch validation anchor missing')
          p.write_text(s)
          PY

          python -m py_compile hello_world/mlb_historical_optimizer_handler.py
          grep -Fq 'v1.8-archive-before-freshness-quarantine' hello_world/mlb_historical_optimizer_handler.py
          grep -Fq 'provider_snapshot_too_stale' hello_world/mlb_historical_optimizer_handler.py
          if sed -n '/def _fetch_historical/,/return dict(payload), headers/p' hello_world/mlb_historical_optimizer_handler.py | grep -Fq 'normalize_historical_snapshot'; then
            echo 'fetch path still performs freshness validation' >&2
            exit 1
          fi

      - name: Add exact regression test
        run: |
          set -euo pipefail
          cat > tests/unit/test_mlb_historical_archive_before_validation_v8.py <<'PY'
          import mlb_historical_optimizer_handler as handler

          def test_fetch_archives_stale_provider_payload_before_freshness_policy(monkeypatch):
              payload = {'timestamp': '2025-04-14T00:00:00Z', 'data': []}
              headers = {'x-requests-last': 10}
              monkeypatch.setattr(handler, '_http_json', lambda url: (payload, headers))
              monkeypatch.setattr(
                  handler.optimizer,
                  'normalize_historical_snapshot',
                  lambda *args, **kwargs: (_ for _ in ()).throw(
                      handler.optimizer.HistoricalOptimizerError(
                          'historical response is too stale for a 15-minute grid'
                      )
                  ),
              )
              actual, actual_headers = handler._fetch_historical('2025-04-14T12:00:00Z')
              assert actual == payload
              assert actual_headers == headers
          PY
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          PYTHONPATH=hello_world python -m pytest -q \
            tests/unit/test_mlb_historical_archive_before_validation_v8.py \
            tests/unit/test_mlb_historical_optimizer_handler.py \
            tests/unit/test_mlb_historical_daily_optimizer_v1.py

      - name: Commit exact repaired source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hello_world/mlb_historical_optimizer_handler.py tests/unit/test_mlb_historical_archive_before_validation_v8.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: archive MLB historical snapshots before freshness quarantine [deploy-v1.8]'
            git push origin HEAD:main
          fi
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build isolated historical stack
        run: |
          set -euo pipefail
          rm -rf .aws-sam-historical-v8
          sam build --no-cached --build-dir .aws-sam-historical-v8 --template-file mlb_historical_optimizer/template.yaml

      - name: Deploy isolated historical stack
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          sam deploy \
            --template-file .aws-sam-historical-v8/template.yaml \
            --stack-name "$HIST_STACK" \
            --region "$AWS_REGION_VALUE" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --force-upload \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              'TargetSnapshotsTable=parlay_platform_snapshots' \
              'HistoricalStartDate=2025-04-01' \
              'HistoricalEndDate=2025-08-31' \
              'HistoricalTargetGames=1600' \
              'HistoricalMaxCredits=120000' \
              'HistoricalRequestsPerRun=100' \
              'HistoricalMaxCandidates=25000' \
              'HistoricalMaxOptimizationRounds=6' \
              'HistoricalFreshAuditIncrementGames=250' \
              "DeployGitSha=${DEPLOY_SHA}"

      - name: Resolve and verify deployed Lambda
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          HIST_FN=$(aws cloudformation describe-stacks --stack-name "$HIST_STACK" --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" --output text)
          test -n "$HIST_FN"
          echo "HIST_FN=$HIST_FN" >> "$GITHUB_ENV"
          URL=$(aws lambda get-function --function-name "$HIST_FN" --region "$AWS_REGION_VALUE" --query 'Code.Location' --output text)
          curl -fsSL "$URL" -o /tmp/mlb-historical-v8.zip
          unzip -p /tmp/mlb-historical-v8.zip mlb_historical_optimizer_handler.py > /tmp/deployed-handler.py
          grep -Fq 'v1.8-archive-before-freshness-quarantine' /tmp/deployed-handler.py
          grep -Fq 'provider_snapshot_too_stale' /tmp/deployed-handler.py
          if sed -n '/def _fetch_historical/,/return dict(payload), headers/p' /tmp/deployed-handler.py | grep -Fq 'normalize_historical_snapshot'; then
            echo 'AWS package still validates freshness before archival' >&2
            exit 1
          fi

      - name: Invoke until cursor advances
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            aws lambda invoke \
              --function-name "$HIST_FN" \
              --region "$AWS_REGION_VALUE" \
              --cli-read-timeout 900 \
              --cli-binary-format raw-in-base64-out \
              --payload "{\"mode\":\"orchestrate\",\"run\":\"surgical_v8_${i}\"}" \
              "/tmp/run-${i}.json" >/tmp/meta-${i}.json
            sleep 3
          done
          aws lambda invoke \
            --function-name "$HIST_FN" \
            --region "$AWS_REGION_VALUE" \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"mode":"status","run":"surgical_v8_status"}' \
            /tmp/status-v8.json >/tmp/status-meta-v8.json

      - name: Require cursor recovery and publish proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          value = json.load(open('/tmp/status-v8.json'))
          state = value.get('state') or {}
          proof = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'deployedSha': os.environ.get('DEPLOY_SHA'),
              'version': value.get('version'),
              'phase': state.get('phase'),
              'currentDate': state.get('currentDate'),
              'currentSlotIndex': state.get('currentSlotIndex'),
              'networkRequestCount': state.get('networkRequestCount'),
              'eligibleGameCount': state.get('eligibleGameCount'),
              'completeSlateCount': state.get('completeSlateCount'),
              'optimizationRound': state.get('optimizationRound'),
              'lastError': state.get('lastError'),
              'skippedHistoricalSlotCount': len(state.get('skippedHistoricalSlots') or []),
          }
          assert 'v1.8-archive-before-freshness-quarantine' in str(proof['version']), proof
          assert 'too stale for a 15-minute grid' not in str(proof['lastError'] or ''), proof
          assert (str(proof['currentDate']), int(proof['currentSlotIndex'] or 0)) != ('2025-04-14', 72), proof
          os.makedirs('docs/runtime', exist_ok=True)
          json.dump(proof, open('docs/runtime/mlb-historical-surgical-recovery-v8-proof.json', 'w'), indent=2)
          print(json.dumps(proof, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/mlb-historical-surgical-recovery-v8-proof.json
          git commit -m 'chore: publish MLB historical surgical recovery v8 proof'
          git push origin HEAD:main
