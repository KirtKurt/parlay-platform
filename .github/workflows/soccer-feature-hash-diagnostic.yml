name: Soccer Feature Hash Diagnostic

on:
  push:
    branches: [agent/soccer-authority-repair]
    paths: [.github/workflows/soccer-feature-hash-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: python -m pip install --quiet 'boto3>=1.34,<2'
      - name: Explode live-lock validator
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import timedelta
          import boto3
          from soccer_auto.canonical import digest, iso_utc, parse_utc, schedule_identity
          from soccer_auto.config import LOCK_MINUTES_BY_HORIZON, PUBLIC_DECISION_HORIZON
          from soccer_auto.inference import live_lock_coverage_provenance_valid, lock_key
          from soccer_auto.storage import plain

          region=os.environ['AWS_REGION_VALUE']; stack='parlay-platform-soccer-auto'
          cf=boto3.client('cloudformation', region_name=region)
          ddb=boto3.resource('dynamodb', region_name=region)
          def table(logical):
              name=cf.describe_stack_resource(StackName=stack,LogicalResourceId=logical)['StackResourceDetail']['PhysicalResourceId']
              return ddb.Table(name)
          rows=[]; kwargs={}
          while True:
              page=table('SoccerLocksTable').scan(**kwargs); rows += [plain(x) for x in page.get('Items',[])]
              key=page.get('LastEvaluatedKey')
              if not key: break
              kwargs={'ExclusiveStartKey':key}
          lock=next(x for x in rows if x.get('entity_type')=='SOCCER_FROZEN_FEATURE_LOCK' and x.get('horizon')=='T10')
          source_ids=list(lock.get('source_slot_ids') or []); source_hashes=list(lock.get('source_payload_hashes') or []); source_uris=list(lock.get('source_raw_uris') or [])
          baseline_ids=list(lock.get('movement_baseline_source_slot_ids') or []); baseline_hashes=list(lock.get('movement_baseline_source_payload_hashes') or []); baseline_uris=list(lock.get('movement_baseline_source_raw_uris') or [])
          required=sorted({str(v) for v in lock.get('coverage_required_pairs') or [] if v}); probe=sorted({str(v) for v in lock.get('coverage_probe_pairs') or [] if v})
          source_observed=parse_utc(str(lock['source_observed_at_max'])); baseline_observed=parse_utc(str(lock['movement_baseline_source_observed_at_max'])); lock_at=parse_utc(str(lock['lock_at']))
          expected=digest({
              'event_key':lock['event_key'],'schedule_revision':int(lock['schedule_revision']),'lock_at':iso_utc(lock_at),
              'coverage_certificate_digest':str(lock.get('coverage_certificate_digest') or ''),'coverage_plan_digest':lock['coverage_plan_digest'],
              'coverage_plan_observed_at':lock['coverage_plan_observed_at'],'coverage_completed_at':lock['coverage_completed_at'],
              'coverage_required_pairs':required,'coverage_probe_pairs':probe,
              'movement_baseline_certificate_digest':str(lock.get('movement_baseline_certificate_digest') or ''),
              'movement_baseline_plan_digest':lock['movement_baseline_plan_digest'],'movement_baseline_plan_observed_at':lock['movement_baseline_plan_observed_at'],
              'source_slot_ids':source_ids,'source_hashes':source_hashes,'source_raw_uris':source_uris,'source_observed_at_max':iso_utc(source_observed),
              'movement_baseline_source_slot_ids':baseline_ids,'movement_baseline_source_hashes':baseline_hashes,'movement_baseline_source_raw_uris':baseline_uris,
              'movement_baseline_source_observed_at_max':iso_utc(baseline_observed),'features':lock['frozen_features']})
          checks={
              'validator':live_lock_coverage_provenance_valid(lock),
              'feature_hash_match':str(lock.get('feature_hash') or '')==expected,
              'actual_feature_hash':lock.get('feature_hash'),'recomputed_persisted_feature_hash':expected,
              'required_digest_match':str(lock.get('coverage_required_pair_digest') or '')==digest(required),
              'probe_digest_match':str(lock.get('coverage_probe_pair_digest') or '')==digest(probe),
              'schedule_identity_match':str(lock.get('schedule_identity') or '')==schedule_identity(lock),
              'source_lengths_match':len(source_ids)==len(source_hashes)==len(source_uris)>0,
              'baseline_lengths_match':len(baseline_ids)==len(baseline_hashes)==len(baseline_uris)>0,
          }
          print(json.dumps(checks,indent=2))
          assert not checks['validator']
          assert checks['required_digest_match'] and checks['probe_digest_match'] and checks['schedule_identity_match']
          assert checks['source_lengths_match'] and checks['baseline_lengths_match']
          assert not checks['feature_hash_match'], checks
          PY
