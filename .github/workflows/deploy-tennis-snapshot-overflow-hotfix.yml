name: Deploy Tennis snapshot overflow hotfix

on:
  pull_request:
    branches: [fix/tennis-snapshot-overflow-20260824]
    paths:
      - "tennis_hotfix/**"
      - ".github/workflows/deploy-tennis-snapshot-overflow-hotfix.yml"
      - ".hotfix/tennis-source-export-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-snapshot-overflow-production
  cancel-in-progress: false

jobs:
  deploy-tennis-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TENNIS_STACK: parlay-platform-tennis-ml-prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validate isolated hotfix source
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile tennis_hotfix/tennis_storage.py
          grep -q 'TENNIS-DDB-ZLIB-JSON-v1' tennis_hotfix/tennis_storage.py
          python -m pip install --quiet boto3

      - name: Patch Tennis Lambdas and prove oversized storage
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/tennis-hotfix/original /tmp/tennis-hotfix/patched /tmp/tennis-hotfix/packages

          stack_status=$(aws cloudformation describe-stacks --stack-name "$TENNIS_STACK" --query 'Stacks[0].StackStatus' --output text)
          case "$stack_status" in CREATE_COMPLETE|UPDATE_COMPLETE) ;; *) echo "Unexpected stack status $stack_status"; exit 1;; esac

          aws cloudformation list-stack-resources --stack-name "$TENNIS_STACK" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Events::Rule'].[PhysicalResourceId]" --output text \
            | tr '\t' '\n' | sed '/^$/d' > /tmp/tennis-hotfix/rules.txt
          : > /tmp/tennis-hotfix/rule-states.tsv
          while read -r rule; do
            state=$(aws events describe-rule --name "$rule" --query State --output text)
            printf '%s\t%s\n' "$rule" "$state" >> /tmp/tennis-hotfix/rule-states.tsv
            [ "$state" != ENABLED ] || aws events disable-rule --name "$rule"
          done < /tmp/tennis-hotfix/rules.txt

          aws cloudformation list-stack-resources --stack-name "$TENNIS_STACK" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Lambda::Function'].[PhysicalResourceId]" --output text \
            | tr '\t' '\n' | sed '/^$/d' > /tmp/tennis-hotfix/functions.txt
          test "$(wc -l < /tmp/tennis-hotfix/functions.txt)" -eq 5

          restore_rules() {
            while IFS=$'\t' read -r rule state; do
              [ -n "$rule" ] || continue
              if [ "$state" = ENABLED ]; then aws events enable-rule --name "$rule" >/dev/null; else aws events disable-rule --name "$rule" >/dev/null; fi
            done < /tmp/tennis-hotfix/rule-states.tsv
          }
          rollback_code() {
            while read -r fn; do
              [ -f "/tmp/tennis-hotfix/original/${fn}.zip" ] || continue
              aws lambda update-function-code --function-name "$fn" --zip-file "fileb:///tmp/tennis-hotfix/original/${fn}.zip" >/dev/null || true
              aws lambda wait function-updated --function-name "$fn" || true
            done < /tmp/tennis-hotfix/functions.txt
          }
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "Hotfix verification failed; rolling back Tennis Lambda code"
              rollback_code
            fi
            restore_rules
            exit "$rc"
          }
          trap cleanup EXIT

          while read -r fn; do
            code_url=$(aws lambda get-function --function-name "$fn" --query 'Code.Location' --output text)
            curl -LfsS "$code_url" -o "/tmp/tennis-hotfix/original/${fn}.zip"
            mkdir -p "/tmp/tennis-hotfix/packages/${fn}"
            unzip -q "/tmp/tennis-hotfix/original/${fn}.zip" -d "/tmp/tennis-hotfix/packages/${fn}"
            test -f "/tmp/tennis-hotfix/packages/${fn}/tennis_storage.py"
            cp tennis_hotfix/tennis_storage.py "/tmp/tennis-hotfix/packages/${fn}/tennis_storage.py"
            python -m py_compile "/tmp/tennis-hotfix/packages/${fn}/tennis_storage.py"
            (cd "/tmp/tennis-hotfix/packages/${fn}" && zip -qr "/tmp/tennis-hotfix/patched/${fn}.zip" .)
            aws lambda update-function-code --function-name "$fn" --zip-file "fileb:///tmp/tennis-hotfix/patched/${fn}.zip" >/dev/null
            aws lambda wait function-updated --function-name "$fn"
            deployed_url=$(aws lambda get-function --function-name "$fn" --query 'Code.Location' --output text)
            curl -LfsS "$deployed_url" -o "/tmp/tennis-hotfix/deployed-${fn}.zip"
            unzip -p "/tmp/tennis-hotfix/deployed-${fn}.zip" tennis_storage.py | grep -q 'TENNIS-DDB-ZLIB-JSON-v1'
          done < /tmp/tennis-hotfix/functions.txt

          ingest=$(aws cloudformation describe-stack-resource --stack-name "$TENNIS_STACK" --logical-resource-id TennisIngestFunction --query 'StackResourceDetail.PhysicalResourceId' --output text)
          snapshots=$(aws cloudformation describe-stack-resource --stack-name "$TENNIS_STACK" --logical-resource-id TennisSnapshotsTable --query 'StackResourceDetail.PhysicalResourceId' --output text)
          first_fn=$(head -1 /tmp/tennis-hotfix/functions.txt)
          pkg="/tmp/tennis-hotfix/packages/${first_fn}"

          PYTHONPATH="$pkg" SNAPSHOTS_TABLE="$snapshots" python - <<'PY'
          import json, os, uuid
          from types import SimpleNamespace
          import boto3
          from tennis_storage import DynamoStore

          table_name=os.environ['SNAPSHOTS_TABLE']
          settings=SimpleNamespace(
              snapshots_table=table_name,
              signal_ledger_table='unused', predictions_table='unused', outcomes_table='unused', models_table='unused'
          )
          store=DynamoStore(settings)
          table=boto3.resource('dynamodb').Table(table_name)
          proof=[]
          for mode,payload in [
              ('inline','A'*700_000),
              ('chunked',os.urandom(500_000).hex()),
          ]:
              token=str(uuid.uuid4())
              pk=f'HOTFIX#TENNIS#SNAPSHOT#{token}'
              sk='TEST#OVERSIZED'
              item={'PK':pk,'SK':sk,'record_type':'tennis_hotfix_storage_test','sport':'tennis','slate_date':'2099-01-01','pulled_at':'2099-01-01T00:00:00Z','pull_id':token,'payload_fingerprint':token,'payload':payload}
              write=store.put_item('snapshots',item,if_absent=True)
              assert write['created'] is True
              raw=table.get_item(Key={'PK':pk,'SK':sk},ConsistentRead=True)['Item']
              assert raw['__tennis_pack_version']=='TENNIS-DDB-ZLIB-JSON-v1'
              restored=store.get_item('snapshots',pk,sk)
              assert restored['payload']==payload
              proof.append({'mode':mode,'originalChars':len(payload),'compressedBytes':int(raw['__tennis_pack_compressed_bytes']),'chunkCount':int(raw.get('__tennis_pack_chunk_count') or 0)})
              chunk_pk=raw.get('__tennis_pack_chunk_pk')
              table.delete_item(Key={'PK':pk,'SK':sk})
              if chunk_pk:
                  from boto3.dynamodb.conditions import Key
                  rows=table.query(KeyConditionExpression=Key('PK').eq(chunk_pk)).get('Items') or []
                  for row in rows:
                      table.delete_item(Key={'PK':row['PK'],'SK':row['SK']})
          open('/tmp/tennis-hotfix/storage-proof.json','w').write(json.dumps(proof,indent=2))
          print('real DynamoDB oversized write/read proof passed',proof)
          PY

          verify_start_ms=$(( $(date +%s) * 1000 ))
          printf '%s' '{"httpMethod":"POST","path":"/v1/pull/tennis","body":"{\"run\":\"snapshot_overflow_hotfix_verify\",\"force\":true}"}' > /tmp/tennis-hotfix/invoke.json
          aws lambda invoke --function-name "$ingest" --cli-read-timeout 300 --cli-connect-timeout 10 \
            --cli-binary-format raw-in-base64-out --payload file:///tmp/tennis-hotfix/invoke.json \
            /tmp/tennis-hotfix/invoke-output.json > /tmp/tennis-hotfix/invoke-meta.json
          python - <<'PY'
          import json
          meta=json.load(open('/tmp/tennis-hotfix/invoke-meta.json'))
          out=json.load(open('/tmp/tennis-hotfix/invoke-output.json'))
          assert meta.get('StatusCode')==200 and not meta.get('FunctionError'), (meta,out)
          body=out.get('body')
          payload=json.loads(body) if isinstance(body,str) else (body or {})
          status=int(out.get('statusCode') or 0)
          if status==200:
              assert payload.get('ok') is True, payload
              print('live Tennis ingest succeeded')
          elif status==500 and 'Polymarket order books missing for' in str(payload.get('error') or ''):
              print('live ingest reached provider gate; temporary Polymarket order-book gap recorded separately:', payload.get('error'))
          else:
              raise AssertionError(out)
          PY

          aws logs filter-log-events --log-group-name "/aws/lambda/${ingest}" --start-time "$verify_start_ms" \
            --filter-pattern '"Item size has exceeded the maximum allowed size"' --output json \
            > /tmp/tennis-hotfix/oversize-errors.json || true
          python - <<'PY'
          import json
          d=json.load(open('/tmp/tennis-hotfix/oversize-errors.json'))
          assert not (d.get('events') or []), d.get('events')
          print('no new DynamoDB oversized-item errors after deployment')
          PY

          echo "Tennis snapshot overflow hotfix deployed and storage proof passed"

      - name: Upload deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-snapshot-overflow-hotfix-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/tennis-hotfix/*.json
            /tmp/tennis-hotfix/*.tsv
            /tmp/tennis-hotfix/*.txt
