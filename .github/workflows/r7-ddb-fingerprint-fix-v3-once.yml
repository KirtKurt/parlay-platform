name: R7 durable-evidence fingerprint repair v3 once

"on":
  push:
    branches:
      - fix/r7-durable-evidence-ddb-fingerprint-20260829

permissions:
  contents: write

concurrency:
  group: r7-durable-evidence-fingerprint-repair-v3-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r7-durable-evidence-ddb-fingerprint-20260829
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply minimal repair and complete regression fixture
        env:
          OLD_B64: 
          NEW_B64: 
          TEST_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          source_path = Path('hello_world/mlb_prospective_row_repair.py')
          source = source_path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if source.count(old) != 1:
              raise SystemExit(
                  f'exact evidence fingerprint block count was {source.count(old)}, expected 1'
              )
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/unit/test_mlb_cooperative_terminal_chunk.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'test_durable_evidence_fingerprint_survives_dynamodb_decimal_roundtrip'
          if marker not in tests:
              tests += base64.b64decode(os.environ['TEST_B64']).decode('utf-8')
              test_path.write_text(tests, encoding='utf-8')
          PY
          rm -f .github/workflows/r7-ddb-fingerprint-fix-once.yml
          rm -f .github/workflows/r7-ddb-fingerprint-fix-v3-once.yml
      - name: Verify focused production contracts
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: hello_world:tests/unit
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile hello_world/mlb_prospective_row_repair.py
          python -m pytest -q tests/unit/test_mlb_cooperative_terminal_chunk.py
      - name: Commit verified repair and remove one-shot workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix R7 durable evidence fingerprint roundtrip'
          git push origin HEAD:fix/r7-durable-evidence-ddb-fingerprint-20260829
