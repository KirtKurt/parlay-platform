name: MLB V7 V8 Slate Diagnostic Once
# Trusted second push after workflow installation.

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v7-v8-today-test-diagnostic-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v7-v8-slate-diagnostic-once-20260726
  cancel-in-progress: false

env:
  TEST_DATE_ET: '2026-07-26'
  REPORT_PATH: runtime_reports/mlb_v7_v8_today_test_20260726.json

jobs:
  diagnose-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run analysis and preserve exact failure
        id: analysis
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          SNAPSHOTS_TABLE: parlay_platform_snapshots
          TARGET_SNAPSHOTS_TABLE: parlay_platform_snapshots
          PYTHONPATH: hello_world
        run: |
          set -uo pipefail
          aws sts get-caller-identity >/tmp/mlb-v7-v8-test-identity.json
          test -n "${ODDS_API_KEY:-}"
          python -m pip install --quiet 'boto3>=1.34,<2' 'requests>=2.31,<3'
          mkdir -p runtime_reports
          python scripts/run_mlb_v7_v8_today_test.py \
            --date "$TEST_DATE_ET" \
            --region "$AWS_REGION_VALUE" \
            --output "$REPORT_PATH" \
            > /tmp/mlb-v7-v8-today-test.log 2>&1
          status=$?
          cat /tmp/mlb-v7-v8-today-test.log
          if test ! -s "$REPORT_PATH"; then
            python - "$status" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-v7-v8-today-test.log').read_text(errors='replace')[-12000:]
          secret=os.environ.get('ODDS_API_KEY','')
          if secret:
              log=log.replace(secret,'[REDACTED]')
          value={
              'proofType':'MLB_V7_V8_ONE_TIME_TODAY_TEST',
              'version':'MLB-V7-V8-TODAY-TEST-v1-diagnostic',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'slateDateEt':os.environ['TEST_DATE_ET'],
              'runId':os.environ['GITHUB_RUN_ID'],
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'testOnly':True,
              'researchOnly':True,
              'productionAuthorityChanged':False,
              'games':[],
              'gameCount':0,
              'errorLogTail':log,
              'blockers':[f'analysis_exit_code:{sys.argv[1]}'],
              'ok':False,
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v7-v8-diagnostic-${{ github.run_id }}
          path: |
            runtime_reports/mlb_v7_v8_today_test_20260726.json
            /tmp/mlb-v7-v8-today-test.log
            /tmp/mlb-v7-v8-test-identity.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable result
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$REPORT_PATH" /tmp/mlb-v7-v8-report.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v7-v8-diagnostic-proof origin/main
            cp /tmp/mlb-v7-v8-report.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && break
            git commit -m 'Publish one-time MLB V7 and V8 diagnostic result'
            git push origin HEAD:main && break
            sleep $((attempt * 3))
          done

      - name: Enforce analysis exit status
        if: always()
        run: |
          test "${{ steps.analysis.outputs.exit_code }}" = 0
