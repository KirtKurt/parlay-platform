    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch registered one-shot verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run repair-tennis-status-20260802-0844.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
