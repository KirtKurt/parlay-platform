name: Repair MLB deploy capacity validator now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-deploy-capacity-validator-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-deploy-capacity-validator
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch false capacity failure for intentional fail-closed R7 response
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          source = path.read_text(encoding='utf-8')
          old = '''            curl --fail --silent --show-error \\
              --connect-timeout 2 --max-time 8 \\
              "${base_url}/v1/mlb/model/version" >/tmp/mlb-capacity-model.json \\
              && model_ok=true
'''
          new = '''            model_status=$(curl --silent --show-error \\
              --connect-timeout 2 --max-time 8 \\
              --output /tmp/mlb-capacity-model.json \\
              --write-out '%{http_code}' \\
              "${base_url}/v1/mlb/model/version" || printf '000')
            if [ "$model_status" = "200" ]; then
              model_ok=true
            elif [ "$model_status" = "503" ]; then
              # HTTP 503 is an intentional application-level response while R7
              # has no promotion-qualified champion. It proves the read Lambda
              # is reachable only when the body satisfies the exact fail-closed
              # authority contract; arbitrary 503s remain capacity failures.
              if python - <<'PYMODEL'
          import json
          from pathlib import Path
          try:
              body = json.loads(Path('/tmp/mlb-capacity-model.json').read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          safe = (
              isinstance(body, dict)
              and body.get('ok') is False
              and body.get('status') == 'NO_QUALIFIED_CHAMPION'
              and body.get('publicationClosed') is True
              and body.get('productionSelectionAllowed') is False
              and body.get('qualifiedChampionRequired') is True
              and body.get('qualifiedChampionPresent') is False
              and body.get('r7ChampionQualified') is False
              and body.get('legacyFallbackAllowed') is False
              and body.get('retiredAuthoritySuppressed') is True
              and body.get('readOnly') is True
          )
          raise SystemExit(0 if safe else 1)
          PYMODEL
              then
                model_ok=true
                echo "Model route is reachable and safely fail-closed pending a qualified R7 champion."
              fi
            fi
'''
          if old not in source:
              if "model_status=$(curl --silent --show-error" in source and "NO_QUALIFIED_CHAMPION" in source:
                  print('Capacity validator already patched; nothing to do.')
              else:
                  raise SystemExit('Refusing ambiguous patch: exact old capacity-probe block not found')
          else:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          grep -q "model_status=\$(curl --silent --show-error" .github/workflows/deploy.yml
          grep -q "NO_QUALIFIED_CHAMPION" .github/workflows/deploy.yml

      - name: Commit repair to main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy.yml
          if git diff --cached --quiet; then
            echo 'Deploy capacity validator already repaired.'
            exit 0
          fi
          git commit -m 'Accept safe MLB R7 fail-closed response in capacity probe'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            test "$attempt" != 8 || exit 1
            sleep $((attempt * 2))
          done
