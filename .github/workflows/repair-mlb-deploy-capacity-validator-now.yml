name: Repair MLB deploy capacity validator now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-deploy-capacity-validator-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-deploy-capacity-validator
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair false shared-capacity failure
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          source = path.read_text(encoding='utf-8')
          old = '"${base_url}/v1/mlb/model/version" >/tmp/mlb-capacity-model.json'
          new = '"${base_url}/v1/health" >/tmp/mlb-capacity-model.json'
          if old in source:
              if source.count(old) != 1:
                  raise SystemExit(f'Refusing ambiguous repair: expected one target, found {source.count(old)}')
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
              print('Repaired capacity gate: capacity now uses the health route; model authority remains validated downstream.')
          elif new in source:
              print('Capacity gate is already repaired.')
          else:
              raise SystemExit('Expected shared-capacity model probe not found; refusing unsafe broad edit')
          PY
          git diff --check
          grep -q '"${base_url}/v1/health" >/tmp/mlb-capacity-model.json' .github/workflows/deploy.yml

      - name: Commit repair to main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy.yml
          if git diff --cached --quiet; then
            echo 'Deploy capacity validator already repaired.'
            exit 0
          fi
          git commit -m 'Fix MLB shared-capacity deploy gate'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            test "$attempt" != 8 || exit 1
            sleep $((attempt * 2))
          done
