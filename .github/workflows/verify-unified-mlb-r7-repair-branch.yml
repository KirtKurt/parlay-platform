name: Verify unified MLB R7 repair branch

"on":
  push:
    branches:
      - repair/unified-mlb-r7-settlement-owner-20260826

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
      - name: Verify unified recovery ownership and bounded settlement contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/invoke_mlb_trainer_with_retry.py \
            scripts/mlb_scoring_guard_status.py \
            scripts/reconcile_mlb_prospective_backlog_v4.py \
            scripts/reconcile_mlb_prospective_backlog_v5.py \
            scripts/verify_unified_mlb_learning_ownership.py
          python -m pytest -q \
            tests/unit/test_reconcile_mlb_prospective_backlog_v4.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5.py \
            tests/unit/test_mlb_prospective_backlog_workflow.py \
            tests/unit/test_unified_mlb_learning_ownership.py
          python scripts/verify_unified_mlb_learning_ownership.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          for name in (
              'unified-mlb-learning-recovery-once.yml',
              'mlb-prospective-settlement-date-recovery-once.yml',
              'mlb-prospective-backlog-reconcile-v5-once.yml',
          ):
              path = Path('.github/workflows') / name
              value = yaml.load(path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
              assert isinstance(value, dict), name
              assert isinstance(value.get('jobs'), dict), name
          PY
          git diff --check
