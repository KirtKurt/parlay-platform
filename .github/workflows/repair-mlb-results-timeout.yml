name: Repair MLB Results Timeout

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-results-timeout.yml'
      - 'template.yaml'

permissions:
  contents: write

concurrency:
  group: repair-mlb-results-timeout
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Patch durable results timeout
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('template.yaml')
          text = path.read_text(encoding='utf-8')
          old = '''  MLBResultsSchedulerFunction:
              Type: AWS::Serverless::Function
              Properties:
                CodeUri: hello_world/
                Handler: mlb_results_scheduler.lambda_handler
                EventInvokeConfig:
          '''.replace('              ', '')
          new = '''  MLBResultsSchedulerFunction:
              Type: AWS::Serverless::Function
              Properties:
                CodeUri: hello_world/
                Handler: mlb_results_scheduler.lambda_handler
                Timeout: 300
                MemorySize: 1536
                EventInvokeConfig:
          '''.replace('              ', '')
          if new in text:
              changed = False
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              changed = True
          else:
              raise SystemExit('MLBResultsSchedulerFunction contract block not found')
          print({'template_changed': changed})
          PY
          git diff --check

      - name: Validate contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest boto3 pyyaml
          python -m py_compile \
            hello_world/mlb_results_scheduler.py \
            hello_world/mlb_canonical_final_labels_v1.py \
            hello_world/mlb_ml_aws_training_v1_compat.py
          python -m pytest -q \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_trainer_table_wiring.py \
            tests/unit/test_mlb_shadow_authority_deploy_gate.py
          sam validate --lint --template-file template.yaml

      - name: Commit durable template repair to PR branch
        run: |
          set -euo pipefail
          if git diff --quiet -- template.yaml; then
            echo 'Template already contains the durable timeout repair.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template.yaml
          git commit -m 'Raise MLB results settlement timeout'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build and deploy repaired stack
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          BBS_API_KEY_VALUE: ${{ secrets.BBS_API_KEY }}
          INQSI_ADMIN_API_TOKEN_VALUE: ${{ secrets.INQSI_ADMIN_API_TOKEN }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY_VALUE:-}"
          test -n "${BBS_API_KEY_VALUE:-}"
          test -n "${INQSI_ADMIN_API_TOKEN_VALUE:-}"
          git_sha=$(git rev-parse HEAD)
          template_sha=$(sha256sum template.yaml | awk '{print $1}')
          deploy_run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sam build --no-cached --template-file template.yaml
          for attempt in $(seq 1 60); do
            status=$(aws cloudformation describe-stacks \
              --stack-name parlay-platform-dev \
              --region "$AWS_REGION_VALUE" \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo STACK_MISSING)
            case "$status" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE|IMPORT_ROLLBACK_COMPLETE|STACK_MISSING) break ;;
              *_IN_PROGRESS) sleep 15 ;;
              *) echo "Stack is not updateable: $status"; exit 1 ;;
            esac
          done
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name parlay-platform-dev \
            --region "$AWS_REGION_VALUE" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --force-upload \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              "BbsApiKey=${BBS_API_KEY_VALUE}" \
              "InqsiAdminApiToken=${INQSI_ADMIN_API_TOKEN_VALUE}" \
              "DeployGitSha=${git_sha}" \
              "DeployTemplateSha256=${template_sha}" \
              "DeployRunId=${deploy_run_id}"

      - name: Verify timeout and execute fresh settlement/training proof
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import boto3

          region = os.environ['AWS_REGION_VALUE']
          stack = 'parlay-platform-dev'
          cf = boto3.client('cloudformation', region_name=region)
          lam = boto3.client('lambda', region_name=region)

          def physical(logical_id: str) -> str:
              return cf.describe_stack_resource(
                  StackName=stack,
                  LogicalResourceId=logical_id,
              )['StackResourceDetail']['PhysicalResourceId']

          def invoke(function_name: str, payload: dict) -> dict:
              response = lam.invoke(
                  FunctionName=function_name,
                  InvocationType='RequestResponse',
                  Payload=json.dumps(payload).encode('utf-8'),
              )
              raw = response['Payload'].read().decode('utf-8', 'replace')
              try:
                  body = json.loads(raw or '{}')
              except Exception:
                  body = {'rawPayload': raw[:10000]}
              if isinstance(body, dict) and isinstance(body.get('body'), str):
                  try:
                      body = json.loads(body['body'])
                  except Exception:
                      pass
              return {
                  'statusCode': response.get('StatusCode'),
                  'functionError': response.get('FunctionError'),
                  'payload': body,
              }

          results_fn = physical('MLBResultsSchedulerFunction')
          trainer_fn = physical('MLBMLTrainingFunction')
          config = lam.get_function_configuration(FunctionName=results_fn)
          settlement = invoke(results_fn, {
              'sport': 'mlb',
              'slate_date_et': '2026-07-29',
              'fetch_scores': True,
              'store': True,
              'run': 'repair_timeout_fresh_settlement',
          })
          training = invoke(trainer_fn, {
              'sport': 'mlb',
              'mode': 'scheduled',
              'run': 'repair_timeout_fresh_training_recheck',
          })
          report = {
              'version': 'MLB-RESULTS-TIMEOUT-REPAIR-v1',
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'resultsFunction': results_fn,
              'resultsTimeoutSeconds': config.get('Timeout'),
              'resultsMemoryMb': config.get('MemorySize'),
              'settlement': settlement,
              'training': training,
              'stackStatus': cf.describe_stacks(StackName=stack)['Stacks'][0]['StackStatus'],
          }
          Path('runtime_reports/mlb_results_timeout_repair_latest.json').write_text(
              json.dumps(report, indent=2, sort_keys=True, default=str) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True, default=str))
          if config.get('Timeout') != 300:
              raise SystemExit('results timeout was not deployed')
          if settlement.get('functionError'):
              raise SystemExit('settlement Lambda still failed')
          if training.get('functionError'):
              raise SystemExit('trainer Lambda failed')
          PY

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-results-timeout-repair
          path: runtime_reports/mlb_results_timeout_repair_latest.json
          if-no-files-found: error
