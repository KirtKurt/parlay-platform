name: Trigger MLB root finalizer now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-mlb-root-finalizer-now.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repaired root finalizer on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run finalize-mlb-root-settlement-training-now.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo 'MLB root settlement and training finalizer dispatched.'
