name: Snapshot MLB regional failover run now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-mlb-regional-failover-run-now.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture current MLB deployment and continuity runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports /tmp/mlb-run-snapshot
          workflows=(
            deploy-mlb-auto-llm.yml
            diagnose-mlb-canonical-settlement-gap-now.yml
            deploy.yml
            mlb-prospective-backlog-reconcile-v5-once.yml
            repair-mlb-prospective-v5-now.yml
          )
          for workflow in "${workflows[@]}"; do
            safe=${workflow//[^A-Za-z0-9]/_}
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=10" \
              > "/tmp/mlb-run-snapshot/${safe}.json" || printf '%s\n' '{"workflow_runs":[]}' > "/tmp/mlb-run-snapshot/${safe}.json"
          done
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          workflows=(
              'deploy-mlb-auto-llm.yml',
              'diagnose-mlb-canonical-settlement-gap-now.yml',
              'deploy.yml',
              'mlb-prospective-backlog-reconcile-v5-once.yml',
              'repair-mlb-prospective-v5-now.yml',
          )

          def key(name: str) -> str:
              return ''.join(ch if ch.isalnum() else '_' for ch in name)

          def select(rows):
              return [
                  {
                      'id': row.get('id'),
                      'name': row.get('name'),
                      'headSha': row.get('head_sha'),
                      'headBranch': row.get('head_branch'),
                      'status': row.get('status'),
                      'conclusion': row.get('conclusion'),
                      'event': row.get('event'),
                      'createdAtUtc': row.get('created_at'),
                      'updatedAtUtc': row.get('updated_at'),
                      'runAttempt': row.get('run_attempt'),
                      'htmlUrl': row.get('html_url'),
                  }
                  for row in rows
              ]

          report={
              'proofType': 'MLB_ACTIVE_REPAIR_RUN_SNAPSHOT',
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'workflows': {},
          }
          for workflow in workflows:
              payload=json.loads(
                  Path('/tmp/mlb-run-snapshot', key(workflow) + '.json').read_text(
                      encoding='utf-8'
                  )
              )
              report['workflows'][workflow]=select(payload.get('workflow_runs') or [])

          Path('runtime_reports/mlb_regional_failover_runs_latest.json').write_text(
              json.dumps(report, indent=2, sort_keys=True)+'\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Publish run snapshot
        run: |
          set -euo pipefail
          cp runtime_reports/mlb_regional_failover_runs_latest.json /tmp/mlb_regional_failover_runs_latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mlb_regional_failover_runs_latest.json runtime_reports/mlb_regional_failover_runs_latest.json
            git add runtime_reports/mlb_regional_failover_runs_latest.json
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB active repair run snapshot [skip ci]'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
