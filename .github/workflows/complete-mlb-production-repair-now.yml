name: Complete MLB production repair now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-mlb-production-repair-now.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-mlb-production-repair-now
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Keep both repair tracks running until their durable proofs pass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mlb-completion
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          touch_workflow() {
            local path="$1"
            local marker="$2"
            local message="$3"
            git fetch origin main
            git reset --hard origin/main
            python - "$path" "$marker" <<'PY'
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path(sys.argv[1])
          marker=sys.argv[2]
          text=path.read_text(encoding='utf-8')
          lines=[line for line in text.splitlines() if not line.startswith(marker)]
          lines.append(marker + datetime.now(timezone.utc).isoformat())
          path.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
            git add "$path"
            git commit -m "$message"
            for attempt in 1 2 3 4 5 6; do
              if git push origin HEAD:main; then
                return 0
              fi
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 2))
            done
            return 1
          }

          # Ensure both canonical workflows have a fresh run after all repair
          # source changes. These are repository pushes, not blocked dispatches.
          for wait_attempt in $(seq 1 60); do
            git fetch origin main
            git reset --hard origin/main
            if grep -q 'def _invoke_titan_text' mlb_auto_llm/model_gateway.py \
              && grep -q 'amazon.titan-text-lite-v1' mlb_auto_llm/model_gateway.py; then
              break
            fi
            if [ "$wait_attempt" -eq 60 ]; then
              echo '::error::Native Titan recovery did not reach main'
              exit 1
            fi
            sleep 10
          done

          touch_workflow \
            '.github/workflows/deploy-mlb-auto-llm.yml' \
            '# completion-controller-deploy: ' \
            'Run canonical MLB isolated deployment for completion'
          touch_workflow \
            '.github/workflows/finalize-mlb-root-settlement-training-now.yml' \
            '# completion-controller-finalizer: ' \
            'Run canonical MLB settlement and training finalizer for completion'

          completed=false
          for poll in $(seq 1 90); do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY' > /tmp/mlb-completion/state.json
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def load(name):
              path=Path('runtime_reports')/name
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  return {'parseError': f'{type(exc).__name__}:{exc}'}

          deploy=load('mlb_auto_llm_deploy_latest.json')
          root=load('mlb_root_settlement_training_finalization_latest.json')
          trainer=load('mlb_trainer_deploy_health_diagnostic_latest.json')

          def nested(value, *keys):
              current=value
              for key in keys:
                  if not isinstance(current, dict):
                      return None
                  current=current.get(key)
              return current

          deploy_ok=bool(
              isinstance(deploy,dict)
              and deploy.get('ok') is True
              and str(deploy.get('jobStatus') or '').lower() in {'success','passed','pass'}
          )
          # The deployment proof may use either direct fields or nested smoke
          # records. Require a nonempty successful Bedrock response whenever
          # those fields are present.
          bedrock_candidates=[
              nested(deploy,'bedrockSmoke','ok'),
              nested(deploy,'bedrock','ok'),
              nested(deploy,'smoke','ok'),
          ]
          present=[value for value in bedrock_candidates if value is not None]
          if present:
              deploy_ok = deploy_ok and all(value is True for value in present)

          root_ok=bool(isinstance(root,dict) and root.get('ok') is True)
          accepted=0
          processed=''
          blocked=None
          live_authority=False
          if isinstance(root,dict):
              accepted=int(
                  root.get('acceptedRowCount')
                  or nested(root,'trainingHealth','acceptedRowCount')
                  or nested(root,'trainerStatus','acceptedRowCount')
                  or 0
              )
              processed=str(
                  root.get('processedThroughSlateDate')
                  or nested(root,'canonicalSlateContinuity','processedThroughSlateDate')
                  or nested(root,'trainingHealth','canonicalSlateContinuity','processedThroughSlateDate')
                  or ''
              )
              blocked=(
                  root.get('blockedSlateDate')
                  or nested(root,'canonicalSlateContinuity','blockedSlateDate')
                  or nested(root,'trainingHealth','canonicalSlateContinuity','blockedSlateDate')
              )
              live_authority=bool(
                  root.get('liveInferenceAuthority')
                  or nested(root,'trainingHealth','liveInferenceAuthority')
              )
          root_ok = bool(
              root_ok
              and accepted > 0
              and processed >= '2026-08-23'
              and not blocked
              and live_authority is False
          )

          state={
              'checkedAtUtc': datetime.now(timezone.utc).isoformat(),
              'deployOk': deploy_ok,
              'rootContinuityAndTrainingOk': root_ok,
              'acceptedRowCount': accepted,
              'processedThroughSlateDate': processed or None,
              'blockedSlateDate': blocked,
              'liveInferenceAuthority': live_authority,
              'deployProof': deploy,
              'rootProof': root,
              'trainerDiagnostic': trainer,
          }
          state['ok']=bool(deploy_ok and root_ok)
          print(json.dumps(state, indent=2, sort_keys=True, default=str))
          PY
            if python - <<'PY'
          import json
          state=json.load(open('/tmp/mlb-completion/state.json'))
          raise SystemExit(0 if state.get('ok') is True else 1)
          PY
            then
              completed=true
              break
            fi
            sleep 60
          done

          cp /tmp/mlb-completion/state.json /tmp/mlb-completion/final.json
          if [ "$completed" != true ]; then
            echo '::error::MLB production repair did not reach both durable PASS proofs before timeout'
          fi

      - name: Publish completion controller proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path=Path('/tmp/mlb-completion/final.json')
          if path.exists():
              report=json.loads(path.read_text(encoding='utf-8'))
          else:
              report={'ok':False,'error':'COMPLETION_STATE_MISSING'}
          report.update({
              'proofType':'MLB_PRODUCTION_REPAIR_COMPLETION',
              'publishedAtUtc':datetime.now(timezone.utc).isoformat(),
              'directTableWrite':False,
              'retroactivePredictionCreation':False,
              'immutablePredictionRewrite':False,
              'marketConsensusAuthorityAllowed':False,
              'secretExposed':False,
          })
          Path('/tmp/mlb_repair_completion_latest.json').write_text(
              json.dumps(report,indent=2,sort_keys=True,default=str)+'\n',
              encoding='utf-8',
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mlb_repair_completion_latest.json runtime_reports/mlb_repair_completion_latest.json
            git add runtime_reports/mlb_repair_completion_latest.json
            git diff --cached --quiet || git commit -m 'Publish MLB production repair completion proof [skip ci]'
            git push origin HEAD:main && break
            sleep $((attempt * 2))
          done

          python - <<'PY'
          import json
          report=json.load(open('/tmp/mlb_repair_completion_latest.json'))
          assert report.get('ok') is True, report
          print('MLB production repair completion: PASS')
          PY
