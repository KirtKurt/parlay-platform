name: R7 PR601 production fix once

on:
  push:
    branches:
      - codex/mlb-valid-prelock-quarantine-v4-567
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused verification runtime
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
      - name: Apply invariant-safe production repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one replacement target, found {count}'
                  )
              target.write_text(text.replace(old, new, 1))

          def remove_exact(path: str, block: str, expected_count: int) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(block)
              if count != expected_count:
                  raise SystemExit(
                      f'{path}: expected {expected_count} removable blocks, found {count}'
                  )
              target.write_text(text.replace(block, ''))

          replace_once(
              'hello_world/mlb_slate_coverage_patch.py',
              '''    if (
                  not expected_official_pk
                  or str(item.get("officialGamePk") or "") != expected_official_pk
              ):
                  errors.append("terminal_manifest_official_game_pk_mismatch")
          ''',
              '''    # Legacy provider-only manifests predate official gamePk
              # enrichment. They remain immutable identity/start/team authority;
              # compare gamePk strictly whenever the roster actually asserts it.
              if (
                  expected_official_pk
                  and str(item.get("officialGamePk") or "") != expected_official_pk
              ):
                  errors.append("terminal_manifest_official_game_pk_mismatch")
          ''',
          )

          replace_once(
              'hello_world/mlb_daily_per_game_lock_patch.py',
              '''    """Return trusted immutable identities that may name this game.

              The official Stats API game PK remains stable when a provider event ID
              arrives later. Alias lookup is read-only discovery; downstream validation
              still requires official-PK/team/time/source/fingerprint agreement.
              """
              aliases = {_raw_game_identity(game)}
              official_pk = _official_game_pk(game)
              if official_pk:
                  aliases.add(f"mlb_statsapi:{official_pk}")
              for pull in scoring or []:
                  for candidate_game in pull.get("games") or []:
                      if not _same_game(game, candidate_game):
                          continue
                      aliases.add(_raw_game_identity(candidate_game))
                      candidate_pk = _official_game_pk(candidate_game)
                      if candidate_pk:
                          aliases.add(f"mlb_statsapi:{candidate_pk}")
              return sorted(alias for alias in aliases if alias)
          ''',
              '''    """Return persisted identities that may name this game.

              Query only identities represented by the manifest game or an observed
              scoring pull. The official game PK still binds every candidate during
              downstream validation, but it is not synthesized into an extra DynamoDB
              prefix without evidence that such a snapshot identity was persisted.
              """
              aliases = {_raw_game_identity(game)}
              for pull in scoring or []:
                  for candidate_game in pull.get("games") or []:
                      if not _same_game(game, candidate_game):
                          continue
                      aliases.add(_raw_game_identity(candidate_game))
              return sorted(alias for alias in aliases if alias)
          ''',
          )

          replace_once(
              'tests/unit/test_mlb_cooperative_terminal_chunk.py',
              '''    # root + stable Stats API fallback + three provider aliases = five.
              # The stable fallback is required to discover snapshots persisted before
              # a later provider-event identity became available.
              token = real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.set(5)
              try:
                  real_patch._candidate_items(object(), SLATE, game, scoring[:3])
              finally:
                  real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.reset(
                      token
                  )
              assert len(calls) == 5
          ''',
              '''    token = real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.set(4)
              try:
                  real_patch._candidate_items(object(), SLATE, game, scoring[:3])
              finally:
                  real_patch._COOPERATIVE_TERMINAL_CANDIDATE_ALIAS_LIMIT.reset(
                      token
                  )
              assert len(calls) == 4
          ''',
          )

          remove_exact(
              'tests/unit/test_mlb_public_per_game_authority.py',
              '''def _install_exact_public_terminal_manifest_fixture(monkeypatch):
              games = []
              for source in (G1, G2):
                  row = copy.deepcopy(source)
                  row["official_game_pk"] = source["officialGamePk"]
                  row["official_game_id"] = f"mlb_statsapi:{source['officialGamePk']}"
                  row["canonical_start_time_source"] = "MLB_STATS_API_EXACT_DATE"
                  games.append(row)
              # The terminal fixtures were written against the immutable legacy provider
              # manifest. Keep that exact pointer/fingerprint while independently supplying
              # the resolved official roster. This tests lifecycle projection without
              # weakening provider-manifest or official-game-PK validation.
              manifest = PULLS[0]["provider_schedule_manifest"]
              binding = PULLS[0]["provider_manifest_binding"]
              authority = _fallback_manifest_authority()
              authority.update({
                  "providerManifestFingerprint": manifest["fingerprint"],
                  "providerManifestPk": binding["pk"],
                  "providerManifestSk": binding["sk"],
                  "verifiedFullSlateGameCount": len(games),
                  "officialScheduleGameCount": len(games),
              })
              monkeypatch.setattr(
                  coverage,
                  "_provider_manifest_for_public",
                  lambda module, lock_module, pulls, slate: (
                      copy.deepcopy(games),
                      copy.deepcopy(authority),
                  ),
              )


          ''',
              1,
          )
          remove_exact(
              'tests/unit/test_mlb_public_per_game_authority.py',
              '    _install_exact_public_terminal_manifest_fixture(monkeypatch)\n',
              2,
          )
          PY
          git diff --check
      - name: Compile changed production modules
        run: |
          python -m py_compile \
            hello_world/mlb_slate_coverage_patch.py \
            hello_world/mlb_daily_per_game_lock_patch.py \
            hello_world/mlb_canonical_final_labels_v1.py
      - name: Verify the five previously failing contracts
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: hello_world:tests/unit
        run: |
          python -m pytest -q \
            tests/unit/test_mlb_canonical_final_labels_v1.py::test_final_label_validation_rejects_same_count_official_pk_swap \
            'tests/unit/test_mlb_canonical_final_labels_v1.py::test_final_label_terminal_requires_unique_official_roster_membership[outside_roster]' \
            tests/unit/test_mlb_cooperative_terminal_chunk.py::test_candidate_alias_queries_are_capped_before_any_query \
            tests/unit/test_mlb_public_per_game_authority.py::test_terminal_no_prediction_status_displays_without_current_prediction_row \
            tests/unit/test_mlb_public_per_game_authority.py::test_valid_quarantine_terminal_is_lifecycle_only_on_public_surface
      - name: Verify full affected contract files
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: hello_world:tests/unit
        run: |
          python -m pytest -q \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_cooperative_terminal_chunk.py \
            tests/unit/test_mlb_public_per_game_authority.py
      - name: Commit repaired production behavior
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hello_world/mlb_slate_coverage_patch.py \
            hello_world/mlb_daily_per_game_lock_patch.py \
            tests/unit/test_mlb_cooperative_terminal_chunk.py \
            tests/unit/test_mlb_public_per_game_authority.py
          git diff --cached --quiet && {
            echo 'No production repair diff was produced' >&2
            exit 1
          }
          git commit -m 'Fix R7 terminal manifest binding and alias bounds'
          git push origin HEAD:codex/mlb-valid-prelock-quarantine-v4-567
