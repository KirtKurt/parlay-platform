# 2026-08-27: trigger verified v4.3 terminal-durability recovery after PR #587.
name: Trigger current-source MLB R7 terminal recovery now

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-mlb-r7-terminal-recovery-now.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: trigger-current-source-mlb-r7-terminal-recovery
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the exact-source deploy, reconcile, and train workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run repair-mlb-training-continuity-now.yml \
            --repo "$REPOSITORY" \
            --ref main

          for attempt in $(seq 1 30); do
            run_json=$(gh run list \
              --repo "$REPOSITORY" \
              --workflow repair-mlb-training-continuity-now.yml \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId,headSha,status,conclusion,url,createdAt)
            run_id=$(python -c 'import json,sys; rows=json.load(sys.stdin); print(rows[0]["databaseId"] if rows else "")' <<<"$run_json")
            if [ -n "$run_id" ]; then
              echo "Current-source MLB R7 recovery dispatched as workflow run $run_id"
              echo "$run_json"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The MLB R7 recovery dispatch was not observable"
          exit 1
