name: Inspect Tennis Deploy Runs 2026-08-04 0457

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tennis-deploy-runs-20260804-0457.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish recent deploy workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/actions/workflows/deploy-tennis-learning.yml/runs?per_page=10" > /tmp/tennis-deploy-runs-raw.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          raw = json.loads(Path('/tmp/tennis-deploy-runs-raw.json').read_text())
          runs = []
          for item in raw.get('workflow_runs', []):
              runs.append({
                  'id': item.get('id'),
                  'status': item.get('status'),
                  'conclusion': item.get('conclusion'),
                  'event': item.get('event'),
                  'head_sha': item.get('head_sha'),
                  'created_at': item.get('created_at'),
                  'updated_at': item.get('updated_at'),
                  'run_started_at': item.get('run_started_at'),
                  'html_url': item.get('html_url'),
              })
          payload = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'workflow': 'Deploy Tennis Learning',
              'runs': runs,
          }
          Path('/tmp/tennis_deploy_runs.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p runtime
            cp /tmp/tennis_deploy_runs.json runtime/tennis_deploy_runs.json
            git rm -f .github/workflows/inspect-tennis-deploy-runs-20260804-0457.yml
            git add runtime/tennis_deploy_runs.json
            git commit -m 'Publish tennis deployment run evidence [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
