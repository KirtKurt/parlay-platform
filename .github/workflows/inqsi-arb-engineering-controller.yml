name: Inqsi ARB Autonomous Engineering Controller

on:
  schedule:
    - cron: '3,23,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'inqsi-arb/ops/engineering_controller.py'
      - 'inqsi-arb/ops/codex_cli_runner.sh'
      - 'inqsi-arb/tests/test_engineering_controller.py'
      - 'inqsi-arb/tests/test_codex_cli_runner_contract.py'
      - 'inqsi-arb/ARB_ENGINEERING_CONTROLLER.md'
      - 'arb_supervisor/**'
      - '.github/workflows/arb-supervisor-validate.yml'
      - '.github/workflows/inqsi-arb-deploy.yml'
      - '.github/workflows/inqsi-arb-engineering-controller.yml'

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: inqsi-arb-autonomous-engineering-controller
  cancel-in-progress: false

env:
  ARB_AEC_MAX_ACTIONS: '1'
  ARB_AEC_ALLOW_DISPATCH: 'true'
  ARB_AEC_ALLOW_ISSUE: 'true'
  ARB_AEC_PAUSED: ${{ vars.ARB_AEC_PAUSED || 'false' }}
  ARB_AEC_AUTO_PROMOTE: ${{ vars.ARB_AEC_AUTO_PROMOTE || 'false' }}
  ARB_AEC_AUTO_DEPLOY: ${{ vars.ARB_AEC_AUTO_DEPLOY || 'false' }}
  ARB_CODE_AGENT_MODEL: 'codex-cli-default'
  ARB_CODE_AGENT_COMMAND: 'bash inqsi-arb/ops/codex_cli_runner.sh'

jobs:
  inspect-decide-act:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/setup-sam@v2
      - name: Install controller and Codex runtime
        run: |
          python -m pip install --quiet "pytest>=8,<9" boto3
          npm install --global @openai/codex@0.154.0
          codex --version
      - name: Prepare and prove the Linux sandbox
        shell: bash
        run: |
          set -euo pipefail
          # Use the distribution helper and its scoped user-namespace profile.
          # Do not disable AppArmor globally or run Codex without a sandbox.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          PROFILE=/etc/apparmor.d/bwrap-userns-restrict
          EXTRA=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$EXTRA" ]; then
            sudo install -m 0644 "$EXTRA" "$PROFILE"
          fi
          if [ -f "$PROFILE" ]; then
            sudo apparmor_parser -r "$PROFILE"
          fi
          command -v bwrap
          bwrap --version
          # Reproduce the namespace/loopback setup before spending model tokens.
          bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev --die-with-parent -- /bin/true
          echo 'ARB sandbox namespace preflight passed'
      - name: Configure ephemeral Codex home
        run: |
          set -euo pipefail
          echo "CODEX_HOME=${RUNNER_TEMP}/inqsi-arb-codex" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/inqsi-arb-codex"
          chmod 700 "${RUNNER_TEMP}/inqsi-arb-codex"
      - name: Authenticate Codex CLI for this ephemeral runner
        env:
          OPENAI_API_KEY: ${{ secrets.Inqsi_ARB_Autonomous_Coding_Agent }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
          codex login status >/dev/null 2>&1
          echo 'Codex API-key authentication configured'
      - name: Prove controller and trusted supervisor guardrails before acting
        run: |
          python -m pytest -q inqsi-arb/tests/test_engineering_controller.py inqsi-arb/tests/test_codex_cli_runner_contract.py
          python -m pytest -q arb_supervisor/test_validate_candidate.py arb_supervisor/test_promote.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Resolve isolated production endpoints
        id: endpoints
        shell: bash
        run: |
          set -euo pipefail
          API_URL=$(aws cloudformation describe-stacks --stack-name inqsi-arb-prod --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='ArbApiUrl'].OutputValue" --output text)
          SPORTSBOOK_URL=$(aws cloudformation describe-stacks --stack-name inqsi-arb-sportsbook-catalog-prod --region "${{ secrets.AWS_REGION }}" --query "Stacks[0].Outputs[?OutputKey=='SportsbooksUrl'].OutputValue" --output text 2>/dev/null || true)
          test -n "$API_URL" && test "$API_URL" != "None"
          echo "api_url=${API_URL%/}" >> "$GITHUB_OUTPUT"
          echo "sportsbook_url=$SPORTSBOOK_URL" >> "$GITHUB_OUTPUT"
      - name: Inspect, prioritize and execute one bounded engineering action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.Inqsi_ARB_Autonomous_Coding_Agent }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          python inqsi-arb/ops/engineering_controller.py \
            --repository "$GITHUB_REPOSITORY" \
            --api-url '${{ steps.endpoints.outputs.api_url }}' \
            --sportsbook-url '${{ steps.endpoints.outputs.sportsbook_url }}' \
            --output arb-engineering-controller-report.json
      - name: Remove ephemeral Codex credentials
        if: always()
        run: |
          if [ -n "${CODEX_HOME:-}" ]; then
            codex logout >/dev/null 2>&1 || true
            rm -f -- "$CODEX_HOME/auth.json"
          fi
      - name: Upload immutable controller evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inqsi-arb-engineering-controller-${{ github.run_id }}
          path: arb-engineering-controller-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Controller summary
        if: always()
        shell: bash
        run: |
          if [ -f arb-engineering-controller-report.json ]; then
            python - <<'PY'
          import json
          with open('arb-engineering-controller-report.json', encoding='utf-8') as f:
              r=json.load(f)
          s=r.get('snapshot', {})
          print('### Inqsi ARB Autonomous Engineering Controller')
          print(f"- Controller: `{r.get('controller')}`")
          print(f"- Main: `{s.get('main_sha')}`")
          print(f"- Production healthy: `{s.get('production_ok')}`")
          print(f"- Active sports: `{s.get('active_sports')}`")
          print(f"- Sportsbooks observed: `{s.get('sportsbook_count')}`")
          print(f"- Deploy conclusion: `{s.get('deploy_conclusion')}`")
          print(f"- Latency proof conclusion: `{s.get('latency_conclusion')}`")
          print(f"- Code agent configured: `{s.get('code_agent_configured')}`")
          print(f"- Auto promote: `{__import__('os').environ.get('ARB_AEC_AUTO_PROMOTE')}`")
          print(f"- Auto deploy: `{__import__('os').environ.get('ARB_AEC_AUTO_DEPLOY')}`")
          print(f"- Planned actions: `{len(r.get('actions', []))}`")
          PY
          fi
