name: MLB Historical Publisher Repair Once

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-publisher-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mlb-historical-publisher-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch durable evidence publication retry
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/mlb-historical-v7-recovery.yml')
          repair_path = Path('.github/workflows/mlb-historical-publisher-repair-once.yml')
          text = workflow_path.read_text()
          old = """          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git add runtime_reports/mlb_historical_v7_recovery_latest.json
          git commit -m 'Publish MLB historical V7 recovery evidence' || exit 0
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
"""
          new = """          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp runtime_reports/mlb_historical_v7_recovery_latest.json /tmp/mlb-historical-v7-recovery-latest.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B historical-v7-evidence origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-historical-v7-recovery-latest.json runtime_reports/mlb_historical_v7_recovery_latest.json
            git add runtime_reports/mlb_historical_v7_recovery_latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish MLB historical V7 recovery evidence'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo '::error::Unable to publish MLB historical V7 recovery evidence after bounded retries'
          exit 1
"""
          assert text.count(old) == 1, 'unexpected historical V7 publisher block'
          text = text.replace(old, new, 1)
          assert 'git checkout -B historical-v7-evidence origin/main' in text
          assert 'git pull --rebase origin main' not in text
          workflow_path.write_text(text)
          repair_path.unlink()
          PY
          git diff --check
          grep -Fq 'git checkout -B historical-v7-evidence origin/main' .github/workflows/mlb-historical-v7-recovery.yml
          grep -Fq 'Unable to publish MLB historical V7 recovery evidence after bounded retries' .github/workflows/mlb-historical-v7-recovery.yml
          test ! -e .github/workflows/mlb-historical-publisher-repair-once.yml

      - name: Publish repaired workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/mlb-historical-v7-recovery.yml .github/workflows/mlb-historical-publisher-repair-once.yml
          git commit -m 'Harden MLB historical recovery evidence publishing'
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Dispatch repaired historical recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/mlb-historical-v7-recovery.yml/dispatches" \
            -f ref=main
