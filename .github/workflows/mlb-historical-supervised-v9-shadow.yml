name: MLB Historical V7 Selective and V9 Shadow Evaluation

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_historical_supervised_v9.py'
      - 'hello_world/mlb_historical_supervised_v9_integrity_v2.py'
      - 'hello_world/mlb_historical_v7_*.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'scripts/run_mlb_historical_supervised_v9_shadow*.py'
      - 'scripts/resolve_mlb_historical_artifacts_bucket.py'
      - 'scripts/validate_mlb_v9_shadow_workflow.py'
      - 'tests/unit/test_mlb_historical_supervised_v9*.py'
      - 'tests/unit/test_run_mlb_historical_supervised_v9_shadow*.py'
      - 'tests/unit/test_resolve_mlb_historical_artifacts_bucket.py'
      - 'tests/unit/test_mlb_historical_v7_*.py'
      - 'tests/unit/test_mlb_v7_v9_workflow_recovery_contract.py'
      - '.github/workflows/mlb-historical-supervised-v9-shadow.yml'
      - 'mlb_historical_optimizer/template.yaml'
  pull_request:
    paths:
      - 'hello_world/mlb_historical_supervised_v9.py'
      - 'hello_world/mlb_historical_supervised_v9_integrity_v2.py'
      - 'hello_world/mlb_historical_v7_*.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'scripts/run_mlb_historical_supervised_v9_shadow*.py'
      - 'scripts/resolve_mlb_historical_artifacts_bucket.py'
      - 'scripts/validate_mlb_v9_shadow_workflow.py'
      - 'tests/unit/test_mlb_historical_supervised_v9*.py'
      - 'tests/unit/test_run_mlb_historical_supervised_v9_shadow*.py'
      - 'tests/unit/test_resolve_mlb_historical_artifacts_bucket.py'
      - 'tests/unit/test_mlb_historical_v7_*.py'
      - 'tests/unit/test_mlb_v7_v9_workflow_recovery_contract.py'
      - '.github/workflows/mlb-historical-supervised-v9-shadow.yml'
      - 'mlb_historical_optimizer/template.yaml'

permissions:
  contents: write

concurrency:
  group: mlb-historical-v7-v9-shadow-${{ github.ref }}
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_historical_supervised_v9_shadow_latest.json
  HANDOFF_PATH: runtime_reports/mlb_historical_supervised_v9_candidate_handoff_latest.json
  VALIDATION_PATH: /tmp/mlb-v9-validation.json
  MLB_V7_SHADOW_REFIT_INCREMENT_GAMES: '50'
  MLB_V7_LIGHTWEIGHT_INCREMENT_GAMES: '25'
  PYTHONPATH: hello_world:scripts
  PYTHONUNBUFFERED: '1'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Preserve previous evidence and clear stale outputs
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p runtime_reports
          git show origin/main:"$REPORT_PATH" > /tmp/mlb-supervised-v9-previous.json 2>/dev/null || printf '{}\n' > /tmp/mlb-supervised-v9-previous.json
          rm -f "$REPORT_PATH" "$HANDOFF_PATH" "$VALIDATION_PATH"

      - name: Validate V9 implementation with durable diagnostics
        id: validation
        continue-on-error: true
        env:
          MLB_V9_VALIDATION_EVIDENCE: ${{ env.VALIDATION_PATH }}
        run: |
          set -uo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python scripts/validate_mlb_v9_shadow_workflow.py 2>&1 | tee /tmp/mlb-v9-validation.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Resolve immutable historical evidence
        id: runtime
        if: steps.validation.outcome == 'success'
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -uo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import boto3
          from resolve_mlb_historical_artifacts_bucket import resolve_bucket

          region=os.environ['AWS_REGION_VALUE']
          stack=os.environ['STACK_NAME']
          cf=boto3.client('cloudformation',region_name=region)
          lam=boto3.client('lambda',region_name=region)
          s3=boto3.client('s3',region_name=region)
          attempts=[]
          outputs={}
          try:
              stacks=cf.describe_stacks(StackName=stack).get('Stacks') or []
              outputs={str(x.get('OutputKey')):str(x.get('OutputValue')) for x in (stacks[0].get('Outputs') or [])} if stacks else {}
              attempts.append({'strategy':'cloudformation_output','outputKeys':sorted(outputs)})
          except Exception as exc:
              attempts.append({'strategy':'cloudformation_output','error':f'{type(exc).__name__}:{exc}'})

          expected='mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler'
          function_name=str(outputs.get('HistoricalOptimizerFunctionName') or '').strip()
          if not function_name:
              matches=[]
              for page in lam.get_paginator('list_functions').paginate():
                  for item in page.get('Functions') or []:
                      if item.get('Handler') == expected and item.get('FunctionName'):
                          matches.append(str(item['FunctionName']))
              matches=sorted(set(matches))
              attempts.append({'strategy':'lambda_handler_scan','matches':matches})
              if len(matches) == 1:
                  function_name=matches[0]
              elif len(matches) > 1:
                  qualified=[]
                  for name in matches:
                      cfg=lam.get_function_configuration(FunctionName=name)
                      env=((cfg.get('Environment') or {}).get('Variables') or {})
                      if env.get('MLB_HISTORICAL_RANGE_EXTENSION_AUTHORIZED') == 'true' and env.get('MLB_HISTORICAL_ARTIFACTS_BUCKET'):
                          qualified.append(name)
                  qualified=sorted(set(qualified))
                  attempts.append({'strategy':'lambda_environment_filter','matches':qualified})
                  if len(qualified) == 1:
                      function_name=qualified[0]
          if not function_name:
              raise RuntimeError('historical optimizer Lambda could not be resolved uniquely')

          config=lam.get_function_configuration(FunctionName=function_name)
          if config.get('Handler') != expected:
              raise RuntimeError(f"unexpected optimizer handler:{config.get('Handler')}")
          environment=((config.get('Environment') or {}).get('Variables') or {})
          bucket_name=str(environment.get('MLB_HISTORICAL_ARTIFACTS_BUCKET') or outputs.get('HistoricalArtifactsBucketName') or '').strip()
          bucket_resolution=None
          if not bucket_name:
              bucket_resolution=resolve_bucket(explicit=None,cloudformation=cf,lambda_client=lam,s3=s3,stack_name=stack)
              if not bucket_resolution.get('ok'):
                  raise RuntimeError('historical artifacts bucket unresolved:'+json.dumps(bucket_resolution,sort_keys=True))
              bucket_name=str(bucket_resolution['bucketName'])
          s3.head_bucket(Bucket=bucket_name)
          proof={'ok':True,'functionName':function_name,'bucketName':bucket_name,'handler':config.get('Handler'),'attempts':attempts,'bucketResolution':bucket_resolution,'blockers':[]}
          Path('/tmp/mlb-v7-v9-runtime-resolution.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"function_name={function_name}\n")
              handle.write(f"bucket_name={bucket_name}\n")
              handle.write('resolved=true\n')
          PY
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if test "$status" -ne 0; then echo "resolved=false" >> "$GITHUB_OUTPUT"; fi
          exit "$status"

      - name: Run gated AWS-backed read-only V9 evaluation
        id: evaluation
        if: steps.validation.outcome == 'success' && steps.runtime.outputs.resolved == 'true'
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          TARGET_SNAPSHOTS_TABLE: parlay_platform_snapshots
          SNAPSHOTS_TABLE: parlay_platform_snapshots
          MLB_HISTORICAL_ARTIFACTS_BUCKET: ${{ steps.runtime.outputs.bucket_name }}
          MLB_HISTORICAL_START_DATE: '2025-04-01'
          MLB_HISTORICAL_END_DATE: '2026-12-31'
          MLB_HISTORICAL_MAX_CANDIDATES: '100'
          MLB_HISTORICAL_MAX_OPTIMIZATION_ROUNDS: '24'
          MLB_SUPERVISED_EPOCHS: '160'
          MLB_V7_FORCE_SHADOW_REFIT: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          set -uo pipefail
          python scripts/run_mlb_historical_supervised_v9_shadow_v2.py \
            --output "$REPORT_PATH" \
            --previous-report /tmp/mlb-supervised-v9-previous.json \
            --handoff-output "$HANDOFF_PATH" 2>&1 | tee /tmp/mlb-supervised-v9-shadow.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure fresh durable V9 evidence exists
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
          RUNTIME_RESOLVED: ${{ steps.runtime.outputs.resolved }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          RUNTIME_EXIT_CODE: ${{ steps.runtime.outputs.exit_code }}
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          EVALUATION_EXIT_CODE: ${{ steps.evaluation.outputs.exit_code }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              p=Path(path)
              if not p.exists() or not p.stat().st_size: return {}
              try: return json.loads(p.read_text())
              except Exception as exc: return {'ok':False,'parseError':str(exc)}

          report_path=Path(os.environ['REPORT_PATH'])
          current=load(report_path)
          fresh=(str(current.get('runId')) == str(os.environ.get('GITHUB_RUN_ID')) and current.get('sourceSha') == os.environ.get('GITHUB_SHA'))
          if fresh:
              raise SystemExit(0)

          validation=load(os.environ['VALIDATION_PATH'])
          resolution=load('/tmp/mlb-v7-v9-runtime-resolution.json')
          validation_ok=os.environ.get('VALIDATION_OUTCOME') == 'success'
          runtime_ok=os.environ.get('RUNTIME_RESOLVED') == 'true'
          evaluation_outcome=os.environ.get('EVALUATION_OUTCOME')
          if not validation_ok:
              blocker='v7_v9_validation_failed'; stage='V7_V9_VALIDATION'
          elif not runtime_ok:
              blocker='v7_v9_runtime_resolution_failed'; stage='V7_V9_RUNTIME_RESOLUTION'
          elif evaluation_outcome == 'cancelled':
              blocker='v7_v9_evaluation_cancelled'; stage='V7_V9_EVALUATION_CANCELLED'
          else:
              blocker='v7_v9_evaluation_failed_before_report_write'; stage='V7_V9_EVALUATION_BEFORE_REPORT_WRITE'
          log=Path('/tmp/mlb-supervised-v9-shadow.log').read_text(errors='replace')[-12000:] if Path('/tmp/mlb-supervised-v9-shadow.log').exists() else ''
          report={
              'ok':False,
              'proofType':'MLB_HISTORICAL_V7_V9_SHADOW_EVALUATION',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'readOnly':True,
              'retrospectiveShadowOnly':True,
              'prospectiveAuditRequiredBeforePromotion':True,
              'providerCallsMade':0,
              'productionAuthorityChanged':False,
              'historicalChampionWritten':False,
              'productionCutoverWritten':False,
              'promotionAuthority':False,
              'previousReportPreservedSeparately':True,
              'stalledStage':stage,
              'validationEvidence':validation,
              'runtimeResolution':resolution,
              'workflowSteps':{
                  'validation':{'outcome':os.environ.get('VALIDATION_OUTCOME'),'exitCode':os.environ.get('VALIDATION_EXIT_CODE')},
                  'runtime':{'outcome':os.environ.get('RUNTIME_OUTCOME'),'exitCode':os.environ.get('RUNTIME_EXIT_CODE'),'resolved':runtime_ok},
                  'evaluation':{'outcome':evaluation_outcome,'exitCode':os.environ.get('EVALUATION_EXIT_CODE')},
              },
              'errorLogTail':log,
              'blockers':[blocker],
          }
          report_path.parent.mkdir(parents=True,exist_ok=True)
          report_path.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          python -m json.tool "$REPORT_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-historical-v7-v9-${{ github.run_id }}
          path: |
            runtime_reports/mlb_historical_supervised_v9_shadow_latest.json
            runtime_reports/mlb_historical_supervised_v9_candidate_handoff_latest.json
            /tmp/mlb-v9-validation.json
            /tmp/mlb-v9-validation.log
            /tmp/mlb-supervised-v9-previous.json
            /tmp/mlb-supervised-v9-shadow.log
            /tmp/mlb-v7-v9-runtime-resolution.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable evidence from main-only runs
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$REPORT_PATH" /tmp/mlb-supervised-v9-report.json
          test ! -f "$HANDOFF_PATH" || cp "$HANDOFF_PATH" /tmp/mlb-supervised-v9-handoff.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-supervised-v9-proof origin/main
            git reset --hard origin/main
            git clean -fd
            mkdir -p runtime_reports
            cp /tmp/mlb-supervised-v9-report.json "$REPORT_PATH"
            test ! -f /tmp/mlb-supervised-v9-handoff.json || cp /tmp/mlb-supervised-v9-handoff.json "$HANDOFF_PATH"
            git add runtime_reports/
            git diff --cached --quiet && exit 0
            git commit -m 'Publish gated MLB V7/V9 shadow learning evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce V9 safety, diagnostics, and artifact contract
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ['REPORT_PATH']).read_text())
          assert str(value.get('runId')) == str(os.environ.get('GITHUB_RUN_ID')), value
          assert value.get('sourceSha') == os.environ.get('GITHUB_SHA'), value
          assert value.get('ok') is True, value
          assert value.get('readOnly') is True and value.get('retrospectiveShadowOnly') is True, value
          assert int(value.get('providerCallsMade') or 0) == 0, value
          assert value.get('productionAuthorityChanged') is False, value
          assert int(value.get('canonicalFreshAuditIncrementGames') or 0) >= 200, value
          diagnostics=value.get('diagnosticSelectedPickBands') or {}
          assert set(diagnostics) == {'allCanonicalGames','training','walkForward','untouchedHoldout'}, diagnostics
          for name, view in diagnostics.items():
              assert view.get('version') == 'MLB-V9-DIAGNOSTIC-SELECTED-PICK-BANDS-v1', (name, view)
              assert set(view.get('bandThresholds') or {}) == {'MLB_STRONG','MLB_LEAN','PASS'}, (name, view)
              assert set(view.get('byBand') or {}) == {'MLB_STRONG','MLB_LEAN','PASS'}, (name, view)
          if value.get('shadowRefitPerformed') is True:
              handoff=json.loads(Path(os.environ['HANDOFF_PATH']).read_text())
              assert handoff.get('artifactVersion') == 'MLB-V9-SHADOW-MODEL-ARTIFACT-v1', handoff
              assert handoff.get('artifactType') == 'FROZEN_SHADOW_MODEL', handoff
              assert handoff.get('policy') and handoff.get('modelDigest') and handoff.get('digest'), handoff
              assert handoff.get('promotionAuthority') is False and handoff.get('productionAuthority') is False, handoff
              assert handoff.get('frozenBeforeUntouchedHoldout') is True, handoff
              assert handoff.get('holdoutLabelsUsedForFitOrSelection') is False, handoff
              assert (value.get('canonicalCandidateHandoff') or {}).get('modelDigest') == handoff.get('modelDigest'), (value, handoff)
          assert not value.get('blockers'), value
          PY
