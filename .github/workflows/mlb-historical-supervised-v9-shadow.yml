name: MLB Historical V7 Selective and V9 Shadow Evaluation

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  pull_request:
    paths:
      - 'hello_world/mlb_historical_supervised_v9.py'
      - 'hello_world/mlb_historical_supervised_v9_integrity_v2.py'
      - 'hello_world/mlb_historical_v7_learning_cadence_v1.py'
      - 'hello_world/mlb_historical_v7_priority_repairs_v1.py'
      - 'hello_world/mlb_historical_v7_selective_objective_v1.py'
      - 'hello_world/mlb_historical_v7_selective_search_v2.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'scripts/run_mlb_historical_supervised_v9_shadow.py'
      - 'scripts/resolve_mlb_historical_artifacts_bucket.py'
      - 'tests/unit/test_run_mlb_historical_supervised_v9_shadow.py'
      - 'tests/unit/test_mlb_historical_v7_priority_repairs_v1.py'
      - 'tests/unit/test_mlb_historical_v7_selective_objective_v1.py'
      - 'tests/unit/test_mlb_historical_v7_selective_search_v2.py'
      - 'tests/unit/test_mlb_v7_v9_workflow_recovery_contract.py'
      - '.github/workflows/mlb-historical-supervised-v9-shadow.yml'
      - 'mlb_historical_optimizer/template.yaml'
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_historical_supervised_v9.py'
      - 'hello_world/mlb_historical_supervised_v9_integrity_v2.py'
      - 'hello_world/mlb_historical_v7_learning_cadence_v1.py'
      - 'hello_world/mlb_historical_v7_priority_repairs_v1.py'
      - 'hello_world/mlb_historical_v7_selective_objective_v1.py'
      - 'hello_world/mlb_historical_v7_selective_search_v2.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'scripts/run_mlb_historical_supervised_v9_shadow.py'
      - 'scripts/resolve_mlb_historical_artifacts_bucket.py'
      - 'tests/unit/test_run_mlb_historical_supervised_v9_shadow.py'
      - 'tests/unit/test_mlb_historical_v7_priority_repairs_v1.py'
      - 'tests/unit/test_mlb_historical_v7_selective_objective_v1.py'
      - 'tests/unit/test_mlb_historical_v7_selective_search_v2.py'
      - 'tests/unit/test_mlb_v7_v9_workflow_recovery_contract.py'
      - '.github/workflows/mlb-historical-supervised-v9-shadow.yml'
      - 'mlb_historical_optimizer/template.yaml'

permissions:
  contents: write

concurrency:
  group: mlb-historical-v7-v9-shadow-${{ github.ref }}
  cancel-in-progress: true

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_historical_supervised_v9_shadow_latest.json
  HANDOFF_PATH: runtime_reports/mlb_historical_supervised_v9_candidate_handoff_latest.json
  MLB_V7_SHADOW_REFIT_INCREMENT_GAMES: '50'
  MLB_V7_LIGHTWEIGHT_INCREMENT_GAMES: '25'
  PYTHONPATH: hello_world:scripts

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate V7 selective and V9 implementation
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          PYTHONPATH=hello_world python -m py_compile \
            hello_world/mlb_historical_supervised_v9.py \
            hello_world/mlb_historical_supervised_v9_integrity_v2.py \
            hello_world/mlb_historical_v7_learning_cadence_v1.py \
            hello_world/mlb_historical_v7_priority_repairs_v1.py \
            hello_world/mlb_historical_v7_selective_objective_v1.py \
            hello_world/mlb_historical_v7_selective_search_v2.py \
            hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py \
            scripts/run_mlb_historical_supervised_v9_shadow.py \
            scripts/resolve_mlb_historical_artifacts_bucket.py
          PYTHONPATH=hello_world:. python -m pytest -q --tb=short \
            tests/unit/test_mlb_historical_supervised_v9.py \
            tests/unit/test_mlb_historical_supervised_v9_integrity_v2.py \
            tests/unit/test_run_mlb_historical_supervised_v9_shadow.py \
            tests/unit/test_mlb_historical_v7_learning_cadence_v1.py \
            tests/unit/test_mlb_historical_v7_priority_repairs_v1.py \
            tests/unit/test_mlb_historical_v7_selective_objective_v1.py \
            tests/unit/test_mlb_historical_v7_selective_search_v2.py \
            tests/unit/test_mlb_v7_v9_workflow_recovery_contract.py
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || test "${{ github.event_name }}" = pull_request

      - name: Preserve previous report as frozen comparison input
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:"$REPORT_PATH" > /tmp/mlb-supervised-v9-previous.json 2>/dev/null || printf '{}\n' > /tmp/mlb-supervised-v9-previous.json
          rm -f "$REPORT_PATH" "$HANDOFF_PATH"

      - name: Resolve immutable historical evidence
        id: runtime
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -uo pipefail
          mkdir -p runtime_reports
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import boto3

          region=os.environ['AWS_REGION_VALUE']
          stack_name=os.environ['STACK_NAME']
          session=boto3.session.Session(region_name=region)
          cf=session.client('cloudformation')
          lam=session.client('lambda')
          s3=session.client('s3')

          path=Path('scripts/resolve_mlb_historical_artifacts_bucket.py')
          spec=importlib.util.spec_from_file_location('bucket_resolver', path)
          resolver=importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(resolver)
          bucket=resolver.resolve_bucket(
              explicit=os.environ.get('MLB_HISTORICAL_ARTIFACTS_BUCKET'),
              cloudformation=cf,
              lambda_client=lam,
              s3=s3,
              stack_name=stack_name,
          )

          attempts=[]
          function_name=None
          try:
              stacks=cf.describe_stacks(StackName=stack_name).get('Stacks') or []
              outputs={str(x.get('OutputKey')):str(x.get('OutputValue')) for x in (stacks[0].get('Outputs') or [])} if stacks else {}
              function_name=outputs.get('HistoricalOptimizerFunctionName')
              attempts.append({'strategy':'cloudformation_output','found':bool(function_name),'outputKeys':sorted(outputs)})
          except Exception as exc:
              attempts.append({'strategy':'cloudformation_output','error':f'{type(exc).__name__}:{exc}'})

          expected='mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler'
          if not function_name:
              matches=[]
              paginator=lam.get_paginator('list_functions')
              for page in paginator.paginate():
                  for item in page.get('Functions') or []:
                      if item.get('Handler') == expected and item.get('FunctionName'):
                          matches.append(str(item['FunctionName']))
              matches=sorted(set(matches))
              attempts.append({'strategy':'lambda_handler_scan','matches':matches})
              if len(matches) == 1:
                  function_name=matches[0]
              elif len(matches) > 1:
                  qualified=[]
                  for name in matches:
                      config=lam.get_function_configuration(FunctionName=name)
                      env=((config.get('Environment') or {}).get('Variables') or {})
                      if (
                          env.get('MLB_HISTORICAL_RANGE_EXTENSION_AUTHORIZED') == 'true'
                          and env.get('MLB_HISTORICAL_ARTIFACTS_BUCKET') == bucket.get('bucketName')
                      ):
                          qualified.append(name)
                  qualified=sorted(set(qualified))
                  attempts.append({'strategy':'lambda_environment_filter','matches':qualified})
                  if len(qualified) == 1:
                      function_name=qualified[0]

          config={}
          if function_name:
              config=lam.get_function_configuration(FunctionName=function_name)
          handler_ok=config.get('Handler') == expected
          resolved=bool(bucket.get('ok') and bucket.get('bucketName') and function_name and handler_ok)
          blockers=list(bucket.get('blockers') or [])
          if not function_name:
              blockers.append('historical_optimizer_lambda_unresolved')
          elif not handler_ok:
              blockers.append('historical_optimizer_handler_mismatch')
          evidence={
              'ok':resolved,
              'bucketResolution':bucket,
              'functionName':function_name,
              'functionResolutionAttempts':attempts,
              'handler':config.get('Handler'),
              'blockers':sorted(set(blockers)),
          }
          Path('/tmp/mlb-v7-v9-runtime-resolution.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f"resolved={'true' if resolved else 'false'}\n")
              output.write(f"bucket_name={bucket.get('bucketName') or ''}\n")
              output.write(f"function_name={function_name or ''}\n")
          print(json.dumps(evidence,indent=2,sort_keys=True))
          raise SystemExit(0 if resolved else 1)
          PY
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Run gated AWS-backed read-only evaluation
        id: evaluation
        if: steps.runtime.outputs.resolved == 'true'
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          TARGET_SNAPSHOTS_TABLE: parlay_platform_snapshots
          SNAPSHOTS_TABLE: parlay_platform_snapshots
          MLB_HISTORICAL_ARTIFACTS_BUCKET: ${{ steps.runtime.outputs.bucket_name }}
          MLB_HISTORICAL_START_DATE: '2025-04-01'
          MLB_HISTORICAL_END_DATE: '2026-12-31'
          MLB_HISTORICAL_MAX_CANDIDATES: '100'
          MLB_HISTORICAL_MAX_OPTIMIZATION_ROUNDS: '24'
          MLB_SUPERVISED_EPOCHS: '160'
          MLB_V7_FORCE_SHADOW_REFIT: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          set -uo pipefail
          mkdir -p runtime_reports
          python scripts/run_mlb_historical_supervised_v9_shadow.py \
            --output "$REPORT_PATH" \
            --previous-report /tmp/mlb-supervised-v9-previous.json \
            --handoff-output "$HANDOFF_PATH" 2>&1 | tee /tmp/mlb-supervised-v9-shadow.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure fresh durable V7 V9 evidence exists
        if: always()
        env:
          RUNTIME_RESOLVED: ${{ steps.runtime.outputs.resolved }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          RUNTIME_EXIT_CODE: ${{ steps.runtime.outputs.exit_code }}
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          EVALUATION_EXIT_CODE: ${{ steps.evaluation.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              p=Path(path)
              if not p.exists() or not p.stat().st_size:
                  return {}
              try:
                  return json.loads(p.read_text())
              except Exception as exc:
                  return {'ok':False,'parseError':str(exc)}

          resolution=load('/tmp/mlb-v7-v9-runtime-resolution.json')
          log=Path('/tmp/mlb-supervised-v9-shadow.log').read_text(errors='replace')[-12000:] if Path('/tmp/mlb-supervised-v9-shadow.log').exists() else ''
          runtime_resolved=os.environ.get('RUNTIME_RESOLVED') == 'true'
          blockers=list(resolution.get('blockers') or [])
          if runtime_resolved:
              blockers.append('v7_v9_report_missing_after_evaluation')
          elif not blockers:
              blockers.append('v7_v9_runtime_resolution_failed')
          report={
              'ok':False,
              'proofType':'MLB_HISTORICAL_V7_V9_SHADOW_EVALUATION',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'readOnly':True,
              'retrospectiveShadowOnly':True,
              'prospectiveAuditRequiredBeforePromotion':True,
              'providerCallsMade':0,
              'productionAuthorityChanged':False,
              'historicalChampionWritten':False,
              'productionCutoverWritten':False,
              'promotionAuthority':False,
              'previousReportPreservedSeparately':True,
              'stalledStage':'V7_V9_RUNTIME_RESOLUTION' if not runtime_resolved else 'V7_V9_EVALUATION_BEFORE_REPORT_WRITE',
              'runtimeResolution':resolution,
              'errorLogTail':log,
              'workflowSteps':{
                  'runtime':{
                      'outcome':os.environ.get('RUNTIME_OUTCOME'),
                      'exitCode':os.environ.get('RUNTIME_EXIT_CODE'),
                      'resolved':runtime_resolved,
                  },
                  'evaluation':{
                      'outcome':os.environ.get('EVALUATION_OUTCOME'),
                      'exitCode':os.environ.get('EVALUATION_EXIT_CODE'),
                  },
              },
              'blockers':sorted(set(blockers)),
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-historical-v7-v9-${{ github.run_id }}
          path: |
            runtime_reports/mlb_historical_supervised_v9_shadow_latest.json
            runtime_reports/mlb_historical_supervised_v9_candidate_handoff_latest.json
            /tmp/mlb-supervised-v9-previous.json
            /tmp/mlb-supervised-v9-shadow.log
            /tmp/mlb-v7-v9-runtime-resolution.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable evidence from main-only runs
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$REPORT_PATH" /tmp/mlb-supervised-v9-report.json
          test ! -f "$HANDOFF_PATH" || cp "$HANDOFF_PATH" /tmp/mlb-supervised-v9-handoff.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-supervised-v9-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-supervised-v9-report.json "$REPORT_PATH"
            test ! -f /tmp/mlb-supervised-v9-handoff.json || cp /tmp/mlb-supervised-v9-handoff.json "$HANDOFF_PATH"
            git add runtime_reports/
            git diff --cached --quiet && exit 0
            git commit -m 'Publish gated MLB V7/V9 shadow learning evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce safety and V9 diagnostic report contract
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_historical_supervised_v9_shadow_latest.json').read_text())
          assert value.get('runId') == os.environ.get('GITHUB_RUN_ID'), value
          assert value.get('sourceSha') == os.environ.get('GITHUB_SHA'), value
          assert value.get('ok') is True, value
          assert value.get('readOnly') is True, value
          assert value.get('retrospectiveShadowOnly') is True, value
          assert int(value.get('providerCallsMade') or 0) == 0, value
          assert value.get('productionAuthorityChanged') is False, value
          assert int(value.get('canonicalFreshAuditIncrementGames') or 0) >= 200, value
          assert int(value.get('shadowRefitIncrementGames') or 0) == 50, value
          assert int(value.get('lightweightSelectiveEvaluationIncrementGames') or 0) == 25, value
          selective=value.get('v7SelectiveSearch') or {}
          if selective:
              assert selective.get('promotionAuthority') is False, selective
              assert selective.get('thresholdFrozenBeforeUntouchedHoldout') is True, selective
              assert selective.get('thresholdSelectionUsedHoldoutLabels') is False, selective
          diagnostics=value.get('diagnosticSelectedPickBands') or {}
          assert set(diagnostics) == {'allCanonicalGames','training','walkForward','untouchedHoldout'}, diagnostics
          for name, view in diagnostics.items():
              assert view.get('version') == 'MLB-V9-DIAGNOSTIC-SELECTED-PICK-BANDS-v1', (name, view)
              assert view.get('diagnosticOnly') is True, (name, view)
              assert view.get('productionAuthority') is False, (name, view)
              thresholds=view.get('bandThresholds') or {}
              assert set(thresholds) == {'MLB_STRONG','MLB_LEAN','PASS'}, (name, thresholds)
              assert set(view.get('byBand') or {}) == {'MLB_STRONG','MLB_LEAN','PASS'}, (name, view)
              assert isinstance(view.get('dailySelectedPickBands'), list), (name, view)
              assert isinstance(view.get('games'), list), (name, view)
              for game in view.get('games') or []:
                  assert game.get('selectedPickBand') in {'MLB_STRONG','MLB_LEAN','PASS'}, game
                  assert game.get('predictedWinner'), game
                  assert game.get('selectedProbabilityPct') is not None, game
          assert not value.get('blockers'), value
          PY