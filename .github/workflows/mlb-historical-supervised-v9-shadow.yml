name: MLB Historical V7 Selective and V9 Shadow Evaluation

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-historical-supervised-v9-shadow.yml'
      - 'hello_world/mlb_historical_supervised_v9.py'
      - 'hello_world/mlb_historical_supervised_v9_integrity_v2.py'
      - 'hello_world/mlb_historical_v7_*.py'
      - 'hello_world/mlb_no_bbd_context_bridge_v1.py'
      - 'hello_world/mlb_v8_historical_bbs_overlay_v1.py'
      - 'hello_world/mlb_v8_historical_context_overlay_v1.py'
      - 'scripts/run_mlb_historical_supervised_v9_shadow*.py'
      - 'scripts/run_mlb_historical_supervised_v9_no_bbd.py'
      - 'tests/unit/test_run_mlb_historical_supervised_v9_no_bbd.py'
      - 'tests/unit/test_mlb_no_bbd_context_bridge_v1.py'
  pull_request:
    paths:
      - '.github/workflows/mlb-historical-supervised-v9-shadow.yml'
      - 'hello_world/mlb_historical_supervised_v9.py'
      - 'hello_world/mlb_historical_supervised_v9_integrity_v2.py'
      - 'hello_world/mlb_historical_v7_*.py'
      - 'hello_world/mlb_no_bbd_context_bridge_v1.py'
      - 'scripts/run_mlb_historical_supervised_v9_shadow*.py'
      - 'scripts/run_mlb_historical_supervised_v9_no_bbd.py'
      - 'tests/unit/test_run_mlb_historical_supervised_v9_no_bbd.py'
      - 'tests/unit/test_mlb_no_bbd_context_bridge_v1.py'

permissions:
  contents: write

concurrency:
  group: mlb-historical-v7-v9-shadow-${{ github.ref }}
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_historical_supervised_v9_shadow_latest.json
  HANDOFF_PATH: runtime_reports/mlb_historical_supervised_v9_candidate_handoff_latest.json
  VALIDATION_PATH: /tmp/mlb-v9-validation.json
  MLB_V7_SHADOW_REFIT_INCREMENT_GAMES: '50'
  MLB_V7_LIGHTWEIGHT_INCREMENT_GAMES: '25'
  MLB_V7_FEATURE_REFIT_INCREMENT_ROWS: '50'
  MLB_V7_FEATURE_LIGHTWEIGHT_INCREMENT_ROWS: '10'
  BBS_API_DISABLED: 'true'
  MLB_V8_HISTORICAL_BBS_OVERLAY_ENABLED: 'true'
  MLB_V8_HISTORICAL_BBS_OVERLAY_REQUIRED: 'false'
  MLB_V8_HISTORICAL_CONTEXT_OVERLAY_ENABLED: 'true'
  MLB_V8_HISTORICAL_CONTEXT_OVERLAY_REQUIRED: 'false'
  PYTHONPATH: .:hello_world:scripts
  PYTHONUNBUFFERED: '1'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Preserve previous cadence evidence
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p runtime_reports
          git show origin/main:"$REPORT_PATH" > /tmp/mlb-supervised-v9-previous.json 2>/dev/null || printf '{}\n' > /tmp/mlb-supervised-v9-previous.json
          rm -f "$REPORT_PATH" "$HANDOFF_PATH" "$VALIDATION_PATH"

      - name: Validate provider-neutral V7 and V9 implementation
        id: validation
        continue-on-error: true
        env:
          MLB_V9_VALIDATION_EVIDENCE: ${{ env.VALIDATION_PATH }}
        run: |
          set -uo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            hello_world/mlb_no_bbd_context_bridge_v1.py \
            scripts/run_mlb_historical_supervised_v9_shadow_cadence.py \
            scripts/run_mlb_historical_supervised_v9_shadow.py \
            scripts/run_mlb_historical_supervised_v9_shadow_v2.py \
            scripts/run_mlb_historical_supervised_v9_no_bbd.py
          python -m pytest -q --tb=short \
            tests/unit/test_mlb_no_bbd_context_bridge_v1.py \
            tests/unit/test_run_mlb_historical_supervised_v9_shadow_cadence.py \
            tests/unit/test_run_mlb_historical_supervised_v9_no_bbd.py \
            tests/unit/test_mlb_historical_supervised_v9.py \
            tests/unit/test_mlb_historical_supervised_v9_integrity_v2.py \
            tests/unit/test_mlb_historical_v7_priority_repairs_v1.py \
            tests/unit/test_mlb_historical_v7_selective_search_v2.py
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Resolve immutable historical artifacts bucket
        id: runtime
        if: steps.validation.outcome == 'success'
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -uo pipefail
          bucket_name=$(python scripts/resolve_mlb_historical_artifacts_bucket.py \
            --region "$AWS_REGION_VALUE" \
            --json-output /tmp/mlb-v7-v9-runtime-resolution.json)
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if test "$status" -eq 0 && test -n "$bucket_name"; then
            echo "bucket_name=$bucket_name" >> "$GITHUB_OUTPUT"
            echo 'resolved=true' >> "$GITHUB_OUTPUT"
          else
            echo 'resolved=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Run feature-aware read-only V7 and V9 evaluation
        id: evaluation
        if: steps.validation.outcome == 'success' && steps.runtime.outputs.resolved == 'true'
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          TARGET_SNAPSHOTS_TABLE: parlay_platform_snapshots
          SNAPSHOTS_TABLE: parlay_platform_snapshots
          MLB_HISTORICAL_ARTIFACTS_BUCKET: ${{ steps.runtime.outputs.bucket_name }}
          MLB_HISTORICAL_START_DATE: '2025-04-01'
          MLB_HISTORICAL_END_DATE: '2026-12-31'
          MLB_HISTORICAL_MAX_CANDIDATES: '100'
          MLB_HISTORICAL_MAX_OPTIMIZATION_ROUNDS: '24'
          MLB_SUPERVISED_EPOCHS: '160'
          MLB_V7_FORCE_SHADOW_REFIT: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          set -uo pipefail
          python scripts/run_mlb_historical_supervised_v9_no_bbd.py \
            --output "$REPORT_PATH" \
            --previous-report /tmp/mlb-supervised-v9-previous.json \
            --handoff-output "$HANDOFF_PATH" \
            2>&1 | tee /tmp/mlb-supervised-v9-shadow.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure fresh durable V7 and V9 evidence
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          RUNTIME_RESOLVED: ${{ steps.runtime.outputs.resolved }}
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          EVALUATION_EXIT_CODE: ${{ steps.evaluation.outputs.exit_code }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path(os.environ['REPORT_PATH'])
          current={}
          if path.exists() and path.stat().st_size:
              try:current=json.loads(path.read_text())
              except Exception:current={}
          fresh=str(current.get('runId')) == str(os.environ.get('GITHUB_RUN_ID')) and current.get('sourceSha') == os.environ.get('GITHUB_SHA')
          if fresh:raise SystemExit(0)
          log=Path('/tmp/mlb-supervised-v9-shadow.log').read_text(errors='replace')[-12000:] if Path('/tmp/mlb-supervised-v9-shadow.log').exists() else ''
          if os.environ.get('VALIDATION_OUTCOME') != 'success':stage='V7_V9_VALIDATION'; blocker='v7_v9_validation_failed'
          elif os.environ.get('RUNTIME_RESOLVED') != 'true':stage='V7_V9_RUNTIME_RESOLUTION'; blocker='v7_v9_runtime_resolution_failed'
          elif os.environ.get('EVALUATION_OUTCOME') == 'cancelled':stage='V7_V9_EVALUATION_CANCELLED'; blocker='v7_v9_evaluation_cancelled'
          else:stage='V7_V9_EVALUATION_BEFORE_REPORT_WRITE'; blocker='v7_v9_evaluation_failed_before_report_write'
          value={
              'ok':False,'proofType':'MLB_HISTORICAL_V7_V9_SHADOW_EVALUATION',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),'runId':os.environ.get('GITHUB_RUN_ID'),
              'readOnly':True,'retrospectiveShadowOnly':True,
              'prospectiveAuditRequiredBeforePromotion':True,
              'providerCallsMade':0,'liveBbdApiAvailable':False,'liveBbdApiRequired':False,
              'productionAuthorityChanged':False,'historicalChampionWritten':False,
              'productionCutoverWritten':False,'promotionAuthority':False,
              'stalledStage':stage,'errorLogTail':log,'blockers':[blocker],
          }
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
          python -m json.tool "$REPORT_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-historical-v7-v9-${{ github.run_id }}
          path: |
            runtime_reports/mlb_historical_supervised_v9_shadow_latest.json
            runtime_reports/mlb_historical_supervised_v9_candidate_handoff_latest.json
            /tmp/mlb-supervised-v9-previous.json
            /tmp/mlb-supervised-v9-shadow.log
            /tmp/mlb-v7-v9-runtime-resolution.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable V7 and V9 evidence
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$REPORT_PATH" /tmp/mlb-supervised-v9-report.json
          test ! -f "$HANDOFF_PATH" || cp "$HANDOFF_PATH" /tmp/mlb-supervised-v9-handoff.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-supervised-v9-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-supervised-v9-report.json "$REPORT_PATH"
            test ! -f /tmp/mlb-supervised-v9-handoff.json || cp /tmp/mlb-supervised-v9-handoff.json "$HANDOFF_PATH"
            git add runtime_reports/
            git diff --cached --quiet && exit 0
            git commit -m 'Publish gated MLB V7/V9 shadow learning evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce safety, context cadence, and artifact contract
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ['REPORT_PATH']).read_text())
          assert str(value.get('runId')) == str(os.environ.get('GITHUB_RUN_ID')), value
          assert value.get('sourceSha') == os.environ.get('GITHUB_SHA'), value
          assert value.get('ok') is True, value
          assert value.get('readOnly') is True and value.get('retrospectiveShadowOnly') is True, value
          assert int(value.get('providerCallsMade') or 0) == 0, value
          assert value.get('liveBbdApiAvailable') is False, value
          assert value.get('liveBbdApiRequired') is False, value
          assert value.get('productionAuthorityChanged') is False, value
          assert int(value.get('canonicalFreshAuditIncrementGames') or 0) >= 200, value
          bridge=value.get('contextBridge') or {}
          assert int(bridge.get('providerCallsMade') or 0) == 0, bridge
          assert bridge.get('liveBbdApiRequired') is False, bridge
          diagnostics=value.get('diagnosticSelectedPickBands') or {}
          assert set(diagnostics) == {'allCanonicalGames','training','walkForward','untouchedHoldout'}, diagnostics
          for view in diagnostics.values():
              assert view.get('version') == 'MLB-V9-DIAGNOSTIC-SELECTED-PICK-BANDS-v1', view
          if value.get('shadowRefitPerformed') is True:
              handoff=json.loads(Path(os.environ['HANDOFF_PATH']).read_text())
              assert handoff.get('artifactVersion') == 'MLB-V9-SHADOW-MODEL-ARTIFACT-v1', handoff
              assert handoff.get('promotionAuthority') is False and handoff.get('productionAuthority') is False, handoff
              assert handoff.get('frozenBeforeUntouchedHoldout') is True, handoff
              assert handoff.get('holdoutLabelsUsedForFitOrSelection') is False, handoff
          assert not value.get('blockers'), value
          PY
