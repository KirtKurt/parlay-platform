name: MLB Historical Supervised V9 Shadow Evaluation

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_historical_optimizer_entrypoint.py'
      - 'hello_world/mlb_historical_feature_rematerialization_v1.py'
      - 'hello_world/mlb_ml_runtime_install_v3.py'

permissions:
  contents: write

concurrency:
  group: mlb-historical-supervised-v9-shadow
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_historical_supervised_v9_shadow_latest.json

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate supervised implementation
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          PYTHONPATH=hello_world python -m py_compile \
            hello_world/mlb_historical_supervised_v9.py \
            scripts/run_mlb_historical_supervised_v9_shadow.py
          python -m pytest -q --tb=short tests/unit/test_mlb_historical_supervised_v9.py

      - name: Resolve immutable historical evidence
        id: runtime
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" \
            --output text)
          bucket_name=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalArtifactsBucketName'].OutputValue" \
            --output text)
          test -n "$function_name"; test "$function_name" != None
          test -n "$bucket_name"; test "$bucket_name" != None
          config=$(aws lambda get-function-configuration \
            --function-name "$function_name" \
            --region "${{ secrets.AWS_REGION }}" \
            --output json)
          CONFIG="$config" python - <<'PY'
          import json, os
          value=json.loads(os.environ['CONFIG'])
          assert value.get('Handler') == 'mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler', value
          PY
          echo "bucket_name=$bucket_name" >> "$GITHUB_OUTPUT"

      - name: Run AWS-backed read-only supervised evaluation
        id: evaluation
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          TARGET_SNAPSHOTS_TABLE: parlay_platform_snapshots
          SNAPSHOTS_TABLE: parlay_platform_snapshots
          MLB_HISTORICAL_ARTIFACTS_BUCKET: ${{ steps.runtime.outputs.bucket_name }}
          MLB_HISTORICAL_START_DATE: '2025-04-01'
          MLB_HISTORICAL_END_DATE: '2026-07-24'
          MLB_HISTORICAL_MAX_CANDIDATES: '100'
          MLB_HISTORICAL_MAX_OPTIMIZATION_ROUNDS: '12'
          MLB_SUPERVISED_EPOCHS: '160'
          PYTHONPATH: hello_world
        run: |
          set -uo pipefail
          mkdir -p runtime_reports
          rm -f "$REPORT_PATH" /tmp/mlb-supervised-v9-shadow.log
          python scripts/run_mlb_historical_supervised_v9_shadow.py \
            --output "$REPORT_PATH" \
            2>&1 | tee /tmp/mlb-supervised-v9-shadow.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure durable evidence exists
        if: always()
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          EVALUATION_EXIT_CODE: ${{ steps.evaluation.outputs.exit_code }}
        run: |
          set -euo pipefail
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-supervised-v9-shadow.log').read_text(errors='replace')[-16000:] if Path('/tmp/mlb-supervised-v9-shadow.log').exists() else ''
          value={
              'proofType':'MLB_HISTORICAL_SUPERVISED_V9_SHADOW_EVALUATION',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ['GITHUB_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'readOnly':True,
              'providerCallsMade':0,
              'productionAuthorityChanged':False,
              'errorLogTail':log,
              'evaluationOutcome':os.environ.get('EVALUATION_OUTCOME'),
              'evaluationExitCode':os.environ.get('EVALUATION_EXIT_CODE'),
              'blockers':['shadow_evaluation_failed_before_report'],
              'ok':False,
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-historical-supervised-v9-${{ github.run_id }}
          path: |
            runtime_reports/mlb_historical_supervised_v9_shadow_latest.json
            /tmp/mlb-supervised-v9-shadow.log
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable shadow evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$REPORT_PATH" /tmp/mlb-supervised-v9-report.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-supervised-v9-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-supervised-v9-report.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB supervised V9 shadow evaluation'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce successful shadow evaluation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_historical_supervised_v9_shadow_latest.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('readOnly') is True, value
          assert int(value.get('providerCallsMade') or 0) == 0, value
          assert value.get('productionAuthorityChanged') is False, value
          assert not value.get('blockers'), value
          PY
