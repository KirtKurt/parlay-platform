name: Snapshot MLB finalization runs
# Snapshot refresh: 2026-08-24T21:35Z

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-mlb-finalization-runs.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Capture finalization runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mlb-finalization runtime_reports
          for workflow in \
            finalize-mlb-auto-production-once.yml \
            probe-mlb-auto-bedrock-capacity-now.yml \
            launch-mlb-v5-after-repaired-root-now.yml \
            finalize-mlb-root-settlement-training-now.yml \
            isolate-mlb-root-deploy-concurrency-now.yml \
            deploy.yml \
            mlb-prospective-backlog-reconcile-v5-once.yml; do
            safe=$(printf '%s' "$workflow" | tr '.-' '__')
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --limit 15 \
              --json databaseId,workflowName,event,headBranch,headSha,status,conclusion,createdAt,updatedAt,url \
              > "/tmp/mlb-finalization/${safe}.json" || printf '[]\n' > "/tmp/mlb-finalization/${safe}.json"
          done
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          workflows={}
          for path in sorted(Path('/tmp/mlb-finalization').glob('*_yml.json')):
              workflows[path.stem]=json.loads(path.read_text())
          report={
              'proofType':'MLB_FINALIZATION_RUN_SNAPSHOT',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ.get('GITHUB_SHA'),
              'workflows':workflows,
              'secretExposed':False,
          }
          Path('runtime_reports/mlb_finalization_runs_latest.json').write_text(
              json.dumps(report, indent=2, sort_keys=True)+'\n'
          )
          PY
      - name: Publish snapshot
        run: |
          set -euo pipefail
          cp runtime_reports/mlb_finalization_runs_latest.json /tmp/mlb-finalization/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-finalization-run-proof origin/main
            git reset --hard origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-finalization/report.json runtime_reports/mlb_finalization_runs_latest.json
            git add runtime_reports/mlb_finalization_runs_latest.json
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB finalization run snapshot [skip ci]'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
