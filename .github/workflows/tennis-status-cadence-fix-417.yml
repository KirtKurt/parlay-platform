name: Tennis Status Cadence Fix 417

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennis-status-cadence-fix-417.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep status evidence inside freshness window
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/publish-tennis-autonomy-status.yml')
          text = path.read_text()
          old = "    # Keep cadence above the 20-minute timeout to avoid self-cancel starvation.\n    - cron: '7,37 * * * *'"
          new = "    # Publish every 20 minutes so repository evidence stays within the 25-minute freshness window.\n    - cron: '7,27,47 * * * *'"
          if old not in text:
              raise SystemExit('expected tennis status schedule block not found')
          text = text.replace(old, new, 1)
          if '    timeout-minutes: 20' not in text:
              raise SystemExit('expected tennis status timeout not found')
          text = text.replace('    timeout-minutes: 20', '    timeout-minutes: 18', 1)
          path.write_text(text)
          PY
          git diff --check
          grep -F "cron: '7,27,47 * * * *'" .github/workflows/publish-tennis-autonomy-status.yml
          grep -F 'timeout-minutes: 18' .github/workflows/publish-tennis-autonomy-status.yml

      - name: Publish cadence fix and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/publish-tennis-autonomy-status.yml')
          text = path.read_text()
          old = "    # Keep cadence above the 20-minute timeout to avoid self-cancel starvation.\n    - cron: '7,37 * * * *'"
          new = "    # Publish every 20 minutes so repository evidence stays within the 25-minute freshness window.\n    - cron: '7,27,47 * * * *'"
          if old in text:
              text = text.replace(old, new, 1)
          if '    timeout-minutes: 20' in text:
              text = text.replace('    timeout-minutes: 20', '    timeout-minutes: 18', 1)
          path.write_text(text)
          PY
            git rm -f .github/workflows/tennis-status-cadence-fix-417.yml
            git add .github/workflows/publish-tennis-autonomy-status.yml
            git diff --cached --check
            git commit -m 'Fix tennis status publisher cadence'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Unable to publish tennis status cadence fix' >&2
          exit 1
