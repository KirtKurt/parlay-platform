name: MLB Engineering Controller Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'engineering_agent/**'
      - 'tests/unit/test_mlb_engineering_runtime.py'
      - 'tests/unit/test_mlb_engineering_evidence.py'
      - 'tests/unit/test_mlb_engineering_evidence_freshness.py'
      - '.github/workflows/mlb-engineering-planner.yml'
      - '.github/workflows/mlb-engineering-controller-contract.yml'
  push:
    branches: [main]
    paths:
      - 'engineering_agent/**'
      - 'tests/unit/test_mlb_engineering_runtime.py'
      - 'tests/unit/test_mlb_engineering_evidence.py'
      - 'tests/unit/test_mlb_engineering_evidence_freshness.py'
      - '.github/workflows/mlb-engineering-planner.yml'
      - '.github/workflows/mlb-engineering-controller-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-engineering-controller-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install controller test runtime
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'

      - name: Compile bounded controller
        run: python -m py_compile engineering_agent/planner.py engineering_agent/runtime.py engineering_agent/evidence.py engineering_agent/evidence_freshness.py

      - name: Verify bounded controller contracts
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python -m pytest -q \
            tests/unit/test_mlb_engineering_runtime.py \
            tests/unit/test_mlb_engineering_evidence.py \
            tests/unit/test_mlb_engineering_evidence_freshness.py
