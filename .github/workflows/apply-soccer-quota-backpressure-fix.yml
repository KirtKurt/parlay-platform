name: Apply Soccer Quota Backpressure Fix

on:
  push:
    paths:
      - '.github/workflows/apply-soccer-quota-backpressure-fix.yml'
      - 'scripts/apply_soccer_quota_backpressure_fix.py'
      - 'tests/soccer_auto/test_quota_backpressure.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-soccer-quota-backpressure-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.ref_name == 'agent/fix-soccer-quota-backpressure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Soccer quota backpressure repair
        run: python scripts/apply_soccer_quota_backpressure_fix.py

      - name: Verify Soccer quota and collection safety
        run: |
          python -m pip install --quiet 'pytest>=8,<9' boto3 botocore
          python -m pytest -q \
            tests/soccer_auto/test_quota_backpressure.py \
            tests/soccer_auto/test_shared_quota_guard.py \
            tests/soccer_auto/test_collection_gate.py
          python -m py_compile soccer_auto/collector.py

      - name: Commit repaired Soccer collector
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add soccer_auto/collector.py
          if git diff --cached --quiet; then
            echo 'Soccer quota backpressure repair already applied.'
          else
            git commit -m 'Backpressure Soccer collection when provider quota is exhausted'
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
