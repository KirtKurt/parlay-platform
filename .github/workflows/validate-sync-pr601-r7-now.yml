name: Validate and sync PR601 R7 now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-sync-pr601-r7-now.yml'

permissions:
  contents: write

concurrency:
  group: validate-sync-pr601-r7-now
  cancel-in-progress: false

jobs:
  validate-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mlb-valid-prelock-quarantine-v4-567
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - name: Verify repair head and merge latest main without publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "767b67f8df98624f9044110bf2777bdde665b946"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install verification dependencies
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
      - name: Verify source and SAM contracts
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          sam validate --template-file template.yaml
          python scripts/verify_mlb_no_bbd_runtime.py
          python scripts/verify_mlb_schedule_invariants.py
          python scripts/verify_mlb_workflow_authority.py
          python scripts/verify_mlb_daily_pull_start_gate.py
          python tests/unit/test_mlb_official_lock_quality_gate.py
          python tests/unit/test_mlb_pull_dedupe_guard.py
          python -m pytest -q tests/unit/test_mlb_production_acceptance.py
          python scripts/verify_mlb_per_game_lock.py
      - name: Run broad MLB production contract suite
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/unit/test_mlb_pull_guard_status.py \
            tests/unit/test_mlb_probability_actionability_guard.py \
            tests/unit/test_mlb_signal_policy_prelock_persistence.py \
            tests/unit/test_mlb_production_verifier_authority.py \
            tests/unit/test_mlb_production_verifier_per_game.py \
            tests/unit/test_mlb_advanced_context_travel_rest.py \
            tests/unit/test_mlb_fundamentals_snapshot_v2.py \
            tests/unit/test_mlb_last_possible_prediction_gate_provider_neutral.py \
            tests/unit/test_mlb_canonical_final_labels_v1.py \
            tests/unit/test_mlb_prediction_probability_contract_v1.py \
            tests/unit/test_mlb_ml_experiment_v2.py \
            tests/unit/test_mlb_ml_dual_model_v2.py \
            tests/unit/test_mlb_ml_promotion_policy_v2.py \
            tests/unit/test_mlb_ml_aws_training_v1.py \
            tests/unit/test_mlb_daily_pick_lock_runtime.py \
            tests/unit/test_mlb_cooperative_terminal_chunk.py \
            tests/unit/test_reconcile_mlb_prospective_backlog_v5_settlement_replay.py \
            tests/unit/test_mlb_daily_per_game_lock.py \
            tests/unit/test_mlb_lock_status_request_cache.py \
            tests/unit/test_mlb_public_per_game_authority.py \
            tests/unit/test_mlb_existing_canonical_overlay_idempotency.py \
            tests/unit/test_verify_mlb_postdeploy_scheduled_pull.py \
            tests/unit/test_mlb_deploy_identity.py \
            tests/unit/test_mlb_deploy_http_probe.py \
            tests/unit/test_mlb_lambda_artifact_identity.py \
            tests/unit/test_mlb_trainer_invoke_retry.py \
            tests/unit/test_mlb_release_activation_predeploy.py \
            tests/unit/test_mlb_trainer_deploy_response.py \
            tests/unit/test_mlb_workflow_authority.py \
            tests/unit/test_mlb_progress_pulse_watchdog.py \
            tests/unit/test_mlb_progress_pulse_bounded_runner_relay.py \
            tests/unit/test_run_mlb_ml_v3_audit_report.py
      - name: Build exact merged SAM source
        shell: bash
        run: |
          set -euo pipefail
          sam build --no-cached --template-file template.yaml
      - name: Publish validated main synchronization to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/mlb-valid-prelock-quarantine-v4-567
      - name: Remove one-shot validator from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/pr601-validator-cleanup origin/main
          cd /tmp/pr601-validator-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/validate-sync-pr601-r7-now.yml
          git commit -m 'Remove completed PR601 validator [skip ci]'
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((n*2))
          done
          exit 1
