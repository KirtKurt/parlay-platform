name: Repair MLB Shadow Gate and Redeploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-shadow-gate-and-dispatch-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-mlb-shadow-gate-and-dispatch-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch fail-closed shadow authority verifier
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          verifier = Path('scripts/verify_mlb_trainer_deploy_response.py')
          text = verifier.read_text(encoding='utf-8')
          old = '''    champion = status_after.get("champion")
    champion_absent = champion in (None, {})
    activation_available = status_after.get("runtimeAuthorityActivationAvailable")

    shadow_manual_first = (
        automatic_promotion_disabled
        and manual_first_required
        and inference_consumer_absent
        and live_authority_absent
        and champion_absent
    )
'''
          new = '''    activation_available = status_after.get("runtimeAuthorityActivationAvailable")

    # A persisted challenger/champion artifact is not runtime authority. The
    # activation path must stay unavailable until manual approval installs a
    # V2 inference consumer or otherwise enables live inference authority.
    shadow_manual_first = (
        automatic_promotion_disabled
        and manual_first_required
        and inference_consumer_absent
        and live_authority_absent
    )
'''
          if old not in text:
              raise SystemExit('expected verifier block not found; refusing unsafe patch')
          verifier.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/unit/test_mlb_shadow_authority_deploy_gate.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_test = '''def test_promoted_or_authoritative_state_requires_runtime_activation_path():
    assert _runtime_authority_activation_errors(
        _status(
            champion={"artifactDigest": "approved"},
            runtimeAuthorityActivationAvailable=False,
        )
    ) == ["runtime_authority_activation_not_available"]
'''
          new_test = '''def test_persisted_shadow_champion_does_not_enable_runtime_activation():
    assert _runtime_authority_activation_errors(
        _status(
            champion={"artifactDigest": "shadow-only-not-manually-approved"},
            runtimeAuthorityActivationAvailable=False,
        )
    ) == []


def test_persisted_shadow_champion_rejects_premature_runtime_activation():
    assert _runtime_authority_activation_errors(
        _status(
            champion={"artifactDigest": "shadow-only-not-manually-approved"},
            runtimeAuthorityActivationAvailable=True,
        )
    ) == [
        "runtime_authority_activation_must_remain_unavailable_before_manual_approval"
    ]


def test_authoritative_state_requires_runtime_activation_path():
    assert _runtime_authority_activation_errors(
        _status(
            liveInferenceAuthority=True,
            v2InferenceConsumerInstalled=True,
            runtimeAuthorityActivationAvailable=False,
        )
    ) == ["runtime_authority_activation_not_available"]
'''
          if old_test not in test_text:
              raise SystemExit('expected focused test block not found; refusing unsafe patch')
          test_path.write_text(test_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY
      - name: Run focused safety tests
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pytest>=8,<9'
          python -m py_compile scripts/verify_mlb_trainer_deploy_response.py
          python -m pytest -q \
            tests/unit/test_mlb_shadow_authority_deploy_gate.py \
            tests/unit/test_mlb_trainer_deploy_response.py
          git diff --check
      - name: Publish fix to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/repair-mlb-shadow-gate-and-dispatch-once.yml
          git add scripts/verify_mlb_trainer_deploy_response.py \
            tests/unit/test_mlb_shadow_authority_deploy_gate.py \
            .github/workflows/repair-mlb-shadow-gate-and-dispatch-once.yml
          git commit -m 'Fix MLB shadow champion deployment gate'
          git push origin HEAD:main
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
