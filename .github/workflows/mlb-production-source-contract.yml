name: MLB Production Source Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mlb-production-source-contract.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-persisted-shadow-authority-deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/dispatch-persisted-shadow-authority-deploy-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify persisted-status lifecycle fix is current
        run: |
          set -euo pipefail
          grep -q '_health_latest_live_authority' scripts/verify_mlb_trainer_deploy_response.py
          grep -q 'selectionCaptureHealth' scripts/verify_mlb_trainer_deploy_response.py
          grep -q 'runtime_authority_activation_must_remain_unavailable_before_manual_approval' scripts/verify_mlb_trainer_deploy_response.py
          python -m py_compile scripts/verify_mlb_trainer_deploy_response.py
      - name: Dispatch normal serialized SAM deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
