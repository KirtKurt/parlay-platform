name: MLB Production Source Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mlb-production-source-contract.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-fixed-shadow-deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/dispatch-fixed-shadow-deploy-after-fixture-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify repaired verifier and fixture are on main
        run: |
          set -euo pipefail
          grep -q 'runtime_authority_activation_must_remain_unavailable_before_manual_approval' scripts/verify_mlb_trainer_deploy_response.py
          python - <<'PY'
          from pathlib import Path
          text=Path('tests/unit/test_mlb_trainer_deploy_response.py').read_text()
          assert '"runtimeAuthorityActivationAvailable": False' in text
          assert '"runtimeAuthorityActivationAvailable": True' not in text.split('def _payloads():',1)[1].split('def _verify(',1)[0]
          PY
          python -m pytest -q \
            tests/unit/test_mlb_shadow_authority_deploy_gate.py \
            tests/unit/test_mlb_trainer_deploy_response.py
      - name: Dispatch normal serialized SAM deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
