name: MLB Production Source Contract

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/mlb-production-source-contract.yml'

permissions:
  contents: read
  actions: read

jobs:
  monitor-fixed-shadow-deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/dispatch-fixed-shadow-deploy-after-fixture-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve latest dispatched deployment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            row=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow deploy.yml \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId,status,conclusion,headSha,createdAt,url \
              --jq '.[0] // empty')
            if test -n "$row"; then
              echo "$row" | python -m json.tool
              run_id=$(echo "$row" | python -c 'import json,sys; print(json.load(sys.stdin)["databaseId"])')
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo 'No workflow-dispatch deployment run was found.' >&2
          exit 1
      - name: Follow deployment to completion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Publish final deployment summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          test -n "$RUN_ID"
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,jobs \
            --jq '{databaseId,status,conclusion,headSha,createdAt,updatedAt,url,jobs:[.jobs[]|{name,status,conclusion,databaseId}]}'
