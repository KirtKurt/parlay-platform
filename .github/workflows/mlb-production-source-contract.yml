name: MLB Production Source Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mlb-production-source-contract.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-fixed-verifier-deployment:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/dispatch-mlb-verifier-deploy-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify corrected source is on main
        run: |
          set -euo pipefail
          grep -q 'verify_mlb_trainer_deploy_response_legacy' scripts/verify_mlb_trainer_deploy_response.py
          grep -q 'runtime_authority_activation_must_remain_unavailable_before_manual_approval' scripts/verify_mlb_trainer_deploy_response.py
          test -s scripts/verify_mlb_trainer_deploy_response_legacy.py
      - name: Dispatch normal serialized SAM deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
