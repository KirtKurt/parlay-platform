name: MLB V8 First Five Historical Backfill Plan

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/plan_mlb_v8_historical_first_five_backfill.py'
      - 'tests/unit/test_mlb_v8_first_five_backfill_plan.py'
      - '.github/workflows/mlb-v8-first-five-backfill-plan.yml'
      - 'runtime_reports/mlb_v9_pointer_reconciliation_latest.json'

permissions:
  contents: write

concurrency:
  group: mlb-v8-first-five-historical-backfill-plan
  cancel-in-progress: true

env:
  REPORT_PATH: runtime_reports/mlb_v8_first_five_backfill_plan_latest.json

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate zero-provider-call planning contract
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/tmp/mlb-first-five-plan-aws-identity.json
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          PYTHONPATH=scripts python -m py_compile scripts/plan_mlb_v8_historical_first_five_backfill.py
          PYTHONPATH=scripts python -m pytest -q --tb=short tests/unit/test_mlb_v8_first_five_backfill_plan.py
          grep -Fq 'DEFAULT_MAX_CREDITS = 75_000' scripts/plan_mlb_v8_historical_first_five_backfill.py
          grep -Fq '"providerCallsMade": 0' scripts/plan_mlb_v8_historical_first_five_backfill.py
          grep -Fq '"executionAllowed": False' scripts/plan_mlb_v8_historical_first_five_backfill.py
          ! grep -Fq 'ODDS_API_KEY' scripts/plan_mlb_v8_historical_first_five_backfill.py

      - name: Build immutable full-cohort backfill plan
        id: planning
        continue-on-error: true
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: scripts
        run: |
          set -o pipefail
          mkdir -p runtime_reports
          rm -f "$REPORT_PATH" /tmp/mlb-first-five-backfill-plan.log
          python scripts/plan_mlb_v8_historical_first_five_backfill.py \
            --region "$AWS_REGION_VALUE" \
            --historical-stack parlay-platform-mlb-historical-optimizer \
            --v8-stack parlay-platform-mlb-odds-v8-shadow \
            --table-name parlay_platform_snapshots \
            --maximum-credits 75000 \
            --output "$REPORT_PATH" \
            2>&1 | tee /tmp/mlb-first-five-backfill-plan.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure durable plan evidence exists
        if: always()
        env:
          PLANNING_OUTCOME: ${{ steps.planning.outcome }}
          PLANNING_EXIT_CODE: ${{ steps.planning.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-first-five-backfill-plan.log').read_text(errors='replace')[-16000:] if Path('/tmp/mlb-first-five-backfill-plan.log').exists() else ''
          value={
              'proofType':'MLB_V8_HISTORICAL_FIRST_FIVE_BACKFILL_PLAN',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'sourceSha':os.environ['GITHUB_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'authority':'PLAN_ONLY',
              'providerCallsMade':0,
              'productionAuthorityChanged':False,
              'automaticWagerAllowed':False,
              'trainingEligible':False,
              'planningOutcome':os.environ.get('PLANNING_OUTCOME'),
              'planningExitCode':os.environ.get('PLANNING_EXIT_CODE'),
              'errorLogTail':log,
              'blockers':['backfill_plan_failed_before_report'],
              'ok':False,
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v8-first-five-backfill-plan-${{ github.run_id }}
          path: |
            runtime_reports/mlb_v8_first_five_backfill_plan_latest.json
            /tmp/mlb-first-five-backfill-plan.log
            /tmp/mlb-first-five-plan-aws-identity.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable backfill plan
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$REPORT_PATH" /tmp/mlb-first-five-backfill-plan-report.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-first-five-backfill-plan-proof origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-first-five-backfill-plan-report.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V8 first-five historical backfill plan'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce valid plan without paid authorization
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_v8_first_five_backfill_plan_latest.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('authority') == 'PLAN_ONLY', value
          assert int(value.get('providerCallsMade') or 0) == 0, value
          assert value.get('selectionUsedOutcomes') is False, value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('automaticWagerAllowed') is False, value
          assert value.get('trainingEligible') is False, value
          assert int((value.get('costModel') or {}).get('estimatedCredits') or 0) <= 75000, value
          authorization=value.get('authorization') or {}
          assert authorization.get('required') is True, value
          assert authorization.get('authorized') is False, value
          assert authorization.get('executionAllowed') is False, value
          assert authorization.get('paidCollectionStarted') is False, value
          assert value.get('planFingerprint'), value
          assert value.get('selectionFingerprint'), value
          assert (value.get('artifact') or {}).get('sha256'), value
          PY
