# Retrigger after stored-catalogue pacing was installed.
name: MLB V8 BBD Supported Completion Once

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-v8-bbd-supported-completion-once.yml'

permissions:
  contents: write

concurrency:
  group: mlb-v8-bbd-supported-completion-once
  cancel-in-progress: true

env:
  REPORT_PATH: runtime_reports/mlb_v8_historical_bbs_backfill_latest.json
  HISTORICAL_STACK: parlay-platform-mlb-historical-optimizer
  TABLE_NAME: parlay_platform_snapshots
  PYTHONPATH: .:hello_world:scripts

jobs:
  complete-supported-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate completion runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            hello_world/bigballsdata_client.py \
            hello_world/mlb_v8_historical_bbs_prior_game_v1.py \
            scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py \
            scripts/publish_monotonic_json.py
          python -m pytest -q --tb=short \
            tests/unit/test_bigballsdata_historical_as_of.py \
            tests/unit/test_mlb_v8_historical_bbs_prior_game_v1.py \
            tests/unit/test_run_mlb_v8_historical_bbs_prior_game_backfill.py \
            tests/unit/test_publish_monotonic_json.py

      - name: Complete supported chronological BBD evidence
        env:
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
          BBS_API_SECRET_ARN: ${{ secrets.BBS_API_SECRET_ARN }}
        run: |
          set -euo pipefail
          test -n "${BBS_API_KEY:-}${BBS_API_SECRET_ARN:-}"
          mkdir -p runtime_reports
          rm -f /tmp/mlb-v8-bbd-completion.log /tmp/mlb-v8-bbd-last-success.json

          for batch in $(seq 1 7); do
            echo "Starting chronological completion batch ${batch}/7" | tee -a /tmp/mlb-v8-bbd-completion.log
            status=1
            for retry in 1 2 3; do
              rm -f "$REPORT_PATH"
              set +e
              python scripts/run_mlb_v8_historical_bbs_prior_game_backfill.py \
                --region "$AWS_REGION_VALUE" \
                --table-name "$TABLE_NAME" \
                --historical-stack "$HISTORICAL_STACK" \
                --batch-size 100 \
                --history-days 45 \
                --coverage-start 2026-03-01 \
                --start-tolerance-minutes 5 \
                --output "$REPORT_PATH" \
                2>&1 | tee -a /tmp/mlb-v8-bbd-completion.log
              status=${PIPESTATUS[0]}
              set -e
              test "$status" -eq 0 && break

              if python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['REPORT_PATH'])
          value=json.loads(path.read_text()) if path.exists() and path.stat().st_size else {}
          blockers=' '.join(str(item) for item in value.get('blockers') or [])
          raise SystemExit(0 if 'BBS_RATE_LIMITED' in blockers else 1)
          PY
              then
                delay=$((retry * 75))
                echo "Provider rate limited; retrying after ${delay}s." | tee -a /tmp/mlb-v8-bbd-completion.log
                sleep "$delay"
                continue
              fi
              break
            done

            test "$status" -eq 0
            cp "$REPORT_PATH" /tmp/mlb-v8-bbd-last-success.json
            read -r remaining new_eligible coverage < <(python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ['REPORT_PATH']).read_text())
          assert value.get('ok') is True, value
          assert not value.get('blockers'), value
          assert value.get('authority') == 'V8_HISTORICAL_BBS_SHADOW_ONLY', value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('automaticWagerAllowed') is False, value
          assert value.get('selectionUsedOutcomes') is False, value
          assert value.get('targetGameOutcomeUsed') is False, value
          assert value.get('sameDayResultsExcluded') is True, value
          print(
              int(value.get('remainingSupportedGameCount') or 0),
              int(value.get('newEligibleGameCount') or 0),
              float(value.get('supportedTrainingCoverage') or 0.0),
          )
          PY
            )
            echo "remaining_supported=${remaining} new_eligible=${new_eligible} supported_coverage=${coverage}" | tee -a /tmp/mlb-v8-bbd-completion.log
            test "$remaining" -eq 0 && break
            test "$new_eligible" -gt 0
            sleep 70
          done

          cp /tmp/mlb-v8-bbd-last-success.json "$REPORT_PATH"
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ['REPORT_PATH']).read_text())
          assert value.get('ok') is True, value
          assert not value.get('blockers'), value
          assert int(value.get('remainingSupportedGameCount') or -1) == 0, value
          assert int(value.get('eligibleGameCount') or 0) == int(value.get('supportedCanonicalGameCount') or -1), value
          assert float(value.get('supportedTrainingCoverage') or 0.0) == 1.0, value
          assert value.get('productionAuthorityChanged') is False, value
          assert value.get('automaticWagerAllowed') is False, value
          assert value.get('selectionUsedOutcomes') is False, value
          assert value.get('targetGameOutcomeUsed') is False, value
          assert value.get('sameDayResultsExcluded') is True, value
          PY

      - name: Publish completed evidence and remove installer
        run: |
          set -euo pipefail
          cp "$REPORT_PATH" /tmp/mlb-v8-bbd-completed.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mlb-v8-bbd-supported-completion origin/main
            mkdir -p runtime_reports
            python scripts/publish_monotonic_json.py \
              --candidate /tmp/mlb-v8-bbd-completed.json \
              --existing "$REPORT_PATH" \
              --output "$REPORT_PATH"
            git add "$REPORT_PATH"
            git rm -f .github/workflows/mlb-v8-bbd-supported-completion-once.yml
            git diff --cached --check
            git commit -m 'Complete V8 supported BBD learning cohort'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-v8-bbd-supported-completion-${{ github.run_id }}
          path: |
            runtime_reports/mlb_v8_historical_bbs_backfill_latest.json
            /tmp/mlb-v8-bbd-last-success.json
            /tmp/mlb-v8-bbd-completion.log
          retention-days: 90
          if-no-files-found: warn
