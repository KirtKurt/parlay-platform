name: MLB Historical V7 Selective Recovery

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_historical_feature_rematerialization_v1.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'hello_world/mlb_historical_v7_selective_objective_v1.py'
      - 'hello_world/mlb_historical_v7_selective_search_v2.py'
      - 'hello_world/mlb_historical_round_extension_v1.py'
      - 'hello_world/mlb_historical_derived_features_v1.py'
      - 'hello_world/mlb_odds_pattern_features_v1.py'
      - 'hello_world/mlb_historical_optimizer_entrypoint.py'
      - 'hello_world/mlb_historical_optimizer_handler.py'
      - 'tests/unit/test_mlb_historical_v7_selective_objective_v1.py'
      - 'tests/unit/test_mlb_historical_v7_selective_search_v2.py'
      - 'tests/unit/test_mlb_historical_v7_recovery_workflow.py'
      - 'mlb_historical_optimizer/**'
      - '.github/workflows/mlb-historical-v7-recovery.yml'

permissions:
  contents: write

concurrency:
  group: parlay-platform-mlb-historical-v7-selective-recovery
  cancel-in-progress: false

env:
  STACK_NAME: parlay-platform-mlb-historical-optimizer
  REPORT_PATH: runtime_reports/mlb_historical_v7_recovery_latest.json
  HISTORICAL_START_DATE: '2025-04-01'
  HISTORICAL_END_DATE: '2026-12-31'
  HISTORICAL_TARGET_GAMES: '1600'
  HISTORICAL_MAX_CREDITS: '300000'
  HISTORICAL_MAX_CANDIDATES: '25000'
  HISTORICAL_MAX_OPTIMIZATION_ROUNDS: '24'

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate V7 source, tests, and template
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/tmp/mlb-historical-aws-identity.json
          test -n "${ODDS_API_KEY_VALUE:-}"
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          PYTHONPATH=hello_world python -m py_compile \
            hello_world/mlb_historical_feature_rematerialization_v1.py \
            hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py \
            hello_world/mlb_historical_v7_selective_objective_v1.py \
            hello_world/mlb_historical_v7_selective_search_v2.py \
            hello_world/mlb_historical_round_extension_v1.py \
            hello_world/mlb_historical_derived_features_v1.py \
            hello_world/mlb_odds_pattern_features_v1.py \
            hello_world/mlb_historical_optimizer_entrypoint.py \
            hello_world/mlb_historical_optimizer_handler.py
          PYTHONPATH=hello_world python -m pytest -q --tb=short \
            tests/unit/test_mlb_historical_policy_v1.py \
            tests/unit/test_mlb_historical_daily_optimizer_v1.py \
            tests/unit/test_mlb_historical_optimizer_handler.py \
            tests/unit/test_mlb_historical_round_extension_v1.py \
            tests/unit/test_mlb_historical_read_api_contract.py \
            tests/unit/test_mlb_historical_optimizer_template.py \
            tests/unit/test_mlb_historical_competitive_schedule_filter.py \
            tests/unit/test_mlb_historical_v7_selective_objective_v1.py \
            tests/unit/test_mlb_historical_v7_selective_search_v2.py \
            tests/unit/test_mlb_historical_v7_recovery_workflow.py
          grep -Fq 'Handler: mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler' mlb_historical_optimizer/template.yaml
          grep -Fq "Default: '2026-12-31'" mlb_historical_optimizer/template.yaml
          grep -Fq 'Default: 300000' mlb_historical_optimizer/template.yaml
          grep -Fq 'Default: 24' mlb_historical_optimizer/template.yaml
          sam validate --lint --template-file mlb_historical_optimizer/template.yaml
          rm -rf .aws-sam-historical-v7
          sam build --no-cached --build-dir .aws-sam-historical-v7 --template-file mlb_historical_optimizer/template.yaml
          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_historical_optimizer_v7_recovery_entrypoint.py
          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_historical_v7_selective_search_v2.py

      - name: Deploy exact V7 source and verify runtime identity
        id: deployment
        continue-on-error: true
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -uo pipefail
          mkdir -p runtime_reports
          (
            set -euo pipefail
            for attempt in $(seq 1 80); do
              status=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION_VALUE" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo STACK_NOT_FOUND)
              case "$status" in
                STACK_NOT_FOUND|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE|IMPORT_ROLLBACK_COMPLETE) break ;;
                *_IN_PROGRESS) sleep 15 ;;
                *) echo "CloudFormation is not updateable: $status"; exit 1 ;;
              esac
              test "$attempt" != 80
            done

            sam deploy \
              --template-file .aws-sam-historical-v7/template.yaml \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION_VALUE" \
              --capabilities CAPABILITY_IAM \
              --resolve-s3 \
              --force-upload \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset \
              --parameter-overrides \
                "OddsApiKey=${ODDS_API_KEY_VALUE}" \
                'TargetSnapshotsTable=parlay_platform_snapshots' \
                "HistoricalStartDate=${HISTORICAL_START_DATE}" \
                "HistoricalEndDate=${HISTORICAL_END_DATE}" \
                "HistoricalTargetGames=${HISTORICAL_TARGET_GAMES}" \
                "HistoricalMaxCredits=${HISTORICAL_MAX_CREDITS}" \
                'HistoricalRequestsPerRun=20' \
                "HistoricalMaxCandidates=${HISTORICAL_MAX_CANDIDATES}" \
                "HistoricalMaxOptimizationRounds=${HISTORICAL_MAX_OPTIMIZATION_ROUNDS}" \
                'HistoricalFreshAuditIncrementGames=200' \
                'HistoricalRangeExtensionAuthorized=true' \
                "DeployGitSha=${GITHUB_SHA}"

            FUNCTION_NAME=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION_VALUE" --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" --output text)
            test -n "$FUNCTION_NAME"; test "$FUNCTION_NAME" != None
            aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --region "$AWS_REGION_VALUE" --output json > /tmp/mlb-historical-lambda-config.json
            FUNCTION_NAME="$FUNCTION_NAME" python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path('/tmp/mlb-historical-lambda-config.json').read_text())
          env=(value.get('Environment') or {}).get('Variables') or {}
          checks={
              'handler':value.get('Handler') == 'mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler',
              'deploySha':env.get('INQSI_DEPLOY_GIT_SHA') == os.environ['GITHUB_SHA'],
              'endDate':env.get('MLB_HISTORICAL_END_DATE') == '2026-12-31',
              'maximumCredits':env.get('MLB_HISTORICAL_MAX_CREDITS') == '300000',
              'maximumRounds':env.get('MLB_HISTORICAL_MAX_OPTIMIZATION_ROUNDS') == '24',
              'freshAuditIncrement':env.get('MLB_HISTORICAL_FRESH_AUDIT_INCREMENT_GAMES') == '200',
              'rangeExtensionAuthorized':env.get('MLB_HISTORICAL_RANGE_EXTENSION_AUTHORIZED') == 'true',
          }
          assert all(checks.values()), {'checks':checks,'environment':env}
          Path('/tmp/mlb-historical-runtime-identity.json').write_text(json.dumps({
              'functionName':os.environ['FUNCTION_NAME'],
              'handler':value.get('Handler'),
              'deployGitSha':env.get('INQSI_DEPLOY_GIT_SHA'),
              'endDate':env.get('MLB_HISTORICAL_END_DATE'),
              'maximumCredits':env.get('MLB_HISTORICAL_MAX_CREDITS'),
              'maximumOptimizationRounds':env.get('MLB_HISTORICAL_MAX_OPTIMIZATION_ROUNDS'),
              'freshAuditIncrementGames':env.get('MLB_HISTORICAL_FRESH_AUDIT_INCREMENT_GAMES'),
              'checks':checks,
          },indent=2,sort_keys=True)+'\n')
          PY

            aws lambda invoke --function-name "$FUNCTION_NAME" --region "$AWS_REGION_VALUE" --cli-read-timeout 900 --cli-binary-format raw-in-base64-out --payload '{"mode":"status","run":"v7_selective_v2_deployment_verification"}' /tmp/mlb-historical-status.json >/tmp/mlb-historical-invoke-meta.json
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          status=json.loads(Path('/tmp/mlb-historical-status.json').read_text())
          identity=json.loads(Path('/tmp/mlb-historical-runtime-identity.json').read_text())
          contract=status.get('supervisedShadow') or {}
          checks={
              'statusOk':status.get('ok') is True,
              'identityVerified':all((identity.get('checks') or {}).values()),
              'v7OddsOnly':contract.get('v7InputAuthority') == 'ODDS_ONLY',
              'pickPassEnabled':contract.get('pickPassEnabled') is True,
              'jointSearchEnabled':contract.get('jointPolicyThresholdReliabilitySearch') is True,
              'thresholdStabilityRequired':contract.get('thresholdStabilityRequired') is True,
              'productionAuthorityUnchanged':contract.get('productionAuthorityChanged') is False,
          }
          assert all(checks.values()), {'checks':checks,'status':status,'identity':identity}
          report={
              'proofType':'MLB_HISTORICAL_V7_SELECTIVE_DEPLOYMENT',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'jobStatus':'success',
              'sourceSha':os.environ['GITHUB_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'runtimeIdentity':identity,
              'status':status,
              'checks':checks,
              'blockers':[],
              'ok':True,
          }
          Path(os.environ['REPORT_PATH']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          ) 2>&1 | tee /tmp/mlb-historical-v7-selective-deploy.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Ensure durable deployment evidence exists
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p runtime_reports
          if test ! -s "$REPORT_PATH"; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/mlb-historical-v7-selective-deploy.log').read_text(errors='replace')[-12000:] if Path('/tmp/mlb-historical-v7-selective-deploy.log').exists() else ''
          secret=os.environ.get('ODDS_API_KEY_VALUE','')
          if secret: log=log.replace(secret,'[REDACTED]')
          Path(os.environ['REPORT_PATH']).write_text(json.dumps({
              'proofType':'MLB_HISTORICAL_V7_SELECTIVE_DEPLOYMENT',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'jobStatus':'failure',
              'deploymentOutcome':os.environ.get('DEPLOYMENT_OUTCOME'),
              'sourceSha':os.environ['GITHUB_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],
              'errorLogTail':log,
              'blockers':['deployment_verification_failed'],
              'ok':False,
          },indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$REPORT_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-historical-v7-selective-deployment-${{ github.run_id }}
          path: |
            runtime_reports/mlb_historical_v7_recovery_latest.json
            /tmp/mlb-historical-v7-selective-deploy.log
            /tmp/mlb-historical-runtime-identity.json
            /tmp/mlb-historical-lambda-config.json
            /tmp/mlb-historical-status.json
            /tmp/mlb-historical-aws-identity.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish durable deployment evidence
        if: always()
        run: |
          set -euo pipefail
          cp "$REPORT_PATH" /tmp/mlb-historical-v7-selective-proof.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            # The generated proof is safe in /tmp. Clean before switching
            # branches because main can advance during deployment verification.
            git reset --hard HEAD
            git clean -fd
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git checkout -B historical-v7-selective-proof refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            mkdir -p runtime_reports
            cp /tmp/mlb-historical-v7-selective-proof.json "$REPORT_PATH"
            git add "$REPORT_PATH"
            git diff --cached --quiet && exit 0
            git commit -m 'Publish MLB V7 selective deployment evidence'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce successful deployment
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('runtime_reports/mlb_historical_v7_recovery_latest.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('jobStatus') == 'success', value
          assert not value.get('blockers'), value
          checks=value.get('checks') or {}
          assert checks and all(checks.values()), value
          PY
