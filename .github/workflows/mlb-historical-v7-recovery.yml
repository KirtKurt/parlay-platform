name: MLB Historical V7 Recovery

"on":
  push:
    branches: [main]
    paths:
      - 'hello_world/mlb_historical_feature_rematerialization_v1.py'
      - 'hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py'
      - 'hello_world/mlb_historical_derived_features_v1.py'
      - 'hello_world/mlb_odds_pattern_features_v1.py'
      - 'hello_world/mlb_historical_optimizer_entrypoint.py'
      - 'mlb_historical_optimizer/**'
      - '.github/workflows/mlb-historical-v7-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parlay-platform-mlb-historical-recovery
  cancel-in-progress: false

env:
  HISTORICAL_START_DATE: '2025-04-01'
  HISTORICAL_END_DATE: '2025-10-31'
  HISTORICAL_TARGET_GAMES: '1600'
  HISTORICAL_MAX_CREDITS: '300000'
  HISTORICAL_MAX_CANDIDATES: '25000'

jobs:
  validate-and-deploy-historical-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Validate recovery source and AWS identity
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          test -n "${ODDS_API_KEY_VALUE:-}" || { echo '::error::Missing ODDS_API_KEY'; exit 1; }
          python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
          python -m py_compile \
            hello_world/mlb_historical_feature_rematerialization_v1.py \
            hello_world/mlb_historical_optimizer_v7_recovery_entrypoint.py \
            hello_world/mlb_historical_derived_features_v1.py \
            hello_world/mlb_odds_pattern_features_v1.py \
            hello_world/mlb_historical_optimizer_entrypoint.py \
            hello_world/mlb_historical_optimizer_handler.py
          python -m pytest -q \
            tests/unit/test_mlb_historical_policy_v1.py \
            tests/unit/test_mlb_historical_daily_optimizer_v1.py \
            tests/unit/test_mlb_historical_optimizer_handler.py \
            tests/unit/test_mlb_historical_read_api_contract.py
          grep -Fq 'Handler: mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler' mlb_historical_optimizer/template.yaml
          grep -Fq "Default: '2025-10-31'" mlb_historical_optimizer/template.yaml
          grep -Fq 'Default: 300000' mlb_historical_optimizer/template.yaml
          sam validate --lint --template-file mlb_historical_optimizer/template.yaml
      - name: Build historical optimizer cleanly
        run: |
          set -euo pipefail
          rm -rf .aws-sam-historical-v7
          sam build \
            --no-cached \
            --build-dir .aws-sam-historical-v7 \
            --template-file mlb_historical_optimizer/template.yaml
          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_historical_optimizer_v7_recovery_entrypoint.py
          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_historical_feature_rematerialization_v1.py
          test -f .aws-sam-historical-v7/HistoricalOptimizerFunction/mlb_odds_pattern_features_v1.py
      - name: Wait for historical stack updateability
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name parlay-platform-mlb-historical-optimizer \
              --region "${{ secrets.AWS_REGION }}" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || echo STACK_NOT_FOUND)
            case "$STATUS" in
              STACK_NOT_FOUND|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE|IMPORT_ROLLBACK_COMPLETE)
                echo "Historical stack is updateable: $STATUS"
                exit 0
                ;;
              *_IN_PROGRESS)
                sleep 15
                ;;
              *)
                echo "::error::Historical stack is not updateable: $STATUS"
                exit 1
                ;;
            esac
          done
          echo '::error::Timed out waiting for historical stack'
          exit 1
      - name: Deploy historical optimizer recovery only
        env:
          ODDS_API_KEY_VALUE: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          sam deploy \
            --template-file .aws-sam-historical-v7/template.yaml \
            --stack-name parlay-platform-mlb-historical-optimizer \
            --region "${{ secrets.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --force-upload \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "OddsApiKey=${ODDS_API_KEY_VALUE}" \
              "TargetSnapshotsTable=parlay_platform_snapshots" \
              "HistoricalStartDate=${HISTORICAL_START_DATE}" \
              "HistoricalEndDate=${HISTORICAL_END_DATE}" \
              "HistoricalTargetGames=${HISTORICAL_TARGET_GAMES}" \
              "HistoricalMaxCredits=${HISTORICAL_MAX_CREDITS}" \
              "HistoricalRequestsPerRun=20" \
              "HistoricalMaxCandidates=${HISTORICAL_MAX_CANDIDATES}" \
              "HistoricalMaxOptimizationRounds=6" \
              "HistoricalFreshAuditIncrementGames=250" \
              "HistoricalRangeExtensionAuthorized=true" \
              "DeployGitSha=${GITHUB_SHA}"
      - name: Prove deployed handler and start recovery
        id: recovery
        run: |
          set -euo pipefail
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name parlay-platform-mlb-historical-optimizer \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='HistoricalOptimizerFunctionName'].OutputValue" \
            --output text)
          test -n "$FUNCTION_NAME"
          test "$FUNCTION_NAME" != "None"
          CONFIG_HANDLER=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --query Handler --output text)
          test "$CONFIG_HANDLER" = 'mlb_historical_optimizer_v7_recovery_entrypoint.lambda_handler'
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"mode":"orchestrate","run":"mlb_historical_v7_recovery_deploy"}' \
            /tmp/mlb-historical-v7-recovery.json
          cat /tmp/mlb-historical-v7-recovery.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/mlb-historical-v7-recovery.json').read_text())
          if value.get('ok') is not True:
              raise SystemExit(f"recovery invocation failed: {value}")
          state=value.get('state') or {}
          status=str(value.get('status') or state.get('phase') or '')
          allowed={
              'REMATERIALIZING_FEATURES',
              'FEATURE_REMATERIALIZATION_COMPLETE',
              'BACKFILLING',
              'OPTIMIZING',
              'LEASE_HELD',
          }
          if status not in allowed:
              raise SystemExit(f'unexpected recovery status: {status}')
          if status in {'FEATURE_REMATERIALIZATION_COMPLETE','BACKFILLING','OPTIMIZING'}:
              if str(state.get('endDate') or '') < '2025-10-31':
                  raise SystemExit('expanded historical range is not active after rematerialization')
          if int(state.get('featureRematerializationPaidHistoricalCalls') or 0) != 0:
              raise SystemExit('rematerialization made paid historical calls')
          PY
          echo "function_name=$FUNCTION_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload recovery proof
        uses: actions/upload-artifact@v4
        with:
          name: mlb-historical-v7-recovery-${{ github.sha }}
          path: /tmp/mlb-historical-v7-recovery.json
          retention-days: 90
      - name: Publish durable recovery run evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          recovery_path=Path('/tmp/mlb-historical-v7-recovery.json')
          recovery=None
          if recovery_path.exists():
              try:
                  recovery=json.loads(recovery_path.read_text())
              except Exception as exc:
                  recovery={'parseError': f'{type(exc).__name__}:{exc}'}
          report={
              'proofType':'MLB_HISTORICAL_V7_RECOVERY_RUN',
              'createdAtUtc':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.environ['JOB_STATUS'],
              'sourceSha':os.environ['SOURCE_SHA'],
              'runId':os.environ['RUN_ID'],
              'runAttempt':os.environ['RUN_ATTEMPT'],
              'runUrl':os.environ['RUN_URL'],
              'recovery':recovery,
          }
          path=Path('runtime_reports/mlb_historical_v7_recovery_latest.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git add runtime_reports/mlb_historical_v7_recovery_latest.json
          git commit -m 'Publish MLB historical V7 recovery evidence' || exit 0
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
