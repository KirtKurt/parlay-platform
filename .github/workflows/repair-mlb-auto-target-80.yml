name: Repair MLB Auto 80 Percent Target

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mlb-auto-target-80.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mlb-auto-target-80
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair MLB-only target drift
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/deploy-mlb-auto-llm.yml'): [
                  ("TargetDailyAccuracy='0.70'", "TargetDailyAccuracy='0.80'"),
                  ("float(status.get('targetDailyAccuracy'))==0.70", "float(status.get('targetDailyAccuracy'))==0.80"),
              ],
              Path('mlb_auto_llm/handler.py'): [
                  ('MLB_AUTO_TARGET_DAILY_ACCURACY", "0.70"', 'MLB_AUTO_TARGET_DAILY_ACCURACY", "0.80"'),
              ],
              Path('.github/workflows/finalize-mlb-auto-production-once.yml'): [
                  ("TargetDailyAccuracy='0.70'", "TargetDailyAccuracy='0.80'"),
                  ("float(status.get('targetDailyAccuracy'))==0.70", "float(status.get('targetDailyAccuracy'))==0.80"),
              ],
          }

          changed=[]
          for path, pairs in replacements.items():
              text=path.read_text(encoding='utf-8')
              original=text
              for old,new in pairs:
                  text=text.replace(old,new)
              if text != original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No MLB target drift replacements were required; refusing unrelated commit')
          print('Changed MLB-only files:')
          print('\n'.join(changed))
          PY
          git diff --check
          grep -q "TargetDailyAccuracy='0.80'" .github/workflows/deploy-mlb-auto-llm.yml
          grep -q "targetDailyAccuracy'))==0.80" .github/workflows/deploy-mlb-auto-llm.yml
          grep -q 'MLB_AUTO_TARGET_DAILY_ACCURACY", "0.80"' mlb_auto_llm/handler.py

      - name: Commit repair to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-mlb-auto-llm.yml mlb_auto_llm/handler.py .github/workflows/finalize-mlb-auto-production-once.yml
          git commit -m 'Fix MLB Auto 80 percent target deployment drift'
          git push origin HEAD:main
