name: Trigger corrected MLB AUTO Bedrock model chain again

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-correct-mlb-auto-live-model-chain-again.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch active Bedrock model-chain correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run correct-mlb-auto-live-model-chain-now.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
