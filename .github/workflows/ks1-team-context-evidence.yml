name: KS1 retained training-admission evidence
on:
  pull_request:
    paths: ['.github/workflows/ks1-team-context-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect-retained-artifact:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/ks1-team-context-evidence-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Reproduce the predicates from the exact failed main run.
          ref: c056c50830daf9662b964e3b970084c930f9af28
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ks1/training-requirements.txt
      - name: Download the exact retained failure artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api repos/KirtKurt/parlay-platform/actions/artifacts/10382591161/zip
          > /tmp/ks1-failure-evidence.zip
      - name: Verify bytes and inspect source eligibility without fitting or source writes
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import zipfile
          from collections import Counter
          from pathlib import Path
          import pandas as pd
          from ks1.development import frozen_split
          from ks1.retrain_recent import team_context_masks

          body = Path('/tmp/ks1-failure-evidence.zip').read_bytes()
          sha = hashlib.sha256(body).hexdigest()
          if sha != 'a1cf2f547fdff5ddcd6e7be3cfed11be9b36242b61d9d16d3c11402063637aab':
              raise ValueError('retained diagnostic artifact checksum mismatch')
          with zipfile.ZipFile(io.BytesIO(body)) as archive:
              def read(name):
                  return json.loads(archive.read(name))
              frame = pd.read_parquet(io.BytesIO(archive.read('input_table.parquet')))
              manifest = read('qualification_holdout.json')
              train, heldout = frozen_split(frame, manifest)
              historical, frozen = team_context_masks(train)
              columns = ('lineup_bullpen_context_evidence', 'lineup_bullpen_history_status',
                         'historical_lineup_bullpen_context_status',
                         'pitcher_context_evidence', 'historical_pitcher_context_mode')
              states = {column: train[column].fillna('<missing>').value_counts().to_dict()
                        for column in columns}
              receipts = {}
              completeness = Counter()
              def inspect(value):
                  if isinstance(value, dict):
                      if {'bucket', 'key', 'sha256'} <= value.keys():
                          receipt = {key: value.get(key) for key in
                                     ('bucket', 'key', 'versionId', 'version_id', 'sha256',
                                      'complete_years', 'provider') if key in value}
                          receipts[json.dumps(receipt, sort_keys=True)] = receipt
                      if 'complete_years' in value:
                          completeness[json.dumps(value['complete_years'])] += 1
                      for child in value.values():
                          inspect(child)
                  elif isinstance(value, list):
                      for child in value:
                          inspect(child)
              for column in ('reconstructed_pitcher_context_proof',
                             'historical_lineup_bullpen_context_source'):
                  for value in train[column].dropna().unique():
                      inspect(json.loads(value))
              recovery = read('statcast_recovery_report.json')
              team = read('historical_team_context_report.json')
              coverage = read('historical_statcast_report.json')
              result = {
                  'artifact_sha256': sha,
                  'file_sha256': {name: hashlib.sha256(archive.read(name)).hexdigest()
                                 for name in archive.namelist() if not name.endswith('/')},
                  'rows': len(frame), 'frozen_holdout_games': len(heldout),
                  'frozen_holdout_hashes_verified': True, 'training_rows_before_admission': len(train),
                  'training_source_states': states,
                  'structural_historical_rows_without_inventory_check': int(historical.sum()),
                  'complete_frozen_rows': int(frozen.sum()),
                  'receipt_inventory_available': False,
                  'embedded_source_receipt_count': len(receipts),
                  'source_receipts_embedded_in_training_rows': list(receipts.values())[:10],
                  'embedded_complete_years': dict(completeness),
                  'team_context_report': {key: value for key, value in team.items() if key != 'errors'},
                  'team_context_errors': team.get('errors', [])[:10],
                  'statcast_report_keys': sorted(coverage),
                  'statcast_report': {key: coverage.get(key) for key in
                                      ('verified_physical_pitch_objects', 'verified_pitch_objects',
                                       'retained_pitch_rows', 'prediction_writes')},
                  'statcast_error_counts': dict(Counter(e.get('reason') for e in coverage.get('errors', []))),
                  'recovery': {'method': recovery.get('recovery_method'),
                               'recovered_dates': recovery.get('recovered_dates'),
                               'attempts': [{key: a.get(key) for key in ('date', 'reason', 'verified_artifact')}
                                            for a in recovery.get('attempts', [])]},
                  'read_only': True, 'provider_calls': 0, 'source_writes': 0,
                  'models_fitted': 0, 'qualification_run': False, 'serving_changes': 0,
              }
              print(json.dumps(result, indent=2))
          PY
