name: R7 PR601 five-failure diagnostic once

on:
  push:
    branches:
      - codex/mlb-valid-prelock-quarantine-v4-567
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused verification runtime
        run: python -m pip install --quiet 'boto3>=1.34,<2' 'pytest>=8,<9'
      - name: Reproduce and print exact failure authority
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: hello_world:tests/unit
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          from datetime import datetime, timezone

          import test_mlb_public_per_game_authority as public
          import test_mlb_canonical_final_labels_v1 as canonical
          import mlb_daily_per_game_lock_patch as per_game

          def print_json(label, value):
              print(f'===== {label} =====')
              print(json.dumps(value, indent=2, sort_keys=True, default=str))

          public.exact_contract.validate_exact_locked_row = lambda row: []
          public.immutable_storage.validate_canonical_stage_authority = lambda table, row: []

          locked = public._canonical_item(
              public.G1,
              public.G1['home_team'],
              'home',
              71,
          )
          assessment = public._playability_item(
              public.G1,
              locked,
              'T_MINUS_15',
              '2026-07-17T22:45:05+00:00',
              playable=True,
          )
          terminal = public._terminal_outcome_item(public.G2)
          engine = public._engine(
              [locked],
              current=[public._live(public.G1, public.G1['away_team'], 'away')],
              status_items=[assessment, terminal],
          )
          public._install(engine)
          public.coverage._now_utc = lambda: datetime(
              2026, 7, 18, 2, 1, tzinfo=timezone.utc
          )
          no_data_result = engine.predict_all(public.SLATE, store=False)
          print_json('NO_DATA_COUNTS', {
              key: no_data_result.get(key)
              for key in (
                  'gameCount',
                  'lockedPredictionCount',
                  'lockedStatusCount',
                  'noPredictionDataCount',
                  'missedLockValidPrelockQuarantineCount',
                  'invalidTerminalLifecycleRows',
                  'invalidLifecycleStatusRows',
                  'pendingCanonicalStatuses',
                  'winnerLifecycleOperationalDefect',
              )
          })
          print_json('NO_DATA_PREDICTIONS', no_data_result.get('predictions'))

          public.exact_contract.validate_exact_locked_row = lambda row: []
          public.immutable_storage.validate_canonical_stage_authority = lambda table, row: []
          locked = public._canonical_item(
              public.G1,
              public.G1['home_team'],
              'home',
              71,
          )
          quarantine = public._quarantine_terminal_outcome_item(public.G2)
          engine = public._engine(
              [locked],
              current=[
                  public._live(public.G1, public.G1['away_team'], 'away'),
                  {
                      **public._live(public.G2, public.G2['home_team'], 'home'),
                      'futureNestedModel': {
                          'winner': 'Hostile Selection Winner',
                          'probability': 0.99,
                      },
                  },
              ],
              status_items=[quarantine],
          )
          public._install(engine)
          public.coverage._now_utc = lambda: datetime(
              2026, 7, 18, 2, 1, tzinfo=timezone.utc
          )
          quarantine_result = engine.predict_all(public.SLATE, store=False)
          print_json('QUARANTINE_COUNTS', {
              key: quarantine_result.get(key)
              for key in (
                  'gameCount',
                  'lockedPredictionCount',
                  'lockedStatusCount',
                  'noPredictionDataCount',
                  'missedLockValidPrelockQuarantineCount',
                  'invalidTerminalLifecycleRows',
                  'invalidLifecycleStatusRows',
                  'pendingCanonicalStatuses',
                  'winnerLifecycleOperationalDefect',
              )
          })
          print_json('QUARANTINE_PREDICTIONS', quarantine_result.get('predictions'))

          first_game = canonical.official_game('700080')
          second_game = canonical.official_game('700081')
          first = canonical.quarantine_terminal_outcome(first_game)
          second = canonical.quarantine_terminal_outcome(second_game)
          first['officialGamePk'], second['officialGamePk'] = (
              second['officialGamePk'],
              first['officialGamePk'],
          )
          for item in (first, second):
              authority = item['valid_prelock_quarantine_authority']
              authority['candidateOfficialGamePk'] = item['officialGamePk']
              authority['stageOfficialGamePk'] = item['officialGamePk']
              canonical.refingerprint_quarantine_terminal(item)
          canonical.labels._query_partition = lambda table, pk, prefix: [first, second]
          canonical.labels.rolling_audit._verified_provider_alias_crosswalk = lambda slate: {}
          canonical.labels.per_game_lock._provider_manifest_authority_errors = lambda table, stored: []
          valid, rejected = canonical.labels._validated_terminal_outcomes(
              canonical.SLATE,
              [first_game, second_game],
          )
          print_json('SWAPPED_PK_VALID', valid)
          print_json('SWAPPED_PK_REJECTED', rejected)

          game_row = canonical.official_game('700082')
          outside = canonical.quarantine_terminal_outcome(game_row)
          outside['officialGamePk'] = '799999'
          outside['valid_prelock_quarantine_authority']['candidateOfficialGamePk'] = '799999'
          outside['valid_prelock_quarantine_authority']['stageOfficialGamePk'] = '799999'
          canonical.refingerprint_quarantine_terminal(outside)
          canonical.labels._query_partition = lambda table, pk, prefix: [outside]
          valid, rejected = canonical.labels._validated_terminal_outcomes(
              canonical.SLATE,
              [game_row],
          )
          print_json('OUTSIDE_PK_VALID', valid)
          print_json('OUTSIDE_PK_REJECTED', rejected)

          game = {
              'game_id': 'root',
              'officialGamePk': '822865',
              'commence_time': '2026-08-05T17:00:00+00:00',
          }
          scoring = [
              {
                  'games': [
                      {
                          'game_id': f'alias-{index}',
                          'officialGamePk': '822865',
                          'commence_time': '2026-08-05T17:00:00+00:00',
                      }
                  ]
              }
              for index in range(5)
          ]
          print_json(
              'THREE_SCORING_ALIASES',
              per_game._candidate_snapshot_aliases(game, scoring[:3]),
          )
          print_json(
              'FIVE_SCORING_ALIASES',
              per_game._candidate_snapshot_aliases(game, scoring),
          )
          PY
