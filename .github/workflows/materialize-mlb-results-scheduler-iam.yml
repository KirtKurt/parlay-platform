name: Materialize MLB results scheduler IAM

on:
  push:
    branches:
      - fix/mlb-results-scheduler-signal-ledger-iam-20260807
    paths:
      - "scripts/patch_template_mlb_security.py"
      - ".github/workflows/materialize-mlb-results-scheduler-iam.yml"
      - "template.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-mlb-results-scheduler-iam-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize canonical IAM transform
        run: |
          set -euo pipefail
          python scripts/patch_template_mlb_security.py
          python scripts/patch_template_mlb_security.py
          git diff --check
      - name: Commit canonical template only when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- template.yaml; then
            echo "template.yaml is already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template.yaml
          git commit -m "Materialize MLB results scheduler signal-ledger IAM"
          git push origin HEAD:${{ github.ref_name }}
