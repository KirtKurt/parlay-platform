name: Finalize MLB settlement and training repair now
# Recovery dispatch revision: 2026-08-24T21:31Z settlement-diagnostics-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-mlb-root-settlement-training-now.yml'
      - '.github/workflows/mlb-prospective-backlog-reconcile-v5-once.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: finalize-mlb-root-settlement-training-now
  cancel-in-progress: false

jobs:
  reconcile-train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Verify a repaired root deployment is active
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deploy_run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow deploy.yml \
            --branch main \
            --limit 50 \
            --json databaseId,status,conclusion,headSha,createdAt \
            --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' \
            | head -n 1)
          test -n "$deploy_run" || { echo '::error::No successful repaired root deployment exists'; exit 1; }
          request_id="finalizer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "Successful root deployment proof: $deploy_run"
          echo "Recovery request: $request_id"

      - name: Dispatch exact bounded reconciliation on main
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.source.outputs.request_id }}
        run: |
          set -euo pipefail
          gh workflow run mlb-prospective-backlog-reconcile-v5-once.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "request_id=${REQUEST_ID}"

      - name: Require reconciliation and accepted training rows
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.source.outputs.request_id }}
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 120); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow mlb-prospective-backlog-reconcile-v5-once.yml \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,displayTitle,createdAt \
              --jq '.[] | select(.displayTitle | contains("'"$REQUEST_ID"'")) | .databaseId' \
              | head -n 1)
            [ -z "$run_id" ] || break
            sleep 5
          done
          test -n "$run_id" || { echo '::error::Exact reconciliation dispatch was not observed'; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "Protected reconciliation and training passed: $run_id"
